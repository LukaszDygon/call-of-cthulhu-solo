  68:
    title: The Ledger
    extra:
      - requires: {note: TIARA}
        text: |
          A drawing pinned above the desk shows the stamp, an anchor and *M.R.Co.* The alloy figures match nothing you know, except a tiara in Newburyport.
      - requires: {investigator: agent}
        text: |
          "L.E." is the *Lady Ellen*, and the banks are the three you have watched since January. This book would hang half the people you're after.
      - text: |
          Somewhere in the mill a door bangs. Feet on a stair.
    text: |
      Green cloth, going back to 1919. *Ore received, river works, by night.* Every week, tons of it, from nowhere, paid for by nobody.

      Then the gold, sold: ingots to New York and Boston, deposits in Boston banks, and small, regular payments to someone called *L.E.* There is no mine within five hundred miles of Innsmouth.
    choices:
