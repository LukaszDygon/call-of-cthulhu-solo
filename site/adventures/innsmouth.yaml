  102:
    title: Cousin
    effects:
      - note: INVITED
    text: |
      She stops in front of you and looks up into your face, and for a long moment she doesn't say anything at all.

      "You're Leonie's," she says at last. "Aren't you? Abigail's grandson. You have the eyes." Her voice is low and soft. She puts out a gloved hand and touches your cheek, very lightly. "I'm Esther. Esther Marsh. We're cousins, after a fashion. Come in. You must come in, and have tea, and meet the family. Or come to supper. We have supper at nine."
    choices:
      - text: "Go in with her now."
        to: 105
      - text: "Say you'll come to supper."
        to: 103

  103:
    title: At Nine
    text: |
      "At nine, then," she says, and smiles, and goes in through the gate. The servant shuts it behind her. You stand on the pavement with the touch of her glove still cold on your cheek.
