  # --- The north quarter ------------------------------------------------------------------------------------------

  92:
    title: Across the Bridge
    effects:
      - note: NORTH
      - san: "0/1D3"
    extra:
      - requires: {note: WATCHED}
        text: |
          The children in the lane stop playing and follow you, at a distance, without a sound.
      - requires: {investigator: genealogist}
        text: |
          An old man on a doorstep half rises as you pass, and touches his cap to you. You have never seen him in your life.
      - text: |
          Up on the rim of the hill sags the poorhouse, half its windows boarded. Down by the river, the woman sees you, and her hands stop.
    text: |
      Over the main bridge, with the falls roaring below, the north quarter closes round you: fish sheds, narrow lanes, a smell you wade through.

      Here live the ones who don't go to the Square. An old woman on a step breathes through the creases in her neck. A man mending a lobster pot has webs to the first knuckle.

      By the river, behind a weathered gambrel house, a woman in a faded blue dress mends nets. A boy of about twelve fishes off the back steps, beside a moored dory.
    choices:
      - text: "Speak to the woman mending nets."
        to: 93
      - text: "Climb to the poorhouse on the rim."
        to: 44

  93:
    title: Ruth Eliot
    text: |
      She is about thirty-five, thin and sunburned, sleeves rolled to the elbow: an ordinary face, tired and sharp. Her eyes blink.

      "We don't get visitors," she says, low. "Go back over the bridge."

      The boy turns on the steps to look at you. He has a quick, clever face and his mother's mouth, and eyes a little too round, a little too far apart, and wet in a way eyes shouldn't be.

      "Jonas," she says. "Inside." He doesn't go.
    choices:
      - text: "Give her Martha's letter."
        requires: {item: letter}
        effects:
          - lose: letter
          - note: MARTHA
        to: 94
      - text: "Tell her Zadok Allen sent you."
        requires: {note: ZADOK}
        to: 96
      - text: "Tell her what you've read about Matt Eliot, and 1846."
        requires: {note: HISTORY}
        to: 96
      - text: "Win her over."
        roll: {skill: [Persuade, Charm, Psychology], success: 96, failure: 95}
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
