        requires: {no_note: UPPER}
        to: 99
      - text: "Climb Babson Street to the old railway station."
        requires: {no_note: STATION}
        to: 110
      - text: "Call at the Marsh house, as you were asked."
        requires: [{note: INVITED}, {no_note: PARLOUR}]
        to: 105

  34:
    title: Four O'Clock
    effects:
      - note: LATE
    extra:
      - requires: {note: WATCHED}
        text: |
          A man stands at the corner behind you. He stood at the last corner too. When you look, he is looking at the sea.
      - requires: {note: TRUCK}
        text: |
          Eddie's truck goes at six, from behind the store.
      - text: |
          Four hours to the bus.
    text: |
      The shadows have swung round. Men come up from the boats with baskets of fish so big they carry them two to a basket.

      Out beyond the breakwater the falling tide is uncovering the reef, black and glistening, longer every minute. Somewhere a woman sings a tune that goes down and down and never comes back up.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
