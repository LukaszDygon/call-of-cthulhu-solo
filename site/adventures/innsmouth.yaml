  # --- The Marsh house (the genealogist) --------------------------------------------------------------------------

  105:
    title: The Parlour
    effects:
      - note: PARLOUR
      - san: "1/1D6"
    extra:
      - requires: {note: ORNE}
        text: |
          You knew already. But it is different, seeing Leonie over a mantel in this house, with Obed's eyes in her face, and yours.
      - text: |
          "Your grandmother came home to us, in the end," Esther says. "Did they tell you that?"
    text: |
      Every blind in the Marsh house is drawn, and it smells of the sea. Esther Marsh, the daughter of the house, sits you by the cold fireplace in a parlour of old mahogany.

      Over the mantel hangs a captain in a blue coat, hard-jawed, with a heavy, hooded gaze. Obed Marsh. You know his eyes: you shave them every morning. Beside him, smaller, a dark-haired girl in an 1860s Paris gown wears the gold brooch from the photograph in your pocket.

      "Leonie," says Esther. "Captain Obed's youngest. My great-aunt, and your great-grandmother." Her fingers on the teapot are oddly joined. "Forgive the dark. Father can't bear the light."

      Above you, a floorboard creaks under a great weight.
    choices:
      - text: "Ask her what she means."
        to: 106
      - text: "Ask to see the rest of the house."
        to: 107
      - text: "Make your excuses, and leave."
        to: 108

  106:
    title: Abigail
    effects:
      - note: ORNE
      - san: "1/1D6"
    text: |
      "She came to Kingsport in 1919, to see her Arkham cousins," says Esther, "and one night she walked down into the sea. They think she drowned. She swam north for two days and came home to us, and went down to her mother, and her mother's mother. They're all under the reef. She's very happy."

      You remember the telegram, and your mother crying in the kitchen in Toledo, and the empty coffin.

      "It comes to all of us, wherever we are," Esther says gently. "It's coming to you." Her cold hand covers yours. "Stay to supper."
    choices:
      - text: "Stay to supper, as she asks."
        to: 109
      - text: "Leave, now."
        to: 108

  107:
    title: Upstairs
    effects:
      - gain: gold
    text: |
      On the landing, behind a shut door, something breathes: slow, wet, enormous. "Father," says Esther, and doesn't stop.

      She shows you a long, dim room of glass cases full of the sea's pale gold: tiaras, collars, chains. She takes out an armlet and slips it over your wrist. "Leonie's. It should be yours."

      It is cold, and then it isn't.
    choices:
      - text: "Thank her, and take your leave."
        to: 108

  108:
    title: The Green Door
    text: |
      Esther sees you to the door herself. "You'll come back," she says. Not a question. The door shuts behind you, and you are out in the hot, bright street, blinking.
    choices:
      - text: "Walk on into the town."
