    text: |
      You climb down a ladder slick with weed, into the green half-light under the old Marsh wharf, where the piles stand in the water like the legs of a great dead animal.

      The knocking is a dory: a sound, broad little boat, tied to a pile with a good rope, knocking gently against the wood as the swell lifts it. Its oars are lashed inside. It is half full of rainwater, but the planks are tight and the paint is not a year old.

      Somebody keeps it here, and keeps it well, where nobody on the wharf would see it.
