      The poorhouse sags on the rim of the hill above the fish sheds, half its windows boarded, chickens in the yard. A woman with the look shells peas on the step. On an upturned bucket sits a very old man with a white beard stained yellow round the mouth.

      "That's Zadok Allen," says the woman. "Ninety-six. He drinks. Don't give him none."
