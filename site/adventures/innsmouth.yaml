  # --- Eddie's truck ----------------------------------------------------------------------------------------------

  114:
    title: The Six O'Clock
    effects:
      - note: RODE
    extra:
      - requires: {note: WATCHED}
        text: |
          A long black car with curtained windows pulls out after you, and follows a hundred yards behind, all the way to the edge of the marsh. Then it stops in the middle of the road, and sits there, and gets smaller.
      - text: |
          Behind you, Innsmouth goes down into the marsh, roofs and steeples and the reef beyond, until it is only a smudge, and then not even that.
    text: |
      You get behind the First National as an old Reo truck is backing into the alley among the empty crates, with a sour man at the wheel.

      Eddie comes out with his apron off and his cap on, and sees you, and something in his face lets go. "Get in the back," he says. "Under the tarp. Don't sit up till I say."

      You lie among empty milk crates under a tarpaulin that smells of cabbage, and the truck bounces out of town by the Ipswich road. Once it slows. Voices. A long pause. Then it goes on.

      After a while Eddie bangs on the cab wall, and you sit up. The marsh is gold in the evening light, wide and empty and clean, and the air coming over the tailgate smells of nothing but salt and grass.
    choices:
      - text: "Ride on to Ipswich."
        to: 115

  115:
    title: Ipswich
    effects:
      - note: IPSWICH
    text: |
      The truck sets you down on the green at Ipswich a little after seven. There are elms, and white houses, and a church with a clock that tells the right time. A woman is calling her children in to supper. A policeman walks past with his thumbs in his belt, and nods to you.

      Eddie shakes your hand hard. "You were lucky," he says. "You don't know how lucky." He doesn't go to his lodgings. He stands with you on the green, twisting his cap, waiting to see what you'll do.

      You stand on the green in the long evening light. Twelve miles north, the boats will be going out to the reef at moonrise. You have whatever you brought out with you.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Go home."
        to: 226
  # ===================================================================== ACT THREE: THE NIGHT
  # ----------------------------------------------------- Eight o'clock
  116:
    title: Eight O'Clock
    effects:
      - unnote: NOON
      - unnote: AFTERNOON
      - unnote: LATE
      - unnote: EVENING
    text: |
      You come into the Square at a quarter to eight.

      The light has gone gold and long. It lies across the cobbles in bars between the shadows of the big yellow hotel, the Gilman House, and the shuttered shops, and every west-facing window burns with it, as if the town were on fire inside. Gulls stand along the hotel's cupola. Down the hill the tide is out, and the smell of the flats comes up the street like breath.

      Joe Sargent's bus stands at the Gilman House steps, grey and patient, with its door folded open.

      The Square is not empty. It has been nearly empty all day, and now it is not. People stand in the doorways along its sides: in the door of the drug store that never opened, under the arch of the refinery office, on the chairs outside the fire station. Men in work clothes. Women in shawls, though the evening is warm. A boy of ten or so, holding a fistful of his mother's skirt. None of them is talking. None of them is going anywhere. They are simply there, the way the gulls are there, and their faces are turned toward the bus, and toward you.

      You catch yourself waiting for one of them to blink. None of them does.

      Out past the breakwater, Devil Reef has come up black out of the falling sea, and something on it catches the last of the sun.
    extra:
      - requires: [{note: WATCHED}, {no_note: OATH}]
        text: |
          The bus's hood is up. Joe Sargent stands beside it, wiping his hands on a rag that was never clean. He doesn't look at the engine. He looks at you.

          "Engine trouble," he says. "No bus till mornin'."

          On the Gilman House steps the night clerk has come out to take the evening air. He has a room key in his hand, on a brass tag, and he holds it up so that you can see it.

          "Room's ready," he says.
      - requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        text: |
          The engine is running. It idles with a wet, uneven cough, and blue smoke drifts out from under the bus and hangs in the gold light. Joe Sargent sits at the wheel with his hands at ten and two, and watches you in his long mirror, and waits.
      - requires: [{note: WATCHED}, {note: OATH}]
        text: |
          The people in the doorways look at you, and then at one another, and something passes between them that is not words. You know what they know. You swore on the green, and a sworn member of the Order comes and goes as they please. Whatever else you have done today, the oath holds.
      - requires: [{investigator: genealogist}, {note: INVITED}]
        text: |
          Behind the bus, at the corner of Paine Street, a long black car waits with its engine running and its rear blinds drawn. The back door stands open. Nobody gets out. Nobody needs to. You know whose car it is, the way you know your own name.
      - text: |
          The sun touches the hills behind the town. Up on the green, a bell begins to ring, slowly, as if it has all the time in the world.
    choices:
      - text: "Climb aboard."
        requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        to: 122
      - text: "Let it go without you. You're not finished here."
        requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        to: 118
      - text: "Turn away from the bus."
        requires: [{note: WATCHED}, {no_note: OATH}]
        to: 117
      - text: "Cuff the driver to his own rail, and drive the bus out yourself."
        requires: [{item: handcuffs}, {note: WATCHED}, {no_note: OATH}]
        to: 119
      - text: "Get into the black car."
        requires: [{investigator: genealogist}, {note: INVITED}]
        to: 186

  117:
    title: Room's Ready
    text: |
      You walk away from the bus. Behind you the hood comes down with a bang, and Joe Sargent climbs back into his seat and sits there with the engine off, looking at nothing.

      The people in the doorways don't move. They don't need to. There is only one road out of the Square that isn't watched by somebody, and you can't see which one it is.

      The night clerk comes down the Gilman House steps, slowly, and holds out the key. It hangs from a brass tag the size of your palm. *428*.

      "Top floor," he says. "Back. Quiet." His eyes are round and pale and patient. "Ye'll want to be indoors, after dark."

      The sun goes down behind the marsh. Up on the green, the bell stops.
    choices:
      - text: "Take the key."
        to: 129
      - text: "Walk away from the Square, and leave him holding it."
        to: 128

  118:
    title: The Bus Goes
    text: |
      You stand back. Joe Sargent watches you in his mirror for a long moment. Then the door folds shut, and the bus coughs and lurches and goes out of the Square, west, up the hill, and over it, and the sound of it goes on for a long time after it has gone.

      Then it is quiet.

      All round the Square, in the doorways, faces turn toward you. Not quickly. All together, the way a field of grass turns in the wind.

      You are the only stranger left in Innsmouth.
    choices:
      - text: "Walk out of the Square, as the sun goes down."
        to: 128

  119:
    title: The Driver's Rail
    text: |
      You climb the step as if you mean to argue with him. Joe Sargent turns his head. Before he has finished turning it, one cuff is round his wrist and the other is round the chrome rail beside the wheel, and the click is very loud in the Square.

      He looks at the cuff. He doesn't pull at it. He looks at you, with those wet, unblinking eyes, and something like a smile moves under the grey skin of his face.

      The doorways empty. Not fast. The people in them simply step down into the Square, all at once, and begin to walk toward the bus.

      You drop off the step and throw up the hood. You have been under the hood of every bootlegger's truck in Suffolk County, and it takes you five seconds to see it: the lead from the coil, pulled clean out of its socket and left hanging, as neat as a cut thread.
    choices:
      - text: "Fix it, fast."
        roll: {skill: [Mechanical Repair, Drive Auto], success: 121, failure: 120}
      - text: "Leave him cuffed to his rail, and run."
        effects: [{lose: handcuffs}, {note: RAN}]
        to: 128

  120:
    title: The Crowd
    effects:
      - lose: handcuffs
    text: |
      The lead won't seat. When you look up from the engine there are hands on the fender, on the hood, on your sleeves: cold hands, too many of them, smelling of the harbour. Somebody takes the key off your watch chain and lets Joe Sargent go.
    choices:
      - text: "Go with them. There is nothing else to do."
        to: 194

  121:
    title: Joe Sargent's Bus
    effects:
      - note: PRISONER
      - note: ARKHAM
    text: |
      The lead goes home. You slam the hood, swing into the driver's seat beside your prisoner, and stand on the starter. The engine coughs, catches and roars, and the people in the Square stop walking.

      You take the bus round the Square with the gears screaming and out along the road west, past houses with their doors standing open and nobody in them, past the last of the town, onto the causeway over the marsh. The marsh opens out on either side, flat and silver and endless under a sky the colour of a bruise.

      Joe Sargent rides beside you with his wrist on the rail. He doesn't struggle. He doesn't speak. After a mile he begins to hum, low in his throat, the same six notes round and round, a tune with no beginning.

      A car comes up behind you with no lights. It sits on your tail for three miles, close enough that you can count four heads in it, and none of them moves. At a crossroads in the marsh, where a weathered sign points to Rowley and to Arkham, it slows, and stops, and sits there in the road, and lets you go.

      You drive into Arkham at half past nine, down streets with gas lamps and people walking dogs, and you pull Joe Sargent's bus up outside police headquarters on the wrong side of the street with your hand on the horn.

      Joe Sargent stops humming. He looks at the lit doorway, and at the desk sergeant coming down the steps with his mouth open, and then at you.

      "Ye'll have to let me go home sometime," he says. It is the most he has said all day.
    choices:
      - text: "Walk him inside, and start talking."
        to: 224

  122:
    title: The Last Bus
    text: |
      You climb aboard. The door folds shut behind you with a sigh of old rubber, and you take the seat behind the driver, because it is the one nearest the door.

      Joe Sargent puts the bus in gear. The people in the doorways watch you go. They don't wave. One of them, an old woman in a shawl, lifts her hand halfway, the way you would to someone you expect to see again.

      Out along the road west, past the last houses, up a long rise. At the top you turn in your seat. Innsmouth lies in its valley in the last of the light: the three steeples, the pillared hall, the black cut of the river, the sagging roofs, and the sea beyond, going violet. Down on the wharves, someone has lit a lantern. Then another.

      The road runs down off the rise into the marsh, and the town is gone.
    choices:
      - text: "Ride on, into the marsh."
        to: 123

  123:
    title: The Marsh Road
    text: |
      For an hour there is nothing but the marsh, flat and grey, with creeks shining in it like knife blades, and the sky going from violet to black, and the bus rattling through it all behind its one good headlamp. Joe Sargent drives with his hands at ten and two. He doesn't speak. He doesn't turn his head.

      But whenever you look up, you find his eyes in the long mirror over the windshield, wet and pale and fixed on you. You look away. You look back. They are still there.

      Then, in the last of the marsh, the moon begins to come up behind you out of the sea, a night past full, red as a coal. And there, with no house and no light anywhere, the bus slows, and stops. Joe Sargent sets the brake. He opens the door, and climbs down, and walks away from the road into the dark, toward the sea, without a word. The engine idles. The headlamp shines on nothing but grass.
    choices:
      - text: "Stay in your seat, and wait."
        to: 127
      - text: "Get down, and go after him."
        to: 124

  124:
    title: In the Creek
    effects:
      - san: "1/1D4"
    text: |
      You climb down. The marsh is loud with frogs. You follow the sound of his boots in the wet grass, and then the sound stops.

      He is standing in a creek up to his knees, facing the sea, with the red moon on the water in front of him. His head is tipped back. He is making a sound, low and wet, in his throat. Not a song. Something older than songs.

      Far off, out over the marsh, toward the sea, something answers.

      He stops. He turns his head, slowly, and looks at you, and his eyes catch the moon like a cat's. Then he wades out of the creek, and walks past you without a word, faster than you would think, and climbs back into his seat.

      The door is still open. The bus begins to roll.
    choices:
      - text: "Run for it."
        roll: {skill: [DEX, Jump], success: 125, failure: 126}

  125:
    title: The Step
    text: |
      You catch the rail and swing yourself up onto the step as the bus gathers speed, and the door folds shut behind you, and Joe Sargent drives on as if nothing had happened at all.
    choices:
      - text: "Sit down, and don't get up again."
        to: 127

  126:
    title: Tail Lights
    effects:
      - san: "0/1D3"
    text: |
      Your foot goes into a creek to the knee, and by the time you have it out the bus is fifty yards up the road, and then a hundred, its one red tail lamp swaying away into the dark. It doesn't stop. You didn't think it would.

      Then you are alone in the middle of the salt marsh, under the moon, with the frogs.

      And out toward the sea, the thing that answered him answers again. Closer.
    choices:
      - text: "Get off the road, and away from whatever that is."
        to: 214

  127:
    title: Arkham
    effects:
      - note: ARKHAM
    text: |
      He drives on. You never once see him blink, and after a while you stop looking, and sit with your hands in your lap, and count the telegraph poles.

      The lights of Arkham come up out of the dark at half past nine: gas lamps, a college tower, a drugstore window with a girl in it drinking a soda through a straw. Ordinary things. You could weep at them.

      The bus stops. The door folds open.
    extra:
      - requires: {investigator: genealogist}
        text: |
          As you step down, Joe Sargent speaks for the only time on the journey. He doesn't turn round. He says it to the mirror.

          "Ye'll be back," he says. "Your kind always comes back."
      - requires: {note: OATH}
        text: |
          As you pass him, Joe Sargent touches two fingers to the peak of his cap. It is the way you will be greeted, you understand, for the rest of your life, by people you have never met, in harbour towns up and down this coast.
      - text: |
          You stand on the pavement in the warm night with the bus pulling away behind you and the whole of Innsmouth in your head, and you have to decide what to do with it.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Find a hotel, and try to forget it."
        to: 227

  128:
    title: Dusk
    text: |
      It is a quarter past eight, and Innsmouth closes like a hand.

      You hear it before you see it. Doors, all over town: the slam of a shed, the thud of a bar dropping into its brackets, shutters folding to, far off and close at hand. Then a silence so complete that you can hear the river talking to itself under the bridge.

      All round the Square the doorways empty, one by one. The Gilman House has one light in its lobby, yellow behind dirty glass.

      Down on the waterfront it is different. Lanterns are moving down there, a long string of them, bobbing down Water Street toward the wharves. You hear oars knocking in rowlocks, and voices, low and thick, and a sound like many people walking barefoot on wet stone. Boats are being made ready.

      Out past the breakwater the sea has gone red with the last of the sky. Devil Reef lies across it, long and black and bare, like something that has surfaced to breathe.

      The moon isn't up yet. When it comes, it will come up out of the sea behind the reef, one night past full.
    extra:
      - requires: [{note: WATCHED}, {no_note: OATH}, {no_note: RAN}]
        before: true
        text: |
          The bus stands dead at the Gilman House steps, and nobody goes near it. The night clerk stays on the hotel steps a while longer with his brass key, watching which way you go.
      - requires: {note: RAN}
        before: true
        text: |
          Behind you the crowd has closed round the bus like water round a stone. Joe Sargent sits at the wheel with his wrist still cuffed to the rail, and watches which way you go.
      - requires: {note: ZADOK}
        text: |
          Zadok told you what comes up out of the water when the moon does. You find you are listening for it already.
      - text: |
          Behind you, the lobby light of the Gilman House flickers, as if somebody has walked past it. You have an hour, perhaps a little more. Whatever you are going to do tonight, you had better choose it now.
    choices:
      - text: "Take a room at the Gilman House, and lock the door."
        to: 129
      - text: "Go to Ruth Eliot's back door."
        requires: {note: ELIOT}
        to: 148
      - text: "Go up to the white house on Washington Street, where the family wants you."
        requires: {note: INVITED}
        to: 186
      - text: "Hide on the old Marsh wharf until Shea comes at midnight."
        requires: {note: BOAT}
        to: 159
      - text: "Find the dory under the old Marsh wharf."
        requires: {note: DORY}
        to: 161
      - text: "Get into the Order's hall on the green while they're all out at the reef."
        requires: {any: [{note: SEADOOR}, {item: robe}, {note: OATH}]}
        to: 176
      - text: "Walk out of town now, before the moon is up."
        to: 190

  # ----------------------------------------------------- The Gilman House
  129:
    title: Room 428
    text: |
      The night clerk takes your money without counting it and turns the register round for you to sign. He has the look worse than anyone you have seen today: a head as narrow as a hatchet, eyes so wide-set and pale you can't tell which of them is looking at you. His collar is buttoned to the chin. Above it, on either side of his throat, the skin lies in long soft folds, like the gills of a mushroom.

      "Four twenty-eight," he says, and taps the brass tag. "Top floor. Back."

      The stairs creak. The corridors smell of damp plaster and of something under it, sweetish, like a fish market at the end of a hot day. Room 428 is small and clean and bare: an iron bed, a washstand, a chair, a window. There are two doors besides the one you came in by, one in each side wall, connecting to the rooms on either side, 426 on the left and 430 on the right. Both are bolted on your side.

      Your own door has no bolt.

      There was one. You can see where: four screw holes in the wood, fresh and pale, and a darker oblong of paint where the plate has been taken off. Somebody unscrewed it today. You look at the holes for a long time. Then you wedge the chair under the knob.

      The window looks down into a courtyard and out over the roofs of the block. The nearest roof is a floor below yours, flat and tarred, the top of the long building that runs down the side street toward the fire station. Beyond it the town falls away in tiers of gables and chimneys to the river, and beyond the river, the sea.

      At half past nine a bell begins on the green. The moon comes up out of the sea behind the reef, enormous, the colour of a peach. Boats put out from the waterfront, a dozen or more, with lanterns in their bows, and row away across the silver toward the reef, and the singing comes back over the water, thin and high and very far away.

      The hotel is quiet. Not empty. Quiet.
    choices:
      - text: "Sit up in the dark, dressed, and wait."
        to: 130
      - text: "Draw the old sign on every door of the room with the washstand soap."
        requires: {any: [{note: SIGN}, {item: library-notes}]}
        effects: [{note: WARDED}]
        to: 130
      - text: "Set the old sign stone on the floor in the middle of the room."
        requires: {item: sign-stone}
        effects: [{note: WARDED}, {note: SETSTONE}]
        to: 130

  130:
    title: The Long Hours
    text: |
      Ten o'clock. Eleven. You sit on the bed in the dark with your back to the wall and your boots on, and listen.

      The singing comes and goes over the water. Sometimes it swells, as if a great many voices have joined it, and the window glass hums in its frame. Sometimes it stops altogether, and the silence is worse.

      A little after eleven, somebody walks along the corridor outside, slowly, all the way to the end, and back. They stop at your door for the length of a breath. Then they go on.

      At half past, in the room on your left, a bed creaks, as if someone heavy has sat down on it. Nobody came along the corridor to that room. You would have heard them.

      The moon climbs. Its light comes in at the window and lies across the floor in a long pale square, and moves, very slowly, toward the door.
    extra:
      - requires: [{note: WARDED}, {note: SETSTONE}]
        text: |
          The stone lies on the floorboards in the moonlight, grey-green, the star cut in it full of shadow. You find you can't stop looking at it, the way you'd keep your eye on a candle in a draught.
      - requires: [{note: WARDED}, {no_note: SETSTONE}]
        text: |
          The sign on the door shows faint and pale in the moonlight. You find you can't stop looking at it, the way you'd keep your eye on a candle in a draught.
      - text: |
          Your watch says a quarter to one. Out on the reef, the singing rises to a long, high note, and holds it, and stops.
    choices:
      - text: "Keep waiting."
        to: 131

  131:
    title: The Doorknob
    effects:
      - san: "1/1D6"
    text: |
      You don't mean to sleep, and you don't.

      A little before one, the singing on the reef stops. You hear the boats come back: oars, voices, hulls knocking against the wharves. Then nothing for a long time. Then, four floors below you, the street door of the Gilman House opens and closes, and opens and closes, and opens and closes again.

      Footsteps on the stairs. Not one pair. Several, climbing slowly, with a soft slapping sound, as if whoever is climbing has taken off their shoes and their feet are wet. The second floor. The third. They don't hurry. They don't need to.

      The fourth.

      They stop outside your door.

      For a long moment nothing happens at all. You can hear breathing out there, thick and bubbling, and a smell comes in under the door, the smell of the bottom of a harbour at low tide.

      Then the doorknob turns.

      It turns softly, all the way round, and holds there, and the door leans against the chair. A key scrapes in the lock, and the lock gives. The chair holds. Then voices, low, in a croaking tongue that has the shape of speech and almost none of its sounds.
    extra:
      - requires: {investigator: genealogist}
        text: |
          And one voice, closer to the keyhole than the rest, speaking English, soft and coaxing, the way you would speak to a frightened horse.

          "Come home, cousin," it says. "Come along home. Nobody'll hurt ye. There's family waitin'."
      - requires: {note: WARDED}
        text: |
          Then the breathing catches. It turns to a hiss, and backs away from the door the way a dog backs away from a fire. They have seen the sign, or smelled it, or felt it through the wood. The knob springs back. For a long time there is only hissing, and the shuffle of wet feet, and a low, furious croaking that goes on and on.
      - requires: [{note: WATCHED}, {investigator: [agent, antiquarian, reporter]}]
        text: |
          Someone out there says a word you know. It is the name you wrote in the register downstairs.
      - text: |
          Then the footsteps move off along the hall to the left, toward 426. You hear its door open, and wet feet cross its floor toward the connecting door in your wall.
    choices:
      - text: "Go through the connecting door to 430, and out of its window."
        to: 133
      - text: "Brace the door, and hold it."
        requires: {no_note: WARDED}
        to: 139
      - text: "Stay where you are, behind the sign."
        requires: {note: WARDED}
        to: 141
      - text: "Pull on the grey robe, open the door, and walk out among them."
        requires: {item: robe}
        roll: {skill: [Stealth, POW], success: 132, failure: 194}
      - text: "Open the door, and see who's there."
        requires: [{investigator: [agent, antiquarian, reporter]}, {no_note: WARDED}]
        to: 142
      - text: "Open the door to them."
        requires: {investigator: genealogist}
        to: 189

  132:
    title: One of Them
    text: |
      You pull the grey robe over your head. It is still damp. It smells of the sea, and of someone else. You put up the hood, kick the chair away, and open the door.

      The corridor is full of them. Six, eight, more on the stairs, lit from below by a lantern somebody holds on the landing. Robes, bare grey feet, faces you don't look at. They turn their heads toward your door all together, the way fish turn.

      You keep your head down. You let your shoulders round and your feet drag, the way you have watched them walk all day, and you step out among them.

      They make room for you. Nobody looks under the hood. You shuffle down the corridor with them and down the back stairs, past a kitchen with a cold stove, and out through a yard door into the moonlight.
    extra:
      - requires: {note: SETSTONE}
        before: true
        text: |
          You scoop Matt Eliot's stone off the floor and into your pocket before you touch the door.
      - text: |
          Behind you, the yard door bangs shut.
    choices:
      - text: "Slip away from them at the first corner."
        effects: [{unnote: SETSTONE}]
        to: 144

  133:
    title: Room 430
    text: |
      You draw the bolt on the right-hand door. It doesn't move: it is locked from the far side too, and swollen in its frame with the damp of a hundred summers.

      Behind you, in 426, something has begun working at the other connecting door. It doesn't knock. It pushes, steadily, and the old wood groans.
    extra:
      - requires: {note: SETSTONE}
        before: true
        text: |
          You snatch Matt Eliot's stone up off the floor as you go.
      - text: |
          There is no time to be careful.
    choices:
      - text: "Get it open, whatever it takes."
        effects: [{unnote: SETSTONE}]
        roll: {skill: [STR, Locksmith], success: 135, failure: 134}

  134:
    title: Splinters
    effects:
      - hp: "-1D3"
    text: |
      The lock won't give, so the frame has to. You hit it with your shoulder, twice, three times, and on the fourth it bursts inward in a spray of splinters. The noise goes through the whole hotel like a gunshot. Behind you, the pushing stops. Feet start to run.
    choices:
      - text: "Go through, and make for the window."
        to: 135

  135:
    title: The Roof
    text: |
      Room 430 is the twin of yours, empty, the bed stripped to its ticking. The window is stiff, but it goes up.

      Cool air, the smell of the sea, and the whole town under the moon.

      You have never seen anything so beautiful or so wrong. The moon stands high over the harbour, white now, and Innsmouth lies silver and black beneath it: the gambrel roofs stepping down to the river, the three steeples, the pillared hall pale on its green, the wharves, the long finger of the breakwater, and the sea laid out like hammered tin all the way to Devil Reef. And everywhere, in every street, lanterns. They move along the waterfront in strings. They cluster on the green. They go in and out of the lanes across the river, slowly, house by house. Two of them are crossing the Square toward the hotel's front door.

      Directly below the window, a full storey down, is the flat roof of the next building, tarred, with a low parapet and a skylight. Between the hotel wall and the parapet there is a gap. Not wide: a yard, perhaps. Below the gap, a long drop into a black alley.

      Behind you, in your own room, a door gives with a crack like a breaking bone.

      You climb out onto the sill.
    choices:
      - text: "Jump."
        roll: {skill: [Jump, Climb, DEX], success: 136, failure: 137}

  136:
    title: Tar Paper
    text: |
      You land on hands and knees on the tar paper, roll, and fetch up against the skylight frame. Nothing broken. Above you, a head leans out of the window of 430, narrow and grey in the moonlight, and turns this way and that. It doesn't look down. You lie still until it goes back in.
    choices:
      - text: "Get in through the skylight."
        to: 138

  137:
    title: The Gutter
    effects:
      - hp: "-1D6"
    text: |
      Your foot skids on the sill. You hit the parapet with your chest, go over backward into the gap, and catch the gutter with both hands. It holds. You haul yourself up over the parapet and lie on the tar paper, bleeding from both palms.
    choices:
      - text: "Get in through the skylight."
        to: 138

  138:
    title: The Empty House
    text: |
      The skylight's glass is long gone. You lower yourself through into an attic of pigeon dirt and broken chairs, and find a stair.

      The building is empty, and has been for years. The treads are soft with rot; you keep to the wall side, where the nails are. Rats run ahead of you, squealing. On the floor below, a door stands open on a room where somebody once lived: a bed, a chair, a calendar for 1911, and on the floor beside the bed, a tin bath full of black water with a skin on it. You don't look into the water.

      On the ground floor the front door hangs by one hinge. Beyond it is a quiet street of tall old houses behind dead gardens, silver under the moon. A sign on the corner post says WASHINGTON ST.

      The lanterns are a block away, and coming.
    choices:
      - text: "Keep moving."
        to: 144

  139:
    title: The Door
    text: |
      You set your back against the door and your heels against the floorboards.

      Nobody knocks. Something heavy hits the door from outside at the height of a man's shoulder, and the chair skids, and the door bows in against your back and springs out again. Again. The wood splits round the lock with the sound of a green branch breaking. Through the gap at the jamb you see lantern light, and a grey hand, webbed to the first knuckle, feeling for the edge.
    choices:
      - text: "Fire through the door."
        requires: {item: revolver}
        to: 140
      - text: "Hold it with your shoulder."
        roll: {skill: [STR, CON], success: 133, failure: 194}

  140:
    title: Through the Door
    text: |
      You step back and put two rounds through the door at chest height. The cracks are enormous in the little room, and the smoke stings your eyes.

      Out in the corridor, something screams. It is not a sound a man makes. Something heavy slides down the outside of the door to the floor. Feet slap away down the hall, a lot of feet, and the croaking rises to a wail and goes away down the stairwell.

      They'll be back, and more of them.
    choices:
      - text: "Go, while they're gone."
        to: 133

  141:
    title: Behind the Sign
    effects:
      - san: "1/1D6"
    text: |
      You sit on the bed with your back to the wall and watch the doors.

      They come back four times before dawn.

      The first time, they try the knob again, and hiss, and go away. The second time they bring a lantern, and you see its light at the keyhole and hear someone reading aloud, slowly, in that croaking tongue, as if trying words on the sign to find one that will undo it. None does. The third time there are more of them, and they don't try the door at all. They stand in the corridor and breathe. You hear them breathing for an hour.

      The fourth time is at the window.

      You hear it come up the wall: a wet slap, a scrape, a slap. A shape rises against the moonlit glass, a head too wide for its neck, two pale eyes as big as saucers, a hand spread flat on the pane, webbed and grey. It looks at you. It looks at the sign. It stays there a long time. Then it lets go, and you hear it slide back down the wall into the courtyard.

      Toward four the singing starts up again far out on the reef, and stops. The sky goes grey. A cart goes by in the street. Gulls.

      At six o'clock somebody taps at your door, politely, twice.

      "First bus leaves half past six," says the night clerk's voice. "From the steps." A pause. "Ye'll be wantin' it, I expect."
    choices:
      - text: "Gather your things, and go down."
        effects: [{unnote: SETSTONE}]
        to: 219

  142:
    title: An Inch
    effects:
      - san: "0/1D3"
    text: |
      You take the chair away. You put your hand on the knob, and it is wet, and it turns under your fingers by itself. The door opens an inch.

      The smell comes in first: the harbour bottom at low tide. Then, round the edge of the door, at the height of your face, four grey fingers, long and soft, with webs between them to the first knuckle. They curl round the wood, gently, and begin to draw it open.
    choices:
      - text: "Slam it shut on them, and get the chair back under the knob."
        to: 139
      - text: "Let it open."
        to: 143

  143:
    title: Who's There?
    ending: death
    text: |
      You open it the rest of the way.

      The corridor is full of them, shoulder to shoulder, all the way to the stairs, and the lantern on the landing lights them from below. Robes. Bare grey feet in puddles of their own water. Faces. You see the faces properly now, for the first time, close enough to touch: the wide mouths, the creased throats working, the eyes that do not close.

      Nobody says anything. Nobody needs to. They simply come in, all of them, at once, the way the tide comes into a cave.

      The Gilman House lets Room 428 again in August, to a salesman of farm machinery from Worcester, who complains about the smell.
    extra:
      - text: |
          Someone tried your door at one in the morning, in a town that wanted you gone, and you opened it to see who it was.

  # ----------------------------------------------------- The streets at night
  144:
    title: Moonlight
    effects:
      - note: HUNT
    text: |
      The moon is high and white, and Innsmouth is awake.

      Not with lights in its windows. The houses are as dark as they were at dusk. With lanterns. They move through the streets below you and above you, two and three together, slowly, stopping at doors. Somewhere a knock, and a door opening, and a murmur, and the door closing, and the lantern moving on. Down on the waterfront a crowd of them stands together at the head of a wharf, and their long shadows reach out across the water. Up on the green a bell gives a single stroke, and stops.

      They are looking for someone. You know who.

      You find a doorway and put your back into it, and think hard about where in this town a person might go.
    extra:
      - requires: {note: ZADOK}
        text: |
          You think of Zadok Allen, and the way his eyes kept going to the sea.
      - text: |
          A lantern turns into the end of the street, and stops, and starts toward you.
    choices:
      - text: "Cross the Square for the old station and the railway."
        requires: {note: RAILWAY}
        to: 199
      - text: "Make for the old Marsh wharf, and Shea."
        requires: {note: BOAT}
        to: 160
      - text: "Make for the dory under the old Marsh wharf."
        requires: {note: DORY}
        to: 161
      - text: "Cross the river to Ruth Eliot's back door."
        requires: {note: ELIOT}
        to: 148
      - text: "Strike south out of town, for the Ipswich road."
        to: 145
      - text: "Go to ground in a cellar, and wait for daylight."
        to: 147

  145:
    title: The South Lanes
    text: |
      South of the Square the lanes run downhill between blind walls and boarded houses toward the edge of the marsh. You go from doorway to doorway, with your back to the wood.

      Halfway down, a lantern turns in at the bottom of the lane and comes up toward you. Four of them, walking slowly, and between them, slung on a boat-hook carried on two shoulders, a fishing net with something in it that moves.

      There is a doorway beside you, deep and black. There is an alley across the lane, if you could cross it before the light reaches you.
    choices:
      - text: "Press into the doorway, and wait for them to pass."
        to: 146
      - text: "Dart across into the alley, behind their backs."
        roll: {skill: [Stealth, DEX], success: 217, failure: 194}

  146:
    title: The Net
    effects:
      - san: "1/1D4"
    text: |
      They pass so close you could touch the net.

      What is in it is a man, or was. He is wound in the mesh like a fly in a web, and his face is pressed against the cords, and his eyes are open, and they move, and find yours. He doesn't call out. He only looks at you, all the way past, until the lantern turns the corner.

      Then you go on down to the last houses, and out onto the white road across the marsh.
    choices:
      - text: "Walk on, south."
        to: 217

  147:
    title: A Coal Cellar
    text: |
      Behind a shuttered shop you find a coal chute with a broken hatch, and let yourself down it into the dark.

      The cellar is empty of coal and deep in black dust. A grating at street level lets in a little moonlight. You crawl into the farthest corner, lie flat, pull your coat over your face and breathe through it.

      Lanterns pass the grating. Feet. Once a lantern stops, and lowers, and its light comes down through the bars and crawls across the floor toward you, and stops a yard short of your boots, and lifts away.

      The night goes on for ever.
    choices:
      - text: "Lie still. Don't breathe."
        roll: {skill: [Stealth, POW], success: 219, failure: 194}

  # ----------------------------------------------------- The Eliots at night
  148:
    title: The Back Door
    text: |
      Ruth Eliot's kitchen is small and hot and smells of tar and bread. The lamp is turned down to a bead, and she has hung a blanket over the window. Jonas is asleep in the next room, on a cot under the stairs. You can hear him breathing, a little thick, a little wet, the way a child breathes with a cold.

      Ruth sits across the table from you with her hands round a cup she isn't drinking from.

      There is a fish knife on the table by her cup. She doesn't look at it.
    extra:
      - requires: {note: LATE}
        before: true
        text: |
          You spend the last of the daylight in her yard, mending net with your back to the lane, while Jonas fishes off the steps. At sundown she calls him in and bars the door. She gives you chowder, and puts the boy to bed. At half past nine the bell goes on the green, and you hear the boats go out.
      - requires: {no_note: LATE}
        before: true
        text: |
          Ruth opens the back door a hand's width and looks past you, up the lane, before she lets you in. She bars it behind you.
      - requires: {no_note: HUNT}
        text: |
          "They'll come tonight," she says. "After the rite. They come up the lanes with lanterns, house by house, every rite night, and they always look in on him." She tips her head toward the room where Jonas sleeps. "To see how he's coming along. Like a crop."
      - requires: {note: HUNT}
        text: |
          "They've been up the lane once already tonight," she says. "You came in behind them. They'll be back. They always look in on him twice." She tips her head toward the room where Jonas sleeps. "To see how he's coming along. Like a crop."
      - requires: {note: MARTHA}
        text: |
          Martha's letter stands propped against the clock on the shelf, where Ruth can see it. There is a carpet bag by the back door, packed.
      - requires: {note: PROMISE}
        text: |
          You promised her. She hasn't said so. She doesn't need to.
      - requires: {item: sign-stone}
        text: |
          Her eyes go to your pocket, where Matt Eliot's stone is, and away again.
      - requires: {no_note: MARTHA}
        text: |
          "My sister Martha keeps a boarding house in Newburyport," Ruth says. "Water Street. She writes every month. I never once wrote back." She looks at the blanket over the window. "She'd take us. If we ever got that far."
      - requires: [{no_note: MARTHA}, {item: letter}]
        text: |
          Martha. The landlady on Water Street. The envelope in your inside pocket feels suddenly heavy, but this is not the moment.
      - text: |
          In the next room, Jonas turns over in his sleep and says something that isn't a word.

          "The dory's at the back steps," Ruth says. "Amos built her. She'll take three." She looks at you steadily. "But you've a say in it now. You're here. What do we do?"
    choices:
      - text: "Go now, all three of you, in the dory at the back steps."
        effects: [{note: RUTH}]
        to: 150
      - text: "Bar the door, and set the old sign on the step."
        requires: {any: [{note: SIGN}, {item: sign-stone}, {item: library-notes}]}
        to: 154
      - text: "Hide in the loft, and let Ruth face them."
        to: 157
      - text: "Leave them, and go alone."
        to: 149

  149:
    title: Alone
    effects:
      - unnote: ELIOT
    text: |
      Ruth doesn't argue. She unbars the door for you, and bars it again behind you, and you hear her drag the table across it.

      You wait in a net shed by the river, among cork floats and the stink of old bait, until lanterns come up the lane. They go from house to house. They stop at every door. You don't watch which doors.
    extra:
      - requires: {note: PROMISE}
        text: |
          You promised her.
      - text: |
          When the lanterns have gone by the shed, you slip out of the other side.
    choices:
      - text: "Go."
        to: 144

  150:
    title: The Black River
    effects:
      - unnote: BOAT
    text: |
      Ruth wakes Jonas with a hand over his mouth. He doesn't cry out. He has done this before, you think, or been told about it so many times that it comes to the same thing.

      The dory is tied at the foot of the back steps, where the river runs black and quick between the houses, below the falls. Ruth takes the oars. She won't hear of anyone else taking them. Jonas sits in the bow with his knees drawn up. You sit in the stern and watch the bank.

      She rows like a fisherman's wife, short and hard and quiet, feathering the blades so they don't splash. The current carries you past the mill's tailrace, roaring out of its stone mouth on the far bank, and something in the white water there lifts its head and watches you go by.

      Then the river widens and the houses fall away, and there is the harbour, flat and silver under the moon, and the stumps of old wharves going by like rotten teeth. Lanterns on the waterfront to your right. Voices. Ruth ships the oars and lets the ebb take you, and you drift past the end of the breakwater close enough to hear a man on it cough.

      Out past the harbour mouth she leans on the oars again, and the open sea lifts the dory.
    extra:
      - requires: [{no_note: HUNT}, {no_note: LATE}]
        before: true
        text: |
          Ruth won't go until the boats are out. You sit in the dark until the bell on the green has stopped and the last oars have gone by the river mouth. Then she gets up.
      - requires: {no_note: HUNT}
        text: |
          To the east, a mile out, Devil Reef is strung with lanterns, and the singing comes over the water. Ruth turns the bow north, away from it, toward Plum Island.
      - requires: {note: HUNT}
        text: |
          There are no lights on the reef now. The lanterns are all in the town behind you, moving from door to door. Ruth turns the bow north, toward Plum Island.
      - text: |
          Jonas is looking at the water.
    choices:
      - text: "Keep rowing."
        to: 151

  151:
    title: Amos
    effects:
      - san: "1/1D6"
    text: |
      Something comes up beside the dory.

      It comes up slowly, without a splash. A head, round and smooth and grey in the moonlight, and then shoulders. It keeps pace with the boat without seeming to swim. Water runs off it. Its eyes are wide and pale and set far apart, and they are fixed on Jonas.

      "Jonas," it says.

      The voice is thick and wet, but it is a man's voice. It is a voice that has said that name ten thousand times, across a supper table, across a yard.

      Ruth stops rowing.

      "Amos," she says. It isn't a question.

      The thing that was Amos Eliot lifts a hand out of the water toward the bow. The hand is webbed to the last knuckle. It is gentle. It is the gentlest thing you have seen all day.

      "Come along, boy," it says. "Come and see. It's all lights down there. All lights, and your grandad's there, and nobody's ever cold."

      Jonas has let go of his knees. He is leaning toward the side of the boat. His eyes are very wide in the moonlight, wide and pale and far apart, and they are shining.
    choices:
      - text: "Hold Jonas back."
        roll: {skill: [STR, Psychology], success: 152, failure: 153}
      - text: "Hold up the old sign between them."
        requires: {any: [{item: sign-stone}, {item: library-notes}]}
        to: 152
      - text: "Let the boy choose."
        roll: {skill: POW, success: 152, failure: 153}

  152:
    title: Not Yet
    text: |
      For a long moment nobody moves.

      Then Amos Eliot sinks back into the sea. He goes slowly, the way he came, without a ripple, and his pale eyes stay on the boy until the very last, until the water closes over them.

      "Not yet," Jonas whispers to the place where he was. "Not yet, Pa."

      He climbs down off the bow into his mother's arms and cries, hard, the way a much smaller child cries. Ruth holds him with one arm and takes one oar with the other hand. You take the other oar. Between you, badly, you row.

      North, toward the long dark line of Plum Island, with the reef falling away behind you and the stars thick over the sea.

      Nobody speaks until the sky begins to grey.
    choices:
      - text: "Row on, toward the dawn."
        to: 222

  153:
    title: The Boy Who Swam
    effects:
      - note: SWAM
      - san: "1/1D4"
    text: |
      Jonas goes over the side.

      He goes the way a boy goes off a dock on a hot afternoon, all at once, without looking back, and the dory rocks under you, and Ruth makes a sound that you will hear for the rest of your life.

      He comes up once, a yard from the boat, between his father's hands. He is laughing. He is crying too, his face screwed up with it, but he is laughing, and he looks back at his mother and says, "It's warm, Ma. It's warm." Then the two of them go down together. There are bubbles for a little while. Then there are not.

      Ruth sits with the oars across her knees and looks at the place.

      After a long time she takes them up again and begins to row, north, toward Plum Island. Short, hard strokes. She doesn't look back. She doesn't speak. There is nothing else to do, so she does it, all the way to the dawn.
    choices:
      - text: "Row with her."
        to: 222

  154:
    title: The Sign on the Step
    text: |
      Ruth bars the back door and drags the dresser across it. Then you sit in the dark kitchen with the lamp out, the two of you, and Jonas asleep in the next room, and wait.

      They come when the moon is high. You hear them a long way off: a door, a murmur, a door, coming up the lane. Lanterns swing in the cracks of the shutters. Seven of them, eight. The old ones come first, in robes, shuffling, their wide heads bowed. They open the gate. They come up the path. At the front step they stop as if they had walked into a wall.

      A hissing goes up, like a kettle coming to the boil. The lanterns sway. The old ones back away down the path, croaking, their heads turned from the step as from a fire.

      Two of them don't. Two young men at the back, broad and quick, with only the beginnings of the look on them: the narrowing head, the stare. Men, still. They look at the sign, and at each other, and one of them grins and steps over it, and the other follows.

      A knock. "Ruth," says the first young man through the door. "We've come to see the boy."
    extra:
      - requires: {item: sign-stone}
        before: true
        text: |
          You set Matt Eliot's stone on the front step, star uppermost, where anyone who comes to the door must stand over it.
      - requires: {no_item: sign-stone}
        before: true
        text: |
          Ruth fetches Matt Eliot's stone from the bottom of the sea-chest and sets it on the front step, star uppermost, where anyone who comes to the door must stand over it.
      - text: |
          Ruth looks at you across the dark kitchen. Her knife is in her hand.
    choices:
      - text: "Throw the door open, and fight them on the step."
        roll: {skill: [Fighting (Brawl), Dodge], success: 156, failure: 155}
      - text: "Fire at the first one through the door."
        requires: {item: revolver}
        to: 156
      - text: "Talk them down through the door."
        roll: {skill: [Intimidate, Fast Talk, Persuade], success: 156, failure: 155}

  155:
    title: For Safe Keeping
    effects:
      - unnote: ELIOT
    text: |
      It doesn't go your way.

      There are more than two of them in the end. The old ones hang back by the gate. They don't need to come in. The young ones are enough, and they are strong, stronger than they look, with hands as cold as fish. Ruth goes for them with the knife and they take it off her without hurting her, almost politely.

      They lift Jonas out of his cot the way you would lift a sleeping child out of a cart. He wakes, and looks at them, and doesn't cry. Then they take you.
    choices:
      - text: "Go with them. You have no choice."
        to: 194

  156:
    title: Dawn in the Kitchen
    text: |
      They go.

      Not far, and not for good. But they go: back down the path and out at the gate, and the lanterns move off down the lane to the next house, and the next. Somewhere a door opens and a woman cries out, and then it is quiet.

      Nobody comes back. The moon swings west. Toward four the singing on the reef starts up again, and stops. The sky goes grey over the sea.

      Ruth gets up and puts the kettle on, because her hands need something to do. Then she takes a carpetbag down from its peg and begins to pack it: Jonas's other shirt, his good boots, a photograph in a frame, the bread.

      "First bus is half past six," she says. "Joe Sargent drives it. He won't stop us. Not in daylight. Not with you along." She looks at you. "I'm not staying another night. Not one."

      Jonas stands in the doorway in his nightshirt, looking from his mother to you and back.
    extra:
      - requires: {item: sign-stone}
        text: |
          Ruth puts Matt's stone in your hand and closes your fingers over it. "Keep it till we're out," she says.
      - text: |
          Outside, the gulls have started.
    choices:
      - text: "Take the first bus out, all three of you."
        effects: [{note: RUTH}]
        to: 219

  157:
    title: The Loft
    text: |
      There's a loft over the kitchen, reached by a ladder, full of nets and floats and Amos's old oilskins. You lie in it on your face with the oilskins over you and your cheek on the boards. Through a crack between them you can see the lamp, and Ruth's hands on the table.

      They come with the lanterns. Ruth unbars the door before they knock. Feet on the boards below you, wet and bare. The smell. Voices, thick and slow and almost kind.

      They ask how the boy is coming along. They ask whether he's been swimming. They ask whether anybody has been by today, a stranger, asking questions. Ruth says no. Her voice doesn't shake.

      Then one of them says they'll take Jonas now, for safe keeping, till Hallowe'en. Seeing as there's strangers about. Seeing as a mother might take it into her head to do something foolish.

      Ruth doesn't answer. Through the crack you see her hands go flat on the table.

      Jonas is awake. You hear his bare feet on the stairs.
    choices:
      - text: "Climb down, and stop them."
        roll: {skill: [Fighting (Brawl), Dodge], success: 156, failure: 155}
      - text: "Stay hidden."
        to: 158

  158:
    title: Ruth at the Table
    text: |
      You stay where you are.

      Jonas goes with them. He doesn't cry. Through the crack in the boards you watch him walk out between two of them with his hand in a grey hand, looking back once at his mother, and the door closes, and the lanterns move off down the lane.

      You lie in the oilskins until the sky goes grey. Then you climb down the ladder.

      Ruth is sitting at the table where she sat all night. The lamp has burned out. She doesn't look at you.

      "Go," she says. "First bus is half past six. Go."
    extra:
      - requires: {note: PROMISE}
        text: |
          You promised her. She doesn't say it. She doesn't have to.
      - text: |
          You go.
    choices:
      - text: "Walk to the Square, and the first bus."
        to: 219

  # ----------------------------------------------------- The reef
  159:
    title: The Long Wait
    effects:
      - san: "0/1D3"
    text: |
      At the seaward end of the old Marsh wharf a ladder goes down into the dark. You climb down it and wedge yourself among the piles on a crossbeam just clear of the water, in the stink of weed and mussels, with the sea breathing in and out beneath you.

      At half past nine the bell begins on the green. Then the procession comes down Water Street: lanterns, robes, bare feet on the stones, and then right over your head, the wharf boards bending and dripping on you as they pass. They go down into the boats tied along the wharves. Oars. The boats pull out past the end of the wharf, a dozen of them, close enough to touch the last one's wake, and row away across the harbour toward the reef.

      The moon comes up behind the reef, enormous.

      Then the singing.

      It goes on for hours. High, thin voices over the water, and under them something lower that you feel through the crossbeam more than hear. Sometimes it stops, and the silence is worse. Once something swims in among the piles below you, slow and heavy, and turns round, and swims out again.

      Some time near midnight, an engine. It mutters far out in the dark, north of the harbour mouth, and comes closer, and closer, without a single light.
    choices:
      - text: "Climb up to the end of the wharf."
        to: 160

  160:
    title: The Lady Ellen
    text: |
      The *Lady Ellen* lies off the end of the old Marsh wharf with her engine turning over low, like a cat purring, and not a light showing anywhere on her. Shea is a black shape at the wheel. He brings her in until her rubbing strake kisses the piles, and holds her there.

      "Get in," he says, very low. "Get in, for God's sake."

      You drop onto the deck. He has her backing off into the dark before your feet are under you. His face, when the moon catches it, is grey and wet with sweat.

      "I seen 'em," he says. "Coming in. In the water, all round the boat, looking up at me like seals. I ain't never coming back here. Not for whisky. Not for nothing." He spins the wheel. "Where to?"
    extra:
      - requires: {no_note: HUNT}
        text: |
          To the east, a mile out, Devil Reef is strung with lanterns, and the singing comes over the water.
      - requires: {note: HUNT}
        text: |
          Out on Devil Reef the lanterns are going out, one by one. The boats are back. The hunt is in the town behind you.
      - text: |
          The engine mutters. Shea waits, with his hand on the throttle.
    choices:
      - text: "Tell him to run for Newburyport."
        to: 173
      - text: "Show him your badge, and tell him: the reef."
        requires: {no_note: HUNT, item: badge}
        to: 164
      - text: "Put the gold in his hand, and point at the reef."
        requires: {no_note: HUNT, item: gold}
        effects: [{lose: gold}]
        to: 164
      - text: "Hand him the whiskey, and point at the reef."
        requires: {no_note: HUNT, item: whiskey}
        effects: [{lose: whiskey}]
        to: 164

  161:
    title: The Dory
    effects:
      - unnote: BOAT
    text: |
      You climb down under the old Marsh wharf. The dory is where you saw it, tied to the piles and riding low. You bail it with your cupped hands until your arms ache, then slip the line and fit the oars.

      The dory is heavy and old and built for a strong man.
    extra:
      - requires: {no_note: HUNT}
        text: |
          You wait among the piles while the bell rings on the green and the boats go out past you, close enough to touch, and the moon comes up behind the reef. Then there are lanterns on Devil Reef, and the singing comes over the water, thin and high.
      - requires: {note: HUNT}
        text: |
          Lanterns move on the waterfront behind you, and up into the town. Out on Devil Reef the last lights have gone out. The reef lies black and empty under the moon.
      - text: |
          You pull out from under the wharf, and feel the tide take hold of her.
    choices:
      - text: "Row out toward the lights on the reef."
        requires: {no_note: HUNT}
        roll: {skill: [Pilot (Boat), STR], success: 164, failure: 163}
      - text: "Row north along the shore, and away."
        to: 162

  162:
    title: North
    text: |
      You row north with the shore on your left, a long low line of dunes and marsh, black under the moon. The tide is with you. Your hands blister, then bleed, then go numb.
    extra:
      - requires: {no_note: HUNT}
        text: |
          The lanterns on the reef dwindle behind you to a string of sparks, and the singing comes and goes on the wind, and then only comes now and then, and then not at all.
      - requires: {note: HUNT}
        text: |
          Behind you the lanterns move up and down the streets of Innsmouth, smaller and smaller, until the town is only a scatter of sparks under the hill.
      - text: |
          Somewhere in the small hours, something surfaces a little way off and keeps pace with you for a while. You don't look at it. When you do, it's gone.
    choices:
      - text: "Row on, until the sky greys."
        to: 222

  163:
    title: Swamped
    effects:
      - hp: "-1D2"
    text: |
      Halfway across the harbour a swell slops over the gunwale, then another, and the dory wallows. You row her back to the wharf half sunk. You lie beside her among the piles, soaked and shaking, for hours, through all the singing, until the boats come back across the harbour after midnight and the lanterns go up into the town.
    choices:
      - text: "Climb up into the town."
        to: 144

  164:
    title: Devil Reef
    effects:
      - san: "1/1D8"
    text: |
      Devil Reef comes up out of the moonlight like the back of something asleep.

      It is longer than it looked from shore: a quarter of a mile of black rock just clear of the water, ridged and humped and running with weed. Along its spine the old hollows open one after another, like doorways into a cellar. Lanterns stand on the rocks in a long double row. Between them, robed figures, dozens of them, swaying. On the reef's highest point stands a tall shape in a robe and a gold tiara that takes the moonlight and throws it back, with his arms raised.

      The chant comes across the water. *Iä! Iä!* Over and over, a hundred voices, more, and under them a deeper sound, as if the sea itself were saying the words.

      Then you see what else is on the reef.

      They are climbing out of the water on the far side, the dark side, where the bottom drops away past any sounding line. Dozens of them. The moonlight slides on wet grey hides. They are shaped like men, almost. They are shaped like frogs, almost, and like fish, and like neither. They come up the rocks on webbed hands and feet, squatting and hopping, and take their places among the robed figures as if they had done it ten thousand times. The robed figures make room for them.

      Some of the robed figures are holding hands with them.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has cut the engine. The *Lady Ellen* drifts in the dark a long stone's throw off the reef. He has his rosary out, and his lips are moving.
      - requires: {no_note: BOAT}
        text: |
          You ship the oars, let the dory drift, and hold your breath.
      - requires: {note: REEF}
        text: |
          You have studied this reef by daylight. You know where the dark side is, and the hollow that goes down.
      - text: |
          Nobody on the reef has seen you. Not yet.
    choices:
      - text: "Get the dynamite into the hollows on the dark side."
        requires: {item: dynamite}
        to: 165
      - text: "Photograph them."
        requires: {item: camera, skill: Art/Craft (Photography), min: 40}
        roll: {skill: Art/Craft (Photography), success: 168, failure: 169}
      - text: "Listen to the names they are calling."
        to: 171
      - text: "Turn back, quietly, while you can."
        to: 172

  165:
    title: The Dark Side
    text: |
      You come round the north end of the reef, wide, in its shadow, and in onto the seaward side, where the rocks drop sheer into black water. There is a ledge there, slick with weed, a foot above the swell. You get onto it with the dynamite inside your shirt.

      The chant is over your head now, just the other side of the ridge. You can smell them: weed, and fish, and something older. You crawl.

      The hollows on this side are bigger. One is bigger than all the rest. It goes down into the reef at a slant, black, and cold air breathes up out of it, steadily, like a sleeper's breath, carrying the smell of the deep. That is where they come from. That is the door.

      You need the charge deep in it, and the fuse lit, and yourself gone, before the chant ends.
    extra:
      - requires: {note: BOAT}
        text: |
          Behind you, Shea holds the *Lady Ellen* off the ledge with a boathook, swearing in a whisper.
      - requires: {no_note: BOAT}
        text: |
          Behind you, the dory is tied to a knob of rock, knocking softly against the ledge.
      - text: |
          Your hands are shaking. You make them stop.
    choices:
      - text: "Work by feel, fast."
        roll: {skill: [Stealth, Swim], success: 175, failure: 166}
      - text: "Find the hollow you marked by daylight."
        requires: {note: REEF}
        to: 175
      - text: "Lose your nerve, and get back in the boat."
        to: 172
      - text: "Set the old sign stone on the rocks behind you, and work."
        requires: {item: sign-stone}
        effects: [{lose: sign-stone}]
        to: 175

  166:
    title: Seen
    text: |
      A shape on the rocks above you turns its head. A wide grey face, two pale eyes, a mouth opening. It croaks, and on the other side of the ridge the chant falters.

      You strike the match on the rock, light the fuse, shove the charge as deep into the hollow as your arm will go, and dive.
    choices:
      - text: "Swim for your life."
        roll: {skill: [Swim, CON], success: 175, failure: 167}

  167:
    title: Under
    effects:
      - hp: "-1D6"
    text: |
      Hands in the water. Cold, webbed, many. They take your ankles and your coat and drag you down, and down, into a dark where the pressure squeezes your skull. You kick. You claw. Your lungs burn.

      Then the sea above you turns white, and the hands let go.
    choices:
      - text: "Swim up toward the light."
        to: 175

  168:
    title: The Plate
    effects:
      - note: PLATE
    text: |
      You brace the camera on the gunwale and open the shutter. No flash: the moon will do, if you are patient. Ten. Twenty. Nobody on the reef turns.

      Thirty. You close the shutter. On that plate is something no editor in Boston will be able to call a hoax.
    choices:
      - text: "Get away, quietly."
        to: 172

  169:
    title: The Flash
    effects:
      - note: PLATE
    text: |
      The shutter sticks. You fumble it, and your thumb finds the flash tray instead, and the magnesium goes off with a soft white thump.

      For an instant the whole reef stands lit like noon, every robe, every grey hide, every face. Every face turns toward you. You will see them for the rest of your life. You have them on the plate.

      Then the light is gone, and in the dark you hear them going into the water. All of them, at once. Toward you.
    choices:
      - text: "Get away. Now."
        to: 170

  170:
    title: Pursuit
    effects:
      - hp: "-1D4"
      - san: "1/1D4"
    text: |
      They come through the water faster than anything you have ever seen swim. A hand slaps onto the gunwale, webbed and grey, and another. The boat tips. Something rises at the side and looks at you with eyes like lamps, and you hit it with whatever you have in your hand until it lets go.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has the engine roaring. The *Lady Ellen* leaps forward and the hands fall away behind, all but one, which comes away with a strip of the rubbing strake.
      - requires: {no_note: BOAT}
        text: |
          You row like a madman, catching crabs, splashing, the oars bending, and slowly, slowly, the hands fall behind.
      - text: |
          Then there is only open water, and your own heart, and the lanterns on the reef getting smaller.
    choices:
      - text: "Keep going."
        to: 172

  171:
    title: The Names
    effects:
      - san: "1/1D6"
    text: |
      The chant stops. The priest in the tiara lowers his arms and begins to call names, one at a time, in a high carrying voice.

      For each name, something answers. Sometimes a robed figure on the rocks. More often a voice from the water, thick and bubbling, rising out of the black sea beside the reef. The drowned. The ones who went down. "Hiram Gilman," calls the priest, and something answers that was Hiram Gilman in 1845. "Amos Eliot," he calls, and something answers.

      Then he calls a name that you know.

      It is your own.

      He says it clearly, the way you might call a child in from the yard. Every face on the reef turns, not toward the boat, but toward the sea, as if waiting for you to come up out of it.
    extra:
      - requires: {investigator: genealogist}
        text: |
          But before your name, he calls another. "Abigail Orne." And out of the water, very near, a woman's voice answers him. You have not heard it since you were thirteen years old, but you would know it anywhere. It used to sing to you on the porch in Toledo.
      - text: |
          Something in the water beside the boat says your name too, softly, as if to help you remember it.
    choices:
      - text: "Climb out onto the reef, and go down with them."
        to: 229
      - text: "Turn back."
        to: 172

  172:
    title: Away
    text: |
      The reef falls behind you. The lanterns shrink to a string of sparks, and then to a single blur of light on the black sea, and the chant goes thin and far away, and stops.

      Ahead there is only open water under the moon, and to the north, the long dark line of the shore.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has the throttle wide open. He doesn't look back once. His hands on the wheel are shaking, and his lips are still moving.

          "There's a mother ship lies off Thacher Island tonight," he says, to nobody. "Canadian. Takes her on to Saint-Pierre, after. The French islands. Nobody asks a man anything, out there." He looks at you sideways. "Just saying."
      - requires: {no_note: BOAT}
        text: |
          You row with your back to the shore and your face to the reef, so that you can see it getting smaller. It is the only thing that keeps your arms going.
      - text: |
          The wind is cold now. Your clothes are wet through.
    choices:
      - text: "Make for the shore to the north, and the morning."
        to: 222
      - text: "Tell Shea to run for the mother ship, and Saint-Pierre."
        requires: {note: BOAT}
        to: 174

  173:
    title: Full Throttle
    text: |
      Shea opens her up. The *Lady Ellen* stands up on her stern and goes out past the breakwater like a train out of a tunnel, throwing white water both sides, and the harbour falls away behind.

      Shea doesn't look back. He keeps his eyes on the dark ahead and talks, low and fast, about anything: the price of whisky in Halifax, a dog he had as a boy, the mother ship that lies off Thacher Island tonight and goes on to Saint-Pierre after, the French islands, where nobody asks a man anything.

      "I could run you out there," he says. "Just saying. If a body didn't want to go home."
    extra:
      - requires: {no_note: HUNT}
        text: |
          Off to the east, Devil Reef burns with its lanterns.
      - requires: {note: HUNT}
        text: |
          Off to the east, Devil Reef is black and empty now, and the lanterns are all in the town.
      - text: |
          The sea opens out ahead, dark and wide, and the engine hammers.
    choices:
      - text: "Make for Newburyport."
        to: 222
      - text: "Let him run for the mother ship off Thacher Island, and on to Saint-Pierre."
        to: 174

  174:
    title: To Saint-Pierre
    ending: escape
    text: |
      The singing follows the boat out to sea.

      You hear it long after the reef has gone below the horizon, long after the last lantern. It comes up through the hull and out of the black water on every side, no longer thin and far away but close and full and gentle, a hundred voices, a thousand, singing something with no words that you would swear is meant for you. It is the most beautiful thing you have ever heard. Shea weeps at the wheel and doesn't wipe his face. Toward dawn it stops, and you are sorry, and you are ashamed of being sorry.

      The mother ship is a rusty Canadian schooner riding at anchor off Thacher Island in the grey light, with a crew who look at your clothes and ask nothing. You go aboard with Shea and his last crates. Six days later you come ashore at Saint-Pierre, among the French fishermen and the warehouses stacked to the roofs with rum in barrels, and walk up a cobbled street in a town where nobody has ever heard of Innsmouth.

      You stay a month. Then a season. You get work, of a kind. Shea buys a share in a schooner and never sails south of Halifax again.

      Some nights you walk down to the harbour, and stand at the end of the quay, and listen. You never hear it. You keep listening.
    extra:
      - requires: [{investigator: agent}, {no_item: badge}]
        text: |
          The Bureau lists you as missing in the line of duty. Your name goes on a brass plate in the Boston office, and somebody else gets your desk. You read about it, months later, in a Halifax paper, and feel nothing much.
      - requires: [{investigator: agent}, {item: badge}]
        text: |
          Your Treasury badge goes over the side of the schooner on the second night out, somewhere south of Sable Island. You watch it flash once in the dark water and go down. The Bureau lists you as missing in the line of duty. Your name goes on a brass plate in the Boston office, and that is the last of Agent Brannigan.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out of Innsmouth stays in the bottom of your bag, wrapped in oilcloth. You mean to send it to someone. You write the address on the parcel more than once. It is still in your bag at the end of the season.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her boy out of Innsmouth. On the quay at Saint-Pierre you think of her sometimes, at her table, waiting for a knock at the back door. Hallowe'en comes, and goes.
      - requires: {investigator: genealogist}
        text: |
          A year later you are still on the islands. You have stopped writing to your mother in Toledo. The little mirror in your rented room has begun to show you a face you half know from a portrait: the eyes wider than they were, the skin at the sides of your throat creasing in soft folds when you turn your head. You swim every morning off the rocks, further out each time, in water that ought to be too cold for anyone. It isn't cold to you. At night you dream of a city of lights under a reef, and a woman with your grandmother's face at a window, waiting. One of these mornings you won't turn back.
      - text: |
          You ran from Innsmouth on a rum-runner, and the sea sang to you all the way out. You have been trying ever since to decide whether it was singing goodbye.

  175:
    title: Devil Reef, Burning
    ending: triumph
    text: |
      You are back in the boat, somehow, soaked and gasping, when Devil Reef goes up.

      You feel it first, through the hull, a punch from below. Then the sound, a flat enormous thud that you hear with your chest. A column of white water and black rock climbs out of the reef's dark side into the moonlight, and hangs there, and comes down in a roaring rain. The reef's spine cracks along its length. The hollows fold in on themselves like a mouth closing. Lanterns go flying. Robed figures go flying. The whole seaward side of the reef slumps, slowly, and slides down into the deep with a long grinding groan, and the sea rushes in over it, white.

      And from the water, everywhere, all around the reef and under the boat and far out to sea, a sound comes up that is not a scream and not a song, but something of both, and goes on and on.

      You get away. Afterwards you can't remember how. You remember the stars wheeling, and the wake, and the cold. At dawn you are off Plum Island, with the sun coming up out of a quiet sea, and gulls, and the smell of the dunes, and you are alive.

      That summer the fish leave Innsmouth. The boats come back empty, week after week. The furnace at the mill on the falls goes cold, and no more pale gold turns up in Boston. By autumn the Hall of Dagon has a padlock on its door. By winter half the shuttered houses have gone up for sale, and found no buyers, and the other half are empty anyway.

      What lived under the reef is still down there, somewhere. But its door is shut, and it is a long, long swim to the next one.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea brings the *Lady Ellen* into Newburyport at seven in the morning with a hole in his rubbing strake and his rosary round his neck. He sells his engine within the month. The next summer he is pulling lobster pots off Plum Island in a sailing dory, an honest man, and he will tell anyone who buys him a drink that he once took a fare out to Devil Reef, and that is all he will tell them.
      - requires: {no_note: BOAT}
        text: |
          You beach the dory on Plum Island in the dawn and lie in the sand beside it for an hour, looking at the sky. A clam-digger finds you there, and walks you to the Coast Guard station, and never asks.
      - requires: {note: CALLED}
        text: |
          The Coast Guard cutter that lay off the harbour mouth all night saw the reef go up. Her captain's report goes to Boston that morning, and from Boston to Washington. In February, federal men come to Innsmouth with warrants. They find a great deal less than they expected, and a great deal more than they can explain.
      - requires: {note: OATH}
        text: |
          You swore an oath of silence on the green in Innsmouth, and then you blew up its altar. Nobody comes for you. Some nights, in the bath, the water seems to remember.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take Jonas out. You didn't. But in September a letter comes, care of the Newburyport post office, in a careful round hand. She and the boy are at her sister's boarding house on Water Street, in Newburyport. The Order, she writes, had other things to think about this summer. Jonas swims in the river every day. His eyes are no worse. She doesn't thank you. She doesn't have to.
      - requires: [{any: [{item: ledger}, {item: register}]}, {no_note: CALLED}]
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel, with no name on it. In February federal men come up the coast to see what is left of the town, and find less than they expected.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you stand in front of your mother's hall mirror and look at your eyes. They are wider than they were. They do not close all the way when you sleep; your mother has seen it, and says nothing. The skin at the sides of your throat has begun to crease. You dream every night of a city of lights under the sea, under a reef that is no longer there, and of a woman with your grandmother's face at a window, who is not angry with you, who only waits. The door you shut was not the only door.
      - text: |
          You went out to Devil Reef in the dark with a fuse and a match, and you shut the door that Obed Marsh opened. It was the bravest thing you ever did. Some nights it is also the loneliest.

  # ----------------------------------------------------- The Hall at night
  176:
    title: The Hall, Empty
    text: |
      You climb to the green at ten, keeping to the shadows of the houses.

      The bell has stopped. The moon is up over the sea, and the green lies white and empty under it. The squat stone church is dark. Across from it the old pillared hall stands with its grey columns silvered and its windows black, and over its door, in letters of flaking gilt, the words ESOTERIC ORDER OF DAGON.

      Everybody is at the reef. You can hear them from here, faintly, the singing coming up over the roofs from the sea.

      Not quite everybody. On the Hall's top step an old man sits in a grey robe with a lantern at his feet and his chin on his chest, left behind to keep the door. He is very old. He might be asleep. With these people you can never tell.

      Round the side of the building, in the shadow, there is a small window with a sash, low down, that must be the vestry.
    extra:
      - requires: {item: robe}
        text: |
          The grey robe is rolled under your arm. In the moonlight, with the hood up, one robed figure looks very like another.
      - requires: {note: OATH}
        text: |
          You swore the first oath in there this afternoon. You feel it as you look at the door, like a hook under the skin, tugging gently.
      - text: |
          The old man's lantern gutters. He doesn't move.
    choices:
      - text: "Walk up the steps and in at the front door, as a member."
        requires: {note: OATH}
        to: 177
      - text: "Pull on the grey robe, and walk in past him."
        requires: {item: robe}
        to: 177
      - text: "Go round the side, and force the vestry window."
        roll: {skill: [Locksmith, STR], success: 177, failure: 194}

  177:
    title: The Dark Hall
    effects:
      - note: SEADOOR
    text: |
      Inside, the Hall is one long room, black as a well, smelling of wax and brine. Moonlight comes through the high windows in long pale bars and lies across rows of benches. The walls are crowded with gilded carvings that catch the light as you pass: waves, and weed, and things swimming in them with too many fins, and men and women swimming among the things, holding their hands.

      At the far end, a dais, and on it a tall chair, empty.

      To the left of the dais, a door stands ajar on the vestry: robes on pegs, a desk, a shelf of books. To the right, another door, open, and beyond it a stair going down. The stair breathes. Cold air comes up it, steadily, smelling of the sea, of the bottom of the sea, the way a cellar smells of earth.

      Far away, through the walls, the singing on the reef.
    extra:
      - requires: {no_item: register}
        text: |
          On the vestry desk a heavy book lies open: a ledger of names and dates in many hands, going back and back.
      - requires: {item: register}
        text: |
          The vestry desk is bare where the Order's book used to lie. Drawers hang open. Someone has been looking for it.
      - requires: [{investigator: antiquarian}, {no_item: register}]
        text: |
          You strike a match and read standing up, turning the stiff pages fast. Names from 1840 on, each with a date, May-Eve or Hallowe'en, and a mark: some crossed through, some marked *went down*. Amos Eliot, 1924, *went down*. Jonas Eliot, *third oath, Hallowe'en 1927*. And in the oldest pages, in a hand like Obed Marsh's own, a note on the building itself: the vaults below, and the shaft at the bottom of them, *the door by which they come up to us*.
      - text: |
          Nobody is here. Somewhere, water drips.
    choices:
      - text: "Go down the stair, to the cellars."
        to: 178
      - text: "Take the book, and get out."
        requires: {no_item: register}
        effects: [{gain: register}]
        to: 183
      - text: "Get out, while the Hall is still empty."
        requires: {item: register}
        to: 183

  178:
    title: The Sea Door
    effects:
      - san: "1/1D6"
    text: |
      The shaft is wide enough for three men abreast, lined with dressed stone, and full to within a yard of the top with black water. The water moves. It rises and falls, slowly, with the sea a mile away, slopping over the lip and running back. Across the shaft, set into a carved stone arch, is an iron grille, its bars as thick as your wrist, green with age, and wide open, swung back on its hinges against the wall.

      The arch is carved all round with the same things as the tiara: the sea-shapes, the swimmers, the hands. At its peak, in the keystone, there is a round hollow the size of your palm, empty. Something was set there once, and taken out.

      Beside the shaft, down three more steps, there is a lower door. It is low and broad and banded with iron, and it is shut. Behind it, something breathes. Slowly. Enormously. You feel the breath in the soles of your feet. Each breath takes a long time, and between them there is a silence in which you can hear your own heart.

      The water in the shaft heaves, and a bubble the size of a barrel breaks on its surface, and something far down below turns over in the dark.
    extra:
      - requires: {no_note: TUNNEL}
        before: true
        text: |
          The stair goes down a long way. Three flights of stone, worn into hollows by feet, then brick vaults, old and sweating, older than the Hall above them, older than the town. Your light shows niches in the walls, and things in the niches you don't stop to look at. The air gets colder and wetter at every step, and the smell of the sea gets stronger, until you are breathing it.

          The last vault is round, and in its floor is a shaft.
      - requires: {note: TUNNEL}
        before: true
        text: |
          The vault is round, and older than the Hall that stands somewhere above it, older than the town. A stair climbs out of it on the far side, toward the Hall. In its floor is the shaft.
      - requires: {note: SHOGGOTH}
        text: |
          *Ever hear tell of a shoggoth?* Zadok screamed it, and ran. You look at the iron door, and you remember how fast he ran, and you take your hand away from it.
      - requires: [{note: ZADOK}, {no_note: SHOGGOTH}]
        text: |
          Zadok told you they come up a shaft under this Hall. He never said what else was down here. You think of the way his eyes kept going to the sea, and you keep well away from the iron door.
      - requires: {investigator: genealogist}
        text: |
          Your grandmother went down this way. You know it without being told, the way you know which way is up underwater. Somewhere below that open grille, past the bottom of the world, she is waiting, and the water smells faintly of the lavender water she wore.
      - text: |
          Whatever you are going to do here, you have to do it before the boats come back.
    choices:
      - text: "Set the old sign stone into the empty hollow in the keystone."
        requires: {item: sign-stone}
        effects: [{lose: sign-stone}]
        to: 184
      - text: "Cut the sign into the keystone itself, deep, the old way."
        requires: {investigator: antiquarian}
        roll: {skill: [Archaeology, Occult], difficulty: hard, success: 179, failure: 180}
      - text: "Draw the sign on the lip of the shaft, and run."
        requires: {any: [{note: SIGN}, {item: library-notes}]}
        to: 180
      - text: "Pack the dynamite into the arch, and light the fuse."
        requires: {item: dynamite}
        effects: [{lose: dynamite}]
        to: 185
      - text: "Photograph the sea door."
        requires: {item: camera}
        to: 181
      - text: "Open the lower door."
        to: 182
      - text: "Get out, before something comes up."
        to: 183

  179:
    title: Cut Deep
    text: |
      There is a mason's chisel in the vestry, left from some repair, and a mallet. You go up for them and come down again with your heart in your mouth.

      You stand on the lip of the shaft with the black water slopping at your shoes, and you cut the sign into the keystone, round the empty hollow, the way the oldest pages of your notes say it must be cut: the five points, the flame at the heart, each stroke in its order, deep, deeper than the carvings round it. The stone is soft with the sea. The chips fall into the water and sink.

      It takes hours. Your hands blister and bleed. Twice something rises in the shaft and stops below the surface, a pale shape, watching, and goes down again. Once the breathing behind the iron door stops altogether, and you stop too, and wait, until it starts again.

      When you cut the last stroke of the flame, the water in the shaft goes still.

      Not calm. Still. As if it had been told to.
    choices:
      - text: "Step back from the shaft."
        to: 184

  180:
    title: Chalk
    text: |
      The sign you have made on the lip of the shaft is shallow and hurried, already blurring in the wet. Something rises to the surface of the water beneath it and stops there, a pale shape, and stays. It will hold a while. Not for ever.
    choices:
      - text: "Run."
        to: 183

  181:
    title: Flash
    effects:
      - note: PLATE
      - san: "1/1D6"
    text: |
      You aim the camera down the shaft and fire the flash.

      In that white instant the shaft is not full of water. It is full of upturned faces, grey and wide-mouthed, packed like fish in a net, looking up at you. Then dark.

      You have them on the plate. You are already running.
    choices:
      - text: "Up. Up."
        to: 183

  182:
    title: The Lower Door
    effects:
      - san: "1D4/1D10"
      - hp: "-1D6"
    text: |
      The iron bar lifts more easily than it should. The door swings inward on its own weight.

      You never see it whole. Nobody could. There is a darkness behind the door that is wetter than water, and it moves toward you, and it is all mouths and all eyes, opening and shutting in a skin like oil, more of them every moment, and the sound it makes is a sound like a whistle blown under the sea. It pours. It comes up the three steps the way a tide comes up a beach.

      Something touches your arm, and the skin goes with it.
    choices:
      - text: "Run."
        to: 183

  183:
    title: Later Than You Thought
    text: |
      You come out of the Hall onto the green, gasping. Hours have gone, somehow, though it felt like minutes. The moon has swung far over. The boats are coming back across the harbour, and lanterns are climbing up from the waterfront, into the town.
    choices:
      - text: "Get away from the green."
        to: 144

  184:
    title: The Old Sign
    ending: triumph
    text: |
      The water in the shaft is still.

      You stand at the lip of it for a long time, waiting for something to rise. Nothing does. The bubbles have stopped. The grille hangs open on its hinges, and the black water under it lies as flat as a pane of glass. Even the breathing behind the iron door has slowed, and grown fainter, as if whatever is in there has gone back to sleep.

      At one o'clock you hear them come back. Feet on the stairs above you, many feet, and lanterns, and the croaking voices. They come down into the vault, a dozen of them, robed, the priest at their head with the gold tiara on his narrow head, and they see the sign. The old ones stop on the steps and will not come one step nearer. They hiss. They turn their faces away. The young ones look at the sign, and at the old ones, and at you, and do nothing at all. Not one of them will touch it.

      You walk out through them. They let you.

      At dawn you come out of the Hall's front door into a silent town. No lanterns. No bell. Gulls on the green. Down in the harbour the reef stands black out of the low tide, empty, and nothing moves on it.

      The first bus runs at half past six. You are on it.

      That summer the fish leave Innsmouth. The boats come back empty, week after week. The furnace at the mill goes cold. The gold stops turning up in Boston. By autumn the Hall has a padlock on its door, and the old ones in the shuttered houses are sitting at their windows looking at the sea, waiting for something that does not come.

      In the keystone of an arch at the bottom of the world, a star with a flame in its heart keeps the door. It will keep it a long time.
    extra:
      - requires: {note: PROMISE}
        text: |
          Before the bus, you knock at Ruth Eliot's back door and tell her. She listens with her arms folded. Then she goes inside and comes back with the carpetbag already packed, and Jonas behind her, and the three of you walk to the Square together. Nobody stops you. You kept your promise, in the end.
      - requires: {note: OATH}
        text: |
          You swore the first oath of Dagon in that hall, and you broke it in the cellar under it. For a year you wait for them to come for you. They never do. They have nothing left to come with.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel, with no name on it. In February federal men come up the coast to see what is left of the town, and find less than they expected.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you stand before your mother's hall mirror and look at your eyes. They are wider than they were. They do not close all the way when you sleep. The skin at the sides of your throat has begun to crease, softly, like the gills of a mushroom. You dream every night of a city of lights under the sea, and of a woman with your grandmother's face at a window, who knows what you did, and is not angry, and waits. There are other doors. The sea is wide.
      - text: |
          You went down into the dark under the Hall of Dagon and shut the door with a sign older than the town. Nobody will ever know you did it. That was the point.

  185:
    title: The Sea Door
    ending: triumph
    text: |
      You pack the dynamite into the joint of the arch, under the keystone, where the stone is old and soft. You cut the fuse short. You light it, and you run.

      You are on the second flight of the stair when the vault goes up behind you. The blast throws you forward onto the steps. Brick and stone come down behind you in a long roar that goes on and on, and then the water comes, black and freezing, surging up the stair after you as the sea pours into the broken vaults. You climb ahead of it on your hands and knees, bleeding, deafened, and it follows you up two flights and stops, slopping, a foot below your boots.

      Then silence. The shaft is gone. The arch, the grille, the lower door and whatever breathed behind it are under fifty tons of rubble and the sea.

      You come out of the Hall onto the green with the moon still climbing and the boats still out at the reef. Out there, the singing has stopped. You walk out of Innsmouth along the empty road west, and nobody follows you, and at dawn a milk truck gives you a ride into Rowley.

      That summer the fish leave Innsmouth, and the gold stops. The Hall of Dagon develops a crack from its cellars to its cornice, and is condemned by the county as unsafe. Nobody in Innsmouth objects. Nobody in Innsmouth says anything at all.
    extra:
      - requires: {note: PROMISE}
        text: |
          In September a letter in a careful round hand brings you to a boarding house on Water Street, in Newburyport: her sister's. Ruth is there, and Jonas, who swims in the river every day now and has grown two inches. The Order, Ruth says, had other things to think about this summer. She doesn't thank you. She gives you coffee, and that is better.
      - requires: {note: OATH}
        text: |
          You swore an oath of silence in that hall, and then you brought its cellars down. For a year you sleep with a chair under your doorknob. Nobody comes.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel, with no name on it. In February federal men come up the coast to see what is left of the town, and find less than they expected.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you stand before your mother's hall mirror and look at your eyes. They are wider than they were, and they do not close all the way when you sleep. The skin at the sides of your throat has begun to crease. You dream every night of a city of lights under the sea and of a woman with your grandmother's face at a window. In the dreams she shows you the rubble in the vault, and laughs, gently, and points down: there are other ways up, cousin, for those who are family.
      - text: |
          You took six sticks of dynamite into a church cellar in a town that worshipped the sea, and you came out again. Most people would call that a miracle. In Innsmouth, nobody calls it anything.

  # ----------------------------------------------------- The Marsh supper
  186:
    title: Supper
    effects:
      - unnote: NOON
      - unnote: AFTERNOON
      - unnote: LATE
      - unnote: EVENING
      - san: "1/1D8"
    text: |
      At nine o'clock the candles are lit in the dining room of the white house on Washington Street, and the family sits down to supper.

      It is a long room with dark panelling and the blinds drawn. There are a dozen candles and no other light. Esther Marsh sits at the foot of the table in grey silk and pale gold. Two younger Marshes sit across from you, a man and a woman of about your age, with narrow, handsome faces and large, still eyes. They smile at you a great deal and say very little. A maid with the look brings in the fish.

      At the head of the table, in a high-backed chair turned a little from the candles, sits Barnabas Marsh.

      You can't see much of him. A shape in a black coat, too wide at the shoulders and too narrow at the head. A hand on the tablecloth, grey, the fingers fused together past the second knuckle. And his eyes. They catch the candlelight from the shadow of the chair, round and pale and enormous, and they never close. They have not closed, Esther says quietly, in eleven years. They are looking at you.

      The fish is very good. You don't remember eating it.

      Esther talks. She talks about Paris, where Leonie was sent to school, and about the letters Leonie wrote home from Arkham afterwards, which the family has kept. She has them by her plate, tied with a ribbon. She talks about your grandmother, who came home in 1919. She talks about the city under the reef, the way you might talk about a house in the country: the gardens, the light, the great-aunts and the cousins, everyone you have never met who has been waiting so long to meet you.

      "Stay," she says at last. "You were always ours. You know that. You've known it since you first set foot in Innsmouth."

      At the head of the table, Barnabas Marsh makes a sound in his chest, wet and low. It might be a laugh.
    extra:
      - requires: {note: PARLOUR}
        before: true
        text: |
          You know the house already: the cool hall, the parlour where you took tea, Obed's portrait with your eyes in it. Tonight every door in it stands open, as if the house is showing you that it has nothing to hide.
      - requires: {no_note: PARLOUR}
        before: true
        text: |
          You have never been inside before. The house is white, with a widow's walk and green blinds, and inside it is cool and dim and smells of the sea. Through the open parlour door you see a portrait over the mantel: an old sea captain in a blue coat, with a hard jaw and a heavy, hooded gaze, and your eyes. Obed Marsh. Your great-great-grandfather. You would have known it without being told.
      - requires: {note: ORNE}
        text: |
          You knew, of course. You have known since you first saw Leonie Marsh's name beside Benjamin Orne's. You just hadn't said it to yourself in words. Now you don't need to.
      - text: |
          Esther lays her hand over yours on the white cloth. It is cool, and very soft, and between the fingers there is the faintest beginning of a web.
    choices:
      - text: "Stay."
        to: 189
      - text: "Ask to see the sea door, where your grandmother went down."
        to: 187
      - text: "Excuse yourself, and slip out through the garden."
        roll: {skill: [Stealth, Charm], success: 188, failure: 194}

  187:
    title: The Tunnel
    effects:
      - note: SEADOOR
      - note: TUNNEL
    text: |
      Esther is pleased. She takes a candle and leads you down: through the kitchen, down the cellar stairs, past racks of wine and barrels of salt fish, to a low door in the cellar's seaward wall. Beyond it a tunnel runs off into the dark, brick-lined and dripping, sloping always down.

      You walk a long way. The candle shows you old brick, then older stone, then rock. The air grows cold and salt. At last the tunnel opens into a round vault with a black shaft in its floor.

      "This is where she went down," Esther says. "Your grandmother. And Leonie before her, and Leonie's mother, who was the first." She sets the candle on a ledge. "I'll leave you to say your goodbyes. Take as long as you like. There's no hurry, now. There's never any hurry, after."

      Her footsteps go away up the tunnel. You are alone.
    choices:
      - text: "Look at the shaft."
        to: 178

  188:
    title: The Garden
    text: |
      You excuse yourself. Nobody stops you. You walk down the hall, past the parlour door, where Obed's portrait watches you go, as if you were looking for the washroom, and out through a back door into a garden gone wild, and over the wall, and down through the dark streets toward the river.

      You lie in the reeds by the water for a long time, with the cold mud soaking into your clothes, while the boats come back from the reef one by one and the lanterns start up into the town. You can hear them calling as they climb the hill. They are calling for you, by your name, softly, the way you would call a cat in at night.
    choices:
      - text: "Get up out of the reeds, and move."
        to: 144

  189:
    title: Home
    ending: claimed
    text: |
      It is easier than you would have believed. There is work, of a kind. There are people who nod to you on the street, and touch two fingers to their caps, and call you by your name, and mean it kindly. The town is very kind, once you belong to it. It has nothing else left to be.

      The years go by the way the tide goes out: so slowly you never see it moving, and then the flats are bare. You stop writing letters. You stop blinking, first in the evenings, then all day. Your hats stop fitting. One spring you notice that the skin at the sides of your throat has begun to fold, and that you are breathing through the folds, a little, when you sleep in the bath.

      You don't mind. That is the strangest thing, when you think about it, and you think about it less and less. You don't mind at all.

      One night, years from now, at May-Eve or Hallowe'en, you will walk down Water Street with the others, under the lanterns, past the end of the old Marsh wharf, and down the steps into the black water, and you will not come up. And it will be warm.
    extra:
      - requires: {investigator: genealogist}
        before: true
        text: |
          From that night on you live in the white house on Washington Street, and you never leave it. Esther gives you Leonie's old room, the one that looks over the garden to the sea, and Leonie's letters to read, and her photograph to keep beside your grandmother's. In the evenings Barnabas sits with you in the dark parlour and says nothing, and his huge eyes rest on you like a blessing. You write to your mother in Toledo once, to say you have found the family. You don't write again. She doesn't ask you to.
      - requires: {investigator: [agent, antiquarian, reporter]}
        before: true
        text: |
          They take you down to the vault under the Hall, and the priest in the tiara puts the words in your mouth one at a time, and you say them. The first oath. The second. The third, the one there is no coming back from, with your hands in the black water of the shaft. Something under the water takes your hands, and holds them, and lets them go. After that you live in a room over the fish sheds across the river, and nobody bothers you, and you never once try to leave.
      - requires: {investigator: genealogist}
        text: |
          And when it is your turn to go down, she is there, at the bottom of the steps, under the water, with her arms open. Your grandmother. She looks the way she looked on the porch in Toledo when you were small, and she looks the other way too, the way she really is, and both at once, and you aren't frightened at all. "There you are," she says. "There's my boy. Come home."
      - text: |
          You came to Innsmouth a stranger. You will leave it the way everyone born there leaves it, in the end: through the water, into the dark, and never cold again.

  # ----------------------------------------------------- Walking out
  190:
    title: Out, Now
    text: |
      You don't wait for the moon. You put the Square behind you and walk, fast, with your hands in your pockets and your eyes on the cobbles, the way people walk when they have somewhere to be.

      Nobody stops you. Nobody is about. The doors are shut, the shutters are up, and down on the waterfront the lanterns are moving toward the boats. The last of the light lies red along the tops of the hills to the west.

      At the edge of town the streets give out, and three ways lie open in front of you. The road west to Rowley, along the edge of the marsh, the way the bus goes. The road south over the marsh toward Ipswich, a pale line running off into the dusk. And, if you know where to look, the old railway, its embankment a low dark line across the marsh to the west.
    extra:
      - requires: {note: WATCHED}
        text: |
          Behind you, somewhere in the dusk, a door opens and does not close.
      - text: |
          The marsh is going blue. The first star is out over the sea.
    choices:
      - text: "Follow the old railway west."
        requires: {note: RAILWAY}
        to: 191
      - text: "Walk the Rowley road."
        to: 192
      - text: "Take the Ipswich road south."
        to: 217

  191:
    title: The Line at Dusk
    text: |
      Up Babson Street in the last of the light, past the old station with its boarded windows, and out along the line.

      The rails run west on their low embankment into the marsh, rusty, half sunk in weeds, the ties soft and splintered underfoot. On either side the marsh stretches away flat and grey and full of the sound of water: creeks filling, mud sucking, a heron going up with a croak. The air smells of salt and rot and mint.
    extra:
      - requires: {note: HANDCAR}
        text: |
          On the siding by the old platform, the pump handcar stands where you left it, rust on its handles.
      - text: |
          The light is going fast.
    choices:
      - text: "Pump the handcar west."
        requires: {note: HANDCAR}
        to: 202
      - text: "Walk on, along the ties."
        to: 232

  232:
    title: Moonrise on the Line
    text: |
      Behind you, the moon comes up out of the sea. It comes up red, enormous, behind Devil Reef, and lays a road of copper across the water and the marsh, right up to your heels, as if it were following you.

      Then the singing starts, far away, on the reef.

      You walk faster. The line runs out over a creek on an old trestle, its timbers grey and gapped, the water black and moving underneath. You cross it on the ties, one at a time, not looking down, and go on into the marsh.

      After a while the town is a few dark roofs behind you and a glow of lanterns by the sea. Ahead, the line runs on west toward a darker place where the ground rises a little and the brush grows thick along the rails: the cut, where the Rowley road crosses the line.
    extra:
      - text: |
          Behind you, a long way off, a sound like many feet slapping on a road. Somebody saw you go.
    choices:
      - text: "Walk on."
        to: 205

  192:
    title: The Rowley Road
    text: |
      The Rowley road runs west out of town along the edge of the marsh, a strip of rutted dirt between ditches full of black water. You walk on the crown of it, fast. The light goes. The moon comes up behind you, red, and your shadow runs out ahead of you along the road, very long.

      You have gone a mile when you hear the motor.

      It comes up behind you from the town, not fast. No headlamps. When you look back you can see it against the moonlit water: a long black car, the kind with blinds on the rear windows, rolling toward you at a walking pace. It has seen you. It doesn't hurry.

      On your left the ditch, and beyond it, the open marsh, silver and black and going on for miles.
    choices:
      - text: "Get off the road, and into the marsh."
        to: 214
      - text: "Stand at the side of the road, and let it pass."
        roll: {skill: [Psychology, Fast Talk], success: 193, failure: 194}

  193:
    title: Let It Pass
    text: |
      You step to the side of the road and stand there, hat in hand, like a farmhand waiting for the squire to go by.

      The car draws level, and slows, and stops. A rear blind goes up an inch. You can see nothing behind it but darkness, and two pale points that might be eyes. You look back, mildly. You think about nothing. You are a traveller on a road at night, going to Rowley, on business of your own.

      The blind comes down. The car rolls on, and turns round in the road a little way ahead, and goes back the way it came, toward the town, without hurrying.

      You walk. You walk for what feels like all night, with the singing on the reef behind you fading and the marsh breathing on either side, and come into Rowley in the small hours.
    choices:
      - text: "Wait for the first train."
        to: 220

  # ----------------------------------------------------- Captured
  194:
    title: Taken
    effects:
      - lose: revolver
      - lose: dynamite
      - lose: camera
      - lose: ledger
      - lose: register
      - lose: sign-stone
      - lose: robe
      - lose: gold
      - lose: map
      - lose: whiskey
      - lose: badge
      - lose: crowbar
      - lose: handcuffs
      - unnote: PLATE
      - unnote: PRIEST
      - unnote: ELIOT
    text: |
      They don't hurt you much. They don't need to. Hands, cold and many. A sack over your head that stinks of fish. A long, stumbling walk, downhill, and a door, and stairs, and the sound of rushing water getting louder.

      When they take the sack off, you are in a cellar room at water level, deeper in than any room you saw by day, with a stone floor and walls that sweat. A furnace hums somewhere overhead. One wall is an iron grate, and beyond the grate a tunnel, black, with the river moving through it fast and cold. They have taken everything from your pockets that might be any use.

      You are not alone. A fisherman from Kingsport, by his talk, sits against the wall with his knees drawn up, and has been here since June. A girl from Rowley, no more than sixteen, who walked out with an Innsmouth boy in May, lies on a pile of sacking with her face to the wall and doesn't speak.

      "They're keeping us," the fisherman says. "For October. Hallowe'en. They feed you good. That's how you know."
    choices:
      - text: "Sit down with your back to the wall, and listen to the river."
        to: 195

  195:
    title: The Sluice Room
    text: |
      The night goes by in pieces.

      The fisherman's name is Asa Hatch, out of Kingsport. He came round Cape Ann in June looking for the cod everybody said were running off Innsmouth, and put into the harbour for water, and woke up here. He talks in a low, steady voice, the way you talk to a horse in a burning barn. He has a wife in Kingsport. He has stopped expecting to see her.

      The girl from Rowley doesn't speak at all. Once, when the lantern gutters, you see that she is looking at the grate, and that her eyes are not as round as the others' yet, but they are getting there.

      Twice in the night something swims past in the tunnel beyond the grate, against the current, slowly, and turns its head to look in at you as it goes. The second time, it stops. It holds on to the bars with long grey fingers and looks at you for a long time, and then lets go, and the current takes it away.
    extra:
      - requires: {investigator: genealogist}
        text: |
          They are gentler with you than with the others. Toward morning Esther Marsh comes down the stairs with a blanket and a bowl of chowder and sits with you a while, and talks about the family. You are not for the knife, she says. You are for the oath. Hallowe'en, with the boy from across the river. It will be lovely. You'll see.
      - text: |
          The fisherman watches the grate. "Bolts are rusted," he says, very low. "I'm not strong enough no more. Maybe you are."
    choices:
      - text: "Work the grate's bolts loose."
        roll: {skill: [STR, Mechanical Repair], success: 197, failure: 196}
      - text: "Swear whatever they ask of you, to live."
        to: 189
      - text: "Wait, and hope for a better chance."
        to: 198

  196:
    title: The Bolt Holds
    effects:
      - hp: "-1"
    text: |
      You work at it until your fingers bleed and your nails split. One bolt turns a quarter of an inch, and stops, and will not turn again.

      Feet on the stairs. A lantern at the little window in the door. A round, pale eye looks in at you, and at the grate, for a long moment. Then the lantern goes away again.

      Asa Hatch lets out his breath. "Dawn's two hours off," he says. "They change the man on the door at dawn. You got one more try in you, maybe. Maybe not."
    choices:
      - text: "Try once more, with everything you have."
        roll: {skill: [STR, CON], difficulty: hard, success: 197, failure: 198}
      - text: "Swear whatever they ask of you, to live."
        to: 189
      - text: "Let it go. Wait for October."
        to: 198

  197:
    title: The River
    effects:
      - hp: "-1D4"
      - unnote: BOAT
    text: |
      It takes a long time. Your hands bleed. The fisherman holds the lantern and the girl from Rowley watches from her sacking with eyes like holes. Then one bolt snaps, and the next turns, and the grate swings in, and the river roars at you out of the dark.

      "Up," the fisherman says. "Up, not down. Never down." He won't come. He says he's too old to swim, and anyway, they'd know. The girl won't come either. She has turned back to the wall.

      You go into the water. It takes you at once, cold enough to stop your heart, and throws you along the tunnel in the black, and something brushes your leg and goes past, and then there is a grey light ahead, and noise, and you come out under a waterfall into the river below the mill and fetch up, half drowned, on the stones of the bank.

      Above you the town is full of lanterns.
    choices:
      - text: "Crawl up into the dark streets."
        to: 144

  198:
    title: Hallowe'en
    ending: lost
    text: |
      They keep you all summer.

      They feed you well. That is how you know. Chowder, and bread, and fish, always fish. The fisherman from Kingsport is taken upstairs in August and does not come down. The girl from Rowley stops eating and is taken in September. Others come, and go. You scratch the days on the wall with a nail, and then you lose count, and then you stop caring about the count, and listen to the river.

      On the last night of October they come for you with lanterns and robes, and wash you, and dress you in white, and walk you down Water Street with the whole town behind you singing. The boats are waiting. The reef stands black out of the sea under a cold moon. The priest in the gold tiara is standing on its highest rock, and the water all round the reef is moving, full, alive, as far as you can see.

      They row you out.

      The last thing you see of Innsmouth is the three steeples against the stars, and a lit window in a white house on the hill, and someone standing in it, watching. Then you are on the rocks, and the chant is all around you, and the water at your feet rises, and rises, and reaches for you with a hundred hands.
    extra:
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          On the reef that night there is a boy of twelve in white a little way off, waiting for his oath, with his eyes wide and shining. Jonas. You promised his mother. He looks at you once, and looks away.
      - requires: {investigator: genealogist}
        text: |
          But it is not the knife, for you. It was never going to be. The priest lays his grey hands on your head and says the words of the third oath, and you say them back, and the water takes you down, gently, into the warm dark, and opens your eyes. A woman with your grandmother's face is waiting at the bottom, in the light. You are home. That is the worst of it. You are glad.
      - text: |
          You came to Innsmouth to look. Innsmouth looked back, and kept you for October.

  # ================================================================== ACT FOUR: THE WAY OUT
  # ----------------------------------------------------- The Square at night
  199:
    title: The Moonlit Square
    effects:
      - san: "0/1D3"
    text: |
      There is no way round it. Every lane that leads toward Babson Street and the old station opens first onto the Square, and the two you try have lanterns at their far ends. You come out at last at the Square's north corner, and stand very still in the shadow of a doorway.

      The moon is high and white. It turns the cobbles to bone. The Gilman House is a black shape against the sky with every window lit, and the cupola on top like a hat on a corpse.

      The hunters are gathering on its steps. Forty of them, perhaps more. Some carry lanterns and some carry boat-hooks, and one or two carry nothing at all, because their hands are no longer made for carrying. Nobody shouts. They mutter, a low, wet croaking that rises and falls like frogs in a ditch at dusk. More come up out of Federal Street while you watch, and more out of Paine Street. None of them hurries.

      They walk the way the town walks. You have seen it all day without quite seeing it: a lurch and a shuffle, the head carried low and forward, the feet set down flat and heavy, as if the ground were further off than it looks. In a crowd, by moonlight, it is unmistakable.

      The Square is eighty yards across. Babson Street leaves it from the far corner, past the shuttered drug store, and climbs into the dark toward the station.

      A lantern swings toward you. Its light slides over the cobbles six feet from your boots, and moves on.
    extra:
      - requires: {investigator: genealogist}
        text: |
          You watch the way they walk, and your knees understand it before your head does: that loose, rolling set of the hips, that flat and heavy foot. It would be easy. It would be the easiest thing in the world.
      - text: |
          You will have to cross it. Walking, not running. Nobody in Innsmouth runs.
    choices:
      - text: "Pull the grey robe over your head, and walk."
        requires: {item: robe}
        to: 201
      - text: "Walk across as if you belong here."
        requires: {investigator: genealogist}
        to: 201
      - text: "Walk across slowly, the way they walk."
        roll: {skill: [Stealth, POW], success: 201, failure: 200}

  200:
    title: Run
    text: |
      Halfway across, a lantern stops. A head turns, low and slow, and the croaking stops with it.

      Then they are all turning. You run. A handcart lies on its side across the mouth of Babson Street.
    choices:
      - text: "Go over the cart, and up the hill, and don't look back."
        roll: {skill: [DEX, Jump], success: 201, failure: 194}

  # ----------------------------------------------------- The line
  201:
    title: The Line West
    text: |
      Babson Street climbs between empty houses whose doors stand open on the dark. Nobody follows you up it. Nobody you can see.

      At the top, the old station sits in the moonlight with its windows boarded and its platform sagging, like an animal that lay down to die and was forgotten. Beyond it the rails run west out of the town, two thin lines of silver going into the marsh.

      Down in the town behind you a sound goes up: not a shout, but a long, wet bark, taken up by many throats. They know you've gone.
    choices:
      - text: "Throw your weight on the handcar, and pump it west."
        requires: {note: HANDCAR}
        to: 202
      - text: "Walk the line, as fast as the ties allow."
        to: 203

  202:
    title: The Handcar
    effects:
      - san: "0/1D3"
    text: |
      The handle groans, then gives, then rises and falls like a pump in a dry well. The wheels shriek on the rails. The handcar rolls, and gathers speed, and the old station falls away behind you.

      The noise is terrible. It carries over the marsh like a church bell. You pump harder.

      A mile out, you hear the other noise. Something is coming along the ties behind you, slap, slap, slap, in long hops, faster than a man can run. You don't look round. You pump until your shoulders burn and your breath saws in your throat, and the slapping falls back, and falls back, and stops.

      The cut goes by in a rush of brambles and shadow. Nothing is waiting in it. Not yet. The road across its far end is empty and white.

      The rails run on west. Three miles further, the handcar runs out of slope and you run out of strength at the same moment, and it coasts to a stop a little short of the old junction. You climb down on legs that shake, and walk the last half mile into Rowley, and sit out the rest of the night on the depot bench.
    choices:
      - text: "Wait for the light."
        to: 220

  203:
    title: The Trestle
    text: |
      West of the station the line crosses a creek on sixty feet of black trestle. Some of the ties are gone. The rest are soft as cake.

      Below, the tide runs black and silent. Behind you, lanterns move in the town.
    choices:
      - text: "Cross on the ties, one at a time."
        roll: {skill: [DEX, Climb], success: 205, failure: 204}

  204:
    title: The Creek
    effects:
      - hp: "-1D3"
    text: |
      A tie breaks under your foot like wet bread. You go through, strike a cross-beam, and drop into the creek. The water closes over your head.
    extra:
      - requires: {investigator: genealogist}
        text: |
          It isn't cold. It has never been cold, not for you. For a long moment you hang in the black water, quite calm, and you do not want to come up.
      - text: |
          The current drags you fifty yards before you fetch up against the bank. You haul yourself out through the mud, and climb back onto the embankment on the far side. Soaked, bruised and shaking, you walk on.
    choices:
      - text: "Follow the line west."
        to: 205

  # ----------------------------------------------------- The cut
  205:
    title: The Cut
    effects:
      - san: "0/1"
    text: |
      Beyond the creek the line runs out over the marsh on its low embankment, straight as a ruled line. The moon is up. The salt grass is silver on both sides, and the creeks shine in it like dropped wire. You walk on the ties, because the cinders between them crunch.

      Two miles out, the embankment sinks into a low rise of sandy ground, and the rails run into the cut: a shallow trench with banks a little higher than your head, choked with brambles and sumac. At its far end the Rowley road crosses the line on the level, a pale strip of dust between two black hedges.

      You are halfway through the cut when you hear it.

      It comes along the Rowley road from the direction of the town. At first it sounds like a great many people walking in wet boots. Then it doesn't. There is a slap, slap, slap under it, flat and heavy, like paddles on a wet floor. Over it all is a croaking that rises and falls and rises again, in something that is almost a tune.

      You get into the brambles. Thorns go through your sleeves and into your arms. You lie on your face in the sand with the sumac over your head, and the sound comes on.

      They have come out after you. You know it the way you know your own name. They are coming along the road, and the road crosses the line forty feet from where you lie.

      The smell reaches you first: fish, and the floor of the harbour at low tide, and something under both, like a cellar that has flooded and dried and flooded again.
    extra:
      - requires: {note: OATH}
        text: |
          Under your breastbone, the oath you swore at the Hall stirs like a hook taking hold. It knows them. You have the sudden, sick certainty that they would know you too.
      - text: |
          Then the first of them comes over the rise and into the moonlight at the crossing.
    choices:
      - text: "Shut your eyes, and keep them shut until they've passed."
        to: 206
      - text: "Look."
        to: 207
      - text: "Photograph them by moonlight."
        requires: {item: camera, skill: "Art/Craft (Photography)", min: 40}
        roll: {skill: "Art/Craft (Photography)", success: 208, failure: 209}
      - text: "Hold the old sign stone up in front of you."
        requires: {item: sign-stone}
        to: 211
      - text: "Scratch the old sign in the sand in front of your face."
        requires: [{any: [{note: SIGN}, {item: library-notes}]}, {no_item: sign-stone}]
        to: 211
      - text: "Fire into them."
        requires: {item: revolver}
        to: 212
      - text: "Step out of the brambles, and fall in step with them."
        to: 213

  206:
    title: Eyes Shut
    effects:
      - san: "0/1D3"
    text: |
      You press your face into the sand, and shut your eyes, and keep them shut.

      It takes a long time to pass. Longer than you would have believed. The slapping comes level with the cut and goes on, and on, and the croaking with it, and under the croaking, now and then, a word of English. You hear them cross the rails: flat feet on wood, something scraping on iron. Once, something stops at the lip of the cut, right above you, and breathes. It breathes for a long time. Then it goes on.

      When the sound is gone at last, the moon has moved a hand's breadth across the sky. You get up, and pick the thorns out of your arms, and walk west along the line toward Rowley.

      You don't look at the road when you cross it. You don't look at what they left in the dust.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  207:
    title: You Look
    effects:
      - san: "1/1D8"
    text: |
      You look.

      They come over the rise in the moonlight, and they keep coming. Hundreds of them. Most of them hop, on long legs folded like a frog's. Some walk upright, some go on all fours, and a few drag themselves. Their skin is grey-green and wet, and their bellies are as white as a fish's. Their heads are the heads of fish, or frogs, or something between, with great round eyes that never close, and the sides of their necks open and shut in ridges as they breathe. Some wear rags of grey robes. One wears a tall crown of pale gold that catches the moon.

      Among them, here and there, walk men and women in ordinary clothes. They walk the way the town walks. You know one or two of them from the streets of Innsmouth.

      They croak to one another as they go. Some of it is almost words.

      They cross the rails forty feet from your face. It takes the best part of an hour. You don't blink. You find, afterwards, that you couldn't have.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Near the front, hopping and not walking, goes a man in a bus driver's cap. Near the back goes a woman with a narrow head and huge, heavy-lidded eyes, and a brooch of pale gold pinned to the rag at her throat. She looks a little like the photograph in your pocket. She looks a great deal like your grandmother would look, if your grandmother had spent eight years in the sea. As she passes the cut she turns her head, and looks straight at the bramble where you lie, and smiles.
      - text: |
          When they have gone, you get up and walk west along the line to Rowley. Your legs carry you. That is all you can say for them.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  208:
    title: A Plate in Moonlight
    effects:
      - note: PLATE
    text: |
      No flash. Not here. You brace the Graflex on the rail with your elbows in the sand, open the shutter, and leave it open.

      Most of them will be a smear on the plate, a grey river of movement. But at the crossing the one in the gold crown stops, and stands quite still, and turns its great head to look back along the road for its stragglers. It stands like that for a long minute, as still as a statue in the moonlight. The shutter is open the whole time.

      You close it, and slide the plate home, and lie still until the last of them has gone. Then you walk to Rowley with the camera held against your chest like a baby.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  209:
    title: The Flash
    effects:
      - note: PLATE
    text: |
      The moon isn't enough. You know it, and you do it anyway: powder in the pan, your thumb on the trigger.

      The magnesium goes off like the end of the world. For one white instant the whole road is lit: hundreds of wet grey faces, all turned toward you.

      You have your picture. Then you run.
    choices:
      - text: "Run for the marsh."
        to: 210

  210:
    title: Into the Marsh
    effects:
      - hp: "-1D2"
    text: |
      Out through the brambles and down onto the marsh. Behind you the croaking has become a roar, and the slapping spreads through the grass on both sides, like beaters at a hunt.

      Creeks, mud, grass over your head. You run, and fall, and run.
    choices:
      - text: "Run, and swim the creeks where you have to."
        roll: {skill: [DEX, Swim], success: 215, failure: 214}

  211:
    title: They Go Round
    effects:
      - san: "0/1D3"
    extra:
      - requires: {item: sign-stone}
        before: true
        text: |
          You get up on your knees in the brambles, and hold the stone up in both hands in the moonlight, with the star toward the road.
      - requires: {no_item: sign-stone}
        before: true
        text: |
          You scratch it in the sand in front of your face with a stick: five points, and the flame in its heart. Your hand shakes. You go over the lines twice.
      - requires: {item: sign-stone}
        text: |
          You keep the stone in your hand, star outward.
      - requires: {no_item: sign-stone}
        text: |
          You leave the sign in the sand behind you. You hope it lasts until morning.
      - text: |
          Then you walk west along the line toward Rowley, and you don't stop until you're there.
    text: |
      The procession comes level with the end of the cut, and stops.

      The croaking dies. In the silence you can hear them breathing, hundreds of them, a wet rasp like surf drawing back over shingle. The front rank stands at the crossing with their great round eyes turned toward you. One of them takes a hop forward, and stops, and makes a small sound, almost a whimper.

      Then they go round. They leave the road and go out across the marsh in a long curve, through the creeks and the grass, a quarter of a mile wide of you, and come back onto the road far off to the west. It takes them an hour. Not one of them comes any nearer.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  212:
    title: Six Shots
    ending: death
    text: |
      You come up on one knee in the brambles and fire into the crossing. You fire until the hammer clicks on nothing. In the moonlight you can't see where the bullets go. Something squeals. Something falls, and gets up again.

      The croaking stops.

      Then the whole procession turns off the road together, the way a flock of birds turns, and comes down into the cut.

      There are a great many of them. There were always going to be a great many of them.
    extra:
      - text: |
          You emptied a revolver into a procession of several hundred. You were a sergeant in France. You knew better.

  213:
    title: Fell in Step
    ending: claimed
    text: |
      You don't decide to do it. You find that you are standing up, and pushing out through the brambles, and climbing the bank onto the road.

      Nobody stops you. The nearest of them turns its great wet head and looks at you, and makes room.

      The rhythm takes you at once. Hop and slap, hop and slap, the croaking rising and falling all around you, until you find that you are croaking too, and it isn't hard at all. Your shoes come off somewhere in the first mile. You don't miss them.

      Toward dawn the procession turns and goes back across the marsh toward the sea, and you go with it. You go down Water Street in the grey light with the others, past the empty warehouses, and out along the breakwater. Nobody on the breakwater looks surprised.

      Weeks later a clam-digger finds a pair of shoes in the dust of the Rowley road, set neatly side by side, and takes them home. They fit him. He has bad dreams in them, and throws them in the river.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Halfway to the sea a woman falls in beside you. Her head is narrow and her eyes are huge, and there is a brooch of pale gold at her throat. You know her face from a photograph you have carried for eight years. She takes your hand in hers. Her hand is cool and webbed and very gentle, and she doesn't let go all the way to the water.
      - text: |
          They came out to hunt you down. You saved them the trouble.

  # ----------------------------------------------------- The marsh
  214:
    title: The Salt Marsh
    text: |
      The marsh goes on for ever. Salt grass over your head, then mud to the knee, then a creek, black and fast, then more grass. Every creek you cross brings you to another. You can't see enough of the sky to steer by.

      The water is rising, or the ground is sinking; you can't tell which. You can hear it before you see it, a soft, spreading chuckle in the grass all around you. The mud gives way to water, and the water is at your shins, and then at your knees. Somewhere off to your left something heavy slides into a creek and is quiet.

      Far off, there is a light. A farm, perhaps. Perhaps not.
    choices:
      - text: "Find higher ground before the water finds you."
        roll: {skill: [Spot Hidden, POW], success: 215, failure: 216}

  215:
    title: Higher Ground
    text: |
      The ground rises, and goes on rising: a hummock, a field, a rutted farm track. You sit down on it, shaking, until the sky goes grey.

      A dog barks. A signpost at the end of the track says IPSWICH 2 MI. You walk.
    choices:
      - text: "Walk into Ipswich."
        to: 221

  216:
    title: The Salt Marsh
    ending: lost
    text: |
      You find a hummock and climb onto it, and the water comes up round it, and over it. You stand. The water comes to your waist, and then to your chest. The grass goes under. There is nothing in any direction but moonlight on water, and the dark line of the land much too far away.

      Things move in the water. They are in no hurry. They know the tides better than you do.

      In August a clam-digger from Rowley finds a coat caught on a stake in the middle of the marsh, with a notebook in its pocket swollen to twice its size and quite unreadable. He takes it to the constable, who writes it down. Nobody ever claims it.
    extra:
      - requires: {investigator: genealogist}
        text: |
          The water isn't cold. It has never been cold, not for you. When it closes over your head you find that you are not afraid, and that you can see quite well, and that something is waiting for you a little way off with your grandmother's face. You go to her.
      - text: |
          The marsh keeps what it takes. So does the sea it belongs to.

  # ----------------------------------------------------- The Ipswich road
  217:
    title: The Ipswich Road
    text: |
      The Ipswich road runs south out of the town across the marsh on a raised bank of white dust, with the salt grass whispering on both sides. There is nobody on it. There is nowhere on it to hide.

      A mile out it crosses a creek on a little wooden bridge. A lantern hangs from the rail. Two men stand under it, young men in fishermen's jerseys, with a shotgun broken over one man's arm. Their heads are a little narrow and their eyes a little round. They are not far gone yet. They are watching the road from the town.

      They have seen you. One of them lifts the lantern.
    choices:
      - text: "Pull up the hood of the grey robe, and walk straight at them."
        requires: {item: robe}
        to: 218
      - text: "Draw your revolver, and walk straight at them."
        requires: {item: revolver}
        to: 218
      - text: "Walk up to them, and bluff your way past."
        roll: {skill: [Fast Talk, Intimidate, Persuade], success: 218, failure: 194}
      - text: "Get off the road, and go round through the marsh."
        to: 214

  218:
    title: Over the Bridge
    text: |
      They step aside. You walk past them onto the bridge, close enough to smell the fish on their jerseys, and on into the dark.

      You feel their round eyes on your back for a long time. Nobody follows. There is only the one road.
    choices:
      - text: "Keep walking south."
        to: 221

  # ----------------------------------------------------- The first bus
  219:
    title: The First Bus
    text: |
      Grey light, and gulls. Innsmouth after the night looks like a town after a flood: shutters closed, doors shut, a lantern guttering out on a doorstep where somebody set it down and forgot it. On the cobbles of the Square, wet prints are drying, broad and flat and webbed, hundreds of them, all going toward the sea.

      At half past six Joe Sargent's bus stands at the Gilman House steps with its engine running. There is nothing wrong with it now.

      Joe sits at the wheel. He watches you climb aboard, and he doesn't blink, and he doesn't speak. He knows. He must know. He takes your fare, and gives you your change, and puts the bus in gear.

      Innsmouth doesn't do its work by daylight.
    extra:
      - requires: {note: RUTH}
        text: |
          Ruth Eliot climbs aboard behind you with a carpet bag and a face like a shut door, and Jonas behind her, holding her coat. Joe Sargent looks at the boy for a long moment. Then he looks at the road.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. You get on the bus without him.
      - requires: {note: RAN}
        text: |
          Joe Sargent's wrist is rubbed raw where your cuff was. He takes your fare with the other hand.
      - requires: {investigator: genealogist}
        text: |
          As you sit down he speaks, for the only time. "Ye'll be back," he says. It isn't a threat. It's worse than a threat. It sounds like comfort.
      - requires: {note: WATCHED}
        text: |
          All the way up the hill his eyes stay on you in the mirror. Wet, blue, round. They never once go back to the road.
      - text: |
          The bus climbs to the crest, and Innsmouth drops away behind it, roofs and steeples and the black reef far out on a silver sea, until there is nothing behind you but the marsh.
    choices:
      - text: "Ride it out to Newburyport."
        to: 223

  # ================================================================== DAWN
  220:
    title: Rowley
    effects:
      - note: ROWLEY
    text: |
      Rowley at the end of the night is a white church, a store with its blinds down, and a smell of cut hay. Nobody is about. A rooster crows somewhere, and then thinks better of it.

      The Boston and Maine depot stands at the end of the street. You sit on its bench and watch the sky go grey, then pink, then a plain summer blue. Your hands won't keep still. You sit on them.

      At a quarter to six the stationmaster comes to unlock, a thin man in sleeve garters. He looks at your clothes, and your face, and whatever is in your eyes, and asks no questions at all. There is a telephone on the wall of his office. The first train for Boston is the ten past six.
    choices:
      - text: "Ask for his telephone, and put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Take the ten past six, and go home."
        to: 226

  221:
    title: Ipswich
    effects:
      - note: IPSWICH
    text: |
      You have lost count of the hours. You walked, and lay in the ditch when anything moved, and walked again, and at last the marsh gave way to stone walls and orchards and the backs of barns.

      Ipswich at dawn is elms and white clapboard and a milk wagon going by with its horse asleep on its feet. The driver stares at you. You look down at yourself, and see why.

      On the green stands a brick police station with a lamp still burning over its door. Beyond it is a street of ordinary houses, with ordinary people asleep in them who have never once in their lives thought about the sea.
    choices:
      - text: "Walk into the police station, and put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Go home."
        to: 226

  222:
    title: Plum Island
    effects:
      - note: ATSEA
    text: |
      Dawn comes up out of the sea behind you, red, then gold. It lights the long white dunes of Plum Island ahead, and the gulls wheeling over them, and the spray on the bar.

      You look back once. Far to the south, Devil Reef is a black line on the water, and beyond it the roofs of Innsmouth catch the first sun, small and grey and harmless, like a town in a picture.

      Your clothes are stiff with salt. The boat rides the swell under you, and every time something brushes the hull you stop breathing, and every time it is only weed.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea won't take the *Lady Ellen* over the Merrimack bar in the dark, not after this night. He lies off Plum Island with the engine stopped until there is light to see by, smoking, and won't talk. At first light he noses her in toward the beach.
      - requires: {no_note: BOAT}
        text: |
          Your hands are raw from the oars.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth rows. She hasn't stopped rowing since the harbour mouth. Jonas is asleep in the bow with his cheek on his hands, and once, in his sleep, he laughs.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth rows. She hasn't stopped rowing since the harbour mouth, and she hasn't spoken. The place in the bow where Jonas sat is empty.
      - requires: {note: CALLED}
        text: |
          A grey shape comes down on you out of the morning: the Coast Guard cutter that lay off the harbour mouth all night, with a number on her bow and men at her rail. They throw you a line. Her captain is a young man with old eyes. He doesn't ask what you were running from. His lookouts were on deck all night. They saw the lanterns on the reef, and the swimmers round it.
      - requires: [{note: BOAT}, {note: CALLED}]
        text: |
          Shea sees the cutter and swears, long and low, and doesn't try to run. The captain looks at his crates, and at your face, and decides he has bigger things to think about this morning.
      - text: |
          Whatever you do next, you will do it with something solid under your feet.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell the cutter's captain what his own lookouts saw last night."
        requires: [{note: CALLED}, {no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}, {no_note: CALLED}]
        to: 225
      - text: "Take Ruth and Jonas to her sister's door."
        requires: [{note: RUTH}, {no_note: SWAM}]
        to: 228
      - text: "Take Ruth to her sister's door."
        requires: [{note: RUTH}, {note: SWAM}]
        to: 228
      - text: "Tell nobody anything. Go home."
        to: 226

  223:
    title: Newburyport
    effects:
      - note: NEWBURYPORT
    text: |
      At a quarter past seven the bus pulls up on Market Square in Newburyport, in front of Hammond's Drug Store. Joe Sargent opens the door, and sits looking at his windshield until you are down.

      Newburyport is waking up. A boy goes by with newspapers. A woman is washing her front step. A dray clatters past full of milk cans, and the driver is whistling.

      Down the hill, at the railway station, the ticket agent is rolling up the blind on his window. He sees you, and stops with his hand on the cord, and looks at you for a long moment. Then he finishes rolling up the blind.
    extra:
      - requires: {note: RUTH}
        text: |
          Ruth and Jonas climb down behind you. Ruth stands on the cobbles and looks round at the ordinary morning as if she has never seen one before.
      - text: |
          Behind you, the bus pulls away, back the way it came.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Take Ruth and Jonas to her sister's door."
        requires: {note: RUTH}
        to: 228
      - text: "Tell nobody anything. Go home."
        to: 226

  # ================================================================== SHARED ENDINGS
  224:
    title: The Raid
    ending: triumph
    text: |
      You tell it from the beginning. Then you tell it again, and then a third time, to a man in a good grey suit who has come up from Boston on the morning train and writes nothing down.

      They thank you. They tell you to go home and say nothing to anyone, and you do.

      All that summer nothing happens. The bus runs twice a day. You read the papers and find nothing, and begin to wonder whether anybody heard you at all.

      Then, in February, the papers are full of it, and say almost nothing. Federal agents have raided a decayed seaport on the North Shore. There have been arrests, a great many arrests, and no trials. The prisoners have gone to naval prisons and army camps, and nobody is allowed to see them. Whole streets of empty houses along the old waterfront have been burned and dynamited, "with every precaution", as if empty houses were dangerous.

      What the papers don't print, you hear later from a man who heard it from a sailor. On the night of the raid a submarine lay off Devil Reef, and fired torpedoes straight down into the deep water beyond it, one after another, until the sea boiled white.
    extra:
      - requires: [{note: ARKHAM}, {note: PRISONER}]
        before: true
        text: |
          Inside police headquarters, Joe Sargent sits cuffed to a radiator, humming.
      - requires: [{note: ARKHAM}, {no_note: PRISONER}]
        before: true
        text: |
          You climb down from the last bus in Arkham at half past nine, and watch it pull away, and walk to police headquarters with what you carry held tight against you.
      - requires: {note: ROWLEY}
        before: true
        text: |
          You telephone the State Police from the stationmaster's office in Rowley. A car comes for you inside the hour.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          At seven in the evening, with Eddie Pratt beside you twisting his cap in his hands, you walk into the police station on the Ipswich green.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          The lamp is still burning over the police station on the Ipswich green when you push open its door.
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          You tell it first in the cutter's wardroom, over coffee you can't hold steady.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          You come ashore on Plum Island and walk the beach to the Coast Guard station, and tell it there first.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          You tell it first to the ticket agent, because he is there, and because he listens. Then he locks his window and walks you up to the police himself.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        before: true
        text: |
          You put what you carry on the table. Without it you would be one more crank with a story about Innsmouth; there have been a few over the years. With it there, nobody laughs.
      - requires: [{note: CALLED}, {no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        before: true
        text: |
          The captain sends for his log. His lookouts saw what you saw, and nobody laughs at a ship's log.
      - requires: {item: ledger}
        text: |
          The Treasury men take the ledger. In March the Marsh Refining Company goes into receivership. Its furnace goes cold, and no more little bars of pale gold turn up in Boston.
      - requires: {item: register}
        text: |
          The register goes to the Attorney General. Someone who shouldn't tell you tells you that he read the names aloud in his office one evening, every one of them, from 1840 to this year, and that it took him an hour.
      - requires: {note: PLATE}
        text: |
          The Navy takes your plate. The Gazette runs your story in March, on page one, without a picture, under a headline you didn't write. You kept a print. You keep it face down in a drawer.
      - requires: {note: PRISONER}
        text: |
          Joe Sargent spends the rest of that summer in a cell in Arkham. He never asks for a lawyer, never eats, and never once blinks. In October the jailer finds the cell empty and the floor wet, and the bars on the window just as they were.
      - requires: {note: CALLED}
        text: |
          The cutter's log for the night of the fifteenth, which you are never meant to see, records lights on Devil Reef from moonrise until one in the morning, and "swimmers, in numbers, of unusual size".
      - requires: {note: TIARA}
        text: |
          In March a quiet man from Washington calls on Miss Anna Tilton at the Newburyport Historical Society and asks to see the tiara. She tells him it is pirate gold. He doesn't argue. He asks whether the Society would lend it to the government, indefinitely, and she tells him certainly not.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          At Christmas a card comes from Newburyport in a hard, upright hand. Ruth Eliot is mending nets for the boats on the Merrimack. Jonas is at school. He swims every day, she writes, even in December, and she lets him.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          At Christmas a card comes from Newburyport in a hard, upright hand. Ruth Eliot is mending nets for the boats on the Merrimack. She doesn't mention Jonas. Under her name she has drawn a star with a flame in its heart.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. The papers print no names. You never find out what became of the Eliots, and you are afraid to ask.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at your door at one in the morning. When you open it there is nobody there, only wet prints on the step, broad and flat, going away. You swore an oath at the Hall of Dagon. They haven't forgotten.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you begin to see it in the shaving mirror. Your eyes, always a little heavy-lidded, like your grandmother's, are rounder than they were, and they water, and you blink less. Two faint creases have come at the sides of your neck. You stop swimming in the lake, because you stay under too long and people stare. And every night now you dream of green water, and a city of lights below a black reef, and a woman with your grandmother's face waiting at the foot of a long stair. They fired their torpedoes into the deep beyond Devil Reef. In your dreams the city is still there. It is very old and very large, and it was hardly scratched. It is waiting for you.
      - text: |
          On clear days you can still see Devil Reef from the crest of the Newburyport road. You never go and look.

  225:
    title: Nobody Believes You
    ending: lost
    text: |
      They listen. People always listen to a story about Innsmouth. They write it down, and thank you, and ask whether you've had anything to eat, and whether there is someone they can wire.

      You tell it again at home, to people who matter, and they listen too.

      Without proof, it is a story. Innsmouth has had stories told about it for eighty years, and nobody has ever done anything about a single one of them.
    extra:
      - requires: {note: ARKHAM}
        before: true
        text: |
          At half past nine at night a desk sergeant at Arkham police headquarters writes it all down, slowly, licking his pencil.
      - requires: {note: ROWLEY}
        before: true
        text: |
          The Rowley constable is fetched out of bed. He listens on the depot bench in his braces.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          At seven in the evening, with Eddie Pratt waiting outside on the green, you tell it to the desk sergeant at the Ipswich police station.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          At the Ipswich police station a sergeant with egg on his tie writes it all down.
      - requires: {note: ATSEA}
        before: true
        text: |
          You come ashore on Plum Island and tell it at the Coast Guard station, to a boatswain who has heard stories about Innsmouth before.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          The ticket agent hears all of it. Then he walks you up to the police.
      - requires: {investigator: agent}
        text: |
          Your chief in Boston reads your report twice, and asks you whether you have been drinking the evidence. In September you are transferred to Duluth.
      - requires: {investigator: antiquarian}
        text: |
          The president of Miskatonic hears you out in his study, kindly, and suggests a sabbatical, for your health. You take it in Switzerland, as far from any sea as you can get, and find that you can still smell it.
      - requires: {investigator: reporter}
        text: |
          Your editor at the Gazette reads three pages and spikes it. "We're a newspaper, Fenn. Not the Sunday supplement." In the end you sell it to a pulp magazine, as fiction, for eleven dollars.
      - requires: {investigator: genealogist}
        text: |
          Your mother wires money and a ticket home, and says nothing at all about Innsmouth, in a way that tells you she knows something.
      - requires: {note: PRIEST}
        text: |
          Your photograph of the priest proves that a man in Innsmouth owns a gold hat.
      - requires: {item: gold}
        text: |
          They weigh your gold, and agree that it is gold. That is all it proves. They ask you, rather sharply, where you got it.
      - requires: {note: ZADOK}
        text: |
          When you mention Zadok Allen, somebody laughs. "Old Zadok? He's been telling that one since Grant was president."
      - requires: {note: CALLED}
        text: |
          On your word, a Coast Guard cutter lay off the harbour mouth all night. Its log records lights on the reef, which is no crime, and nothing else that anyone will put in writing.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth Eliot doesn't wait to hear what anybody decides. She takes Jonas down to her sister's on Water Street, and the door shuts behind them. At Christmas a card comes, in a hard, upright hand. Jonas is at school. He swims every day.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth Eliot doesn't wait to hear what anybody decides. She goes down to her sister's on Water Street alone, and the door shuts behind her. At Christmas a card comes, with nothing written on it but her name, and under it a star with a flame in its heart.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. You think of that at Hallowe'en, and every Hallowe'en after.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at your door at one in the morning. When you open it there is nobody there, only wet prints on the step, broad and flat, going away. You swore an oath at the Hall of Dagon. They haven't forgotten.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you begin to see it in the shaving mirror. Your eyes, always a little heavy-lidded, like your grandmother's, are rounder than they were, and they water, and you blink less. Two faint creases have come at the sides of your neck. You stop swimming in the lake, because you stay under too long and people stare. And every night now you dream of green water, and a city of lights below a black reef, and a woman with your grandmother's face waiting for you at the foot of a long stair, smiling. You are not afraid of the dream any more. That is what frightens you.
      - text: |
          The bus still runs to Innsmouth, twice a day. You know, because some nights you look it up in the timetable.

  226:
    title: The Long Way Home
    ending: escape
    text: |
      You tell nobody. Not the police, not the newspapers, not the people you love.

      You go home, and unpack, and go back to your life, and your life is exactly where you left it. The newspapers. The weather. Supper. It seems smaller than it was, and thinner, like a painted backdrop with the wind behind it.

      You never go near the sea. You don't eat fish. When somebody at a party mentions the North Shore, you find a reason to be in another room.

      Some nights you wake, and the room smells of low tide, and you lie very still until it passes.
    extra:
      - requires: {note: ROWLEY}
        before: true
        text: |
          You take the ten past six from Rowley, and sit by the window, and don't look out at the marsh.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          Eddie walks you to the depot and doesn't ask a thing. You take the evening train.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          You take the first train out of Ipswich, and sit by the window, and don't look out at the marsh.
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          The cutter puts you ashore at Newburyport. Her captain looks at you for a long time, and lets you go without a word.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          You come ashore on Plum Island, and walk along the beach until you find a road, and the road finds you a ride.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          You walk down the hill to the station. The ticket agent sells you a ticket home without a word. He doesn't need to say it.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out of Innsmouth goes into the bottom of a trunk, under the winter clothes. Some nights you take it out and look at it. Then you put it back.
      - requires: {item: gold}
        text: |
          The gold sits in a drawer of your desk. Once, when you were short, you took it to a jeweller. He weighed it, and turned it over, and looked at the things worked into it, and gave it back to you without making an offer.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth Eliot shakes your hand at the corner, takes Jonas by the shoulder, and walks away down toward the river and Water Street, where her sister keeps a boarding house, without looking back. You never hear from them again.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth Eliot shakes your hand at the corner, and walks away down toward the river and Water Street alone, without looking back. You never hear from her again.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. You think of that at Hallowe'en, and every Hallowe'en after.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at your door at one in the morning. When you open it there is nobody there, only wet prints on the step, broad and flat, going away. You swore an oath at the Hall of Dagon. They haven't forgotten.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you begin to see it in the shaving mirror. Your eyes, always a little heavy-lidded, like your grandmother's, are rounder than they were, and they water, and you blink less. Two faint creases have come at the sides of your neck. You stop swimming in the lake, because you stay under too long and people stare. And every night now you dream of green water, and a city of lights below a black reef, and a woman with your grandmother's face waiting for you at the foot of a long stair, smiling. You are not afraid of the dream any more. That is what frightens you.
      - text: |
          You got out. You tell yourself that, often. You got out.

  227:
    title: The Last Bus
    ending: escape
    text: |
      You take a room in Arkham for the night, in a hotel with a carpet and an electric lift and a night porter who has never heard of Innsmouth. You don't sleep much. Every time you close your eyes you see a pair of eyes in a mirror: wet, blue, round, and never closing.

      In the morning you take the train home, and go back to your life, and tell nobody about Innsmouth. What would you tell them? You went to see an old town on the coast. You looked at the steeples. You caught the bus.

      That is the story, and you keep to it. You saw an old town that was dying. You left before dark.

      Sometimes, in the years after, you see the timetable for the Arkham, Innsmouth and Newburyport line in a newspaper, and read it through to the end, the way you might press on a bruise.
    extra:
      - requires: [{note: OATH}, {note: WATCHED}]
        text: |
          You rode out because you swore the first oath. A brother may leave. You understand now that a brother is also expected to come back, and that they will wait as long as it takes.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out of Innsmouth stays at the bottom of your suitcase. You never open it in Arkham. You never open it at home either.
      - requires: {item: gold}
        text: |
          The gold sits in a drawer of your desk. Some nights you take it out and turn it in the lamplight, and the things worked into it seem to turn too.
      - requires: {note: PROMISE}
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. You rode out alone at eight. At Hallowe'en you sit up all night with the lamp lit, and you don't know what you are waiting for.
      - requires: {note: ZADOK}
        text: |
          You read in the Arkham paper, that autumn, that an old man called Zadok Allen has been reported missing from the Innsmouth poorhouse. He was ninety-six. Nobody has looked for him.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you begin to see it in the shaving mirror. Your eyes, always a little heavy-lidded, like your grandmother's, are rounder than they were, and they water, and you blink less. Two faint creases have come at the sides of your neck. You stop swimming in the lake, because you stay under too long and people stare. And every night now you dream of green water, and a city of lights below a black reef, and a woman with your grandmother's face waiting for you at the foot of a long stair, smiling. "Ye'll be back," Joe Sargent said. You are beginning to think he was right.
      - text: |
          The last bus from Innsmouth leaves the Square at eight. You were on it. Some nights, in your sleep, you are on it still, going the other way.

  228:
    title: Out with the Eliots
    ending: bittersweet
    text: |
      Ruth's sister keeps a boarding house on Water Street in Newburyport, a tall grey house with hollyhocks by the door and gulls on the roof. You slept there the night before last. It feels like a year. Her name is Martha. She opens the door in her apron with flour on her hands, and sees Ruth, and puts both floury hands over her mouth.

      Ruth hasn't seen her sister in fifteen years. She stands on the step in her salt-stiff dress and says nothing at all. Then Martha has hold of her and is crying into her hair, and Ruth stands there and lets her.
    extra:
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          The Coast Guard cutter takes you all aboard with the dory in tow, and puts you ashore at the station at the mouth of the Merrimack. The captain asks no questions. He gives Ruth his coat.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          Ruth beaches the dory on Plum Island, and you walk across the long bridge into Newburyport with the sun coming up behind you, scarecrows in salt-stiff clothes.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          From Market Square it is three streets down to the river. Ruth walks them very fast, with her hand tight on Jonas's, looking straight ahead.
      - requires: [{no_note: MARTHA}, {item: letter}]
        text: |
          Martha's letter is still in your inside pocket. You never gave it to Ruth. You give it to her now, on the step, and Martha watches her sister read it, and doesn't say a word.
      - requires: [{no_note: MARTHA}, {no_item: letter}]
        text: |
          You know her. She is Mrs. Lowell, who gave you eggs yesterday morning, and the darker girl in the photograph on her dresser, laughing on the beach with her arm round her sister, was Ruth.
      - requires: {note: MARTHA}
        text: |
          Martha doesn't ask how. She only says, "I knew. When you went off yesterday with my letter, I knew." She has made up the back bedroom already. She made it up last night.
      - requires: {no_note: SWAM}
        text: |
          Jonas stands behind his mother on the step with his hands in his pockets. In the daylight his eyes are rounder than they ought to be, and wet, and they don't blink as often as yours. Martha looks at them, and then at Ruth, and opens the door wider.

          Later, in the kitchen, Ruth says to you quietly, "It doesn't stop, you know. Going away doesn't stop it." She watches her son eating bread and butter at her sister's table. "But it's his now. Not theirs."
      - requires: {note: SWAM}
        text: |
          Martha looks past her sister, down the lane, for the boy. There is no boy.

          Later, in the kitchen, Ruth says to you, "He went to his father. He wanted to." She turns her cup round and round on the oilcloth. "That's the part I'll never forgive them. That he wanted to."
      - requires: [{note: PROMISE}, {no_note: SWAM}]
        text: |
          You promised her you would take her son out of Innsmouth. You kept it.
      - requires: [{note: PROMISE}, {note: SWAM}]
        text: |
          You promised her you would take her son out of Innsmouth. You got him as far as the harbour mouth.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out of Innsmouth stays in your bag. You never take it to anyone. While nobody looks at Innsmouth, nobody comes looking for the Eliots.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at your door at one in the morning. When you open it there is nobody there, only wet prints on the step, broad and flat, going away. You swore an oath at the Hall of Dagon. They haven't forgotten.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you begin to see it in the shaving mirror. Your eyes, always a little heavy-lidded, like your grandmother's, are rounder than they were, and they water, and you blink less. Two faint creases have come at the sides of your neck. You stop swimming in the lake, because you stay under too long and people stare. And every night now you dream of green water, and a city of lights below a black reef, and a woman with your grandmother's face waiting for you at the foot of a long stair, smiling. You think of Ruth Eliot's kitchen, and of what she said. It doesn't stop. But it's yours.
      - text: |
          Martha's back bedroom looks out over the river, toward the sea. All that summer, Ruth keeps the curtains drawn.

  229:
    title: Y'ha-nthlei
    ending: claimed
    text: |
      You climb out onto the reef.

      The rock is slick and warm, and it seems to move a little under your hands, as if it were breathing. The robed ones step aside for you. Nobody seizes you. Nobody needs to. At the far end of the reef the priest in the tall gold tiara looks at you along its length and inclines his head, once, as a host does when a late guest arrives.

      The things from the water take your hands. Their fingers are cool and webbed and very gentle.

      At the seaward edge the rock drops away into black water. You stand on the edge with them. The chant goes up all round you, *Iä! Iä!*, and you find that you know the words, and are singing them. Then you step off.

      The water closes over your head. You breathe it in. It doesn't hurt. It is like the first breath of morning after a long illness.

      Down. Down the face of the reef, past the hollows where the sea sucks in and out, down into the black, deeper than any sounding line has gone, until the cold and the dark and the weight of the sea are a kind of embrace.

      Then there is light below you.

      Y'ha-nthlei lies at the bottom of the deep like a city seen from a hill at night. Terraces, and colonnades, and great stairs going down. Gardens of weed that sway in a current you can't feel. Domes inlaid with pale gold, glowing. Things move along its streets in their thousands, slow and graceful and unafraid. Somewhere at the heart of it vast shapes stir in their sleep, older than the land: Mother Hydra and Father Dagon.

      They have waited a long time for you. They tell you so, without words.
    extra:
      - requires: {investigator: genealogist}
        text: |
          At the foot of the longest stair a woman is waiting. Her head is narrow and her eyes are great and round, and her skin is grey-green and shining, and there is a brooch of pale gold at her throat. You know her. You knew her when you were small, and she took you down to the lake and held you up in the water and laughed, and said you swam like a fish.

          "Arthur," your grandmother says. Her voice is the sea going out over shingle. "You came home."

          Behind her, vaster and older, shines another face: the one Obed Marsh took to wife, the mother of Leonie, the mother of all your mother's mothers. Her name is Pth'thya-l'yi. She has lived for eighty thousand years, and she is glad to see you.

          You came east to find your mother's people. You have found them. You were never going to be anything but found.
      - requires: {investigator: [agent, antiquarian, reporter]}
        text: |
          It will be slower for you, they tell you, without the blood. Stranger. Your skin will take years to turn, and your eyes, and your hands. But the sea is patient, and so are they. There will be no more dying. You will dwell down here amid wonder and glory for ever, and in a little while you will not remember that you were ever anything else.
      - text: |
          Up above, the sun rises over Devil Reef, and the tide comes in and covers it. In Innsmouth, by morning, someone has written your name down, and beside it two words: went down.

  230:
    title: Recorded as Drowned
    ending: death
    text: |
      They find you, wherever you fell. They always do. The sea is theirs, and the marsh belongs to the sea, and the town belongs to both.

      Nobody outside Innsmouth ever sees your body. In the town clerk's office, in a ledger with a green cloth cover, a slow hand writes one more line under all the others, in the same faded ink: a name, an age, and two words.

      *Drowned, July 1927.*

      There is no grave. There never is.
    extra:
      - requires: {investigator: agent}
        text: |
          The Bureau lists you as missing in the line of duty. Mickey Shea, asked about you in Newburyport, says he never heard the name.
      - requires: {investigator: antiquarian}
        text: |
          Miskatonic names a small reading room after you, and puts the gold armlet you spent ten years on in a case by its door.
      - requires: {investigator: reporter}
        text: |
          The Gazette gives you four inches on page nine: LADY REPORTER MISSING ON NORTH SHORE. They spell your name wrong.
      - requires: {investigator: genealogist}
        text: |
          In Toledo your mother gets the letter, and reads it twice, and does not cry. That night, and every night after, she dreams of green water, and wakes with her pillow wet.
      - text: |
          By noon, the ink is dry.

  231:
    title: The Unblinking
    ending: madness
    text: |
      Somebody finds you. You don't remember who, or where. You remember a road, and a light, and someone saying your name over and over, and you not knowing whose name it was.

      The Arkham Sanatorium is red brick behind a high wall, with a lawn that nobody walks on. Your room has a barred window that looks out at an elm. The doctors are kind. They write on their clipboards.

      You don't blink. You can, if you think about it, but you never think about it, and so you don't. Your eyes water all day long, and the nurses dab them with a handkerchief and tell you to rest.

      You ask for water. Not that water. Salt water, in a basin, so that you can put your face in it and breathe. They won't give it to you, and you can't make them understand.
    extra:
      - requires: {investigator: genealogist}
        text: |
          In the spring they move you to a room with a bathtub, because it is the only thing that quiets you. One morning in June the nurse finds the tub full to the brim, and the room empty, and the bars on the window just as they were.
      - text: |
          At night you lie very still and listen, through the walls and the miles, for the sea. Sometimes you hear it.
