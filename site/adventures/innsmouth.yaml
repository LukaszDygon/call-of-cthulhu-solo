  68:
    title: The Ledger
    extra:
      - requires: {note: TIARA}
        text: |
          Pinned to the wall above the desk is a drawing of a stamp: an anchor, and *M.R.Co.* The alloy figures in the margin match nothing you know, except a tiara in a glass case in Newburyport.
      - requires: {investigator: agent}
        text: |
          "L.E." is the *Lady Ellen*. The banks are the same three banks in Boston you have been watching since January. This book would hang half the people you've been chasing.
      - text: |
          Somewhere in the mill a door bangs. Feet on a stair.
    text: |
      The ledger is thick and bound in green cloth, and it goes back to 1919.

      *Ore received, river works, by night.* Every week, sometimes twice a week. Tons of it. There is no column for where the ore comes from, and no money paid for it, ever. Under it, the gold refined and sold: ingots to dealers in New York and Boston, deposits in Boston banks, and payments, smaller and regular, to someone called *L.E.*

      There is no mine within five hundred miles of Innsmouth. The ore comes up the river, at night, and nobody pays for it.
    choices:
      - text: "Take the ledger."
        effects:
          - gain: ledger
          - note: WATCHED
        to: 69
      - text: "Leave it. Someone would miss it before long."
        to: 69

