        to: 116

  96:
    title: The Eliot Kitchen
    effects:
      - note: ELIOT
    extra:
      - requires: {no_note: MARTHA}
        before: true
        text: |
          She takes you inside quickly, by the back door.
      - requires: {investigator: genealogist}
        text: |
          Once she stops and looks you full in the face. "Marsh eyes," she says. "Amos had a touch of them." Then: "I don't care whose you are. Do you hear me?"
      - requires: {note: MARTHA}
        text: |
          Martha's letter lies open on the table. Each time Ruth reaches the end, she touches the last line with one finger: *My door is open. Bring the boy.*
      - text: |
          "If you're still in Innsmouth at dark," she says, "come to the back door. Knock twice."
    text: |
      Her name is Ruth Eliot. She was Ruth Perkins of Ipswich until 1912, when she married Amos Eliot at nineteen, against her family. The kitchen is small and scrubbed, with a window over the river. By the range stands an old sea-chest with *M. ELIOT* burned into its lid.

      She talks the way a dam breaks. Amos was Matt Eliot's great-grandson, with a touch of the blood, the way the old families have. When it came on him he wouldn't take the second oath, and in 1924 he went off the breakwater one night. "Drowned," the town clerk wrote. He didn't drown.

      She stayed for Jonas. Now the Order has put his name down for Hallowe'en. The third oath. "He's *twelve*," she says.
    choices:
      - text: "Ask her about the chest with Matt Eliot's name on it."
        to: 260
      - text: "Thank her, and go."
        to: 97
      - text: "Stay here with them as the light goes."
        requires: {note: EVENING}
        to: 148

  260:
    title: Matt Eliot's Chest
    effects:
      - note: SIGN
      - note: SEADOOR
    text: |
      She drags the chest into the light and lifts the lid. Under the oilskins lies Matt Eliot's journal from 1846. He drew the old sign in it: a star, and a flame in its heart. He wrote that there is a door under the Masons' hall where *they* come up from the sea, and that he meant to stop it. That was the night he disappeared.

      At the bottom of the chest is something heavy, wrapped in oilcloth. Ruth looks at it, and at you, and doesn't unwrap it.
    choices:
      - text: "Promise to take Jonas out of Innsmouth with you."
        to: 98
      - text: "Thank her. You can't promise anything."
        to: 97
      - text: "Stay here with them as the light goes."
        requires: {note: EVENING}
        to: 148

  97:
    title: The Back Door
    text: |
      She nods, as if she expected nothing else, and lets you out the back way into the lane by the river. The boy watches you from the window until you turn the corner.
