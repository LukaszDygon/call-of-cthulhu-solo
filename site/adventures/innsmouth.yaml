  62:
    title: The Bathers
    ending: claimed
    extra:
      - requires: {investigator: genealogist}
        text: |
          One of them swims beside you all the way down. Her face is your grandmother's face, changed, and she says your name, the one only your grandmother ever used. You were thirteen when she went into the sea. Here she is.
      - text: |
          That evening the fishermen find your clothes on the breakwater. They fold them neatly, and leave them on the stones for you, in case.
    text: |
      They are kind. They take your hands, cool and soft and webbed, and go down, and you go down with them, and find you don't need to breathe as much as you thought.

      They show you the reef from underneath: its black roots going down into the dark, the hollows that are doorways, and far below, towers and windows. The windows are lit.

      You mean to go back up. You only want to see a little more.

