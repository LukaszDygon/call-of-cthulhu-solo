  35:
    title: Six O'Clock
    effects:
      - note: EVENING
    extra:
      - requires: {note: WATCHED}
        text: |
          They don't pretend any more. Wherever you stop, someone stops too, a little way off, and waits.
      - requires: {note: TRUCK}
        text: |
          Behind the First National, an engine coughs into life. Eddie's truck is about to go.
      - requires: {note: ELIOT}
        text: |
          Ruth Eliot said to come to the back door, if you were still here at dark.
      - text: |
          Two hours to the bus.
    text: |
      The sun is low over the marsh. Devil Reef lies along the sea at its full length now, black and shining, with gulls standing on it in rows.

      Down on the waterfront men drag dories to the water's edge, and someone is trimming lanterns on the best-kept wharf. People sit on their steps, facing the sea, waiting.
