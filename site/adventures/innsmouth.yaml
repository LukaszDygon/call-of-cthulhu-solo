  58:
    title: Warm Water
    extra:
      - requires: {investigator: genealogist}
        text: |
          You have always swum well. You have never swum like this. The water holds you up like a hand.
      - text: |
          They are close now. They are smiling. Their faces are wide and flat, and their eyes are round and black and very large, and the creases at their necks are opening and closing.
    text: |
      You leave your clothes on the granite and go in off the end of the breakwater.

      The water is warm. It should be cold, this far north, even in July, and it is as warm as a bath. You swim out. The fishermen watch you go.

      The swimmers wait for you. They are much further out than they looked, and you swim and swim, and the shore gets small behind you, and the swell lifts you and lets you down, lifts you and lets you down.
    choices:
      - text: "Swim on, to them."
        to: 62
      - text: "Stop, and tread water, and look at them properly."
        to: 59
      - text: "Turn back for the breakwater, now."
        roll: {skill: [Swim, CON], success: 60, failure: 61}

  59:
    title: Treading Water
    effects:
      - san: "1/1D4"
    text: |
      You stop, and the swell lifts you, and you look.

      There are seven of them. Two are children. One is very old, with long white hair floating round her on the water like weed. They are not treading water. They are lying in it, easily, the way you lie in a bed, with only their heads out, and their eyes are black and round and as big as plums.

      The nearest of them smiles at you. Her teeth are small and many. Under the green water her legs are moving, slowly, together, the way a seal's do.

      "Come on," she says. Her voice is soft and wet and kind. "Come and see."
    choices:
      - text: "Let them take your hands."
        to: 62
      - text: "Turn, and swim for the breakwater with everything you have."
        roll: {skill: [Swim, CON], success: 60, failure: 61}

  60:
    title: The Long Swim Back
    effects:
      - note: REEF
      - san: "1/1D4"
    text: |
      You turn, and swim for your life.

      They don't follow. When you look back, they are treading water in a row, watching you go, and behind them, from down here at the level of the sea, you can see the reef plain: the hollows along its top, the black water on its far side, the one big mouth at its north end where the sea goes in.

      You drag yourself out onto the granite and lie there in the sun, shaking. Your clothes are where you left them, folded neatly. You didn't fold them.
    choices:
      - text: "Walk on into the town."
