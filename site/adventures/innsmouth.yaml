    effects:
      - gain: gold
    text: |
      You keep to the hedges, thirty yards back. You think she hasn't seen you.

      At the white house she sends the servant in, then turns and looks straight at you through a gap in the box. She has a long, pale, still face and large grey eyes. She was beautiful once, and in a strange way still is.

      She slips a gold armlet from her wrist and holds it out through the railings. "Take this," she says, low as the tide on shingle. "And take the bus."
    choices:
