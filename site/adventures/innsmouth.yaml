  # --- Zadok ------------------------------------------------------------------------------------------------------

  43:
    title: The Fire Station
    extra:
      - requires: {note: ZADOK}
        text: |
          Zadok sees you, and turns his chair to face the wall.
      - text: |
          A fly walks to the corner of an old man's eye. He doesn't blink.
    text: |
      The old men sit in a row in the firehouse door with their hands on their knees, looking at nothing.

      One sits apart: older than the rest, with a white beard stained yellow round the mouth and boots tied with string. His eyes are red-rimmed and watery, and they blink. He is the only one here whose eyes blink.

      "Don't mind Zadok," says one of the others, without turning his head. "Zadok's simple."
    choices:
