      - note: UPPER
    extra:
      - requires: {investigator: genealogist}
        text: |
          At the gate of the white house she stops, and turns, and looks straight at you. Her eyes go wide, and then soft. She says something to the servant without taking her eyes off you.
      - requires: {note: WATCHED}
        text: |
          A blind goes up in the white house, and down again.
      - text: |
          Somewhere a gate creaks, open and shut, open and shut, though there's no wind.
    text: |
      West of the Square the ground rises, and the streets change. Washington Street, Lafayette, Broad, Adams. Here the sea captains built their houses when Innsmouth was rich: square Federal mansions with fanlights and widow's walks, set back behind iron fences in gardens of box and lilac.

      The gardens have gone wild. The box has grown into hedges taller than a man, and the lilac into thickets. Half the houses are empty, their windows broken, their doors standing open on dark halls. The other half are shut tight, every blind drawn, and they are not empty. You can feel it as you pass.

      The finest of them is white, with green blinds and a widow's walk, and its garden is kept. A brass plate on the gate says MARSH.

      Coming down the brick pavement toward it, under a parasol, is a woman in a grey silk dress, with a servant two paces behind. At her throat and on both wrists she wears pale gold. She walks slowly, with a long, swaying step, like someone walking in water.
    choices:
      - text: "Follow her at a distance."
        roll: {skill: Stealth, success: 100, failure: 101}
      - text: "Raise your hat to her."
        requires: {investigator: genealogist}
        to: 102
      - text: "Look into one of the empty houses."
        to: 104

  100:
    title: A Gift
    effects:
      - gain: gold
    text: |
      You keep to the hedges, thirty yards behind. You think she hasn't seen you.

      At the gate of the white house she sends the servant in, and turns, and looks straight at you through a gap in the box. Her face is long and pale and very still, and her eyes are large and round and grey. She is not young. She was beautiful once, and in a strange way she still is.

      She slips a gold armlet off her wrist and holds it out through the railings.

      "Take this," she says. Her voice is low, like the tide going out over shingle. "And take the bus." Then she goes in, and the door closes.
    choices:
      - text: "Look into the empty house next door to the Marshes'."
        to: 104
      - text: "Walk on into the town."
