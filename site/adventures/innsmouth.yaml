      - text: |
          They are close now, smiling. Their faces are wide and flat, their eyes round and black, and the creases at their necks open and close.
    text: |
      You leave your clothes on the granite and go in. The water is as warm as a bath, and it should not be, this far north.

      The swimmers wait. They are much further out than they looked, and the swell lifts you and lets you down, lifts you and lets you down.
