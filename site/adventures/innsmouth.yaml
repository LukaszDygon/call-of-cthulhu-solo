  86:
    title: The First Oath
    effects:
      - note: OATH
      - san: "1/1D4"
    extra:
      - requires: {investigator: genealogist}
        text: |
          Under the oath, for a moment, you hear a voice you know. Your grandmother's. You must have imagined it.
      - text: |
          "There," says the doorkeeper. "Now you are a little bit ours."
    text: |
      She takes your right hand in both of hers. Her hands are cold and damp. You repeat the words after her: that you will not speak of what you see, to any who are not of the Order, for as long as you live, and longer.

      As you say *and longer*, something settles in you. It is like a hook going in under the skin, very small, very sharp, with a line on it that goes away somewhere you can't see.

      Inside, the Hall is one great room, two storeys high, dim and cool and smelling of salt. The walls are painted blue-green and covered with gilt sea-things: weed and shells and fish, and among them figures that are fish and men at once. There is a dais at the far end, with a great carved chair. Grey robes hang on pegs along one wall. There is a door marked VESTRY. And in the corner, a stair going down, with a cold breath coming up it that smells of the sea.
    choices:
      - text: "Ask to see the cellars."
        to: 87
      - text: "Slip into the vestry when she turns away."
        roll: {skill: [Stealth, Spot Hidden], success: 89, failure: 91}
      - text: "Thank her, and leave."
        to: 84

  87:
    title: The Second Oath
    text: |
      She smiles, as if you have pleased her very much.

      "For the cellars," she says, "the second oath. Service. Only that you will come when you are called." She holds out her cold hands again. "It's a very small oath too."
    choices:
      - text: "Swear it."
        to: 88
      - text: "Refuse."
        to: 84

  88:
    title: Brother of Dagon
    ending: claimed
    extra:
      - requires: {investigator: agent}
        text: |
          The Bureau lists you as missing in October. Shea, who sees you on the Marsh wharf once, unloading his crates, doesn't say a word to anyone.
      - requires: {investigator: reporter}
        text: |
          Your editor gets a letter in September, in your handwriting, saying you have found a better story and are staying with it. He never prints a word you send after that, because you never send one.
      - requires: {investigator: antiquarian}
        text: |
          Miskatonic gives your chair to a younger man. Your notes on the armlet are found in your rooms, every page of the old sign torn out.
      - requires: {investigator: genealogist}
        text: |
          They are so glad to have you. The Marshes come to the Hall to see you, and Esther Marsh kisses your cheek, and calls you cousin. A year later you look in the glass, and Obed Marsh looks back, and you are glad too.
      - text: |
          You came to look at a town, and joined its church before lunch.
    text: |
      You swear. The hook goes in deeper, and the line pulls.

      She takes you down the stair, into vaults where the air is wet and the walls drip, and shows you the sea door: a black shaft full of water in an arch of carved stone, with an iron grille across it, and things moving in the water below. She shows you the long table where the Order eats on feast nights, and a place at it with your name already carved.

      You never catch the bus. You find, when eight o'clock comes, that you don't want to. They give you a robe of your own, and a room above the variety store, and work at the mill.

      At Hallowe'en they call you, and you come. You swore you would.

  89:
    title: The Vestry
    effects:
      - note: SEADOOR
    extra:
      - requires: {investigator: antiquarian}
        text: |
          You turn to the oldest pages. They are not names at all, but an account in a cramped hand of how the hall was bought, and the cellars dug down to meet the shaft, and the sea door set in the arch under this floor. You read it in a minute that feels like an hour.
      - text: |
          Out in the Hall, the doorkeeper's keys chink. She is coming back.
    text: |
      A narrow room, a desk, a smell of candle-wax and the sea. Robes on pegs. A cupboard of gold: armlets, collars, a second tiara on a stand.

      On the desk lies a great ledger bound in sharkskin. The Order's register. The first pages are dated 1840. Names, in a dozen hands, with dates: *May-Eve*, *Hallowe'en*. Young people, most of them. Some of the names have been crossed through, with two words beside them: *went down*.

      You turn to the end. *Amos Eliot, 1924. Went down.* And below it, in this year's ink: *Jonas Eliot. Third oath. Hallowe'en.*

      Pinned inside the back cover is a plan of the cellars under this building: a stair, three vaults, and at the bottom a round shaft inked in red, marked *the door*.
