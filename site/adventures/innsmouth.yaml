  59:
    title: Treading Water
    effects:
      - san: "1/1D4"
    text: |
      You stop, and look. There are seven: two children, and an old woman with white hair floating round her like weed. They aren't treading water. They lie in it, the way you lie in a bed, with eyes as black and round as plums.

      The nearest smiles with small, many teeth. Under the water her legs move together, like a seal's. "Come on," she says, soft and kind. "Come and see."
    choices:
