    effects:
      - hp: "-1D4"
      - san: "1/1D4"
    text: |
      You turn. Something takes your ankle, gently, and pulls you under.

      Green water. Bubbles. Faces. You kick, and it lets go, and pulls you under again, playing. Then a wave picks you up and throws you at the breakwater, and you come out on the granite with your knees and hands torn open, coughing up the sea.

      The fishermen go on fishing.
