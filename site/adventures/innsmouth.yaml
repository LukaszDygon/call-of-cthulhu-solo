  75:
    title: The Sluice Room
    effects:
      - lose: ledger
      - lose: dynamite
      - san: "1/1D6"
    text: |
      They turn out your pockets first, and take back anything that came from the mill. Then down wet stone steps to a vaulted room at river level, and an iron door bolted behind you.

      Half the floor is a channel of black water, running out under the wall through an iron grate into a tunnel. Hours go by. Then the water bulges, and a grey, webbed hand comes through the bars and pushes a lump of rock onto the stones, veined with pale yellow metal. It goes away, and comes back with another.

      It doesn't seem to notice you. That is almost the worst part.
    choices:
      - text: "Wait. Someone will come."
        to: 76
      - text: "Squeeze through the grate into the tunnel."
        roll: {skill: [Swim, STR], success: 77, failure: 78}

  76:
    title: The Bus Is Waiting
    text: |
      At a quarter to eight the bolt slides back. A man with the look stands in the doorway with a lantern. "Bus is waitin'," he says, and grins. His teeth are small and pointed, and there are too many of them.

      He walks you out through the empty mill and points you up the hill toward the Square.
    choices:
      - text: "Walk up to the Square."
        to: 116

  77:
    title: The River Tunnel
    effects:
      - note: SEADOOR
      - san: "1/1D4"
    text: |
      You go through the grate on your back, face in the air pocket, and the cold takes your breath.

      The tunnel runs two ways. One way goes downriver, toward the light. The other goes steeply down under the town toward the sea, where far off a greenish light shows steps cut in the rock, and things moving on them. At the top of that tunnel, somewhere under the hill where the pillared hall stands, there is a door.

      You go toward the light, and come out in the river below the falls as the sun goes down.
    choices:
      - text: "Walk up to the Square, dripping."
        to: 116

  78:
    title: Not That Way
    effects:
      - hp: "-1D4"
    text: |
      Halfway through the bars, something takes your ankle and pulls, slow and hard. You tear free and drag yourself back into the sluice room, bleeding from the shin.

      You don't try again.
    choices:
      - text: "Wait for someone to come."
        to: 76

  # --- New Church Green -------------------------------------------------------------------------------------------

  79:
    title: New Church Green
    effects:
      - note: GREEN
    extra:
      - requires: {note: WATCHED}
        text: |
          The woman on the steps turns her head and watches you all the way up the hill.
      - text: |
          From under the church comes a low chanting, never louder, never softer, like the sea.
    text: |
      Church Street climbs from the Square to a green gone to hay, with elms dying round its edge.

      On one side stands the old Masonic Hall, its four grey pillars peeling like sunburnt skin. Gilt letters over the door read ESOTERIC ORDER OF DAGON. A woman in a grey robe waits on its steps, a ring of keys at her belt, perfectly still.

      Facing it is a squat stone church, its basement windows shuttered. All but one.
    choices:
      - text: "Look down through the church's basement window."
        to: 80
      - text: "Speak to the woman on the Hall steps."
        to: 83

  80:
    title: The Basement Window
    effects:
      - san: "0/1D4"
    extra:
      - requires: {note: TIARA}
        text: |
          It is the twin of the tiara in Newburyport, made for a head that is not quite round. This one is being worn.
      - text: |
          Nobody has seen you. Yet.
    text: |
      Through the one unshuttered window you look down into a long, candlelit room. Twenty or thirty people in grey robes stand in rows, swaying. On a dais at the far end, a figure in deeper grey raises its arms. On its head is a tall crown of gold.

      It turns its head slowly as it chants. The face under the gold is long and grey.
    choices:
      - text: "Photograph him."
        requires: {item: camera, skill: Art/Craft (Photography), min: 40}
        roll: {skill: Art/Craft (Photography), success: 81, failure: 82}
