      "Forty-six. I was fifteen. Selectman Mowry an' the decent folks jailed Obed an' his crowd, thirty-two of 'em. Next night *they* come up aout o' the harbour. I seen it from our cupola. Hundreds. Walkin' up Water Street like folks. Come mornin', half the taown was dead, an' Obed was aout o' jail, an' there was a new church in the Masons' hall. The Order o' Dagon. Everybody took the oath, or else. I took two. Silence, an' service. Never the third. The third's for them as means to go daown.

      "There's a door under that Hall. A sea door. Shaft goes clean daown to the reef, an' they come up it into the taown when they please. Matt Eliot knowed. He was Obed's mate, an' he fought him, an' he went daown the night they come. His kin's across the river yet, poor souls. The Eliots."

