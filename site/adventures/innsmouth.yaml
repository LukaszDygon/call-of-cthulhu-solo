  83:
    title: The Doorkeeper
    extra:
      - requires: {investigator: genealogist}
        text: |
          When she looks at you properly, she bows her head, as if to someone she was told to expect.
      - requires: {investigator: antiquarian}
        text: |
          Round the great door runs a frieze carved in the wood, newer than the building. It is the work of the tiara. Your fingers itch to trace it.
      - text: |
          She waits. She has all the time in the world.
    text: |
      The woman on the steps watches you come. Close to, she is perhaps forty, with a long, pale face and a grey robe that hangs from her shoulders like wet sailcloth. Her eyes are large and round and very calm.

      "You are welcome," she says. Her voice is soft and slow. "Strangers so seldom come to us."

      The Order, she says, is an old fraternity: older than the Masons who had this building before it. It teaches that all life came from the sea, and that the sea remembers. It has made Innsmouth prosperous. You see the fishing. You see the mill.

      "You may see our Hall," she says. "Anyone may. All that's asked is the first oath, which is silence. Only that you never speak of what you see inside." She smiles. "It is a very small oath."
