  37:
    title: Eddie Pratt
    extra:
      - requires: {investigator: genealogist}
        text: |
          He keeps glancing at your face. "You got kin here?" he asks, and then, before you can answer, "Don't tell me. I don't want to know."
      - text: |
          The bell over the door rings. A woman comes in with a basket, and Eddie goes quiet and polite and slow, like everybody else in Innsmouth.
    text: |
      The First National smells of soap and coffee and sawdust, the first clean smell in town. Behind the counter, a boy of seventeen in a white apron is stacking cans of peaches into a pyramid.

      His name is Eddie Pratt, and he's from Arkham, and he talks the moment the door shuts behind you, low and fast, the way a man drinks water after a long day in the sun.

      The company sent him here. Nobody local will work the counter. He boards with a family in Ipswich and rides home every night at six on the delivery truck, and he would rather walk through fire than stay in Innsmouth after dark.

      "Don't stare at them," he says. "Don't ask about the reef. Don't go near that Hall on the green. You'll see it. They'll ask you in. Don't go." The Marsh family runs everything, he says, and nobody has seen old Barnabas Marsh in ten years. There's an old soak called Zadok Allen who hangs round the fire station, ninety-some, who'll tell you anything for a bottle. The variety store on Eliot Street sells it under the counter. "But don't let them see you listening to him. A fellow from Boston did, two summers back."

      He doesn't say what happened to the fellow from Boston.
