    title: The Woodshed
    text: |
      The woodshed behind the poorhouse is dark and dry, all split logs and cobwebs and the smell of old pine. A knothole in the back wall lets in a single beam of light. Through it you can see a long way out to sea.

      Nobody comes. Zadok settles on a chopping block like a king on his throne.
    choices:
