    text: |
      He draws in the dust with a stick: a five-pointed star, with a mark like a flame in its heart.

      "Them island folks had stones cut so, in a ring. Kep' *them* off, till somebody broke it. Matt Eliot kep' one. Brung it home in his sea-chest. His kin's got it yet, I reckon, an' that's why they're alive."

      He scuffs the star out with his boot.
