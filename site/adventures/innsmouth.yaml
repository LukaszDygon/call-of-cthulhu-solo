      She stops and looks up into your face for a long moment.

      "You're Leonie's," she says at last. "Abigail's grandson. You have the eyes." She touches your cheek with a gloved hand. "I'm Esther Marsh. We're cousins, after a fashion. Come in and have tea, and meet the family. Or come to supper. We have supper at nine."
