  45:
    title: Zadok Allen
    extra:
      - requires: {investigator: genealogist}
        text: |
          He looks up at you properly for the first time, and his mouth falls open. "Obed's eyes," he whispers. "God help ye, ye've got Obed's eyes."
      - text: |
          He gets up, faster than you'd think, and waits for you to choose.
    text: |
      The old man's tongue comes out and touches his lips.

      "Ye'll want talk," he says. His voice is high and cracked, and pure old New England, the kind you hear in hill towns where the railroad never came. "Folks always want talk. But not here. Not with them a-settin' round." He jerks his head at the town. "Daown the old wharf, where I can see the reef. I like to keep an eye on the reef. Or up back o' the poorhouse, in the woodshed, where nobody comes."
