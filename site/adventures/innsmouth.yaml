  # --- The north quarter ------------------------------------------------------------------------------------------

  92:
    title: Across the Bridge
    effects:
      - note: NORTH
      - san: "0/1D3"
    extra:
      - requires: {note: WATCHED}
        text: |
          The children in the lane stop playing and follow you, at a distance, without a sound.
      - requires: {investigator: genealogist}
        text: |
          An old man on a doorstep half rises as you pass, and touches his cap to you. You have never seen him in your life.
      - text: |
          Above it all, on the rim of the hill, stands a long, sagging building with half its windows boarded: the poorhouse.

          Down by the river, the woman sees you, and her hands stop.
    text: |
      You cross the main bridge over the gorge, with the falls roaring under you, and the north quarter closes round you like a hand.

      Here are the fish-packing sheds, long and low and stinking, and the lanes between them, too narrow for a cart, with houses leaning together overhead. Here the smell is not a smell any more. It is a thing you wade through.

      And here are the people who don't go to the Square.

      An old woman sits on a step in the sun, breathing. The creases at the sides of her neck open and shut as she breathes, wet and pink inside. A man mending a lobster pot has webs between his fingers, up to the first knuckle. In an upstairs window, a face looks down at you, and it is not quite a face. The curtain drops.

      Down by the river, in a yard behind a weathered gambrel house, a woman in a faded blue dress is mending nets. A boy of about twelve sits on the back steps with a hand line in the water. A dory is tied up at the foot of the steps.
    choices:
      - text: "Speak to the woman mending nets."
        to: 93
      - text: "Climb to the poorhouse on the rim."
        to: 44

  93:
    title: Ruth Eliot
    text: |
      She is about thirty-five, thin and brown, with her hair scraped back and her sleeves rolled to the elbow. Her face is an ordinary face: tired, sunburned, sharp. Her eyes blink.

      "We don't get visitors," she says, in a flat voice that carries no further than you. "You want to go back over the bridge."

      The boy has turned round on the steps to look at you. He has a quick, clever face, and his mother's mouth. His eyes are a little too round, and a little too far apart, and they are wet in a way that eyes should not be. He is maybe twelve.

      "Jonas," the woman says. "Inside."

      He doesn't go. He looks at you as if you might be the most interesting thing that has happened to him in his life.
