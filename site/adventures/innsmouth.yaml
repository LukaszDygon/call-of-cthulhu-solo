  45:
    title: Zadok Allen
    extra:
      - requires: {investigator: genealogist}
        text: |
          He looks up at you properly for the first time, and his mouth falls open. "Obed's eyes," he whispers. "God help ye, ye've got Obed's eyes."
      - text: |
          He gets up, faster than you'd think, and waits.
    text: |
      His tongue touches his lips.

      "Ye'll want talk," he says, in a high, cracked, old-country voice. "Not here, with them a-settin' round. Daown the old wharf, where I can keep an eye on the reef. Or the woodshed back o' the poorhouse, where nobody comes."
    choices:
      - text: "Go down to the old wharf with him."
        to: 46
      - text: "Steer him to the woodshed instead."
        roll: {skill: [Persuade, Charm, Fast Talk], success: 47, failure: 46}

  46:
    title: The Old Wharf
    effects:
      - note: WATCHED
    text: |
      He leads you down to a ruined wharf on the waterfront, and settles with his back against a bollard, facing the reef.

      Behind you, along Water Street, there are a great many windows. Later, you will think about how many.
    choices:
      - text: "Sit down beside him, and let him talk."
        to: 48

  47:
    title: The Woodshed
    text: |
      Split logs, cobwebs, the smell of old pine. Through a knothole you can see a long way out to sea. Nobody comes.

      Zadok settles on the chopping block like a king on his throne.
    choices:
      - text: "Sit down beside him, and let him talk."
        to: 48

  48:
    title: Zadok's Tale
    effects:
      - san: "0/1D3"
    extra:
      - requires: {item: whiskey}
        before: true
        text: |
          He takes the bottle in both hands like a baby, and drinks.
      - requires: [{item: flask}, {no_item: whiskey}]
        before: true
        text: |
          He empties your flask in twenty minutes, and keeps talking after the rye is gone.
      - requires: [{no_item: flask}, {no_item: whiskey}]
        before: true
        text: |
          He has nothing to drink. The name Mowry has pulled a cork in him.
      - text: |
          He looks at you sidelong, to see if you want the rest.
    text: |
      Then he talks, and once he starts he can't stop.

      "Cap'n Obed Marsh. When the trade went bad, he went lookin' past the Indies, where no chart went. Found an island. Nobody livin' on it. Stone ruins older'n anything, carved with fish that was men an' men that was fish. The folks that built 'em had all gone daown into the sea, long back. Gone daown to *them*.

      "Obed found the lead things. Throw 'em in the water, say the words, an' *they* come up. So he made his bargain. Fish, an' gold you never seen. An' what they wanted back..." He wipes his mouth. "Young folks. Twice a year, May-Eve an' Hallowe'en, out on the reef. An' after a while they wanted more'n that. They wanted to *mix*."
    choices:
      - text: "Let him go on."
        to: 50
      - text: "Stop him. You've heard enough."
        effects:
          - lose: whiskey
        to: 49

  49:
    title: Enough
    text: |
      You get up. He doesn't try to keep you. When you look back, he is still sitting there with his eyes on the reef, talking to nobody.
    choices:
