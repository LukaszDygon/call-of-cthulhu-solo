  46:
    title: The Old Wharf
    effects:
      - note: WATCHED
    text: |
      He leads you down through the empty streets to the waterfront, and out onto a ruined wharf where the stones are green with moss and the sea slaps at the piles below. He settles with his back to a bollard, facing the reef.

      Behind you, along Water Street, are a great many windows. You don't see the faces in them. Not until later do you think about how many windows there were.
