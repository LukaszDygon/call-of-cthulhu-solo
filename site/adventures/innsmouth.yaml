journal:
  NOON: It is past one o'clock.
  AFTERNOON: It is past half past two.
  LATE: It is past four o'clock.
  EVENING: It is past six o'clock. The last bus leaves at eight.
  WATCHED: The town has marked you. You can feel it in every window.
  OATH: You swore the first oath of Dagon. You feel it, like a hook under the skin.
  TIARA: You have seen the Newburyport tiara up close, and you would know that gold anywhere.
  HISTORY: The plague of 1846, Selectman Mowry's committee, and a first mate called Matt Eliot who stood against Obed Marsh.
  ORNE: Leonie Marsh of Innsmouth married Benjamin Orne of Arkham in 1866. She was your grandmother's mother.
  BOAT: Shea will bring the Lady Ellen to the end of the old Marsh wharf at midnight.
  DORY: A sound dory with oars is tied up under the old Marsh wharf.
  RAILWAY: You know the old branch line west across the marsh, and the cut where the Rowley road crosses it.
  HANDCAR: There is a pump handcar on the siding at the old station, and it still runs.
  REEF: You have seen Devil Reef close, and you know where its hollows are.
  ZADOK: Zadok Allen told you everything. Obed, the island, 1846, and the door they come up by.
  SEADOOR: There is a sea door under the Hall of Dagon, where they come up into the town.
  SIGN: You know how to make the old sign, a star with a flame in its heart.
  ELIOT: Ruth Eliot will hide you after dark. Come to the back door.
  MARTHA: Ruth has her sister's letter. Martha's door in Newburyport is open to her, day or night.
  PROMISE: You promised Ruth Eliot you would take her son out of Innsmouth.
  RUTH: Ruth and Jonas Eliot are with you.
  SWAM: Jonas went into the water with his father.
  INVITED: The Marsh family wants to see you. They say you have the eyes.
  TRUCK: Eddie's delivery truck leaves for Ipswich at six, from behind the store.
  RODE: You rode out of Innsmouth on Eddie's truck.
  CALLED: You telephoned Boston. A Coast Guard cutter will lie off the harbour mouth from dark until dawn.
  PRIEST: You photographed the priest in his gold tiara.
  PLATE: You have a photograph of something no hoax could explain.
  HUNT: The boats are back from the reef, and the town is hunting.
  SHOGGOTH: Zadok screamed about a shoggoth, and ran.
  RAN: You left Joe Sargent cuffed to his own bus.
  TUNNEL: Esther Marsh took you down the old tunnel from the Marsh cellars to the sea door.
  PRISONER: Joe Sargent is in your handcuffs.
  WARDED: The old sign guards your door tonight.
  SETSTONE: Matt Eliot's stone lies on the floor of room 428.
  BOLTED: You moved the bolt from the door to 430 onto your own door.
  SQUARE: You have seen the Square.
  WATERFRONT: You have walked the waterfront.
  REFINERY: You have been to the refinery.
  GREEN: You have been to New Church Green.
  NORTH: You have been across the river, to the north quarter.
  UPPER: You have walked among the big houses.
  STATION: You have been to the old railway station.
  PARLOUR: You have taken tea in the Marsh parlour.
  ARKHAM: You reached Arkham.
  ROWLEY: You reached Rowley.
  IPSWICH: You reached Ipswich.
  ATSEA: You came away by sea.
  NEWBURYPORT: You came back to Newburyport.

sections:
  # ---------------------------------------------------------------------------------------------------------------
  # ACT ONE: NEWBURYPORT, FRIDAY 15 JULY 1927, MORNING
  # ---------------------------------------------------------------------------------------------------------------

  1:
    title: Mrs. Lowell's
    text: |
      You wake at six under the eaves of a boarding house on Water Street, Newburyport, with gulls on the roof. You came in on last night's train.

      Mrs. Lowell, who keeps the house, is about forty, brisk and freckled. She sets eggs in front of you and asks where you're bound today.

      On the dresser behind her stands a photograph: two girls in white on a beach, laughing, arms round each other. One is Mrs. Lowell, twenty-five years ago. The other is darker and thinner, and stares the camera down.
    choices:
      - text: "Tell her you're going to Innsmouth."
        to: 2
      - text: "Say only that you have a train to catch."
        to: 3

  2:
    title: Martha's Letter
    effects:
      - gain: letter
    text: |
      The coffee pot stops halfway to your cup.

      "Innsmouth," she says, and sits down across from you, which landladies never do.

      Her name was Martha Perkins, of Ipswich. The girl in the photograph is her sister Ruth, who married an Innsmouth man, Amos Eliot, in 1912, and has not been out since. Martha writes every month, and the letters come back unopened. In 1920 she went down herself, and a man at the bridge sent her back. Politely.

      "Amos is dead, I heard. There's a boy." She takes an envelope from behind the clock on the dresser and puts it in your hand. "If you see her, tell her my door's open. Day or night. Tell her to bring the boy."
    choices:
      - text: "Thank her, and go down to the station."
        to: 3

  3:
    title: The 7:45
    extra:
      - requires: {investigator: genealogist}
        before: true
        text: |
          You turned twenty-one in May, and your mother sent you east with a list of names in her worried hand: Ornes, Talbots, and a Marsh she wasn't sure of. Tomorrow you go to Arkham, where your grandmother's people came from.
      - requires: {investigator: agent}
        before: true
        text: |
          For six months you have followed little gold bars stamped *M.R.Co.* from Boston speakeasies back up this coast. The trail ends at a refinery in a town that doesn't answer letters, and at a skipper called Mickey Shea, who owes you for not being in prison.
      - requires: {investigator: antiquarian}
        before: true
        text: |
          The tiara in the Newburyport Historical Society is twin to the gold armlet you have studied at Miskatonic for ten years. The curator, a Miss Tilton, will show it to you at half past eight.
      - requires: {investigator: reporter}
        before: true
        text: |
          The State Board of Health won't discuss "conditions in the town of Innsmouth", and a nurse in Ipswich says there's a sickness up there no doctor writes down. Your editor gave you two days. "Bring me pictures."
      - text: |
          He waits, with the look of a man who has been waiting years to tell somebody.
    text: |
      Friday, the fifteenth of July, 1927. Quarter to eight, and the heat is already coming up off the platform of the Newburyport station.

      The ticket agent is stout and shrewd and from Vermont, which is to say not from here, so he talks.

      "The cheap way south? Joe Sargent's bus. Leaves Hammond's on Market Square at ten, through Innsmouth and on to Arkham." He lowers his voice. "Innsmouth. You heard about Innsmouth?"
    choices:
      - text: "Let him tell you about Innsmouth."
        to: 233
      - text: "Ask him if there's any other way down."
        to: 234
      - text: "Go straight to your appointment with Miss Tilton."
        requires: {investigator: antiquarian}
        to: 4
      - text: "Go down to the Merrimack wharf, and find Mickey Shea."
        requires: {investigator: agent}
        to: 15
      - text: "Thank him, and go and wait for the bus."
        to: 17

  233:
    title: Something in the Blood
    extra:
      - requires: {investigator: genealogist}
        text: |
          When you say you are bound for Arkham, to your grandmother's people, he looks at your eyes a moment too long, and then at the timetable.
      - text: |
          The clock over his window says ten to eight.
    text: |
      Innsmouth was a great port once, he says. Since 1846 it has been dying: a plague that year, or riots, and half the town in the churchyard. Now there's a little gold refinery run by the Marsh family, and more fish than anywhere on the coast.

      "Something wrong with the blood up there." He touches his own neck, below the ear, and doesn't explain. "And there's a reef a mile and a half out. Devil Reef. Boats keep off it."

      If you want to see what Innsmouth makes, he says, the Historical Society on High Street has a gold tiara an Innsmouth man pawned in '73. The library has the old county histories.

      "If you want my advice," he says, "you'll take the Boston train."
    choices:
      - text: "Call at the Historical Society, to see the tiara."
        to: 4
      - text: "Find the public library, and read up on Innsmouth."
        to: 11
      - text: "Ask him how else a body might get down there."
        to: 234
      - text: "Go down to the Merrimack wharf, and find Mickey Shea."
        requires: {investigator: agent}
        to: 15
      - text: "Thank him, and go and wait for the bus."
        to: 17
      - text: "Take his advice. Buy a ticket home."
        to: 21

  234:
    title: Other Ways Down
    extra:
      - requires: {investigator: agent}
        text: |
          Shea. You know Shea. He'll be on the wharf, and he won't be pleased to see you.
      - text: |
          Along the platform, somebody's trunk thumps onto a baggage cart.
    text: |
      He scratches his jaw. "By water, there's Mickey Shea on the Merrimack wharf. He'll take anyone anywhere for ten dollars, and won't ask why."

      He sniffs. "Or there's the 9:05 to Rowley, and walk in from there along the old branch line. Five miles of marsh. If you like walking. Nobody does."
    choices:
      - text: "Walk down to the Merrimack wharf, and find this Shea."
        to: 15
      - text: "Keep your appointment with Miss Tilton instead."
        requires: {investigator: antiquarian}
        to: 4
      - text: "Wait for the 9:05 to Rowley, and walk in along the old line."
        to: 30
      - text: "Thank him, and go and wait for the bus."
        to: 17

  # --- The Historical Society -------------------------------------------------------------------------------------

  4:
    title: The Tiara
    effects:
      - note: TIARA
      - san: "0/1"
    extra:
      - requires: {investigator: antiquarian}
        text: |
          She lets you lift it out, because you wrote first. It is the armlet's twin, and the relief is crisp. Somebody, somewhere, is still working this gold.
      - requires: {investigator: reporter}
        text: |
          Miss Tilton says the light is unsuitable for photographs, which means no. You sketch it instead. Your hand won't draw the faces.
      - requires: {investigator: genealogist}
        text: |
          The gold is the colour of the brooch in your grandmother's photograph. You never thought about that before.
      - text: |
          Miss Tilton rattles her keys.
    text: |
      The Historical Society keeps a white merchant's house on High Street. Miss Anna Tilton, in pince-nez on a chain, opens the door herself. "The tiara," she says. "Everybody wants the tiara."

      In a back parlour with the blinds half drawn, it waits under glass: tall and elliptical, as if made for a head that is not quite round. The gold is pale, almost silver. Round its band runs a frieze of waves and weed, and among the weed, figures. Some are like fish. Some are like frogs. Most are like men, and you stop wanting to decide which.

      "Pirate gold," says Miss Tilton. "A drunken Innsmouth fellow pawned it in '73. The Marsh family offered to buy it back. Twice."

      For a moment you could swear you hear surf.
    choices:
      - text: "Show her your grandmother's photograph."
        requires: {item: portrait}
        to: 5
      - text: "When she goes for the accession book, lift it out and try it on."
        to: 6
      - text: "Thank her, and get on your way."
        to: 17

  5:
    title: The Brooch
    effects:
      - note: ORNE
      - san: "0/1"
    text: |
      "My grandmother," you say. "Abigail Talbot. Born an Orne, in Arkham."

      Miss Tilton holds the photograph close to her pince-nez. "That brooch. Wait here."

      She brings a scrapbook, open at a clipping from 1866: *Married, at Arkham, Mr. Benjamin Orne to Miss Leonie Marsh, of Innsmouth, lately of Paris.* The engraved bride wears the brooch in your photograph.

      "Then your Abigail was her daughter," says Miss Tilton. "And you are..." She looks at your eyes, and shuts the scrapbook rather quickly.
    choices:
      - text: "Thank her, and get on your way."
        to: 17

  6:
    title: Cold Gold
    extra:
      - requires: {investigator: genealogist}
        text: |
          It knows you. It settles the way a hand settles on the shoulder of someone home at last.
      - text: |
          Somewhere, a long way off and very deep, something is pleased.
    text: |
      Miss Tilton goes for the accession book. Her heels click away down the hall.

      The case lifts off easily. The tiara is heavier than it looks, and colder. Because nobody is watching, you set it on your head.

      It fits. The parlour fills with the sound of surf. The light goes green, and you are standing on a black rock in the dark with the tide coming in round your ankles, warm as blood.
    choices:
      - text: "Take it off. Now."
        roll: {skill: POW, success: 9, failure: 7}

  7:
    title: It Won't Come Off
    effects:
      - san: "0/1D3"
    text: |
      You pull. It doesn't come. It holds on, cold and close, the way the sea holds a swimmer's legs.

      The surf is louder. Down the hall, Miss Tilton's heels are coming back.
    choices:
      - text: "Tear it off, whatever it costs."
        roll: {skill: [STR, CON], success: 9, failure: 10}
      - text: "Call out to Miss Tilton for help."
        to: 8

  8:
    title: Miss Tilton
    effects:
      - san: "1/1D3"
    text: |
      Miss Tilton comes in, sees you, and says a word no curator should know. She gets it off with both hands and a knee braced on your chair, and it comes away like a boot out of mud.

      "You'll go now," she says. "And you'll not come back."

      Two red marks stay on your temples all morning.
    choices:
      - text: "Go, and don't look back at it."
        to: 17

  9:
    title: Marks
    effects:
      - san: "1/1D4"
    text: |
      You drag it off with both hands and set it back under the glass, crooked, then straight. Miss Tilton comes back with her book and notices nothing.

      Two red marks stay on your temples all morning.
    choices:
      - text: "Thank her, and get out of this house."
        to: 17

  10:
    title: Returned with Thanks
    ending: claimed
    extra:
      - requires: {investigator: genealogist}
        text: |
          The tallest of them, a woman in a grey veil, takes your face in her cold hands. "Leonie's," she says. That night they give you a room in a white house with green blinds, and nobody ever asks you to leave.
      - text: |
          You only meant to try it on.
    text: |
      You don't remember the rest of the day, or the twelve miles of marsh and shore.

      You remember the dawn. You are standing on a granite breakwater, wet to the waist, wearing the tiara. Behind you is a town you have never seen: three steeples, sagging roofs. Out at sea, a black reef is coming up out of the tide.

      People in grey robes stand on the stones, unblinking, grave and kind. One by one they bow, and thank you for bringing it home.

      Miss Tilton reports a theft and describes you exactly. Nobody comes looking. You live in Innsmouth now. The fish are very good.

  # --- The library ------------------------------------------------------------------------------------------------

  11:
    title: The Reading Room
    text: |
      The public library's reading room is all oak and green-shaded lamps, and old men asleep over newspapers. The librarian brings you the Essex County histories and doesn't ask why.

      The clock says twenty past eight. You have an hour, if you mean to catch anything going south.
    choices:
      - text: "Search the county histories for Innsmouth."
        roll: {skill: [Library Use, History], success: 12, failure: 13}
      - text: "Look up your grandmother's people, the Ornes."
        requires: {investigator: genealogist}
        to: 14
      - text: "Give it up, and get on your way."
        to: 17

  12:
    title: '1846'
    effects:
      - note: HISTORY
    text: |
      Three books, and most of an hour, because each of them says as little as it can.

      A great port until 1812, then the East Indies trade of one Captain Obed Marsh. In 1846, "an epidemic of uncertain nature" carried off half the town, "accompanied by disorders". One braver history says Selectman Mowry's committee jailed Marsh and thirty-two of his associates, and the disorders began the next night. Mowry was never seen again. Nor was Matthew Eliot, Marsh's first mate, who had spoken against him.

      The Masonic Hall was sold to "a new society". The Marshes prospered. Innsmouth did not.
    choices:
      - text: "Close the book, and get on your way."
        to: 17

  13:
    title: Cut Pages
    text: |
      Two of the histories have had their Innsmouth pages razored out, long ago, right down at the spine. The third praises the town's Georgian doorways.

      "It's always been like that," says the librarian.
    choices:
      - text: "Give it up, and get on your way."
        to: 17

  14:
    title: The Orne Line
    effects:
      - note: ORNE
      - note: HISTORY
    text: |
      With your notebook it takes twenty minutes.

      The *Herald*, 1866: Benjamin Orne of Arkham to Miss Leonie Marsh of Innsmouth, "daughter of Captain Obed Marsh, lately returned from Paris". And 1891: Mrs. Leonie Orne, "by drowning, at Kingsport". No burial recorded. Her daughter Abigail, born 1867, was your grandmother.

      So you are a Marsh. Captain Obed Marsh was your great-great-grandfather.

      You look him up in the county history, and read about 1846: the epidemic, the committee that jailed him, the selectman never seen again, the first mate, Matthew Eliot, who spoke against him. It is a warm morning, and you are cold.
    choices:
      - text: "Close the book, and get on your way."
        to: 17

  # --- The Merrimack wharf ----------------------------------------------------------------------------------------

  15:
    title: The Lady Ellen
    extra:
      - requires: {investigator: agent}
        text: |
          He sees you and goes the colour of a fish's belly. "Mr. Brannigan. Lovely morning. I was just going fishing."
      - text: |
          Under the tarpaulin on his deck, something clinks.
    text: |
      On the Merrimack wharf lies the *Lady Ellen*: forty feet of scarred white paint, with an engine far too big for a fishing boat. A heavy man with a broken nose is coiling a line on her deck. This is Mickey Shea.

      "Innsmouth?" He spits over the side. "I tie up at the old Marsh wharf, and I'm never there after dark. There's swimmers out there at night that ain't swimming."

      Ten dollars runs you down this morning. Thirty, and he'll fetch you off the end of the Marsh wharf at midnight. "Not a minute after two. And never out by Devil Reef."
    choices:
      - text: "Lean on him. You know what's in those crates."
        requires: {item: badge}
        to: 16
      - text: "Pay him for both: the run down now, and midnight."
        effects:
          - note: BOAT
        to: 28
      - text: "Pay him for the midnight pickup only, and go by land."
        effects:
          - note: BOAT
        to: 17
      - text: "Leave him to his nets."
        to: 17

  16:
    title: Leverage
    effects:
      - gain: dynamite
    text: |
      You don't raise your voice. You mention the crates, and a judge in Boston, and a boat called the *Kitty B* that went down off Thacher Island with a cargo very like his.

      Shea sees reason. He'll take you anywhere, free, and fetch you off the Marsh wharf at midnight. He swears it on his mother.

      In the locker under the wheelhouse are six sticks of dynamite and a coil of fuse. "For the fishing," Shea says miserably. You confiscate it.
    choices:
      - text: "Go down with him now."
        effects:
          - note: BOAT
        to: 28
      - text: "Go by land, and let him fetch you at midnight."
        effects:
          - note: BOAT
        to: 17

  # --- The way down -----------------------------------------------------------------------------------------------

  17:
    title: Market Square
    extra:
      - requires: {note: TIARA}
        text: |
          You keep thinking of the tiara, and the faces in the weed.
      - requires: {note: HISTORY}
        text: |
          Mowry, Matthew Eliot, thirty-two men in a jail. The histories called it a plague.
      - requires: {note: BOAT}
        text: |
          At midnight the *Lady Ellen* will be at the end of the old Marsh wharf. Shea won't wait past two.
      - text: |
          Down the hill, the 9:05 for Rowley is getting up steam. From Rowley, they say, an old branch line runs across the marsh to Innsmouth, with nothing on it now but grass.
    text: |
      By nine the cobbles of Market Square shimmer in the heat.

      In front of Hammond's Drug Store, with its striped awning, stands Joe Sargent's bus: grey and battered, INNSMOUTH-ARKHAM painted over the door in letters that have run. The driver sits at the wheel in a cap, very still. People walk the long way round it.
    choices:
      - text: "Wait for the bus in Hammond's, out of the sun."
        to: 18
      - text: "Take the 9:05 to Rowley, and walk in along the old line."
        to: 30

  18:
    title: Hammond's
    text: |
      Hammond's is cool and smells of vanilla and carbolic. The soda jerk makes you a lime rickey, and follows your eyes to the bus.

      "Innsmouth? Hope you're bringing your own lunch. Joe Sargent buys his tobacco here. Never says a word. Pays in nickels that smell like a bait bucket."

      On a high shelf behind him stand brown bottles labelled *Spiritus Frumenti*: whiskey, for medicinal purposes, on a doctor's prescription. The druggist, by the look of him, isn't fussy about doctors.
    choices:
      - text: "Ask for something medicinal, for the journey."
        roll: {skill: [Fast Talk, Persuade, Charm], success: 19, failure: 20}
      - text: "Finish your drink, and go out to the bus."
        to: 24

  19:
    title: Spiritus Frumenti
    effects:
      - gain: whiskey
    text: |
      You mention your chest, and the marsh air, and a Boston doctor whose name escapes you. The druggist wraps a brown bottle in brown paper and charges you three dollars.

      "For the chest," he says. "And don't drink it in Innsmouth."
    choices:
      - text: "Go out to the bus."
        to: 24

  20:
    title: No Prescription
    text: |
      The druggist says the law is very particular about prescriptions, and so is he. The soda jerk grins into his rag.
    choices:
      - text: "Go out to the bus."
        to: 24

  21:
    title: The Boston Train
    text: |
      The agent sells you a ticket with the nod a doctor gives a patient who has agreed to stop drinking.

      The 8:10 for Boston comes in, hissing, long and black and ordinary. A boy sells newspapers. Twelve miles south, a town goes about its business without you.
    choices:
      - text: "Get on."
        to: 22
      - text: "Step back. Go and see this tiara of his after all."
        to: 4
      - text: "Step back. Go and find the library, and read up on the place first."
        to: 11

  22:
    title: Rowley
    text: |
      A quarter of an hour out across the marsh, the train stops at a little depot with geraniums in a box. ROWLEY.

      Just past it, a rusty branch line leaves the main line and runs east across the marsh, straight as a rule, with grass between the ties. Toward Innsmouth.

      The conductor calls all aboard.
    choices:
      - text: "Get off, and walk the branch line into Innsmouth."
        to: 30
      - text: "Stay in your seat."
        to: 23

  23:
    title: The Sensible Traveller
    ending: escape
    extra:
      - requires: {investigator: agent}
        text: |
          Your report says the trail went cold in Newburyport. The little gold bars keep coming.
      - requires: {investigator: reporter}
        text: |
          In March your editor runs somebody else's piece about a raid nobody will explain, and asks you where you were.
      - requires: {investigator: antiquarian}
        text: |
          The armlet stays in its case at Miskatonic, unexplained. After hours you stand in front of it, and listen for surf.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you notice that you blink less than other people, and that creases have started at the sides of your neck. You dream of a city under a reef, where your grandmother waits. Leaving changed none of it. You only never learned why.
      - text: |
          A man in a ticket window told you a story, and you believed him. You were the only one who ever did.
    text: |
      The train pulls out. The branch line slides away behind you, and the marsh. You eat a sandwich in the dining car, and are home for supper.

      In February a short paragraph on an inside page says that federal men have raided a town on the North Shore and burned part of its waterfront. Arrests, no trials, no reasons.

      Somebody else went, it seems.
  # ---------------------------------------------------------------------------------------------------------------
  # ACT TWO: INNSMOUTH BY DAY, 11 A.M. TO 8 P.M.
  #
  # Each arrival is the reader's first visit. Then the hubs at 1:00, 2:30, 4:00 and 6:00. Every place leaves by the
  # clock exits: NOON, AFTERNOON, LATE and EVENING decide which hub comes next.
  # ---------------------------------------------------------------------------------------------------------------

  # --- Arrivals ---------------------------------------------------------------------------------------------------

  24:
    title: Joe Sargent's Bus
    text: |
      You are the only passenger. The bus smells of oil and old fish.

      Up close Joe Sargent is about thirty-five, stooped, with a narrow head and a flat nose. His skin is grey and rough as a shark's. His eyes are pale and wet and round, and in forty minutes behind him you never once see them close. His fingers on the wheel are short, and oddly joined.

      The road runs south over the salt marsh, with Plum Island off to the left and the sea beyond. Then it climbs onto a bare crest, and he slows, the way a man slows at a gate.

      Far out to sea lies a long black line of rock, with the water breaking white along it.
    choices:
      - text: "Lean forward, and ask him what that black line out at sea is."
        to: 25
      - text: "Sit quiet, and watch the town come up below you."
        to: 26

  25:
    title: The Mirror
    effects:
      - note: WATCHED
    text: |
      His eyes come up into the long mirror over the windshield, and find you there.

      "Devil Reef," he says, in a voice as thick as if his throat were full of water. That's all. But he watches you, not the road, and the bus drifts toward the ditch.
    choices:
      - text: "Sit back, and say nothing more."
        to: 26

  26:
    title: The Crest
    text: |
      Innsmouth lies below, open like a page.

      A river comes down through the middle of it in a gorge, white with falls, and a mill smokes on the lowest fall. Three steeples, one with no top. A pillared hall on a green up the hill. Hundreds of sagging roofs. Rotten wharves and a long breakwater south of the river, low sheds to the north, big square houses on the hill to the west. At the marsh's edge an empty railway embankment runs off west.

      Far out beyond the breakwater lies the black line of the reef.

      The bus goes down into the town, and the smell of fish comes in through the windows like a hand over your mouth.
    extra:
      - requires: {investigator: genealogist}
        text: |
          He watches you in the mirror the whole way down. Not the road. You.
      - text: |
          The bus coughs to a stop in front of a big yellow hotel with a cupola. Joe Sargent does not turn round.
    choices:
      - text: "Step down into the Square."
        requires: {investigator: genealogist}
        to: 27
      - text: "Step down into the Square."
        requires: {investigator: [agent, antiquarian, reporter]}
        to: 36

  27:
    title: Welcome Home
    effects:
      - note: INVITED
    text: |
      As you step down, Joe Sargent speaks, without turning his head.

      "Marsh, ain't ye? Got the eyes. Family'll want to see ye. White house on Washington Street. Green blinds."

      The door folds shut, and the bus is gone round the corner before you can answer.
    choices:
      - text: "Look about you."
        to: 36

  28:
    title: By Sea
    extra:
      - requires: {investigator: agent}
        text: |
          He wouldn't talk to you, at first. But a frightened man has to talk to somebody.
      - text: |
          Ahead, a long black line of rock lies across the sea. "Devil Reef," says Shea, and crosses himself.
    text: |
      The *Lady Ellen* goes out over the Merrimack bar, and the sea opens up, blue and enormous. Plum Island slides by on the right, then miles of empty salt marsh.

      Shea talks over the engine. Three years running Canadian whisky from a mother ship off Thacher Island, landed where nobody asks, and Innsmouth never asks. The Marsh people take a cut and keep the Coast Guard away.

      "They pay in gold, sometimes. Little bars, funny-coloured." He looks at the water. "I never stay after dark. I seen swimmers out there at night, miles out, no boat near. Swimmers that ain't swimming."
    choices:
      - text: "Ask him to run in close to the reef."
        to: 29
      - text: "Let him give it a wide berth."
        to: 54

  29:
    title: Close to the Reef
    effects:
      - note: REEF
      - san: "1/1D4"
    text: |
      Shea swears, and does it.

      Close to, Devil Reef is long and low and black. Along its top run hollows like doorways, the sea sucking in and out of them. On the near side the water is green over sand. On the seaward side it goes blue, then black, then bottomless, like the edge of a table.

      Something wet and grey, the size of a man, slides off the rocks into the deep.

      Shea doesn't throttle back until the reef is a mile behind you.
    choices:
      - text: "Look ahead, at the town."
        to: 54

  30:
    title: The Old Line
    effects:
      - note: RAILWAY
    text: |
      At Rowley the stationmaster points you down the old Innsmouth branch, says nothing, and goes back inside.

      The rails run east onto the salt marsh on a low embankment, rusty, with grass between the rotten ties. It is hot. The greenheads find you at once.

      After an hour the line sinks into a shallow cutting choked with brambles and sumac. At its west end the Rowley road comes in from the north, crosses the rails, and runs on beside them toward the sea.

      Along one side of the cut, the brambles are trampled flat, as if something lay there in a crowd.
    choices:
      - text: "Push into the trampled brambles."
        to: 31
      - text: "Keep walking."
        to: 235

  31:
    title: Something Lay Here
    effects:
      - gain: robe
      - san: "0/1D3"
    text: |
      In the dust of the Rowley road, where it crosses the rails, there are footprints. Hundreds of them, going both ways: broad and flat and long-toed, with webs between the toes.

      Under the brambles lies a grey robe, wet through and stinking of the sea. You don't know why you take it. You roll it tight under your arm.
    choices:
      - text: "Walk on, toward the town."
        to: 235

  235:
    title: The Trestle
    text: |
      Beyond the cut the road runs along on your right. Another mile, and the line crosses a creek on a wooden trestle, its ties black and gappy over brown water. Then the roofs of Innsmouth come up out of the marsh, grey and too many, and far out beyond them a long black reef lies across the sea, the swell breaking white along it.

      Nobody sees you come.
    choices:
      - text: "Walk on into Innsmouth."
        to: 110

  # --- Hubs -------------------------------------------------------------------------------------------------------

  32:
    title: One O'Clock
    effects:
      - note: NOON
    extra:
      - requires: {note: WATCHED}
        text: |
          Every window has somebody in it. Behind you, curtains fall back into place all down the street.
      - requires: {note: ZADOK}
        text: |
          Since Zadok, you can't stop looking at people's necks.
      - text: |
          A bell strikes one, flat and cracked. Seven hours to the bus.
    text: |
      Midday. No shade, and the smell of fish in everything. Two men shuffle past in rubber boots and look through you with round, wet eyes that do not blink.

      From the top of any street you can see the town: the mill smoking on the lowest fall of the river, the bridge over to the fish sheds of the north quarter, a pillared hall on a green up the hill, the captains' houses on the western hill, and a boarded-up railway station at the top of a steep street. Far out beyond the breakwater lies the long black line of Devil Reef.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
        to: 36
      - text: "Go down to the waterfront."
        requires: {no_note: WATERFRONT}
        to: 54
      - text: "Walk along the river to the mill on the falls."
        requires: {no_note: REFINERY}
        to: 67
      - text: "Climb Church Street to the green with the pillared hall."
        requires: {no_note: GREEN}
        to: 79
      - text: "Cross the bridge into the north quarter."
        requires: {no_note: NORTH}
        to: 92
      - text: "Walk up among the big old houses on the hill."
        requires: {no_note: UPPER}
        to: 99
      - text: "Climb Babson Street to the old railway station."
        requires: {no_note: STATION}
        to: 110
      - text: "Call at the Marsh house, as you were asked."
        requires: [{note: INVITED}, {no_note: PARLOUR}]
        to: 105

  33:
    title: Half Past Two
    effects:
      - note: AFTERNOON
    extra:
      - requires: {note: WATCHED}
        text: |
          A boy follows you for three streets, whistling the same four notes. When you turn round, he looks at the sea.
      - requires: {note: ZADOK}
        text: |
          You catch yourself counting windows, and wondering who is behind them.
      - text: |
          Five and a half hours to the bus.
    text: |
      The worst of the heat. The tide is falling and the harbour stinks.

      In a doorway an old man sits with his eyes wide open, asleep or awake or neither. Behind a blind upstairs, a gramophone plays a hymn slowed down until it is something else. The needle sticks. Nobody lifts it.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
