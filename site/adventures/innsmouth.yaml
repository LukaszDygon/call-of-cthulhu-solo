  111:
    title: The Ticket Office
    effects:
      - gain: crowbar
      - san: "0/1"
    text: |
      There is a crowbar lying in the weeds by the siding, left by a section gang thirty years ago. The boards come off the door with a shriek of nails.

      Inside, dust, and the light coming through the cracks in stripes. A ticket window. A bench. A telegraph key on the agent's desk, its wires cut. Timetables on the wall from 1889, the paper gone the colour of tea.

      The agent's log lies open on the desk. The last entry is in a careful clerk's hand, dated October 1891.

      *Something on the line again last night. Walked down from the town along the ties at two in the morning. Many. Not men. Have written to the Company. Will not stay another night.*

      Below it, in a different hand, in pencil: *Line closed.*

      You take the crowbar with you when you go.
