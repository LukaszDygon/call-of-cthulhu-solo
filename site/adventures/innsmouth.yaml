  101:
    title: Her Eyes
    effects:
      - note: WATCHED
    text: |
      A twig breaks under your foot. She turns.

      Her eyes are the wrong shape. They are round and grey and set too far apart, and they don't blink, and they look at you the way the sea looks at a swimmer. The servant looks at you too, for a long time, as if he were learning your face by heart. Then they go in.
