  62:
    title: The Bathers
    ending: claimed
    extra:
      - requires: {investigator: genealogist}
        text: |
          One of them swims at your side all the way down. She is old, older than anyone you have ever seen, and her face is your grandmother's face, changed. She holds your hand. She says your name, the one only your grandmother ever used. You were thirteen when she went into the sea, and you have missed her every day since, and here she is.
      - text: |
          The fishermen find your clothes on the breakwater that evening. They fold them very neatly, and put them on the stones, and leave them there for you, in case.
    text: |
      They are kind.

      They take your hands, one on each side, and their hands are cool and soft and webbed. They don't pull. They only hold on. Then they go down, and you go down with them, and you find that you don't need to breathe as much as you thought.

      They show you the reef from underneath: its great black roots going down and down into the dark, and the hollows that are doorways, and the light below. There is a light below. A long way down there are towers, and windows, and the windows are lit.

      You mean to go back up. You do. You only want to see a little more.

  63:
    title: The Boathouse
    extra:
      - requires: {investigator: agent}
        text: |
          M.R.Co. The same stamp. Six months of following it, and here it sits in a tobacco tin in a rum-runner's shed.
      - text: |
          Outside, a gull lands on the roof, and walks up and down, and the boards creak under it like footsteps.
    text: |
      The padlock on the boathouse door hangs open on its hasp. Inside it is dim and hot and smells of tar and spilt whisky. Wooden crates are stacked to the rafters under a tarpaulin, stencilled CANNED SALMON, PRODUCT OF NEW BRUNSWICK. Salmon does not clink.

      On a shelf by the door, among coils of rope and a lantern, sits a battered tobacco tin. Inside it, on a bed of greasy cotton wool, lies a little bar of metal the size of a matchbox. It is gold, but pale, almost silver, and stamped on one face with an anchor and the letters *M.R.Co.*
