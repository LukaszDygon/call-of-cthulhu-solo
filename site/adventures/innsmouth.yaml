  83:
    title: The Doorkeeper
    extra:
      - requires: {investigator: genealogist}
        text: |
          When she looks at you properly, she bows her head, as if to someone she was told to expect.
      - requires: {investigator: antiquarian}
        text: |
          Round the great door runs a carved frieze, newer than the building. It is the work of the tiara.
      - text: |
          She waits.
    text: |
      Close to, she is perhaps forty, with a long, pale face and large, calm eyes. "You are welcome," she says, soft and slow. "Strangers so seldom come to us."

      The Order, she says, is older than the Masons who had this building before it. It teaches that all life came from the sea, and that the sea remembers. It has made Innsmouth prosperous.

      "You may see our Hall. All that's asked is the first oath, which is silence." She smiles. "It is a very small oath."
    choices:
      - text: "Swear the oath, and go in."
        to: 86
      - text: "Study the carvings round the door."
        requires: {investigator: antiquarian}
        roll: {skill: [Occult, Archaeology], success: 85, failure: 84}
      - text: "Decline, politely."
        to: 84

  84:
    title: Another Time
    text: |
      She inclines her head. "Another time," she says, as if she is quite sure there will be one.
    choices:
      - text: "Walk on into the town."
        requires: {no_note: NOON}
