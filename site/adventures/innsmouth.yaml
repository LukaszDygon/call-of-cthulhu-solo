  # --- The refinery -----------------------------------------------------------------------------------------------

  67:
    title: The Mill on the Falls
    effects:
      - note: REFINERY
      - san: "0/1D3"
    extra:
      - requires: {investigator: agent}
        text: |
          Six months of little gold bars, and here is where they come from.
      - text: |
          The car drives away up the hill. Nobody in the yard looks at you, which is how you know they have seen you.
    text: |
      The Marsh Refining Company works the old mill on the lowest fall of the river: stone walls, a tall chimney, and the hum of a furnace even in this heat. It smells of hot metal, and under that, of fish.

      In the yard, two men help a third into a long black car with curtained windows. He is very big, and moves wrong. Between the curtains you see an eye, round and pale and enormous, with no lid to close.

      Through the office window by the gate, a big ledger lies open on an empty desk. Down by the tailrace stands a brick shed with EXPLOSIVES stencilled on the door.
    choices:
      - text: "Slip into the office while the clerk is at the furnace."
        roll: {skill: [Stealth, Locksmith], success: 68, failure: 72}
      - text: "Talk your way in. You're a buyer, or a reporter, or a scholar of old mills."
        roll: {skill: [Fast Talk, Persuade], success: 68, failure: 70}
      - text: "Show your badge, and ask to see the books."
