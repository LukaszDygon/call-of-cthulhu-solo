  # --- The Square -------------------------------------------------------------------------------------------------

  36:
    title: The Square
    effects:
      - note: SQUARE
    extra:
      - requires: {investigator: genealogist}
        text: |
          The old men at the firehouse look at you, all at once. One of them nods, the way you nod to someone you know.
      - requires: {note: WATCHED}
        text: |
          People stop what they are doing when you come into the Square. They start again when you look at them.
      - requires: [{note: INVITED}, {no_note: NOON}]
        text: |
          A long black car with curtained windows has drawn up at the kerb. The driver holds the rear door open, and looks at you.
      - requires: {note: EVENING}
        text: |
          The First National's blind is down for the night.
      - text: |
          A clock in the hotel window says the wrong time, and has for years.
    text: |
      The Square is cobbled, and too big for what is left around it. The Gilman House fills one side: four storeys and a cupola, yellow paint coming off in flakes. Beside it stand a shuttered drug store and a chain grocery, the First National, with the only clean window in town.

      Across the cobbles, the Marsh Refining Company's office has its blinds down. On the corner of Paine Street, old men sit on kitchen chairs in an empty firehouse, saying nothing. Down the side street beyond, a sign: VARIETY, on Eliot Street.

      The few people crossing keep to the edges, with a flat-footed shuffle. The sides of their necks are creased, as if the skin there were folded.
    choices:
      - text: "Go into the First National."
        requires: {no_note: EVENING}
        to: 37
      - text: "Find the variety store on Eliot Street."
        to: 40
      - text: "Sit down near the old men at the fire station."
        to: 43
      - text: "Telephone Boston from the booth in the Gilman House lobby."
        requires: {item: badge}
        roll: {skill: [Law, Fast Talk], success: 41, failure: 42}
      - text: "Get into the curtained car."
        requires: [{note: INVITED}, {no_note: NOON}]
        to: 105

  37:
    title: Eddie Pratt
    extra:
      - requires: {investigator: genealogist}
        text: |
          He keeps glancing at your face. "You got kin here? Don't tell me. I don't want to know."
      - text: |
          He looks past you at the door. "Whatever you want, make it quick."
    text: |
      The First National smells of soap and coffee, the first clean smell in town. Behind the counter, a boy of seventeen in a white apron is stacking cans of peaches.

      His name is Eddie Pratt. He's from Arkham, he boards in Ipswich, and he rides home every night at six on the delivery truck. He starts talking the moment the door shuts, low and fast.

      "Don't stare at them. Don't ask about the reef. And don't go near that Hall on the green. They'll ask you in. Don't go."
    choices:
      - text: "Ask him to draw you a map."
        to: 38
      - text: "Ask him if there's room on that truck tonight."
        to: 39
      - text: "Ask him who in this town will talk."
        to: 245
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
        to: 33
      - text: "Walk on. The afternoon is wearing away."
        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
        requires: [{note: LATE}, {no_note: EVENING}]
        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  245:
    title: Who Talks
    text: |
      "Nobody," he says. Then, lower: "Old Zadok Allen, at the fire station. Ninety-six. He'll tell you anything for a bottle, and the variety store on Eliot Street sells it under the counter. But don't let them see you listening to him. A fellow from Boston did, two summers back."

      He doesn't say what happened to the fellow from Boston.
    choices:
      - text: "Buy that bottle on Eliot Street."
        to: 40
      - text: "Ask him to draw you a map, while you're here."
        to: 38
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
        to: 33
      - text: "Walk on. The afternoon is wearing away."
        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
        requires: [{note: LATE}, {no_note: EVENING}]
        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  38:
    title: The Map
    effects:
      - gain: map
      - note: RAILWAY
    text: |
      He tears a paper sack flat and draws fast with a carpenter's pencil: the Square, the river and the bridge, the green, the waterfront, the north quarter, the big houses. And at the edge, the old railway station at the top of Babson Street, with a line running west across the marsh to Rowley.

      "That's how I'd go, if I had to go at night. Never the roads." He pushes it at you. "You didn't get it from me."
    choices:
      - text: "Find the variety store on Eliot Street."
        to: 40
      - text: "Walk on into the town."
        requires: {no_note: NOON}
