  # --- The upper town ---------------------------------------------------------------------------------------------

  99:
    title: Washington Street
    effects:
      - note: UPPER
    extra:
      - requires: {investigator: genealogist}
        text: |
          At the gate she stops and looks straight at you. Her eyes go wide, then soft. She speaks to the servant without looking away from you.
      - requires: {note: WATCHED}
        text: |
          A blind goes up in the white house, and down again.
      - text: |
          A gate creaks somewhere, open and shut, though there's no wind.
    text: |
      West of the Square the ground rises to Washington Street and the old captains' houses: square Federal mansions behind iron fences, their gardens gone wild. Half stand empty, their doors open on dark halls. The rest are shut tight, and not empty.

      The finest is white, with green blinds and a widow's walk. MARSH, says the brass plate on its gate.

      Coming toward it under a parasol is a woman in grey silk, with gold at her throat and wrists and a servant two paces behind. She walks slowly, with a swaying step, like someone wading.
    choices:
      - text: "Follow her at a distance."
        roll: {skill: Stealth, success: 100, failure: 101}
      - text: "Raise your hat to her."
        requires: {investigator: genealogist}
        to: 102
      - text: "Look into one of the empty houses."
        to: 104

  100:
