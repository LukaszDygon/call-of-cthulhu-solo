  50:
    title: Forty-Six
    effects:
      - note: ZADOK
      - note: SEADOOR
      - san: "1/1D4"
    extra:
      - requires: {investigator: genealogist}
        text: |
          At the end he grips your arm with a hand like a bundle of sticks. "Ye've got Obed's eyes. They'll know ye. They'll want ye. Don't let 'em have ye, boy."
      - text: |
          He is hoarse now, and swaying, and his eyes keep going to the sea.
    text: |
      "Forty-six. I was fifteen. Selectman Mowry an' the decent folks jailed Obed an' thirty-two o' his crowd. Next night *they* come up aout o' the harbour. I seen it from our cupola. Hundreds, walkin' up Water Street like folks. Come mornin', half the taown was dead, Obed was aout, an' there was a new church in the Masons' hall: the Order o' Dagon. I took two oaths, silence an' service. Never the third. The third's for them as means to go daown.

      "There's a door under that Hall. A sea door. A shaft clean daown to the reef, an' they come up it when they please. Matt Eliot knowed. He was Obed's mate, an' he fought him, an' he went daown the night they come. His kin's across the river yet. The Eliots."
    choices:
      - text: "Ask him how a body gets out of Innsmouth alive."
        effects:
          - lose: whiskey
        to: 51
      - text: "Ask him what keeps them off."
        effects:
          - lose: whiskey
        to: 52
      - text: "Ask him about the thing he hasn't said yet."
        effects:
