  85:
    title: The Door Frieze
    effects:
      - note: SEADOOR
    text: |
      She lets you look, as one scholar to another. The frieze reads left to right: the sea, things rising from it, a reef with a hole in it, and a shaft running up through the rock into the cellars of a building with pillars. Things climb the shaft. People wait at the top with their arms raised.

      This building.

      "You have a scholar's eye," the doorkeeper says. "Another time, you must come inside."
    choices:
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
