journal:
  NOON: It is past one o'clock.
  AFTERNOON: It is past half past two.
  LATE: It is past four o'clock.
  EVENING: It is past six o'clock. The last bus leaves at eight.
  WATCHED: The town has marked you. You can feel it in every window.
  OATH: You swore the first oath of Dagon. You feel it, like a hook under the skin.
  TIARA: You have seen the Newburyport tiara up close, and you would know that gold anywhere.
  HISTORY: The plague of 1846, Selectman Mowry's committee, and a first mate called Matt Eliot who stood against Obed Marsh.
  ORNE: Leonie Marsh of Innsmouth married Benjamin Orne of Arkham in 1866. She was your grandmother's mother.
  BOAT: Shea will bring the Lady Ellen to the end of the old Marsh wharf at midnight.
  DORY: A sound dory with oars is tied up under the old Marsh wharf.
  RAILWAY: You know the old branch line west across the marsh, and the cut where the Rowley road crosses it.
  HANDCAR: There is a pump handcar on the siding at the old station, and it still runs.
  REEF: You have seen Devil Reef close, and you know where its hollows are.
  ZADOK: Zadok Allen told you everything. Obed, the island, 1846, and the door they come up by.
  SEADOOR: There is a sea door under the Hall of Dagon, where they come up into the town.
  SIGN: You know how to make the old sign, a star with a flame in its heart.
  ELIOT: Ruth Eliot will hide you after dark. Come to the back door.
  MARTHA: Ruth has her sister's letter. Martha's door in Newburyport is open to her, day or night.
  PROMISE: You promised Ruth Eliot you would take her son out of Innsmouth.
  RUTH: Ruth and Jonas Eliot are with you.
  SWAM: Jonas went into the water with his father.
  INVITED: The Marsh family wants to see you. They say you have the eyes.
  TRUCK: Eddie's delivery truck leaves for Ipswich at six, from behind the store.
  RODE: You rode out of Innsmouth on Eddie's truck.
  CALLED: You telephoned Boston. A Coast Guard cutter will lie off the harbour mouth from dark until dawn.
  PRIEST: You photographed the priest in his gold tiara.
  PLATE: You have a photograph of something no hoax could explain.
  HUNT: The boats are back from the reef, and the town is hunting.
  SHOGGOTH: Zadok screamed about a shoggoth, and ran.
  RAN: You left Joe Sargent cuffed to his own bus.
  TUNNEL: Esther Marsh took you down the old tunnel from the Marsh cellars to the sea door.
  PRISONER: Joe Sargent is in your handcuffs.
  WARDED: The old sign guards your door tonight.
  SETSTONE: Matt Eliot's stone lies on the floor of room 428.
  SQUARE: You have seen the Square.
  WATERFRONT: You have walked the waterfront.
  REFINERY: You have been to the refinery.
  GREEN: You have been to New Church Green.
  NORTH: You have been across the river, to the north quarter.
  UPPER: You have walked among the big houses.
  STATION: You have been to the old railway station.
  PARLOUR: You have taken tea in the Marsh parlour.
  ARKHAM: You reached Arkham.
  ROWLEY: You reached Rowley.
  IPSWICH: You reached Ipswich.
  ATSEA: You came away by sea.
  NEWBURYPORT: You came back to Newburyport.

sections:
  # ---------------------------------------------------------------------------------------------------------------
  # ACT ONE: NEWBURYPORT, FRIDAY 15 JULY 1927, MORNING
  # ---------------------------------------------------------------------------------------------------------------

  1:
    title: Mrs. Lowell's
    text: |
      You wake at six in a narrow room under the eaves of a boarding house on Water Street, Newburyport, with the window open on the river and gulls on the roof. You came in on last night's train, too late to look at anything.

      Breakfast is in a kitchen that smells of coffee and fried bread. Mrs. Lowell, who keeps the house, is about forty, brisk and freckled, with her sleeves pushed up and a voice that carries. She sets eggs in front of you and asks, as landladies do, where you're bound today.

      On the dresser behind her, among the plates, stands a photograph in a frame: two girls in white dresses on a beach, laughing, with their arms round each other. One of them is Mrs. Lowell, twenty-five years ago. The other is darker and thinner, and looks straight at the camera as if daring it.
    choices:
      - text: "Tell her you're going to Innsmouth."
        to: 2
      - text: "Say only that you have a train to catch."
        to: 3

  2:
    title: Martha's Letter
    effects:
      - gain: letter
    text: |
      The coffee pot stops halfway to your cup.

      "Innsmouth," Mrs. Lowell says. She sets the pot down very carefully. "Well. You'll be the first lodger I ever had who went."

      She sits down across from you, which landladies never do. Her name was Martha Perkins, she says, of Ipswich. The girl in the photograph is her sister Ruth. In 1912 Ruth married an Innsmouth man called Amos Eliot, against everybody, and went to live there, and has not been out since. Not to their mother's funeral. Not once. Martha writes every month. The letters come back unopened, or don't come back at all. She went down there herself, in 1920, and a man at the bridge sent her back. Politely.

      "Amos is dead, I heard. There's a boy." She gets up, and takes an envelope from behind the clock on the dresser, soft and grubby with waiting, and puts it in your hand. "If you see her. If you only see her. Tell her my door's open. Day or night. Tell her to bring the boy."

      You put it in your inside pocket. She watches you do it, and then she pours your coffee, and her hand is not quite steady.
    choices:
      - text: "Thank her, and go down to the station."
        to: 3

  3:
    title: The 7:45
    extra:
      - requires: {investigator: genealogist}
        before: true
        text: |
          You turned twenty-one in May. Your father gave you a gold watch and a letter of credit. Your mother gave you a list of names in her small, worried hand: Ornes, Talbots, and a Marsh she wasn't sure of. For three weeks you have walked through New England churchyards with a notebook, and you have loved every one of them. Tomorrow, Arkham, where your grandmother's people came from. Today you have a day to spare.
      - requires: {investigator: agent}
        before: true
        text: |
          Six months ago a speakeasy on Hanover Street paid its Canadian supplier in gold: a little bar the size of a matchbox, stamped with an anchor and the letters *M.R.Co.* Since then you have found eleven more. The trail runs up the coast to a refinery in a town that does not answer letters, and to a skipper called Mickey Shea, who owes you for not being in prison.
      - requires: {investigator: antiquarian}
        before: true
        text: |
          For ten years a gold armlet has sat in a case in the Miskatonic museum, and for ten years you have failed to say where it came from. Last month a colleague sent you a photograph of a tiara in the Newburyport Historical Society. It is the same work. The curator, a Miss Tilton, will show it to you at half past eight. After that you have a day, and a town twelve miles south that nobody in Arkham will discuss.
      - requires: {investigator: reporter}
        before: true
        text: |
          The State Board of Health has twice declined to discuss "conditions in the town of Innsmouth". A nurse in Ipswich told you, for the price of a lunch, that there is a sickness up there the doctors never write on a certificate. Your editor gave you train fare and two days. "Bring me pictures," he said. "Nobody reads a disease."
      - requires: {investigator: genealogist}
        text: |
          When you mention your grandmother's people, the agent looks at your face for a moment too long. Then he looks at your eyes, and then at the timetable, as if he has just remembered it.
      - requires: {investigator: agent}
        text: |
          Shea. You know Shea. He will be on the wharf, and he will not be pleased to see you.
      - requires: {investigator: antiquarian}
        text: |
          Miss Tilton will be waiting. You have never known a curator to be late, or to forgive lateness.
      - requires: {investigator: reporter}
        text: |
          You write it all down. The agent watches your pencil and talks faster. Men always do.
      - text: |
          The clock over the window says ten to eight. "Ten o'clock," the agent says again, "from Hammond's. Don't say I didn't tell you."
    text: |
      Friday, the fifteenth of July, 1927. Quarter to eight in the morning, and the heat is already up off the platform.

      Now you stand at the ticket window of the Boston & Maine station with your hat in your hand, and the man behind the grille is talking.

      He is stout and shrewd and not from here. Panton, Vermont, he tells you, as if it explains him. It does: a stranger in a small town will tell another stranger things the town keeps to itself.

      "The cheap way south? Joe Sargent's bus. Leaves Hammond's on Market Square at ten, through Innsmouth and on to Arkham." He lowers his voice. "Innsmouth. You heard of it?"

      You haven't, much. He has.

      It was a great port once, before the War of 1812. Since 1846 it has been dying, he says. A plague that year, or riots, or both, and half the town in the churchyard. Now there is a little gold refinery run by the Marsh family, and fish, more fish than anywhere on the coast, and not much else. Nobody from Newburyport goes there. Nobody from there comes here, except Sargent.

      "Something wrong with the blood up there," he says. "Foreigners, folks say. I never saw a foreigner look like that." He touches his own neck, below the ear, and does not explain.

      There is a reef a mile and a half out. Devil Reef. Boats keep away from it.

      If you want to see what Innsmouth makes, he says, the Historical Society up on High Street has a gold tiara an Innsmouth man pawned in 1873. The public library has the old county histories, if you like reading. And if you want to go by water, there's a man called Shea on the Merrimack wharf "who'll take anyone anywhere for ten dollars, and won't ask why". Or you can take the 9:05 down to Rowley and walk in along the old branch line, if you like walking. Nobody does.

      "If you want my advice," he says, "you'll take the Boston train and see the Old North Church."
    choices:
      - text: "Call at the Historical Society, to see the tiara."
        to: 4
      - text: "Find the public library, and read up on Innsmouth."
        to: 11
      - text: "Walk down to the Merrimack wharf, and find this Shea."
        to: 15
      - text: "You've heard enough. Get on your way."
        to: 17
      - text: "Take his advice. Buy a ticket home."
        to: 21

  # --- The Historical Society -------------------------------------------------------------------------------------

  4:
    title: The Tiara
    effects:
      - note: TIARA
      - san: "0/1"
    extra:
      - requires: {investigator: antiquarian}
        text: |
          Miss Tilton lets you lift it out, because you are from Miskatonic and wrote first. It is the armlet's twin: the same alloy, the same hand, the same sea-things. And it is not old. The edges of the relief are crisp. Somebody, somewhere, is still working this gold.
      - requires: {investigator: reporter}
        text: |
          You ask if you may photograph it. Miss Tilton says the light in the back parlour is unsuitable, which means no. You make a sketch instead. Your hand does not want to draw the faces.
      - requires: {investigator: genealogist}
        text: |
          The gold is the colour of the brooch in your grandmother's photograph. You have looked at that brooch a thousand times. You never thought about it before.
      - text: |
          Miss Tilton rattles her keys. She has letters to answer, and a clock she keeps an eye on.
    text: |
      The Historical Society keeps an old merchant's house on High Street: white clapboard, a fanlight over the door, and a brass plate polished thin.

      Miss Anna Tilton opens the door herself. She is about sixty, in a grey dress and pince-nez on a chain, and she has the air of a woman who has outlived three directors and expects to outlive you.

      "The tiara," she says. "Of course. Everybody wants the tiara."

      She leads you through rooms of ship models and samplers to a back parlour with the blinds half drawn. On a table in the middle, under a glass case, it waits.

      It is tall and elliptical, as if made for a head that is not quite round. The gold is pale, almost silvery, and it takes the light the way water does. Around its band runs a frieze in high relief: the sea, worked in waves and weed, and among the weed, figures. Some are like fish. Some are like frogs. Most are like neither, and like men, and the longer you look the less you want to work out which.

      "Pirate gold," Miss Tilton says firmly. "From the East Indies, or the South Seas. A drunken fellow from Innsmouth pawned it in '73 and was killed in a brawl the same week. The Marsh family offered to buy it back, twice. The Society declined." She sniffs. "They had no proof it was theirs."

      The room is very quiet. For a moment you could swear you hear surf.
    choices:
      - text: "Show her your grandmother's photograph."
        requires: {item: portrait}
        to: 5
      - text: "When she goes for the accession book, lift it out and try it on."
        to: 6
      - text: "Thank her, and get on your way."
        to: 17

  5:
    title: The Brooch
    effects:
      - note: ORNE
      - san: "0/1"
    text: |
      "My grandmother," you say. "Abigail Talbot. She was born an Orne, in Arkham."

      Miss Tilton takes the photograph to the window and holds it close to her pince-nez.

      "That brooch," she says. "Wait here."

      She comes back with a scrapbook and opens it at a yellow clipping from 1866. *Married, at Arkham, Mr. Benjamin Orne to Miss Leonie Marsh, of Innsmouth, lately of Paris.* There is an engraving of the bride. She is very lovely. At her throat is the brooch in your photograph.

      "Then your Abigail was her daughter," says Miss Tilton. "And you are..." She looks up from the clipping to your face. She looks at your eyes. She closes the scrapbook, rather quickly.

      "Well," she says. "It's a small world." She does not offer to show you anything else.
    choices:
      - text: "Thank her, and get on your way."
        to: 17

  6:
    title: Cold Gold
    extra:
      - requires: {investigator: genealogist}
        text: |
          It knows you. That is the only way you can put it, later. It settles the way a hand settles on the shoulder of someone who has been away a long time.
      - text: |
          Somewhere, a long way off and very deep, something is pleased.
    text: |
      Miss Tilton goes out for the accession book. Her heels click away down the hall.

      The case lifts off more easily than it should. The tiara is heavier than it looks, and colder. You lift it, just to feel the weight, and then, because nobody is watching, you set it on your head.

      It fits.

      The sound of surf fills the parlour. The light goes green. You can smell weed, and salt, and something under the salt, and you are standing on a black rock in the dark while the tide comes in round your ankles, warm as blood.
    choices:
      - text: "Take it off. Now."
        roll: {skill: POW, success: 9, failure: 7}

  7:
    title: It Won't Come Off
    effects:
      - san: "0/1D3"
    text: |
      You pull. It doesn't come. It isn't caught in your hair. It simply holds on, cold and close, the way the sea holds a swimmer's legs.

      The surf is louder. The green light comes and goes. Down the hall, Miss Tilton's heels are coming back.
    choices:
      - text: "Tear it off, whatever it costs."
        roll: {skill: [STR, CON], success: 9, failure: 10}
      - text: "Call out to Miss Tilton for help."
        to: 8

  8:
    title: Miss Tilton
    effects:
      - san: "1/1D3"
    text: |
      Miss Tilton comes in, sees you, and says a word no curator should know.

      She gets it off you with both hands and a knee braced against your chair, and it comes away with a sound like a boot pulled out of mud. She puts it back in its case and locks it, and stands with her back to it, breathing hard.

      "You'll go now," she says. "And you'll not come back."

      There are two red marks on your temples all morning, as if something held your head.
    choices:
      - text: "Go, and don't look back at it."
        to: 17

  9:
    title: Marks
    effects:
      - san: "1/1D4"
    text: |
      You drag it off with both hands and set it back on its cushion, and the case down over it, crooked, then straight. Your hands are shaking.

      Miss Tilton comes back with the book and notices nothing. All morning there are two red marks on your temples, as if something held your head.
    choices:
      - text: "Thank her, and get out of this house."
        to: 17

  10:
    title: Returned with Thanks
    ending: claimed
    extra:
      - requires: {investigator: genealogist}
        text: |
          The tallest of them, a woman in a grey veil, takes your face in her cold hands and looks at it for a long time. "Leonie's," she says, and the others murmur. That night they give you a room in a white house on a hill, with green blinds. Nobody ever asks you to leave.
      - text: |
          You only meant to try it on.
    text: |
      You don't remember the rest of the morning, or the afternoon, or the twelve miles of marsh and shore.

      You remember the dawn. You are standing on a breakwater of tumbled granite with the sea lapping at your knees, wet to the waist and wearing the tiara. Behind you is a town you have never seen: three steeples, sagging roofs, gulls. In front of you, far out, a black reef is coming up out of the falling tide.

      There are people on the breakwater. They wear grey robes, and their eyes do not blink. They are very grave and very kind. One by one they come and bow to you, and to what you are wearing, and thank you for bringing it home.

      The Newburyport Historical Society reports a theft to the police. Miss Tilton describes you exactly. Nobody comes looking. In a week or two you stop expecting them to.

      You live in Innsmouth now. The fish are very good.

  # --- The library ------------------------------------------------------------------------------------------------

  11:
    title: The Reading Room
    text: |
      The public library is a fine brick building with a reading room upstairs, all oak and green-shaded lamps and old men asleep over newspapers. The librarian, a young woman with ink on her fingers, brings you the Essex County histories and does not ask why. On the shelf behind her are the bound volumes of the old Newburyport papers, back to the 1830s.

      The clock says twenty past eight. You have an hour, if you mean to catch anything going south.
    choices:
      - text: "Search the county histories for Innsmouth."
        roll: {skill: [Library Use, History], success: 12, failure: 13}
      - text: "Look up your grandmother's people, the Ornes."
        requires: {investigator: genealogist}
        to: 14
      - text: "Give it up, and get on your way."
        to: 17

  12:
    title: '1846'
    effects:
      - note: HISTORY
    text: |
      It takes three books and most of an hour, because each of them says as little as it can.

      Innsmouth, founded 1643. A great port until 1812. Then the decline, the mills on the Manuxet, the East Indies trade of one Captain Obed Marsh. In 1846, "an epidemic of uncertain nature" carried off more than half the town, "accompanied by disorders". One history, braver than the others, says that a committee under Selectman Mowry jailed Captain Marsh and thirty-two of his associates "on a charge since forgotten", and that the disorders began the next night. Mowry was not seen again. Neither was a Matthew Eliot, Marsh's first mate, who "had spoken against him at the meeting-house".

      After that the histories lose interest. The Masonic Hall was sold to "a new society". The Marsh family prospered. The rest of Innsmouth did not.
    choices:
      - text: "Close the book, and get on your way."
        to: 17

  13:
    title: Cut Pages
    text: |
      Two of the histories have had their Innsmouth pages cut out with a razor, long ago, neatly, right down at the spine. The third gives the town a paragraph about its fine Georgian doorways.

      The librarian shrugs. "It's always been like that," she says.
    choices:
      - text: "Give it up, and get on your way."
        to: 17

  14:
    title: The Orne Line
    effects:
      - note: ORNE
      - note: HISTORY
    text: |
      With your notebook it takes twenty minutes. You have done this in a dozen libraries.

      A marriage notice from the *Herald*, 1866: Benjamin Orne of Arkham to Miss Leonie Marsh of Innsmouth, "daughter of Captain Obed Marsh, lately returned from her education in Paris". A death, 1891: Mrs. Leonie Orne, "by drowning, at Kingsport". No burial is recorded. Your grandmother Abigail was born to them in 1867.

      So you are a Marsh. Captain Obed Marsh was your great-great-grandfather.

      Out of curiosity you look him up in the county history. You read about 1846, about the epidemic, and the disorders, and the committee that jailed him, and the selectman who was never seen again. You read it twice. It is a warm morning, and you are cold.
    choices:
      - text: "Close the book, and get on your way."
        to: 17

  # --- The Merrimack wharf ----------------------------------------------------------------------------------------

  15:
    title: The Lady Ellen
    extra:
      - requires: {investigator: agent}
        text: |
          He sees you coming and goes the colour of a fish's belly. "Mr. Brannigan," he says. "Lovely morning. I was just going fishing."
      - text: |
          Behind him, under the tarpaulin, something clinks.
    text: |
      The Merrimack runs brown and fast past the wharves, and the tide is on the turn. Gulls quarrel over a fish-house roof.

      The *Lady Ellen* is forty feet of scarred white paint with a wheelhouse and a big new engine, far too big for a fishing boat. A man is coiling a line on her deck: forty-odd, heavy, with a broken nose and quick small eyes. This is Mickey Shea.

      "Innsmouth?" He spits over the side. "I go down there. I tie up at the old Marsh wharf, and I don't stop long, and I'm never there after dark." He looks at the sea. "There's swimmers out there at night that ain't swimming."

      For ten dollars he'll run you down this morning. For thirty he'll come back and fetch you off the end of the Marsh wharf at midnight. "Not a minute after two, mind. And not the reef. Never the reef."
    choices:
      - text: "Lean on him. You know what's in those crates."
        requires: {item: badge}
        to: 16
      - text: "Pay him for both: the run down now, and midnight."
        effects:
          - note: BOAT
        to: 28
      - text: "Pay him for the midnight pickup only, and go by land."
        effects:
          - note: BOAT
        to: 17
      - text: "Leave him to his nets."
        to: 17

  16:
    title: Leverage
    effects:
      - gain: dynamite
    text: |
      You don't raise your voice. You only mention the crates, and a judge in Boston who owes you a favour, and a ship called the *Kitty B* that went to the bottom off Thacher Island with a cargo very like his.

      Shea sees reason. He will take you wherever you like, for nothing. He will fetch you off the Marsh wharf at midnight. He swears it on his mother.

      While he swears, you open the locker under the wheelhouse. Six sticks of dynamite and a coil of fuse, wrapped in oilcloth. "For the fishing," Shea says miserably. You confiscate it. He doesn't argue.
    choices:
      - text: "Go down with him now."
        effects:
          - note: BOAT
        to: 28
      - text: "Go by land, and let him fetch you at midnight."
        effects:
          - note: BOAT
        to: 17

  # --- The way down -----------------------------------------------------------------------------------------------

  17:
    title: Market Square
    extra:
      - requires: {note: TIARA}
        text: |
          You keep thinking about the tiara: the pale gold, the faces in the weed. Somebody made it for a head that was not quite round.
      - requires: {note: HISTORY}
        text: |
          Selectman Mowry, Matthew Eliot, thirty-two men in a jail. The histories called it a plague.
      - requires: {note: BOAT}
        text: |
          At midnight, the *Lady Ellen* will be at the end of the old Marsh wharf. Shea won't wait past two.
      - text: |
          Behind you, down the hill, a train whistle blows: the 9:05, getting up steam for Rowley and Boston.
    text: |
      By nine the sun is high over Market Square and the cobbles shimmer.

      Hammond's Drug Store has a striped awning and a soda fountain. In front of it stands Joe Sargent's bus: a grey, rattletrap thing with a cracked windscreen and INNSMOUTH-ARKHAM painted over the door in letters that have run. Nobody is waiting for it. The driver sits at the wheel, a stooped shape in a cap, and he doesn't look round. Even from across the square you can see that he doesn't move much.

      People walk the long way round the bus.
    choices:
      - text: "Wait for Joe Sargent's bus in Hammond's, out of the sun."
        to: 18
      - text: "Take the 9:05 to Rowley, and walk in along the old line."
        to: 30

  18:
    title: Hammond's
    text: |
      Hammond's is cool and dim and smells of vanilla and carbolic. A ceiling fan turns slowly over the soda fountain. You take a stool, and the soda jerk, a pink young man with his hair parted in the middle, makes you a lime rickey without being asked.

      Through the window you can see the bus. Its driver hasn't moved.

      "Innsmouth?" says the soda jerk, when he sees where you're looking. "Brother, I hope you're bringing your own lunch." He wipes the counter. "Joe Sargent comes in here for his tobacco. Never says a word. Pays in nickels that smell like the bottom of a bait bucket."

      Behind him, on a high shelf, among the patent medicines, stands a row of brown bottles with printed labels: *Spiritus Frumenti*. For medicinal purposes, on a doctor's prescription. The law allows it. The druggist, by the look of him, allows a great deal.
    choices:
      - text: "Ask for something medicinal, for the journey."
        roll: {skill: [Fast Talk, Persuade, Charm], success: 19, failure: 20}
      - text: "Finish your drink, and go out to the bus."
        to: 24

  19:
    title: Spiritus Frumenti
    effects:
      - gain: whiskey
    text: |
      You mention your chest, and the marsh air, and a doctor in Boston whose name you don't quite remember. The druggist looks at you over his spectacles for a long moment, and then he takes down a brown bottle and wraps it in brown paper and charges you three dollars for it.

      "For the chest," he says. "Don't drink it all at once. And don't drink it in Innsmouth."
    choices:
      - text: "Go out to the bus."
        to: 24

  20:
    title: No Prescription
    text: |
      The druggist looks at you over his spectacles, and says that the law is very particular about prescriptions, and that he is a very particular man. The soda jerk grins into his rag.

      Outside, the bus driver hasn't moved.
    choices:
      - text: "Go out to the bus."
        to: 24

  21:
    title: The Boston Train
    text: |
      The agent sells you a ticket and nods, the way a doctor nods at a patient who has agreed to stop drinking.

      You stand on the platform in the heat. The 8:10 for Boston comes in, hissing, long and black and ordinary. People get off with parcels. A boy sells newspapers. Nothing in the world could be more ordinary than this train.

      Twelve miles south, a town is going about its business without you.
    choices:
      - text: "Get on."
        to: 22
      - text: "Step back. Go and see this tiara of his after all."
        to: 4
      - text: "Step back. Go and find the library, and read up on the place first."
        to: 11

  22:
    title: Rowley
    text: |
      The train runs south across the marsh, all silver water and brown grass, and a quarter of an hour out it stops at a little depot with geraniums in a box. ROWLEY, says the board.

      A rusty branch line leaves the main line just past the depot and runs off east across the marsh toward the sea, straight as a rule, with grass growing between the ties. Toward Innsmouth.

      The conductor calls all aboard.
    choices:
      - text: "Get off, and walk in along the old line after all."
        to: 30
      - text: "Stay in your seat."
        to: 23

  23:
    title: The Sensible Traveller
    ending: escape
    extra:
      - requires: {investigator: agent}
        text: |
          Your report to Boston says the trail went cold in Newburyport. The little gold bars keep coming.
      - requires: {investigator: reporter}
        text: |
          Your editor runs a piece by somebody else in March, about a raid nobody will explain. He asks you, not unkindly, where you were.
      - requires: {investigator: antiquarian}
        text: |
          The armlet stays in its case at Miskatonic, still unexplained. Sometimes you stand in front of it after hours, and listen for surf.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, you notice that you have stopped blinking as often as other people do. You notice the creases starting at the sides of your neck. You dream of a city under a reef, and a woman with your grandmother's face who is waiting for you there. Leaving Newburyport did not change any of that. It only meant you never found out why.
      - text: |
          A man in a ticket window told you a story, and you believed him. You were the only one who ever did.
    text: |
      The train pulls out of Rowley. The branch line slides away behind you, and the marsh, going flat and silver to the sea. You read the paper. You eat a sandwich in the dining car. You are home in time for supper.

      In February you read, in a short paragraph on an inside page, that federal men have raided a town on the North Shore and burned part of its waterfront. There were arrests. There will be no trials. The paragraph does not say why.

      Somebody else went, it seems.
  # ---------------------------------------------------------------------------------------------------------------
  # ACT TWO: INNSMOUTH BY DAY, 11 A.M. TO 8 P.M.
  #
  # Each arrival is the reader's first visit. Then two hubs, town-noon (NOON) and town-late (LATE). Every place
  # leaves by the [town-exit] trio: no NOON → town-noon; NOON, no LATE → town-late; LATE → eight-oclock.
  # ---------------------------------------------------------------------------------------------------------------

  # --- Arrivals ---------------------------------------------------------------------------------------------------

  24:
    title: Joe Sargent's Bus
    text: |
      You are the only passenger.

      The bus smells of oil and old fish, and the seats are split and stuffed with horsehair that pricks through your trousers. Joe Sargent takes your fare without a word. Up close he is about thirty-five, thin and stoop-shouldered, with a narrow head and a flat nose. His skin is grey and rough, like a shark's. His eyes are pale and wet and very round, and in the forty minutes you spend behind him you never once see them close.

      His hands on the wheel are short-fingered, and the fingers are oddly joined.

      Newburyport falls behind. The road runs south over sand and salt marsh, flat and shining, with the long white line of Plum Island off to the left and the sea beyond it. Gulls. Heat. A smell of the flats at low water. There are no houses and no other cars. Telegraph poles march beside the road for a mile, and then the wires stop and the poles go on alone.

      Then the road climbs onto a long, bare crest, and Joe Sargent slows, the way a man slows at a gate.

      Far out to sea, beyond everything, lies a long black line of rock with the water breaking white along it.
    choices:
      - text: "Lean forward, and ask him what that black line out at sea is."
        to: 25
      - text: "Sit quiet, and watch the town come up below you."
        to: 26

  25:
    title: The Mirror
    effects:
      - note: WATCHED
    text: |
      For a moment you think he hasn't heard. Then his eyes come up into the long mirror over the windshield and find you there.

      "Devil Reef," he says. His voice is thick, as if his throat is full of water. That's all he says. But he doesn't look back at the road for a long time, and the bus drifts toward the ditch, and he doesn't seem to care.
    choices:
      - text: "Sit back, and say nothing more."
        to: 26

  26:
    title: The Crest
    text: |
      Innsmouth is below you.

      The whole valley lies open, like a page. A river comes down through the middle of it in a gorge, white with falls, and a mill squats on the lowest fall with smoke going up from its chimney. Three steeples stand above the roofs, and one of them has no top. Up the hill on a green stands a big pale building with pillars. The roofs are grey and sagging, hundreds of them, gambrels and gables, and most of the chimneys have no smoke. South of the river, rotten wharves run out into a harbour clogged with sand, and a long stone breakwater runs out further. North of the river are low sheds. Big square houses stand on the hill to the west. Out at the edge of the marsh, a railway embankment with no trains on it runs off west toward nowhere.

      Far out beyond the breakwater, the reef.

      The bus goes down the hill into the town, and the smell of fish comes in through the windows like a hand over your mouth.
    extra:
      - requires: {investigator: genealogist}
        text: |
          He watches you in the mirror the whole way down. Not the road. You.
      - text: |
          The bus coughs to a stop in front of a big yellow hotel with a cupola. The door folds open. Joe Sargent does not turn round.
    choices:
      - text: "Step down into the Square."
        requires: {investigator: genealogist}
        to: 27
      - text: "Step down into the Square."
        requires: {investigator: [agent, antiquarian, reporter]}
        to: 36

  27:
    title: Welcome Home
    effects:
      - note: INVITED
    text: |
      As you step down, Joe Sargent speaks, without turning his head.

      "Marsh, ain't ye?" His voice is thick and wet. "Got the eyes. Family'll want to see ye. White house on Washington Street. Green blinds."

      The door folds shut, and the bus pulls away round the corner before you can answer.
    choices:
      - text: "Look about you."
        to: 36

  28:
    title: By Sea
    extra:
      - requires: {investigator: agent}
        text: |
          Shea doesn't talk to you, not at first. Then he can't help himself. A frightened man has to talk to somebody.
      - text: |
          Ahead, a long black line of rock lies across the sea, with the swell breaking white along it. "Devil Reef," says Shea, and crosses himself.
    text: |
      The *Lady Ellen* goes down the Merrimack on the ebb and out past the bar, and the sea opens up, blue and glittering and enormous. Shea opens the throttle. The engine hammers. Spray comes over the bow.

      Plum Island slides by on the right, all dunes and beach grass. Then the shore goes low and brown and empty, salt marsh for miles, with creeks wandering through it like worms in wood.

      Shea talks over the engine. He has been running rum for three years: Canadian whisky from a mother ship off Thacher Island, landed wherever nobody asks. Innsmouth never asks. Nobody there talks to anybody. The Marsh people take a cut and keep the Coast Guard away, and he doesn't ask how.

      "They pay in gold, sometimes," he says. "Little bars. Funny-coloured." He looks at the water. "Nice people, I'm sure. I never stay after dark. I seen swimmers out there at night, miles out, no boat near them. Swimmers that ain't swimming, if you take my meaning."

      You don't. He doesn't explain.
    choices:
      - text: "Ask him to run in close to the reef."
        to: 29
      - text: "Let him give it a wide berth."
        to: 54

  29:
    title: Close to the Reef
    effects:
      - note: REEF
      - san: "1/1D4"
    text: |
      Shea swears, and does it.

      Close to, Devil Reef is longer than you thought, and lower. Its rock is black and slick, and along its top run hollows like doorways, a dozen of them, with the sea sucking in and out of them. On the near side the water is green over sand. On the seaward side it goes blue, and then black, and then there is no bottom at all. You can see the edge of it, the place where the reef stops and the deep begins, like the edge of a table.

      Something wet and grey slides off the rocks into the black water. It is the size of a man.

      Shea opens the throttle wide and does not slow down until the reef is a mile behind you.
    choices:
      - text: "Look ahead, at the town."
        to: 54

  30:
    title: The Old Line
    effects:
      - note: RAILWAY
    text: |
      At Rowley you ask the stationmaster about the old Innsmouth branch. He points, and says nothing, and goes back inside.

      The branch line leaves the main line just south of the depot and runs east, straight as a rule, onto the salt marsh. The rails are rusty and the ties are rotten, and grass grows between them. It runs on a low embankment, a few feet above the marsh grass, with the creeks and pools shining on either side. You walk.

      It is hot. The greenheads find you at once. The marsh smells of salt and mud and something rotting. There is no shade anywhere, and no sound but the insects and your own feet on the ties.

      After an hour the line runs down into a cutting, shallow and choked with brambles and sumac, where the Rowley road comes in from the north and crosses the rails at the cutting's west end, then runs on beside them toward the sea. In the cut it is close and still and green. Then you are out the other side, on the embankment again, with the road off to your right.

      Another mile, and the line crosses a creek on a wooden trestle, the ties black and gappy over brown water. Beyond it the roofs of Innsmouth come up out of the marsh: grey, sagging, too many of them. The line runs in past the first sheds to a boarded-up station at the top of a steep street.

      Nobody sees you come.
    choices:
      - text: "Search the trampled brambles in the cut, on the way."
        to: 31
      - text: "Keep walking."
        to: 110

  31:
    title: Something Lay Here
    effects:
      - gain: robe
      - san: "0/1D3"
    text: |
      You went back into the cut, because the brambles were trampled flat along one side, as if something had lain there in a crowd.

      In the dust of the Rowley road, where it crosses the rails, there are footprints. Hundreds of them, going both ways. They are broad and flat, with long toes, and there are webs between the toes.

      Under the brambles lies a grey robe, wet through, stinking of the sea. You don't know why you take it. You roll it up tight under your arm and walk on toward the town.
    choices:
      - text: "Walk on, over the trestle."
        to: 110

  # --- Hubs -------------------------------------------------------------------------------------------------------

  32:
    title: One O'Clock
    effects:
      - note: NOON
    extra:
      - requires: {note: WATCHED}
        text: |
          Every window you pass has somebody in it. You never see them move, but behind you curtains fall back into place, one after another, all the way down the street.
      - requires: {note: ZADOK}
        text: |
          Since Zadok, you can't stop looking at people's necks.
      - text: |
          A church bell somewhere strikes one, flat and cracked. Nobody looks up.
    text: |
      The sun stands overhead and there is no shade. The heat comes up off the cobbles, and with it the smell of fish, everywhere, in everything, so that after a while you stop noticing it and then notice it again.

      Gulls wheel over the harbour. A dog with no hair on its back watches you from a doorway. Two men pass in rubber boots, slowly, with a long, flat-footed shuffle, and they don't look at you; they look past you, and their eyes are round and wet and do not blink. Nobody walks in the middle of the street. Nobody hurries. Nobody says good afternoon.

      Most of the houses are empty. You can tell by the windows. Others are not, and you can tell that too.

      From the top of any street you can see most of the town. The river comes down through the middle in its gorge, with the mill smoking on the lowest fall and the main bridge crossing to the fish sheds of the north quarter. Up the hill stands a green with a big pillared hall. The square houses of the old captains stand on the hill to the west. Below lie the harbour and the wharves. At the south-west edge, at the top of a steep street, there is a little boarded-up railway station.

      Seven hours to the bus.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
        to: 36
      - text: "Go down to the waterfront."
        requires: {no_note: WATERFRONT}
        to: 54
      - text: "Walk along the river to the mill on the falls."
        requires: {no_note: REFINERY}
        to: 67
      - text: "Climb Church Street to the green with the pillared hall."
        requires: {no_note: GREEN}
        to: 79
      - text: "Cross the bridge into the north quarter."
        requires: {no_note: NORTH}
        to: 92
      - text: "Walk up among the big old houses on the hill."
        requires: {no_note: UPPER}
        to: 99
      - text: "Climb Babson Street to the old railway station."
        requires: {no_note: STATION}
        to: 110
      - text: "Call at the Marsh house, as you were asked."
        requires: [{note: INVITED}, {no_note: PARLOUR}]
        to: 105

  33:
    title: Half Past Two
    effects:
      - note: AFTERNOON
    extra:
      - requires: {note: WATCHED}
        text: |
          A boy of about ten falls in behind you and follows you for three streets, whistling the same four notes over and over. When you turn round he stops whistling, and looks at the sea.
      - requires: {note: ZADOK}
        text: |
          You catch yourself counting windows, and wondering who is behind them.
      - text: |
          Five and a half hours to the bus.
    text: |
      The worst of the heat. The tide is falling, and the harbour stinks. Flies hang over the gutters in clouds.

      The town has gone to sleep, or is pretending to. Shutters are closed against the sun. In a doorway an old man sits on a kitchen chair with his eyes wide open, and you cannot tell whether he is asleep or awake or something else. A cat crosses the street ahead of you, very fast, low to the ground, and goes under a house.

      Somewhere a gramophone is playing, in an upstairs room behind a closed blind, a hymn tune slowed down until it sounds like something else. The needle sticks. Nobody lifts it. The same three notes go round and round and round.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
        to: 36
      - text: "Go down to the waterfront."
        requires: {no_note: WATERFRONT}
        to: 54
      - text: "Walk along the river to the mill on the falls."
        requires: {no_note: REFINERY}
        to: 67
      - text: "Climb Church Street to the green with the pillared hall."
        requires: {no_note: GREEN}
        to: 79
      - text: "Cross the bridge into the north quarter."
        requires: {no_note: NORTH}
        to: 92
      - text: "Walk up among the big old houses on the hill."
        requires: {no_note: UPPER}
        to: 99
      - text: "Climb Babson Street to the old railway station."
        requires: {no_note: STATION}
        to: 110
      - text: "Call at the Marsh house, as you were asked."
        requires: [{note: INVITED}, {no_note: PARLOUR}]
        to: 105

  34:
    title: Four O'Clock
    effects:
      - note: LATE
    extra:
      - requires: {note: WATCHED}
        text: |
          A man is standing at the corner behind you. He was standing at the last corner too. When you look, he is looking at the sea.
      - requires: {note: TRUCK}
        text: |
          Eddie's truck goes at six, from behind the store.
      - text: |
          Four hours to the bus.
    text: |
      The shadows have swung round and grown long. The heat goes out of the day, but the smell doesn't.

      Men are coming up from the boats with baskets of fish so big they have to carry them two to a basket. The tide is falling. Out beyond the breakwater the reef is coming up out of the sea, black and glistening, longer every minute.

      A few more people are about now, and they all seem to be going the same way as you, or standing where you are going. Windows that were shut at noon are open. Somewhere a woman is singing, low and wordless, a tune that goes down and down and never comes back up.
    choices:
      - text: "Walk up into the Square."
        requires: {no_note: SQUARE}
        to: 36
      - text: "Go down to the waterfront."
        requires: {no_note: WATERFRONT}
        to: 54
      - text: "Walk along the river to the mill on the falls."
        requires: {no_note: REFINERY}
        to: 67
      - text: "Climb Church Street to the green with the pillared hall."
        requires: {no_note: GREEN}
        to: 79
      - text: "Cross the bridge into the north quarter."
        requires: {no_note: NORTH}
        to: 92
      - text: "Walk up among the big old houses on the hill."
        requires: {no_note: UPPER}
        to: 99
      - text: "Climb Babson Street to the old railway station."
        requires: {no_note: STATION}
        to: 110
      - text: "Call at the Marsh house, as you were asked."
        requires: [{note: INVITED}, {no_note: PARLOUR}]
        to: 105

  35:
    title: Six O'Clock
    effects:
      - note: EVENING
    extra:
      - requires: {note: WATCHED}
        text: |
          They are not pretending any more. Wherever you stop, someone stops too, a little way off, and waits.
      - requires: {note: TRUCK}
        text: |
          Behind the First National, an engine coughs into life. Eddie's truck is about to go.
      - requires: {note: ELIOT}
        text: |
          Ruth Eliot said to come to the back door, if you were still here at dark.
      - text: |
          Two hours to the bus.
    text: |
      The sun is low over the marsh, and the light has gone thick and yellow. The heat goes out of the stones at last.

      Out beyond the breakwater the tide is nearly down, and Devil Reef lies along the sea at its full length, black and wet and shining, longer than you would have believed. Gulls stand on it in rows. Nothing else does. Not yet.

      Down on the waterfront, men are dragging dories to the water's edge and setting oars in them. Somebody is trimming lanterns on the best-kept wharf: you can see the little flames come and go. In the streets, doors that were shut all day stand open, and people sit on their steps in the evening light, facing the sea, saying nothing, waiting for something.
