        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
        requires: [{note: LATE}, {no_note: EVENING}]
        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  94:
    title: Martha
    text: |
      She looks at the writing on the envelope, and the colour goes out of her face. She doesn't open it. She puts it inside her dress, against her skin, and keeps her hand over it.

      "Inside," she says at last. "Quick. The back way."
    choices:
      - text: "Follow her in."
        to: 96

  95:
    title: Not Here
    text: |
      "Go away," she says, without moving her lips. "Go back over the bridge. You'll get us killed."

      She picks up her net. The boy goes inside. A curtain moves in the house next door.
    choices:
      - text: "Climb up to the poorhouse on the rim instead."
        to: 44
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
        to: 33
      - text: "Walk on. The afternoon is wearing away."
        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
