          A man is mending a net on the wharf. He doesn't look at the net. He looks at you.
      - text: |
          A bell buoy clangs, far out, over and over, slow as a heartbeat.
    text: |
      Water Street runs along the harbour, and the harbour is dying.

      Warehouses of brick and granite stand in a row with their roofs fallen in and their doors gone, and through the doorways you can see the sky. Fish Street is the same, only worse. The wharves run out into the water on piles so rotten that some of them have sagged into the harbour at one end, like drunk men kneeling. Sand has silted the harbour up, all but a channel, and gulls stand on the sandbars and scream.

      One wharf is in better repair than the rest. The old Marsh wharf, somebody has painted on a board, long ago. There is a newer boathouse at its root, with a padlock on the door.

      A long stone breakwater runs out from the south end of the harbour, with the stump of a lighthouse at its tip. Men are fishing from it.

      Far out, children are swimming. You can see their heads, small and dark, a long way beyond the breakwater. Much too far out. Nobody on shore is watching them. Beyond them, the reef.
    choices:
      - text: "Walk out along the breakwater."
        to: 55
      - text: "Look into the boathouse on the Marsh wharf."
        to: 63
      - text: "Climb down under the wharf, where something knocks against the piles."
        to: 66

  55:
    title: The Breakwater
    text: |
      The breakwater is a long ridge of tumbled granite blocks, wet and weedy, with the sea slopping between them. Men sit along it with hand lines. They have the look, all of them. Their baskets are full of fish so big and so many that it is wrong for July: cod and haddock and things you can't name, still flapping.

      Nobody speaks to you. At the end, the lighthouse is only a stump of brick with a rusted door.

      The swimmers are closer from here, but not much. There are six or seven of them, a long way out in the deep water, where the waves come in green and heavy. They are treading water and looking back at the shore. One of them waves to you.

      Past them, through the heat haze, lies the reef.
    choices:
      - text: "Walk back along the wharves to the boathouse."
        to: 63
      - text: "Study the reef."
        roll: {skill: Spot Hidden, success: 56, failure: 57}
      - text: "Strip off, and swim out to the bathers."
        to: 58
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
        to: 33
      - text: "Walk on. The afternoon is wearing away."
        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
        requires: [{note: LATE}, {no_note: EVENING}]
        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  56:
    title: Through the Haze
    effects:
      - note: REEF
    text: |
      You shade your eyes and look until they water.

      The reef is long and low and black. Along its top are hollows, dark mouths, a dozen or more. Its near side shelves into green water. Its far side doesn't shelve at all: the swell goes over the edge and down, dark blue, then black. At the north end, one hollow is bigger than the rest, and the sea pours into it and doesn't come back out.

      You fix the shape of it in your mind, and the place of the big hollow.
