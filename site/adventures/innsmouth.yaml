  # --- The refinery -----------------------------------------------------------------------------------------------

  67:
    title: The Mill on the Falls
    effects:
      - note: REFINERY
      - san: "0/1D3"
    extra:
      - requires: {investigator: agent}
        text: |
          Six months of little gold bars, and here is where they come from. You can smell the furnace from the bridge.
      - text: |
          The car drives away up the hill. Nobody in the yard looks at you, which is how you know they have seen you.
    text: |
      The Marsh Refining Company works the old mill on the lowest fall of the Manuxet, where the river comes down white over a ledge of rock and runs out under the bridge to the sea. It is a long stone building with a slate roof and a tall brick chimney, and it hums. A furnace somewhere inside is going, even in this heat. The air smells of hot metal, and under the metal, of fish.

      There is a yard with a high fence, and in the yard a long black car with curtains drawn across all its windows. As you watch, two men come out of a side door half carrying a third between them. He is very big and moves wrong, as if his legs bend in places legs shouldn't. They fold him into the car. For a moment, between the curtains, you see an eye. It is round and pale and enormous, and it has no lid to close.

      Through the window of the office by the gate you can see a desk, and on the desk a big ledger lying open. Nobody is in the office. Down by the tailrace, where the river comes out from under the mill, stands a little brick shed with EXPLOSIVES stencilled on the door in red.
    choices:
      - text: "Slip into the office while the clerk is at the furnace."
        roll: {skill: [Stealth, Locksmith], success: 68, failure: 72}
      - text: "Talk your way in. You're a buyer, or a reporter, or a scholar of old mills."
        roll: {skill: [Fast Talk, Persuade], success: 68, failure: 70}
      - text: "Show your badge, and ask to see the books."
        requires: {item: badge, skill: Law, min: 40}
        effects:
          - note: WATCHED
        roll: {skill: [Law, Intimidate], success: 68, failure: 70}
      - text: "Get into the shed by the tailrace."
        roll: {skill: [Locksmith, STR], success: 71, failure: 72}
