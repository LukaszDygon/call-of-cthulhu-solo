        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  98:
    title: The Stone
    effects:
      - gain: sign-stone
      - note: PROMISE
    extra:
      - requires: {investigator: antiquarian}
        text: |
          It is the sign in your notes, cut in the stone it was always meant for. Your hands shake.
      - text: |
          Jonas stands by his mother and looks at you. He doesn't need to say anything.
    text: |
      She looks at you a long time. Then she unwraps the oilcloth.

      It is a stone the size of your palm, grey-green and smooth as a beach pebble. A five-pointed star is cut deep into one face, with a flame in its heart.

      "Matt brought it home from that island. Obed never knew. It's kept this house. The old ones won't even walk past the door." She closes your fingers over it. "Now it'll keep him. You promised."
