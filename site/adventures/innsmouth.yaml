  # --- Zadok ------------------------------------------------------------------------------------------------------

  43:
    title: The Fire Station
    extra:
      - requires: {note: ZADOK}
        text: |
          Zadok sees you, and turns his chair to face the wall.
      - text: |
          A fly walks across one old man's cheek, up to the corner of his eye. He doesn't blink.
    text: |
      The old men sit in a row in the shade of the firehouse door, on kitchen chairs, with their hands on their knees. They don't talk. They don't look at you. They look at the Square, or at nothing.

      One of them sits a little apart. He is older than the others, so old that he looks carved: a long white beard stained yellow round the mouth, a coat that was black once, boots tied with string. His eyes are red-rimmed and watery, and they move. His eyes blink. He is the only one here whose eyes blink.

      "Don't mind Zadok," says one of the others, without turning his head. "Zadok's simple."

      The old man's eyes slide toward you and away.
