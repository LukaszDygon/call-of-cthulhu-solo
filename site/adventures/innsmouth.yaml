  75:
    title: The Sluice Room
    effects:
      - lose: ledger
      - lose: dynamite
      - san: "1/1D6"
    text: |
      They turn out your pockets first, and take back anything that came from the mill. Then they take you down a flight of wet stone steps into a cellar under the mill, and push you into a room, and shut an iron door on you, and bolt it.

      It is a sluice room, low and vaulted, at the level of the river. Half the floor is a channel of black water running under the wall. Where the channel goes under the wall there is an iron grate, and beyond the grate, a tunnel, and the sound of water in the dark.

      You sit on the steps with your back to the door. Hours go by. You can hear the furnace above you, and the river, and something else.

      Something is moving in the tunnel. The water bulges against the grate. A hand comes through the bars, a grey, webbed hand, and pushes a lump of rock onto the stones. The rock is shot through with veins of pale yellow metal. The hand goes away. A while later it comes back with another.

      It doesn't seem to notice you. That is almost the worst part.
    choices:
      - text: "Wait. Someone will come."
        to: 76
      - text: "Squeeze through the grate into the tunnel."
        roll: {skill: [Swim, STR], success: 77, failure: 78}

  76:
    title: The Bus Is Waiting
    text: |
      At a quarter to eight the bolt slides back.

      A man with the look stands in the doorway with a lantern. "Bus is waitin'," he says, and grins. His teeth are small and pointed and there are too many of them.

      He walks you up the steps, through the empty mill and out of the gate, and points you up the hill toward the Square. Then he stands and watches you go.
    choices:
      - text: "Walk up to the Square."
        to: 116

  77:
    title: The River Tunnel
    effects:
      - note: SEADOOR
      - san: "1/1D4"
    text: |
      You go through the grate on your back with your face in the air pocket, and the cold takes your breath.

      The tunnel runs two ways. One way goes downriver, toward the light. The other goes down, steeply, into the dark, under the town, toward the sea. Far down that way, a long way off, you see steps cut in the rock, and a light on them, greenish, and things moving on the steps. You understand that the tunnel goes all the way to the sea, and that at the top of it, somewhere under the hill where the pillared hall stands, there is a door.

      You go the other way. You come out in the river below the falls as the sun goes down, and drag yourself up the bank, and lie there in the mud until you can stand.
    choices:
      - text: "Walk up to the Square, dripping."
        to: 116

  78:
    title: Not That Way
    effects:
      - hp: "-1D4"
    text: |
      Halfway through the bars, something takes your ankle in the dark water and pulls, hard and slow. You tear free and drag yourself back into the sluice room, bleeding from the shin, and lie on the steps until you stop shaking.

      You don't try again.
    choices:
      - text: "Wait for someone to come."
        to: 76

  # --- New Church Green -------------------------------------------------------------------------------------------

  79:
    title: New Church Green
    effects:
      - note: GREEN
    extra:
      - requires: {note: WATCHED}
        text: |
          The woman on the steps turns her head and watches you all the way up the hill.
      - text: |
          Somewhere below the ground, under the stone church, people are chanting. It goes on and on, never louder, never softer, like the sea.
    text: |
      Church Street climbs from the Square to a green gone to hay, with a dry fountain in the middle and elms dying round the edge.

      Two buildings face each other across it.

      One is the old Masonic Hall: tall, Greek, with four grey pillars holding up a pediment, and paint peeling off it in long strips like sunburnt skin. Over the door, where the square and compasses used to be, gilt letters have been put up instead. ESOTERIC ORDER OF DAGON. On the steps stands a woman in a grey robe, with a ring of keys at her belt. She is perfectly still.

      The other is a church of grey stone, squat and heavy, with a short square tower and Gothic windows. It sits up high on a basement storey, and the basement windows are shuttered. All but one. From somewhere under it comes a low sound of voices.

      A bell rings once in the tower, and stops.
    choices:
