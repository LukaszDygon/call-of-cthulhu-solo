  96:
    title: The Eliot Kitchen
    effects:
      - note: ELIOT
      - note: SIGN
      - note: SEADOOR
    extra:
      - requires: {investigator: genealogist}
        text: |
          Once, while she is talking, she looks at you full in the face and stops. "You've got Marsh eyes," she says. "I'd know them anywhere. Amos had a touch of them." She goes on looking. "I don't care. Do you hear me? I don't care whose you are."
      - requires: {note: MARTHA}
        text: |
          Martha's letter is on the table between you now, open. Ruth has read it three times. Every time she gets to the end, she touches the last line with one finger. *My door is open. Bring the boy.*
      - text: |
          "If you're still in Innsmouth at dark," she says, "come to the back door. Not the front. Knock twice."
    text: |
      Her name is Ruth Eliot, and she was Ruth Perkins of Ipswich once, and she takes you inside, quickly, by the back door.

      The kitchen is small and scrubbed and plain, with a black range and a table and a window over the river. She doesn't offer you anything. She talks the way a dam breaks.

      She married Amos Eliot when she was nineteen, against her family, because she loved him, and he loved her. He was Matt Eliot's great-grandson, and he had a touch of the blood, the way most of the old families do. When it began to come on him, he would not take the second oath. In 1924 he went off the breakwater one night and didn't come back. "Drowned," the town clerk wrote. He didn't drown.

      She stayed for Jonas. Where could she take him, with eyes like that? And the Order watches her. Now they have put Jonas's name down for Hallowe'en. The third oath. "He's twelve," she says. "He's *twelve*."

      From under the bed she drags a sea-chest, old oak, bound with brass, with *M. ELIOT* burned into the lid. Matt Eliot's journal is in it, from 1846. He drew the old sign in it: a star, and a flame in its heart. He wrote that there is a door under the Masons' hall where *they* come up from the sea, and that he meant to stop it, the night he disappeared.

      At the bottom of the chest is something heavy, wrapped in oilcloth. She looks at it, and at you, and doesn't unwrap it.
    choices:
