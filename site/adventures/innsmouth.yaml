  # --- The waterfront ---------------------------------------------------------------------------------------------

  54:
    title: Water Street
    effects:
      - note: WATERFRONT
    extra:
      - requires: [{note: BOAT}, {no_note: NOON}]
        before: true
        text: |
          Shea brings the *Lady Ellen* in against the end of the old Marsh wharf, and you go up a slimy ladder. Two men with the look come down to take his crates without a word. "Midnight," Shea says, not looking at you. "Here. Not a minute after two." Then he is gone, out past the breakwater, as fast as the engine will take him.
      - requires: {note: WATCHED}
