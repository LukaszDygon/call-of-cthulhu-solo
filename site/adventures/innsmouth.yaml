      - requires: [{item: flask}, {no_item: whiskey}]
        before: true
        text: |
          It's your own flask he drinks from, and it is empty in twenty minutes. He doesn't seem to mind. The talk keeps coming after the rye has gone.
      - requires: [{no_item: flask}, {no_item: whiskey}]
        before: true
        text: |
          He has nothing to drink, and he doesn't seem to need it. The name Mowry has pulled a cork in him.
      - text: |
          He wipes his mouth, and looks at you sidelong, to see if you want the rest.
    text: |
      Then he talks, and once he has started he can't stop.

      "Obed Marsh. Cap'n Obed. Had three ships: the *Columby*, the *Hetty*, the *Sumatry Queen*. Trade went bad after the war with England, an' Obed went lookin' for new trade, way off past the Indies, places no chart had. Found an island. Nobody on it. Nobody *livin'*. Stone ruins, older'n anything, an' carvin's all over 'em. Fish that was men. Men that was fish. An' the people that built 'em had all gone daown into the sea, every one, long back. Gone daown to *them*.

      "Obed found the lead things. Little lead charms, like. Throw 'em in the water an' say the words, an' *they* come up. An' Obed, he made his bargain. Fish, an' gold. Gold you never seen, from daown under. An' what they wanted back..." He wipes his mouth. "Young folks. Twice a year. May-Eve an' Hallowe'en. Out on the reef. An' after a while they wanted more'n that. They wanted to *mix*.

    choices:
