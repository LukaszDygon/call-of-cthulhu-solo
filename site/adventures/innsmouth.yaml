  # --- Eddie's truck ----------------------------------------------------------------------------------------------

  114:
    title: The Six O'Clock
    effects:
      - note: RODE
    extra:
      - requires: {note: WATCHED}
        text: |
          A long black car with curtained windows follows a hundred yards back to the edge of the marsh, then stops in the road and sits there, getting smaller.
      - text: |
          Behind you, Innsmouth sinks into the marsh until it is only a smudge, and then not even that.
    text: |
      An old Reo truck is backing into the alley behind the First National, a sour man at the wheel. Eddie comes out with his cap on, sees you, and something in his face lets go. "In the back. Under the tarp. Don't sit up till I say."

      You lie among empty milk crates while the truck bounces out of town by the Ipswich road. Once it slows. Voices. A long pause. Then on.

      At last Eddie bangs on the cab, and you sit up into the gold evening light over the marsh.
    choices:
      - text: "Ride on to Ipswich."
        to: 115

  115:
    title: Ipswich
    effects:
      - note: IPSWICH
    text: |
      The truck sets you down on the Ipswich green a little after seven: elms, white houses, a church clock that tells the right time. A policeman nods to you.

      "You were lucky," Eddie says, shaking your hand hard. "You don't know how lucky." He doesn't go to his lodgings. He stands with you, twisting his cap, waiting to see what you'll do.

      Twelve miles north, the boats will go out to the reef at moonrise. You have whatever you brought out with you.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Go home."
        to: 226
  # ===================================================================== ACT THREE: THE NIGHT
  # ----------------------------------------------------- Eight o'clock

  116:
    title: Eight O'Clock
    effects:
      - unnote: NOON
      - unnote: AFTERNOON
      - unnote: LATE
      - unnote: EVENING
    text: |
      A quarter to eight. The light lies gold and long across the Square, and every west window burns with it.

      Joe Sargent's bus waits at the steps of the big yellow hotel, the Gilman House, with its door folded open.

      The Square is not empty now. People stand in every doorway: men in work clothes, women in shawls, a boy holding his mother's skirt. Nobody talks. Every face is turned toward the bus, and toward you. None of them blinks.
    extra:
      - requires: [{note: WATCHED}, {no_note: OATH}]
        text: |
          The bus's hood is up. Joe Sargent wipes his hands on a rag and looks at you, not at the engine. "Engine trouble. No bus till mornin'."

          On the hotel steps the night clerk holds up a room key on a brass tag. "Room's ready," he says.
      - requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        text: |
          The engine idles with a wet cough. Joe Sargent sits at the wheel and watches you in his long mirror.
      - requires: [{note: WATCHED}, {note: OATH}]
        text: |
          Something passes between the people in the doorways. You swore on the green, and a sworn member of the Order comes and goes as he pleases. The oath holds.
      - requires: [{investigator: genealogist}, {note: INVITED}]
        text: |
          At the corner of Paine Street a long black car waits, blinds drawn, its back door open. You know whose car it is.
      - text: |
          Up on the green, a bell begins to ring.
    choices:
      - text: "Climb aboard."
        requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        to: 122
      - text: "Let it go without you. You're not finished here."
        requires: {any: [{no_note: WATCHED}, {note: OATH}]}
        to: 118
      - text: "Turn away from the bus."
        requires: [{note: WATCHED}, {no_note: OATH}]
        to: 117
      - text: "Cuff the driver to his own rail, and drive the bus out yourself."
        requires: [{item: handcuffs}, {note: WATCHED}, {no_note: OATH}]
        to: 119
      - text: "Get into the black car."
        requires: [{investigator: genealogist}, {note: INVITED}]
        to: 186

  117:
    title: Room's Ready
    text: |
      You walk away from the bus. The night clerk comes down the hotel steps and holds out the key. It hangs from a brass tag the size of your palm: *428*.

      "Ye'll want to be indoors, after dark."

      The sun goes down. Up on the green, the bell stops.
    choices:
      - text: "Take the key."
        to: 129
      - text: "Walk away from the Square, and leave him holding it."
        to: 128

  118:
    title: The Bus Goes
    text: |
      You stand back. The door folds shut, and the bus coughs out of the Square, west, up the hill and over it.

      All round the Square the faces turn toward you, all together, the way grass turns in the wind.

      You are the only stranger left in Innsmouth.
    choices:
      - text: "Walk out of the Square, as the sun goes down."
        to: 128

  119:
    title: The Driver's Rail
    text: |
      You climb the step as if to argue. Before Joe Sargent has finished turning his head, one cuff is round his wrist and the other round the chrome rail by the wheel.

      He doesn't pull at it. Something like a smile moves under his grey skin.

      The doorways empty. The people in them step down into the Square, all at once, and walk toward the bus.

      You throw up the hood. It takes you five seconds to see it: the lead from the coil, pulled out of its socket, as neat as a cut thread.
    choices:
      - text: "Fix it, fast."
        roll: {skill: [Mechanical Repair, Drive Auto], success: 121, failure: 120}
      - text: "Leave him cuffed to his rail, and run."
        effects: [{lose: handcuffs}, {note: RAN}]
        to: 128

  120:
    title: The Crowd
    effects:
      - lose: handcuffs
    text: |
      The lead won't seat. When you look up there are hands on the fender, on the hood, on your sleeves: cold hands, too many of them. Somebody takes the key off your watch chain and lets Joe Sargent go.
    choices:
      - text: "Go with them. There is nothing else to do."
        to: 194

  121:
    title: Joe Sargent's Bus
    effects:
      - note: PRISONER
      - note: ARKHAM
    text: |
      The lead goes home. You swing into the driver's seat beside your prisoner and stand on the starter, and the people in the Square stop walking.

      You take the bus out of town in a scream of gears, onto the causeway over the marsh. Joe Sargent rides with his wrist on the rail and hums the same six notes, round and round.

      A car with no lights sits on your tail for three miles. At the crossroads it stops in the road, and lets you go.

      At half past nine you pull up outside Arkham police headquarters with your hand on the horn. Joe Sargent stops humming.

      "Ye'll have to let me go home sometime," he says.
    choices:
      - text: "Walk him inside, and start talking."
        to: 224

  122:
    title: The Last Bus
    text: |
      You climb aboard and take the seat behind the driver. The door folds shut. In a doorway an old woman lifts her hand halfway, the way you would to someone you expect to see again.

      At the top of the rise you turn in your seat. Innsmouth lies in its valley in the last light, with the sea going violet beyond it. Down on the wharves someone lights a lantern. Then another.

      Then the road drops into the marsh, and the town is gone.
    choices:
      - text: "Ride on, into the marsh."
        to: 123

  123:
    title: The Marsh Road
    text: |
      For an hour there is only marsh, and the sky going black, and the bus rattling behind its one good headlamp. Whenever you look up, Joe Sargent's eyes are in the long mirror, wet and pale and fixed on you.

      In the last of the marsh the moon comes up behind you out of the sea, red as a coal. And there, with no light anywhere, the bus stops. Joe Sargent sets the brake, climbs down, and walks off into the dark toward the sea without a word.

      The engine idles.
    choices:
      - text: "Stay in your seat, and wait."
        to: 127
      - text: "Get down, and go after him."
        to: 124

  124:
    title: In the Creek
    effects:
      - san: "1/1D4"
    text: |
      You follow the sound of his boots through the wet grass, and then it stops.

      He stands knee-deep in a creek, facing the red moon, head tipped back, making a low wet sound in his throat. Not a song. Something older.

      Far out toward the sea, something answers.

      He turns and looks at you, and his eyes catch the moon like a cat's. Then he wades out, walks past you, fast, and climbs back into his seat.

      The door is still open. The bus begins to roll.
    choices:
      - text: "Run for it."
        roll: {skill: [DEX, Jump], success: 125, failure: 126}

  125:
    title: The Step
    text: |
      You catch the rail and swing up onto the step as the bus gathers speed. The door folds shut behind you. Joe Sargent drives on as if nothing had happened.
    choices:
      - text: "Sit down, and don't get up again."
        to: 127

  126:
    title: Tail Lights
    effects:
      - san: "0/1D3"
    text: |
      Your foot goes into a creek to the knee. By the time it's out, the bus is a hundred yards up the road, its one red lamp swaying away into the dark. It doesn't stop.

      You are alone in the salt marsh, under the moon.

      Out toward the sea, the thing that answered him answers again. Closer.
    choices:
      - text: "Get off the road, and away from whatever that is."
        to: 214

  127:
    title: Arkham
    effects:
      - note: ARKHAM
    text: |
      He drives on, and never once blinks. At half past nine the lights of Arkham come up out of the dark: gas lamps, a college tower, a girl in a drugstore window. You could weep at them.

      The bus stops. The door folds open.
    extra:
      - requires: {investigator: genealogist}
        text: |
          As you step down, Joe Sargent speaks to the mirror. "Ye'll be back," he says. "Your kind always comes back."
      - requires: {note: OATH}
        text: |
          Joe Sargent touches two fingers to his cap as you pass. You will be greeted that way, you understand, for the rest of your life, in harbour towns up and down this coast.
      - text: |
          You stand on the pavement with the whole of Innsmouth in your head, and have to decide what to do with it.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Find a hotel, and try to forget it."
        to: 227

  128:
    title: Dusk
    text: |
      A quarter past eight, and Innsmouth closes like a hand: doors slamming, bars dropping into brackets, shutters folding to. Then silence, and the river talking under the bridge.

      Down on the waterfront a string of lanterns bobs toward the wharves. Oars knock in rowlocks. Boats are being made ready.

      Devil Reef lies black on a red sea. The moon isn't up yet. When it comes, it will rise behind the reef.
    extra:
      - requires: [{note: WATCHED}, {no_note: OATH}, {no_note: RAN}]
        before: true
        text: |
          The dead bus stands at the hotel steps. The night clerk waits beside it with his brass key, watching which way you go.
      - requires: {note: RAN}
        before: true
        text: |
          Behind you the crowd has closed round the bus like water round a stone. Joe Sargent sits at the wheel, still cuffed to the rail, watching which way you go.
      - requires: {note: ZADOK}
        text: |
          Zadok told you what comes up out of the water with the moon. You find you are listening for it already.
      - text: |
          You have an hour, perhaps a little more. Whatever you mean to do tonight, choose it now.
    choices:
      - text: "Take a room at the Gilman House, and lock the door."
        to: 129
      - text: "Go to Ruth Eliot's back door."
        requires: {note: ELIOT}
        to: 148
      - text: "Go up to the white house on Washington Street, where the family wants you."
        requires: {note: INVITED}
        to: 186
      - text: "Hide on the old Marsh wharf until Shea comes at midnight."
        requires: {note: BOAT}
        to: 159
      - text: "Find the dory under the old Marsh wharf."
        requires: {note: DORY}
        to: 161
      - text: "Get into the pillared hall on the green while the town is out at the reef."
        requires: {any: [{note: SEADOOR}, {item: robe}, {note: OATH}]}
        to: 176
      - text: "Walk out of town now, before the moon is up."
        to: 190

  # ----------------------------------------------------- The Gilman House

  129:
    title: Room 428
    text: |
      The night clerk turns the register round for you to sign. His head is as narrow as a hatchet, and above his buttoned collar the skin of his throat lies in long soft folds.

      "Four twenty-eight," he says, and taps the brass tag. "Top floor. Back."

      Room 428 is small and bare: an iron bed, a washstand, a chair, a window. Two connecting doors, to 426 on the left and 430 on the right, are bolted on your side.

      Your own door has no bolt. Four fresh screw holes show where it was, taken off today. You wedge the chair under the knob.
    choices:
      - text: "Take the bolt off the door to 430, and fit it to your own."
        roll: {skill: [Mechanical Repair, Locksmith, DEX], success: 275, failure: 276}
      - text: "Leave it. Go to the window."
        to: 277

  275:
    title: The Bolt
    effects:
      - note: BOLTED
    text: |
      The blade of your pocketknife makes a poor screwdriver, but the screws are old and come out sweetly. In twenty minutes the bolt from the 430 door is on your own, and it shoots home with a good solid click.
    choices:
      - text: "Go to the window."
        to: 277

  276:
    title: Stripped
    text: |
      The screws are rusted into the wood. You twist until the knife blade snaps and your knuckles bleed, and the bolt stays where it is. Your door has nothing but a chair.
    choices:
      - text: "Go to the window."
        to: 277

  277:
    title: Half Past Nine
    text: |
      The window looks over a courtyard and the roofs of the block. The nearest roof is a floor below yours, flat and tarred, on the long building that runs down toward the fire station.

      At half past nine a bell begins on the green. The moon comes up behind the reef, the colour of a peach. A dozen boats with lanterns in their bows row out across the silver toward it, and singing comes back over the water, thin and far away.

      The hotel is quiet. Not empty. Quiet.
    choices:
      - text: "Sit up in the dark, dressed, and wait."
        to: 130
      - text: "Draw the old sign on every door of the room with the washstand soap."
        requires: {any: [{note: SIGN}, {item: library-notes}]}
        effects: [{note: WARDED}]
        to: 130
      - text: "Set the old sign stone on the floor in the middle of the room."
        requires: {item: sign-stone}
        effects: [{note: WARDED}, {note: SETSTONE}]
        to: 130

  130:
    title: The Long Hours
    text: |
      Ten o'clock. Eleven. You sit on the bed in the dark with your boots on, and listen.

      The singing swells and fades over the water. A little after eleven someone walks the corridor, slowly, to the end and back, and stops at your door for the length of a breath.

      At half past, in 426, a bed creaks, as if someone heavy has sat down. Nobody came along the corridor to that room.
    extra:
      - requires: [{note: WARDED}, {note: SETSTONE}]
        text: |
          The stone lies on the floorboards in the moonlight, the star cut in it full of shadow. You can't stop looking at it.
      - requires: [{note: WARDED}, {no_note: SETSTONE}]
        text: |
          The sign on the door shows faint and pale in the moonlight. You can't stop looking at it.
      - text: |
          A quarter to one. Out on the reef, the singing rises to a long high note, and stops.
    choices:
      - text: "Keep waiting."
        to: 131

  131:
    title: The Doorknob
    effects:
      - san: "1/1D6"
    text: |
      A little before one, the boats come back: oars, voices, hulls knocking on the wharves. Then the street door below opens and closes, again and again.

      Footsteps on the stairs. Several, slow, with a soft wet slapping, like bare feet. The third floor. The fourth.

      They stop outside your door. Breathing, thick and bubbling, and the smell of a harbour at low tide.

      Then the doorknob turns, softly, all the way round. A key scrapes in the lock, and the lock gives.
    extra:
      - requires: {note: BOLTED}
        text: |
          The bolt holds. The door doesn't so much as tremble.
      - requires: {no_note: BOLTED}
        text: |
          The door leans against the chair. The chair holds.
      - text: |
          Then voices, low, in a croaking tongue that has the shape of speech and almost none of its sounds.
      - requires: {investigator: genealogist}
        text: |
          One voice, closer to the keyhole than the rest, speaks English, soft and coaxing. "Come home, cousin. Nobody'll hurt ye. There's family waitin'."
      - requires: {note: WARDED}
        text: |
          Then the breathing catches, turns to a hiss, and backs away from the door like a dog from a fire. The knob springs back. For a long time there is only hissing, and the shuffle of wet feet.
      - requires: [{note: WATCHED}, {investigator: [agent, antiquarian, reporter]}]
        text: |
          Someone out there says a word you know: the name you wrote in the register downstairs.
      - text: |
          Then the footsteps move off to the left, into 426, toward the connecting door in your wall.
    choices:
      - text: "Go through the connecting door to 430, and out of its window."
        to: 133
      - text: "Brace the door, and hold it."
        requires: {no_note: WARDED}
        to: 139
      - text: "Stay where you are, behind the sign."
        requires: {note: WARDED}
        to: 141
      - text: "Pull on the grey robe, open the door, and walk out among them."
        requires: {item: robe}
        roll: {skill: [Stealth, POW], success: 132, failure: 194}
      - text: "Open the door, and see who's there."
        requires: [{investigator: [agent, antiquarian, reporter]}, {no_note: WARDED}]
        to: 142
      - text: "Open the door to them."
        requires: {investigator: genealogist}
        to: 189

  132:
    title: One of Them
    text: |
      You pull the damp grey robe over your head, put up the hood, kick the chair away and open the door.

      The corridor is full of them, lit from below by a lantern on the landing. They turn their heads toward you all together, the way fish turn.

      You round your shoulders and drag your feet, the way you have watched them walk all day, and step out among them.

      They make room. You shuffle with them down the back stairs and out through a yard door into the moonlight.
    extra:
      - requires: {note: SETSTONE}
        before: true
        text: |
          You scoop Matt Eliot's stone off the floor and into your pocket.
      - requires: {note: BOLTED}
        before: true
        text: |
          You slide back the bolt you fitted.
      - text: |
          Behind you, the yard door bangs shut.
    choices:
      - text: "Slip away from them at the first corner."
        effects: [{unnote: SETSTONE}]
        to: 144

  133:
    title: Room 430
    text: |
      The door to 430 won't move: it is locked from the far side, and swollen in its frame.

      Behind you, in 426, something has begun to push at the other connecting door. Steadily. The old wood groans.
    extra:
      - requires: {note: SETSTONE}
        before: true
        text: |
          You snatch Matt Eliot's stone up off the floor as you go.
      - requires: {no_note: BOLTED}
        before: true
        text: |
          You draw the bolt on the right-hand door.
      - text: |
          There is no time to be careful.
    choices:
      - text: "Get it open, whatever it takes."
        effects: [{unnote: SETSTONE}]
        roll: {skill: [STR, Locksmith], success: 135, failure: 134}

  134:
    title: Splinters
    effects:
      - hp: "-1D3"
    text: |
      The lock won't give, so the frame has to. On the fourth blow of your shoulder it bursts inward in a spray of splinters. The noise goes through the hotel like a gunshot. Behind you, feet start to run.
    choices:
      - text: "Go through, and make for the window."
        to: 135

  135:
    title: The Roof
    text: |
      Room 430 is empty, its bed stripped. The window is stiff, but it goes up.

      The whole town lies under the moon: gambrel roofs stepping down to the river, the pillared hall pale on its green, the sea like hammered tin out to the reef. And in every street, lanterns, going house to house. Two are crossing the Square toward the hotel.

      A storey below the window is the flat roof of the next building, with a low parapet. Between the wall and the parapet is a gap a yard wide, and a long drop into the alley.

      Behind you, in your own room, a door gives with a crack like a breaking bone.
    choices:
      - text: "Jump."
        roll: {skill: [Jump, Climb, DEX], success: 136, failure: 137}

  136:
    title: Tar Paper
    text: |
      You land on the tar paper, roll, and fetch up against a skylight frame. Above you a narrow grey head leans out of the window of 430 and turns this way and that. It doesn't look down.
    choices:
      - text: "Get in through the skylight."
        to: 138

  137:
    title: The Gutter
    effects:
      - hp: "-1D6"
    text: |
      Your foot skids on the sill. You hit the parapet with your chest, go over into the gap, and catch the gutter with both hands. It holds. You haul yourself onto the roof, bleeding from both palms.
    choices:
      - text: "Get in through the skylight."
        to: 138

  138:
    title: The Empty House
    text: |
      The skylight's glass is long gone. You drop into an attic of pigeon dirt and find a stair, soft with rot. You keep to the wall, where the nails are.

      On the floor below, a door stands open on a bed, a calendar for 1911, and a tin bath full of black water with a skin on it. You don't look into the water.

      The front door hangs by one hinge. Beyond it lies a quiet street of tall old houses under the moon. The sign on the corner says WASHINGTON ST.

      The lanterns are a block away, and coming.
    choices:
      - text: "Keep moving."
        to: 144

  139:
    title: The Door
    text: |
      You set your back against the door and your heels against the floor.

      Nobody knocks. Something heavy hits the door at shoulder height. Again. The wood splits round the lock like a green branch. Through the gap at the jamb you see lantern light, and a grey webbed hand feeling for the edge.
    extra:
      - requires: {note: BOLTED}
        text: |
          The bolt you fitted is shot home. It holds, and holds, and then its screws begin to creak in the old wood.
      - text: |
          The next blow comes.
    choices:
      - text: "Leave the bolt to hold them, and go for 430."
        requires: {note: BOLTED}
        to: 133
      - text: "Fire through the door."
        requires: {item: revolver}
        to: 140
      - text: "Hold it with your shoulder."
        roll: {skill: [STR, CON], success: 133, failure: 194}

  140:
    title: Through the Door
    text: |
      You put two rounds through the door at chest height. The cracks are enormous in the little room.

      Out in the corridor something screams, not like a man. Something heavy slides down the door. Feet slap away down the hall and down the stairwell.

      They'll be back, with more.
    choices:
      - text: "Go, while they're gone."
        to: 133

  141:
    title: Behind the Sign
    effects:
      - san: "1/1D6"
    text: |
      You sit on the bed with your back to the wall and watch the doors. They come back four times before dawn.

      Once they try the knob, and hiss, and go. Once someone reads aloud at the keyhole in that croaking tongue, trying words on the sign. Once they only stand in the corridor and breathe, for an hour.

      The fourth time is at the window: a wet slap and scrape up the wall, then a head too wide for its neck against the moonlit glass, and a webbed hand flat on the pane. It looks at the sign for a long time. Then it slides back down into the courtyard.

      At six somebody taps at the door. "First bus leaves half past six," says the night clerk. "Ye'll be wantin' it, I expect."
    choices:
      - text: "Gather your things, and go down."
        effects: [{unnote: SETSTONE}]
        to: 219

  142:
    title: An Inch
    effects:
      - san: "0/1D3"
    text: |
      You take the chair away. The knob is wet, and it turns under your fingers by itself. The door opens an inch.

      The harbour smell comes in first. Then, round the edge of the door, four long grey fingers, webbed to the first knuckle. They curl round the wood, gently, and begin to draw it open.
    extra:
      - requires: {note: BOLTED}
        before: true
        text: |
          You slide back the bolt you fitted.
      - text: |
          The gap widens.
    choices:
      - text: "Slam it shut on them, and get the chair back under the knob."
        to: 139
      - text: "Let it open."
        to: 143

  143:
    title: Who's There?
    ending: death
    text: |
      You open it the rest of the way.

      The corridor is full of them, shoulder to shoulder to the stairs, lit from below. You see their faces properly now, close enough to touch: the wide mouths, the creased throats working, the eyes that do not close.

      Nobody says anything. They simply come in, all at once, the way the tide comes into a cave.

      In August the Gilman House lets Room 428 to a salesman of farm machinery from Worcester, who complains about the smell.
    extra:
      - text: |
          Someone tried your door at one in the morning, in a town that wanted you gone, and you opened it to see who it was.

  # ----------------------------------------------------- The streets at night

  144:
    title: Moonlight
    effects:
      - note: HUNT
    text: |
      The moon is high, and Innsmouth is awake. Not with lit windows: with lanterns, two and three together, moving from door to door. A knock, a murmur, the door closing, the lantern moving on. On the waterfront a crowd stands at the head of a wharf.

      They are looking for someone. You know who.

      You put your back into a doorway and think where a person might go.
    extra:
      - requires: {note: ZADOK}
        text: |
          You think of Zadok Allen, and the way his eyes kept going to the sea.
      - text: |
          A lantern turns into the end of the street, and starts toward you.
    choices:
      - text: "Cross the Square for the old station and the railway."
        requires: {note: RAILWAY}
        to: 199
      - text: "Make for the old Marsh wharf, and Shea."
        requires: {note: BOAT}
        to: 160
      - text: "Make for the dory under the old Marsh wharf."
        requires: {note: DORY}
        to: 161
      - text: "Cross the river to Ruth Eliot's back door."
        requires: {note: ELIOT}
        to: 148
      - text: "Strike south out of town, for the Ipswich road."
        to: 145
      - text: "Go to ground in a cellar, and wait for daylight."
        to: 147

  145:
    title: The South Lanes
    text: |
      South of the Square you go from doorway to doorway, down lanes between blind walls toward the marsh.

      Halfway down, a lantern turns in at the bottom. Four of them, and slung between them on a boat-hook, a fishing net with something in it that moves.

      There is a deep doorway beside you, and an alley across the lane.
    choices:
      - text: "Press into the doorway, and wait for them to pass."
        to: 146
      - text: "Dart across into the alley, behind their backs."
        roll: {skill: [Stealth, DEX], success: 217, failure: 194}

  146:
    title: The Net
    effects:
      - san: "1/1D4"
    text: |
      They pass close enough to touch. In the net is a man, or was, wound in the mesh like a fly. His open eyes find yours and follow you all the way past. He doesn't call out.

      Then you go on down to the last houses, and out onto the white road across the marsh.
    choices:
      - text: "Walk on, south."
        to: 217

  147:
    title: A Coal Cellar
    text: |
      Behind a shuttered shop you find a coal chute with a broken hatch. You drop into the dark and lie flat in the farthest corner.

      Lanterns pass the grating. Once one stops and lowers, and its light crawls across the floor toward you, and stops a yard short of your boots, and lifts away.

      The night goes on for ever.
    choices:
      - text: "Lie still. Don't breathe."
        roll: {skill: [Stealth, POW], success: 219, failure: 194}

  # ----------------------------------------------------- The Eliots at night

  148:
    title: The Back Door
    text: |
      Ruth Eliot's kitchen is small and hot, the lamp turned down to a bead and a blanket over the window. Jonas is asleep in the next room. You can hear him breathing, a little thick, a little wet.

      Ruth sits across from you with her hands round a cup she isn't drinking from. A fish knife lies by it.
    extra:
      - requires: {note: LATE}
        before: true
        text: |
          You spend the last of the daylight mending net in her yard while Jonas fishes off the steps. At sundown she bars the door, feeds you chowder and puts him to bed. At half past nine the bell goes on the green, and the boats go out.
      - requires: {no_note: LATE}
        before: true
        text: |
          Ruth looks past you up the lane before she lets you in, and bars the door behind you.
      - requires: {no_note: HUNT}
        text: |
          "They'll come tonight, after the rite," she says. "House by house, with lanterns. They always look in on him. To see how he's coming along. Like a crop."
      - requires: {note: HUNT}
        text: |
          "They've been up the lane once already," she says. "They'll be back. They always look in on him twice. To see how he's coming along. Like a crop."
      - requires: {note: MARTHA}
        text: |
          Martha's letter stands propped against the clock. A packed carpet bag waits by the back door.
      - requires: {note: PROMISE}
        text: |
          You promised her. She doesn't need to say it.
      - requires: {item: sign-stone}
        text: |
          Her eyes go to your pocket, where Matt Eliot's stone is, and away again.
      - requires: {no_note: MARTHA}
        text: |
          "My sister Martha keeps a boarding house in Newburyport," Ruth says. "Water Street. She'd take us, if we ever got that far."
      - requires: [{no_note: MARTHA}, {item: letter}]
        text: |
          Martha. The landlady on Water Street. The envelope in your pocket feels suddenly heavy, but this is not the moment.
      - text: |
          "The dory's at the back steps," Ruth says. "Amos built her. She'll take three." She looks at you. "You've a say in it now. What do we do?"
    choices:
      - text: "Go now, all three of you, in the dory at the back steps."
        effects: [{note: RUTH}]
        to: 150
      - text: "Bar the door, and set the old sign on the step."
        requires: {any: [{note: SIGN}, {item: sign-stone}, {item: library-notes}]}
        to: 154
      - text: "Hide in the loft, and let Ruth face them."
        to: 157
      - text: "Leave them, and go alone."
        to: 149

  149:
    title: Alone
    effects:
      - unnote: ELIOT
    text: |
      Ruth doesn't argue. She unbars the door for you, and you hear her drag the table across it behind you.

      You wait in a net shed by the river while the lanterns come up the lane, stopping at every door. You don't watch which doors.
    extra:
      - requires: {note: PROMISE}
        text: |
          You promised her.
      - text: |
          When they have passed the shed, you slip out of the other side.
    choices:
      - text: "Go."
        to: 144

  150:
    title: The Black River
    effects:
      - unnote: BOAT
    text: |
      Ruth wakes Jonas with a hand over his mouth. He doesn't cry out.

      The dory waits at the foot of the back steps, where the river runs black and quick between the houses. Ruth takes the oars and won't give them up. Jonas sits in the bow with his knees drawn up. You sit in the stern and watch the bank.

      She rows short and hard and quiet. As you pass the mill's tailrace, roaring out of its stone mouth, something in the white water lifts its head and watches you go by. Then the harbour, flat and silver, and the end of the breakwater close enough to hear a man on it cough.

      Out past the harbour mouth, the open sea lifts the dory.
    extra:
      - requires: [{no_note: HUNT}, {no_note: LATE}]
        before: true
        text: |
          Ruth won't go until the boats are out. You sit in the dark until the last oars have gone by the river mouth.
      - requires: {no_note: HUNT}
        text: |
          A mile to the east, Devil Reef is strung with lanterns, and the singing comes over the water. Ruth turns the bow north, toward Plum Island.
      - requires: {note: HUNT}
        text: |
          There are no lights on the reef now. They are all in the town behind you. Ruth turns the bow north, toward Plum Island.
      - text: |
          Jonas is looking at the water.
    choices:
      - text: "Keep rowing."
        to: 151

  151:
    title: Amos
    effects:
      - san: "1/1D6"
    text: |
      Something comes up beside the dory, slowly, without a splash: a round grey head, then shoulders. It keeps pace without seeming to swim. Its pale, wide-set eyes are fixed on Jonas.

      "Jonas," it says. The voice is thick and wet, but it is a man's voice, one that has said that name ten thousand times across a supper table.

      Ruth stops rowing. "Amos," she says.

      The thing that was Amos Eliot lifts a webbed hand toward the bow. It is the gentlest thing you have seen all day.

      "Come along, boy. Come and see. It's all lights down there, and your grandad's there, and nobody's ever cold."

      Jonas has let go of his knees. He leans toward the side, and his eyes are shining.
    choices:
      - text: "Hold Jonas back."
        roll: {skill: [STR, Psychology], success: 152, failure: 153}
      - text: "Hold up the old sign between them."
        requires: {any: [{item: sign-stone}, {item: library-notes}]}
        to: 152
      - text: "Let the boy choose."
        roll: {skill: POW, success: 152, failure: 153}

  152:
    title: Not Yet
    text: |
      For a long moment nobody moves. Then Amos sinks back, slowly, his pale eyes on the boy until the water closes over them.

      "Not yet," Jonas whispers. "Not yet, Pa."

      He climbs into his mother's arms and cries, hard, like a much smaller child. Ruth holds him with one arm and takes one oar. You take the other. Between you, badly, you row north toward Plum Island, with the reef falling away behind you.

      Nobody speaks until the sky begins to grey.
    choices:
      - text: "Row on, toward the dawn."
        to: 222

  153:
    title: The Boy Who Swam
    effects:
      - note: SWAM
      - san: "1/1D4"
    text: |
      Jonas goes over the side, all at once, the way a boy goes off a dock on a hot afternoon, and Ruth makes a sound you will hear for the rest of your life.

      He comes up once, between his father's hands, laughing and crying. "It's warm, Ma. It's warm." Then the two of them go down together. There are bubbles for a little while.

      Ruth sits with the oars across her knees, looking at the place. After a long time she takes them up and rows north, short and hard, without a word, all the way to the dawn.
    choices:
      - text: "Row with her."
        to: 222

  154:
    title: The Sign on the Step
    text: |
      Ruth bars the back door and drags the dresser across it. You sit in the dark kitchen with the lamp out, and wait.

      They come when the moon is high, lanterns swinging up the lane. The old ones come first, robed and shuffling. At the front step they stop as if they had walked into a wall, and a hissing goes up like a kettle. They back away down the path with their heads turned aside.

      Two don't: young men at the back, with only the beginnings of the look. Men, still. One grins and steps over the sign, and the other follows.

      A knock. "Ruth. We've come to see the boy."
    extra:
      - requires: {item: sign-stone}
        before: true
        text: |
          You set Matt Eliot's stone on the front step, star uppermost, where anyone who comes to the door must stand over it.
      - requires: {no_item: sign-stone}
        before: true
        text: |
          Ruth digs to the bottom of the old sea-chest and unwraps something heavy from its oilcloth: a grey-green stone the size of your palm, cut with a star and a flame. "Matt brought it home from that island," she says. She sets it on the front step, star uppermost, where anyone who comes to the door must stand over it.
      - text: |
          Ruth looks at you across the dark kitchen. Her knife is in her hand.
    choices:
      - text: "Throw the door open, and fight them on the step."
        roll: {skill: [Fighting (Brawl), Dodge], success: 156, failure: 155}
      - text: "Fire at the first one through the door."
        requires: {item: revolver}
        to: 156
      - text: "Talk them down through the door."
        roll: {skill: [Intimidate, Fast Talk, Persuade], success: 156, failure: 155}

  155:
    title: For Safe Keeping
    effects:
      - unnote: ELIOT
    text: |
      It doesn't go your way.

      There are more than two of them in the end, strong, with hands as cold as fish. The old ones hang back by the gate. They take the knife off Ruth almost politely.

      They bring Jonas into the kitchen by the hand. He looks at them, and doesn't cry. Then they take you.
    choices:
      - text: "Go with them. You have no choice."
        to: 194

  156:
    title: Dawn in the Kitchen
    text: |
      They go. Not far, and not for good: back out at the gate, and the lanterns move off down the lane to the next house. Somewhere a woman cries out. Then it is quiet.

      Nobody comes back. The sky goes grey over the sea.

      Ruth puts the kettle on, because her hands need something to do. Then she packs a carpetbag: Jonas's other shirt, his good boots, a photograph, the bread. Jonas watches from the doorway in his nightshirt.

      "First bus is half past six," she says. "They won't stop us. Not in daylight. Not with you along. I'm not staying another night."
    extra:
      - requires: {item: sign-stone}
        text: |
          "Keep Matt's stone till we're out," Ruth says, and closes your fingers over it.
      - text: |
          Outside, the gulls have started.
    choices:
      - text: "Take the first bus out, all three of you."
        effects: [{note: RUTH}]
        to: 219

  157:
    title: The Loft
    text: |
      You lie in the loft over the kitchen under Amos's old oilskins, your cheek to the boards. Through a crack you can see the lamp, and Ruth's hands on the table.

      They come with the lanterns. Wet bare feet on the boards below. Voices, thick and slow and almost kind. They ask how the boy is coming along. They ask whether a stranger has been by. Ruth says no.

      Then one says they'll take Jonas now, for safe keeping, till Hallowe'en.

      Ruth's hands go flat on the table. You hear Jonas's bare feet on the stairs.
    choices:
      - text: "Climb down, and stop them."
        roll: {skill: [Fighting (Brawl), Dodge], success: 156, failure: 155}
      - text: "Stay hidden."
        to: 158

  158:
    title: Ruth at the Table
    text: |
      You stay where you are. Jonas walks out between two of them with his hand in a grey hand, looking back once at his mother, and the lanterns move off down the lane.

      At first light you climb down. Ruth sits by the burnt-out lamp. She doesn't look at you.

      "Go," she says. "First bus is half past six. Go."
    extra:
      - requires: {note: PROMISE}
        text: |
          You promised her. She doesn't have to say it.
      - text: |
          You go.
    choices:
      - text: "Walk to the Square, and the first bus."
        to: 219

  # ----------------------------------------------------- The reef

  159:
    title: The Long Wait
    effects:
      - san: "0/1D3"
    text: |
      At the end of the old Marsh wharf a ladder goes down into the dark. You wedge yourself on a crossbeam among the piles, just clear of the water.

      At half past nine the bell begins on the green. The procession comes down Water Street, lanterns and robes and bare feet, right over your head, the boards dripping on you. A dozen boats pull out past the end of the wharf toward the reef. The moon comes up behind it, enormous. Then the singing.

      It goes on for hours. Once something swims in among the piles below you, slow and heavy, turns round, and goes out again.

      Near midnight an engine mutters out in the dark, coming closer, without a single light.
    choices:
      - text: "Climb up to the end of the wharf."
        to: 160

  160:
    title: The Lady Ellen
    text: |
      The *Lady Ellen* noses in against the end of the wharf, her engine purring low, not a light showing. Shea is a black shape at the wheel.

      "Get in," he says. "For God's sake, get in."

      He has her backing off before your feet are under you. His face is grey and wet with sweat. "I seen 'em, all round the boat, looking up at me like seals. I ain't never coming back here." He spins the wheel. "Where to?"
    extra:
      - requires: {no_note: HUNT}
        text: |
          A mile to the east, Devil Reef is strung with lanterns, and the singing comes over the water.
      - requires: {note: HUNT}
        text: |
          Out on Devil Reef the lanterns are going out, one by one. The hunt is in the town behind you.
      - text: |
          Shea waits, his hand on the throttle.
    choices:
      - text: "Tell him to run for Newburyport."
        to: 173
      - text: "Show him your badge, and tell him: the reef."
        requires: {no_note: HUNT, item: badge}
        to: 164
      - text: "Put the gold in his hand, and point at the reef."
        requires: {no_note: HUNT, item: gold}
        effects: [{lose: gold}]
        to: 164
      - text: "Hand him the whiskey, and point at the reef."
        requires: {no_note: HUNT, item: whiskey}
        effects: [{lose: whiskey}]
        to: 164

  161:
    title: The Dory
    effects:
      - unnote: BOAT
    text: |
      You climb down under the old Marsh wharf. The dory is where you saw it. You bail it with your hands, slip the line and fit the oars. She is heavy and old, built for a strong man.
    extra:
      - requires: {no_note: HUNT}
        text: |
          You wait among the piles while the bell rings and the boats go out past you, close enough to touch, and the moon comes up behind the reef. Then lanterns on Devil Reef, and the singing.
      - requires: {note: HUNT}
        text: |
          Lanterns climb from the waterfront into the town. Out on Devil Reef the last lights have gone out.
      - text: |
          You pull out from under the wharf, and the tide takes hold of her.
    choices:
      - text: "Row out toward the lights on the reef."
        requires: {no_note: HUNT}
        roll: {skill: [Pilot (Boat), STR], success: 164, failure: 163}
      - text: "Row north along the shore, and away."
        to: 162

  162:
    title: North
    text: |
      You row north with the shore on your left, black under the moon. The tide is with you. Your hands blister, then bleed, then go numb.
    extra:
      - requires: {no_note: HUNT}
        text: |
          The lanterns on the reef dwindle behind you to a string of sparks, and the singing fades, and stops.
      - requires: {note: HUNT}
        text: |
          Behind you the lanterns move through the streets of Innsmouth, smaller and smaller, until the town is a scatter of sparks under the hill.
      - text: |
          In the small hours something surfaces a little way off and keeps pace with you a while. When you look, it's gone.
    choices:
      - text: "Row on, until the sky greys."
        to: 222

  163:
    title: Swamped
    effects:
      - hp: "-1D2"
    text: |
      Halfway across the harbour a swell slops over the gunwale, then another. You row her back to the wharf half sunk, and lie beside her among the piles, soaked and shaking, through all the hours of singing, until the boats come back after midnight and the lanterns go up into the town.
    choices:
      - text: "Climb up into the town."
        to: 144

  164:
    title: Devil Reef
    effects:
      - san: "1/1D8"
    text: |
      Devil Reef comes up out of the moonlight like the back of something asleep.

      Lanterns stand along its spine in a double row, and between them robed figures sway, dozens of them. The old hollows open along the ridge like cellar doors. On the highest rock stands a tall shape in a gold tiara, arms raised. The chant comes over the water, *Iä! Iä!*, a hundred voices, and under them a deeper sound, as if the sea were saying the words too.

      Then you see what else is on the reef.

      They are climbing out of the water on the dark side, where the bottom drops away past any sounding line. Grey and wet and webbed, shaped like men, and like frogs, and like neither. They take their places among the robed figures as if they had done it ten thousand times.

      Some of the robed figures are holding hands with them.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has cut the engine. The *Lady Ellen* drifts a long stone's throw off the reef, and his lips are moving over his rosary.
      - requires: {no_note: BOAT}
        text: |
          You ship the oars, let the dory drift, and hold your breath.
      - requires: {note: REEF}
        text: |
          You have studied this reef by daylight. You know where the dark side is, and the hollow that goes down.
      - text: |
          Nobody on the reef has seen you. Not yet.
    choices:
      - text: "Get the dynamite into the hollows on the dark side."
        requires: {item: dynamite}
        to: 165
      - text: "Photograph them."
        requires: {item: camera, skill: Art/Craft (Photography), min: 40}
        roll: {skill: Art/Craft (Photography), success: 168, failure: 169}
      - text: "Listen to the names they are calling."
        to: 171
      - text: "Turn back, quietly, while you can."
        to: 172

  165:
    title: The Dark Side
    text: |
      You come round the north end of the reef, wide, in its shadow, onto a weedy ledge on the seaward side a foot above the swell, with the dynamite inside your shirt. The chant is just over the ridge. You crawl.

      The biggest hollow slants down into the reef, and cold air breathes up out of it, steadily, like a sleeper. That is where they come from. That is the door.

      You need the charge deep in it, and the fuse lit, and yourself gone, before the chant ends.
    extra:
      - requires: {note: BOAT}
        text: |
          Behind you, Shea holds the *Lady Ellen* off the ledge with a boathook, swearing in a whisper.
      - requires: {no_note: BOAT}
        text: |
          Behind you, the dory knocks softly against the ledge.
      - text: |
          Your hands are shaking. You make them stop.
    choices:
      - text: "Work by feel, fast."
        roll: {skill: [Stealth, Swim], success: 175, failure: 166}
      - text: "Find the hollow you marked by daylight."
        requires: {note: REEF}
        to: 175
      - text: "Lose your nerve, and get back in the boat."
        to: 172
      - text: "Set the old sign stone on the rocks behind you, and work."
        requires: {item: sign-stone}
        effects: [{lose: sign-stone}]
        to: 175

  166:
    title: Seen
    text: |
      A shape on the rocks above you turns its head: a wide grey face, two pale eyes. It croaks, and over the ridge the chant falters.

      You light the fuse, shove the charge in as deep as your arm will go, and dive.
    choices:
      - text: "Swim for your life."
        roll: {skill: [Swim, CON], success: 175, failure: 167}

  167:
    title: Under
    effects:
      - hp: "-1D6"
    text: |
      Cold webbed hands take your ankles and drag you down, into a dark that squeezes your skull. Your lungs burn.

      Then the sea above you turns white, and the hands let go.
    choices:
      - text: "Swim up toward the light."
        to: 175

  168:
    title: The Plate
    effects:
      - note: PLATE
    text: |
      You brace the camera on the gunwale and open the shutter. No flash. The moon will do, if you are patient. Nobody on the reef turns.

      Thirty seconds. On that plate is something no editor in Boston can call a hoax.
    choices:
      - text: "Get away, quietly."
        to: 172

  169:
    title: The Flash
    effects:
      - note: PLATE
    text: |
      The shutter sticks. Your thumb finds the flash tray instead, and the magnesium goes off with a soft white thump.

      For an instant the whole reef is lit like noon, and every face on it turns toward you. You have them on the plate.

      Then, in the dark, you hear them going into the water. Toward you.
    choices:
      - text: "Get away. Now."
        to: 170

  170:
    title: Pursuit
    effects:
      - hp: "-1D4"
      - san: "1/1D4"
    text: |
      They come through the water faster than anything you have ever seen swim. A webbed hand slaps onto the gunwale, then another, and the boat tips. You hit at them with whatever is in your hand.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has the engine roaring. The hands fall away behind, all but one, which takes a strip of the rubbing strake with it.
      - requires: {no_note: BOAT}
        text: |
          You row like a madman, and slowly, slowly, the hands fall behind.
      - text: |
          Then there is only open water, and the lanterns on the reef getting smaller.
    choices:
      - text: "Keep going."
        to: 172

  171:
    title: The Names
    effects:
      - san: "1/1D6"
    text: |
      The chant stops. The priest lowers his arms and begins to call names, one at a time, in a high, carrying voice.

      For each name, something answers: a robed figure on the rocks, or more often a thick, bubbling voice out of the black water. The ones who went down. "Hiram Gilman," he calls, and something answers that was Hiram Gilman in 1845. "Amos Eliot," and something answers.

      Then he calls your name, the way you might call a child in from the yard. Every face on the reef turns to the sea, as if waiting for you to come up out of it.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Before your name he calls another: "Abigail Orne." A woman's voice answers from the water, very near. You haven't heard it since you were thirteen. It used to sing to you on the porch in Toledo.
      - text: |
          Something in the water beside the boat says your name too, softly, to help you remember it.
    choices:
      - text: "Climb out onto the reef, and go down with them."
        to: 229
      - text: "Turn back."
        to: 172

  172:
    title: Away
    text: |
      The reef falls behind you. The lanterns shrink to a blur on the black sea, and the chant goes thin, and stops. Ahead there is only open water under the moon, and to the north, the long dark line of the shore.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea has the throttle wide open. "There's a mother ship lies off Thacher Island tonight," he says, to nobody. "Takes her on to Saint-Pierre, after. The French islands. Nobody asks a man anything out there."
      - requires: {no_note: BOAT}
        text: |
          You row with your face to the reef, so you can watch it getting smaller.
      - text: |
          The wind is cold, and your clothes are wet through.
    choices:
      - text: "Make for the shore to the north, and the morning."
        to: 222
      - text: "Tell Shea to run for the mother ship, and Saint-Pierre."
        requires: {note: BOAT}
        to: 174

  173:
    title: Full Throttle
    text: |
      Shea opens her up, and the *Lady Ellen* goes out past the breakwater throwing white water both sides. He talks, low and fast, without looking back: the price of whisky in Halifax, and the Canadian mother ship that lies off Thacher Island tonight and goes on to Saint-Pierre after. The French islands, where nobody asks a man anything.

      "I could run you out there," he says. "Just saying. If a body didn't want to go home."
    extra:
      - requires: {no_note: HUNT}
        text: |
          Off to the east, Devil Reef burns with its lanterns.
      - requires: {note: HUNT}
        text: |
          Off to the east, Devil Reef is black and empty now, and the lanterns are all in the town.
      - text: |
          The engine hammers.
    choices:
      - text: "Make for Newburyport."
        to: 222
      - text: "Let him run for the mother ship off Thacher Island, and on to Saint-Pierre."
        to: 174

  174:
    title: To Saint-Pierre
    ending: escape
    text: |
      The singing follows the boat out to sea.

      You hear it long after the reef has gone below the horizon. It comes up through the hull from the black water on every side, close and full and gentle, a thousand voices singing something with no words that you would swear is meant for you. It is the most beautiful thing you have ever heard. Shea weeps at the wheel. Toward dawn it stops, and you are sorry, and ashamed of being sorry.

      The mother ship is a rusty Canadian schooner off Thacher Island, with a crew who ask nothing. Six days later you come ashore at Saint-Pierre, among French fishermen and warehouses stacked with rum, in a town where nobody has heard of Innsmouth. You stay a month. Then a season.

      Some nights you stand at the end of the quay, and listen. You never hear it. You keep listening.
    extra:
      - requires: [{investigator: agent}, {no_item: badge}]
        text: |
          The Bureau lists you as missing in the line of duty. You read it months later in a Halifax paper, and feel nothing much.
      - requires: [{investigator: agent}, {item: badge}]
        text: |
          Your Treasury badge goes over the side somewhere south of Sable Island. It flashes once in the dark water, and that is the last of Agent Brannigan.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out of Innsmouth stays at the bottom of your bag. You write the address on the parcel more than once. You never send it.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her boy out of Innsmouth. Hallowe'en comes, and goes.
      - requires: {investigator: genealogist}
        text: |
          A year later, the mirror in your rented room shows you a face from a portrait: the eyes wider, the throat creasing in soft folds. You swim every morning off the rocks, further out each time, in water that isn't cold to you. One of these mornings you won't turn back.
      - text: |
          You ran from Innsmouth on a rum-runner, and the sea sang to you all the way out. You still can't decide whether it was singing goodbye.

  175:
    title: Devil Reef, Burning
    ending: triumph
    text: |
      You are back in the boat, soaked and gasping, when Devil Reef goes up.

      You feel it first through the hull, a punch from below, then a thud you hear with your chest. A column of white water and black rock climbs into the moonlight, hangs, and comes down in a roaring rain. The reef's spine cracks along its length. The hollows fold in like a mouth closing. The whole dark side slumps, slowly, and slides into the deep, and the sea rushes white over it.

      From the water all around comes a sound that is not a scream and not a song, but something of both.

      You get away. You don't remember how. At dawn you are off Plum Island, under a quiet sky, alive.

      That summer the fish leave Innsmouth. The boats come back empty, week after week. The furnace at the mill goes cold, and no more pale gold turns up in Boston. By autumn the Hall of Dagon has a padlock on its door.

      What lived under the reef is still down there. But its door is shut, and it is a long swim to the next one.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea sells his engine within the month and goes back to lobster pots, an honest man. He'll tell anyone who buys him a drink that he once took a fare out to Devil Reef, and nothing more.
      - requires: {no_note: BOAT}
        text: |
          You beach the dory on Plum Island and lie beside it in the sand until a clam-digger finds you, and walks you to the Coast Guard station, and asks nothing.
      - requires: {note: CALLED}
        text: |
          The cutter off the harbour mouth saw the reef go up, and her captain's report goes to Washington. In February federal men come to Innsmouth with warrants, and find less than they expected, and more than they can explain.
      - requires: {note: OATH}
        text: |
          You swore an oath of silence on the green, and then you blew up its altar. Nobody comes for you.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You never took Jonas out, as you promised. But in September a letter comes from Ruth, from her sister's boarding house on Water Street in Newburyport: the Order had other things to think about this summer, and Jonas swims in the river every day.
      - requires: [{any: [{item: ledger}, {item: register}]}, {no_note: CALLED}]
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel. In February federal men come up the coast to see what is left of the town.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, your eyes in the hall mirror are wider than they were, and they don't close all the way when you sleep. You dream of a woman with your grandmother's face, who isn't angry, and waits. The door you shut was not the only door.
      - text: |
          You went out to Devil Reef with a fuse and a match, and shut the door Obed Marsh opened. It was the bravest thing you ever did, and the loneliest.

  # ----------------------------------------------------- The Hall at night

  176:
    title: The Hall, Empty
    text: |
      You climb to the green at ten, keeping to the shadows. The green lies white and empty under the moon, and the pillared hall stands silvered under its flaking gilt: ESOTERIC ORDER OF DAGON. Everybody is at the reef. You can hear the singing from here.

      Not quite everybody. On the Hall's top step an old man in a grey robe sits with a lantern at his feet and his chin on his chest, left to keep the door. He might be asleep. With these people you can never tell.

      Round the side, low down in the shadow, is a small sash window: the vestry.
    extra:
      - requires: {item: robe}
        text: |
          The grey robe is rolled under your arm. With the hood up, one robed figure looks very like another.
      - requires: {note: OATH}
        text: |
          You swore the first oath in there today. You feel it as you look at the door, like a hook under the skin.
      - text: |
          The old man's lantern gutters. He doesn't move.
    choices:
      - text: "Walk up the steps and in at the front door, as a member."
        requires: {note: OATH}
        to: 177
      - text: "Pull on the grey robe, and walk in past him."
        requires: {item: robe}
        to: 177
      - text: "Go round the side, and force the vestry window."
        roll: {skill: [Locksmith, STR], success: 177, failure: 194}

  177:
    title: The Dark Hall
    effects:
      - note: SEADOOR
    text: |
      Inside, the Hall is black as a well and smells of wax and brine. Moonlight lies in bars across the benches and the gilded sea-things on the walls.

      To the left of the dais, the vestry door stands ajar. To the right, a stair goes down, and cold air breathes up it, smelling of the bottom of the sea.
    extra:
      - requires: {no_item: register}
        text: |
          On the vestry desk a heavy book lies open: names and dates in many hands, going back and back.
      - requires: {item: register}
        text: |
          The vestry desk is bare where the Order's book used to lie, and its drawers hang open. Someone has been looking for it.
      - requires: [{investigator: antiquarian}, {no_item: register}]
        text: |
          You strike a match and read: names from 1840 on, Jonas Eliot for the third oath at Hallowe'en, and in the oldest pages a note on the shaft below the vaults, *the door by which they come up to us*.
      - text: |
          Nobody is here. Somewhere, water drips.
    choices:
      - text: "Go down the stair, to the cellars."
        to: 178
      - text: "Take the book, and get out."
        requires: {no_item: register}
        effects: [{gain: register}]
        to: 183
      - text: "Get out, while the Hall is still empty."
        requires: {item: register}
        to: 183

  178:
    title: The Sea Door
    effects:
      - san: "1/1D6"
    text: |
      The shaft is wide enough for three men abreast, lined with dressed stone, and full to within a yard of the top with black water that rises and falls with the sea a mile away. Across it, set in a carved stone arch, an iron grille stands wide open, green with age. In the keystone of the arch there is a round hollow the size of your palm, empty. Something was set there once, and taken out.

      Beside the shaft, down three steps, is a low door banded with iron, and shut. Behind it something breathes. Slowly. Enormously. You feel each breath in the soles of your feet.

      The water in the shaft heaves, and something far below turns over in the dark.
    extra:
      - requires: {no_note: TUNNEL}
        before: true
        text: |
          The stair goes down three flights, then into brick vaults older than the town, colder and wetter at every step. The last vault is round, and in its floor is a shaft.
      - requires: {note: TUNNEL}
        before: true
        text: |
          The vault is round, and older than the Hall somewhere above it. A stair climbs out of it on the far side, toward the Hall. In its floor is the shaft.
      - requires: {note: SHOGGOTH}
        text: |
          *Ever hear tell of a shoggoth?* Zadok screamed it, and ran. You take your hand away from the iron door.
      - requires: [{note: ZADOK}, {no_note: SHOGGOTH}]
        text: |
          Zadok told you they come up a shaft under this Hall. He never said what else was down here. You keep away from the iron door.
      - requires: {investigator: genealogist}
        text: |
          Your grandmother went down this way. You know it the way you know which way is up underwater. The water smells faintly of her lavender.
      - text: |
          Whatever you are going to do here, do it before the boats come back.
    choices:
      - text: "Set the old sign stone into the empty hollow in the keystone."
        requires: {item: sign-stone}
        effects: [{lose: sign-stone}]
        to: 184
      - text: "Cut the sign into the keystone itself, deep, the old way."
        requires: {investigator: antiquarian}
        roll: {skill: [Archaeology, Occult], difficulty: hard, success: 179, failure: 180}
      - text: "Draw the sign on the lip of the shaft, and run."
        requires: {any: [{note: SIGN}, {item: library-notes}]}
        to: 180
      - text: "Pack the dynamite into the arch, and light the fuse."
        requires: {item: dynamite}
        effects: [{lose: dynamite}]
        to: 185
      - text: "Photograph the sea door."
        requires: {item: camera}
        to: 181
      - text: "Open the lower door."
        to: 182
      - text: "Get out, before something comes up."
        to: 183

  179:
    title: Cut Deep
    text: |
      There is a mason's chisel and a mallet in the vestry. You fetch them, stand on the lip of the shaft with the water slopping at your shoes, and cut the sign into the keystone round the empty hollow, the way the oldest pages of your notes say it must be cut: five points, the flame at the heart, each stroke in its order, deep.

      It takes hours. Your hands bleed. Twice something pale rises in the shaft and stops below the surface, watching.

      When you cut the last stroke of the flame, the water goes still. Not calm. Still. As if it had been told to.
    choices:
      - text: "Step back from the shaft."
        to: 184

  180:
    title: Chalk
    text: |
      The sign you make on the lip of the shaft is shallow and hurried, already blurring in the wet. A pale shape rises beneath it, and stops. It will hold a while. Not for ever.
    choices:
      - text: "Run."
        to: 183

  181:
    title: Flash
    effects:
      - note: PLATE
      - san: "1/1D6"
    text: |
      You aim down the shaft and fire the flash. For a white instant the shaft is not full of water. It is full of upturned grey faces, packed like fish in a net.

      Then dark. You have them on the plate. You are already running.
    choices:
      - text: "Up. Up."
        to: 183

  182:
    title: The Lower Door
    effects:
      - san: "1D4/1D10"
      - hp: "-1D6"
    text: |
      The iron bar lifts too easily, and the door swings in on its own weight.

      You never see it whole: a darkness wetter than water, all mouths and eyes in a skin like oil, pouring up the three steps like a tide, whistling.

      Something touches your arm, and the skin goes with it.
    choices:
      - text: "Run."
        to: 183

  183:
    title: Later Than You Thought
    text: |
      You come out onto the green, gasping. Hours have gone, somehow, though it felt like minutes. The boats are coming back across the harbour, and lanterns are climbing up from the waterfront into the town.
    choices:
      - text: "Get away from the green."
        to: 144

  184:
    title: The Old Sign
    ending: triumph
    text: |
      The water in the shaft is still.

      You wait at the lip for a long time. Nothing rises. The black water lies flat as glass, and even the breathing behind the iron door has slowed, as if whatever is in there has gone back to sleep.

      At one o'clock they come back: feet on the stairs, lanterns, the priest in his gold tiara at their head. They see the sign. The old ones stop on the steps and will not come one step nearer. They hiss, and turn their faces away. The young ones look at the sign, and at you, and do nothing. Not one of them will touch it.

      You walk out through them. They let you.

      At dawn the town is silent: no lanterns, no bell, gulls on the green, the reef black and empty in the low tide. The first bus runs at half past six. You are on it.

      That summer the fish leave Innsmouth, and the gold stops. By autumn the Hall has a padlock on its door, and the old ones sit at their windows looking at the sea, waiting for something that doesn't come.
    extra:
      - requires: {note: PROMISE}
        text: |
          Before the bus, you knock at Ruth Eliot's back door and tell her. She comes back with the carpetbag already packed and Jonas behind her, and nobody stops the three of you. You kept your promise.
      - requires: {note: OATH}
        text: |
          You swore the first oath of Dagon in that hall, and broke it in the cellar under it. They have nothing left to come for you with.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel. In February federal men come up the coast to see what is left of the town.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, your eyes in the hall mirror are wider, and they don't close all the way when you sleep. You dream of a woman with your grandmother's face, who knows what you did, and isn't angry, and waits. There are other doors. The sea is wide.
      - text: |
          In the keystone of an arch at the bottom of the world, a star with a flame in its heart keeps the door. Nobody will ever know you set it there. That was the point.

  185:
    title: The Sea Door
    ending: triumph
    text: |
      You pack the dynamite under the keystone, where the stone is old and soft, cut the fuse short, light it, and run.

      You are on the second flight when the vault goes up. Stone comes down behind you in a long roar, and then the sea pours in, black and freezing, and chases you up two flights before it stops, slopping, a foot below your boots.

      The shaft is gone, and the lower door, and whatever breathed behind it, under fifty tons of rubble and the sea.

      You come out onto the green with the boats still out at the reef, where the singing has stopped. You walk out along the empty road west, and at dawn a milk truck takes you into Rowley.

      That summer the fish leave Innsmouth, and the gold stops. The county condemns the Hall as unsafe. Nobody in Innsmouth objects.
    extra:
      - requires: {note: PROMISE}
        text: |
          In September a letter in Ruth Eliot's careful round hand brings you to a boarding house on Water Street, in Newburyport: her sister's. Ruth is there, and Jonas, two inches taller, and she gives you coffee instead of thanks, which is better.
      - requires: {note: OATH}
        text: |
          You swore an oath of silence in that hall, and then you brought its cellars down. For a year you sleep with a chair under your doorknob. Nobody comes.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out of Innsmouth goes to Boston in a plain parcel. In February federal men come up the coast to see what is left of the town.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, your eyes in the mirror are wider, and they don't close all the way when you sleep. In your dreams a woman with your grandmother's face shows you the rubble in the vault, and laughs, gently: there are other ways up, cousin, for family.
      - text: |
          You took six sticks of dynamite into a church cellar in a town that worshipped the sea, and came out again. In Innsmouth, nobody calls it anything.

  # ----------------------------------------------------- The Marsh supper

  186:
    title: Supper
    effects:
      - unnote: NOON
      - unnote: AFTERNOON
      - unnote: LATE
      - unnote: EVENING
    text: |
      At nine the candles are lit in the dining room of the white house on Washington Street, and the family sits down to supper.

      Esther Marsh sits at the foot of the table in grey silk and pale gold. Two younger Marshes sit across from you, narrow and handsome, with large still eyes. A maid with the look brings in the fish.

      At the head of the table, in a high-backed chair turned from the candles, sits Barnabas Marsh: a shape in a black coat, too wide at the shoulders, with a grey hand on the cloth whose fingers are fused past the second knuckle. His eyes catch the candlelight, round and pale and enormous. They have not closed, Esther says quietly, in eleven years.

      They are looking at you.
    extra:
      - requires: {note: PARLOUR}
        before: true
        text: |
          You know the house already, and tonight every door in it stands open, as if it has nothing to hide.
      - requires: {no_note: PARLOUR}
        before: true
        text: |
          You have never been inside before. Through the open parlour door, over the mantel, hangs a sea captain in a blue coat with a hooded gaze and your eyes: Obed Marsh, your great-great-grandfather.
      - text: |
          Nobody has said yet what they want with you.
    choices:
      - text: "Sit, and eat, and hear what they want."
        to: 290
      - text: "Make your excuses now, before anyone says it."
        roll: {skill: [Stealth, Charm], success: 188, failure: 194}

  290:
    title: Ours
    effects:
      - san: "1/1D8"
    text: |
      The fish is very good. You don't remember eating it.

      Esther talks. About Paris, where Leonie went to school, and the letters Leonie wrote home from Arkham, which lie by her plate tied with a ribbon. About your grandmother, who came home in 1919. About the city under the reef, the way you might talk about a house in the country: the gardens, the light, the cousins who have waited so long to meet you.

      "Stay," she says at last. "You were always ours. You've known it since you first set foot in Innsmouth."

      At the head of the table, Barnabas makes a sound in his chest, wet and low. It might be a laugh.
    extra:
      - requires: {note: ORNE}
        text: |
          You have known since you first saw Leonie Marsh's face, or her name. Now you don't need to say it.
      - text: |
          Esther lays her hand over yours. It is cool and soft, and between the fingers there is the faintest beginning of a web.
    choices:
      - text: "Stay."
        to: 189
      - text: "Ask to see where your grandmother went down."
        to: 187
      - text: "Excuse yourself, and slip out through the garden."
        roll: {skill: [Stealth, Charm], success: 188, failure: 194}

  187:
    title: The Tunnel
    effects:
      - note: SEADOOR
      - note: TUNNEL
    text: |
      Esther is pleased. She takes a candle and leads you down through the cellars, past barrels of salt fish, to a low door in the seaward wall. Beyond it a tunnel slopes down into the dark, brick, then older stone, then rock, until it opens into a round vault with a black shaft in its floor.

      "This is where she went down," Esther says. "Your grandmother. And Leonie before her, and Leonie's mother, who was the first. Take as long as you like. There's never any hurry, after."

      Her footsteps go away up the tunnel. You are alone.
    choices:
      - text: "Look at the shaft."
        to: 178

  188:
    title: The Garden
    text: |
      You excuse yourself. Nobody stops you. You walk down the hall past the parlour door, where Obed's portrait watches you go, out into a garden gone wild, over the wall, and down through the dark streets to the river.

      You lie in the reeds for a long time while the boats come back from the reef and the lanterns start up into the town. They are calling for you by your name, softly, the way you would call a cat in at night.
    choices:
      - text: "Get up out of the reeds, and move."
        to: 144

  189:
    title: Home
    ending: claimed
    text: |
      It is easier than you would have believed. People nod to you on the street, and touch two fingers to their caps, and call you by your name. The town is very kind, once you belong to it.

      The years go by the way the tide goes out, so slowly you never see it moving. You stop writing letters. You stop blinking. One spring the skin at the sides of your throat begins to fold, and you find you are breathing through the folds, a little, when you sleep in the bath.

      You don't mind. That is the strangest thing. You don't mind at all.

      One night, years from now, at May-Eve or Hallowe'en, you will walk down Water Street with the others, under the lanterns, and down the steps into the black water, and you will not come up. And it will be warm.
    extra:
      - requires: {investigator: genealogist}
        before: true
        text: |
          From that night on you live with the Marshes, your mother's people, in a white house with green blinds. You write to your mother in Toledo once, to say you have found the family. You don't write again.
      - requires: {investigator: [agent, antiquarian, reporter]}
        before: true
        text: |
          They take you down to the vault under the Hall, and you swear the three oaths with your hands in the black water of the shaft. After that you live in a room over the fish sheds, and never once try to leave.
      - requires: {investigator: genealogist}
        text: |
          When it is your turn to go down, she is there at the bottom of the steps with her arms open. Your grandmother, as she was on the porch in Toledo, and as she really is, both at once. "There you are," she says. "Come home."
      - text: |
          You came to Innsmouth a stranger. You will leave it the way everyone born there does: through the water, into the dark, and never cold again.

  # ----------------------------------------------------- Walking out

  190:
    title: Out, Now
    text: |
      You don't wait for the moon. You put the Square behind you and walk fast, eyes on the cobbles. Nobody stops you. Down on the waterfront, lanterns are moving toward the boats.

      At the edge of town three ways lie open: the road west to Rowley along the edge of the marsh, the way the bus goes; the road south over the marsh toward Ipswich; and, if you know where to look, the old railway, its embankment a low dark line across the marsh to the west.
    extra:
      - requires: {note: WATCHED}
        text: |
          Behind you, somewhere in the dusk, a door opens and does not close.
      - text: |
          The first star is out over the sea.
    choices:
      - text: "Follow the old railway west."
        requires: {note: RAILWAY}
        to: 191
      - text: "Walk the Rowley road."
        to: 192
      - text: "Take the Ipswich road south."
        to: 217

  191:
    title: The Line at Dusk
    text: |
      Up Babson Street in the last of the light, past the boarded station, and out along the line. The rails run west into the marsh on their low embankment, the ties soft and splintered underfoot. A heron goes up with a croak.
    extra:
      - requires: {note: HANDCAR}
        text: |
          On the siding by the old platform, the handcar stands where you left it.
      - text: |
          The light is going fast.
    choices:
      - text: "Pump the handcar west."
        requires: {note: HANDCAR}
        to: 202
      - text: "Walk on, along the ties."
        to: 232

  232:
    title: Moonrise on the Line
    text: |
      Behind you, the moon comes up red and enormous out of the sea behind Devil Reef, and lays a copper road across the marsh to your heels. Then the singing starts, far away, on the reef.

      You walk faster. You cross a creek on an old gapped trestle, one tie at a time, not looking down. Ahead, the line runs on toward a place where the ground rises and the brush grows thick along the rails: the cut, where the Rowley road crosses the line.
    extra:
      - text: |
          Behind you, a long way off, a sound like many feet slapping on a road. Somebody saw you go.
    choices:
      - text: "Walk on."
        to: 205

  192:
    title: The Rowley Road
    text: |
      The Rowley road runs west along the edge of the marsh, between ditches of black water. You walk on the crown of it, fast. The moon comes up behind you, and your shadow runs out long ahead.

      A mile out, you hear the motor. A long black car with blinds on its rear windows and no headlamps is rolling up behind you from the town at a walking pace. It has seen you. It doesn't hurry.

      On your left, beyond the ditch, the open marsh runs on for miles.
    choices:
      - text: "Get off the road, and into the marsh."
        to: 214
      - text: "Stand at the side of the road, and let it pass."
        roll: {skill: [Psychology, Fast Talk], success: 193, failure: 194}

  193:
    title: Let It Pass
    text: |
      You stand at the side of the road, hat in hand, like a farmhand waiting for the squire to go by.

      The car stops beside you. A rear blind goes up an inch: darkness, and two pale points that might be eyes. You think about nothing. You are a traveller on business of your own.

      The blind comes down. The car turns round in the road and goes back toward the town.

      You walk for what feels like all night, and come into Rowley in the small hours.
    choices:
      - text: "Wait for the first train."
        to: 220

  # ----------------------------------------------------- Captured

  194:
    title: Taken
    effects:
      - lose: revolver
      - lose: dynamite
      - lose: camera
      - lose: ledger
      - lose: register
      - lose: sign-stone
      - lose: robe
      - lose: gold
      - lose: map
      - lose: whiskey
      - lose: badge
      - lose: crowbar
      - lose: handcuffs
      - unnote: PLATE
      - unnote: PRIEST
      - unnote: ELIOT
    text: |
      Cold hands, many of them. A sack over your head that stinks of fish. A stumbling walk downhill, a door, stairs, and the sound of rushing water.

      When the sack comes off you are in a cellar room at water level, deeper in than any you saw by day. One wall is an iron grate over a black tunnel full of river. Your pockets are empty.

      You are not alone. A fisherman from Kingsport sits against the wall with his knees drawn up; he has been here since June. A girl from Rowley, no more than sixteen, lies on a pile of sacking with her face to the wall.

      "They're keeping us," the fisherman says. "For Hallowe'en. They feed you good. That's how you know."
    choices:
      - text: "Sit down with your back to the wall, and listen to the river."
        to: 195

  195:
    title: The Sluice Room
    text: |
      The night goes by in pieces.

      The fisherman's name is Asa Hatch. He put into Innsmouth for water in June, after the cod, and woke up here. He talks low and steady, the way you talk to a horse in a burning barn. He has a wife in Kingsport. He has stopped expecting to see her.

      Twice something swims past in the tunnel beyond the grate, slowly, against the current. The second time it stops, and holds the bars with long grey fingers, and looks in at you for a long time.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Toward morning Esther Marsh, your cousin, comes down in grey silk with a blanket and a bowl of chowder. You are not for the knife, she says. You are for the oath, at Hallowe'en, with the boy from across the river.
      - text: |
          Asa watches the grate. "Bolts are rusted," he says, very low. "I'm not strong enough no more. Maybe you are."
    choices:
      - text: "Work the grate's bolts loose."
        roll: {skill: [STR, Mechanical Repair], success: 197, failure: 196}
      - text: "Swear whatever they ask of you, to live."
        to: 189
      - text: "Wait, and hope for a better chance."
        to: 198

  196:
    title: The Bolt Holds
    effects:
      - hp: "-1"
    text: |
      You work until your fingers bleed. One bolt turns a quarter of an inch, and stops.

      A pale eye looks in at the little window in the door, and goes away.

      "Dawn's two hours off," Asa says. "They change the man on the door at dawn. You got one more try in you, maybe."
    choices:
      - text: "Try once more, with everything you have."
        roll: {skill: [STR, CON], difficulty: hard, success: 197, failure: 198}
      - text: "Swear whatever they ask of you, to live."
        to: 189
      - text: "Let it go. Wait for October."
        to: 198

  197:
    title: The River
    effects:
      - hp: "-1D4"
      - unnote: BOAT
    text: |
      It takes a long time. Your hands bleed. Then one bolt snaps, and the next turns, and the grate swings in, and the river roars at you out of the dark.

      "Up," Asa says. "Up, not down. Never down." He won't come: he's too old to swim. The girl has turned back to the wall.

      The water takes you at once, cold enough to stop your heart, and throws you along the tunnel in the black. Something brushes your leg. Then grey light, and you come out under a waterfall into the river below the mill, half drowned, on the stones of the bank.

      Above you the town is full of lanterns.
    choices:
      - text: "Crawl up into the dark streets."
        to: 144

  198:
    title: Hallowe'en
    ending: lost
    text: |
      They keep you all summer, and feed you well. That is how you know. Asa Hatch is taken upstairs in August and doesn't come down. The girl from Rowley goes in September. You scratch the days on the wall, and then you stop counting, and listen to the river.

      On the last night of October they wash you, and dress you in white, and walk you down Water Street with the whole town behind you singing. They row you out to the reef under a cold moon. The priest in the gold tiara stands on its highest rock, and the water all round is moving, full, alive.

      The last thing you see of Innsmouth is the three steeples against the stars. Then the water at your feet rises, and reaches for you with a hundred hands.
    extra:
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          On the reef there is a boy of twelve in white, waiting for his oath. Jonas. You promised his mother. He looks at you once, and looks away.
      - requires: {investigator: genealogist}
        text: |
          But it is not the knife, for you. The priest lays his grey hands on your head and says the third oath, and the water takes you down, gently, and opens your eyes. Your grandmother is waiting at the bottom, in the light. You are glad. That is the worst of it.
      - text: |
          You came to Innsmouth to look. Innsmouth looked back, and kept you for October.

  # ================================================================== ACT FOUR: THE WAY OUT
  # ----------------------------------------------------- The Square at night

  199:
    title: The Moonlit Square
    effects:
      - san: "0/1D3"
    text: |
      Every lane toward the old station opens first onto the Square, and the ones you try have lanterns at their far ends. You stop in a doorway at the Square's north corner.

      The moon turns the cobbles to bone. Forty or more of them are gathering on the Gilman House steps with lanterns and boat-hooks, croaking low. They walk the way the town walks: a lurch and a shuffle, head low, feet set down flat and heavy.

      Babson Street leaves from the far corner, past the shuttered drug store, and climbs toward the station. Eighty yards of moonlight.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Your knees understand their walk before your head does. It would be easy. It would be the easiest thing in the world.
      - text: |
          Walking, not running. Nobody in Innsmouth runs.
    choices:
      - text: "Pull the grey robe over your head, and walk."
        requires: {item: robe}
        to: 201
      - text: "Walk across as if you belong here."
        requires: {investigator: genealogist}
        to: 201
      - text: "Walk across slowly, the way they walk."
        roll: {skill: [Stealth, POW], success: 201, failure: 200}

  200:
    title: Run
    text: |
      Halfway across, a lantern stops. A head turns, low and slow. Then they are all turning, and you run. A handcart lies on its side across the mouth of Babson Street.
    choices:
      - text: "Go over the cart, and up the hill, and don't look back."
        roll: {skill: [DEX, Jump], success: 201, failure: 194}

  # ----------------------------------------------------- The line

  201:
    title: The Line West
    text: |
      Babson Street climbs between empty houses. At the top the old station sits boarded in the moonlight, and the rails run west into the marsh, two thin lines of silver.

      Down in the town a long, wet bark goes up, taken up by many throats. They know you've gone.
    choices:
      - text: "Throw your weight on the handcar, and pump it west."
        requires: {note: HANDCAR}
        to: 202
      - text: "Walk the line, as fast as the ties allow."
        to: 203

  202:
    title: The Handcar
    effects:
      - san: "0/1D3"
    text: |
      The handle groans, gives, and rises and falls. The wheels shriek, and the station falls away behind you. The noise carries over the marsh like a church bell.

      A mile out, something comes along the ties behind you, slap, slap, slap, in long hops. You pump until your shoulders burn, and the slapping falls back, and stops. The cut goes by in a rush of brambles and shadow. Nothing waits in it. Not yet.

      Three miles on, the handcar coasts to a stop short of the junction. You walk the last half mile into Rowley, and sit out the night on the depot bench.
    choices:
      - text: "Wait for the light."
        to: 220

  203:
    title: The Trestle
    text: |
      West of the station the line crosses a creek on sixty feet of black trestle. Some of the ties are gone. The rest are soft as cake. Below, the tide runs black. Behind you, lanterns move in the town.
    choices:
      - text: "Cross on the ties, one at a time."
        roll: {skill: [DEX, Climb], success: 205, failure: 204}

  204:
    title: The Creek
    effects:
      - hp: "-1D3"
    text: |
      A tie breaks under your foot like wet bread. You go through, strike a beam, and the creek closes over your head.
    extra:
      - requires: {investigator: genealogist}
        text: |
          It isn't cold. It has never been cold, not for you. For a long moment you don't want to come up.
      - text: |
          The current drags you to the bank. You haul yourself out, climb back onto the embankment, and walk on, soaked and shaking.
    choices:
      - text: "Follow the line west."
        to: 205

  # ----------------------------------------------------- The cut

  205:
    title: The Cut
    effects:
      - san: "0/1"
    text: |
      Beyond the creek the line runs out over the marsh on its low embankment. The moon is up, and the salt grass is silver.

      Two miles out, the rails run into the cut: a shallow trench choked with brambles and sumac. At its far end the Rowley road crosses the line on the level, a pale strip of dust.

      You are halfway through when you hear it, coming along the road from the town. At first it sounds like a great many people walking in wet boots. Then it doesn't: a slap, slap, slap, flat and heavy, and over it a croaking that is almost a tune.

      You get into the brambles and lie on your face, with thorns in your arms. They have come out after you. The road crosses the line forty feet from where you lie.

      The smell reaches you first: fish, and the floor of the harbour at low tide.
    extra:
      - requires: {note: OATH}
        text: |
          Under your breastbone, the oath you swore stirs like a hook taking hold. It knows them. They would know you too.
      - text: |
          Then the first of them comes over the rise and into the moonlight at the crossing.
    choices:
      - text: "Shut your eyes, and keep them shut until they've passed."
        to: 206
      - text: "Look."
        to: 207
      - text: "Photograph them by moonlight."
        requires: {item: camera, skill: "Art/Craft (Photography)", min: 40}
        roll: {skill: "Art/Craft (Photography)", success: 208, failure: 209}
      - text: "Hold the old sign stone up in front of you."
        requires: {item: sign-stone}
        to: 211
      - text: "Scratch the old sign in the sand in front of your face."
        requires: [{any: [{note: SIGN}, {item: library-notes}]}, {no_item: sign-stone}]
        to: 211
      - text: "Fire into them."
        requires: {item: revolver}
        to: 212
      - text: "Step out of the brambles, and fall in step with them."
        to: 213

  206:
    title: Eyes Shut
    effects:
      - san: "0/1D3"
    text: |
      You press your face into the sand and keep your eyes shut.

      It takes a long time to pass. The slapping comes level with the cut and goes on, and on. You hear them cross the rails: flat feet on wood, something scraping on iron. Once, something stops at the lip of the cut, right above you, and breathes for a long time. Then it goes on.

      When it is quiet, the moon has moved a hand's breadth. You walk west toward Rowley, and you don't look at what they left in the dust.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  207:
    title: You Look
    effects:
      - san: "1/1D8"
    text: |
      You look.

      They come over the rise and keep coming. Hundreds. Most hop on long legs folded like a frog's. Some go on all fours, and a few drag themselves. They are grey-green and wet and white-bellied, with the heads of fish and great round eyes that never close, and their necks open and shut as they breathe. One wears a tall crown of pale gold.

      Among them walk men and women in ordinary clothes, the way the town walks. You know one or two of them.

      It takes the best part of an hour. You don't blink. Afterwards you find you couldn't have.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Near the back goes a woman with huge, heavy-lidded eyes and a brooch of pale gold at her throat. Your grandmother, after eight years in the sea. As she passes she looks straight at your bramble, and smiles.
      - text: |
          When they have gone, you walk west along the line to Rowley. Your legs carry you. That is all you can say for them.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  208:
    title: A Plate in Moonlight
    effects:
      - note: PLATE
    text: |
      No flash. Not here. You brace the Graflex on the rail and leave the shutter open.

      Most of them will be a grey smear. But at the crossing the one in the gold crown stops, and stands quite still for a long minute, looking back along the road. The shutter is open the whole time.

      When the last of them has gone, you walk to Rowley with the camera held against your chest.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  209:
    title: The Flash
    effects:
      - note: PLATE
    text: |
      The moon isn't enough. You fire the flash anyway. For one white instant the whole road is lit, and hundreds of wet grey faces turn toward you.

      You have your picture. Then you run.
    choices:
      - text: "Run for the marsh."
        to: 210

  210:
    title: Into the Marsh
    effects:
      - hp: "-1D2"
    text: |
      Down off the line and into the marsh. Behind you the croaking becomes a roar, and the slapping spreads through the grass on both sides, like beaters at a hunt. Creeks, mud, grass over your head. You run, and fall, and run.
    choices:
      - text: "Run, and swim the creeks where you have to."
        roll: {skill: [DEX, Swim], success: 215, failure: 214}

  211:
    title: They Go Round
    effects:
      - san: "0/1D3"
    extra:
      - requires: {item: sign-stone}
        before: true
        text: |
          You kneel up in the brambles and hold the stone in both hands, the star toward the road.
      - requires: {no_item: sign-stone}
        before: true
        text: |
          You scratch it in the sand in front of your face: five points, and the flame at its heart. Your hand shakes.
      - requires: {item: sign-stone}
        text: |
          You keep the stone in your hand, star outward.
      - requires: {no_item: sign-stone}
        text: |
          You leave the sign in the sand behind you. You hope it lasts until morning.
      - text: |
          Then you walk west to Rowley, and you don't stop until you're there.
    text: |
      The procession comes level with the cut, and stops. The croaking dies. Hundreds of them breathe, a wet rasp like surf on shingle. One takes a hop toward you, and makes a small sound, almost a whimper.

      Then they go round, out across the marsh in a long curve a quarter of a mile wide of you, and back onto the road far to the west. Not one of them comes any nearer.
    choices:
      - text: "Walk on to Rowley."
        to: 220

  212:
    title: Six Shots
    ending: death
    text: |
      You come up on one knee and fire into the crossing until the hammer clicks on nothing. Something squeals. Something falls, and gets up again.

      The croaking stops. The whole procession turns off the road together, the way a flock of birds turns, and comes down into the cut.

      There are a great many of them. There were always going to be.
    extra:
      - text: |
          You emptied a revolver into a procession of several hundred. You were a sergeant in France. You knew better.

  213:
    title: Fell in Step
    ending: claimed
    text: |
      You don't decide to do it. You find yourself standing, pushing out of the brambles, climbing onto the road. The nearest of them turns its wet head, and makes room.

      The rhythm takes you at once: hop and slap, the croaking all around you, until you are croaking too, and it isn't hard at all. Your shoes come off in the first mile. You don't miss them.

      Toward dawn the procession turns back toward the sea, and you go with it, down Water Street and out along the breakwater. Nobody there looks surprised.

      Weeks later a clam-digger finds a pair of shoes in the dust of the Rowley road, set side by side. They fit him. He has bad dreams in them, and throws them in the river.
    extra:
      - requires: {investigator: genealogist}
        text: |
          Halfway to the sea, a woman with a brooch of pale gold falls in beside you. You know her face from a photograph. She takes your hand, cool and webbed, and doesn't let go all the way to the water.
      - text: |
          They came out to hunt you down. You saved them the trouble.

  # ----------------------------------------------------- The marsh

  214:
    title: The Salt Marsh
    text: |
      Salt grass over your head, then mud to the knee, then a creek, black and fast. Every creek brings you to another. You can't see the sky to steer by.

      The tide is coming in: the water is at your shins, then your knees. Something heavy slides into a creek. Far off there is a light. A farm, perhaps.
    choices:
      - text: "Find higher ground before the water finds you."
        roll: {skill: [Spot Hidden, POW], success: 215, failure: 216}

  215:
    title: Higher Ground
    text: |
      The ground rises: a hummock, a field, a rutted farm track. You sit on it, shaking, until the sky goes grey. A dog barks. A signpost at the end of the track says IPSWICH 2 MI.
    choices:
      - text: "Walk into Ipswich."
        to: 221

  216:
    title: The Salt Marsh
    ending: lost
    text: |
      The water comes up round your hummock, and over it. Your waist, then your chest. There is nothing in any direction but moonlight on water, and the land much too far away. Things move in the water, in no hurry. They know the tides better than you do.

      In August a clam-digger finds a coat caught on a stake in the middle of the marsh, with a swollen, unreadable notebook in its pocket. Nobody ever claims it.
    extra:
      - requires: {investigator: genealogist}
        text: |
          The water isn't cold. It has never been cold, not for you. When it closes over your head you can see quite well, and something with your grandmother's face is waiting. You go to her.
      - text: |
          The marsh keeps what it takes. So does the sea it belongs to.

  # ----------------------------------------------------- The Ipswich road

  217:
    title: The Ipswich Road
    text: |
      The road runs south across the marsh on a bank of white dust. There is nowhere on it to hide.

      A mile out, at a wooden bridge, two young men in fishermen's jerseys stand under a lantern, one with a shotgun broken over his arm. Their heads are a little narrow. They have seen you.
    choices:
      - text: "Pull up the hood of the grey robe, and walk straight at them."
        requires: {item: robe}
        to: 218
      - text: "Draw your revolver, and walk straight at them."
        requires: {item: revolver}
        to: 218
      - text: "Walk up to them, and bluff your way past."
        roll: {skill: [Fast Talk, Intimidate, Persuade], success: 218, failure: 194}
      - text: "Get off the road, and go round through the marsh."
        to: 214

  218:
    title: Over the Bridge
    text: |
      They step aside. You walk past close enough to smell the fish on their jerseys. You feel their eyes on your back for a long time. Nobody follows.
    choices:
      - text: "Keep walking south."
        to: 221

  # ----------------------------------------------------- The first bus

  219:
    title: The First Bus
    text: |
      Grey light, and gulls. Shutters closed, a lantern guttering on a doorstep. On the cobbles of the Square, wet webbed prints are drying, hundreds of them, all going toward the sea.

      At half past six Joe Sargent's bus stands at the Gilman House steps with its engine running. He watches you climb aboard, and doesn't blink. He knows. Innsmouth doesn't do its work by daylight.
    extra:
      - requires: {note: RUTH}
        text: |
          Ruth climbs aboard behind you with a carpet bag, and Jonas holding her coat. Joe looks at the boy for a long moment. Then he looks at the road.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out of Innsmouth. You get on without him.
      - requires: {note: RAN}
        text: |
          His wrist is rubbed raw where your cuff was. He takes your fare with the other hand.
      - requires: {investigator: genealogist}
        text: |
          As you sit down he speaks, once. "Ye'll be back." It sounds like comfort.
      - requires: {note: WATCHED}
        text: |
          All the way up the hill his eyes stay on you in the mirror.
      - text: |
          The bus climbs to the crest, and Innsmouth drops away behind you until there is nothing but the marsh.
    choices:
      - text: "Ride it out to Newburyport."
        to: 223

  # ================================================================== DAWN

  220:
    title: Rowley
    effects:
      - note: ROWLEY
    text: |
      Rowley at the end of the night: a white church, a store with its blinds down. On the depot bench you watch the sky go grey.

      At a quarter to six the stationmaster unlocks. He looks at your face and asks nothing. There is a telephone on his wall. The first train for Boston is the ten past six.
    choices:
      - text: "Ask for his telephone, and put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Take the ten past six, and go home."
        to: 226

  221:
    title: Ipswich
    effects:
      - note: IPSWICH
    text: |
      You have lost count of the hours. At last the marsh gives way to stone walls and orchards.

      Ipswich at dawn is elms and white clapboard, and a milk wagon whose driver stares at you. On the green stands a brick police station, with a lamp still burning over its door.
    choices:
      - text: "Walk into the police station, and put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Tell nobody anything. Go home."
        to: 226

  222:
    title: Plum Island
    effects:
      - note: ATSEA
    text: |
      Dawn comes up red behind you and lights the white dunes of Plum Island ahead. Far to the south, Devil Reef is a black line, and the roofs of Innsmouth catch the first sun, small and harmless as a picture.

      Your clothes are stiff with salt. Every time something brushes the hull you stop breathing. Every time, it is only weed.
    extra:
      - requires: {note: BOAT}
        text: |
          Shea wouldn't cross the Merrimack bar in the dark. He lay off Plum Island with the engine stopped, smoking, until first light. Now he noses her in toward the beach.
      - requires: {no_note: BOAT}
        text: |
          Your hands are raw from the oars.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth rows. Jonas is asleep in the bow, and once, in his sleep, he laughs.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth rows, and hasn't spoken. The place in the bow where Jonas sat is empty.
      - requires: {note: CALLED}
        text: |
          A grey Coast Guard cutter comes down on you out of the morning and throws you a line. Her captain asks nothing. His lookouts watched the lanterns on the reef all night, and the swimmers round it.
      - requires: [{note: BOAT}, {note: CALLED}]
        text: |
          Shea swears, and doesn't run. The captain looks at his crates, and at your face, and lets it go.
      - text: |
          Whatever you do next, you will do it with something solid under your feet.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell the cutter's captain what his own lookouts saw last night."
        requires: [{note: CALLED}, {no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}, {no_note: CALLED}]
        to: 225
      - text: "Take Ruth and Jonas to her sister's door."
        requires: [{note: RUTH}, {no_note: SWAM}]
        to: 228
      - text: "Take Ruth to her sister's door."
        requires: [{note: RUTH}, {note: SWAM}]
        to: 228
      - text: "Tell nobody anything. Go home."
        to: 226

  223:
    title: Newburyport
    effects:
      - note: NEWBURYPORT
    text: |
      At a quarter past seven the bus stops on Market Square, in front of Hammond's. Newburyport is waking up: a boy with newspapers, a milk dray, someone whistling.

      Down the hill at the station, the ticket agent is rolling up his blind. He sees you, and stops, and looks at you for a long moment. Then he finishes rolling it up.
    extra:
      - requires: {note: RUTH}
        text: |
          Ruth and Jonas climb down behind you. Ruth looks round at the ordinary morning as if she has never seen one.
      - text: |
          Behind you, the bus pulls away, back the way it came.
    choices:
      - text: "Put what you carry in front of someone who can act on it."
        requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        to: 224
      - text: "Tell them what you saw, though you can't prove it."
        requires: [{no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        to: 225
      - text: "Take Ruth and Jonas to her sister's door."
        requires: {note: RUTH}
        to: 228
      - text: "Tell nobody anything. Go home."
        to: 226

  # ================================================================== SHARED ENDINGS

  224:
    title: The Raid
    ending: triumph
    text: |
      You tell it from the beginning, three times. The last time is to a man in a grey suit up from Boston, who writes nothing down. They tell you to go home and say nothing, and you do.

      All summer nothing happens. Then, in February, the papers are full of it and say almost nothing. Federal agents have raided a decayed seaport on the North Shore. There have been a great many arrests and no trials. The old waterfront has been burned and dynamited.

      What the papers don't print you hear later, from a man who heard it from a sailor. On the night of the raid a submarine lay off Devil Reef and fired torpedoes straight down into the deep, until the sea boiled white.
    extra:
      - requires: [{note: ARKHAM}, {note: PRISONER}]
        before: true
        text: |
          Inside Arkham police headquarters, Joe Sargent sits cuffed to a radiator, humming.
      - requires: [{note: ARKHAM}, {no_note: PRISONER}]
        before: true
        text: |
          You step down from the last bus in Arkham, and walk straight to police headquarters.
      - requires: {note: ROWLEY}
        before: true
        text: |
          You telephone the State Police from the Rowley depot. A car comes for you inside the hour.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          At seven in the evening, with Eddie twisting his cap beside you, you walk into the Ipswich police station.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          The lamp is still burning over the Ipswich police station when you push open its door.
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          You tell it first in the cutter's wardroom, over coffee you can't hold steady.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          You come ashore on Plum Island, and tell it first at the Coast Guard station.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          You tell it first to the ticket agent. He locks his window, and walks you up to the police himself.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}, {note: PRISONER}]}
        before: true
        text: |
          You put what you carry on the table. Without it you would be one more crank with a story about Innsmouth. With it, nobody laughs.
      - requires: [{note: CALLED}, {no_item: ledger}, {no_item: register}, {no_note: PLATE}, {no_note: PRISONER}]
        before: true
        text: |
          The captain sends for his log. Nobody laughs at a ship's log.
      - requires: {item: ledger}
        text: |
          The Treasury takes the ledger. In March the Marsh Refining Company goes into receivership, and its furnace goes cold.
      - requires: {item: register}
        text: |
          The register goes to the Attorney General, who reads the names aloud one evening, every one of them. It takes him an hour.
      - requires: {note: PLATE}
        text: |
          The Navy takes your plate. The Gazette runs your story on page one, without a picture.
      - requires: {note: PRISONER}
        text: |
          Joe Sargent never eats, never asks for a lawyer, never blinks. In October his cell is found empty and wet, the bars untouched.
      - requires: {note: CALLED}
        text: |
          The cutter's log, which you are never meant to see, records lights on Devil Reef, and "swimmers, in numbers, of unusual size".
      - requires: {note: TIARA}
        text: |
          A quiet man from Washington asks to borrow Miss Tilton's tiara, indefinitely. She tells him certainly not.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          At Christmas a card comes from Ruth Eliot in Newburyport. Jonas is at school. He swims every day, even in December.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          At Christmas a card comes from Ruth Eliot. She doesn't mention Jonas. Under her name she has drawn a star with a flame in its heart.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out. The papers print no names, and you are afraid to ask what became of the Eliots.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at one in the morning. Nobody is there, only wet prints going away. They haven't forgotten your oath.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, the shaving mirror shows it: rounder eyes that blink too seldom, two faint creases at your neck. Every night you dream of a lit city below a black reef, and your grandmother waiting on a long stair. The torpedoes hardly scratched it. It is waiting.
      - text: |
          On clear days you can see Devil Reef from the crest of the Newburyport road. You never go and look.

  225:
    title: Nobody Believes You
    ending: lost
    text: |
      They listen. People always listen to a story about Innsmouth. They write it down, and thank you, and ask if there is someone they can wire.

      Without proof, it is a story. Innsmouth has had stories told about it for eighty years, and nobody has ever acted on a single one.
    extra:
      - requires: {note: ARKHAM}
        before: true
        text: |
          At half past nine a desk sergeant at Arkham police headquarters writes it all down, licking his pencil.
      - requires: {note: ROWLEY}
        before: true
        text: |
          The Rowley constable is fetched out of bed, and listens on the depot bench in his braces.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          At seven in the evening, with Eddie waiting outside on the green, you tell it to the Ipswich desk sergeant.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          At the Ipswich police station, a sergeant with egg on his tie writes it all down.
      - requires: {note: ATSEA}
        before: true
        text: |
          At the Coast Guard station on Plum Island, a boatswain who has heard Innsmouth stories before writes it down.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          The ticket agent hears all of it, then walks you up to the police.
      - requires: {investigator: agent}
        text: |
          Your chief in Boston asks whether you have been drinking the evidence. In September you are transferred to Duluth.
      - requires: {investigator: antiquarian}
        text: |
          Miskatonic's president kindly suggests a sabbatical. You take it in Switzerland, far from any sea, and can still smell it.
      - requires: {investigator: reporter}
        text: |
          Your editor spikes it. In the end you sell it to a pulp magazine, as fiction, for eleven dollars.
      - requires: {investigator: genealogist}
        text: |
          Your mother wires a ticket home, and says nothing about Innsmouth, in a way that tells you she knows.
      - requires: {note: PRIEST}
        text: |
          Your photograph of the priest proves that a man in Innsmouth owns a gold hat.
      - requires: {item: gold}
        text: |
          They weigh your gold and agree that it is gold. They ask, rather sharply, where you got it.
      - requires: {note: ZADOK}
        text: |
          When you mention Zadok Allen, somebody laughs. "Old Zadok? He's been telling that one since Grant was president."
      - requires: {note: CALLED}
        text: |
          The cutter's log records lights on the reef, which is no crime, and nothing else that anyone will put in writing.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth doesn't wait to hear what anyone decides. She takes Jonas down to her sister's on Water Street, and the door shuts behind them.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth doesn't wait to hear what anyone decides. She goes down to her sister's on Water Street alone.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out. You think of it at Hallowe'en, and every Hallowe'en after.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at one in the morning. Nobody is there, only wet prints going away. They haven't forgotten your oath.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, the shaving mirror shows it: rounder eyes that blink too seldom, two faint creases at your neck. Every night you dream of a lit city below a black reef, and your grandmother waiting on a long stair. You are not afraid of the dream any more. That frightens you.
      - text: |
          The bus still runs to Innsmouth, twice a day. Some nights you look it up in the timetable.

  226:
    title: The Long Way Home
    ending: escape
    text: |
      You tell nobody. Not the police, not the papers, not the people you love.

      Your life is where you left it, only smaller, like a painted backdrop with the wind behind it. You never go near the sea. You don't eat fish. Some nights you wake, and the room smells of low tide, and you lie very still until it passes.
    extra:
      - requires: {note: ROWLEY}
        before: true
        text: |
          You take the ten past six from Rowley, and don't look out at the marsh.
      - requires: [{note: IPSWICH}, {note: RODE}]
        before: true
        text: |
          Eddie walks you to the depot and asks nothing. You take the evening train.
      - requires: [{note: IPSWICH}, {no_note: RODE}]
        before: true
        text: |
          You take the first train out of Ipswich, and don't look out at the marsh.
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          The cutter puts you ashore at Newburyport. Her captain looks at you for a long time, and lets you go.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          You come ashore on Plum Island, and walk the beach until a road finds you a ride.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          The ticket agent sells you a ticket home without a word.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out goes into the bottom of a trunk. Some nights you take it out and look at it. Then you put it back.
      - requires: {item: gold}
        text: |
          A jeweller once weighed your gold, looked at the things worked into it, and gave it back without an offer.
      - requires: [{note: RUTH}, {no_note: SWAM}]
        text: |
          Ruth shakes your hand at the corner and takes Jonas down toward Water Street, to her sister's. You never hear from them again.
      - requires: [{note: RUTH}, {note: SWAM}]
        text: |
          Ruth shakes your hand at the corner and walks down toward Water Street alone. You never hear from her again.
      - requires: [{note: PROMISE}, {no_note: RUTH}]
        text: |
          You promised Ruth Eliot you would take her son out. You think of it at Hallowe'en, and every Hallowe'en after.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at one in the morning. Nobody is there, only wet prints going away. They haven't forgotten your oath.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, the shaving mirror shows it: rounder eyes that blink too seldom, two faint creases at your neck. Every night you dream of a lit city below a black reef, and your grandmother waiting on a long stair. You stop swimming in the lake. You stay under too long.
      - text: |
          You got out. You tell yourself that, often. You got out.

  227:
    title: The Last Bus
    ending: escape
    text: |
      You take a room in Arkham, in a hotel with an electric lift and a night porter who has never heard of Innsmouth. You don't sleep much. Every time you close your eyes there is a pair of eyes in a mirror, wet and round and never closing.

      In the morning you go home and tell nobody. You saw an old town that was dying. You left before dark. That is the story, and you keep to it.
    extra:
      - requires: [{note: OATH}, {note: WATCHED}]
        text: |
          You rode out because you swore the first oath. A brother may leave. A brother is also expected to come back.
      - requires: {any: [{item: ledger}, {item: register}]}
        text: |
          What you carried out stays at the bottom of your suitcase, unopened.
      - requires: {item: gold}
        text: |
          Some nights you turn the gold in the lamplight, and the things worked into it seem to turn too.
      - requires: {note: PROMISE}
        text: |
          You promised Ruth Eliot you would take her son out. You rode out alone at eight. At Hallowe'en you sit up all night with the lamp lit.
      - requires: {note: ZADOK}
        text: |
          That autumn the Arkham paper reports Zadok Allen missing from the Innsmouth poorhouse. Nobody looks for him.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, the shaving mirror shows it: rounder eyes that blink too seldom, two faint creases at your neck. Every night you dream of a lit city below a black reef. "Ye'll be back," Joe Sargent said. You begin to think he was right.
      - text: |
          The last bus from Innsmouth leaves the Square at eight. You were on it. Some nights, in your sleep, you are on it still, going the other way.

  228:
    title: Out with the Eliots
    ending: bittersweet
    text: |
      Ruth's sister keeps a boarding house on Water Street in Newburyport, a tall grey house with hollyhocks by the door. You slept there the night before last. Her name is Martha. She opens the door with flour on her hands, sees Ruth, and puts both hands over her mouth.

      Ruth hasn't seen her sister in fifteen years. She says nothing at all. Then Martha has hold of her, crying into her hair, and Ruth stands there and lets her.
    extra:
      - requires: [{note: ATSEA}, {note: CALLED}]
        before: true
        text: |
          The Coast Guard cutter puts you all ashore at the mouth of the Merrimack. The captain gives Ruth his coat.
      - requires: [{note: ATSEA}, {no_note: CALLED}]
        before: true
        text: |
          Ruth beaches the dory on Plum Island, and you walk across the long bridge into Newburyport with the sun coming up, scarecrows in salt-stiff clothes.
      - requires: {note: NEWBURYPORT}
        before: true
        text: |
          From Market Square it is three streets down to the river. Ruth walks them very fast, her hand tight on Jonas's.
      - requires: [{no_note: MARTHA}, {item: letter}]
        text: |
          Martha's letter is still in your pocket. You give it to Ruth on the step, and Martha watches her read it, and doesn't say a word.
      - requires: [{no_note: MARTHA}, {no_item: letter}]
        text: |
          You know her. She is Mrs. Lowell, who gave you eggs yesterday morning. The darker girl in the photograph on her dresser was Ruth.
      - requires: {note: MARTHA}
        text: |
          Martha doesn't ask how. "When you went off yesterday with my letter, I knew," she says. She made up the back bedroom last night.
      - requires: {no_note: SWAM}
        text: |
          Jonas stands behind his mother, his eyes too round in the daylight. Martha looks at them, and opens the door wider. Later Ruth says quietly, "It doesn't stop. Going away doesn't stop it. But it's his now. Not theirs."
      - requires: {note: SWAM}
        text: |
          Martha looks past her sister for the boy. There is no boy. Later Ruth turns her cup round and round. "He went to his father. He wanted to. That's the part I'll never forgive them."
      - requires: [{note: PROMISE}, {no_note: SWAM}]
        text: |
          You promised her you would take her son out of Innsmouth. You kept it.
      - requires: [{note: PROMISE}, {note: SWAM}]
        text: |
          You promised her you would take her son out of Innsmouth. You got him as far as the harbour mouth.
      - requires: {any: [{item: ledger}, {item: register}, {note: PLATE}]}
        text: |
          What you carried out stays in your bag. While nobody looks at Innsmouth, nobody comes looking for the Eliots.
      - requires: {note: OATH}
        text: |
          A year later, on the second night after the July full moon, someone knocks at one in the morning. Nobody is there, only wet prints going away. They haven't forgotten your oath.
      - requires: {investigator: genealogist}
        text: |
          A year later, in Toledo, the shaving mirror shows it: rounder eyes that blink too seldom, two faint creases at your neck. Every night you dream of a lit city below a black reef. It doesn't stop, Ruth said. But it's yours.
      - text: |
          Martha's back bedroom looks out over the river toward the sea. All that summer, Ruth keeps the curtains drawn.

  229:
    title: Y'ha-nthlei
    ending: claimed
    text: |
      You climb out onto the reef. The rock is slick and warm, and it seems to breathe. The robed ones step aside. At the far end the priest in the gold tiara inclines his head, as a host does when a late guest arrives.

      The things from the water take your hands, cool and webbed and gentle. The chant goes up, *Iä! Iä!*, and you find you know the words. Then you step off the edge.

      The water closes over your head. You breathe it in. It doesn't hurt. Down the face of the reef, past the hollows, deeper than any sounding line, until the dark and the weight of the sea are an embrace.

      Then there is light below you. Y'ha-nthlei lies at the bottom of the deep like a city seen from a hill at night: terraces, colonnades, great stairs, domes inlaid with pale gold. Things move along its streets in their thousands, unafraid. At its heart vast shapes stir in their sleep: Mother Hydra and Father Dagon.

      They have waited a long time for you.
    extra:
      - requires: {investigator: genealogist}
        text: |
          At the foot of the longest stair a woman waits, grey-green and shining, with a brooch of pale gold at her throat. "Arthur," your grandmother says. "You came home." Behind her shines an older face: Pth'thya-l'yi, Obed Marsh's bride, the mother of all your mothers. You came east to find your people. You have found them.
      - requires: {investigator: [agent, antiquarian, reporter]}
        text: |
          It will be slower for you without the blood, they tell you. But the sea is patient. There will be no more dying, and in a little while you will not remember being anything else.
      - text: |
          Up above, the tide covers Devil Reef. In Innsmouth someone writes your name down, and beside it two words: went down.

  230:
    title: Recorded as Drowned
    ending: death
    text: |
      They find you, wherever you fell. They always do.

      Nobody outside Innsmouth ever sees your body. In the town clerk's ledger, a slow hand writes one more line under all the others: a name, an age, and two words.

      *Drowned, July 1927.*

      There is no grave. There never is.
    extra:
      - requires: {investigator: agent}
        text: |
          The Bureau lists you as missing in the line of duty. Mickey Shea says he never heard the name.
      - requires: {investigator: antiquarian}
        text: |
          Miskatonic puts the gold armlet you spent ten years on in a case by the door of a reading room named for you.
      - requires: {investigator: reporter}
        text: |
          The Gazette gives you four inches on page nine: LADY REPORTER MISSING ON NORTH SHORE. They spell your name wrong.
      - requires: {investigator: genealogist}
        text: |
          In Toledo your mother reads the letter twice, and does not cry. That night, and every night after, she dreams of green water.
      - text: |
          By noon, the ink is dry.

  231:
    title: The Unblinking
    ending: madness
    text: |
      Somebody finds you. You remember a road, and a light, and someone saying a name you didn't know was yours.

      The Arkham Sanatorium is red brick behind a high wall. The doctors are kind. You don't blink. You can, if you think about it, but you never think about it, and the nurses dab your streaming eyes.

      You ask for water. Salt water, in a basin, so that you can put your face in it and breathe. They won't give it to you.
    extra:
      - requires: {investigator: genealogist}
        text: |
          In the spring they give you a room with a bathtub, the only thing that quiets you. One morning in June the tub is full, the room is empty, and the bars are untouched.
      - text: |
          At night you lie very still and listen, through the walls and the miles, for the sea. Sometimes you hear it.

