    text: |
      "Aout?" A wet laugh. "Never the roads after dark. They watch the roads. The old railroad, west across the marsh to Rowley, an' keep low in the cut where the road comes in. Or the water, if ye've a boat. But keep off the reef."

      Then his chin goes down on his chest, and nothing will wake him.
