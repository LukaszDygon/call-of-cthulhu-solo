  # --- The Marsh house (the genealogist) --------------------------------------------------------------------------

  105:
    title: The Parlour
    effects:
      - note: PARLOUR
      - san: "1/1D6"
    extra:
      - requires: {note: ORNE}
        text: |
          You knew already. Leonie Marsh, lately of Paris. But it is different, seeing her face over a mantelpiece in this house, with Obed's eyes in it, and your own.
      - text: |
          Esther sets down her cup. "Your grandmother came home to us, in the end," she says. "Did they tell you that?"
    text: |
      The Marsh house is dark and cool, every blind drawn, and it smells of the sea. Esther Marsh takes you herself into a parlour full of old mahogany and older silence, and sits you in a chair by the cold fireplace.

      Over the mantel hangs a portrait of a man in a captain's coat, with a hard jaw and a heavy, hooded gaze. Obed Marsh. You know his eyes. You have shaved them every morning of your life.

      Beside him, smaller, is a girl in a Paris gown of the 1860s, with dark hair and a brooch of pale gold at her throat. You know the brooch too. It is in the photograph in your pocket.

      "Leonie," says Esther. "Captain Obed's youngest. My great-aunt, and your great-grandmother." She pours tea from a silver pot into cups as thin as eggshell. Her hands are long and pale, and the fingers are oddly joined. "You must forgive the dark. Father can't bear the light any more."

      Somewhere above you, a floorboard creaks under a great weight.
    choices:
      - text: "Ask her what she means."
        to: 106
      - text: "Ask to see the rest of the house."
        to: 107
      - text: "Make your excuses, and leave."
        to: 108

  106:
    title: Abigail
    effects:
      - note: ORNE
      - san: "1/1D6"
    text: |
      "She came to Kingsport in the summer of 1919," says Esther, "to see her Arkham cousins. And one night she walked down into the sea." She smiles. "They think she drowned. She didn't drown. She swam north for two days, and came home to us, and went down to her mother, and her mother's mother. They're all there, under the reef. She's very happy."

      You remember the telegram. You remember your mother crying in the kitchen in Toledo, and the empty coffin.

      "It comes to all of us," says Esther gently, "sooner or later. Wherever we are. It's coming to you. You know it is." She puts her cold hand over yours. "Stay to supper. Stay the night. There's so much to tell you."
    choices:
      - text: "Stay to supper, as she asks."
        to: 109
      - text: "Leave, now."
        to: 108

  107:
    title: Upstairs
    effects:
      - gain: gold
    text: |
      She takes you up the wide stair. On the landing is a door, shut, and behind it something breathes: slow, wet, enormous breaths, like a bellows working under water.

      "Father," says Esther, and doesn't stop.

      She shows you a long room where the blinds are drawn and glass cases stand in rows, full of gold. Tiaras, collars, armlets, chains, all in the pale gold of the sea, all carved with the things that are fish and are men. She opens a case and takes out an armlet and slips it over your wrist. "Leonie's," she says. "It should be yours."

      It is cold, and then it isn't.
    choices:
      - text: "Thank her, and take your leave."
        to: 108

  108:
    title: The Green Door
    text: |
      Esther sees you to the door herself. "You'll come back," she says. Not a question. The door shuts behind you, and you are out in the hot, bright street, blinking.
    choices:
      - text: "Walk on into the town."
        requires: {no_note: NOON}
        to: 32
      - text: "Walk on through the hot afternoon."
        requires: [{note: NOON}, {no_note: AFTERNOON}]
        to: 33
      - text: "Walk on. The afternoon is wearing away."
        requires: [{note: AFTERNOON}, {no_note: LATE}]
        to: 34
      - text: "Walk on. The shadows are getting long."
        requires: [{note: LATE}, {no_note: EVENING}]
        to: 35
      - text: "Head back to the Square. It's nearly eight."
        requires: {note: EVENING}
        to: 116

  109:
    title: A Long Afternoon
    text: |
      You mean to stay for one more cup. You sit back in the chair by the cold fireplace while Esther talks, about Paris, and Leonie, and the island, and the sea, and the room is dim and cool and smells of salt, and her voice goes on like the tide.

      You dream of green water. You dream of a city under the sea, with towers and arches and windows full of light, and people swimming in the streets. Somebody is waiting for you at one of the windows. You can't quite see her face.

      When you wake, the light at the edges of the blinds is red. The whole afternoon has gone.

      "There you are," says Esther, from the shadows. "Supper's at nine."
    choices:
      - text: "Stay to supper."
        to: 186
      - text: "Excuse yourself, and walk down to the Square for the bus."
        to: 116

  # --- The old station --------------------------------------------------------------------------------------------

  110:
    title: The Old Station
    effects:
      - note: STATION
      - note: RAILWAY
    extra:
      - requires: {no_note: NOON}
        before: true
        text: |
          It is nearly noon. Your feet hurt and your collar is wet through, and the town has not noticed you yet. You step down off the end of the line onto the old platform.
      - text: |
          From up here the whole town lies below you, sloping down to the harbour. Babson Street drops away steeply toward the Square.
    text: |
      The old station stands at the top of Babson Street, on the south-west edge of town where the houses give out and the marsh begins. It is a little wooden building with a deep roof, painted a brown that has gone grey, every window boarded and the door nailed shut. INNSMOUTH, says a board under the eaves, in letters you can still just read.

      The line runs out west from beside it, two rusty rails on rotten ties, straight out across the marsh toward Rowley, until the heat haze swallows it.

      On a siding by the platform stands a pump handcar, the kind section gangs used to ride: a flat bed on four iron wheels, with a seesaw handle in the middle. It is red with rust, and grass grows up through the boards.
    choices:
      - text: "Prise the boards off the station door, and look inside."
        to: 111
      - text: "Walk down Babson Street to the Square."
        requires: {no_note: SQUARE}
