  # --- The waterfront ---------------------------------------------------------------------------------------------

  54:
    title: Water Street
    effects:
      - note: WATERFRONT
    extra:
      - requires: [{note: BOAT}, {no_note: NOON}]
        before: true
        text: |
          Shea brings the *Lady Ellen* in against the end of the old Marsh wharf. Men with narrow heads and wet, staring eyes take his crates without a word. "Midnight," he says, not looking at you. "Here. Not a minute after two." Then he is gone.
      - requires: {note: WATCHED}
        text: |
          A man mending a net on the wharf doesn't look at the net. He looks at you.
      - text: |
          Far out, a bell buoy clangs, slow as a heartbeat.
    text: |
      Water Street runs along a dying harbour: warehouses with their roofs fallen in, wharves sagging into the water on rotten piles, gulls screaming on the sandbars.

      One wharf is kept up. OLD MARSH WHARF, says a weathered board, and there is a newer boathouse at its root, with a padlock on the door. A stone breakwater runs out from the south end of the harbour, with men fishing along it.

      Far beyond the breakwater, much too far out, children are swimming: small dark heads in the swell. Nobody on shore watches them. Beyond them, the reef.
    choices:
      - text: "Walk out along the breakwater."
        to: 55
      - text: "Look into the boathouse on the Marsh wharf."
        to: 63
      - text: "Climb down under the wharf, where something knocks against the piles."
        to: 66

  55:
    title: The Breakwater
    text: |
      The breakwater is a ridge of tumbled granite, wet and weedy, with the stump of a lighthouse at its end. The fishermen along it have the look, every one, and baskets of fish too big and too many for July. Nobody speaks to you.

      The swimmers are a long way out in the green water, treading water and watching the shore. One of them waves. Past them, through the haze, lies the reef.
    choices:
      - text: "Walk back along the wharves to the boathouse."
        to: 63
      - text: "Study the reef."
        roll: {skill: Spot Hidden, success: 56, failure: 57}
      - text: "Strip off, and swim out to the bathers."
        to: 58
      - text: "Walk on into the town."
