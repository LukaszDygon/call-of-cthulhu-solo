  # --- The Square -------------------------------------------------------------------------------------------------

  36:
    title: The Square
    effects:
      - note: SQUARE
    extra:
      - requires: {investigator: genealogist}
        text: |
          The old men at the fire station look at you, all of them, all at once. One of them nods, slowly, the way you nod to someone you know.
      - requires: {note: WATCHED}
        text: |
          The people in the Square stop what they are doing when you come into it. They start again when you look at them.
      - requires: [{note: INVITED}, {no_note: NOON}]
        text: |
          A long black car with curtains in its windows has drawn up at the kerb. The driver, in a grey coat buttoned to the throat, gets out, opens the rear door, and waits. He is looking at you.
      - requires: {note: EVENING}
        text: |
          The First National's blind is down for the night.
      - text: |
          A clock in the hotel lobby window says the wrong time, and has said it for years.
    text: |
      The Square is cobbled, and too big for what is left around it.

      The Gilman House fills one side: four storeys of clapboard with a cupola on top, and yellow paint coming off it in flakes the size of your hand. Its porch sags. Its windows are dark, all but one in the lobby. Beside it, a drug store with its shutters up, and beside that a chain grocery, the First National, with the only clean window in town.

      Across the cobbles, the office of the Marsh Refining Company, brick, with its blinds pulled all the way down. On the corner of Paine Street, a firehouse with its big doors open and no engine inside, only a row of old men on kitchen chairs, sitting in the shade and saying nothing. Down the side street beyond it, a sign: VARIETY, on Eliot Street.

      A few people cross the Square. They walk slowly, with a flat-footed shuffle, and they keep to the edges. They don't speak to each other. Their necks are oddly creased at the sides, below the ears, as if the skin there were folded.
