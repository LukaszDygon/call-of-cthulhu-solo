      - san: "1/1D4"
    text: |
      The door of the house next to the Marshes' stands open. A brass plate, green with salt, says WAITE.

      Inside it is cool and dim and smells of the sea. The furniture is still there under dust sheets. Upstairs, in what was a nursery, with a rocking horse and wallpaper of little blue ships, there is a bathtub in the middle of the floor. It is full to the brim with seawater. There is weed in it, and something has been lying in it, recently, because the water slops at the edges.

      In the window seat, the inside of the lid is scored with long scratches, from inside, as if something had been shut in there to keep it quiet.

      On a hook behind the door hangs a grey robe. You take it, and you don't know why, and you leave by the back way.
