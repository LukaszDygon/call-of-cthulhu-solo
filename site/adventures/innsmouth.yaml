# The Last Bus from Innsmouth: a solo gamebook for the engine in site/app.js. Full format: docs/adventure-format.md.
#
# How the file works
#   sections      numbered passages. Each has text, optional effects, optional extra paragraphs, and choices.
#   choices       `to: N` turns to section N. `roll:` rolls d100 against a skill instead:
#                   roll: {skill: Stealth, difficulty: hard, success: N, failure: M, bonus: 1}
#                 `skill` may be a list; the investigator rolls their best one. difficulty: regular | hard | extreme.
#   effects       applied when a section is entered, or when a choice is taken:
#                   san: "1/1D4"  a Sanity roll: lose 1 on a pass, 1D4 on a fail.  san: "-2" or "+1D3": a straight change.
#                   hp, luck      straight changes, e.g. hp: "-1D6".
#                   gain / lose   an item id.   note / unnote   a journal word.
#   requires      a choice (or an extra paragraph) only shows when this holds. A list means all of them.
#   extra         paragraphs shown after the text when their `requires` holds (`before: true` puts one ahead of the text).
#                   item, no_item, note, no_note, skill + min, investigator, any: [...]
#   ending        marks an ending section: triumph | escape | bittersweet | lost | claimed | death | madness
#                 (any word works; see site/app.js for the labels).
#
# This is a solo story: there are no companions.
#
# Time of day: NOON, AFTERNOON, LATE and EVENING are journal words. Places in Innsmouth that can be visited at more than one hour check
# them to know which hub comes next. They are cleared at eight o'clock, when the last bus leaves.
#
# WATCHED decides the night. If the town has marked you by eight, the bus has engine trouble.
id: innsmouth
title: The Last Bus from Innsmouth
series: A solo investigation, 1927
subtitle: One summer day on the North Shore, and the bus that leaves at eight.
blurb: |
  July 1927. Twelve miles south of Newburyport, past the salt marshes, lies a seaport that the maps still show and the neighbours never mention. Its fishing never fails. Its little refinery melts down gold that no mine ever produced. Its people grow strange with age, and then they are not seen at all.

  One bus a day goes there, and one comes back. The last one out leaves the Square at eight. Innsmouth is polite to strangers who look at the steeples and catch it. It is not polite to strangers who ask questions.
investigator_intro: Four strangers came to Newburyport on the same July morning, each with a reason to go south. Choose the one who will still be in Innsmouth when the sun goes down.
# Shape this story is held to by `gamebook stats` and the test suite.
targets:
  sections: [215, 250]
  path_mean: [30, 40]
  endings_reached: 16
  cosmetic_choices: 0.1
start: 1
on_death: 230
on_madness: 231

bouts:
  - "You laugh, a wet croak of a laugh, and cannot stop."
  - "For a long moment you cannot remember which way the sea is, and it matters terribly."
  - "You stare without blinking until your eyes burn, and you do not want to stop."
  - "Your hands shake so hard you have to sit on them."
  - "The chant goes round and round in your head: Iä, Iä."
  - "You weep, and taste salt, and are not sure it is tears."

