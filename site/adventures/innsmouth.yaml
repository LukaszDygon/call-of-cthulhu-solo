  86:
    title: The First Oath
    effects:
      - note: OATH
      - san: "1/1D4"
    extra:
      - requires: {investigator: genealogist}
        text: |
          Under the oath, for a moment, you hear your grandmother's voice. You must have imagined it.
      - text: |
          "There," says the doorkeeper. "Now you are a little bit ours."
    text: |
      Her hands are cold and damp round yours. You swear not to speak of what you see to any who are not of the Order, for as long as you live, and longer.

      At *and longer*, something settles in you, like a small hook going in under the skin.

      Inside, the Hall is one great dim room, painted blue-green and crowded with gilt sea-things: fish, weed, and figures that are fish and men at once. There is a dais with a carved chair, and grey robes hang on pegs. A door is marked VESTRY. In the corner a stair goes down, breathing cold air that smells of the sea.
    choices:
      - text: "Ask to see the cellars."
        to: 87
      - text: "Slip into the vestry when she turns away."
        roll: {skill: [Stealth, Spot Hidden], success: 89, failure: 91}
      - text: "Thank her, and leave."
        to: 84

  87:
    title: The Second Oath
    text: |
      She smiles, pleased. "For the cellars, the second oath. Service. Only that you will come when you are called." She holds out her cold hands. "Another very small oath."
    choices:
      - text: "Swear it."
        to: 88
      - text: "Refuse."
        to: 84

  88:
    title: Brother of Dagon
    ending: claimed
    extra:
      - requires: {investigator: agent}
        text: |
          The Bureau lists you as missing in October. Shea sees you once on the wharves, unloading his crates, and says nothing to anyone.
      - requires: {investigator: reporter}
        text: |
          Your editor gets one letter in September, in your hand, saying you've found a better story and are staying with it. You never send another.
      - requires: {investigator: antiquarian}
        text: |
          Miskatonic gives your chair to a younger man. In your rooms they find your notes on the armlet, every drawing of the old sign torn out.
      - requires: {investigator: genealogist}
        text: |
          The Marshes come to the Hall to see you, and Esther Marsh kisses your cheek and calls you cousin. A year later Obed Marsh looks back at you out of the glass, and you are glad.
      - text: |
          You came to see the steeples, and joined the church.
    text: |
      You swear, and the hook goes in deeper.

      She takes you down to vaults where the walls drip, and shows you the sea door: a black shaft of water under a carved arch, with things moving below. She shows you the long table where the Order eats on feast nights, and a place at it with your name already carved.

      When eight o'clock comes, you find you don't want the bus. They give you a robe of your own, a room near the waterfront, and work at the mill. At Hallowe'en they call you, and you come. You swore you would.

  89:
    title: The Vestry
    effects:
      - note: SEADOOR
    extra:
      - requires: {investigator: antiquarian}
        text: |
          The oldest pages are not names but an account of how the hall was bought, the cellars dug down to meet the shaft, and the sea door set in the arch under this floor.
      - text: |
          Out in the Hall, the doorkeeper's keys chink. She is coming back.
    text: |
      A narrow room: a desk, robes on pegs, a cupboard of gold, a second tiara on a stand.

      On the desk lies a great ledger bound in sharkskin. The Order's register. Names and dates from 1840 on, in a dozen hands, marked *May-Eve* and *Hallowe'en*. Young people, mostly. Some are crossed through, with two words beside them: *went down*.

      At the end: *Amos Eliot, 1924. Went down.* Below it, in this year's ink: *Jonas Eliot. Third oath. Hallowe'en.*

      Inside the back cover is a plan of the cellars: a stair, three vaults, and a round shaft inked in red, marked *the door*.
    choices:
      - text: "Take the book and a robe."
        effects:
          - gain: register
          - gain: robe
          - note: WATCHED
        to: 90
      - text: "Take only a robe."
        effects:
          - gain: robe
        to: 90
      - text: "Take nothing."
        to: 90

  90:
    title: Out Through the Hall
    text: |
      The doorkeeper is standing in the middle of the Hall with her hands folded, as if she has been there all along.

      "You've seen enough for one day," she says gently, and walks you to the door.
    extra:
      - requires: {item: register}
        text: |
          Her eyes rest for a moment on the bundle under your arm. She says nothing. She doesn't need to.
      - text: |
          The door shuts softly behind you.
    choices:
      - text: "Walk on into the town."
