  109:
    title: A Long Afternoon
    text: |
      You mean to stay for one more cup. Esther talks of Paris, and Leonie, and the island, and the sea, and her voice goes on like the tide.

      You dream of a city under the sea, all towers and lit windows, and someone waiting at one of the windows.

      When you wake, the light at the edge of the blinds is red. The afternoon has gone. "There you are," says Esther, from the shadows. "Supper's at nine."
    choices:
      - text: "Stay to supper."
        to: 186
      - text: "Excuse yourself, and walk down to the Square for the bus."
        to: 116

