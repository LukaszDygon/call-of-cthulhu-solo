  99:
    title: A Word with Hrubý
    effects:
      - unnote: RAIDED
      - note: MACH
      - note: WARNED
    text: |
      Mach reads Pepík's confession twice, slowly, moving his lips. Then he folds it carefully and hands it back to you, and stands up, and takes his cap off the peg.

      "Rustling," he says. "In my district. In 1927." He settles the cap on his head. "I'll go up to Hrubý's myself this afternoon. You'll have your bull back by supper, and Mr. Hrubý will have a visit he won't enjoy."

      He pauses at the door.

      "And that letter to the vet," he says, tapping the confession. "He'll still have to come on Wednesday; once a complaint is filed, he must. But I'll telephone Klatovy myself and tell them what that complaint is worth, and I'll be there with him."
    choices:
      - text: "Thank him, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank him, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank him, and go out into the dusk."
