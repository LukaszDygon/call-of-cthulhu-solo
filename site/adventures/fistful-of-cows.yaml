        requires: {no_note: NOON}
        to: 75
      - text: "Drop it, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Drop it, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  101:
    title: To Cool Off
    effects:
      - note: AWAY
      - unnote: NOON
      - unnote: LATE
      - companion: bara
        san: "-1D6"
      - companion: sultan
        san: "-1D4"
    text: |
      You press harder. You raise your voice. At some point you bring your fist down on his desk, and the inkwell jumps, and so does Mach.

      He sighs. He gets up, takes a key off its hook, and opens the door to the back room.

      "In you go," he says. "For your own good, and mine. You can cool off overnight, and I'll let you out in the morning, and we'll say no more about it."

      The cell has a plank bed, a bucket, and a barred window that looks out on the yard of the Golden Bull. You listen to the piano through the bars until midnight.

      You spend the night in the cells. Bára spends it alone on the farm.
    extra:
      - requires: {investigator: gendarme}
        text: |
          He apologises all the way to the cell door. "Sir," he says. "Sergeant. You'd have done the same." You would. You did, often.
    choices:
      - text: "Lie down on the plank bed, and wait for morning."
        to: 102

  102:
    title: Seven O'Clock
    text: |
      At seven the gendarme sergeant, Strážmistr Mach, unlocks the cell with a mug of coffee in his other hand and an expression of deep disapproval under the moustache.

      "Go home," he says. "And stay there. Whatever is going on up at your place, it isn't going on in my cells again."

      Fanda has spent the night in the yard of the Golden Bull, where the landlady gave him oats and a blanket. You drive home up the valley in the grey morning with your head pounding, and the Black Wood very dark and quiet on your right.
    choices:
      - text: "Drive home, and see what the night has done."
        to: 147

  # ----------------------------------------------------- St Prokop's
  103:
    title: St Prokop's
    effects:
      - note: CHURCH
    text: |
      The church is cool and dim after the square, and smells of wax and old stone. Father Kolář is on his knees before the side altar, arranging chrysanthemums in a brass vase with enormous care. He gets up when he hears your step.

      He is thin and grey and gentle, and he looks at you over the chrysanthemums with mild, worried eyes.
    extra:
      - requires: [{investigator: singer}, {no_note: INVITED}]
        text: |
          Then he sees who you are, and the chrysanthemums fall out of his hands. "Rozálie," he says. He was a thin, serious boy of eighteen the last time you saw him, the summer you ran away. He is a thin, serious man of fifty-six now. He picks up the flowers one by one, and does not look at you while he does it.
      - requires: [{investigator: singer}, {note: INVITED}]
        text: He has had a night to get used to it. His hands are still not quite steady.
      - requires: {note: INVITED}
        text: |
          "You came," he says. "Good. I hoped you would. I'll fetch the chronicle."
    choices:
      - text: "Ask to see the parish chronicle."
        requires: {note: INVITED}
        to: 104
      - text: "Ask to see the parish chronicle."
        requires: {no_note: INVITED}
        roll: {skill: [Persuade, Charm, History], success: 104, failure: 106}
      - text: "Ask to borrow the sacristy handbell, for the cows."
        to: 105
      - text: "Leave him to his flowers, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Leave him to his flowers, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Leave him to his flowers, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  104:
    title: The Year of the Swedes
    effects:
      - note: SNILEK
    text: |
      He takes you into the sacristy, where the parish chronicle lives in an iron-bound chest beside the vestments: three great volumes in brown calf, the oldest so heavy that he needs both hands to lift it onto the table.

      He turns the pages with a fingertip. The writing is brown and spiky, the Latin crabbed. He finds 1641, and reads it aloud, translating as he goes.

      *In this year the Swedish soldiers broke the dam of the pond called Snílek, which lies below the forest, and the water ran away. And for three nights the dreams of the sleepers walked abroad, and were seen by many, and spoke. On the fourth morning they did not depart. The miller Jan Brož thereafter believed himself a heron, and stood upon one leg.*

      *Then Father Matyáš caused the whole parish to carry earth to the dam for one month, and the pond was filled. And he stood upon the bank at dusk and sang to the water, and the dreams went down into it and slept.*

      Father Kolář closes the book.

      "Water," he says. "And a song. I used to think it was a pretty story." He looks at you. "I don't think that any more. I think it's instructions."
    extra:
      - requires: {investigator: singer}
        text: |
          "You sang at the last singing," he says. "In 1880. You were in the front row, in a white dress. I was nine, at the back, with the boys. I couldn't take my eyes off you." He clears his throat. "Off the singing, I mean. I couldn't take my eyes off the singing."
    choices:
      - text: "Ask to borrow the sacristy handbell, too."
        requires: {no_item: handbell}
        to: 105
      - text: "Thank him, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank him, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank him, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  105:
    title: The Handbell
    effects:
      - gain: handbell
    text: |
      The sacristy handbell hangs on a hook by the door: heavy bronze, with a wooden handle worn pale by three hundred years of altar boys. It is the only bell in the church small enough to carry. It is rung at the consecration, and at funerals, and once, in 1813, it was rung to warn of fire.

      Father Kolář looks at you for a long moment.

      "For the cows," he says.

      You say yes. For the cows.

      "Well," he says, and takes it down and puts it into your hands. "It woke the whole town in 1813. It will probably wake a cow. Bring it back by Sunday, or the Bishop will want to know why."
    choices:
      - text: "Thank him, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank him, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank him, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  106:
    title: Not Today
    text: |
      Father Kolář smiles and spreads his hands, and says that the chronicle is very old and very fragile, and that he would need to ask the Bishop, and that perhaps, one day, when things are less busy. He says it very gently. He looks at you once more, worried, and then goes back to his chrysanthemums.
    choices:
      - text: "Leave him to it, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Leave him to it, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Leave him to it, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  # ----------------------------------------------------- The spa
  107:
    title: Prokop's Spa
    effects:
      - note: SPA
    text: |
      The spa sits on the hill above the town in its own small park, among clipped lawns and gravel walks: a long white Kurhaus with a glass veranda, a bandstand, and a little domed pavilion over the spring. Invalids sit on the terrace in wicker chairs with rugs over their knees, drinking warm mineral water from china cups with spouts. It tastes, you are told, of iron and good health. A string trio is playing Strauss.

      At the end of the terrace, a man in plus-fours and a tweed cap is bent over a brass telescope on a tripod. It is pointed at the sky, though it is broad day. He is about forty, thin and eager, with ink on his fingers. When he straightens up to make a note, you see that he has drawn a little rocket on his shirt-cuff.

      On a bench by the spring, reading a newspaper and drinking from a spouted cup like everybody else, sits a stout, pink, white-whiskered man in a frock coat. A brass plate on the pavilion door says *Dr. E. Hájek, Spa Physician*.
    extra:
      - requires: {investigator: analyst}
        text: You know that pink face. You sat beside it at a lecture in Vienna in 1911, while it snored through the second half of a paper on the uncanny. Hájek. He knows you too. He lowers his newspaper and raises his cup.
    choices:
      - text: "Tell the man at the telescope what's been happening on your farm."
        to: 108
      - text: "Ask the spa doctor for something that lets a person sleep without dreaming."
        roll: {skill: [Medicine, Persuade, Charm], success: 109, failure: 110}
      - text: "Take the waters, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Take the waters, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Take the waters, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  108:
    title: The Martian Question
    effects:
      - note: KRATOCHVIL
    text: |
      You tell him about your cows: the ring they stand in, the milk, the way they stare at the Black Wood. You do not tell it well. It does not matter. Halfway through, the man in plus-fours has seized your hand in both of his and is shaking it up and down as if he were pumping water.

      "Kratochvíl," he says. "Leopold Kratochvíl, engineer, author of *Are the Martians Among Us?*, published at my own expense. I knew it. I *knew* it. Cows! It is always cows! Placid, numerous, four stomachs! To a Martian, my friend, a cow must be the most fascinating object on this planet."

      He has seen lights over the valley from this terrace, he says, three nights running, over the Black Wood, over your end of the valley. Nobody would listen. The spa director has asked him to stop pointing the telescope at the guests.

      "I shall come tonight," he says. "To your farm. With the telescope. I shall cycle out at dusk. Don't argue. I'll bring sandwiches. If they come again, we shall be the first two people in the history of the world to watch them properly." His eyes are shining. "You won't regret it."
    extra:
      - requires: {note: MARTIANS}
        text: When you tell him you have read his pamphlet, he goes pink to the ears and embraces you on the terrace, in front of the string trio, who stop playing.
    choices:
      - text: "Shake his hand, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Shake his hand, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Shake his hand, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  109:
    title: Veronal
    effects:
      - gain: veronal
    text: |
      Dr. Hájek hears you out with his hands folded over his waistcoat, and nods, and nods again, and says that he quite understands, that country air takes some people that way, that he himself has not dreamed since 1902 and does not miss it.

      He unlocks a cabinet in the pavilion and gives you a little paper packet of powders.

      "Veronal," he says. "One in warm milk at bedtime, and you will sleep like a stone until morning and dream of nothing at all. Not more than one. And not," he adds, "in the milk from your own cows, I think."
    extra:
      - requires: {investigator: analyst}
        text: |
          "For you, my dear colleague, no charge," he says. "I owe you for the lecture in 1911. You woke me in time for the questions."
    choices:
      - text: "Thank him, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank him, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank him, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  110:
    title: Doctor's Orders
    text: |
      Dr. Hájek hears you out, and nods, and says that he quite understands, and that what you need is not a powder but a course of the waters: three cups a day, warm, before meals. He writes it down for you on a card with his name on it, and pours you the first cup himself.

      It tastes of iron, and rust, and very faintly of eggs. You thank him, and he bows, and that is all you get.
    choices:
      - text: "Put down the cup, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Put down the cup, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Put down the cup, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  # ----------------------------------------------------- Babka
  111:
    title: Babka Kosová
    effects:
      - note: BABKA
    extra:
      - requires: {investigator: singer}
        before: true
        text: |
          Babka knows you before you are through the gate. "Rozálie Vaňková," she says. "The little one in the front row at the singing, in the white dress, with the rag doll. You sang like a lark, and you ran away like one too." She does not sound as if she holds it against you.
    text: |
      Babka's cottage is one room under a thatch so deep it comes down to your shoulders, and every inch of the ceiling is hung with drying herbs: yarrow, tansy, St John's wort, linden flowers, and things you do not know. Beehives stand in a row under the apple trees. The bees go in and out of the open window as if they lived there, which perhaps they do.

      Babka herself is small and brown and bent, in a black headscarf, with eyes like two currants. She sits you at her table and gives you honey cake and a cup of linden tea, and watches you eat with her head on one side, like a blackbird watching a worm.

      "So," she says. "It's started. I told Ferda. I told him two springs ago, when he pulled the boards. *Never let the Snílek go dry, Ferda. It dreams.* He laughed at me." She sniffs. "He's not laughing now, I'll be bound, wherever he is.

      "Three nights, it is. That's what my grandmother said, and hers before her. Once the dreams start walking, three nights, and on the fourth morning they stay, and you never get rid of them after." She refills your cup. "I was at the last singing, you know. In 1880, on the dam, with the choir. I was twenty-seven, and the old priest made us sing to the water till our throats were raw, and I thought it was all foolishness. It wasn't."
    choices:
      - text: "Ask her what can be done."
        to: 112

  112:
    title: One Gift
    text: |
      Babka puts down the pot and folds her hands, and looks at you for a long time with her currant eyes.

      "I can give you one thing," she says. "One. I'm old, and a gift costs. I can teach you the song the keepers sang. Or I can give you this." She takes a hank of red woollen thread from her apron pocket. "It holds a body to the waking side, if it's tied on the wrist. Or I can send you home with something for Bára, who'll need it more than you know. So think."
    choices:
      - text: "Ask her to teach you the lullaby."
        to: 113
      - text: "Take the red thread."
        to: 114
      - text: "Give her the carp from your well."
        requires: {item: carp}
        to: 115
      - text: "Ask her for something to steady Bára."
        to: 116

  113:
    title: The Snílek Lullaby
    effects:
      - note: LULLABY
    text: |
      She sings it to you there at the table, in a thin, cracked, perfectly true old voice, and then makes you sing it back to her until you have it.

      *Hush now, Snílek, hush and keep,*
      *Water over, dark and deep.*
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      "At the monk, the outlet tower in the dam," she says. "At dusk, or after. Stand where the water was deepest and sing it so it can hear you. It'll try to sing back. Don't let it."

      You stay far longer than you meant to. When you leave, the sun is down behind the hills, and the valley is full of blue shadow.
    choices:
      - text: "Go home in the dusk."
        to: 126

  114:
    title: Red Thread
    effects:
      - gain: red-thread
    text: |
      She cuts a length of red wool with her teeth and winds it round your wrist three times, and ties it with a knot you do not see her make.

      "Not now," she says, and unties it again, and puts it in your hand. "On the third night. When you go out to it, tie it on. It holds a body to the waking side. Whatever it shows you, whatever it offers, the thread will pull you back. Once." She holds up one crooked finger. "Once. So don't waste it."

      You stay far longer than you meant to. When you leave, the sun is down behind the hills, and the valley is full of blue shadow.
    choices:
      - text: "Go home in the dusk."
        to: 126

  115:
    title: A Snílek Carp
    effects:
      - lose: carp
      - note: LULLABY
      - gain: red-thread
    text: |
      You fetch the bucket. Babka looks into it, and her whole face changes.

      "A Snílek carp," she says softly. "Oh, I haven't seen one of those in two years. Where in the world..." She looks at you sharply. "From the well. Ferda sent it up. Didn't he?" She does not wait for an answer. She lifts the carp out with both hands, gold and bronze and furious, and holds it up to the light like a priest with the Host.

      "Well," she says. "That's worth more than one gift."

      She sings you the lullaby, and makes you sing it back until you have it:

      *Hush now, Snílek, hush and keep,*
      *Water over, dark and deep.*
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      Then she gives you the red thread too. "On the third night," she says. "Tie it on when you go out to it. It'll pull you back, once."

      You stay far longer than you meant to. When you leave, the sun is down behind the hills. Babka is standing at her door with the carp in her arms, singing to it.
    choices:
      - text: "Go home in the dusk."
        to: 126

  116:
    title: Linden Tea
    effects:
      - companion: bara
        san: "+1D6"
      - companion: sultan
        san: "+1D3"
    text: |
      She fills a stone jar with dried linden flowers and honey and something grey and woolly that she will not name, and ties a cloth over the top.

      "For Bára," she says. "A spoonful in hot water, morning and night. She's a good girl, and she's frightened, and she won't say so to you, because she thinks you'll think less of her." She adds a knucklebone wrapped in newspaper. "And that's for the dog."

      You stay far longer than you meant to. When you leave, the sun is down behind the hills.
    extra:
      - requires: {with: bara}
        text: |
          That night Bára drinks her tea with both hands round the cup, and some of the colour comes back into her face.
      - requires: {with: sultan}
        text: |
          Sultán takes the knucklebone to the well and lies there gnawing it, and for the first time in two days he stops whining.
    choices:
      - text: "Go home in the dusk."
        to: 126

  # ----------------------------------------------------- The wood
  117:
    title: The Trail into the Wood
    text: |
      Bára stays with the cows. Sultán will not come. You go alone.

      The Herdsman has left a trail a child could follow. Long, narrow footprints go down through the dew of the meadow, past the stone tower, and away into the Black Wood, each one twice the length of your boot, with the marks of too many toes.

      You follow them in under the trees.

      At first you are still on the farm. The ground is soft and boggy, and the old pond's east arm runs in among the spruces like a long green finger, a hollow full of moss and cotton grass, with the willows marching beside it. Cowbells hang from the branches, a dozen of them, on loops of plaited grass. They are not your bells. You do not know whose they are. When the wind moves, they ring softly, all together, in three notes.

      Further in, the hollow narrows, and the footprints go on along the bottom of it. Off to the right, beyond the willows and the old boundary stones, the true forest begins, dark and dry and smelling of resin. Somewhere in there, you think, is the place the lights rose from on Sunday night.
    choices:
      - text: "Follow the footprints to where they end."
        to: 118
      - text: "Leave the trail, and look for where those lights came from."
        to: 119

  118:
    title: The Herdsman's Bed
    effects:
      - note: HEART
      - san: "1/1D3"
    text: |
      The footprints end at the head of the hollow, where the east arm of the old pond runs out under a huge old beech.

      There is a bed there. It is a long hollow pressed into a mound of moss, shaped like a lying man: a very tall, very thin man with very long arms. Round it, arranged with care, are things a cow would love. A lump of rock salt. A heap of windfall apples. A bunch of clover, picked and laid down. Tufts of red-and-white cow hair are caught in the moss.

      He is asleep in it.

      He lies on his back with his long hands folded on his chest and his calf's face turned up to the beech leaves. His moss coat rises and falls. He is humming in his sleep, very softly, the same low contented sound. You stand there for a long time, and he does not wake.

      Leading away from the bed, back toward the meadow, the moss has grown in lines. They are faint, but once you see them you cannot stop seeing them: dozens of fine dark lines in the green, all running the same way, like iron filings round a magnet. They all point at the stone tower in the dam. Whatever is dreaming on this farm, that is where it lies deepest.
    choices:
      - text: "Leave him sleeping, and find your way out of the wood."
        to: 120
      - text: "Leave him sleeping, and go looking for where the lights came from."
        to: 119

  119:
    title: Scorched Ferns
    effects:
      - note: KRATOCHVIL
      - san: "0/1"
    text: |
      You cross the line of willows, past a boundary stone with a fish carved on it, and the wood changes. It is drier here, and darker, and the air is plain air again.

      It takes an hour of wandering among the spruces to find it: a clearing, perfectly round, about thirty paces across, where the bracken has been flattened and browned as if a great hot iron had been laid on it. In the very middle the ferns are burned black. The trees round the edge have their lower branches singed.

      There is a man on his knees in the middle of it, with a magnifying glass.

      He is about forty, thin and eager, in plus-fours and a tweed cap, with ink on his fingers and a little rocket drawn on his shirt-cuff. He has a notebook, a tape measure and a box of specimen jars. A bicycle lies in the bracken behind him with a telescope strapped to its crossbar.

      He sees you, leaps to his feet, and comes at you with his hand out.

      "Kratochvíl," he says. "Leopold Kratochvíl. Engineer. You've seen them too, haven't you? The lights? I can tell by your face. I saw them from the spa on Sunday night, seven of them, over this wood. I've been looking for this place since dawn." He wrings your hand. "Are you from the farm? The farm with the cows?"

      When you say that you are, he looks at you as if you had handed him the moon.

      "Then I'm coming tonight," he says. "With the telescope. Don't argue. If they come back, they'll come back to your cows, and I shall be there to watch them. I'll bring sandwiches." And he wheels his bicycle away down a forestry track toward the spa, to fetch them.
    choices:
      - text: "Find your way out of the wood."
        to: 120

  120:
    title: Out of the Wood
    text: |
      You come out of the trees in the late afternoon, and not where you went in. A deer path has brought you down through the beeches to the edge of the valley road, a mile south of the farm, behind a cottage with beehives in the garden and herbs drying under a deep thatch.

      A small bent woman in a black headscarf is standing at the gate, as if she has been waiting for somebody. It is Babka Kosová, Bára's grandmother. She lifts a hand to you.
    choices:
      - text: "Go in and sit with Babka."
        to: 111
      - text: "Walk home along the valley road."
        to: 126

  # ----------------------------------------------------- Staying home
  121:
    title: A Day's Work
    text: |
      There is a farm to run, whatever else is happening on it. You spend the morning doing what has to be done.

      You muck out the cowshed. The calf that nobody bought follows you round it, fading at the edges, and tries to suck your fingers. You pour the blue milk into the ditch, because nobody will buy it and you do not dare drink it. You mend a gate. The child helps. It holds the nails for you, one at a time, very solemnly, and hands each one over just before you need it, as if it has done this before.

      It has. You remember now. You held nails for your father once, exactly like that.

      By noon the meadow is shimmering with heat. The cows lie in the shade of the willows, all together, all facing the same way.
    extra:
      - requires: {with: bara}
        text: Bára works beside you all morning and says almost nothing. Whenever the child comes near her, she finds something to do on the other side of the yard.
    choices:
      - text: "Climb into the hayloft for Vodička's boards."
        requires: [{note: DIARY}, {no_item: boards}]
        to: 122
      - text: "Search the hayloft for whatever closes the outlet tower."
        requires: [{note: DAM}, {no_note: DIARY}, {no_item: boards}]
        roll: {skill: Spot Hidden, success: 122, failure: 123}
      - text: "Play hide-and-seek with the child."
        requires: {no_note: KID}
        to: 124
      - text: "Walk up the brook, and open Hrubý's weir with his own key."
        requires: [{item: weir-key}, {no_note: WATER}]
        to: 211
      - text: "Walk up to mend the north fence, where the rustlers came over."
        to: 125

  122:
    title: Under the Old Harness
    effects:
      - gain: boards
    text: |
      The hayloft is as hot as an oven under the shingles. You find them at the far end, under the old harness, wrapped in sacking and tied with twine: six oak boards, each as long as a man, tarred black, their edges cut to a precise bevel. They would fit the grooves of the outlet tower exactly.

      There is a hollow in the hay beside them, the size and shape of a curled-up child. You do not put your hand in it.
    choices:
      - text: "Carry them down, and go and see to the fence."
        to: 125

  123:
    title: Hay Fever
    text: |
      You spend two hours turning over hay in a loft as hot as a bread oven, and find a rusty sickle, three hens' nests, a mouse, and a cat that was eating the mouse. Whatever closes the outlet tower, it is not under any hay you can find.

      You come down sneezing.
    choices:
      - text: "Go and see to the fence."
        to: 125

  124:
    title: Hide and Seek
    effects:
      - note: KID
      - san: "1/1D4"
      - companion: bara
        san: "0/1D3"
    text: |
      "You count," says the child. "I'll hide." Then it changes its mind. "No. I'll count. You hide."

      It puts its hands over its eyes in the middle of the yard and counts to twenty, in the singsong voice of every child who ever played this game.

      You hide behind the woodpile. It finds you at once. It knew you would be there. You hide in the cowshed, behind Malina. It finds you. You hide in the hayloft, in the bread oven, in the ditch behind the willows, and every time it comes straight to you, laughing, and every time it names the place where you used to hide when you were a child: *behind the mangle*, *under the stairs*, *in the big cupboard in the hall*.

      The last time, it is your turn to seek. You count to twenty and open your eyes, and the yard is empty. You cannot find it anywhere. You look for an hour. You call. The cows watch you, chewing.

      Then a small cool hand slips into yours from behind.

      "Found you," it says, and tells you its name, which is yours.
    choices:
      - text: "Let go of its hand, and go and see to the fence."
        to: 125

  125:
    title: Hrubý Comes Calling
    text: |
      In the middle of the afternoon a big green motorcar comes coughing down the track from the north, and stops at the willows on the edge of the farm with a bang and a cloud of blue smoke.

      Bohuslav Hrubý climbs out of it. He has his Sunday collar on and a document case under his arm, and the Pešek brothers are sitting in the back looking as if they would rather be anywhere else in the world. He walks up to the line of willows and stops dead on it, as if there were a wall there. He does not set one foot on your land.

      "I've come," he calls across the fence, "to make you a better offer. Out of the goodness of my heart. Ten thousand crowns. Today. Before the vet comes, and you have nothing left to sell." He waves the document case. "Sign here, and you can be on the train tonight."

      The child has come to stand at the gate. It looks at Hrubý across the yard, and smiles, and lifts one small hand, and waves.

      Hrubý looks at the child.

      All the blood goes out of his face. He takes a step back, and then another. He gets into the motorcar without another word. It does not start. He sits in it staring straight ahead while the Pešeks climb out and push it, very fast, back up the track and out of sight.

      The child waves until they are gone.
    extra:
      - requires: {note: WATER}
        text: |
          It is only when he has gone that you realise he never once mentioned his mill, which stopped turning the moment the brook went back to its old bed. Perhaps he has not noticed. Perhaps he has, and cannot bring himself to say so.
    choices:
      - text: "Go back to work until dark."
        to: 126

  # ----------------------------------------------------- Night 2
  126:
    title: Monday Night
    effects:
      - companion: all
        san: "1/1D3"
    text: |
      The second night comes down over U Snílku like a lid.

      The cows were in their ring around the stone tower before the sun had properly set. The mist rises off the meadow early, knee-deep and then waist-deep, glowing faintly from inside like milk with a lamp behind it. The child sits on the fence at the top of the meadow, swinging its legs. From the well, very faintly, comes an old man's voice, singing an old song about a miller's daughter.

      Everything is stronger tonight. You can feel it in your teeth.

      The house is lit. The door is bolted. It is not yet ten o'clock.
    extra:
      - requires: {note: LATE}
        before: true
        text: You got home long after dark, and the night is already well under way.
      - requires: {note: VODICKA}
        text: Vodička, at the bottom of your well, seems to be enjoying himself.
      - requires: {note: MACH}
        text: Baron is back in his stall. Strážmistr Mach led him down the brook at suppertime, declined a cup of coffee, and said that Mr. Hrubý had been most apologetic, in the end.
      - requires: {note: KRATOCHVIL}
        text: |
          At dusk a bicycle came wobbling up the valley road with a telescope strapped to its crossbar, and Ing. Kratochvíl climbed off it at your gate in plus-fours and a muffler, with a basket of sandwiches. He looked at the mist on the meadow, and at the child on the fence, and swallowed, and said, "Splendid. Splendid," rather faintly. He is in the kitchen now, polishing his lens.
      - requires: {note: RAIDED}
        text: Baron's stall is still empty. Up the brook, at Hrubý's, you can hear him bellowing to be let out.
      - requires: {with: bara}
        text: Bára has moved her mattress in front of the stove again, with the poker within reach and her grandmother's rosary round her neck.
      - requires: {broken: bara}
        text: Bára does not seem to know that it is night. She moves about the kitchen with her eyes wide open and fast asleep, laying the table for people who are not there, and humming in her grandmother's voice.
      - requires: {broken: sultan}
        text: Sultán sits by the well with his nose to the stones and howls at an empty corner of the yard.
    choices:
      - text: "Set up Kratochvíl's telescope in the yard, and watch the sky."
        requires: {note: KRATOCHVIL}
        to: 134
      - text: "Keep watch over the herd."
        to: 127
      - text: "Give Bára a veronal powder, then keep watch over the herd."
        requires: [{item: veronal}, {with: bara}]
        effects:
          - companion: bara
            san: "+1D4"
          - lose: veronal
        to: 127
      - text: "Sit up in the kitchen with Bára."
        requires: {with: bara}
        to: 128
      - text: "Go to bed, and dream."
        to: 129
      - text: "Take a veronal powder yourself, and sleep like the dead."
        requires: {item: veronal}
        to: 133

  127:
    title: The Herdsman's Work
    effects:
      - note: HEART
      - san: "1/1D3"
      - companion: all
        san: "1/1D3"
    text: |
      You take a blanket down to the willows at the edge of the meadow, sit with your back to a trunk in the glowing mist, and wait.

      A little after midnight a figure comes out of the Black Wood: tall, thin, robed in moss, with long hands and a calf's mild face. It walks into the ring of cows, and they lean toward it and low softly, the way they low for nobody else.

      Tonight it does not only pet them. It leads them. One by one it takes each cow gently by a horn, and walks her down to the bottom of the meadow, and lays her down in a ring round the foot of the stone tower in the dam, close as spokes round a hub. When the last one is down, it stands in the middle of them with one long hand on the tower, and hums.

      The mist round the tower glows brighter than anywhere else. The ground there throbs. You can feel it through the soles of your feet, a slow pulse, like something very large asleep. Whatever is dreaming on this farm, its heart is there.

      It keeps watch over them until the sky begins to grey. Then it walks back into the wood.
    extra:
      - requires: {note: HERDSMAN}
        before: true
        text: You know who to expect tonight.
      - requires: {note: SHOT}
        text: All night it keeps to the far side of the herd and never once looks at you. When you shift your feet, every cow in the ring turns its head away.
      - requires: {note: MALINA}
        text: Malina will not go with it. When it comes for her, she backs away and walks up the meadow to you, and lies down at your feet with a long sigh, and stays there all night.
    choices:
      - text: "Go in at dawn."
        to: 147

  128:
    title: Kitchen Vigil
    effects:
      - note: BARA
      - companion: bara
        san: "+1D4"
    text: |
      You make cocoa and sit up with Bára in front of the stove, with the lamp turned low, the door bolted and the poker on the floor between you.

      For a long time neither of you says anything. Then, because it is the middle of the night and the kettle is singing and there is nobody else to hear, she tells you about her dream.

      She dreams about Martians, she says, and laughs at herself. Martians out of a book, in tripods made of milk churns, wading across the meadow. But it is not frightening, in the dream. They are looking for somebody. And when they find her, they take off their helmets, and inside the helmets it is her mother, who died in the influenza in 1918, when Bára was ten. Her mother says she is sorry she had to go. Every night. The same thing.

      "I don't want it to stop," Bára says. "That's the worst of it. I know it's wrong, all of it, the child and the thing in the meadow and the milk. But I don't want it to stop."

      She wipes her face with the back of her hand.

      "I'll stand with you," she says. "Tomorrow night. Whatever you do. You sat up with me, so I'll stand with you. That's fair."
    extra:
      - requires: {note: KRATOCHVIL}
        before: true
        text: |
          Kratochvíl has taken his telescope out into the yard, to watch the sky alone.
      - requires: {item: harmonica}
        text: Toward three in the morning you take out the harmonica and play her something slow, from a long way west. She falls asleep against your shoulder before it is finished.
    choices:
      - text: "Watch the window until dawn."
        to: 147

  129:
    title: The Flooded Room
    effects:
      - san: "0/1D3"
    text: |
      You dream that you wake up.

      You are in your own bed at U Snílku, and the room is full of water. It is green and clear and perfectly still, and it comes up to the top of the mattress, so that the blanket floats round you like weed. Carp swim slowly in and out of the open window. Your boots are floating. The lamp on the chair has gone out, but the room is full of a soft green light that comes from nowhere in particular.

      The child is sitting at the foot of the bed, with the water up to its chest. It does not seem to mind.

      "Why did you leave?" it asks.

      It does not sound angry. It sounds as if it really wants to know.
    extra:
      - requires: {investigator: cowboy}
        text: You know what it means. You left at seventeen, on a cart to the railway with a cardboard suitcase. Your mother stood at the gate, and you did not look back, because if you had looked back you would not have gone.
      - requires: {investigator: analyst}
        text: You know what it means. You left your mother's flat in Prague at thirty-one, for Vienna, for a profession she did not believe in and a life she did not approve of. You wrote every week. She never once wrote back.
      - requires: {investigator: gendarme}
        text: You know what it means. You left the boy who blew a tin whistle at the village policeman. You left him behind on purpose, and became the policeman, and never once let him out again.
      - requires: {investigator: singer}
        text: You know what it means. You left at seventeen in the middle of the night, with the travelling players, and did not even leave your mother a note. She died in 1903. You were singing in Vienna. You did not come home for the funeral.
      - requires: {no_item: toy}
        text: In its lap, under the water, it is holding something. It holds it out to you.
    choices:
      - text: "Tell it the truth, if you can."
        requires: [{no_note: KID}, {no_note: DREAMWORK}]
        roll: {skill: [Psychology, Psychoanalysis, POW], success: 130, failure: 131}
      - text: "Tell it the truth. You've read about this."
        requires: [{note: DREAMWORK}, {no_note: KID}]
        roll: {skill: [Psychology, POW], bonus: 1, success: 130, failure: 131}
      - text: "Take what it holds out to you."
        requires: {no_item: toy}
        to: 132
      - text: "Swim for the window, and wake."
        to: 147

  130:
    title: It Knows You
    effects:
      - note: KID
    text: |
      You tell it. You say it aloud, there in the green water, the thing you have never said to anybody: why you left, and what it cost, and what you wanted instead.

      The child listens with its head on one side. When you have finished, it nods slowly, as if you had told it something it already knew but needed to hear.

      "I'm you," it says. "You know that, don't you?" And it tells you its name: the small name, the one your mother used.

      The water drains away through the floorboards with a long, soft sigh. You wake in a dry bed in the grey of morning, with your face wet.
    choices:
      - text: "Get up. It's the third day."
        to: 147

  131:
    title: Cold Water
    effects:
      - san: "1/1D6"
    text: |
      You open your mouth to answer, and the water comes in.

      It is suddenly very cold and very deep, and the bed is gone, and the child is gone, and you are sinking in green dark with your mother's voice calling you from somewhere far above. You cannot answer, because your mouth is full of pond.

      You wake on the floor beside the bed, choking, soaked in sweat, with the sky grey at the window.
    choices:
      - text: "Get up. It's the third day."
        to: 147

  132:
    title: The Toy
    effects:
      - gain: toy
    text: |
      You reach down through the green water and take it.

      It is the toy you lost when you were eight. It is exactly as you remember it, down to the scratches.

      "I kept it for you," says the child. "You can have it back. If you want it."

      You wake in the grey of morning, in a dry bed, holding it.
    extra:
      - requires: {investigator: cowboy}
        text: It is the wooden horse your father carved, with the chipped ear. You lost it in the village pond the summer you were eight.
      - requires: {investigator: analyst}
        text: It is the red-and-yellow spinning top from the fair on Letná. Your mother took it away for spinning it during grace.
      - requires: {investigator: gendarme}
        text: It is the tin whistle you blew at the village policeman, and lost in the chase that followed.
      - requires: {investigator: singer}
        text: It is Anička, the rag doll with the button eyes. You put her down on the dam at the Snílek singing in 1880, and never found her again.
    choices:
      - text: "Get up. It's the third day."
        to: 147

  133:
    title: Dreamless
    effects:
      - lose: veronal
      - san: "+1D3"
    text: |
      You stir a powder into warm milk from the pantry, not from your own cows, and drink it, and lie down.

      The next thing you know, it is morning. You slept like a stone. You dreamed of nothing at all, and it was wonderful, and you have no idea what happened on your farm in the night.
    choices:
      - text: "Get up. It's the third day."
        to: 147

  # ----------------------------------------------------- The alien diversion
  134:
    title: The Stakeout
    text: |
      Kratochvíl sets up the telescope on the back of the cart in the middle of the yard, with the care of a man assembling a bomb. It is a beautiful brass instrument as long as a man, on a tripod with screw feet. He polishes the lens with his handkerchief. He sets out his notebook, three pencils, a stopwatch, a vacuum flask of cocoa and a parcel of sandwiches. Then he sits down on an upturned bucket with his hands between his knees, looks at the sky, and talks.

      He talks about Mars. He talks about the canals that the Italian astronomers saw there, and the Martian cities at the ends of them, and the Martians who are watching us from their red deserts with instruments far finer than his. He talks about cows: their placid natures, their four stomachs, the mystery a cow must present to a superior intelligence. He has seen lights over Moravia, over the Tatras, over the spa, and now, at last, over your farm.

      "They'll come," he says. "I know they'll come. The conditions are perfect."

      Down on the meadow the mist glows. The child sits on the fence with its back to you, watching the sky too.

      It is getting on for midnight.
    extra:
      - requires: {with: bara}
        text: Bára comes out with a shawl round her shoulders and sits on another bucket, and within ten minutes she and Kratochvíl are arguing happily about the heat-ray in *The War of the Worlds*. It is the first time in two days you have heard her laugh.
    choices:
      - text: "Watch the sky."
        to: 135

  135:
    title: Seven Lights
    effects:
      - note: ALIENS
      - san: "0/1D3"
      - companion: all
        san: "1/1D3"
    text: |
      At midnight, exactly, the cows in their ring lift their heads.

      A light comes up over the Black Wood. It rises out of the trees, small and white and perfectly steady, and stops above them. Then a second. Then a third. Then, all at once, four more, until there are seven, hanging over the forest in a line that bends like a bow.

      They do not twinkle. They do not drift. They are not stars, or planets, or the lamps of anything you know. They hang there in perfect silence, and then, all together, they begin to move: slowly, gently, across the sky, until they are hanging over your meadow.

      The mist on the meadow glows up to meet them. Every cow in the ring is looking straight up. The child on the fence is looking straight up.

      Beside you, Kratochvíl makes a small sound. You look round. He is crying. The tears run down his thin face into his muffler, and he does not wipe them away, and he is writing in his notebook as fast as his pencil will go without once looking down at it.

      "Seven," he whispers. "Seven. Oh, my dear friend. Look at them."
    extra:
      - requires: {with: sultan}
        text: By the well, Sultán lifts his nose to the sky, and does not make a sound.
    choices:
      - text: "Swing the telescope down onto the meadow."
        to: 136
      - text: "Run for the wood, where they rose."
        to: 140
      - text: "Signal them with the lantern: three long, three short."
        to: 144

  136:
    title: The Glowing Meadow
    effects:
      - note: HEART
    text: |
      You put your eye to the telescope and swing it down from the lights to the meadow.

      Close up, through brass and glass, the glow in the mist is not even. It has a shape. It is bright along the old waterline under the willows, and brighter in the hollow, and it lies over the whole meadow in exactly the outline of the old pond, every bay and inlet of it, down to the long finger of the east arm running into the wood. It is as if the water were still there, made of light instead.

      At the stone tower in the dam, where the water was deepest, the glow is so bright it hurts.

      Then, as you watch, the cows in the ring around the tower begin, very gently, to rise.
    choices:
      - text: "Look up from the telescope."
        to: 137

  137:
    title: Cows Ascending
    effects:
      - san: "1/1D4"
      - companion: all
        san: "1/1D4"
    text: |
      They go up the way thistledown goes up: slowly, without any fuss, as if they weighed nothing at all.

      First their hooves leave the grass. Then they are a foot off the ground, then a yard, then two: fourteen red-pied cows hanging in the glowing mist with their legs dangling, still asleep, still chewing. Their tails hang straight down. Their ears flop. One of them gives a little contented sigh that you hear all the way up in the yard.

      They turn, very slowly, in the air, the way leaves turn on a still pond.

      Overhead, the seven lights hang perfectly still, and silent, and watch.

      Kratochvíl looks at the cows, and then at the lights, and then at you. He opens his mouth to say something, and shuts it again. Then his eyes roll up, and he sits down very gently in the dust of the yard, and faints.
    choices:
      - text: "Rope Malina, and haul her down."
        requires: [{item: lasso}, {skill: Throw, min: 50}]
        roll: {skill: Throw, success: 138, failure: 139}
      - text: "Call Malina down to you."
        requires: {note: MALINA}
        to: 138
      - text: "Let them float, and watch."
        to: 139
      - text: "Leave them. Run after the lights."
        to: 140

  138:
    title: Down Again
    effects:
      - note: MALINA
    text: |
      Malina comes down to you like a great slow balloon on a string, and touches the grass with all four hooves, and opens her eyes, and sneezes.

      The others follow her. One by one, the way they follow her to the trough every morning, the herd drifts down out of the mist and settles on the meadow, and wakes, and shakes its ears, and begins to graze as if nothing in the world had happened. Overhead, the seven lights wink out, all together, like candles.

      Malina comes and puts her head against your chest, and breathes grass into your face, and will not leave you for the rest of the night.
    choices:
      - text: "Wait for dawn."
        to: 146

  139:
    title: Cows in the Willows
    text: |
      You watch. There is nothing else to do. The cows float in the glowing mist, and turn, and drift, and the lights watch them, and the night goes on.

      Toward dawn the lights go out, all together, like candles, and the cows come down. Most of them come down on the meadow. Three of them come down in the pollard willows along the edge, and stay there, wedged comfortably among the branches, asleep, ten feet off the ground.

      It takes you, Kratochvíl and a ladder until sunrise to get them down.
    choices:
      - text: "Put the ladder away."
        to: 146

  140:
    title: Into the Black Wood
    text: |
      You run down the meadow through the glowing mist, past the stone tower, and in under the trees.

      It is pitch dark under the spruces. Branches whip your face. Roots catch your feet. Above you, through gaps in the canopy, the seven lights slide away eastward over the forest, slowly, as if they want you to follow. You follow them, crashing through the bracken along the boggy bottom of the old pond's east arm, where cowbells hang in the branches and ring wildly as you pass.
    choices:
      - text: "Follow the lights through the trees."
        roll: {skill: [Spot Hidden, Track, Natural World], success: 142, failure: 141}

  141:
    title: Lost in the Wood
    effects:
      - hp: "-1D4"
      - san: "0/1"
    text: |
      The lights go out. All at once, without warning, like candles, and you are alone in the pitch-black wood with no idea which way you came.

      You spend the rest of the night blundering among the spruces, falling into bog-holes, walking into trees. Twice you hear something very large moving nearby, very gently, humming. Once you hear a child laugh.

      You come out at the willows at the bottom of the meadow as the sky goes grey, scratched and soaked and shaking, a hundred yards from where you went in.
    choices:
      - text: "Limp back up to the yard."
        to: 146

  142:
    title: The Visitor
    text: |
      The lights lead you to a clearing in the east arm, a round hollow among the spruces carpeted with moss, still inside the line of willows. They stop over it and hang there, and the clearing fills with a soft white light like the inside of a pearl.

      There is somebody standing in the middle of it.

      It is tall and slim and dressed in a suit of something silver that shines like a new tin plate. On its head is a round glass helmet, exactly like a goldfish bowl, with a little aerial on top. Through the glass you can see its face: pale, smooth, with large dark eyes and no expression at all. It raises one hand to you in greeting, palm out.

      "Good evening," it says. It speaks perfect Czech, with a Prague accent, rather refined, like a schoolmaster's. "Please don't be alarmed. We come in peace."

      It lowers its hand.

      "We have a small request," it says. "We should like a cow. Only one. For study. We would take very great care of her." It inclines its glass head politely. "We would be most grateful. And we think," it adds, "that you might find it was worth your while."
    extra:
      - requires: {note: MARTIANS}
        text: You have seen it before. It is the drawing on page twelve of Kratochvíl's pamphlet, exactly, down to the aerial.
    choices:
      - text: "Give it a cow."
        to: 145
      - text: "Ask it where it comes from."
        to: 143
      - text: "Shake its hand."
        to: 144
      - text: "Back away, slowly, into the trees."
        to: 146

  143:
    title: Where It Comes From
    effects:
      - note: SNILEK
      - san: "0/1D3"
    text: |
      "Mars," it says.

      It says it the way a man reads a word off a card he has been handed: carefully, and without much conviction. Then it seems to listen to something you cannot hear, and tilts its glass head toward the farm, back through the trees.

      "Leopold is dreaming," it says. "Even awake, he dreams of Mars. So: Mars."

      It looks back at you with its large dark eyes, and for a moment something else looks out of them: something very old and very large and very tired, lying under the ground.

      "Your meadow," it says, "is the loudest dreamer for a hundred miles. Everybody can hear it. It has been awake for two years, and it dreams everybody who sleeps on it, and it will not stop by itself. Put it back to bed. Water over it, or a song. Or give it nothing to dream with." It raises its hand again. "Good night."

      The light goes out. When your eyes clear, the clearing is empty, and there is nothing in it but moss and a faint smell of hot tin.
    choices:
      - text: "Find your way back out of the wood."
        to: 146

  144:
    title: Taken Up
    ending: taken
    text: |
      There is a light, very white and very bright, and a sound like a great bell rung underwater, and a feeling, not unpleasant, of being lifted by the scruff like a kitten.

      Then nothing.

      You wake in a turnip field. It is raining. A man in a cap is standing over you with a pitchfork, asking you something in an accent you cannot place. When at last you understand him, he is asking whether you are drunk. When at last you understand where you are, it is a farm outside Olomouc, two hundred kilometres to the east, and it is Thursday.

      Your boots are on the wrong feet. In your coat pocket there is a copy of *Are the Martians Among Us?*, which you did not put there, annotated throughout in tiny, neat handwriting that you do not recognise, in a language you do not know. On page twelve, somebody has corrected the drawing.

      It takes you four days to get home. By then the fair is over, the vet has been and gone, and the bank has written twice.

      Kratochvíl believes you were taken up. He writes it all down and sends it to every newspaper in the Republic, and one of them prints it, on the page with the advertisements for hair restorer.

      Your neighbours believe you were drunk in a ditch for a week.

      The bank believes neither.
    extra:
      - requires: {with: bara}
        text: Bára was alone with the herd on the morning of the vet's visit. She has never told anybody exactly what he saw. She only says that he did not stay long.
      - requires: {broken: bara}
        text: Bára is doing the milking when you get home, with her eyes wide open and fast asleep. She does not seem to have noticed that you were gone.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán is lying by the well when you come home. He looks at you for a long time, and sniffs your boots, and growls.

  145:
    title: A Fair Trade
    ending: bargain
    text: |
      You go back to the meadow and choose one. You choose carefully. She is a young red-pied cow with a white star on her forehead, the quietest of the herd, who has never once in six weeks looked at you as if she wanted anything at all.

      The Visitor takes her halter in its silver glove, as gently as a groom. It leads her into the middle of the meadow, under the seven lights. Then the light comes down round both of them like a column of milk, and they rise together, slowly, the cow with her legs tucked up like a calf, the Visitor with one hand raised in farewell, up and up into the dark, until they are one more light among the seven.

      And the lights go out.

      The meadow sighs. You feel it, all at once, like a held breath let go. The mist sinks into the grass. At the top of the meadow the child, sitting on the fence, looks at you, and smiles, and waves, and is not there any more. Down by the stone tower a tall mossy figure stands for a moment among the sleeping herd, then turns and walks away into the Black Wood, humming, and does not come back.

      At dawn you hear a splash and a great deal of swearing from the well. When you look down it, an old man in his shirtsleeves is climbing the rope, dripping, with a cold pipe in his teeth. Ferdinand Vodička has come up from the bottom of things.

      On Wednesday at seven the district vet comes, and walks round your herd twice, and pats their necks, and looks into their mouths. They are, he writes, the healthiest, calmest and most contented cows he has seen in twenty years of practice. One of them, he notes, is missing. You tell him she went away.
    extra:
      - requires: [{note: CONFESSION}, {no_note: WARNED}]
        text: Hrubý came to the inspection in his Sunday collar, to watch your herd condemned. When the vet had finished, you showed him Pepík's confession. Hrubý left before the vet had finished reading it.
      - requires: {note: WARNED}
        text: |
          Strážmistr Mach came up behind the vet on his bicycle, in his best cap; he had telephoned him about Pepík's statement on Monday. When the inspection was over, he took Hrubý aside and wrote in his notebook for a long time.
      - requires: {note: RAIDED}
        text: Hrubý had sent your bull back on Tuesday afternoon without a word, led by a very subdued Pešek.
      - requires: {note: MALINA}
        text: You did not choose Malina. You never even considered it. She stood beside you the whole time with her head against your shoulder, and when the lights went, she sighed.
      - requires: {with: bara}
        text: Bára cried when the light went up, and would not say why. The next morning she sang over the milking for the first time since August.
      - requires: {broken: bara}
        text: When the light went up, Bára stirred. She blinked at you as if from a very long way off, and asked what day it was. It is weeks before she is quite herself again, but she is on her way.
      - text: |
          Was it Martians? Nobody can say. Kratochvíl can, and does, at length, to anyone who will listen. You only know that you made a trade, and that it was a fair one, and that every September, on a clear night, you go out and look at the sky.

  146:
    title: Morning After
    text: |
      Dawn comes up pink and ordinary over the Black Wood, as if it had never seen a light it could not explain.

      Kratochvíl packs his telescope into its case with hands that will not stop shaking. His notebook is full: forty pages, both sides, in pencil, with diagrams. He looks as if he has not slept for a week. He shakes your hand at the gate for a long time.

      "I shall write to the *Národní listy*," he says. "And the Academy. And the President. They will laugh at me, of course. They always laugh." He straps the telescope to his bicycle. "But we saw it. You and I. Whatever anybody says, for the rest of our lives, we saw it."

      He wobbles away down the valley road, singing.
    choices:
      - text: "Go in. It's the third day."
        to: 147

  # ===================================================================== ACT THREE: TUESDAY
  147:
    title: The Third Day
    effects:
      - unnote: NOON
      - unnote: LATE
      - companion: all
        san: "1/1D4"
    text: |
      Tuesday, the twenty-seventh of September. The last day before St Wenceslas.

      The farm is half dreamed now. You can see it in broad daylight.

      The cows graze an inch above the grass. Not much: just enough that the dew on the meadow lies untouched under their hooves, and their shadows lie a little apart from them, as if they had been cut out and pasted down carelessly. The calf that nobody bought is nearly solid now. The milk this morning is blue, and warm, and tastes of summer afternoons.

      The child is sitting at your kitchen table, eating your bread. It has buttered it on the wrong side, the way you always did. It smiles at you with its mouth full.

      Mist lies in the meadow and does not lift when the sun comes up: waist-deep, glowing faintly, the exact shape of water.

      When you open the cowshed door, it does not open onto the cowshed. For one long moment it opens onto the place where you grew up, in the light of a morning fifty years ago, and you smell it, and hear it, and very nearly step through. Then you blink, and it is the cowshed, and Malina is looking at you over her stall.
    extra:
      - requires: {note: AWAY}
        before: true
        text: You come home in the grey of the morning to a farm that spent the night without you. Every lamp in the house is still burning. The gate stands open. Every cow on the meadow is standing facing the house, as if they had been waiting up.
      - requires: {investigator: cowboy}
        text: Behind the cowshed door, for that long moment, was your mother's yard in the village, with the hens and the plum tree, and the cart that took you to the railway, still waiting at the gate.
      - requires: {investigator: analyst}
        text: Behind the cowshed door, for that long moment, was the hall of your mother's flat in Prague, with the brown wallpaper and the clock that ticked too loudly, and her coat on its hook.
      - requires: {investigator: gendarme}
        text: Behind the cowshed door, for that long moment, was the churchyard wall of your village, with a boy sitting on it with a tin whistle, and a policeman puffing up the lane.
      - requires: {investigator: singer}
        text: Behind the cowshed door, for that long moment, was the Snílek as it was in 1880, full to the brim and blue, with the whole parish choir on the dam in their Sunday white, and a little girl in the front row.
      - requires: {note: VODICKA}
        text: |
          From the bottom of the well, Vodička is singing at the top of his voice.
      - requires: {no_note: VODICKA}
        text: |
          From the well, somebody is singing: an old man's voice, forty feet down, perfectly cheerful.
      - requires: {note: RAIDED}
        text: Baron's stall is still empty.
      - requires: [{note: MACH}, {note: AWAY}]
        text: |
          Baron is back in his stall. Strážmistr Mach brought him down the brook at suppertime yesterday, and asked, with some feeling, where you were.
      - requires: {note: ALIENS}
        text: There are three new rings of flattened grass in the stubble beyond the willows, perfectly round. Kratochvíl's sandwich papers are still blowing about the yard.
      - requires: [{note: KRATOCHVIL}, {no_note: ALIENS}, {no_note: AWAY}]
        text: |
          Kratochvíl watched from your yard all night, alone. Nothing came, he says, though the cows looked up at the sky a great deal. He cycled away at first light, disappointed and very cold.
      - requires: [{note: KRATOCHVIL}, {note: AWAY}]
        text: |
          A bicycle lies in the ditch by your gate, with a telescope strapped to its crossbar. Whoever rode it out here at dusk did not stay to ride it home.
      - requires: {with: bara}
        text: Bára is grey under the eyes, and she has started talking to the cows the way people talk to somebody who is ill. But she is still here, and she is still Bára.
      - requires: {broken: bara}
        text: Bára is milking with her eyes wide open and fast asleep. She milks the calf that nobody bought, and the bucket fills with blue.
      - requires: {broken: sultan}
