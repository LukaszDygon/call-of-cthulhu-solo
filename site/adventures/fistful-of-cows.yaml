    name: Photograph, 1880
    text: The parish choir on the bank of the Snílek pond, the last time they sang to it. The little girl in the front row is you.
  toy:
    name: A child's toy
    text: You lost it when you were eight. You woke up holding it.
  boards:
    name: Outlet boards
    text: Six oak planks, tarred black, cut to fit the grooves of the old outlet tower.
  weir-key:
    name: Weir key
    text: A big iron key with a cardboard tag that says *jez*. It opens the padlock on Hrubý's weir.
  handbell:
    name: St Prokop's handbell
    text: The sacristy bell from Vlčí Brod. Loud enough to wake the dead, or the dreaming.
  veronal:
    name: Veronal powders
    text: Dr. Hájek's sleeping powders. One of them gives a whole night without a single dream.
  carp:
    name: Carp in a bucket
    text: Two pounds of furious Snílek carp, sent up from the bottom of your well.
  red-thread:
    name: Red thread
    text: Babka's red woollen thread. Tied round your wrist, it holds you to the waking side.

journal:
  BARA: Bára told you the old stories. The meadow was a pond, the Snílek, and her grandmother says it must never be let dry.
  MALINA: You got Malina down off the cowshed roof. The lead cow follows you like a dog now.
  VODICKA: Ferdinand Vodička, who owned this farm, is alive at the bottom of your well. He says it is quite dry down there.
  DIARY: Vodička hid the outlet boards in the hayloft, "for whoever is fool enough to fill it again."
  DAM: You walked the old dam. With its boards back in the outlet tower, the pond would hold water again, if the brook ran.
  WEIR: Hrubý's weir upstream takes the whole brook for his millrace. Its gate is chained and padlocked.
  RIGHTS: The water right of 1785 gives the Snílek the brook's water until St Wenceslas. Hrubý is breaking the law.
  INVITED: Father Kolář invited you to see the parish chronicle at St Prokop's.
  MOTHER: Old Mrs. Hrubá despises her son's schemes, and she loves a scene.
  HERDSMAN: Something came out of the Black Wood and petted your cows, and they loved it. You call it the Herdsman.
  SHOT: You fired at the Herdsman, and the herd remembers.
  KID: The child told you its name. It is the name your mother called you.
  SNILEK: In 1641 the drained Snílek dreamed for three nights, and on the fourth morning the dreams stayed. Water put it back to sleep, and a song.
  LULLABY: You know the words of the Snílek lullaby, sung to the pond every autumn until 1880.
  DREAMWORK: You read the Professor's book. A dream is a wish in disguise.
  MARTIANS: You read Kratochvíl's pamphlet, *Are the Martians Among Us?* He thinks they want our cattle.
  KRATOCHVIL: Engineer Kratochvíl is coming out to your farm tonight with his telescope.
  ALIENS: You saw the lights over the Snílek, and so did Kratochvíl. He is writing to the newspapers.
  HEART: The dream runs deepest at the old outlet tower, where the water used to be deepest.
  CONFESSION: Pepík Pešek confessed and signed it. Hrubý sent them for your bull, and his complaint to the vet is a lie.
  RAIDED: The rustlers got away with Baron. Your bull is in Hrubý's barn.
  AWAY: You spent Monday night in Vlčí Brod, not on the farm.
  WARNED: Strážmistr Mach telephoned the vet about Hrubý's false report, and will be at the inspection himself.
  WATER: You opened Hrubý's weir. The brook runs down its old bed through your meadow again, and out through the empty outlet tower.
  FILLING: You set the boards in the outlet tower. The Snílek is filling.
  TIED: You tied Bára to the porch rail with your belt, to keep her out of the mist.
  MACH: Strážmistr Mach promised to fetch Baron home from Hrubý's, and he keeps his promises.
  BABKA: You sat at Babka Kosová's table, and she gave you one gift. One.
  RECKONING: You went up to Hrubý's on Tuesday and had it out with him.
  REHEARSED: You rehearsed the lullaby on Tuesday, out where only the willows could hear.
  LIBRARY: You spent an hour in the town library.
  INN: You called at the Golden Bull.
  POLICE: You called at the gendarmerie station.
  CHURCH: You called at St Prokop's.
  SPA: You walked up the hill to the spa.
  NOON: It is past noon. Half the day is gone, and there is only so much daylight.
  LATE: The sun is low. Linger now, and you will drive home in the dark.

sections:

  # ===================================================================== ACT ONE: SUNDAY
  1:
    title: Sunday Morning
    extra:
      - requires: {investigator: cowboy}
        before: true
        text: For forty-one years you drove other men's cattle across Texas, from the Brazos to the Red River, and slept on the ground with your saddle for a pillow. You always said you would come home one day and buy a ranch of your own. Nobody believed you, least of all you.
      - requires: {investigator: analyst}
        before: true
        text: For thirty years you listened to the dreams of Viennese bankers and their unhappy wives, and wrote them down in a small, neat hand. When you retired, you prescribed yourself fresh air, cows and a complete absence of dreams. You have always taken your own advice. Usually.
      - requires: {investigator: gendarme}
        before: true
        text: For thirty-two years you were a gendarme, first the Emperor's and then the Republic's. You chased poachers, smugglers, horse thieves and, once, a bear. In June they gave you a pension and a handshake. A farm, you thought, would be quiet.
      - requires: {investigator: singer}
        before: true
        text: For thirty-eight years you sang in Prague and Vienna and Milan, and once, with a head cold, for an Emperor. Then the top of your voice began to turn to brass, and you knew it was time. You came home to the valley you ran away from at seventeen, and bought a farm within sight of the steeple where you first sang. Partly to come home. Partly out of spite.
    text: |
      It is the twenty-fifth of September, 1927, a little after six in the morning, and you are drinking coffee on your own porch.

      Your own porch. You say it to yourself sometimes, the way you might press a bruise to see if it still hurts.

      The farm is called U Snílku, which means *At the Dreamer*. The man at the bank could not tell you why, and you have not thought to ask anyone else. It is a stone house with a red roof, a cowshed with a hayloft over it, a yard of packed earth, and a well with a little shingled roof and a windlass that squeals. A ring of old pollard willows runs round behind the house and down both sides of a long green meadow. The meadow slopes away to an earth dam four hundred paces long, with a squat stone tower standing in the middle of it like a chimney that has lost its house. Beyond the meadow, to the east, is the Black Wood: spruce and beech, very dark, going on for ever.

      North, half a mile up a dry brook, the roofs of your neighbour's big new barns catch the first sun. South, six kilometres down the valley road, past a cottage with beehives, lies the market town of Vlčí Brod. Its church bell has just begun to ring.

      You took the keys forty-one days ago. You bought fourteen red-pied cows and a bull called Baron and put them on the meadow, where the grass is the best in the valley. You spent everything you had, and a good deal of what the district savings bank had. You own a loan, a grey horse called Fanda who is older than some of the trees, and a view.

      It is Sunday. The coffee is hot. Mist lies on the meadow like milk in a saucer. For the first time in your life, you have nowhere to be and nobody to answer to.
    choices:
      - text: "Pour another cup, and enjoy it while it lasts."
        to: 2

  2:
    title: Company
    text: |
      You are not, of course, entirely alone.

      You have Bára. She came with the farm, like the well. She is nineteen and sharp as a sickle, and she reads novels about Martians by candlelight and believes every word. Her grandmother, whom the whole valley calls Babka, keeps the bees at the cottage down the road and knows a cure for everything except Bára.

      And you have Sultán, a black sheepdog who came with the farm too. He belonged to Ferdinand Vodička, the man who owned U Snílku before you. Vodička walked out of his own house at Candlemas and was never seen again. *Gone to America*, said the man at the bank, in the voice of a man who did not want to say anything else. Sultán does not believe it. Every evening he lies by the well with his nose to the stones, waiting.

      The only cloud in your sky is Bohuslav Hrubý, the neighbour with the barns. He bid against you at the auction. He bid low, because he was sure nobody else would bid at all, and he has not forgiven you for being there. He keeps two farmhands, the Pešek brothers, who are the size of wardrobes and about as quick.

      You lift your cup to Hrubý's barns, across half a mile of morning. Let him sulk.

      Then Bára comes round the corner of the cowshed at a dead run, with her skirts bunched in her fists.

      "The cows," she says. "Come and look at the cows."
    choices:
      - text: "Go and see what's got into her."
        to: 3

  3:
    title: The Circle
    text: |
      Bára does not stop until she reaches the top of the meadow, and then she stops so hard that you nearly run into her.

      The herd is at the bottom, by the dam. Thirteen of your fourteen cows stand in a ring around the foot of the stone tower, shoulder to shoulder, heads to the middle, as neat as the numbers on a clock. They are asleep. You can see it from here: the heads hang, the ears droop, and under the closed lids their eyes are moving, the way a dog's eyes move when it dreams of rabbits.

      Cows sleep standing up. Everybody knows that. Cows do not sleep standing up in a perfect circle at half past six on a Sunday morning, with the mist curling round their knees.

      Baron the bull stands outside the ring with his head low, watching it the way an old man watches a dance he was not invited to.

      "There's more," says Bára, and points up.

      On the ridge of the cowshed roof, twelve feet above the yard, stands Malina, the fourteenth, the oldest and largest of your cows, chewing. She looks down at you with the calm of a duchess on a balcony. There is a hay ramp at the back of the shed. It is just possible to imagine a cow walking up it. It is not possible to imagine why.

      Sultán has followed you as far as the edge of the grass. He will not set a paw on the meadow. He sits down and whines.

      Then, all together, the sleeping cows lift their heads and low. It is one long call in three notes, rising and falling, and it rolls up the meadow and away over the Black Wood. It sounds like something from a very long way west, where the land is flat and the sun is cruel and men settle their differences in the street at noon.

      Then they let their heads hang again, and go on dreaming.
    choices:
      - text: "Get Malina down off the cowshed roof."
        to: 4
      - text: "Walk down into the ring and wake them."
        to: 7
      - text: "Ask Bára what in God's name is going on."
        to: 10
      - text: "Leave them to it. It's Sunday: drive into Vlčí Brod for Mass."
        to: 12

  4:
    title: Malina on the Roof
    text: |
      You walk round the back of the cowshed. The hay ramp runs up from the yard to the loft door, and from the loft door it is one short, steep step onto the roof. There are hoof-marks in the moss on the shingles. Malina watches you inspect them with polite interest.

      She weighs as much as a small cart. If she comes down the wrong way, she will come down through the roof, and possibly through you.

      "She was up there when I came out to milk," says Bára. "Just standing. Like a weathercock."
    choices:
      - text: "Rope her down, Texas fashion."
        requires: [{item: lasso}, {skill: Throw, min: 50}]
        roll: {skill: Throw, success: 5, failure: 6}
      - text: "Climb up and coax her back down the hay ramp."
        roll: {skill: [Animal Handling, POW], success: 5, failure: 6}
      - text: "Leave her up there. She looks happy."
        to: 11

  5:
    title: Down to Earth
    effects:
      - note: MALINA
    text: |
      It takes a long time and a great deal of talk. At last Malina turns, very carefully, the way a fat man turns in a narrow corridor, and steps onto the hay ramp, and walks down to the yard as though she does it every day.

      Then she comes straight to you, puts her enormous head against your chest, breathes warm grass into your face, and will not leave.

      "She's chosen you," says Bára. "She'll follow you everywhere now. That's what they say about cows that have been somewhere they shouldn't."

      Who says it, she does not explain. Malina follows you to the house, and waits outside the kitchen door.
    choices:
      - text: "Get on with the morning, with a cow at your heels."
        to: 11

  6:
    title: Through the Shingles
    effects:
      - hp: "-1D3"
    text: |
      Malina takes one step toward you, considers the next, and sits down.

      The roof does not survive it. Neither, quite, do you. Shingles, laths, a ton of cow and one retired person go down into the cowshed together in a great cloud of hay dust. When it clears, Malina is standing in her own stall, unhurt, eating breakfast as if she had come in by the door. You are lying in the manger.

      "Well," says Bára, after a while. "She's down."
    choices:
      - text: "Climb out of the manger."
        to: 11

  7:
    title: Inside the Ring
    effects:
      - san: "0/1"
      - companion: bara
        san: "0/1"
    text: |
      You walk down the meadow with Bára at your heels. The grass is wet and very green, and full of small white shells, as if there had been water here once. Near the dam the mist is thicker, and warmer than it ought to be.

      You step between two sleeping cows into the ring, and the morning goes away.

      It is suddenly a summer afternoon, hot and gold, smelling of violets and cut hay. Somewhere a long way off, children are splashing in water. The cows' flanks rise and fall around you like a slow tide. You have the strong, foolish feeling that if you stood here long enough you would remember something important, something you forgot when you were very small.

      Behind you, Bára says your name sharply, as if she has already said it several times.
    choices:
      - text: "Clap your hands and shout them awake."
        roll: {skill: [Animal Handling, Natural World, POW], success: 8, failure: 9}
      - text: "Back out quietly, and leave them to their dreaming."
        to: 11

  8:
    title: What the Cows Dream
    effects:
      - note: HEART
    text: |
      You clap. For one heartbeat, before they wake, you see what they see.

      Green water overhead, with the sun coming down through it in long gold ropes. Fish swimming slowly above you, carp as big as dogs, their bellies pale. A room at the bottom of everything, cool and quiet, where nobody has to do anything at all.

      Then thirteen cows blink, and sneeze, and shake their ears, and wander off up the meadow to graze as if nothing had happened. Not one of them looks back.

      They were standing round the foot of the stone tower. You notice now that the ground there is lower than anywhere else in the meadow. If this were water, it would be deepest here.

      You do not know why you think *if this were water*. But you remember it.
    choices:
      - text: "Walk back up to the house."
        to: 11

  9:
    title: A Hoof to the Shin
    effects:
      - hp: "-1D3"
    text: |
      You clap, and the nearest cow kicks you without waking up. It is a neat, economical kick, from a cow who has kicked better people than you.

      By the time you can stand, the ring has broken up of its own accord. The cows wander off to graze, yawning. Bára helps you limp back up the meadow, and does not laugh until you are nearly at the house.
    choices:
      - text: "Limp back up to the yard."
        to: 11

  10:
    title: What Bára Knows
    effects:
      - note: BARA
      - companion: bara
        san: "+1"
    text: |
      Bára looks at you for a long moment, the way country people look at townsfolk who have finally asked the right question.

      "It wasn't always a meadow," she says. "It was a pond. The Snílek. Hundreds of years old, with carp in it as long as your arm. That tower in the dam is the outlet. The monk, we call it. Mr. Vodička drained it two springs ago, after Hrubý dammed the brook upstream for his new mill and the water stopped coming. He sold the last carp, and pulled the boards out of the monk, and let it all run away down the valley."

      She lowers her voice, though there is nobody to hear but Sultán.

      "My Babka always said you must never let the Snílek go dry. She said it dreams. That's what the name means: the Dreamer. Everybody laughed at her. Then Mr. Vodička started sleeping out on the meadow in the hot nights last summer, and he went strange, and at Candlemas he left a note on the kitchen table. *I have gone to the bottom of things.* That was all. The gendarmes dragged the well and found nothing. Sultán's been lying by it ever since."

      She looks down at the sleeping ring of cows.

      "Babka says once it starts, once things start walking, it's three nights. Three nights, and then whatever's walking stays." She laughs, not very well. "But that's only Babka."

      You notice that she does not look as if she thinks it is only Babka. You notice, too, that she seems a good deal steadier for having said it aloud to somebody who did not laugh.

      "If it comes to that," she says, "I'll stand with you. Somebody has to."
    extra:
      - requires: {investigator: singer}
        text: You remember the pond. You sang beside it once, when you were eight, with the whole parish choir standing on the dam. The photograph is in your trunk. You had forgotten, until this moment, that the old priest made you sing to the water.
    choices:
      - text: "Get on with the morning, such as it is."
        to: 11

  # ----------------------------------------------------- Sunday morning
  11:
    title: Sunday, After Milking
    text: |
      By eight the milking is done. The milk comes out of the cows as sweet as honey and faintly warm, and Bára sniffs every pail before she pours it into the churns, with her lips pressed tight.

      The sun burns the mist off the meadow. The cows graze, looking innocent. Down the valley the bell of Vlčí Brod is ringing for High Mass at half past nine; a cart could still make it, if you went now. Up the dry brook, Hrubý's barns sit fat and red in the sunshine. Sultán has gone back to the well, and lies beside it with his nose to the stones, whining softly.

      You have a whole Sunday. On any other farm in Bohemia, that would be the end of the matter.
    extra:
      - requires: {no_note: MALINA}
        text: Malina is back on the ground, one way or another, and grazing with the rest as if she had never been anywhere else.
      - requires: {note: MALINA}
        text: Malina grazes as close to the house as she can get, and lifts her head whenever you move.
    choices:
      - text: "Look down the well, where Sultán is whining."
        to: 21
      - text: "Walk the meadow down to the old dam."
        to: 29
      - text: "Climb up to the attic and go through Vodička's things."
        to: 32
      - text: "Follow the dry brook upstream, and see why it's dry."
        to: 36
      - text: "Drive into Vlčí Brod for High Mass."
        to: 12

  # ----------------------------------------------------- Mass in town
  12:
    title: The Valley Road
    text: |
      Bára will not come. Somebody has to keep an eye on the cows, she says, in a voice that means somebody has to keep an eye on whatever the cows are doing. Sultán stays with her. You hitch Fanda to the cart yourself, and he takes you down the valley road at the pace of a horse who has seen a great many Sundays.

      The road follows the dry outflow of the old pond south, under the edge of the Black Wood. A mile on, you pass a cottage with beehives in the garden and bunches of herbs hanging under the eaves. Bára's grandmother's. A small bent woman in the doorway raises a hand to you, and does not lower it until you are out of sight.

      Vlčí Brod comes up out of the valley at nine: a square of painted houses round a linden tree and a plague column, street signs in Czech and German, geese, a pump, a church with an onion dome, and an inn called the Golden Bull with a pair of swinging doors that no other inn in Bohemia possesses. A man is sweeping thistledown off the cobbles. It blows back as fast as he sweeps it, rolling across the square like very small tumbleweed.

      The bell of St Prokop's is ringing. The whole town is going in.
    extra:
      - requires: {investigator: singer}
        text: Thirty-eight years. The square is smaller than you remember and the linden is bigger, and every face that turns toward you has known you since you were in a pinafore. You lift your chin the way you lifted it walking on at La Scala, and go in.
    choices:
      - text: "Go in to Mass."
        to: 13

  13:
    title: High Mass at St Prokop
    text: |
      Every head in the church turns when you come in, and stays turned.

      You are the stranger who bought U Snílku, and the cows, it seems, are already famous. You hear the word *cursed* twice before you find a pew, and *Vodička* three times, and once, from a very old man, *America*.

      In the front pew sits Bohuslav Hrubý: fifty, broad as a door, with a moustache waxed into two fierce points and a stiff collar that is slowly strangling him. Beside him sits a tiny old woman in black silk with an ear trumpet. Every time Hrubý turns round to look at you, she pinches his ear without lifting her eyes from her missal, and he turns back. At the back, filling a whole pew between them, sit two enormous young men with identical haircuts. The Pešek brothers, unless the valley has two more men that size.

      Father Kolář preaches on Joseph, who dreamed of sheaves and stars and was sold by his brothers into Egypt. He is a thin, grey, gentle man with a voice like a cello, and three times during the sermon he looks at you thoughtfully, as if you were a sum that would not come out.
    choices:
      - text: "Sit it out, and follow the town out onto the steps."
        to: 14

  14:
    title: The Church Steps
    effects:
      - note: INVITED
    text: |
      On the steps afterward, Hrubý plants himself in your path.

      "So," he says, loudly enough for the square. "The cows are doing well, I hear. Standing about in circles. Climbing on roofs." He smiles. His teeth are very white under the moustache. "I've written to the district veterinary office about them. Foot-and-mouth, I told them. A danger to the whole valley. They'll send a man. And when a vet finds foot-and-mouth, my friend, he doesn't treat it. He shoots it." He touches his hat. "My offer's still open. You know where I live."

      His mother says nothing at all, but her eyes are as bright as a bird's.

      When they have gone, Father Kolář comes down the steps.

      "Forgive him," he says. "He was a spiteful little boy, too. Your farm used to be a pond, you know. The parish chronicle has things to say about the Snílek. Old things. If you came by tomorrow, I could show you." He hesitates. "I would come by tomorrow, if I were you."
    extra:
      - requires: {investigator: singer}
        text: |
          He holds your hand a moment longer than a priest needs to. "Rozálie," he says. "You came home." He was a thin, serious boy of eighteen the last time you saw him. He is a thin, serious man of fifty-six now, and he still looks at you as if you were about to leave.
    choices:
      - text: "Thank the priest, and drive home to your farm."
        to: 18
      - text: "Go after Hrubý, and needle him in front of the whole town."
        to: 15

  15:
    title: Words on the Steps
    text: |
      You catch him up by the linden tree, with half the town still on the church steps behind you.

      He turns. His eyes narrow. So do yours. A fly lands on his moustache, thinks better of it, and leaves. Somewhere a dog stops barking. A tuft of thistledown rolls across the cobbles between you.

      The Pešek brothers move up behind him, one on each side, like a pair of wardrobes being delivered.
    choices:
      - text: "Make a fool of him, loud enough for the whole square."
        roll: {skill: [Fast Talk, Charm, Intimidate], success: 16, failure: 17}
      - text: "Think better of it. Tip your hat, and go home."
        to: 18

  16:
    title: The Town Laughs
    effects:
      - note: MOTHER
    text: |
      You say something about tractors that do not start, and men who bid low at auctions because they think nobody else is coming. You say it well. You say it at exactly the volume of a man selling fish.

      There is a silence on the church steps. Then a laugh, high and cracked, like a hen that has laid an egg. It is old Mrs. Hrubá. She laughs until she has to hold on to the linden tree. Then she hits her son across the back of the head with her missal, twice, and lets the Pešeks lead her away, still wheezing.

      Hrubý goes the colour of a beetroot. "You'll be sorry," he says, and stamps off after his mother.

      The whole square is grinning. So, you suspect, is Father Kolář.
    choices:
      - text: "Drive home in triumph."
        to: 18

  17:
    title: The Horse Trough
    effects:
      - hp: "-1"
    text: |
      You open your mouth. Before anything clever can come out of it, the larger Pešek picks you up by the collar and the belt, carries you three steps, and sits you down in the horse trough.

      The water is very cold. The square is very amused. Hrubý raises his hat to you, and goes off to his lunch.
    choices:
      - text: "Squelch home."
        to: 18

  18:
    title: Home by One
    text: |
      Fanda takes you back up the valley in the noon heat. The bent woman at the bee cottage is in her garden this time. She watches you pass and says nothing, but she crosses herself.

      Bára meets you at the gate. The cows have grazed all morning like ordinary cows, she says. They have not done one strange thing. She says it as if that were the strangest thing of all.
    extra:
      - requires: {no_note: MALINA}
        text: Malina is grazing with the rest, as calm as a cow in a painting. Nobody mentions the roof.
    choices:
      - text: "Unhitch Fanda, and see to the afternoon."
        to: 19

  # ----------------------------------------------------- Sunday afternoon
  19:
    title: Sunday Afternoon
    effects:
      - note: NOON
    text: |
      The afternoon is hot and very still. A wasp bumbles round the kitchen. The cows lie in the shade of the willows, chewing, with their eyes half shut. Down on the meadow the stone tower in the dam throws a short black shadow across the grass.

      Bára sits on the step shelling peas into her apron. She watches the cows, and does not take her eyes off them.

      The day is half gone. There is time for one more thing before evening.
    extra:
      - requires: {no_note: VODICKA}
        text: Sultán lies by the well with his nose to the stones. Every so often he whines, very softly, down the shaft.
    choices:
      - text: "Look down the well, where Sultán is whining."
        requires: {no_note: VODICKA}
        to: 21
      - text: "Walk the meadow down to the old dam."
        requires: {no_note: DAM}
        to: 29
      - text: "Climb up to the attic and go through Vodička's things."
        requires: {no_note: DIARY}
        to: 32
      - text: "Climb into the hayloft and find Vodička's hidden boards."
        requires: [{note: DIARY}, {no_item: boards}]
        to: 35
      - text: "Follow the dry brook upstream, and see why it's dry."
        requires: {no_note: WEIR}
        to: 36
      - text: "Take a Sunday nap in the shade of the cowshed."
        to: 20

  20:
    title: Forty Winks
    effects:
      - san: "0/1"
      - gain: toy
    text: |
      You lie down in the shade of the cowshed with your hat over your face. The bees hum, the cows chew, and you sleep.

      You dream of a brass band. It is the band from the place where you were a child, all of them in their Sunday uniforms, oompahing away at a polka.

      You wake because the polka is still going.

      The band is marching across your yard. Six men in green coats with brass buttons: a big drum, a tuba, two cornets, a man with cymbals and a boy with a triangle. They march out of the cowshed, round the well, past the kitchen door and down onto the meadow, playing as they go. The cows look up. Bára, on the step, drops a whole apronful of peas. At the willows at the foot of the meadow the band begins to go thin, like breath on a cold window, and then it is gone, and only the polka is left, and then not even that.

      There is something in your hand. You must have been holding it in your sleep.

      It is a toy you lost when you were eight years old.
    extra:
      - requires: {investigator: cowboy}
        text: A wooden horse, carved with a penknife, with one ear chipped. Your father made it. You lost it in the village pond the summer you were eight, and cried for a week, and never told him.
      - requires: {investigator: analyst}
        text: A spinning top, red and yellow, from the fair on Letná. Your mother took it away because you spun it during grace, and you never saw it again.
      - requires: {investigator: gendarme}
        text: A tin whistle. You blew it at the village policeman once, for a dare, and lost it in the chase that followed. You have been on the other end of that chase for thirty-two years.
      - requires: {investigator: singer}
        text: A rag doll with button eyes, called Anička. You put her down on the dam at the Snílek singing in 1880, so that you could hold your hymn sheet, and when the singing was over she was gone.
    choices:
      - text: "Get up. The sun is going down."
        to: 44

  # ----------------------------------------------------- The well
  21:
    title: The Well
    effects:
      - san: "0/1"
      - note: VODICKA
    text: |
      Sultán gets up when you come, wags his tail once, and lies down again with his nose to the stones.

      The well is old: a ring of mossy granite, waist-high, with a little shingled roof on two posts and a windlass with a squealing handle. You lean over. Forty feet down, the water is a coin of light with your own small head in it.

      You pick up a pebble and drop it. It falls for a long time.

      "Ow," says the well.

      It is a man's voice: elderly, comfortable, and slightly offended, as if somebody had trodden on his foot in a tram. Sultán leaps up with his whole body wagging and barks down the shaft, once, twice, three times.

      "Sultán!" says the voice, delighted. "Good boy! Good dog! And who's that up there with you?"
    choices:
      - text: "Ask who in the world is down there."
        to: 22

  22:
    title: Ferdinand Vodička
    text: |
      "Vodička," says the well. "Ferdinand Vodička. I used to own this farm. I suppose you own it now. I heard the cart back in August, and the cows. Lovely cows, by the sound of them."

      You ask him, because somebody must, what he is doing at the bottom of a well.

      "Ah," says Vodička. You hear him settle himself, the way an old man settles into an armchair. "Well. That's a long story. The short of it is, I went to the bottom of things. At Candlemas. Did they find my note? I was rather pleased with my note."

      It is quite dry down here, he says, which surprised him. The water is above him, not around him, like a ceiling of green glass. Below it there is a room, cool and quiet, with a floor of fine silt and a light that comes from nowhere in particular. He can see the bottom of the old pond from where he sits. Sometimes carp go over, very slowly, like clouds.

      "I don't want for anything," he says. "Except my pipe. I left my pipe on the kitchen table. And a newspaper. Is it still Masaryk? Is he keeping well? And how's Sultán? Is he eating? He was always a fussy eater."

      Sultán, hearing his name, thumps his tail on the stones.

      You ask him, carefully, whether he would like to come up.

      "Oh, no," says Vodička. "Not yet. It's lovely down here. You've no idea." There is a pause. "You could come down, you know. If you wanted. There's room."
    choices:
      - text: "Lower the bucket, and see what he sends up."
        to: 23
      - text: "Lower him a cigar in the bucket."
        requires: {item: cigars}
        to: 24
      - text: "Keep him talking. Just one more story."
        to: 25
      - text: "Leave him be, and get on with the day."
        requires: {no_note: NOON}
        to: 19
      - text: "Leave him be. The light is going."
        requires: {note: NOON}
        to: 44

  23:
    title: What the Bucket Brings
    effects:
      - gain: carp
    text: |
      You let the bucket down until the rope goes slack. There is a splash, and a pause, and two sharp tugs.

      You wind it up. It is heavy. It comes over the rim streaming water, and in it, thrashing and glaring, is a carp: two pounds of gold and bronze, with a mouth like an old man's purse and an expression of deep personal outrage.

      "Snílek carp," says the voice proudly. "Best in Bohemia. There used to be thousands. That's the last of them, I think. Look after him."
    choices:
      - text: "Carry the carp up to the house."
        requires: {no_note: NOON}
        to: 19
      - text: "Carry the carp up to the house as the light goes."
        requires: {note: NOON}
        to: 44

  24:
    title: A Cigar for Ferda
    effects:
      - note: HEART
      - note: DIARY
    text: |
      You lay a cigar in the bucket with a box of matches and let it down. After a moment there is the scrape of a match, far below, and a long, long sigh.

      Blue smoke rises out of the well and curls up through the shingled roof, as if from a chimney. Sultán sneezes.

      "Oh, that's good," says Vodička, in the voice of a man in a warm bath. "That is very good. Havana? Bless you. Listen, I'll tell you something for that. Two things.

      "One. If you ever want to know where it's strongest, the dreaming, it's at the monk. The outlet tower, in the dam. That's where the water was deepest, and that's where it sits. You can feel it, if you stand there.

      "Two. I didn't burn the boards. I told everyone I burned the boards from the monk, but I didn't. They're in the hayloft, under the old harness, wrapped in sacking. I put them there for whoever was fool enough to fill it again." A puff of smoke. "I don't suppose that's you. But you never know."
    extra:
      - requires: {investigator: analyst}
        text: You decide not to tell him what the Professor would have made of a man who sits at the bottom of a well smoking a cigar. Sometimes a cigar is just a cigar.
    choices:
      - text: "Leave him to his smoke, and get on with the day."
        requires: {no_note: NOON}
        to: 19
      - text: "Leave him to his smoke. The light is going."
        requires: {note: NOON}
        to: 44

  25:
    title: One More Story
    text: |
      He tells you about the winter of 1880, when the Snílek froze so hard that the whole parish skated on it by torchlight. He tells you about his wife, Marie, who could catch a carp with her bare hands. He tells you about the green room, and how quiet it is, and how nobody down there ever has to milk anything.

      You lean on the rim to hear him better. Then further. The mouth of the well seems wider than it was. The air coming up out of it is warm, and smells of hay, and summer, and something you have not smelled since you were a child: bread, perhaps, or your mother's soap.

      You find that you have one knee up on the stones.
    choices:
      - text: "Pull back from the edge."
        roll: {skill: POW, success: 26, failure: 27}
      - text: "Swing your legs over, and climb down to him."
        to: 28

  26:
    title: Back from the Edge
    effects:
      - san: "0/1"
    text: |
      You step back so fast that you sit down hard in the yard.

      You had been about to climb in. You had been going to swing your legs over the rim and drop, as easily as getting into a bath, and you had not even noticed you were doing it.

      "Oh, well," says the well, kindly. "Another time."
    choices:
      - text: "Get away from the well, and get on with the day."
        requires: {no_note: NOON}
        to: 19
      - text: "Get away from the well. The light is going."
        requires: {note: NOON}
        to: 44

  27:
    title: The Windlass
    effects:
      - hp: "-1D6"
    text: |
      You go over.

      There is a moment of perfect, warm, falling peace. Then your hand finds the bucket rope, and the windlass shrieks and spins, and the rope burns through your palms, and you stop with a jerk that nearly pulls your arm from its socket, ten feet down, with your boots kicking at wet stone.

      Bára comes running from the cowshed and throws herself on the handle, yelling. Sultán barks himself hoarse. Between them they wind you up a foot at a time, and you come over the rim into the daylight and lie in the yard and shake.

      "Another time, then," says the well, a little disappointed.
    choices:
      - text: "Get away from the well, and get on with the day."
        requires: {no_note: NOON}
        to: 19
      - text: "Get away from the well. The light is going."
        requires: {note: NOON}
        to: 44

  28:
    title: Down the Well
    ending: dreamer
    text: |
      You climb over the rim and go down the rope hand over hand. The light shrinks to a coin above you, and the water comes up to meet your boots.

      It does not feel like water. It feels like walking through a curtain. Then you are standing on fine soft silt in a cool green room with a ceiling of rippling glass, and there is a little old man in his shirtsleeves sitting on an upturned bucket with a pack of cards.

      "There you are," says Ferdinand Vodička. "I hoped you'd come. Do you play mariáš?"

      You do now. You play it every evening and every morning, and there is no difference between them. Carp go over, very slowly, like clouds. Nobody down here has to milk anything, or pay a bank, or be anybody at all.

      Up in the yard, somebody calls down the well for a long time, and then stops.

      A voice in a well asked you to come down, and you went. You had owned the farm for six weeks. It was, when you think about it, a very short retirement, and a very long one.
    extra:
      - requires: {with: bara}
        text: Bára never draws water from that well again. She carries it up from the brook in buckets until the day she marries, and the first thing she makes her husband do is dig a new one.
      - requires: {broken: bara}
        text: Bára lets a bucket down every evening, and talks into it, and sometimes she laughs at what it says.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán lies by the well for the rest of his life. Every evening, when the light goes, he wags his tail at it.

  # ----------------------------------------------------- The dam
  29:
    title: The Old Dam
    effects:
      - note: DAM
    text: |
      You walk the meadow from top to bottom, with Bára beside you and the cows watching you go.

      Once you know what to look for, you see it everywhere. There is a dark line on the trunks of the willows, higher than your head, where water once stood for a very long time. The grass is full of freshwater mussel shells, white and empty. In a hollow you find a rusted anchor the size of a saucepan, and half an oar.

      The dam is a bank of earth four hundred paces long, grown over with grass and thistles. Its capstone, at the deepest point, is a granite block carved with a fish and a date: *1489*. Beside it stands the stone tower, a square shaft as tall as two men, open at the front, with a deep groove running down each side. You can see where boards once slotted in, one above another, to hold the water back. There are no boards now.

      "The monk," says Bára. "That's what you call the outlet, on a fishpond. Put the boards in, and the water stays. Pull them out, and it all runs away."
    extra:
      - requires: {no_note: WATER}
        text: |
          At the foot of the tower a stone pipe runs through the dam and out the far side, dry as a bone. At the head of the meadow, the bed of the brook comes in out of the north: a dry channel of stones and baked mud, with nothing in it but nettles. Whatever fed this pond for four hundred years, it is not feeding it now.
      - requires: {note: WATER}
        text: |
          The brook you let loose today comes down the old channel at the head of the meadow, runs across the hollow, and pours out through the empty tower and a stone pipe under the dam. Without boards, the tower lets every drop go.
    choices:
      - text: "Climb down inside the outlet tower."
        roll: {skill: [Climb, STR], success: 30, failure: 31}
      - text: "Walk back up to the house."
        requires: {no_note: NOON}
        to: 19
      - text: "Walk back up to the house as the light goes."
        requires: {note: NOON}
        to: 44

  30:
    title: Inside the Monk
    effects:
      - san: "0/1"
      - note: HEART
    text: |
      You lower yourself down the grooves into the shaft. It is cold in here, much colder than the day, and the stones are slick with old green slime.
    extra:
      - requires: {no_note: WATER}
        text: |
          At the bottom, in the fine grey silt, there are footprints. They are small and bare: a child's. They go round and round the bottom of the shaft in a circle, as if somebody very small had been walking there patiently for a long time, waiting for something.
      - requires: {note: WATER}
        text: |
          At the bottom the brook runs through the shaft, cold and fast, and out through the pipe under the dam. Just above it, on a ledge of grey silt, there are footprints. They are small and bare: a child's. They go round and round the ledge, as if somebody very small had been walking there patiently for a long time, waiting for something.
      - text: |
          There is no way into the shaft except the way you came.

          Cold comes up through the soles of your boots in slow pulses, like a heartbeat. This is the deepest place in the meadow. You climb out much faster than you climbed in.
    choices:
      - text: "Walk back up to the house."
        requires: {no_note: NOON}
        to: 19
      - text: "Walk back up to the house as the light goes."
        requires: {note: NOON}
        to: 44

  31:
    title: The Shaft
    effects:
      - hp: "-1D4"
    text: |
      The slime takes your foot, and you go down the shaft the quick way and land on your back at the bottom.
    extra:
      - requires: {no_note: WATER}
        text: |
          Six inches of cold silt break your fall, more or less.
      - requires: {note: WATER}
        text: |
          A foot of cold running water breaks your fall, more or less, and tries hard to carry you out through the pipe under the dam.
      - text: |
          Bára fetches a ladder from the cowshed. She does not laugh while she is fetching it, out of respect. She makes up for it afterwards.
    choices:
      - text: "Walk back up to the house."
        requires: {no_note: NOON}
        to: 19
      - text: "Walk back up to the house as the light goes."
        requires: {note: NOON}
        to: 44

  # ----------------------------------------------------- The attic
  32:
    title: The Attic
    effects:
      - san: "0/1"
      - note: DIARY
    text: |
      The attic is hot and smells of mice and apples. Vodička's things are where the bank's men left them, in a tin trunk under the eaves.

      His Sunday suit, folded. A rack of pipes, all cold. A photograph from 1910 of a broad sheet of water with the dam at the end of it, and a little boat, and in the boat a younger, plumper Vodička and a woman laughing with a carp in her hands. A bundle of letters in purple ink, every one of them signed by Bohuslav Hrubý, with phrases underlined so hard the pen went through the paper: *my legal rights*, *my mill*, *your so-called pond*.

      And a diary, in a cheap black notebook.

      The last year of it is all the meadow. *Slept out again. Hot. Dreamed of the bottom of the pond, a green room, cool, and nothing to do. Woke rested for the first time since Marie died.* And later: *The boards are in the hayloft, under the old harness. I told everyone I burned them. They are there for whoever is fool enough to fill it again.* And last of all, in February, in a shaky hand: *The child came again tonight. It wants me to come down.*

      There is nothing after that.
    choices:
      - text: "Go through Hrubý's letters properly."
        roll: {skill: [Spot Hidden, Library Use, Law], success: 33, failure: 34}
      - text: "Take the diary down to the hayloft, and find those boards."
        to: 35
      - text: "Climb back down."
        requires: {no_note: NOON}
        to: 19
      - text: "Climb back down as the light goes."
        requires: {note: NOON}
        to: 44

  33:
    title: The Water Right
    effects:
      - note: RIGHTS
    text: |
      Most of the letters are bluster. But pinned to the last of them with a rusty pin is a copy of an old deed, made out by a lawyer in Klatovy and stamped with a great many stamps.

      It is dated 1785. In the name of His Imperial Majesty, it grants to the fishpond called Snílek the whole water of the brook *from the Feast of St George until the Feast of St Wenceslas*, every year, for ever. Whoever dams the brook above it in those months is breaking the law.

      St Wenceslas is the twenty-eighth of September. Wednesday. Until Wednesday, every drop of water running down Hrubý's millrace is stolen.

      In the margin somebody, probably Vodička, has written: *Much good it did me.*
    choices:
      - text: "Climb back down, with the deed in your pocket."
        requires: {no_note: NOON}
        to: 19
      - text: "Climb back down with the deed as the light goes."
        requires: {note: NOON}
        to: 44

  34:
    title: Mice
    text: |
      You untie the bundle, and a family of mice comes out of it, offended, and runs up your sleeve.

      By the time you have got them out again, the letters are all over the attic floor in no order at all. You read a few. They say *my legal rights* a great deal, and very little else.
    choices:
      - text: "Give it up, and climb back down."
        requires: {no_note: NOON}
        to: 19
      - text: "Give it up, and climb back down as the light goes."
        requires: {note: NOON}
        to: 44

  35:
    title: The Hayloft
    effects:
      - san: "0/1"
      - gain: boards
    text: |
      The hayloft is dim and hot and full of the sweet smell of this summer's hay. The old harness hangs on a peg at the far end, stiff and cracked. Under it, wrapped in sacking and tied with twine, are six oak boards, each as long as a man is tall, tarred black, their edges cut to a precise bevel. They are heavy. They would fit the grooves of the outlet tower exactly.

      Beside them, in the hay, there is a hollow. It is the size and shape of a curled-up child, and when you put your hand in it, it is still warm.
    choices:
      - text: "Climb down with the boards."
        requires: {no_note: NOON}
        to: 19
      - text: "Climb down with the boards as the light goes."
        requires: {note: NOON}
        to: 44

  # ----------------------------------------------------- The brook and the weir
  36:
    title: The Dry Brook
    effects:
      - note: WEIR
    text: |
      You follow the brook bed north from the head of the meadow. It is a good channel, banked with stones, wide enough for a cart, and there is nothing in it but dust and nettles and the skeleton of a fish.

      At the top of the farm you pass between two old pollard willows, and the air changes. It is hard to say how. It is lighter, and thinner, and ordinary, like stepping out of a church into the street. Sultán, trotting beside you, stops whining for the first time today.

      Half a mile on, the brook begins.

      It does not begin the way brooks usually do. It comes roaring down out of the hills as fat and loud as you could want, and runs straight into a wall of new grey concrete: a weir, with an iron footbridge over it and a sluice gate in the middle, closed. Every drop turns aside into a new-dug millrace and runs off toward Hrubý's barns and the big red mill beside them. Below the weir, the old bed is dry.

      The sluice gate is wound shut and chained, with a padlock the size of a man's fist.

      On the track beside the weir there is a motorcar. It has stalled.
    choices:
      - text: "Go and see who's cranking it."
        to: 37

  37:
    title: The Weir
    text: |
      The motorcar is a big green Laurin & Klement, new and shiny and absolutely silent. Bohuslav Hrubý stands at the front of it in his Sunday collar, cranking the starting handle and swearing. Behind it, the Pešek brothers lean on the boot with the patience of two oxen, waiting to be told to push.

      Hrubý sees you. He straightens up slowly, and lets go of the handle.

      Close to, he is fifty and red in the face, built like a wardrobe's elder brother, with a moustache waxed into two points sharp enough to open letters. He looks at you. You look at him. A fly lands on his moustache, considers its position, and leaves. Somewhere up the valley a cow lows. The millrace chuckles past, full of your water.

      "So," says Hrubý. "The new neighbour. Come to admire my weir?"

      He tells you that he has written to the district veterinary office about your cows. Foot-and-mouth, he has told them. A danger to the whole valley. They will send a man, and when a vet finds foot-and-mouth he does not treat it. He shoots it.

      "Or," says Hrubý, and smiles, "you could sell. I'm a reasonable man. Eight thousand crowns. Cash. Today." He pats his breast pocket. "I've got it on me."

      You paid forty thousand for U Snílku. Hrubý knows it. The Pešeks know it. Even the fly knows it.
    extra:
      - requires: {note: INVITED}
        text: He told you all this once already today, on the church steps. He enjoyed it so much the first time that he cannot resist telling you again.
      - requires: {note: MOTHER}
        text: The tips of his ears are still pink from the church steps. He keeps one hand near the back of his head, as if expecting a missal.
    choices:
      - text: "Take his money, and be done with it."
        to: 38
      - text: "Tell him the brook belongs to the Snílek, and always has."
        roll: {skill: [Law, Persuade, Intimidate], success: 39, failure: 40}
      - text: "Help him crank the motorcar."
        roll: {skill: [Mechanical Repair, STR], success: 41, failure: 42}
      - text: "Turn your back on him, and walk home."
        requires: {no_note: NOON}
        to: 19
      - text: "Turn your back on him, and walk home as the light goes."
        requires: {note: NOON}
        to: 44

  38:
    title: Eight Thousand Crowns
    text: |
      Hrubý's face splits into a grin under the moustache. He takes a fat brown envelope out of his breast pocket and begins to count notes onto the bonnet of the motorcar, licking his thumb for each one. The Pešeks lean in to watch. One thousand. Two thousand. Three.

      It is a great deal less than you paid. It is a great deal more than nothing, which is what a condemned herd is worth.

      Four thousand. Five. A breath of wind comes up the dry brook from your farm, warm, and smelling faintly of violets. Somewhere behind you, very far off, the cows low: one long call in three notes.

      Six. Seven. Eight. Hrubý squares the pile, takes out a fountain pen, and writes a receipt on the back of a seed catalogue. He holds out the pen.
    choices:
      - text: "Sign it."
        to: 43
      - text: "Tear up the receipt, and walk away."
        requires: {no_note: NOON}
        to: 19
      - text: "Tear up the receipt, and walk home as the light goes."
        requires: {note: NOON}
        to: 44

  39:
    title: Bluster
    text: |
      You tell him. You tell him about four hundred years of water, and a pond that was there before his grandfather's grandfather, and what you think of a man who steals a brook.

      It goes home. Hrubý's face turns a remarkable colour, like a plum in a frost. "Lawyers!" he says. "I have lawyers! I have documents! My mill has every right!" He climbs into the motorcar, which does not start, and sits in it with great dignity while the Pešeks push it away down the track.

      He does not look back. But at the bend he turns round to see if you are watching.
    choices:
      - text: "Walk home, whistling."
        requires: {no_note: NOON}
        to: 19
      - text: "Walk home, whistling, as the light goes."
        requires: {note: NOON}
        to: 44

  40:
    title: The Millrace
    effects:
      - hp: "-1D4"
    text: |
      You open your mouth. Hrubý nods to the Pešeks. The larger one takes you by the shoulders and the other one takes your feet, and between them they swing you once, twice, and throw you into the millrace.

      It is deep and very cold and moving fast. By the time you drag yourself out onto the bank fifty yards down, Hrubý is laughing so hard he has to sit on the running board.
    choices:
      - text: "Drip home."
        requires: {no_note: NOON}
        to: 19
      - text: "Drip home as the light goes."
        requires: {note: NOON}
        to: 44

  41:
    title: The Hat
    effects:
      - gain: weir-key
    text: |
      You set the advance lever, check the choke, and give the handle one sharp swing, the way a man once showed you. The engine coughs, and catches, and roars.

      Hrubý stares at you. For a moment you think he is going to say thank you. Then he remembers himself, leaps into the driving seat, crashes the gears and roars away down the track in a cloud of blue smoke, with the Pešeks running behind.

      His hat lies in the road where it fell: a green Tyrolean hat with a chamois brush in the band. Tucked into the band, where a man keeps a thing he must not lose, is a big iron key with a cardboard tag. The tag says *jez*. Weir.

      Nobody comes back for the hat.
    choices:
      - text: "Open the sluice gate now, while he's gone."
        to: 210
      - text: "Pocket the key, and walk home."
        requires: {no_note: NOON}
        to: 19
      - text: "Pocket the key, and walk home as the light goes."
        requires: {note: NOON}
        to: 44

  42:
    title: Backfire
    effects:
      - hp: "-1D2"
    text: |
      You give the handle a swing. The engine fires backward. The handle kicks like a mule and very nearly takes your thumb with it.

      Hrubý watches you hop round the road holding your hand. "Thank you," he says. "That was very helpful." The Pešeks push the motorcar away.
    choices:
      - text: "Nurse your thumb all the way home."
        requires: {no_note: NOON}
        to: 19
      - text: "Nurse your thumb all the way home as the light goes."
        requires: {note: NOON}
        to: 44

  43:
    title: Sold, Sunday
    ending: escape
    text: |
      You sign. The Pešeks witness it with two large X's. Hrubý folds the receipt into his pocketbook and pats it, the way a man pats a dog.

      By Tuesday you are on the train to Prague with one suitcase and a great deal less money than you came with. The cows go with the farm, and so does Baron, and so does the well. Bára goes back to her grandmother's. Sultán stays. Nobody can make him leave the well.

      In October you read in the newspaper that a landowner near Vlčí Brod has been found wandering the valley road in his nightshirt, telling anyone who will listen that his new cows have been talking about him. You do not read any further.
    extra:
      - requires: {investigator: cowboy}
        text: You sold cattle to crooks in Abilene and Dodge City, back when there were no fences. You never once sold this cheap.
      - text: |
          You came to the valley to rest. You found the place, and the cows, and a whole Sunday with nothing in it. You owned a ranch for forty-one days.

          Hrubý owned it for less.

  # ----------------------------------------------------- Dusk
  44:
    title: The Child at the Gate
    effects:
      - unnote: NOON
      - san: "0/1"
      - companion: all
        san: "0/1D2"
    text: |
      The sun goes down behind the western hills at ten to seven, and the shadows of the willows stretch out across the meadow like a tide.

      You do the evening milking with Bára. The milk is still sweet. The cows are quiet, too quiet, all standing with their heads turned the same way, toward the gate. Sultán gets up from beside the well. The hair on his back lifts, and a growl comes out of him that you have never heard before.

      There is a child at the gate.

      It is about eight years old. It stands with both hands on the top bar, looking in, as patient as if it has been there for an hour. Its clothes are the clothes of a child from long ago, from your own childhood, and they are exactly right, down to the patch on the knee.

      "Good evening," it says. It has a clear, polite little voice. "Can I come in? Mama says I live here now."

      It calls you by a name that nobody has called you in fifty years. It is the name your mother used when she wanted you in for supper.

      Bára crosses herself. The cows low, softly, all together. The child waits.
    extra:
      - requires: {investigator: cowboy}
        text: It is a boy, barefoot, in a village smock, brown as a nut, with his hair cut round a pudding basin. You have seen that face in exactly one photograph, taken at a fair the summer before your father died.
      - requires: {investigator: analyst}
        text: It is a girl in a starched sailor dress with a ribbon in her hair, the way children were dressed in Prague in the seventies. She stands very straight, as you were taught to. You have seen that face in your mother's locket.
      - requires: {investigator: gendarme}
        text: It is a boy in knickerbockers and a cap too big for him, with a scab on his chin. You know that scab. You got it falling off the churchyard wall when you were eight, running from the village policeman.
      - requires: {investigator: singer}
        text: It is a girl in a white choir dress with ribbons, the kind the little ones wore at the Snílek singing in 1880. You know exactly what is in the photograph in your trunk, and who stands in the front row of it.
    choices:
      - text: "Let it in, and give it some supper."
        to: 45
      - text: "Tell it, kindly, to go home."
        to: 46

  45:
    title: Supper for Two
    effects:
      - note: KID
      - san: "1/1D4"
      - companion: bara
        san: "0/1D2"
    text: |
      It sits at your kitchen table with its legs swinging, and eats bread and dripping exactly the way you ate it at that age: crusts first, the soft middle saved for last and folded over like a letter. Bára watches it from the far side of the stove with the poker in her hand.

      It talks while it eats. It talks about things only you could know: the name of your first dog, the place you hid when you were in trouble, the thing you broke and never owned up to. It tells you its name, which is your name. It does not seem to find this strange.

      "You always wanted to come home," it says with its mouth full. "Didn't you? That's why we're here."

      When it has finished it says thank you, nicely, and slides down off the chair and goes out into the dark toward the meadow. You hear it singing to itself as it goes, a song you had forgotten you knew.
    choices:
      - text: "Bolt the door behind it."
        to: 47

  46:
    title: Go Home
    effects:
      - san: "0/1"
    text: |
      "Go home," you tell it, as kindly as you can. "Go home to your mother."

      The child looks at you for a long moment. Then it smiles, as if you have said something sweet and silly, and lets go of the gate.

      It does not go down the road. It walks round the outside of the fence and down onto the meadow, and stands there in the dusk among the cows, a small pale shape with its hands folded in front of it, facing the house.

      It is still there when you light the lamps. It is still there when you go to bolt the door.
    choices:
      - text: "Bolt the door."
        to: 47

  # ----------------------------------------------------- Night 1
  47:
    title: Sunday Night
    text: |
      Night comes down over U Snílku without a moon. The stars are very thick. The Black Wood is a wall of darker dark beyond the meadow, and somewhere inside it an owl is asking the same question over and over.

      Bára will not sleep alone in her room off the kitchen. She drags her mattress in front of the stove and sits on it in her shawl with a novel she is not reading. Sultán has gone back to the well. He lies beside it in the dark, and every so often he lifts his head and listens down the shaft.

      Down on the meadow, the cows are standing in their ring again.

      You could sit up. You could watch. Or you could do the sensible thing, and go to bed, and see what morning brings.
    extra:
      - requires: {note: KID}
        text: The child is somewhere out there in the dark, singing. You cannot see it. You can hear it.
      - requires: {no_note: KID}
        text: The child is still standing on the meadow among the cows. Every time you look out of the window, it is looking back.
      - requires: {item: toy}
        text: The toy lies on the kitchen table where you put it. Bára will not touch it.
      - requires: {note: WATER}
        text: |
          Down in the dark, the brook you let loose today runs through the meadow, talking to itself. The mist steams where it touches it.
    choices:
      - text: "Keep watch over the herd from the meadow."
        to: 48
      - text: "Sit up by the well with a lantern."
        to: 55
      - text: "Go to bed, and let yourself dream."
        to: 58

  48:
    title: The Night Pasture
    effects:
      - san: "1/1D4"
      - companion: all
        san: "0/1D3"
    text: |
      You take a blanket and sit with your back to a willow at the edge of the meadow. Bára comes with you, because she will not stay in the house alone. She sits so close that her shoulder touches yours.

      For a long time nothing happens. The cows stand in their ring around the stone tower, asleep. Mist comes up off the grass and lies in the hollow, knee-deep and faintly luminous, like milk in moonlight, though there is no moon.

      A little after midnight, every cow in the ring lifts its head at once and turns to look at the Black Wood.

      Something steps out of the trees.

      It is tall, a head taller than any man, and thin, and it walks slowly, the way a farmer walks among stock he does not want to startle. It is covered in moss, or dressed in it: a long coat of moss, green-black, trailing to the ground. Its hands are long, with too many knuckles. Its face, when it comes close enough to see, is not quite a face. It is what a calf might draw, if a calf could draw a man: two large gentle eyes, a long nose, a mild mouth, and nothing else that matters.

      It walks into the ring. The cows lean toward it, every one, the way cats lean into a hand. It strokes their necks. It scratches between their horns. It hums to them, a low, tuneless, contented sound, and they close their eyes.

      Above the Black Wood, behind it, lights rise into the sky. Three of them, then seven, small and steady and white, in a line that bends like a bow. They hang there for the space of ten heartbeats. Then they go out, all together, like candles.

      Bára's hand has found your sleeve and is holding on.
    extra:
      - requires: {note: MALINA}
        text: Only Malina does not go to it. She has walked up out of the ring and stands beside you with her great warm side against your shoulder, watching it, chewing, and staying exactly where she is.
    choices:
      - text: "Stay very still, and watch."
        to: 49
      - text: "Walk out and meet it."
        to: 50
      - text: "Fire a shot over its head."
        requires: {any: [{item: revolver}, {item: derringer}]}
        to: 53

  49:
    title: The Herdsman
    effects:
      - note: HERDSMAN
    text: |
      You stay where you are. So does Bára. Neither of you breathes very much.

      It goes from cow to cow, taking its time. It lays a long hand on each broad forehead and hums, and one by one the cows fold their legs and lie down in the mist, contented, the way cows lie down in a June meadow. It is the gentlest thing you have ever seen, and it makes the hair stand up on your arms.

      When the last cow is down, it straightens and looks up the meadow, directly at you.

      It nods. It is exactly the nod one farmer gives another across a fence: *evening*. Then it walks back down to the stone tower, humming, and stands there by the sleeping herd, keeping watch over them as if that were the most natural thing in the world.

      You find you have started to think of it as *him*. The Herdsman.

      "They like him better than us," Bára whispers. She sounds as if she might cry.
    choices:
      - text: "Keep watching."
        to: 54

  50:
    title: Close Enough to Touch
    text: |
      You get up. Bára hisses at you to sit down. You walk down the meadow anyway, through the luminous mist, until you are standing inside the ring of cows with the tall thing in front of you.

      Close to, it smells of moss and warm milk and turned earth. Its calf's eyes are large and brown and wet, and very kind. It looks at you the way it looks at the cows: with simple, enormous affection, as if you were a good animal who had never done anything wrong in your whole life.

      It lifts one long hand toward your head. It means to pet you. You know, with absolute certainty, that if it does you will close your eyes, and lean into it, and everything will be all right for ever.
    choices:
      - text: "Let it."
        to: 52
      - text: "Step back."
        to: 51

  51:
    title: A Step Back
    effects:
      - note: HERDSMAN
      - san: "1/1D4"
    text: |
      You step back. It costs you more than you would have believed.

      The long hand stops in the air. The calf's face looks hurt, the way a dog looks hurt when you will not throw the stick. Then it lowers its hand and turns back to the cows, and strokes them instead, one by one, until they all lie down in the mist around the stone tower.

      When it has finished, it stands by the tower and keeps watch over them. You go back up the meadow on shaking legs. Behind you, it begins to hum.

      You find you have started to think of it as *him*. The Herdsman.
    choices:
      - text: "Sit down by Bára, and keep watching."
        to: 54

  52:
    title: Contented
    ending: bovine
    text: |
      You let it.

      The long hand settles on your head, warm and dry and smelling of moss. It scratches gently, just behind your ears. You close your eyes. The tall thing hums, and the mist rises round your knees, and you lean into its hand the way the cows do, and something in you that has been clenched for fifty years lets go.

      In the morning Bára counts the herd, and counts it again, and sits down on the milking stool and stares.

      There are fifteen. The fifteenth is a fine red-pied cow with a white blaze and a calm, intelligent eye, and it is standing exactly where you stood last night. It lets Bára milk it. It gives the sweetest milk in the valley. When Malina sees it, she moves over at the trough to make room.

      The grass is delicious. You had no idea. Nobody tells you, when you are a person, how good grass is in the early morning with the dew still on it, or how pleasant it is to lie in the shade of a willow and think about absolutely nothing at all. You have nowhere to be and nobody to answer to.

      You came to the country to rest. Nobody in Bohemia has ever rested so well.
    extra:
      - requires: {with: bara}
        text: Bára never sells you. When the bank takes the farm, she leads you down the valley road on a halter to her grandmother's, and you graze in Babka's orchard among the beehives for the rest of your long, placid life. She talks to you in the evenings. You listen. You are a much better listener than you used to be.
      - requires: {with: sultan}
        text: Sultán comes and lies beside you in the grass. He seems to understand.

  53:
    title: The Shot
    effects:
      - note: SHOT
      - hp: "-1D6"
      - san: "-1"
      - companion: all
        san: "0/1D2"
    text: |
      The shot is enormous in the quiet. It cracks across the meadow and off the face of the Black Wood, and comes back twice.

      The tall thing stops. It turns its head and looks at you. So does every cow on the meadow. Every face turns toward you at once, and on every face, cow and not-cow, there is the same expression: enormous, wounded sadness, as if you had kicked a dog on Christmas Day.

      Then the herd bolts. The whole herd comes up the meadow at a gallop, straight at you, and you go down under a forest of legs and a thunder of hooves, and something steps on your hand.

      When you can see again, the tall thing is walking among them in the mist at the top of the meadow, stroking their necks, soothing them, until one by one they are calm. It does not look at you again. It leads them back down to the stone tower and stands there with them in the dark, keeping watch, with its back to you.

      Bára has her face in her hands.
    choices:
      - text: "Get up, and keep watching."
        to: 54

  54:
    title: Rustlers
    text: |
      At about one o'clock, a lantern comes over the north fence.

      It is shaded and held low, and it bobs across the top of the farm toward the cowshed, where Baron sleeps. Behind it come two shapes so big they blot out the stars: the Pešek brothers, Hrubý's men, with a coil of rope and a halter. They are moving as quietly as two very large men can move, which is not very quietly at all.

      They go into the cowshed. After a while they come out again with the halter on Baron. Baron, who has never had an idea in his life, comes as amiably as a dog. They lead him along the top of the meadow toward the fence, whispering.

      Then the one with the lantern turns his head, and sees what is standing by the stone tower at the bottom of the meadow.

      He stops dead. So does his brother. The lantern light shakes. Down by the tower, the tall mossy shape lifts its head and looks back at them, and slowly raises one long arm, the way you might raise a hand to a neighbour.

      Neither Pešek moves. They are thirty feet from you, with their backs to you, and every scrap of their attention is on the bottom of the meadow.
    extra:
      - requires: {with: bara}
        text: |
          "Franta and Pepík," Bára breathes in your ear. "Hrubý's sent them for the bull."
    choices:
      - text: "Cuff the slower one while he's staring."
        requires: {item: handcuffs}
        to: 64
      - text: "Rope the big one."
        requires: [{item: lasso}, {skill: Throw, min: 50}]
        roll: {skill: Throw, success: 65, failure: 67}
      - text: "Jump them."
        roll: {skill: [Fighting (Brawl), STR], success: 208, failure: 68}
      - text: "Fire a shot into the air."
        requires: {any: [{item: revolver}, {item: derringer}]}
        to: 69
      - text: "Keep still, and let the meadow deal with them."
        to: 70

  55:
    title: The Well at Night
    effects:
      - companion: sultan
        san: "1/1D4"
    text: |
      You sit on an upturned bucket beside the well with a lantern at your feet and a blanket round your shoulders. Sultán lies against your boots. The lantern makes a small gold room in the dark, with the windlass and the shingled roof and the black mouth of the shaft at its centre.

      After a while, the well clears its throat.
    extra:
      - requires: {no_note: VODICKA}
        text: |
          "You've got a lantern," says a voice from forty feet down. "How nice. I can see it from here, like a star." It is an old man's voice, comfortable and pleased. It belongs, it tells you very politely, to Ferdinand Vodička, who owned this farm before you and has been at the bottom of the well since Candlemas. "Settle down, settle down. Since you're up, I'll tell you a story."

          Sultán lies with his chin on the rim of the well, his ears pricked, trembling all over. It is his master's voice. He has been waiting since Candlemas to hear it.
      - requires: {note: VODICKA}
        text: |
          "You again," says Vodička from forty feet down. "And a lantern! I can see it from here, like a star. Settle down. Since you're up, I'll tell you a story." Sultán lies with his chin on the rim, his tail thumping softly on the stones.
    choices:
      - text: "Settle down, and listen."
        to: 56

  56:
    title: The Sleeping Meadow
    effects:
      - note: SNILEK
      - san: "0/1D3"
    text: |
      He tells you about the Snílek.

      It was dug in 1489, he says, in a wet hollow the herdsmen called the Sleeping Meadow, because cattle that grazed there slept too long, and men who slept there dreamed things that came true. In 1641 Swedish soldiers broke the dam, and the pond ran away, and for three nights *the dreams of the sleepers walked abroad*. That is how the parish chronicle puts it. On the fourth morning the dreams stayed. The miller woke up believing he was a heron, and lived the rest of his life on one leg.

      "Then old Father Matyáš had the whole parish carry earth for a month to mend the dam," says Vodička. "And when it was full again, he stood on the bank and sang it to sleep. There's a lullaby. The keepers sang it every autumn after that, until the old priest died. Water, and a song. That's how you put the Snílek to bed."

      He sighs. "And I let it out. Well. You live and learn."

      At some point you notice that the child is sitting on the rim of the well, swinging its legs over forty feet of dark, listening too. You did not see it come. It smiles at you and puts a finger to its lips.
    choices:
      - text: "Lower him a cigar for his trouble."
        requires: {item: cigars}
        effects:
          - note: VODICKA
        to: 57
      - text: "Sit with him until he nods off and your lantern burns low."
        effects:
          - note: VODICKA
        to: 62

  57:
    title: A Cigar in the Dark
    effects:
      - note: HEART
    text: |
      You send a cigar and a box of matches down in the bucket. A match flares far below, and blue smoke comes curling up the shaft past the lantern.

      "Oh, bless you," says Vodička. "Bless you. Listen. If you mean to do anything about it, do it at the monk. The outlet tower in the dam. That's where the water was deepest, and that's where the dreaming sits. Stand there, and you'll feel it."

      The child on the rim sniffs the smoke and wrinkles its nose. Toward one o'clock the smoke stops, and Vodička begins to snore, and your lantern gutters and goes out. You sit on in the dark by the well.
    choices:
      - text: "Wait out the night."
        to: 62

  58:
    title: Night Train
    effects:
      - san: "0/1D3"
    extra:
      - requires: {investigator: cowboy}
        before: true
        text: First you dream that you are driving cattle through the square of the village where you were born. The cattle are your mother's kitchen chairs. They low. The trail boss has your father's face, and he keeps telling you that you are late. Then that dream lets go of you, and another takes hold.
      - requires: {investigator: analyst}
        before: true
        text: |
          First you dream that you are lying on your own couch in Vienna, the one with the Persian rug thrown over it, and the Professor himself is sitting behind you in a cloud of cigar smoke. "And the cow?" he says. "Tell me about the cow." You cannot think of a single thing to say. Then that dream lets go of you, and another takes hold.
      - requires: {investigator: gendarme}
        before: true
        text: First you dream that you are arresting yourself. You are very polite about it, and so are you. But the handcuffs are made of sausages, and every time you put them on, you eat them. Then that dream lets go of you, and another takes hold.
      - requires: {investigator: singer}
        before: true
        text: First you dream that you are on the stage of the National Theatre in Prague, in your nightgown. The house is full. Every seat is taken by a cow, and they are all watching you, chewing. In the royal box sits your mother in her Sunday shawl. She is not clapping. Then that dream lets go of you, and another takes hold.
    text: |
      You dream that you are on a train.

      It is a long train, very old-fashioned, with brass lamps and plush seats, and it is going into a tunnel. It goes into the tunnel for a very long time. A Viennese doctor would have a good deal to say about that. You are aware of this even in the dream, and slightly embarrassed.

      Your teeth are loose. You keep checking them with your tongue. One of them comes out in your hand, and you put it in your pocket, because you might need it later.

      The train comes out of the tunnel and stops, and you get off at the house where you grew up.

      It is exactly as it was, down to the crack in the step. But it is at the bottom of a pond. The light is green and wavering. Carp swim slowly past the windows. Weed grows from the gutters and sways. You can breathe perfectly well, and you are not surprised by this, because in dreams you never are.

      Your mother is calling you in for supper. You can hear her through the open window, clear as a bell, the way you have not heard her in fifty years. Your name, your real name, the one only she ever used.

      There is a child standing at the door. It holds out its hand to you.

      Behind the child, at the end of the hall, there is another door. It is the one your mother told you never to open. You have always wanted to know what was behind it.
    choices:
      - text: "Open the door your mother told you never to open."
        requires: {no_item: toy}
        to: 59
      - text: "Take the child's hand."
        requires: {no_note: KID}
        to: 60
      - text: "Wake yourself up, now."
        roll: {skill: POW, success: 61, failure: 63}

  59:
    title: The Door
    effects:
      - gain: toy
    text: |
      You walk past the child, down the green hall, past the carp at the windows, and open the forbidden door.

      Behind it is a cupboard. That is all. A little cupboard under the stairs, with a broom in it, and a smell of mothballs and old boots. On the top shelf, where you could never reach it, lies the toy you lost when you were eight.

      You reach up. You can reach it now.

      You wake in your own bed at U Snílku with your heart hammering. You are holding the toy in both hands.
    extra:
      - requires: {investigator: cowboy}
        text: It is a wooden horse, carved with a penknife, one ear chipped. Your father made it. You lost it in the village pond the summer you were eight.
      - requires: {investigator: analyst}
        text: It is a spinning top, red and yellow, from the fair on Letná. Your mother confiscated it for spinning it during grace.
      - requires: {investigator: gendarme}
        text: It is a tin whistle. You blew it at the village policeman once, for a dare, and lost it in the chase that followed.
      - requires: {investigator: singer}
        text: It is a rag doll with button eyes, called Anička. You put her down on the dam at the Snílek singing in 1880, and when the singing was over she was gone.
    choices:
      - text: "Lie still, and fall asleep again."
        to: 63

  60:
    title: Its Name
    effects:
      - note: KID
      - san: "1/1D4"
    text: |
      You take the child's hand. It is small and cool and slightly damp, like a hand that has been trailing in water.

      "I know you," it says, delighted, and tells you its name. It is your name. Not the one on your papers: the other one, the small one, the one your mother called up the stairs. Nobody has said it aloud in fifty years.

      "We can stay here," it says. "Can't we? Now that we're home."

      Your mother calls again, closer. The water in the hall is rising. The child holds on to your hand and will not let go, and you do not want it to.
    choices:
      - text: "Let the dream take you where it wants."
        to: 63

  61:
    title: Awake
    text: |
      You tear yourself out of the dream the way you would tear yourself out of a bramble bush, and lie gasping in your own bed at U Snílku, with the green light still fading behind your eyes.

      Something woke you. Not the dream. Something outside.

      You pull on your boots and go out into the dark yard in your shirt, quietly, to see what it was.
    choices:
      - text: "Stand in the shadows, and watch."
        to: 62

  62:
    title: Rustlers in the Yard
    text: |
      At about one o'clock, the cowshed door creaks.

      You keep very still in the shadows, and nobody sees you. The door opens very slowly, and a shaded lantern goes in, and after it two shapes so big they blot out the stars. After a while they come out again, leading Baron on a halter. Baron, who has never had an idea in his life, comes as amiably as a dog. The lantern swings across two faces under identical haircuts. There is only one pair of wardrobes that size in the valley: the Pešek brothers, Hrubý's men.

      They start across the yard toward the gate, whispering.

      Then a small figure in a white nightshirt steps out in front of them, into the lantern light. It is the child. It stands in their path with its hands folded, looks up at them, and asks, very politely, where they are taking its bull.

      Both men stop dead. The lantern begins to shake. The child waits for an answer. Neither of them has one.

      They are ten feet from you, with their backs to you, and every scrap of their attention is on the child.
    choices:
      - text: "Cuff the slower one while he's staring."
        requires: {item: handcuffs}
        to: 64
      - text: "Rope the big one."
        requires: [{item: lasso}, {skill: Throw, min: 50}]
        roll: {skill: Throw, success: 65, failure: 67}
      - text: "Jump them."
        roll: {skill: [Fighting (Brawl), STR], success: 208, failure: 68}
      - text: "Fire a shot into the air."
        requires: {any: [{item: revolver}, {item: derringer}]}
        to: 69
      - text: "Let the child deal with them."
        to: 71

  63:
    title: Too Late
    effects:
      - note: RAIDED
      - companion: all
        san: "1/1D3"
    text: |
      The next thing you know, Sultán is barking himself hoarse in the yard, and Bára is hammering on your door with both fists.

      By the time you are out in your nightshirt with a lamp, it is all over. The gate is open. The cowshed door is open. Baron's stall is empty. In the soft earth of the yard there are two pairs of enormous boots, spaced like running men, and the hoofprints of your bull going after them at a gallop. All three sets of tracks go out of the gate and up the dry brook toward Hrubý's barns.

      "The Pešeks," says Bára. She is white to the lips. "Hrubý's men. I saw them from the window. They had Baron on a rope, and then they saw something in the yard, and they screamed, and they ran, and Baron ran after them. He thought it was a game." She swallows. "I couldn't see what they saw. It was standing right where you're standing now."

      You do not move your feet for some time.
    choices:
      - text: "Go back to bed. There's nothing more to be done tonight."
        to: 72

  64:
    title: Bracelets
    text: |
      Thirty-two years of habit carry you across the grass before you have decided anything. The cuffs come out of your pocket. There is a click, and another click, and Pepík Pešek is handcuffed by one wrist to the nearest rail before he has finished turning round.

      Franta sees it, drops the lantern and runs. He goes over the fence like a startled bullock and away into the dark toward Hrubý's, and does not stop to look back.
    choices:
      - text: "Have a word with Pepík."
        to: 66

  65:
    title: Texas Fashion
    text: |
      The loop goes out flat and lazy in the dark, the way it went out over a thousand steers, and drops over Pepík Pešek's shoulders. You set your heels and pull. He goes over backward like a felled tree.

      Franta sees it, drops the lantern and runs. He goes over the fence like a startled bullock and away into the dark toward Hrubý's, and does not stop to look back.
    choices:
      - text: "Have a word with Pepík."
        to: 66

  66:
    title: Pepík Talks
    effects:
      - note: CONFESSION
    text: |
      Pepík Pešek sits on the ground where you have put him, with his huge hands in his lap, and talks. His brother is long gone.

      He talks very fast, in a high voice that does not go with the rest of him. He talks about what he saw tonight, which he cannot describe, and keeps trying to. He talks about his mother. And then, when you ask him the right questions, he talks about Mr. Hrubý.

      Mr. Hrubý sent them for the bull. Mr. Hrubý wants the bull because the bull beat his own bull at the spring show in Klatovy, before you ever bought it, and Mr. Hrubý has never forgiven it. And the letter to the vet, about the foot-and-mouth: there is no foot-and-mouth. Mr. Hrubý made it up. He wants the vet to come and shoot your herd, so that you cannot pay the bank, so that the bank will sell him your farm cheap.

      You write it all down in your notebook by the light of the dropped lantern, and read it back to him, and he signs it with a large, trembling X.

      At first light you let him go. He runs all the way home. Baron, who has enjoyed the whole night enormously, goes back into the cowshed and lies down.
    choices:
      - text: "Go in, and sleep what's left of the night."
        to: 72

  67:
    title: Rope Burn
    text: |
      The loop goes out in the dark, and settles, and slides off Pepík's shoulders like water off a duck.

      Both brothers jump a foot in the air. They drop the halter and the lantern and run. They go over the fence like a pair of startled bullocks and away into the dark toward Hrubý's.

      Baron watches them go. Then he wanders back into the cowshed and lies down.
    choices:
      - text: "Go in, and sleep what's left of the night."
        to: 72

  68:
    title: Two Against One
    effects:
      - hp: "-1D6"
    text: |
      You jump the nearer one. It is like jumping a wardrobe. He shrugs, and you come off, and his brother sits on you.

      It is a short fight. You lose it. They leave you in the dew with your ears ringing, and run off over the fence toward Hrubý's, so frightened of what they saw that they forget the bull entirely.

      Baron, abandoned, wanders back into the cowshed and lies down.
    choices:
      - text: "Limp in, and sleep what's left of the night."
        to: 72

  69:
    title: One Shot
    text: |
      The shot cracks across the farm and comes back off the Black Wood.

      You have never seen two men move so fast. The halter drops, the lantern drops, and the Pešek brothers go over the fence in one bound each, like stags, and away up the dry brook toward Hrubý's, calling on God and their mother.

      Baron looks after them, puzzled. Then he wanders back into the cowshed and lies down.
    choices:
      - text: "Go in, and sleep what's left of the night."
        to: 72

  70:
    title: The Meadow Deals with Them
    effects:
      - note: RAIDED
      - san: "0/1"
      - companion: all
        san: "0/1D3"
    text: |
      You keep still.

      The tall shape at the bottom of the meadow lowers its arm and begins to walk up the slope toward the two men. It does not hurry. It walks the way it walks among the cows, gently, humming. The Pešeks watch it come. They are too frightened to move.

      It stops in front of Franta, who is the larger, and looks down at him with its calf's eyes, and lays a long hand on his head, and pets him.

      Franta Pešek screams. It is a scream they hear in Vlčí Brod. Both brothers turn and run, flat out, up the meadow and over the fence and away into the dark, shrieking. And Baron, who is still on the end of the halter, and who has never had so much fun in his life, gallops after them, kicking up his heels, the rope flying.

      The tall shape watches them go. Then it walks back down to its cows.

      In the morning you find the hoofprints of your bull going up the dry brook at a gallop, side by side with two pairs of enormous boots, toward Hrubý's barns.
    choices:
      - text: "Go in. There's nothing more to be done tonight."
        to: 72

  71:
    title: Will You Be My Papa?
    effects:
      - note: RAIDED
      - san: "0/1"
      - companion: all
        san: "0/1D3"
    text: |
      You keep still.

      The child unfolds its hands, reaches up, and takes Pepík Pešek's enormous hand in its small one.

      "Will you be my papa?" it asks.

      Pepík screams. It is a scream they hear in Vlčí Brod. Both brothers turn and run, flat out, across the yard and through the gate and away up the dry brook, shrieking. And Baron, who is still on the end of the halter, and who has never had so much fun in his life, gallops after them, kicking up his heels, the rope flying.

      The child watches them go. Then it turns and smiles at you, and walks away down onto the meadow in its nightshirt, and you lose sight of it in the mist.

      In the morning you find the hoofprints of your bull going up the dry brook at a gallop, side by side with two pairs of enormous boots, toward Hrubý's barns.
    choices:
      - text: "Go in. There's nothing more to be done tonight."
        to: 72

  # ===================================================================== ACT TWO: MONDAY
  72:
    title: Blue Monday
    effects:
      - companion: bara
        san: "0/1D2"
    text: |
      Monday comes up grey and quiet, as if nothing had happened.

      Bára milks. You hear the first squirt hit the pail, and then nothing, and then Bára saying something to the cow that she did not learn in church. You go to look.

      The milk is blue. Not the thin bluish white of skimmed milk: blue, the clear soft blue of a summer sky, and it smells of violets. Every cow gives it. Bára pours a pailful into the churn with her mouth set, and it sits there looking up at you like a piece of sky that has fallen into a bucket.

      There is a calf in the cowshed that you did not buy. It is suckling Malina, who does not seem to mind. It is small and red-pied, like the others, but at the edges it is not quite there: its ears and tail and the tips of its hooves fade into the air like breath on a window. When you put out a hand to it, your fingers go a little way in, and it is cold.

      The child is sitting on the fence, eating an apple. It waves.
    extra:
      - requires: {note: RAIDED}
        text: Baron's stall is still empty. From the top of the meadow you can see Hrubý's big red barns half a mile up the brook, and once, faintly, on the wind, you hear a bull bellow. You would know that bellow anywhere.
      - requires: {note: HERDSMAN}
        text: In the dew on the meadow there are long marks, as if somebody with very long fingers had stroked the grass.
      - requires: {note: SHOT}
        text: The cows will not come near you this morning. When you walk into the cowshed, every head turns away.
      - requires: {note: WATER}
        text: |
          The brook is running down its old bed again, through your meadow and out under the dam, brown and loud and cheerful. Up at Hrubý's, for the first time in three years, the mill wheel is still.
      - text: |
          At eight the postman comes up the valley road on his bicycle. He gets as far as the willows by the gate, and stops, and will not come a step further. He waves a card at you from there.
    choices:
      - text: "Walk up to the gate, and take the card."
        to: 73

  73:
    title: The Postcard
    text: |
      You walk up to the willows and take the card. The postman does not wait to be thanked. He turns his bicycle round and goes back down the valley a good deal faster than he came.

      The card is printed, with the gaps filled in by hand.

      *District Veterinary Office, Klatovy. Following a complaint received, the herd at the property known as U Snílku will be inspected for foot-and-mouth disease on Wednesday, 28 September, at seven o'clock in the morning. The owner will ensure that all animals are present. MVDr. Alois Šťastný, District Veterinarian.*

      Wednesday is St Wenceslas, and the fair. At ten o'clock on Wednesday you were going to sell six heifers to pay the bank. At seven, a man is coming to decide whether to shoot them.
    extra:
      - requires: {note: CONFESSION}
        text: Pepík's confession is in your notebook, signed with his X. In daylight it does not seem much, against a printed card.
      - requires: {any: [{note: INVITED}, {note: WEIR}]}
        text: So Hrubý meant it. You had half hoped it was bluster.
      - requires: {with: bara}
        text: |
          "Babka said three nights," says Bára behind you, very quietly. "That was one."
    choices:
      - text: "Hitch Fanda to the cart, and drive into Vlčí Brod."
        to: 74
      - text: "Follow the Herdsman's trail into the wood."
        requires: {note: HERDSMAN}
        to: 117
      - text: "Stay home, and put the place in order."
        to: 121

  # ----------------------------------------------------- Town
  74:
    title: Vlčí Brod
    extra:
      - before: true
        text: |
          You go alone. Bára will not leave the cows, and Sultán will not leave the well. Fanda takes you down the valley road under the edge of the Black Wood, past the cottage with the beehives, where nobody is in the garden this morning.
      - requires: {note: INVITED}
        before: true
        text: You saw the square yesterday in its Sunday best. It looks more honest today.
      - requires: {investigator: singer}
        text: A woman selling eggs looks at you, and looks again, and calls something across to the woman selling cabbages. By the time you have tied up Fanda, the whole market is pretending not to look at La Valdini.
    text: |
      On a Monday Vlčí Brod is all market. The square is full of stalls: cabbages, plum jam, tin pans, a man selling patent medicine from the back of a cart. Geese argue under the linden tree. The plague column stands in the middle of it all with its saints gazing up at heaven, as if to say that none of this is their responsibility. The street signs are in Czech and German, and the haggling is in both and neither. Thistledown rolls across the cobbles from the fields beyond the town, small grey tumbleweeds, and the dogs chase it.

      You know, the moment you climb down from the cart, that everybody knows who you are.

      There is a good deal of town to choose from. The Golden Bull stands on the corner with its absurd swinging doors. St Prokop's lifts its onion dome over the roofs. On the first floor of the town hall a brass plate says LIBRARY, and a lace curtain twitches. The gendarmerie station flies the Republic's flag over a door with a bell-pull. Up the hill above the town the white spa hotel sits among its lawns, and something on its terrace glints in the sun like the lens of a telescope. At the bottom of the hill is the railway station, where the 4:10 to Plzeň stops every afternoon.

      The church clock says a quarter past nine. You have until dark. Dark comes early at the end of September, and the road home runs under the Black Wood.
    choices:
      - text: "Climb the stairs to the town library."
        to: 80
      - text: "Push through the swinging doors of the Golden Bull."
        to: 88
      - text: "Call at the gendarmerie station."
        to: 96
      - text: "Go into St Prokop's and find the priest."
        to: 103
      - text: "Walk up the hill to the spa."
        to: 107

  75:
    title: Noon in Vlčí Brod
    effects:
      - note: NOON
    text: |
      The bell of St Prokop's strikes twelve, and the market begins to pack up. Lunch smells drift out through the swinging doors of the Golden Bull: roast pork, dumplings, sauerkraut. The geese have gone to sleep under the linden.

      Half the day is gone. You could do one more thing in town and still be home before dark. Two more, and you will be driving the valley road under the Black Wood at night.
    choices:
      - text: "Climb the stairs to the town library."
        requires: {no_note: LIBRARY}
        to: 80
      - text: "Push through the swinging doors of the Golden Bull."
        requires: {no_note: INN}
        to: 88
      - text: "Call at the gendarmerie station."
        requires: {no_note: POLICE}
        to: 96
      - text: "Go into St Prokop's and find the priest."
        requires: {no_note: CHURCH}
        to: 103
      - text: "Walk up the hill to the spa."
        requires: {no_note: SPA}
        to: 107
      - text: "Drive home while it's light."
        to: 78

  76:
    title: Long Shadows
    effects:
      - note: LATE
    text: |
      The shadow of the plague column has swung round across the square and lies on the steps of the town hall. The market has gone. A boy is sweeping up cabbage leaves. The light is turning gold.

      If you mean to be home before dark, the time to go is now. Bára is alone on the farm. The child is not.

      You could still do one more thing in town. It would be dark by the time you were done.
    choices:
      - text: "Climb the stairs to the town library."
        requires: {no_note: LIBRARY}
        to: 80
      - text: "Push through the swinging doors of the Golden Bull."
        requires: {no_note: INN}
        to: 88
      - text: "Call at the gendarmerie station."
        requires: {no_note: POLICE}
        to: 96
      - text: "Go into St Prokop's and find the priest."
        requires: {no_note: CHURCH}
        to: 103
      - text: "Walk up the hill to the spa."
        requires: {no_note: SPA}
        to: 107
      - text: "Drive home now, before dark."
        to: 78
      - text: "Walk down to the station, and catch the 4:10 to Plzeň."
        to: 79

  77:
    title: Dark on the Valley Road
    effects:
      - companion: bara
        san: "-1D6"
      - companion: sultan
        san: "-1D4"
    text: |
      By the time you come out, the sun is down and the square is blue with dusk. You untie Fanda and drive out of Vlčí Brod with lamps lit in every window behind you and nothing but dark ahead.

      The valley road runs under the Black Wood for six kilometres. Fanda does not like it. He keeps his ears flat and his head high, and twice he stops dead and will not go on until you climb down and lead him. Something keeps pace with you inside the trees for a while, and then stops. At the bee cottage a light is burning in the window. It goes out as you pass.

      It is nine o'clock when you reach the farm.

      Every lamp in the house is lit. At sunset, by every sign, the child came to the kitchen door and asked to come in. When it was refused, it sat down on the step and waited, very politely, for three hours. From what you can make out afterwards, it talked through the door the whole time about Bára's mother, who has been dead since 1918.
    extra:
      - requires: {note: KRATOCHVIL}
        text: A bicycle lies in the ditch by your gate. A man in plus-fours came at dusk with a telescope strapped to the crossbar, saw the child on the step, said "Oh" in a very small voice, dropped the bicycle and ran. He has not come back for it.
      - requires: {with: bara}
        text: Bára is sitting just inside the door with the poker across her knees. She does not say anything when you sit down beside her. After a while she puts her head on your shoulder, and leaves it there.
      - requires: {broken: bara}
        text: |
          Bára does not know you. She looks at you with her grandmother's eyes and says, in her grandmother's voice, "You left her alone." Then she goes to the cowshed with a pail and begins to milk cows that are not there.
      - requires: {broken: sultan}
        text: Sultán is at the well, howling at an empty corner of the yard. He does not come when you call.
    choices:
      - text: "Bolt the door."
        effects:
          - unnote: KRATOCHVIL
        to: 126

  78:
    title: The Road Home
    text: |
      You drive out of Vlčí Brod. Fanda knows the way, and he wants his supper. The valley road climbs gently under the edge of the Black Wood, and the trees throw their shadows over you, and lift them, and throw them again.

      A mile short of the farm you come to the cottage with the beehives. A small bent woman in a black headscarf is standing at the gate, as if she has been waiting for somebody. It is Babka Kosová, Bára's grandmother. She lifts a hand to you.
    extra:
      - requires: {note: LATE}
        text: |
          The shadows lie long across the road. Off to the west, the sun is touching the hills.
      - requires: {no_note: LATE}
        text: |
          It is barely past noon. You will be home with the whole afternoon in hand, and on a farm there is always an afternoon's work.
    choices:
      - text: "Stop at Babka Kosová's cottage."
        effects:
          - unnote: NOON
          - unnote: LATE
        to: 111
      - text: "Drive on home before dark."
        effects:
          - unnote: NOON
          - unnote: LATE
        to: 126

  79:
    title: The 4:10 to Plzeň
    ending: escape
    text: |
      You leave Fanda at the rail outside the Golden Bull with a nosebag and a note for whoever finds him, and walk down the hill to the station with nothing but the clothes you stand in and your pocketbook.

      You sit on the platform bench until the 4:10 to Plzeň comes in. It is on time. It is the only thing in Bohemia that is. You sit by the window as it pulls out and watch Vlčí Brod slide away behind you, and the valley, and somewhere up the valley, out of sight, a little stone farm with a red roof and a well and a meadow, where a nineteen-year-old girl is milking blue milk from fourteen cows and waiting for you to come home.

      You take a room in Plzeň. You write to the bank. You write to Bára, three times, and tear up the letters.

      On Thursday the newspaper has a paragraph on page six. A district veterinarian, visiting a property near Vlčí Brod on Wednesday morning, found the owner absent and the herd *in a condition he declined to describe*. He has asked for a transfer.

      You came to the valley to rest. You left a nineteen-year-old alone on a dreaming farm, and caught a train.
    extra:
      - requires: {with: bara}
        text: Bára writes to you once, in November. The letter says only *Babka was right. It stayed.* There is no return address.
      - requires: {broken: bara}
        text: You hear, years later, that the girl at U Snílku still does the milking every morning, with her eyes wide open and fast asleep. Nobody has the heart to wake her.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán, they say, never left the well.

  # ----------------------------------------------------- The library
  80:
    title: The Library
    effects:
      - note: LIBRARY
    text: |
      The library is one long room on the first floor of the town hall, lined from floor to ceiling with books and smelling of floor polish and patience. There is one window, one reading table, and one librarian.

      Miss Hermína Doubravová is about forty-five, with steel spectacles, a high lace collar, and a silver watch pinned to her bosom, which she consults the way other people consult their consciences. She looks at you over the spectacles. She knows exactly who you are.

      "We close at six," she says. "Not one minute past. You may consult one subject properly, or four subjects badly. I recommend one." She folds her hands. "Which subject?"
    extra:
      - requires: {investigator: singer}
        text: |
          "Rozálie Vaňková," she adds, without changing her expression. "You still owe this library a copy of Erben's *Bouquet*, borrowed in 1889. I have the card."
    choices:
      - text: "Ask for the history of the parish."
        roll: {skill: [Library Use, History], success: 81, failure: 85}
      - text: "Ask for the old songs of the district."
        roll: {skill: [Library Use, History, Art/Craft (Singing)], success: 82, failure: 85}
      - text: "Ask for the Professor's book on dreams."
        roll: {skill: [Library Use, Psychology, Psychoanalysis], success: 83, failure: 85}
      - text: "Ask what the library has on lights in the sky."
        to: 84
      - text: "Hide in the stacks at closing time, and read the lot."
        to: 86

  81:
    title: The Chronicle of Vlčí Brod
    effects:
      - note: SNILEK
      - note: RIGHTS
    text: |
      Miss Doubravová brings you a fat brown book: *A History of the Town and Parish of Vlčí Brod*, by a schoolmaster, printed in 1889, with an engraving of the plague column for a frontispiece. It is very dull for two hundred pages. Then you come to 1641.

      The Swedes came through the valley that spring and broke the dam of the Snílek to spite the abbot. The schoolmaster quotes the parish chronicle, in Latin and then in his own Czech. *For three nights the dreams of the sleepers walked abroad, and were seen by many, and spoke. On the fourth morning they did not depart.* The miller, the schoolmaster notes drily, thereafter believed himself to be a heron, and stood on one leg in the millrace until his death in 1659.

      The priest, Father Matyáš, had the dam rebuilt *by the labour of the whole parish*, and when the pond was full again he *sang it to sleep* from the bank. The schoolmaster calls this a charming rustic survival.

      In a footnote on the next page he mentions, in passing, that the pond's water is protected by a deed of 1785, *from the Feast of St George until the Feast of St Wenceslas*, and that any man who dams the brook above it in those months is breaking the law.

      St Wenceslas is Wednesday.
    choices:
      - text: "Return the book, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Return the book, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Return the book, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  82:
    title: Songs of the Bohemian Forest
    effects:
      - note: LULLABY
    text: |
      It is a little green book, published in 1864 by a country schoolmaster who walked the forest villages writing down what the old women sang. Most of it is about girls and soldiers and drowned lovers. On page ninety-one there is a song called *The Snílek Lullaby*, with a note: *Sung every autumn by the keepers of the fishpond of that name, near Vlčí Brod, on the bank at dusk. The custom is said to be very old.*

      There is the tune, in tidy notation, and the words:

      *Hush now, Snílek, hush and keep,*
      *Water over, dark and deep.*
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      You read it three times, and copy it out, and find that you can hum it already, as if you had always known it.
    choices:
      - text: "Return the book, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Return the book, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Return the book, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  83:
    title: The Interpretation of Dreams
    effects:
      - note: DREAMWORK
    text: |
      The library has it in German, a heavy blue volume from 1900, much read and much underlined, though Miss Doubravová will not say by whom. You sit with it at the one table under the one window while the town goes about its business outside.

      You will not understand all of it in one sitting. But you understand enough. A dream is never what it seems. It is a wish, dressed up as something else so that it can get past the night watchman. The things we want most, and are most ashamed of wanting, we dream in disguise: a train, a door, a tooth, a child.

      The question, the Professor says, is never *what is this?* It is *what do I want?*
    extra:
      - requires: {investigator: analyst}
        text: You know the book better than its author's mother does. But you read it now as you never read it in Vienna, not as a doctor but as a patient. It is a very different book from that side.
    choices:
      - text: "Return the book, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Return the book, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Return the book, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  84:
    title: Are the Martians Among Us?
    effects:
      - note: MARTIANS
    text: |
      Miss Doubravová sighs, goes to a low shelf in the corner, and comes back with a slim pamphlet in a yellow paper cover.

      *Are the Martians Among Us? Observations and Deductions by Ing. Leopold Kratochvíl. Published by the Author, 1924.* There is a dedication on the flyleaf in violet ink: *To the Library of Vlčí Brod, in hope of enlightenment, from the author, presently residing at the Spa.*

      It is forty pages long. It is about lights in the sky. Ing. Kratochvíl has seen them over Moravia, over the Tatras and over the spa, and he has deduced a great deal from them. The Martians, he believes, are studying us. They prefer the countryside. They are particularly interested in cattle, *being placid, numerous and possessed of four stomachs, which must seem to a Martian a very great curiosity*.

      On page twelve there is a drawing of a Martian: a tall figure in a silver suit with a round glass helmet like a goldfish bowl, raising one hand in greeting.

      "He donated it himself," says Miss Doubravová. "He is staying up at the spa. For his nerves."
    choices:
      - text: "Return the pamphlet, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Return the pamphlet, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Return the pamphlet, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  85:
    title: The Wrong Shelf
    text: |
      You spend a long time with a book that turns out to be about crop rotation in the Kingdom of Bohemia from 1750 to 1800, and a longer time with one about the Bishops of Prague. Miss Doubravová consults her watch at intervals, as if timing an egg.

      You learn a great deal about turnips.
    choices:
      - text: "Give it up, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Give it up, and go back out into the square."
