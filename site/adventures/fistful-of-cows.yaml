      - requires: {note: WATER}
        text: The brook still runs down its old bed through the meadow and out under the empty outlet tower. The mist lies on it like steam on soup.
      - text: |
          Tonight is the third night. Tomorrow at seven, the vet. Whatever you are going to do, you have one day to make ready.
