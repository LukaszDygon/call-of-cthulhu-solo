  97:
    title: File No. 4/1927
    effects:
      - note: RIGHTS
    text: |
      Mach brings it from a cabinet: a thin grey folder tied with tape.

      *Vodička, Ferdinand, farmer, aged 67, of U Snílku. Reported missing 3 February 1927 by Barbora Kosová, farmhand.* There is the note, in an envelope: *I have gone to the bottom of things.* The well was searched on the fourth of February with grapnels and a lantern on a rope. It was found to contain water to a depth of six feet, and nothing else. The dog would not leave it.

      There is a statement from the postman, who passed the farm on the night of the second. He saw a light in the kitchen and, he says, *a child sitting on the rim of the well, in a nightshirt, swinging its legs*. Somebody has pencilled in the margin: *Postman known to drink.*

      And pinned to the back of the folder is an older complaint, from 1924, in Vodička's own hand. It accuses Bohuslav Hrubý of damming the brook above the Snílek *contrary to the water right of 1785, which grants the pond the whole water of the brook from the Feast of St George until the Feast of St Wenceslas*. Across it somebody has written: *Civil matter. No action.*

      "I always thought he had a point," says Mach. "About the water. Nobody else did."
    choices:
