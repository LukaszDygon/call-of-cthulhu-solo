  # ----------------------------------------------------- Refill
  180:
    title: The Weir by Night
    text: |
      You stack the boards at the foot of the outlet tower and run up the dry brook in the dark. At the top of the farm you pass between the two old willows, and the dream drops away behind you like a coat. The air up here is thin and cold and ordinary. An owl hoots. Ahead of you, the brook roars against Hrubý's weir.

      There is a light in Hrubý's bedroom window. Nobody comes out.

      The sluice gate is wound shut and chained, with a padlock the size of a fist.
    choices:
      - text: "Unlock it with Hrubý's key."
        requires: {item: weir-key}
        to: 183
      - text: "Break the chain."
        roll: {skill: [STR, Mechanical Repair], difficulty: hard, success: 183, failure: 181}

  181:
    title: The Chain
    effects:
      - hp: "-1D3"
    text: |
      You find a rock and smash at the padlock. You find a fence post and lever at the chain. Your hands bleed. The chain holds. The night goes on.

      Somewhere down the valley a cockerel crows, much too early, and then thinks better of it.
    choices:
      - text: "Again."
        roll: {skill: [STR, Mechanical Repair], success: 183, failure: 182}

  182:
    title: Too Little Water
    text: |
      When the chain finally gives, the sky over the Black Wood is already going grey.

      You wind the gate open, and the brook comes down its old bed toward the farm, roaring. But you know before you are back at the dam that it is too late. The water reaches the meadow at first light, and spreads, and sinks into the dry ground, and there is not enough of it, and there is not enough time. The mist drinks it. The dream goes on.

      At sunrise there are a few inches of brown water in the hollows, and the mist lies on top of it, glowing, as if the water were not there at all.
    choices:
      - text: "Wait for seven o'clock."
        to: 217

  183:
    title: Water
    text: |
      The gate goes up with a shriek of iron, and the brook remembers where it used to go.

      It comes down the old bed in a brown roaring rush, driving a winter's worth of leaves and sticks before it, filling the dry channel from bank to bank. You run alongside it, back down the brook, back between the willows, back into the dream. The water runs ahead of you into the meadow, and spreads, and you hear the mist hiss where it touches it.

      At the bottom of the meadow, the outlet tower is waiting for its boards.
    choices:
      - text: "Run for the tower."
        to: 184

  184:
    title: The Outlet Tower
    text: |
      You climb down into the shaft of the outlet tower with the first board. The water is already round your ankles, and rising, and cold.

      The first board goes into the grooves and slides down and seats with a thump. Then the second. Then the third. The water is at your knees.

      The child is standing on the dam above you, looking down into the shaft.

      "Don't," it says. "Please don't. I'll drown. I don't want to go under. Please. We were going to stay." It is crying, real tears, the way you cried when you were eight. "Please."

      Behind it the Herdsman has come to the edge of the dam, among the sleeping cows. He does not try to stop you. He only watches, with his calf's eyes, very sad.

      The fourth board will not go in. It sticks in the grooves. The water is at your waist, and pulling.
    choices:
      - text: "Force the boards home."
        requires: {no_note: HEART}
        roll: {skill: [STR, Mechanical Repair, DEX], success: 186, failure: 185}
      - text: "Brace against the pull. You know where it's coming from."
        requires: {note: HEART}
        roll: {skill: [STR, Mechanical Repair, DEX], bonus: 1, success: 186, failure: 185}

  185:
    title: Swept
    effects:
      - hp: "-2D6"
      - san: "1/1D4"
    text: |
      The board jams, and the water comes over the lip of the shaft all at once and takes you off your feet. You go under in the green dark with the boards banging round your head, and for one long moment you are in a green room at the bottom of everything, and an old man in his shirtsleeves is looking up from a game of cards in surprise.

      Then you come up, choking, with your hands still on the boards, and you shove the last one down with all your weight, and it holds.

      The water stops rising in the shaft. It starts rising in the meadow.
    choices:
      - text: "Climb out, and watch it fill."
        to: 186

  186:
    title: The Carp Ranch
    ending: triumph
    text: |
      It fills.

      It should take weeks. It takes a night. The brook pours into the meadow, and the mist turns to water where it touches it, as if the water had only been waiting for permission. It creeps up between the willows. It covers the shells, and the old anchor, and the half oar. It rises round the sleeping cows, and the Herdsman wakes them, gently, one by one, and leads them up out of the water onto the high pasture by the house, and stands with them a moment on the bank. Then he turns and walks away along the shore into the Black Wood, humming, and does not come back.

      The child stands on the dam until the water reaches its knees. Then it waves to you, and smiles, and walks down into the water, and does not come up. Its face as it goes under is the happiest face you have ever seen.

      By dawn the Snílek is full to the brim, and still, and blue, with the sun coming up in it.

      At seven o'clock Hrubý's motorcar comes up the track with the district vet in the passenger seat: MVDr. Alois Šťastný, a small, precise man with a black bag. He inspects your herd on the high pasture. He looks in their mouths and at their hooves, pats their necks, and writes in his book. They are perfectly healthy, he says, if a little sleepy. He cannot imagine who would have written such a complaint. He looks at Hrubý.

      Hrubý is not listening. He is staring at the pond. He knows this valley. He knows there was a meadow here on Sunday. It is Wednesday, and the meadow is a lake, and there are fish rising in it.

      "Fine piece of water," says the vet, who has never been here before. "Carp?"

      There is a splash and a great deal of swearing, and an old man in his shirtsleeves wades out of the shallows at the head of the pond, dripping, with a cold pipe in his teeth, and asks whether anybody has a match. Ferdinand Vodička has come up from the bottom of things.
    extra:
      - requires: [{note: CONFESSION}, {no_note: WARNED}]
        text: When the vet has finished, you hand him Pepík's confession. He reads it, and looks at Hrubý over his spectacles for a long time. Hrubý walks home.
      - requires: {note: WARNED}
        text: |
          Strážmistr Mach has come up behind the motorcar on his bicycle, in his best cap; he telephoned the vet about Pepík's statement on Monday. When the inspection is over, he takes Hrubý aside and writes in his notebook for a long time, and Hrubý's moustache droops, one point at a time.
      - requires: {note: RAIDED}
        text: The vet asks to see the bull. You explain that the bull is in Mr. Hrubý's barn. The vet writes that down too, and looks at Hrubý again, and Baron is home by noon.
      - requires: {item: carp}
        text: The carp from the well goes into the pond first, from your own hands. He swims away without a backward glance, and by spring there are a hundred little ones.
      - requires: {with: bara}
        text: Bára stood beside you on the bank at dawn with her shawl round her shoulders, watching the sun come up in the water, and cried, and would not say why. She stays on. She learns about carp.
      - requires: {broken: bara}
        text: When the sun came up on the water, Bára stirred on the porch, still tied to the rail with your belt. She blinked at you as if from a long way off, and asked how long she had been asleep. You told her it was only a dream. It is weeks before she is quite herself.
      - requires: {gone: bara}
        text: At dawn, when the light first touched the water, you thought you saw a girl in a white nightdress far out in the middle of the pond, standing on the surface, waving. Then she was not there. Babka says she is sleeping down there with the old dreams, and that she is happy. You put a lamp in the window every night for a year.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán meets Vodička at the water's edge, and the two of them go up to the house together without a backward glance.
      - requires: {note: ALIENS}
        text: Before the week is out, the *Národní listy* will print a short letter from an engineer at the spa about seven lights over a farm near Vlčí Brod. Nobody in the valley will ever let you forget it.
      - text: |
          You sell the heifers at the fair that afternoon, for a good price, and pay the bank. You never graze cattle on the Snílek again. You keep carp. Every Christmas, when all of Bohemia wants a carp for the table, the carts come up the valley road to U Snílku.

          It is a carp ranch, you tell people. They laugh. You do not mind. The Snílek sleeps, and so do you.

  # ----------------------------------------------------- Lullaby
  187:
    title: Into the Mist
    text: |
      You walk down the meadow into the glowing mist.

      It closes over you, warm as bathwater, and the farm goes away. There are voices in the mist. Your mother is calling you in to supper. A crowd is applauding. Somebody you knew a long time ago is laughing at a joke you have forgotten. The fish slide past your face, gold and slow. Under your feet the ground beats like a heart, and every beat says *stay*.

      You have to find the place where it is deepest. You have to sing to it there, where it can hear.
    extra:
      - requires: [{with: bara}, {note: BARA}]
        text: |
          Bára comes after you into the mist, one hand knotted in the back of your coat. She knows the tune; her grandmother sang it over her cradle.
    choices:
      - text: "Go straight to the outlet tower."
        requires: {note: HEART}
        to: 189
      - text: "Find the heart of it in the mist."
        roll: {skill: [Spot Hidden, Listen, POW], success: 189, failure: 188}

  188:
    title: Turned Around
    effects:
      - san: "1/1D6"
    text: |
      You go the wrong way. The mist turns you round and round. You walk for an hour, or a minute, among the voices, and find yourself back at the willows, and then at the cowshed door, and then, somehow, in the kitchen of the house where you grew up, with dumplings on the table.

      You tear yourself out of it, and find the tower at last by walking into it in the dark. Your throat is raw. Your hands are shaking.
    choices:
      - text: "Sing, with what voice you have left."
        roll: {skill: [Art/Craft (Singing), POW], bonus: -1, success: 191, failure: 190}

  189:
    title: The Lullaby
    text: |
      The stone tower rises out of the mist above you, black and solid, the only real thing in the world. The herd lies round its foot in a ring, asleep. The Herdsman stands among them with his hand on the stone. The child sits on the dam above, with its chin on its knees, watching you.

      You put your own hand on the cold stone of the tower. Under it, the heart of the Snílek beats, slow and enormous.

      You draw breath.
    extra:
      - requires: {note: FILLING}
        before: true
        text: |
          The Snílek has been filling all evening. The water stands chest-deep round the tower, and you wade the last of the way.
    choices:
      - text: "Sing."
        roll: {skill: [Art/Craft (Singing), POW], success: 191, failure: 190}
      - text: "Sing it the way you rehearsed it."
        requires: {note: REHEARSED}
        roll: {skill: [Art/Craft (Singing), POW], bonus: 1, success: 191, failure: 190}
      - text: "Play it on the harmonica."
        requires: {item: harmonica}
        roll: {skill: [POW, DEX], bonus: 1, success: 191, failure: 190}

  190:
    title: The Meadow Sings Back
    effects:
      - san: "1/1D6"
    text: |
      Halfway through the third line, the tune breaks.

      And the meadow sings back.

      It sings in your mother's voice. It sings your lullaby back to you, but it has changed the words: *Stay now, little one, stay and sleep, home is warm and the water's deep*. The mist rises round you. The fish come closer. The child on the dam is singing too, in your voice, the voice you had when you were eight. The ground pulls at your feet like a tide going out.

      You have perhaps one more chance.
    choices:
      - text: "Bára! Sing it with me."
        requires: [{with: bara}, {note: BARA}]
        to: 191
      - text: "Hold on to Babka's red thread, and start again."
        requires: {item: red-thread}
        effects:
          - lose: red-thread
        roll: {skill: POW, success: 191, failure: 217}
      - text: "Keep singing, alone."
        roll: {skill: [Art/Craft (Singing), POW], difficulty: hard, success: 191, failure: 217}

  191:
    title: Hush, Little Meadow
    ending: triumph
    text: |
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      On the last line, the meadow sighs.

      You feel it go through the ground like a long breath let out. The beating under your feet slows, and slows, and stops. The mist sinks into the grass, glowing, and goes out. The fish are gone. The Herdsman lifts his hand from the tower and looks at you for a long moment with his calf's eyes, and nods. Then he walks away into the Black Wood, humming your tune, and does not come back. The cows sleep on where he left them, ordinary cows, snoring.

      On the dam, the child yawns. It lies down on the grass with its head on its arm, the way you used to fall asleep in front of the stove, and closes its eyes. When you climb up to it, there is nobody there. Only a hollow in the grass, still warm.

      At dawn there is a splash and a great deal of swearing from the well. When you look down it, an old man in his shirtsleeves is climbing the rope, dripping and yawning, with a cold pipe in his teeth. Ferdinand Vodička has slept his fill at the bottom of things, and come up for breakfast.

      At seven o'clock Hrubý's motorcar comes up the track with the district vet in the passenger seat: MVDr. Alois Šťastný, small and precise, with a black bag. He inspects your herd. He looks in their mouths and at their hooves, and pats their necks. They are the healthiest cows he has seen this year, he says, and the calmest. He cannot imagine who would have written such a complaint. He looks at Hrubý.

      Hrubý is staring at your cows: ordinary cows, standing on the grass, chewing, with their shadows exactly where they ought to be. His mouth is open. Nobody ever tells him what happened. He never asks.
    extra:
      - requires: [{note: CONFESSION}, {no_note: WARNED}]
        text: When the vet has finished, you hand him Pepík's confession. He reads it, and looks at Hrubý over his spectacles for a long time. Hrubý walks home.
      - requires: {note: WARNED}
        text: |
          Strážmistr Mach has come up behind the motorcar on his bicycle, in his best cap; he telephoned the vet about Pepík's statement on Monday. When the inspection is over, he takes Hrubý aside and writes in his notebook for a long time, and Hrubý's moustache droops, one point at a time.
      - requires: {note: RAIDED}
        text: The vet asks to see the bull. You explain that the bull is in Mr. Hrubý's barn. The vet writes that down too, and Baron is home by noon.
      - requires: {with: bara}
        text: Bára sleeps until noon, the first real sleep she has had in three nights. When she wakes, she goes down the valley to tell her grandmother, and comes back with honey cake, and stays.
      - requires: {broken: bara}
        text: On the last line of the lullaby, Bára stirred on the porch, tied to the rail with your belt. By dawn she knows your name again; it is weeks before she is quite herself. The first whole sentence she says is to ask why on earth she is tied to the porch.
      - requires: {gone: bara}
        text: At dawn, by the outlet tower, you find a hollow in the grass the shape of a sleeping girl, still warm. Babka says Bára is down there with the old dreams, asleep, and that she will wake when she is ready.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán meets Vodička at the well, and will not leave his side for the rest of the day.
      - requires: {note: ALIENS}
        text: Before the week is out, the *Národní listy* will print a short letter from an engineer at the spa about seven lights over a farm near Vlčí Brod. Nobody in the valley will ever let you forget it.
      - requires: {note: FILLING}
        text: |
          Behind its boards the Snílek goes on filling, slowly, all that autumn. By Christmas it is a pond again, with your cows grazing the high pasture above it.
      - text: |
          You sell the heifers at the St Wenceslas fair that afternoon, for a good price, and pay the bank. Every autumn after that, at dusk on the eve of St Wenceslas, you walk down to the dam and sing to the meadow.
      - requires: {investigator: singer}
        text: Every year a few more people come up from Vlčí Brod to listen. By the fifth year, half the parish is standing on the dam in their Sunday best, and Father Kolář is at the back, unable to take his eyes off the singing.
      - requires: {item: harmonica}
        text: Some years you play it on the harmonica instead, thin and lonesome, the way you played to the herd on long night drives. The cows like it. So does the meadow.
      - text: |
          It sleeps. So do you.

  # ----------------------------------------------------- The Last Session
  192:
    title: The Last Session
    text: |
      In the mist the child takes your hand, and leads you back up the slope to the cowshed, and opens the door, and you step through into the house where you grew up.

      It is evening there. The lamp is lit. The kitchen smells of dumplings. Your mother is at the stove with her back to you, singing under her breath. The table is laid for two.

      The child sits down on the kitchen floor, cross-legged, the way you used to sit, and looks up at you.

      "Why did you come here?" it asks. "To this farm. Really. Why?"

      It is the oldest question in the world, and the only one that matters, and you know that the whole Snílek is listening for the answer.
    extra:
      - requires: {investigator: cowboy}
        text: You know the answer. It was never cattle, or land, or Texas. You came back across an ocean to the country you ran away from because you wanted to come home. And home is a cart at a gate, and a woman who stood there, and she has been dead for thirty years.
      - requires: {investigator: analyst}
        text: You know the answer. Thirty years of other people's dreams, and never once your own. You came to the country to rest from them. You came, if you are honest, to be somebody's child again for a little while, and to let somebody else do the listening.
      - requires: {investigator: gendarme}
        text: You know the answer. For thirty-two years you were the law. You never once broke a rule, or blew a whistle at anybody, or ran. You bought a farm because you wanted, just once before you died, to be that boy on the wall again, and to be bad, and to get away with it.
      - requires: {investigator: singer}
        text: You know the answer. You came home to be forgiven. You came home to stand on the dam and sing, and for your mother to hear you, and clap. She has been dead since 1903. She never once heard you sing in a theatre.
      - requires: {item: photograph}
        text: The child is the girl in your photograph, in her white choir dress.
    choices:
      - text: "Give it back its toy."
        requires: {item: toy}
        to: 194
      - text: "Tell it what it wants, the way the Professor taught you."
        requires: {skill: Psychoanalysis, min: 50}
        roll: {skill: Psychoanalysis, success: 194, failure: 193}
      - text: "Tell it what it wants. You've read the book."
        requires: {note: DREAMWORK}
        roll: {skill: [Psychology, POW], success: 194, failure: 193}
      - text: "Tell it the truth, as best you can."
        roll: {skill: POW, difficulty: hard, success: 194, failure: 193}
      - text: "Sit down to supper with it."
        to: 196

  193:
    title: The Wrong Answer
    text: |
      You say something. It is not the right thing. You can tell at once.

      The lamp gutters. The kitchen grows darker. Your mother turns from the stove, slowly, and still you cannot see her face. "Supper," she says. "Come along. It's getting cold." The door you came in by is closing, very slowly, by itself, and outside it there is nothing but green water.

      The child takes your hand. "Stay," it says. "Please. You can try again tomorrow. And the day after. For ever."
    choices:
      - text: "Hold on to Babka's red thread."
        requires: {item: red-thread}
        effects:
          - lose: red-thread
          - san: "-1D4"
        to: 194
      - text: "Go in to supper."
        to: 196
      - text: "Run for the door, out into the last of the night."
        to: 217

  194:
    title: The Wish
    text: |
      You say it aloud.

      You say it to the child, on the kitchen floor of a house that is not anywhere any more: what you wanted, all along, under everything. You say it plainly, the way you have never said it to anyone, not even yourself.

      The child listens with its head on one side. When you have finished, it is quiet for a long time.

      "Oh," it says. "Is that all?"

      It gets up off the floor and puts its arms round you, briefly, hard, the way children do. It smells of soap, and hay, and summer. Then it lets go, and walks to the kitchen door, and opens it, and goes out into the glowing mist of the meadow without looking back.

      Behind you, your mother turns from the stove. For one moment you see her face, young and tired and kind. Then the kitchen is gone, and you are standing in the doorway of your own cowshed at U Snílku, in the dark.
    choices:
      - text: "Walk out into the yard."
        to: 195

  195:
    title: The Last Session
    ending: triumph
    text: |
      The meadow sighs.

      You hear it from the cowshed door: a long breath let out, all the way down the valley. The beating under the ground slows, and stops. The mist sinks into the grass and goes out. The fish are gone. Down by the stone tower the Herdsman lifts his hand from the stone, and the herd sleeps on round him, ordinary cows, snoring. He looks up the meadow at you, and nods. Then he walks away into the Black Wood, and does not come back.

      The Snílek has lost its loudest dreamer. It has nothing left to dream with. It goes back to sleep.

      You go to bed, and you sleep without dreaming until the sun is up, for the first time in longer than you can remember. When you wake, you feel lighter than you have felt since you were eight.

      There is a splash from the well, and a great deal of swearing. An old man in his shirtsleeves is climbing up the rope with a cold pipe in his teeth. Ferdinand Vodička has woken at the bottom of things, and come up.

      At seven o'clock Hrubý's motorcar brings the district vet: MVDr. Alois Šťastný, small and precise, with a black bag. He looks your herd over and pats their necks and finds nothing wrong with them at all, except that they seem unusually contented. He cannot think who would have complained. He looks at Hrubý. Hrubý, staring at your perfectly ordinary cows, says nothing.
    extra:
      - requires: [{note: CONFESSION}, {no_note: WARNED}]
        text: When the vet has finished, you hand him Pepík's confession. He reads it, and looks at Hrubý over his spectacles for a long time. Hrubý walks home.
      - requires: {note: WARNED}
        text: |
          Strážmistr Mach has come up behind the motorcar on his bicycle, in his best cap; he telephoned the vet about Pepík's statement on Monday. When the inspection is over, he takes Hrubý aside and writes in his notebook for a long time, and Hrubý's moustache droops, one point at a time.
      - requires: {note: RAIDED}
        text: The vet asks to see the bull. You explain that the bull is in Mr. Hrubý's barn. The vet writes that down too, and Baron is home by noon.
      - requires: {with: bara}
        text: Bára sleeps until noon. When she wakes, she says she dreamed of her mother, who said goodbye properly this time, and did not come back. She seems lighter too.
      - requires: {broken: bara}
        text: When the meadow sighed, Bára stirred on the porch, tied to the rail with your belt. It is weeks before she is quite herself. She remembers nothing of the last days, and she does not want to.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán meets Vodička at the well, and will not leave his side for the rest of the day.
      - requires: {note: ALIENS}
        text: Before the week is out, the *Národní listy* will print a short letter from an engineer at the spa about seven lights over a farm near Vlčí Brod. Nobody in the valley will ever let you forget it.
      - requires: {note: FILLING}
        text: |
          Behind its boards the Snílek goes on filling, slowly, all that autumn. By Christmas it is a pond again, with your cows grazing the high pasture above it.
      - requires: {investigator: analyst}
        text: |
          You write it up, of course: twenty pages in your small, neat hand, for the Professor. You never send it. Some cases are better left closed.
      - text: |
          You sell the heifers at the fair that afternoon, and pay the bank, and come home in the evening to your own porch and a cup of coffee.

          You never see the child again. Some evenings, though, when the light is going and the swallows are low over the meadow, you hear somebody laughing down by the dam: a child's laugh, very happy. You do not go and look. You know who it is.
      - requires: {gone: bara}
        text: Bára is gone. Some evenings, with the child's laugh down by the dam, you think you hear a girl's laugh too. Babka says they are keeping each other company, and that it is a kindness. You hope she is right.

  196:
    title: Home for Supper
    ending: dreamer
    text: |
      You sit down.

      Your mother puts a plate in front of you: dumplings, the way she made them, with butter and poppy seed and sugar, and the steam rising. The child sits down opposite you and picks up its fork. The lamp burns. The clock on the wall ticks. Outside the window there is green water, and carp going slowly by, and you do not mind at all.

      It is the best supper you have ever eaten. It goes on for ever.

      Your mother never quite turns round. You never quite see her face. You keep meaning to ask her to. There will be time. There is nothing here but time.

      In the morning, at seven o'clock, the district vet finds the farm called U Snílku without its owner: the cows standing in a ring on the meadow round the stone tower, asleep on their feet, and on the kitchen table, two plates, both clean.
    extra:
      - requires: {with: bara}
        text: Bára waits a month. Then she goes home to her grandmother's. She never speaks of it except once, to Babka, who nods and says, "They always go home in the end."
      - requires: {broken: bara}
        text: Bára is on the porch in the morning, humming your mother's tune, and does not look up when the vet's motorcar comes.
      - requires: {gone: bara}
        text: Somewhere in the green, at another table, a girl is eating supper with her own mother, who has come back to say she is sorry. You never meet. It is a very big house.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán lies by the cowshed door for the rest of his life, waiting for it to open.

  # ----------------------------------------------------- The midnight drive
  197:
    title: Wake Them
    text: |
      The herd lies in its ring round the foot of the stone tower, deep asleep, deeper than cows have any business sleeping. The Herdsman stands among them, humming. The mist is chest-deep and full of fish.

      You have to wake them. You have to get them up, all fourteen, and drive them out of the hollow and up the meadow and over the willow line, off the dreaming ground, before morning. Whatever is dreaming on this farm, it is dreaming with them. Take its dreamers away, and it will have nothing left to dream with.
    extra:
      - requires: {note: SHOT}
        text: When you step into the mist, every sleeping head in the ring turns away from you. They remember the shot. This will be harder than it should be.
    choices:
      - text: "Ring St Prokop's handbell."
        requires: {item: handbell}
        to: 198
      - text: "Call Malina, and let her lead them."
        requires: {note: MALINA}
        to: 198
      - text: "Ride in among them, Texas fashion."
        requires: {skill: Ride, min: 50}
        roll: {skill: Ride, success: 198, failure: 199}
      - text: "Leave them sleeping, and think again."
        to: 179

  198:
    title: Up the Hill
    text: |
      They come up out of the mist all together, lowing and bewildered, and you get them moving: up out of the hollow, up the long slope of the meadow, toward the willows and the dark beyond.

      The dream does not want to let them go. The mist clings to their legs. The fish swim round them. The Herdsman follows close behind, reaching out his long hands to them, humming, calling them back, and every few yards a cow stops and turns her head toward him and has to be pushed on. The child runs alongside you in its nightshirt, laughing, as if this were the best game in the world.
    extra:
      - requires: [{with: bara}, {note: BARA}]
        text: |
          Bára runs the far flank with a hazel switch, her skirts hitched up, whooping like a Texan.
      - text: |
          The willows are a long way off.
    choices:
      - text: "Drive them on."
        requires: {no_note: SHOT}
        roll: {skill: [Ride, Animal Handling, POW], success: 200, failure: 199}
      - text: "Drive them on, though they still shy from you."
        requires: {note: SHOT}
        roll: {skill: [Ride, Animal Handling, POW], bonus: -1, success: 200, failure: 199}
      - text: "Drive them on, and keep the lasso swinging."
        requires: [{item: lasso}, {skill: Throw, min: 50}]
        roll: {skill: [Ride, Animal Handling, POW], bonus: 1, success: 200, failure: 199}

  199:
    title: Stampede
    effects:
      - hp: "-2D6"
    text: |
      Something spooks them: a fish leaping out of the mist, the child's laugh, the Herdsman's long arm reaching. All at once fourteen cows are going in fourteen directions at a gallop, and you are on the ground with a hoofprint on your coat.

      They scatter across the meadow into the mist. The Herdsman goes among them, gathering them, soothing them, leading them back toward the tower.
    choices:
      - text: "Go after them."
        roll: {skill: [Ride, Animal Handling, POW], success: 200, failure: 217}

  200:
    title: Over the Willows
    text: |
      The last cow goes between the willows at the top of the meadow, and out.

      You feel it happen. One moment the herd is in the dream, mist to their bellies, fish round their knees. The next they are standing in Hrubý's turnip field in ordinary starlight, steaming, blowing, blinking: ordinary cows, wondering what in the world they are doing there.

      The Herdsman stops at the willows. He cannot come any further. He stands on the line with his long hands hanging, and looks at his cows, out of reach. Then he raises one hand to them, the way a man raises his hand to a train that is leaving. And he fades, from the edges in, like breath on a cold window, until there is nothing at the willows but the willows.

      Behind you, on the farm, the mist is thinning.
    choices:
      - text: "Sit down among the turnips, and wait for morning."
        to: 201

  201:
    title: The Midnight Drive
    ending: bittersweet
    text: |
      Dawn finds you in Hrubý's turnip field, sitting on a turnip, with fourteen of your cows grazing round you on his best crop.

      Behind you, over the willows, the farm is quiet. The mist is gone. The child is gone. The meadow lies there in the sunrise, empty, and it is still awake. You can feel it, the way you can feel somebody watching you in an empty room. It lost its dreamers, and nothing was walking when the sun came up, and so nothing stayed. But it is waiting for the next sleeper.

      At seven o'clock Hrubý's motorcar comes up the track with the district vet in it, and stops, because your herd is standing in front of it in Hrubý's turnips. MVDr. Alois Šťastný, small and precise, with a black bag, gets out and inspects them where they stand. They are perfectly healthy, he says, if a little tired. He cannot imagine who would have complained. Hrubý is purple. His turnips are ruined.
    extra:
      - requires: [{note: CONFESSION}, {no_note: WARNED}]
        text: When the vet has finished, you hand him Pepík's confession. He reads it standing in the turnips, and looks at Hrubý over his spectacles for a long time.
      - requires: {note: WARNED}
        text: |
          Strážmistr Mach has come up behind the motorcar on his bicycle, in his best cap; he telephoned the vet about Pepík's statement on Monday. When the inspection is over, he takes Hrubý aside and writes in his notebook for a long time, and Hrubý's moustache droops, one point at a time.
      - requires: {note: RAIDED}
        text: Baron, it turns out, is in Hrubý's barn, within earshot of the turnip field. The vet hears him bellow, and asks whose bull that is, and writes the answer down. Baron is home by noon.
      - requires: [{with: bara}, {note: BARA}]
        text: Bára ran the far flank of the drive with a hazel switch, her skirts hitched up and her hair flying, whooping like a Texan. She has never been so happy. Neither have you.
      - requires: [{with: bara}, {no_note: BARA}]
        text: Bára watched the whole drive from the kitchen doorway with the poker in her hands. At dawn she brings a pot of coffee out to the turnip field, sits down on a turnip beside you, and does not say a word.
      - requires: {broken: bara}
        text: When the herd crossed the willows, Bára stirred on the porch, tied to the rail, and called for you in her own voice. It is weeks before she is quite herself. She remembers nothing of the last three days, and does not want to.
      - requires: {gone: bara}
        text: You never find Bára. On the morning after the drive a carp the length of your arm is lying on the porch step, alive, looking at you. You carry it down to the brook and let it go.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán will not leave the well. He lies there with his nose to the stones, waiting for Vodička, who does not come up.
      - requires: {note: VODICKA}
        text: Ferdinand Vodička is still at the bottom of things. When you call down the well, he answers cheerfully that he is quite comfortable, thank you, and is it still Masaryk?
      - requires: {note: ALIENS}
        text: Before the week is out, the *Národní listy* will print a short letter from an engineer at the spa about seven lights over a farm near Vlčí Brod. Nobody in the valley will ever let you forget it.
      - requires: {investigator: cowboy}
        text: |
          It was the best drive of your life, and the shortest: four hundred yards, uphill, at night, in a dream. You tell it in the inn at Vlčí Brod for years, and nobody believes a word, and you do not care.
      - text: |
          You sell the heifers at the fair. And at the end of the week you go to Hrubý and offer to sell him the bottom meadow, the old pond bed, the best grass in the valley, for enough to clear your debt with the bank. You keep the house and the high pasture, and you never let a cow of yours sleep on that meadow again.

          He cannot sign fast enough.

          A week later, his cows begin to stand in circles.

  # ----------------------------------------------------- Other ends of the third night
  202:
    title: The Bottom of Things
    ending: dreamer
    text: |
      You go down the well rope hand over hand in the dark, with the dream roaring round the farm above you. The water comes up to meet your boots, and you go through it like a curtain.

      There is a room down here, green and cool, as if you had always known it would be. A floor of fine soft silt. A light that comes from nowhere. A ceiling of rippling glass, with the whole of the dreaming Snílek above it, carp and stars and sleeping cows and all, turning slowly like a great wheel. An old man in his shirtsleeves sits on an upturned bucket with a pack of cards, and smiles at you as if you were late for an appointment.

      "There you are," says Ferdinand Vodička. "I knew you'd come. They all come, in the end. Sit down. Mariáš? I'll deal."

      You sit down. It is very quiet. Nobody down here has to milk anything, or pay a bank, or be inspected by a vet at seven in the morning. Up above, the third night ends, and the dreams stay, and the farm called U Snílku goes on dreaming for ever, and you do not hear a thing.

      You win the first hand. You will have plenty of time to lose the rest.
    extra:
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán comes down the rope after you, scrabbling and whining, and lands in the silt, and puts his head in Vodička's lap, and sighs, and goes to sleep.
      - requires: {with: bara}
        text: Bára calls down the well until dawn. Then she goes home to her grandmother's, and never comes back to U Snílku.
      - requires: {broken: bara}
        text: Bára sits on the porch, tied to the rail, humming. It is the tune Vodička whistles when he wins.
      - requires: {gone: bara}
        text: Somewhere above, in the green, a girl in a white nightdress swims past the glass ceiling with her eyes closed, smiling. Vodička lifts his hat to her.

  203:
    title: Barred Doors
    effects:
      - san: "1/1D6"
      - companion: all
        san: "1/1D4"
    text: |
      You bolt the door, wedge a chair under it, close every shutter, and sit in the kitchen with the lamp turned up as high as it will go.

      It is a very long night.

      Faces come to the windows. You see them through the cracks in the shutters: a cow's face, a calf's face, a long mild face like a calf's idea of a man's. Your mother's voice calls you in to supper from outside the kitchen door, over and over, patient and loving. A brass band marches round and round the house. Something taps on the shutters, very softly, with too many knuckles.

      And all night, at the door, small fists knock, gently, at intervals, and a child's voice asks very politely whether it can come in.

      You do not answer. Toward dawn, the knocking stops.
    extra:
      - requires: [{broken: bara}, {note: TIED}]
        before: true
        text: |
          First you untie Bára from the porch rail and bring her in. She sits by the stove all night with her eyes open, humming, and does not seem to hear the knocking.
      - requires: [{broken: bara}, {no_note: TIED}]
        text: |
          Somewhere in the small hours Bára stops answering you. By dawn she is sitting by the stove with her eyes wide open, humming, fast asleep.
    choices:
      - text: "Unbar the door when the sun comes up."
        to: 217

  204:
    title: Nerve
    effects:
      - san: "1D4/1D10"
    text: |
      You walk out into the mist with nothing in your hands, stand in the middle of the meadow, and let it come.

      It comes all at once. Your mother, calling. The child, laughing. The brass band, the train, the tunnel, the door under the stairs. Every dream you ever had, and every dream the cows ever had, and every dream that Vodička and Bára and the miller who thought he was a heron ever had, pours through the mist around you like a river in flood, and all of it wants you to stay.

      You set your feet, grit your teeth, and stand there.
    choices:
      - text: "Stand your ground until dawn."
        roll: {skill: POW, success: 217, failure: 207}

  205:
    title: Condemned
    ending: lost
    text: |
      The motorcar stops at the willows, and will go no further. The district vet climbs out and walks the rest of the way: MVDr. Alois Šťastný, small and precise, with a black bag.

      He looks at your herd. He looks at the cow standing on the cowshed roof, chewing. He looks at the child, who waves to him from the kitchen window. He looks at the mossy figure by the tower, which looks back at him, and nods.

      He walks back to the motorcar without a word, and writes something in his book with a hand that shakes so badly he has to do it twice. Then he tells Hrubý to drive, now, please, at once. The order to destroy the herd comes on Friday. The bank sells your loan to Hrubý on Monday.
    extra:
      - text: |
          Hrubý never takes possession. He sends the Pešeks up to the farm once, with a halter. They come back running, and give notice the same day.
      - requires: {with: bara}
        text: Bára goes home to her grandmother's. She brings you honey cake in Klatovy every Christmas, and never stays long.
      - requires: {broken: bara}
        text: Bára will not leave U Snílku. The last you hear, she is still doing the milking every morning, with her eyes open and fast asleep, and the milk is still blue.
      - requires: {gone: bara}
        text: Bára is somewhere in the mist. On clear evenings, from the valley road, people say you can hear her singing.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán stays by the well. He looks happy.
      - text: |
          You came to the valley to rest. You will never rest again. Every night, in a rented room in Klatovy, you dream of a meadow, and something in it dreams of you.

  206:
    title: Here Lies
    ending: death
    text: |
      They bury you in the churchyard of St Prokop's, under the linden trees, on a fine autumn afternoon. Half the town comes, because funerals are free and there is a wake afterward at the inn on the square.

      Father Kolář says the Mass. The landlady of the inn cries, professionally. The Pešek brothers stand at the back, holding their caps. Bohuslav Hrubý sends a wreath the size of a cartwheel, with a black silk ribbon that says *To a Good Neighbour*. It is the worst thing he has ever done.

      On your stone, at your own request, there is a cow.

      You came to the valley to rest. You are resting now.
    extra:
      - requires: {investigator: singer}
        text: Father Kolář cannot finish the Mass. Somebody else has to read the end.
      - requires: {with: bara}
        text: Bára brings honey cake from her grandmother, leaves it on the grave, and sits beside it until dark.

  207:
    title: The Long Nap
    ending: madness
    text: |
      Somewhere between one moment and the next, you lie down and close your eyes. You only mean to rest for a moment.

      You do not get up again.

      You are not dead. You breathe. Your eyes move under the lids. Sometimes you smile, and sometimes you hum. They carry you to your bed at U Snílku, and the doctor from the spa comes, and the doctor from Klatovy, and a specialist from Prague, and none of them can wake you.

      The meadow has you now. It dreams you every night: a younger you, a child again, running down to the pond on a summer afternoon with a fishing net, while your mother calls you in to supper and the light lies gold on the water.

      It is not such a bad dream. You would not wake from it if you could.

  208:
    title: Wardrobe Removal
    text: |
      You go for the smaller wardrobe, Pepík, low and hard behind the knees. He goes down like a sack of meal, and you land on top of him.

      Franta takes one look at you, and one look back at what he saw, drops the lantern and runs. He goes over the fence like a startled bullock and away into the dark toward Hrubý's, and does not stop to look back.
    choices:
      - text: "Have a word with Pepík."
        to: 66

  209:
    title: Your Bull, Please
    text: |
      You take out your notebook, open it at the page with the X on it, and hold it up so that he can read it, and so can his mother.

      Hrubý reads it. His moustache droops, one point at a time. On the porch, the ear trumpet is pointed straight at you, quivering.

      "What do you want?" he says at last.

      Your bull, you tell him. That is all. Today.

      He shouts for the Pešeks. After a while they lead Baron out of the barn. Baron sees you, and lows, delighted, and trots home down the brook ahead of you like a dog. Behind you, on the porch, old Mrs. Hrubá is laughing.
    choices:
      - text: "Follow your bull home, and get on with the day."
        requires: {no_note: NOON}
        effects:
          - unnote: RAIDED
        to: 148
      - text: "Follow your bull home as the light goes."
        requires: {note: NOON}
        effects:
          - unnote: RAIDED
        to: 174

  210:
    title: Water on a Sunday
    effects:
      - note: WATER
    text: |
      You can still hear Hrubý's motorcar coughing away down the track. There is nobody else here but the millrace and the larks.

      You climb onto the iron footbridge, fit Hrubý's key into Hrubý's padlock, and turn it. The chain drops into the water. You lean on the winding wheel, and it groans, and the sluice gate comes up an inch, a foot, a yard.

      You fish the chain out of the water, wrap it round the winding wheel so that the gate cannot come down again, and snap Hrubý's own padlock shut on it. The key goes back in your pocket.

      The brook remembers where it used to go. It leaves the millrace in a sulk and pours down its old bed in a brown, roaring rush, driving three years of leaves and nettles before it, away south toward your farm. Behind you, at the mill, the big wheel slows, and creaks, and stops.

      By the time you are back at the head of your meadow, the water is there before you. It runs down the old channel into the hollow, finds the lowest way across the grass, and goes straight out through the empty outlet tower and away under the dam, talking to itself. Where it touches the mist, the mist hisses.

      It is not a pond. Without something to close the outlet tower, it never will be. But it is water, on the Snílek, for the first time in two years.
    choices:
      - text: "Leave the gate open, and walk home."
        requires: {no_note: NOON}
        to: 19
      - text: "Leave the gate open, and walk home as the light goes."
        requires: {note: NOON}
        to: 44

  211:
    title: The Brook Comes Home
    effects:
      - note: WATER
    text: |
      You put down your tools, walk up the dry brook past the willows, and climb onto Hrubý's footbridge with Hrubý's key in your hand. Nobody stops you. Down at the mill, a man is whistling.

      The padlock opens. The chain drops into the water. You lean on the winding wheel, the sluice gate groans up out of the brook, and the brook remembers where it used to go. It leaves the millrace and pours down its old bed toward your farm in a brown, roaring rush. Down at the mill the whistling stops, and so does the wheel.

      You fish the chain out of the water, wrap it round the winding wheel so that the gate cannot come down again, and snap Hrubý's own padlock shut on it. The key goes back in your pocket.

      By the time you are back at the head of your meadow, the water is there before you, running down through the hollow and straight out through the empty outlet tower and away under the dam. Where it touches the mist, the mist hisses.

      It is not a pond. Without something to close the outlet tower, it never will be. But it is water, on the Snílek, for the first time in two years.
    choices:
      - text: "Go and see to the north fence, where the rustlers came over."
        to: 125

  212:
    title: Open Water
    effects:
      - note: WATER
    text: |
      You climb onto the iron footbridge over Hrubý's weir with his key in your hand. The padlock opens with a clank, and the chain slides off into the water. You lean on the winding wheel, and the sluice gate groans up out of the brook.

      The brook remembers where it used to go. It leaves the millrace and pours down its old bed toward your farm in a brown, roaring rush. Behind you, the big wheel at the mill slows, and creaks, and stops. Somewhere a man in jodhpurs begins to shout.

      You fish the chain out of the water, wrap it round the winding wheel so that the gate cannot come down again, and snap Hrubý's own padlock shut on it. The key goes back in your pocket.

      By the time you are back at the head of your meadow, the water is there before you, running down through the hollow and straight out through the empty outlet tower and away under the dam. Where it touches the mist, the mist hisses.

      It is not a pond. Without something to close the outlet tower, it never will be. But it is water, on the Snílek, for the first time in two years.
    extra:
      - requires: {item: boards}
        text: The six tarred boards are waiting at the farm. With them in their grooves, this water would stay, and rise, and go on rising.
    choices:
      - text: "Leave the gate open, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Leave the gate open, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  213:
    title: The Boards Go In
    effects:
      - note: FILLING
      - lose: boards
    text: |
      You carry the six tarred boards down the meadow to the outlet tower, with the brook running beside you, and climb down into the shaft with the first of them. The water is cold and fast and up to your shins.

      The first board slides down its grooves and seats with a thump. The water backs up behind it, uncertain. The second. The third. By the sixth, the water is no longer running out under the dam. It is standing. It is spreading. It is creeping back up the hollow the way it came, over the mussel shells and the old anchor and the half oar, a hand's breadth at a time.

      The child is sitting on the dam above you with its chin on its knees, watching. It does not say anything.

      By sunset the whole bottom of the meadow will be a sheet of still brown water, knee-deep at the tower and getting deeper. Somewhere under it the ground shifts uneasily, the way a sleeper shifts when the blanket is pulled up over its face.
    choices:
      - text: "Climb out, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Climb out, and walk back up to the house as the light goes."
        requires: {note: NOON}
        to: 174

  214:
    title: Holding the Dam
    text: |
      The Snílek has been filling since you set the boards. Where the meadow was, there is water now, black and still and deep at the tower, and the mist lies on top of it, glowing. Fish move under it, real ones or not.

      The dream does not want to drown. You feel it push back. The water in the hollow trembles, the boards in the outlet tower creak, and the top one begins to lift in its grooves, as if something on the far side were leaning on it.

      You wade out along the dam and climb down into the shaft, and put your back against the boards, and hold.

      The child is on the dam above you. "Please," it says. "Please let it out. I don't want to go under." Behind it, the Herdsman stands among the cows in the shallows, watching, very sad.
    choices:
      - text: "Hold the boards until the water is over the meadow."
        roll: {skill: [STR, POW, DEX], bonus: 1, success: 186, failure: 185}

  215:
    title: Whatever You Can Carry
    extra:
      - requires: {no_note: WATER}
        before: true
        text: First you run up the dry brook in the dark with Hrubý's key, unlock his weir and wind the gate up, and the brook comes roaring down its old bed behind you all the way back to the farm.
    text: |
      The outlet tower has no boards in it, and the water is running straight through it and away under the dam. You need something to stop it, and there is nothing made for the job.

      So you use what there is. You drag the cowshed door off its hinges; for a moment it is warm in your hands, and smells of your mother's kitchen. You haul down the cart's tailboard, six bales of hay, a feather mattress and the kitchen table, and you jam them into the mouth of the shaft one on top of another, while the water climbs round your knees and the child watches from the dam with its head on one side.

      It is not a dam. It is a heap of furniture. It might hold. It might not.
    choices:
      - text: "Brace it with your own weight, and pray."
        roll: {skill: [STR, Mechanical Repair], success: 186, failure: 216}

  216:
    title: The Kitchen Table
    effects:
      - hp: "-1D4"
    text: |
      The kitchen table goes first. It shoots out through the pipe under the dam like a cork from a bottle, and the hay goes after it, and the mattress, and the cowshed door, and you very nearly go with them. You cling to the grooves in the dark with the water roaring past your legs.

      When it is over, the water is running out under the dam as fast as it comes in, and the sky over the Black Wood is going grey.
    choices:
      - text: "Climb out, and wait for the morning."
        to: 217

  217:
    title: The Fourth Morning
    text: |
      The sun comes up on the fourth morning, and the dreams stay.

      You can see it in the daylight. The mist does not lift from the meadow; it lies there, glowing faintly even in the sun, with fish moving in it. The cows stand in their ring round the stone tower, asleep on their feet. The calf that nobody bought is suckling Malina. The child is sitting at your kitchen table in its nightshirt, eating your bread. Down by the tower, a tall mossy figure is milking a cow into a bucket that is not there.
    extra:
      - requires: {note: FILLING}
        text: |
          Behind its boards the water has stopped rising, chest-deep at the tower and brown, and the mist lies on it, glowing. The cows stand in it as if it were not there.
      - text: |
          At seven o'clock, Hrubý's motorcar comes coughing up the track.
    choices:
      - text: "Wait for the vet."
        requires: {no_note: CONFESSION}
        to: 205
      - text: "Walk up to the willows to meet him, with Pepík's confession in your hand."
        requires: {note: CONFESSION}
        to: 218

  218:
    title: Blue Milk
    ending: bittersweet
    text: |
      The motorcar stops at the willows, and will go no further. The district vet climbs out: MVDr. Alois Šťastný, small and precise, with a black bag. He has one foot on the grass of your farm when you put Pepík's confession into his hand.

      He reads it twice. He looks at Hrubý, sitting at the wheel in his Sunday collar. Then he looks past you, up the meadow: at the mist that does not lift, at the cow standing on the cowshed roof, at the child waving to him from your kitchen window, at the tall mossy figure milking by the stone tower, which looks back at him, and nods.

      He folds the confession and hands it back to you.

      "A complaint shown to be false," he says, very carefully, "is no complaint at all. I have no grounds to inspect this herd. None whatever." He does not look up the meadow again. "Good morning."

      He takes his foot off your grass, climbs back into the motorcar, and tells Hrubý to drive.
    extra:
      - requires: {note: WARNED}
        text: Strážmistr Mach has come up behind the motorcar on his bicycle, in his best cap. He telephoned the vet about Pepík's statement on Monday, and he has come to see it through. Before Hrubý can turn the motorcar, Mach touches his cap to you and takes Hrubý's statement on the bonnet, in his large, careful hand.
      - text: |
          The last you see of Hrubý that morning is his face, going purple, as the vet explains to him the penalty for a false report to a state office.
      - text: |
          So the herd is not condemned. And the dreams stay, as Babka said they would.

          Life at U Snílku is very strange after that. The milk comes out blue and smells of violets, and Dr. Hájek at the spa buys every drop of it: one glass at bedtime, he tells his guests, and you will sleep like a child and dream of your mother's kitchen. You pay the bank in blue milk. The child eats at your table, and grows no older. The Herdsman does the milking at dawn, and does it better than you. Somebody at the bottom of the well has started asking for the newspaper, and you have started lowering it down. On still nights the cows float a little, and nobody in the valley comes near the willows after dark.
      - requires: {with: bara}
        text: Bára stays. She says somebody has to, and that her grandmother would never forgive her otherwise. She is the only person in the valley who can make the child go to bed.
      - requires: {broken: bara}
        text: Bára does the milking with the Herdsman every morning, with her eyes open and fast asleep, humming in her grandmother's voice. She seems content. You have stopped trying to wake her.
      - requires: {gone: bara}
        text: Bára is somewhere in the mist. On clear evenings you can hear her singing down by the tower, and the child sings with her.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán lies by the well every evening, and the voice at the bottom of it talks to him. They are both very happy.
      - text: |
          You kept the ranch. You did not quite keep your retirement. But nobody is going to take the place from you now, and most evenings, sitting on your own porch with a cup of coffee and a child humming somewhere in the dusk, you find that you do not mind.

  219:
    title: The Thread
    effects:
      - note: KID
      - san: "1/1D3"
    text: |
      You tie Babka's red thread round your wrist, three times, the way she showed you, and walk down the meadow toward the dam.

      The child is waiting on top of it, small and pale in its nightshirt. When it sees the thread it tilts its head, curious, the way you used to tilt yours at things you were not allowed to touch.

      "You don't know my name," it says. "You never asked." It climbs down off the dam and stands in front of you, and tells you: the small name, the one your mother called up the stairs. It is yours.

      Then it turns and walks away into the mist, and looks back over its shoulder, waiting for you to follow. The thread is warm on your wrist. Babka said it would pull you back, once.
    choices:
      - text: "Follow it into the mist."
        to: 192

  220:
    title: A False Report
    effects:
      - note: WARNED
    text: |
      Mach reads Pepík's confession twice, moving his lips. When he reaches the part about the letter to the vet, his moustache goes very still.

      "Rustling, I could have let go," he says. "A man's bull, a neighbour's quarrel. But a false report to a state office, to get an honest farmer's herd shot." He folds the paper carefully and hands it back. "That is my business."

      He winds the telephone on the wall, asks the exchange for the District Veterinary Office in Klatovy, and talks to somebody there for a long time in his official voice, spelling Hrubý's name twice.

      "The vet must still come," he says when he hangs up. "Once a complaint is filed, he has to. That's the law. But he knows now what this one is worth, and I'll be there with him on Wednesday morning. And Mr. Hrubý will be hearing from me before then."
    choices:
      - text: "Thank him, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank him, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank him, and go out into the dusk."
        requires: {note: LATE}
        to: 77
