        to: 76
      - text: "Give it up, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  86:
    title: After Hours
    effects:
      - note: SNILEK
      - note: RIGHTS
      - note: LULLABY
      - note: DREAMWORK
      - note: MARTIANS
      - note: AWAY
      - unnote: NOON
      - unnote: LATE
      - companion: bara
        san: "-1D6"
      - companion: sultan
        san: "-1D4"
    text: |
      You read until a minute to six. Then, while Miss Doubravová consults her watch and puts on her hat, you step behind the last stack and sit down on the floor in the dark with a pile of books. She turns off the electric light. She does not see you. The key turns in the lock, and her footsteps go away down the stairs.

      You read all night by the light of the streetlamp outside the window.

      You read the parish history: the Swedes, the broken dam, the three nights, the miller who thought he was a heron, and the water right of 1785 in a footnote. You read a little green book of forest songs and find the Snílek Lullaby on page ninety-one, and copy it out. You read the Professor's great blue book on dreams until the words swim. You read a yellow pamphlet about Martians, with a drawing of one on page twelve, and find it no more absurd than anything else you have read tonight.

      At about three in the morning you think of the farm. Of Bára alone in the kitchen with every lamp lit. Of the child at the door, asking very politely to come in.

      You go on reading. There is nothing else you can do. The door is locked.
    choices:
      - text: "Read until the sky goes grey."
        to: 87

  87:
    title: Miss Doubravová Screams
    text: |
      At eight o'clock on Tuesday morning Miss Doubravová unlocks the library to dust it, and finds you asleep at the reading table with your face in a book of folk songs.

      She screams. It is a short, sharp, well-bred scream, and she stops it at once, as if ashamed of it. Then she looks at the books piled round you, and at your face, and her own face changes.

      "You had better go home," she says. "Quickly. And you will put those back on the shelves *first*."

      Fanda has spent the night in the yard of the Golden Bull, where the landlady, Mrs. Holubová, found him and gave him oats and a blanket, and does not charge you for either. You drive home up the valley in the grey morning with your eyes full of grit and your head full of songs.
    choices:
      - text: "Drive home, and see what the night has done."
        to: 147

  # ----------------------------------------------------- The Golden Bull
  88:
    title: The Golden Bull
    effects:
      - note: INN
    text: |
      The swinging doors of the Golden Bull swing. They creak, too, exactly as they ought to. Mrs. Holubová's late husband saw a picture of a saloon in an American magazine in 1911, and would not rest until he had a pair. He died in 1919. The doors have outlived him. They swing shut behind you with a long, slow, satisfied creak, and every head in the place turns.

      It is dark inside, and smells of beer and sawdust and pipe smoke. A man at the piano in the corner plays the same waltz over and over, not very well. Three old men are playing cards by the stove. Behind the bar, polishing a glass, stands Marie Holubová: fifty, handsome, with forearms like a blacksmith's and the expression of a woman who has seen everything twice.

      At the corner table, with their backs to the wall, sit the Pešek brothers.

      They are drinking slivovice as if it were water, and they are both as white as milk. Franta's hands shake so badly that he has to hold his glass in both of them. Pepík is staring at the tabletop as if there were something written on it. When they see you, they both flinch.

      The piano stops. Somebody coughs. Then the piano starts again, the same waltz, a little faster.

      "Coffee?" says Mrs. Holubová. "Or something stronger? You look as if you've had a night of it. Those two certainly have."
    extra:
      - requires: {note: CONFESSION}
        text: Pepík will not meet your eye at all. His X is in your pocket, and he knows it.
      - requires: {note: RAIDED}
        text: Franta smells, faintly but unmistakably, of bull.
      - requires: {investigator: singer}
        text: |
          Mrs. Holubová looks at you twice. "Well," she says. "Rozálie Vaňková. My mother always said you'd come to a bad end." She pours you a glass on the house. "She was wrong, I see. A pity. She was so rarely wrong."
    choices:
      - text: "Ask the landlady about Vodička, and the Hrubýs."
        to: 89
      - text: "Sit down with the Pešeks and buy them a drink."
        requires: {no_note: CONFESSION}
        roll: {skill: [Psychology, Fast Talk, Intimidate], success: 90, failure: 91}
      - text: "Buy another round, and another."
        to: 92
      - text: "Finish your coffee, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Finish your coffee, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Finish your coffee, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  89:
    title: The Landlady
    effects:
      - note: MOTHER
    text: |
      Mrs. Holubová leans her forearms on the bar and tells you everything, which is what landladies are for.

      Ferdinand Vodička drank here every Saturday for forty years. On his last Saturday, at the end of January, he sat in that corner with one glass of beer for three hours and never touched it. When she asked him what was the matter, he said he had been dreaming about the bottom of the pond, and he thought he might go down and have a look. She thought he meant he was going fishing.

      As for the Hrubýs. "Bohuslav," she says, and rolls her eyes up to the smoke-brown ceiling. "His father made money, and he spends it. A tractor that won't go, a motorcar he can't drive, a mill that nobody needs. And now he wants your farm, because he can't bear that somebody else has it." She lowers her voice. "But his mother. Old Anežka. That's a different matter. She thinks her son's a fool, and she's not wrong. She can't abide his schemes. And she loves a good scene: a row, a scandal, an opera. If you ever need to get round Bohuslav, you get round his mother."
    choices:
      - text: "Thank her, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Thank her, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Thank her, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  90:
    title: Two Frightened Men
    effects:
      - note: CONFESSION
    text: |
      You sit down with the Pešeks and order a bottle. They watch you do it the way two oxen watch a stranger open a gate.

      It does not take much. They have been waiting since Sunday night for somebody to tell. They tell it all at once, both talking, contradicting each other: the farm in the dark, the bull on his halter, and the thing they saw there, which they cannot describe and keep trying to. Franta starts to cry. Pepík pats his hand.

      And then, because you ask, they tell you why they were there. Mr. Hrubý sent them for the bull, because the bull beat his own at the spring show in Klatovy. And the letter to the vet: there is no foot-and-mouth. Mr. Hrubý made it up, so that the vet would shoot your herd and the bank would sell him your farm.

      You write it down. Pepík signs it with an X. Franta signs it with another, larger, out of brotherly feeling.
    extra:
      - requires: {note: RAIDED}
        text: |
          "Your bull's in the master's barn," Pepík adds. "Behind the feed sacks. He likes it there. He likes the hay."
    choices:
      - text: "Pocket the confession, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Pocket the confession, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Pocket the confession, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  91:
    title: Clammed Up
    text: |
      You sit down with the Pešeks. Franta looks at Pepík. Pepík looks at Franta. Then Franta puts down his glass and cracks his knuckles, one at a time, slowly, all ten of them.

      Nobody says anything. After a while you go back to the bar.
    choices:
      - text: "Finish your drink, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
      - text: "Finish your drink, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        to: 76
      - text: "Finish your drink, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  92:
    title: Another Round
    text: |
      You buy a round. Then another. The man at the piano plays the waltz. The old men by the stove deal another hand. The slivovice is plum brandy, clear as water and strong as a mule, and it goes down warm and sits in your stomach like a coal.

      By the fourth round Franta Pešek is maudlin, and tells you he loves his mother. By the fifth he is weeping about the thing he saw on Sunday night. By the sixth he has stopped weeping, and is looking at you as if you were the thing he saw on Sunday night.

      He stands up. His chair goes over behind him. The piano stops. Pepík stands up too, apologetically, because he is Franta's brother and that is what brothers do.

      The old men by the stove pick up their cards and their glasses and move, without hurrying, to the far end of the room.
    choices:
      - text: "Throw the first punch."
        roll: {skill: Fighting (Brawl), success: 93, failure: 94}
      - text: "Duck, and let the chair go past."
        roll: {skill: Dodge, success: 93, failure: 94}
      - text: "Keep drinking. There's nowhere you'd rather be."
        to: 95

  93:
    title: Last One Standing
    effects:
      - hp: "-1D2"
    text: |
      It is a magnificent fight. It goes the whole length of the bar and back. A table breaks, and two chairs, and the window of the snug. The man at the piano plays throughout, faster and faster, and never once looks up.

      At the end of it Franta is asleep under the card table, Pepík is hanging upside down over the bar where you have folded him, and you are the only one standing.

    extra:
      - requires: {no_note: CONFESSION}
        text: |
          "Mr. Hrubý sent us," says Pepík, upside down, before you have asked him anything. "For the bull. And the letter to the vet's a lie. He made it up so they'd shoot your cows. Please don't hit me again."

          You write it down, and he signs it upside down with an X.
      - requires: {note: CONFESSION}
        text: |
          "Please don't hit me again," says Pepík, upside down. "I already signed."
      - requires: {note: RAIDED}
        text: |
          "Your bull's in the master's barn," Pepík adds, still upside down. "Behind the feed sacks."
      - text: |
          Mrs. Holubová gives you the bill for the window.
    choices:
      - text: "Pay for the window, and go back out into the square."
        requires: {no_note: NOON}
        effects:
          - note: CONFESSION
        to: 75
      - text: "Pay for the window, and go back out into the square."
        requires: [{note: NOON}, {no_note: LATE}]
        effects:
          - note: CONFESSION
        to: 76
      - text: "Pay for the window, and go out into the dusk."
        requires: {note: LATE}
        effects:
          - note: CONFESSION
        to: 77

  94:
    title: The Swinging Doors
    effects:
      - hp: "-1D6"
    text: |
      You find out what the swinging doors are for.

      You go out through them horizontally, at speed, across the pavement and into the horse trough. The doors swing behind you, creak, creak, creak, very satisfied. Inside, the waltz starts up again.

      After a while Mrs. Holubová comes out with your hat.
    choices:
      - text: "Wring out your hat, and go back out into the square."
        requires: {no_note: NOON}
        to: 75
