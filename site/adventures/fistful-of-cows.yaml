# A Fistful of Cows: a solo gamebook for the engine in site/app.js. Full format: docs/adventure-format.md.
#
# How the file works
#   sections      numbered passages. Each has text, optional effects, optional extra paragraphs, and choices.
#   choices       `to: N` turns to section N. `roll:` rolls d100 against a skill instead:
#                   roll: {skill: Ride, difficulty: hard, success: N, failure: M, bonus: 1}
#                 `skill` may be a list; the investigator rolls their best one. difficulty: regular | hard | extreme.
#   effects       applied when a section is entered, or when a choice is taken:
#                   san: "1/1D4"  a Sanity roll: lose 1 on a pass, 1D4 on a fail.  san: "-2" or "+1D3": a straight change.
#                   hp, luck      straight changes, e.g. hp: "-1D6".
#                   gain / lose   an item id.   note / unnote   a journal word.
#                   companion: bara | sultan | all, with san: ... or status: with | broken | lost | dead.
#   requires      a choice (or an extra paragraph) only shows when this holds. A list means all of them.
#   extra         paragraphs shown after the text when their `requires` holds (`before: true` puts one ahead of the text).
#                   item, no_item, note, no_note, with (companion present and sane), broken, gone, skill + min, any: [...]
#   ending        marks an ending section: triumph | bittersweet | escape | lost | dreamer | bovine | taken |
#                 bargain | disgrace | death | madness (any word works; see site/app.js for the labels).
#
# Time of day: NOON and LATE are journal words. Places that can be visited at different times of day check them
# to know which hub comes next. They are cleared at dusk, and at the start of Tuesday.
id: fistful-of-cows
title: A Fistful of Cows
series: A solo investigation, 1927
subtitle: Three days, three nights, and a meadow that dreams.
blurb: |
  September 1927. You have spent your savings and a bank loan on a little farm in the Bohemian borderland: a stone house, a well, fourteen red-pied cows, a bull, and a long green meadow running down to the edge of the Black Wood. It was going to be your retirement.

  Then the cows began to behave strangely. On Wednesday the district vet comes to inspect them, because your neighbour says they are diseased. That gives you three days. And three nights.
investigator_intro: Four people could have bought the farm called U Snílku. Each of them came to the valley to rest. Choose the one who will have to stay awake.
# Shape this story is held to by `gamebook stats` and the test suite. Its rhythm (few short beats, many long
# set pieces) and its low death rate are deliberate: see docs/story-log.md before changing them.
