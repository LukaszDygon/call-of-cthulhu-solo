        to: 76
      - text: "Wring out your hat, and go out into the dusk."
        requires: {note: LATE}
        to: 77

  95:
    title: Slivovice
    effects:
      - note: AWAY
      - unnote: NOON
      - unnote: LATE
      - companion: bara
        san: "-1D6"
      - companion: sultan
        san: "-1D4"
    text: |
      You keep drinking. So, it turns out, do the Pešeks, and the old men by the stove, and the man at the piano, and at some point the whole of the Golden Bull is singing a song about a girl from Domažlice and her goose, and you are standing on a table conducting it.

      You remember the gendarme arriving. You remember explaining to him, slowly and clearly, about the cows. You remember that he was very kind about it.

      You wake on a plank bed in a whitewashed room with a barred window and a bucket. It is morning. Somewhere outside, a cockerel is crowing as if he had something to prove.

      You spent the night in the cells. Bára spent it alone on the farm.
    choices:
      - text: "Hold your head, and wait for somebody to come."
        to: 102

  # ----------------------------------------------------- The gendarmerie
  96:
    title: The Gendarmerie
    effects:
      - note: POLICE
    text: |
      The gendarmerie station is two rooms and a cell behind a door with a brass bell-pull. In the front room, under a portrait of President Masaryk and a map of the district stuck full of pins, sits Strážmistr Jaroslav Mach: forty-four, solid, with a magnificent moustache and the patient eyes of a man who has heard every story in the valley at least twice.

      He knows who you are. Everybody does. He asks after your cows with a perfectly straight face.
    extra:
      - requires: {investigator: gendarme}
        text: |
          Then he looks at you properly, and his chair goes over backward as he jumps to his feet. "Sergeant Mráz! Sir!" He salutes. He is blushing. He served under you at Klatovy from 1910 until the war, a big, shy recruit who could not write a report without blotting it. He writes a very good report now, he says. You taught him.
    choices:
      - text: "Ask to see the file on Ferdinand Vodička."
        requires: {investigator: gendarme}
        to: 97
      - text: "Ask to see the file on Ferdinand Vodička."
