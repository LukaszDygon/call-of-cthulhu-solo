  derringer:
    name: Derringer
    text: Pearl-handled, two barrels, two shots. A gift from an admirer, or possibly from his wife.
  harmonica:
    name: Harmonica
    text: A Hohner Marine Band, dented, that has played to a great many cows.
  cigars:
    name: Box of cigars
    text: Twenty-five Havanas. Sometimes a cigar is just a cigar.
  casebook:
    name: Casebook
    text: Thirty years of other people's dreams, in a small neat hand. A bonus die on Psychology.
