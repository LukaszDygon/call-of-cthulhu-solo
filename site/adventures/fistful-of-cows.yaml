        requires: {any: [{with: bara}, {gone: bara}]}
        to: 204

  177:
    title: Bára
    effects:
      - note: TIED
    text: |
      You run down the meadow after her and catch her at the edge of the mist, with the glowing water lapping at her knees. She does not know you. She fights you with the strength of a sleepwalker, scolding you in her grandmother's voice, and you get your arms round her and haul her back up the slope, step by step, while the fish nose at your boots.

      You sit her on the porch and tie her to the rail with your belt, gently, the way you would tie up a boat. She stops struggling. She sits there with her eyes wide open, humming.

      She is safe. She is not awake. That will have to do.
    choices:
      - text: "Turn back to the meadow."
        to: 179

  178:
    title: The Mist
    effects:
      - companion: bara
        status: lost
      - san: "1/1D4"
    text: |
      You run, but she is quicker. She walks into the mist as if into a warm bath, up to her knees, her waist, her shoulders, humming, and you lunge for her hand and catch only mist.

      She does not go under. She simply goes. One moment there is a girl in a white nightdress walking into the glowing water, and the next there is only the water, and a great gold carp turning slowly where she was.

      You stand at the edge with your hands full of nothing.
    choices:
      - text: "Turn back to the meadow."
        to: 179

  179:
    title: Now
    text: |
      The child is still on the dam. The Herdsman is still at the tower. The ground is still beating like a heart under your feet, and the night is half gone.

      Whatever you are going to do, do it now.
