  sections: [195, 240]
  path_mean: [28, 45]
  companion_break: [0.1, 0.5]
  endings_reached: 15
  cosmetic_choices: 0.1
start: 1
on_death: 206
on_madness: 207

fates:
  lost: taken by the mist

bouts:
  - "You laugh until you have to sit down in the dust."
  - "For a long moment you are certain you are eight years old, and late for supper."
  - "You hear your mother calling you, from somewhere under the ground."
  - "Your hands will not stop shaking. You put them in your pockets, and they shake there."
  - "You low, softly, like a cow. You do not know why."
  - "You weep, and then you are hungry for dumplings, and then you weep again."

