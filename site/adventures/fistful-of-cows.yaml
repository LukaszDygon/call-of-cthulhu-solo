  100:
    title: One Question Too Many
    text: |
      You ask him why a man can write a lie to the veterinary office and have it believed. You ask him what the gendarmerie is for, if not for that. You ask him whether he has ever seen your cows, and whether he would like to.

      Mach listens, and smooths his moustache, and says that it is not a police matter. He says it kindly. He says it a second time, less kindly.

      "I'd leave it there," he says, "if I were you."
