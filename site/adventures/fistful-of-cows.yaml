  # ----------------------------------------------------- Hrubý's estate
  149:
    title: Hrubý's Estate
    effects:
      - note: RECKONING
      - note: WEIR
    text: |
      Hrubý's farm is everything yours is not. The barns are new and red and enormous, with HRUBÝ painted on the end of the biggest in white letters a yard high. The yard is cobbled. There is a big red mill beside a new-dug millrace. Up the hill behind it you can see a concrete weir across the brook.

      In the middle of the yard stands a Praga tractor, painted green and gold, with a brass plate on the radiator. It has stood in exactly that spot since Easter. Chickens roost on it.

      The Pešek brothers are mending a cart by the barn door. Both of them are wearing bandages somewhere. When they see you come through the gate, they put down their tools and go into the barn, and shut the door behind them.

      Hrubý comes out of the house in jodhpurs and a smoking jacket, with his moustache freshly waxed, and plants himself on his doorstep with his thumbs in his waistcoat.

      "Well," he says. "Come to sell?"

      On the porch behind him, in a wicker chair, sits a tiny old woman in black silk with an ear trumpet in her lap: old Mrs. Hrubá, his mother, with the same nose on a much better face. She does not say anything. She raises the ear trumpet, points it at you, and waits.
    extra:
      - requires: {no_note: WATER}
        text: |
          The millrace roars through the mill, full of your water. Up at the weir the sluice gate is wound shut and chained.
      - requires: {note: WATER}
        text: The millrace is dry, and the big wheel hangs still. Hrubý's face says he knows exactly who has his key.
      - requires: {note: CONFESSION}
        text: His eyes go to your coat pocket, where a person keeps a notebook. He knows. A small bead of sweat appears at the edge of his moustache.
      - requires: {note: RAIDED}
        text: From inside the barn comes a long, aggrieved bellow. It is Baron. You would know it anywhere.
      - requires: [{note: WARNED}, {no_note: MACH}]
        text: Strážmistr Mach came up here yesterday evening with his notebook. It shows. Hrubý will not quite meet your eye.
      - requires: {note: MACH}
        text: |
          Hrubý's ears are still red from yesterday. "That gendarme of yours," he says bitterly, "has no respect for property."
      - requires: {note: MOTHER}
        text: The old woman's eyes are very bright. You have the distinct impression that she is hoping for a scene.
      - requires: {investigator: singer}
        text: |
          The ear trumpet lowers. "Rozálie Vaňková," says old Mrs. Hrubá, in a voice like a door creaking. "I heard you sing Rusalka in Prague, in 1905. I cried for a week."
    choices:
      - text: "Show him Pepík's confession, and name your price."
        requires: [{note: CONFESSION}, {no_item: weir-key}]
        to: 150
      - text: "Show him Pepík's confession, and demand your bull."
        requires: [{note: CONFESSION}, {note: RAIDED}, {item: weir-key}]
        to: 209
      - text: "Lay down the law: the water right of 1785."
        requires: [{note: RIGHTS}, {no_item: weir-key}]
        roll: {skill: [Law, Persuade, Intimidate], success: 151, failure: 152}
      - text: "Walk past him, and pay your respects to his mother."
        requires: {no_item: weir-key}
        to: 153
      - text: "Walk into his barn, and fetch your bull."
        requires: {note: RAIDED}
        roll: {skill: [Animal Handling, Stealth, STR], success: 157, failure: 158}
      - text: "Call him a coward, to his face."
        requires: {no_note: NOON}
        to: 159
      - text: "Leave him to his tractor, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Leave him to his tractor, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  150:
    title: The Price of Silence
    effects:
      - gain: weir-key
    text: |
      You take out your notebook, open it at the page with the X on it, and hold it up so that he can read it, and so can his mother.

      Hrubý reads it. His moustache droops, one point at a time.

      "It's a forgery," he says. "Pepík can't write."

      You point out that Pepík did not write it. You did. Pepík only signed it. And you point out, too, that the district vet will be at U Snílku tomorrow at seven, and so will you, and so, if necessary, will this notebook, and the gendarmes, and the *Národní listy*.

      There is a long silence. On the porch, the ear trumpet is pointed straight at you, quivering.

      "What do you want?" says Hrubý at last.

      You tell him: the key to his weir. He takes it off his watch-chain with fingers that are not quite steady, and drops it into your palm.

      Behind you, on the porch, old Mrs. Hrubá is laughing.
    extra:
      - requires: {note: RAIDED}
        text: And your bull, you add. He shouts for the Pešeks, and after a while they lead Baron out of the barn. Baron sees you and lows, delighted, and trots home down the brook ahead of you like a dog.
    choices:
      - text: "Walk straight up to the weir, and open it."
        requires: {no_note: WATER}
        effects:
          - unnote: RAIDED
        to: 212
      - text: "Pocket the key, and get on with the day."
        requires: {no_note: NOON}
        effects:
          - unnote: RAIDED
        to: 148
      - text: "Pocket the key, and get back to the house as the light goes."
        requires: {note: NOON}
        effects:
          - unnote: RAIDED
        to: 174

  151:
    title: Chapter and Verse
    effects:
      - gain: weir-key
    text: |
      You recite it to him, word for word: the deed of 1785, in the name of His Imperial Majesty, granting to the fishpond called Snílek the whole water of the brook from the Feast of St George until the Feast of St Wenceslas, every year, for ever. You tell him where the copies are. You tell him what a court will say.

      Hrubý opens his mouth to shout, and nothing comes out.

      "St Wenceslas is tomorrow," he says at last, feebly. "It's nearly over anyway."

      Exactly, you tell him. Until tomorrow, the water is yours. And you want it tonight.

      He looks at his mother. His mother looks at him over the ear trumpet, the way she looked at him when he was five.

      He takes the weir key off his watch-chain, and gives it to you.
    choices:
      - text: "Walk straight up to the weir, and open it."
        requires: {no_note: WATER}
        to: 212
      - text: "Pocket the key, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Pocket the key, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  152:
    title: Lawyers
    text: |
      Hrubý laughs. He laughs from the belly, with his thumbs in his waistcoat.

      "Lawyers," he says. "You want lawyers? I have three lawyers in Klatovy and one in Prague, and they will still be arguing about your precious deed when you and your cows are in the knacker's yard." He turns his back on you. "Good day."

      The ear trumpet lowers, disappointed.
    choices:
      - text: "Leave him to his laughing, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Leave him to his laughing, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  153:
    title: Mrs. Hrubá
    text: |
      You walk past Hrubý as if he were a gatepost, climb the steps to the porch, and bow to his mother.

      She looks you up and down. Then she gets up out of the wicker chair, much more quickly than you expected, takes your arm, and leads you indoors to her parlour, leaving her son on the doorstep with his mouth open.

      The parlour is dark and crowded and smells of beeswax and camphor. There are photographs on every surface: Hrubý as a fat baby, Hrubý as a fat boy, Hrubý as a fat young man in a hussar's uniform that has clearly never been near a horse. There is a gramophone with a great brass horn, and a record on it: *Rusalka*, the Song to the Moon.

      She sits you down, and pours you a glass of something brown, and one for herself, and lifts the ear trumpet.

      "Well?" she says.
    choices:
      - text: "Sing for her."
        requires: {investigator: singer}
        to: 154
      - text: "Tell her what her son has been up to."
        requires: {any: [{note: CONFESSION}, {note: MOTHER}]}
        to: 155
      - text: "Charm her."
        roll: {skill: [Charm, Persuade, Fast Talk], success: 155, failure: 156}
      - text: "Make your excuses, and leave her to her gramophone."
        requires: {no_note: NOON}
        to: 148
      - text: "Make your excuses, and leave her to her gramophone as the light goes."
        requires: {note: NOON}
        to: 174

  154:
    title: Song to the Moon
    text: |
      You sing for her: the Song to the Moon, unaccompanied, there in the crowded parlour, the way you sang it at the National Theatre in 1905. Your voice is not what it was at the top. It does not matter.

      Halfway through, old Mrs. Hrubá puts down her glass. By the end she is weeping into her ear trumpet, and outside on the porch her son has taken off his hat.
    choices:
      - text: "Bow."
        to: 155

  155:
    title: The Spare Key
    effects:
      - gain: weir-key
    text: |
      When you have finished, old Mrs. Hrubá puts down the ear trumpet and finishes her glass and gets up.

      She walks out onto the porch, where her son is still standing on the step. She reaches up and takes him by the ear, and with the other hand she unhooks the big iron key from his watch-chain, while he says *Mama*, and *Mama, please*, and *Mama, the Pešeks are watching*.

      She puts the key in your hand.

      "The weir," she says. "Open it. It was never his to shut. His father would be ashamed of him." She lets go of the ear. "And whatever else he's taken from you, Bohuslav will give it back today. Won't you, Bohoušku?"

      Hrubý, rubbing his ear, says that he will.
    extra:
      - requires: {note: RAIDED}
        text: Within the hour a very subdued Pepík leads Baron down the brook to your farm, and Baron goes into his stall and lies down as if he had never been away.
    choices:
      - text: "Walk straight up to the weir, and open it."
        requires: {no_note: WATER}
        effects:
          - unnote: RAIDED
        to: 212
      - text: "Thank her, and get on with the day."
        requires: {no_note: NOON}
        effects:
          - unnote: RAIDED
        to: 148
      - text: "Thank her, and get back to the house as the light goes."
        requires: {note: NOON}
        effects:
          - unnote: RAIDED
        to: 174

  156:
    title: Cake
    text: |
      You do your best. Old Mrs. Hrubá listens to all of it through the ear trumpet, nodding, and then she cuts you a slice of poppy-seed cake, and pours you another glass, and talks for forty minutes about her late husband's kidneys.

      At the end of it she pats your hand, and sees you to the door, and gives you the rest of the cake in a napkin. That is all she gives you.
    choices:
      - text: "Take the cake, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Take the cake, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  157:
    title: Baron Comes Home
    effects:
      - unnote: RAIDED
    text: |
      You walk across the cobbles past Hrubý, who splutters, and haul open the barn door.

      Baron is at the back of the barn, behind a heap of sacks, eating Hrubý's best hay. He sees you, and lows, and comes to you like a dog. You lead him out past the Pešeks, who flatten themselves against the wall, and past Hrubý, who opens his mouth and shuts it again, and home down the brook.
    choices:
      - text: "Put him in his stall, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Put him in his stall, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  158:
    title: Tossed
    effects:
      - hp: "-1D6"
    text: |
      Baron is at the back of the barn, eating Hrubý's best hay. He has made friends here. When you take hold of his halter, he tosses his head, and you go over a heap of sacks and land on your back in the straw, with the Pešeks standing over you looking embarrassed.

      Hrubý is laughing in the doorway. Baron goes on eating.
    choices:
      - text: "Pick the straw out of your hair, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Pick the straw out of your hair, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  159:
    title: A Matter of Honour
    text: |
      You tell him what you think of him. You tell him he is a coward who sends other men to steal in the night, and lies to the vet because he has not the courage to fight fair.

      Hrubý goes white, then red, then a curious mottled purple. He pulls off one yellow driving glove, finger by finger, and slaps you across the face with it.

      "Pistols," he says. "My grandfather's duelling pistols. Here, in the yard. At noon." He looks at his watch. "That gives you an hour and a half to make your peace with God."

      The Pešeks have come out of the barn to watch. On the porch, the ear trumpet is raised, and trembling.
    choices:
      - text: "Accept. Pistols at noon."
        to: 160
      - text: "Laugh in his face, and walk away, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Laugh in his face, and walk away, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  160:
    title: High Noon
    ending: disgrace
    text: |
      At noon the sun stands straight overhead, and there are no shadows in Hrubý's yard at all.

      The pistols are long and black and very old, with silver on the butts. Hrubý's grandfather fought one duel with them, in 1848, and missed. Franta Pešek holds the box. Pepík is the other second. He is crying.

      You stand back to back with Hrubý in the middle of the cobbles. He smells of moustache wax and fear. Twenty paces. You count them aloud together, in step. The chickens on the tractor watch. A fly crosses the yard from left to right, very slowly. Somewhere far down the valley, faint, the bell of St Prokop's begins to ring the Angelus.

      You turn. He turns. His eyes narrow. So do yours.

      You both fire.

      You both miss. Both bullets, by a miracle that will be discussed in Vlčí Brod for the next forty years, strike the Praga tractor in the middle of the yard. One goes through the radiator. The other hits something deep in the engine. And the tractor, which has not run since Easter, coughs, and shudders, and roars into life for the first time in its existence, scatters the chickens, and drives itself slowly and majestically across the yard, through the fence, down the bank and into the millpond, where it sinks with a long, sad gurgle.

      There is a silence.

      The gendarme sergeant from Vlčí Brod, Strážmistr Mach, arrives on his bicycle at twenty past twelve, having heard the shots from the road. He arrests you both. You spend the third night in the cells at Vlčí Brod, with Hrubý snoring in the cell next door. In the morning, when you are let out, you walk home up the valley, and the farm is still dreaming, and the mist on the meadow does not lift. It never will now.

      You fought a duel over a water meadow. In 1927. At your age.
    extra:
      - requires: {investigator: cowboy}
        text: You stood in a street at noon once before, in Texas, in 1889, and walked away from it. You were nearly forty years younger, and a great deal wiser.
      - requires: {with: bara}
        text: Bára spent the third night alone on the farm. When you come home, she is sitting on the step with the child asleep in her lap, and she does not look up.
      - requires: {broken: bara}
        text: Bára spent the third night alone on the farm. In the morning she is still milking cows that are not there, and she will be milking them for the rest of her life.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán is lying by the well when you come home. He does not get up.

  # ----------------------------------------------------- Other Tuesday errands
  161:
    title: Under the Old Harness
    effects:
      - gain: boards
    text: |
      The hayloft is dim and hot. You find them at the far end, under the old harness, wrapped in sacking: six oak boards, each as long as a man, tarred black, cut to fit the grooves of the outlet tower.

      Beside them, in the hay, is the hollow where the child sleeps. It is full of small things: a cotton reel, a horse chestnut, a bird's egg, a button. You recognise every one of them. You lost them all, one by one, between the ages of five and nine.
    choices:
      - text: "Carry the boards down, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Carry the boards down, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  162:
    title: Hay Fever
    effects:
      - san: "0/1"
    text: |
      You turn over the whole loft. You find a rusty sickle, a hen's nest and a cat. You also find the hollow where the child sleeps, full of small things you lost as a child: a cotton reel, a horse chestnut, a button. You put them back very carefully, and find nothing else.
    choices:
      - text: "Climb down empty-handed, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Climb down empty-handed, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  163:
    title: Through the Cowshed Door
    text: |
      The child takes your hand, leads you to the cowshed, and opens the door.

      It is not the cowshed. It is the house you grew up in, on a morning fifty years ago. You step through, and the door closes behind you, and it is all there: the smell of the stove, the clock on the wall, the crack in the step, the light coming in through the window at exactly the angle it came in when you were eight. Your mother is at the window with her back to you, doing something at the sink. She is younger than you are now. She does not turn round.

      The child pulls you through the house, showing you things. Here is where you hid. Here is where you cut your knee. Here is the cupboard under the stairs. Everything is exactly as it was, and nothing hurts, and nobody wants anything from you, and you have not been so happy in fifty years.

      "Stay for supper," says the child. "Please? Mama's making dumplings."

      At the sink, without turning round, your mother begins to hum.
    choices:
      - text: "Stay a while."
        requires: {no_item: red-thread}
        to: 196
      - text: "Stay a while. Babka's thread will pull you back."
        requires: {item: red-thread}
        to: 164
      - text: "Come back out, now, while you still can."
        to: 165

  164:
    title: The Thread
    effects:
      - lose: red-thread
      - san: "1/1D3"
    text: |
      You stay. You sit down at the kitchen table, and your mother puts a plate of dumplings in front of you without turning round, and you pick up your fork.

      Something pulls at your wrist.

      It is Babka's red thread. You do not remember tying it on, but it is there, tight, cutting into your skin, and it is pulling: gently at first, then hard, then so hard that the chair goes over and you are dragged backward across the kitchen floor, through the door, and out into the dust of your own yard at U Snílku, on your back in the sunshine, with Malina looking down at you.

      The thread is gone. There is a red mark round your wrist where it was. Babka said it would only work once.
    choices:
      - text: "Get up."
        to: 165

  165:
    title: Out Again
    effects:
      - note: KID
      - san: "1/1D4"
    text: |
      The child is standing on the threshold of the cowshed beside you, in the sunshine of your own yard, holding your hand.

      "You'll come back," it says. It is not a question. Then it tells you its name, the small one, the one your mother used, and lets go of your hand, and runs off down the meadow into the mist, laughing.

      Behind you, the cowshed is a cowshed. Malina looks at you over her stall, chewing.
    choices:
      - text: "Shut the cowshed door, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Shut the cowshed door, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  166:
    title: Advice from Below
    effects:
      - note: SNILEK
      - note: HEART
    text: |
      "Third day," says Vodička, before you have said anything. "I can feel it from here. Everything's very loud today. You'd better do something about it, hadn't you?"

      You ask him what.

      "Well," he says. "There's three ways, as I see it. Or four. You can fill it up again: water over it, and it sleeps. That's the old way. You can sing it down, like old Father Matyáš did, after the Swedes broke the dam in 1641; that's the other old way. Or you can go and look at what it's dreaming, and face it, and let it go. Your little one, I mean. The child. It's yours, you know. It's dreaming you hardest of all.

      "And whatever you do, do it at the monk, the outlet tower. That's where it's deepest. That's where I went down." A pause. "Or there's the fourth way. You could come down here, with me. There's cards. There's room."
    extra:
      - requires: {no_note: VODICKA}
        before: true
        text: |
          You lean over the well. Forty feet down the water is a coin of light, and somebody under it is singing. When your shadow falls across the shaft, the singing stops.

          "Ah," says an old man's voice, comfortably. "The new owner. Ferdinand Vodička, at your service. I used to have this place. I've been down here since Candlemas. It's quite dry."

          You hold on to the rim of the well for a moment, until the yard stops moving.
    choices:
      - text: "Thank him, and get on with the day."
        requires: {no_note: NOON}
        effects:
          - note: VODICKA
        to: 148
      - text: "Thank him, and get back to the house as the light goes."
        requires: {note: NOON}
        effects:
          - note: VODICKA
        to: 174

  167:
    title: The Photograph
    effects:
      - note: HEART
    text: |
      You take the photograph out of your trunk and sit on the step with it in the sunshine.

      The parish choir of Vlčí Brod, 1880, on the dam of the Snílek. Thirty people in their Sunday best, squinting at the camera, with the water wide and bright behind them. In the middle of the back row stands the old priest, with his hand stretched out, pointing: not at the camera, but down, at the water at the foot of the stone tower, where the dam is highest and the pond was deepest. He is pointing at where they sang.

      In the front row stands a little girl in a white dress with ribbons, holding a rag doll and a hymn sheet. She has the child's face. She has your face.

      At the end of the second row a young woman of about twenty-seven is singing with her eyes closed: Babka, before she was Babka. A young man with a moustache is holding the boat: Vodička. And in the bottom corner, sitting in the grass, a fat little boy of five is picking his nose with great concentration. Bohuslav Hrubý.
    choices:
      - text: "Put the photograph away, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Put the photograph away, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  168:
    title: Babka, Tuesday
    text: |
      Babka is waiting at her gate, as if she knew you would come. She takes one look at your face, sits you down at her table under the hanging herbs, and does not bother with honey cake.

      "Third day," she says. "I know. I can feel it from here. Three nights, and on the fourth morning they stay." She folds her hands.
    extra:
      - requires: {no_note: BABKA}
        text: |
          "One gift," she says. "I'm old, and a gift costs. The song the keepers sang, to put it to sleep. Or the red thread, to hold you to the waking side if it tries to keep you. Choose."
      - requires: {note: BABKA}
        text: |
          "Back again," she says. "And I told you: one gift. Well. It's the third day, and an old woman can bend her own rules, once. The song the keepers sang, to put it to sleep. Or the red thread, to hold you to the waking side if it tries to keep you. Choose."
    choices:
      - text: "Ask her to teach you the lullaby."
        to: 169
      - text: "Take the red thread."
        to: 170
      - text: "Give her the carp from your well."
        requires: {item: carp}
        to: 171

  169:
    title: The Snílek Lullaby
    effects:
      - note: LULLABY
    text: |
      She sings it to you at the table, in a thin, cracked, perfectly true old voice, and makes you sing it back until you have it.

      *Hush now, Snílek, hush and keep,*
      *Water over, dark and deep.*
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      "At the monk, the outlet tower in the dam," she says. "Where the water was deepest. Sing it so it can hear you. It'll try to sing back. Don't let it."
    choices:
      - text: "Drive home with the song, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Drive home with the song, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  170:
    title: Red Thread
    effects:
      - gain: red-thread
    text: |
      She cuts a length of red wool with her teeth and puts it into your hand.

      "Tie it round your wrist when you go out to it," she says. "It'll pull you back to the waking side. Once." She holds up one crooked finger. "So don't waste it."
    choices:
      - text: "Drive home with the thread, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Drive home with the thread, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  171:
    title: A Snílek Carp
    effects:
      - lose: carp
      - note: LULLABY
      - gain: red-thread
    text: |
      Babka looks into the bucket, and her whole face changes.

      "From the well," she says softly. "Ferda sent it up." She lifts the carp out in both hands, like a priest with the Host. "That's worth more than one gift."

      She sings you the lullaby, and makes you sing it back until you have it:

      *Hush now, Snílek, hush and keep,*
      *Water over, dark and deep.*
      *Fish above you, stars above,*
      *Sleep, and dream of what you love.*
      *Dream of nothing, dream of none,*
      *Sleep till all the dreams are done.*

      Then she gives you the red thread too. "Tie it on tonight," she says. "It'll pull you back. Once."
    choices:
      - text: "Drive home with both, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Drive home with both, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  172:
    title: Rehearsal
    effects:
      - note: REHEARSED
    text: |
      You walk out to the far end of the dam, where nobody can hear you but the willows, and sing it.

      The first time, your voice cracks on *deep*. The second time you forget the fourth line. The third time you get it right, and the fourth, and the fifth, until the tune sits in your chest like a stone in a pocket and the words come without thinking.

      Halfway through the sixth time, something under the meadow listens.

      You feel it. The ground under your feet goes still, the way a dog goes still when it hears its name. The mist in the hollow stops moving. For a moment the whole farm holds its breath.

      Then, very faintly, from somewhere deep under the grass, something yawns.
    extra:
      - requires: {investigator: singer}
        text: You have rehearsed at the Vienna Court Opera with a conductor screaming at you from the pit. This is harder.
      - requires: {item: harmonica}
        text: You try it on the harmonica too. It sounds even better that way, thin and lonesome, like something played to cattle on a long night drive.
    choices:
      - text: "Walk back up to the house, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Walk back up to the house as the light goes."
        requires: {note: NOON}
        to: 174

  173:
    title: What Bára Knows
    effects:
      - note: BARA
      - companion: bara
        san: "+1"
    text: |
      You sit Bára down at the kitchen table, make her a cup of tea, and ask her to tell you everything.

      She tells you. Her grandmother's stories: the Snílek that must never go dry, the three nights, the miller who turned into a heron. Mr. Vodička, and the green room he dreamed of, and the note on the table. And her own dreams, which she has told nobody, of her mother coming back in a Martian's helmet to say she was sorry.

      When she has finished, she sits for a while with her hands round the cup.

      "I'll stand with you tonight," she says. "Whatever you do. Somebody has to."
    choices:
      - text: "Squeeze her hand, and get on with the day."
        requires: {no_note: NOON}
        to: 148
      - text: "Squeeze her hand, and get back to the house as the light goes."
        requires: {note: NOON}
        to: 174

  # ----------------------------------------------------- Dusk
  174:
    title: The Last Evening
    effects:
      - unnote: NOON
    text: |
      The sun goes down behind the western hills at a quarter to seven, red as a coal.

      You do the milking, for the last time perhaps. The milk is blue, and warm, and smells of violets. The cows are already walking down to the bottom of the meadow, one after another, in a long patient line, to stand in their ring round the stone tower. The mist rises to meet them. The child is sitting on the gate, swinging its legs, waiting for dark.

      The cart is in the yard. Fanda is in the stable. The road to Vlčí Brod is open, and so is the road beyond it, and the railway, and the whole wide world that does not dream.
    extra:
      - requires: {note: FILLING}
        text: |
          Down at the tower the herd stands in its ring in the rising water, knee-deep, asleep, as if they had not noticed it.
      - requires: {with: bara}
        text: Bára is standing in the kitchen doorway with her shawl on, watching you. She will go if you go. She will stay if you stay.
      - requires: {broken: bara}
        text: Bára is in the cowshed, milking cows that are not there.
      - text: |
          You could go. You could load the cart and go, now, and never come back, and let the Snílek have the farm and everything on it.

          Or you could stay.
    choices:
      - text: "Load the cart, take everyone, and go. Now."
        to: 175
      - text: "Stay, and see it through."
        to: 176

  175:
    title: A Farm That Dreams of You
    ending: lost
    text: |
      You load the cart in a hurry, with whatever comes to hand, and you go. You do not look back until you are a mile down the valley road, where it bends round the edge of the Black Wood.

      Then you look back.

      The farm is lit up. Every window in the house is gold. There is music, faintly: a brass band, a waltz, a woman singing. Lights hang over the meadow, seven of them, in a line that bends like a bow. The cows are standing along the ridge of the cowshed roof, all fourteen, in a row, against the stars.

      And on your porch, in your chair, with a cup of coffee in its hand, sits somebody. They are wearing your clothes. They are exactly your age. They raise the cup to you across the dark valley, and smile, and you understand that the Snílek has kept a dream of you, a better one, who never had to leave, and that it is perfectly happy, and will be there for ever.

      You drive on. You do not stop at Vlčí Brod. You do not stop at all for a very long time.

      Hrubý buys the farm from the bank at Christmas, for a song. He never sleeps there. Nobody does. On summer nights, they say, you can hear the brass band from the valley road, and a woman singing, and somebody laughing on the porch who sounds very much like you.
    extra:
      - requires: {with: bara}
        text: Bára sits beside you on the cart all the way to Plzeň and does not say a word. She finds work in a dairy there, and marries a man who has never once dreamed in his life, and she is very happy.
      - requires: {broken: bara}
        text: You lifted Bára into the cart like a sleeping child. She has not woken since. She lives with you in Plzeň and keeps your house with her eyes open and fast asleep, and in the evenings she hums a tune that the Snílek taught her.
      - requires: {any: [{with: sultan}, {broken: sultan}]}
        text: Sultán would not come. You called him from the gate until your voice gave out. He lay down by the well with his nose to the stones, and when you looked back, he was wagging his tail at the one on the porch.

  # ----------------------------------------------------- Night 3
  176:
    title: The Third Night
    effects:
      - san: "1/1D4"
      - companion: all
        san: "1D3/1D6"
    text: |
      The third night does not come down. It comes up, out of the ground.

      By ten o'clock the whole farm is dreaming. The mist fills the meadow from willow to willow, chest-deep and glowing, and in it, unmistakably, fish are swimming: great slow carp, gold and bronze, sliding between the sleeping cows as if the old pond had never gone. The stars over the Black Wood are reflected in it upside down.

      A tall figure in a coat of moss walks out of the trees and down into the mist: thin, long-handed, with a calf's mild face. The herd goes to it at once. It gathers them gently and leads them down to the stone tower at the bottom of the meadow, and lays them down round it in a ring, and stands among them with one hand on the stone, humming: the Herdsman, as good a name for it as any.

      The cowshed door is glowing. Behind it, you know without looking, is the house where you grew up. And on top of the dam, beside the stone tower, small and pale in its nightshirt, stands the child, looking up the meadow at you, waiting.

      Under your feet the ground throbs, slow and deep, like a great heart. The Snílek is awake. It has been awake for two years, and tonight it is dreaming everything at once. By morning, whatever is walking will stay.
    extra:
      - requires: {note: HERDSMAN}
        text: He looks up the meadow at you and nods, as one farmer to another. You know each other by now.
      - requires: {note: ALIENS}
        text: Over the Black Wood, seven lights rise, and hang, and watch.
      - requires: {note: FILLING}
        text: Where the bottom of the meadow was, there is water now, black and still and deep at the tower, with the glowing mist lying on top of it. The herd lies down in the water round the tower, chest-deep, as if it were grass.
      - requires: [{note: WATER}, {no_note: FILLING}]
        text: The brook runs down through the mist and out under the dam, steaming.
      - requires: {note: VODICKA}
        text: |
          "Not long now!" Vodička calls up the well, cheerfully. "Not long now!"
      - requires: {with: sultan}
        text: Sultán stands at your knee with every hair on end, growling at the mist. He does not leave you.
      - requires: {broken: sultan}
        text: Sultán is at the well, howling, and will not stop.
      - text: |
          Whatever you are going to do, it is time.
      - requires: [{with: bara}, {note: BARA}]
        text: Bára is beside you in her shawl, white to the lips, with her chin up. She promised. She is keeping her promise.
      - requires: [{with: bara}, {no_note: BARA}]
        text: Bára is in the kitchen doorway with the poker, watching the meadow. She does not come any closer.
      - requires: {broken: bara}
        text: Bára is walking down the meadow in her nightdress, toward the mist, with her eyes wide open and fast asleep. She is humming. In a moment she will be in it.
    choices:
      - text: "Go after Bára before the mist takes her."
        requires: {broken: bara}
        roll: {skill: [Psychology, STR, POW], success: 177, failure: 178}
      - text: "Hold the dam while the Snílek fills."
        requires: [{note: FILLING}, {any: [{with: bara}, {gone: bara}]}]
        to: 214
      - text: "Set the boards in the outlet tower, and let the water rise."
        requires: [{item: boards}, {note: WATER}, {no_note: FILLING}, {any: [{with: bara}, {gone: bara}]}]
        to: 184
      - text: "Open Hrubý's weir, and close the outlet tower."
        requires: [{item: boards}, {no_note: WATER}, {any: [{note: WEIR}, {item: weir-key}]}, {any: [{with: bara}, {gone: bara}]}]
        to: 180
      - text: "Block the outlet tower with whatever you can carry, and let the water in."
        requires: [{no_item: boards}, {no_note: FILLING}, {any: [{note: WATER}, {item: weir-key}]}, {any: [{with: bara}, {gone: bara}]}]
        to: 215
      - text: "Find the heart of the meadow, and sing it to sleep."
        requires: [{note: LULLABY}, {any: [{with: bara}, {gone: bara}]}]
        to: 187
      - text: "Tie on Babka's red thread, and follow the child into the dream."
        requires: [{item: red-thread}, {no_note: KID}, {any: [{with: bara}, {gone: bara}]}]
        to: 219
      - text: "Take the child's hand, and listen to it at last."
        requires: [{note: KID}, {any: [{with: bara}, {gone: bara}]}]
        to: 192
      - text: "Wake the herd, and drive them over the willow line."
        requires: [{any: [{item: handbell}, {note: MALINA}, {skill: Ride, min: 50}]}, {no_note: FILLING}, {any: [{with: bara}, {gone: bara}]}]
        to: 197
