# A Very American Dream: a solo gamebook for the engine in site/app.js. Full format: docs/adventure-format.md.
#
# How the file works
#   sections      numbered passages. Each has text, optional effects, optional extra paragraphs, and choices.
#   choices       `to: N` turns to section N. `roll:` rolls d100 against a skill instead:
#                   roll: {skill: Stealth, difficulty: hard, success: N, failure: M, bonus: 1}
#                 `skill` may be a list; the investigator rolls their best one. difficulty: regular | hard | extreme.
#   effects       applied when a section is entered, or when a choice is taken:
#                   san: "1/1D4"  a Sanity roll: lose 1 on a pass, 1D4 on a fail.  san: "-2" or "+1D3": a straight change.
#                   hp, luck      straight changes, e.g. hp: "-1D6".
#                   gain / lose   an item id.   note / unnote   a journal word.
#   requires      a choice (or an extra paragraph) only shows when this holds. A list means all of them.
#   extra         paragraphs shown after the text when their `requires` holds (`before: true` puts one ahead of the text).
#   ending        marks an ending section.
#
# This is a solo story: there are no companions. Allies (Bix, Owen, Agnes, Ruiz) are journal words.
#
# The rule of the story: going along with the strangest thing on offer raises Luck, the dream's favour.
# Refusing a coincidence notes SNAG, then SNAG2, and a third refusal in the same act spits you out (an ending).
# The dream forgives overnight: the words are cleared when Thursday and Friday begin. Friday afternoon does not forgive.
#
# Time of day on Wednesday: NOON is a journal word. Places that can be visited in the morning or the afternoon check
# it to know where the day goes next, and LATE marks a third, late visit. Both are cleared at dusk.
id: american-dream
title: A Very American Dream
series: A solo investigation, Los Angeles, 1970
subtitle: Three days in March, a missing engineer, and a city that keeps handing you the next clue.
blurb: |
  March 1970. The sixties are over, and Los Angeles hasn't been told. Dr. Leonard Voss, an engineer at Helion Dynamics, left his Buick on the Santa Monica Pier on Saturday night and has not been seen since. His wife wants him found. His employer says he's on leave.

  The city seems to want him found too. The phone rings with wrong numbers that are right. An ice-cream truck is always parked where you need to go. Strangers know your name. You could fight it. Everyone who has tried says it goes badly.
investigator_intro: Four detectives in Los Angeles, of four different kinds. Choose the one Marian Voss walks in on at half past nine on Wednesday morning.
# Shape this story is held to by `gamebook stats` and the test suite.
targets:
  sections: [340, 375]
  path_mean: [32, 42]
  endings_reached: 22
  cosmetic_choices: 0.1
start: 1
on_death: 360
on_madness: 361

bouts:
  - "You laugh at something nobody said, and it takes a long time to stop."
  - "For a while you are sure you can hear the freeway breathing."
  - "The colours go loud. You shut your eyes, and they stay loud."
  - "You find yourself humming the tune, and you cannot remember a time before you knew it."
  - "Your hands look like somebody else's hands, a kind somebody."
  - "You sit down on the kerb and wait for the world to finish its sentence."

