items:
  lockpicks:
    name: Lockpicks
    text: A roll of picks and tension wrenches in a chamois, from a burglar who retired to Ojai. A bonus die on Locksmith.
    bonus: [Locksmith]
  joint:
    name: A fat joint
    text: Humboldt County's finest, rolled for an occasion. Shared, it opens people up. Smoked, it steadies the nerves.
  revolver:
    name: Police revolver
    text: A .38 Smith & Wesson with five in the cylinder. You were supposed to hand it in.
  badge:
    name: LAPD badge
    text: Detective Sergeant, Venice Division. You are suspended, which the badge doesn't say.
  claim-file:
    name: The Voss claim file
    text: Golden Shield's file on Helion's key-man policy for Dr. Leonard Voss. Five hundred thousand dollars, and a rider in small print.
  transistor:
    name: Pocket transistor radio
    text: A Zenith Royal 500, for the ballgame. It picks up stations it has no business picking up. A bonus die on Listen.
    bonus: [Listen]
  camera:
    name: Pentax camera
    text: A Spotmatic with Tri-X in it, and two more rolls in your bag.
  press-pass:
    name: Press card
    text: The Venice Mirage. It gets you into clubs, and out of almost nothing.
  tape:
    name: The Sweetwater reel
    text: A seven-inch reel of quarter-inch tape, labelled SWEETWATER 6-21-69 in a careful hand. It sounds like a hum with a tune inside it.
  helion-badge:
    name: Voss's Helion pass
    text: A laminated pass with Leonard Voss's photograph, cleared for HQ and for "Site SW".
  tab:
    name: A Daybreak tab
    text: A square of blotter paper stamped with a tiny orange sun. Owen's batch, cooked for somebody who never said who.
  matchbook:
    name: Matchbook
    text: Black and gold. "The Sundial Room. Rooftop Cocktails. 8870 Sunset Boulevard. Opening 1971."
  notebook:
    name: Voss's notebook
    text: A green engineer's notebook full of figures, sketches of a dish, and the words THE HINGE underlined twice. A bonus die on Electrical and Mechanical Repair.
    bonus: [Electrical Repair, Mechanical Repair]
  painting:
    name: Agnes's panel
    text: A small oil on board of a gold city on a desert road, and a gap in a wire fence that you're fairly sure is a door.
  hut-keys:
    name: Leonard's keys
    text: A brass ring marked SW in nail polish. A gate key and a door key.
  overalls:
    name: Helion overalls
    text: Grey coveralls with HELION on the back, and a technician's badge clipped to the pocket.

journal:
  NOON: It is past noon on Wednesday.
  LATE: It is late on Wednesday afternoon.
  HOUSE: You have been to the Voss house in Altadena.
  HELION: You have been to Helion Dynamics in El Segundo.
  TOPANGA: You have been up Topanga Canyon to Owen Starling's dome.
  STATION: You have been to Venice Division and met Sergeant Hector Ruiz.
  RADIO: You have been to KSUN 1120 on La Cienega.
  ALTADENA: You went to see Marian on Friday morning.
  SNAG: You refused the city once today. Things went wrong at once.
  SNAG2: You refused the city twice today. Once more, and it will be done with you.
  FREEZER: A wrong number said to look in the freezer, and that the cat is fine.
  CALLOWAY: Helion's head of security, Mr. Calloway, searched Voss's study, and was at the pier before the police.
  LULLABY: Helion's project has a name, LULLABY. It means to put words in something's mouth.
  TICKETS: Two free tickets to the Gilded Moth, won on the radio.
  TAILED: Helion has your name. A grey Plymouth is never far behind you.
  INVITED: Dr. Edith Marrow of Helion wants to have dinner with you.
  SUNWARD: Helion pays a Topanga chemist through a company called Sunward Research.
  EAST: There is a white dish on a salt flat in the desert, east of the city.
  MOTIVE: Helion's policy on Voss pays double if he dies before 21 March.
  PARTY: Owen Starling is having a party at his dome tonight.
  OWEN: Owen Starling is on your side.
  DOE: A John Doe was pulled out of the surf at Zuma on Sunday, singing about a gold city. He is at Camarillo State Hospital.
  SUNDIAL: Someone keeps telling you about a rooftop bar under a sundial.
  BIX: Bix Halloran reads the sets for you, and he has a van.
  BELAIR: A producer in Bel Air, Sol Vance, has a copy of the tape.
  EQUINOX: The hinge is at 4:56 on Friday afternoon, the spring equinox.
  RUIZ: Sergeant Hector Ruiz believes you, more or less, and will come to the desert.
  STALLED: Golden Shield won't pay Helion a cent before Monday.
  STORY: The Mirage is running the gold-city letters as its cover story.
  AGNES: Agnes Pike, who paints the gold city in her sleep, is a friend.
  LASTBAR: The song stops a bar short. You know the shape of the missing bar.
  SOL: You promised Sol Vance you would tell him how it ends.
  FORESEEN: You watched yourself at the dish on a drive-in screen. The reel ran out before you saw what you did.
  CAPTIVE: You are Helion's prisoner.
  DECOY: Voss gave Marrow false settings, in front of you.
  KNOWS: You have been told plainly that the dream has been steering you all your life.
  MESSAGE: Leonard gave you a message for Marian.
  MARIAN: Marian knows the truth.
  HOME: Leonard's body is home in Altadena, asleep in his own bed.
  TAKEN: Helion has Leonard's body.
  DREAMT: You took a Daybreak tab. The dream knows your face.
  GAP: There is a gap in the fence around the dish.
  GOLD: You have walked in the Golden City.
  PROOF: You have photographs of the Golden City.
  LISTENERS: Marrow's lost listeners will be at the dish, wanting quiet.
  ROSTER: You have the gate roster for Site SW.
  SIGNED: Edith Marrow signed the double-indemnity rider herself.
  BURNED: Helion's stock of Daybreak burned in Topanga.
  UNPLUGGED: You loosened the listeners' headphone jacks in the hangar.
  CRUISER: Ruiz drove you to the desert in his black-and-white.
  VAN: Bix drove you to the desert, and he's waiting with the engine running.
  GREY: You know what the hollow ones make. Grey things, silent, with no tune in them.
  LARK: Larry Lark will play the Sweetwater reel on KSUN at 4:56 on Friday.
  EARLY: You reached the desert early.
  FREED: The listeners came off Helion's bus at Amboy.
  HUT: You are in the hut at the foot of the dish.
  DISH: You are up on the dish.
  SALT: You are out on the salt, under the dish.
  TURNED: Calloway has turned against Marrow.
  WAVER: The technicians are wavering.
  SHAKEN: Marrow has seen the gold city, and she is afraid of it.
  PRIMED: The reel is hidden in the feed rack, threaded and ready.
  LOCKED: The hut's back door is locked from inside, and you have the key.
  LEFT: You walked away from the dish before 4:56.
  SANG: The dream heard its own song.
  BROKE: You broke the dish.

sections:
  # ---------------------------------------------------------------------------------------------------------------
  # ACT ONE: THE RETAINER. LOS ANGELES, WEDNESDAY 18 MARCH 1970
  # ---------------------------------------------------------------------------------------------------------------

  1:
    title: Mrs. Voss
    extra:
      - requires: {investigator: ray}
        before: true
        text: |
          Your office is one room over a surf shop on Pacific Avenue, Venice. It smells of board wax and the sea. At half past nine somebody knocks, which nobody ever does.
      - requires: {investigator: dee}
        before: true
        text: |
          Day fifteen of your suspension. You're at your kitchen table in Venice with cold coffee when a woman knocks. "Sergeant Ruiz said you'd have time," she says. You have nothing else.
      - requires: {investigator: morton}
        before: true
        text: |
          Golden Shield Mutual Life, Spring Street, ninth floor. The woman at your desk has come to ask why the company keeps telephoning her house. You are the company.
      - requires: {investigator: lena}
        before: true
        text: |
          The *Venice Mirage* shares a back room with a laundromat, and the presses smell of bleach. "The *Times* won't print it," the woman says. "The *Herald-Examiner* laughed."
      - text: |
          The phone rings.
    text: |
      Marian Voss is forty-one and teaches fourth grade in Altadena. She holds her purse on her knees like a lid on something.

      Her husband, Leonard, went out on Saturday and didn't come back. On Sunday his Buick turned up on the Santa Monica Pier. Helion Dynamics, where he builds things, says he's on leave. "He went up to Topanga on weekends," she says. "He was happy."

      His photograph shows a rumpled man in glasses, laughing at something out of frame. On the radio, a song is playing that you almost know.
    choices:
      - text: "Answer it."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 2
      - text: "Let it ring, and keep asking her questions."
        to: 3

  2:
    title: The Wrong Number
    effects:
      - san: "0/1D3"
      - note: FREEZER
    text: |
      "Is this the detective on the Voss case?" A young man's voice, very relaxed, with surf behind it.

      You haven't taken the case yet. You say so.

      "Oh, you will. Look in the freezer, man. And tell her the cat's fine." The line goes dead.

      Marian has gone pale. "We have a cat," she says. "Pythagoras. He hasn't eaten since Saturday."
    choices:
      - text: "Hang up, and talk terms."
        to: 4

  3:
    title: What Marian Knows
    effects:
      - note: CALLOWAY
    text: |
      The phone rings eleven times and gives up.

      "On Monday a man came from Helion," Marian says. "A Mr. Calloway. Grey suit, a lovely voice. He went through Leonard's study for 'company papers'. He took two boxes, and he didn't ask."

      She looks at her hands. "He called me 'Mrs. Voss' the whole time, very kindly. As if I'd been widowed."
    choices:
      - text: "Talk terms."
        to: 4

  4:
    title: The Retainer
    extra:
      - requires: {investigator: ray}
        text: |
          Fifty a day and expenses. She counts out two days in tens, folded small, and you try not to look as if you need them.
      - requires: {investigator: dee}
        text: |
          A suspended cop can't take a fee, and you tell her so. She leaves twenty dollars for gas under the sugar bowl anyway.
      - requires: {investigator: morton}
        text: |
          Golden Shield pays your salary, and Helion's claim is your file. She isn't your client. You find you've written her number on your blotter all the same.
      - requires: {investigator: lena}
        text: |
          The *Mirage* pays in byline and coffee. She wants him found, you want the story. You shake on it over the ink-stained counter.
      - text: |
          Under the window, a pink ice-cream truck lettered SUNDAY'S idles at the kerb. It's playing the same tune as the radio.
    text: |
      She writes down the address in Altadena, and the name of Leonard's company in El Segundo. She doesn't know the name of anyone in Topanga. The police at Venice Division found the car.

      The radio is still playing that song. The announcer says it's KSUN 1120, and that he doesn't know what it's called either.
    choices:
      - text: "Start at the Voss house in Altadena."
        to: 9
      - text: "Start at Helion Dynamics in El Segundo."
        to: 22
      - text: "Drive up Topanga Canyon."
        to: 34
      - text: "Go and see the police who found the car."
        to: 44
      - text: "Find the radio station that keeps playing that tune."
        to: 49
      - text: "Go down and follow the ice-cream truck."
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 55
      - text: "Tell her you don't do missing husbands."
        to: 5

  5:
    title: "No"
    text: |
      She leaves her card on the desk and goes, very upright.

      Within a minute a pigeon flies in through the window and won't leave. Water comes through the ceiling from upstairs. The phone rings, and stops, and rings again.

      The card says MARIAN VOSS in schoolteacher capitals.
    choices:
      - text: "Catch her on the stairs."
        to: 4
      - text: "Answer the phone, to make it stop."
        to: 6
      - text: "Let her go, and go out for pie."
        to: 7

  6:
    title: For You
    effects:
      - san: "0/1D3"
    text: |
      "You'll take it, man," says a young, relaxed voice, with surf behind it. "She's on the second landing. She's crying a little. Tell her the cat's fine. And look in the freezer."

      The line goes dead. The pigeon on the filing cabinet looks at you. The water from upstairs stops dripping, as if it was only ever waiting for this.
    choices:
      - text: "Go out to the landing."
        effects: [{note: FREEZER}]
        to: 4

  7:
    title: Pie
    text: |
      At the diner on the corner the waitress sets down a slice of peach pie you didn't order. Under the plate is a card: MARIAN VOSS, in schoolteacher capitals, with a phone number.

      The jukebox has been unplugged since 1967. It starts playing anyway, a tune you almost know.
    choices:
      - text: "Call the number on the card from the pay phone by the door."
        to: 364
      - text: "Eat the pie, and think about something else."
        to: 8

  364:
    title: Back Again
    text: |
      She answers on the first ring, as if she'd been sitting by a phone waiting for exactly this.

      Twenty minutes later she's back in your chair, very upright, as if she'd never left. The pigeon has gone. The ceiling has stopped dripping.
    choices:
      - text: "Talk terms."
        to: 4

  8:
    title: A Small Life
    ending: scolded
    text: |
      Lunch is fine. The rest of the year is fine.

      Nothing happens to you after that, exactly. No wrong numbers. No strangers who know your name. The parking spaces fill up just before you reach them, and the lights turn red as you arrive. The pink truck never comes down your street again, though you hear it sometimes, two blocks over, playing for somebody else.

      In July you read that a Helion engineer was declared dead. You don't remember why the name sounds familiar.
    extra:
      - text: |
          You told the universe no. It took you at your word.

  # ---------------------------------------------------------------------------------------------------------------
  # THE VOSS HOUSE, ALTADENA (morning or afternoon)
  # ---------------------------------------------------------------------------------------------------------------

  9:
    title: Altadena
    effects:
      - note: HOUSE
    text: |
      The house is a low ranch house under the San Gabriels, with the mountains sitting on its roof like a hat. The pool has gone green. A grey cat watches you from the diving board.

      Marian lets you into the study. Drawers hang open. Papers are stacked as if somebody had been in a hurry and didn't care who knew.
    extra:
      - requires: {note: CALLOWAY}
        text: |
          "Mr. Calloway," she says. "He was very tidy about being untidy."
      - text: |
          "Pythagoras," she says, of the cat. It hasn't taken its eyes off you.
    choices:
      - text: "Search the study yourself."
        roll: {skill: Spot Hidden, success: 11, failure: 12}
      - text: "Follow the cat."
        requires: {no_note: FREEZER}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 13
      - text: "Ask her where the freezer is."
        requires: {note: FREEZER}
        to: 13
      - text: "Ask Marian about his last week."
        to: 10

  10:
    title: His Last Week
    effects:
      - note: LULLABY
    text: |
      "He hummed," Marian says. "All week. The same tune, over and over, like a man with a crush."

      She gives you a letter from the blotter, half written, to nobody: *If LULLABY goes ahead, Edith will put words in its mouth, and it will believe them.*

      "On Saturday he kissed me at the door. He said, 'I'm going to go and listen up close.' I thought he meant the radio."
    choices:
      - text: "Search the study."
        roll: {skill: Spot Hidden, success: 11, failure: 12}
      - text: "Look in the garage."
        to: 13

  11:
    title: Sunday Trousers
    effects:
      - gain: helion-badge
    text: |
      Everyone searched the desk. Nobody searched the closet. His church trousers hang on a hook, and in the back pocket is his Helion pass: Leonard Voss, smiling, laminated, cleared for HQ and something called SITE SW.

      "He never went to church," Marian says. "He just liked the trousers."
    choices:
      - text: "Look in the garage too."
        requires: {no_item: tape}
        to: 13
      - text: "Pocket the pass, and go."
        to: 21

  12:
    title: The Desk Radio
    text: |
      Nothing. Receipts, a slide rule, a birthday card from his mother.

      Then the transistor radio on the desk switches itself on. "This one goes out to the detective in Altadena," says a velvet voice. "Check the freezer, baby. Here's a song you know."

      It's the tune. Marian puts her hand over her mouth.
    choices:
      - text: "Go to the freezer."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 13
      - text: "Switch it off, and do this properly."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 15
      - text: "Switch it off, and do this properly."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 15
      - text: "Switch it off, and do this properly."
        requires: {note: SNAG2}
        to: 107

  13:
    title: Behind the TV Dinners
    effects:
      - gain: tape
    text: |
      The freezer in the garage hums like it knows something. Behind six Swanson dinners is a bread bag, and in it a seven-inch reel of tape, frosted white. The label, in a careful hand, says SWEETWATER 6-21-69.

      In the house, the phone starts ringing.
    choices:
      - text: "Answer it."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 14
      - text: "Let it ring, and get the reel out to your car."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 15
      - text: "Let it ring, and get the reel out to your car."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 15
      - text: "Let it ring, and get the reel out to your car."
        requires: {note: SNAG2}
        to: 107

  14:
    title: Caller Number Nine
    effects:
      - note: TICKETS
    text: |
      "Congratulations!" says the velvet voice. "You are KSUN's caller number nine, and you have won two tickets to the Gilded Moth on the Sunset Strip, tonight only!"

      You didn't call anybody. You say so.

      "Nobody ever does," he says warmly, and plays the tune.
    choices:
      - text: "Search the study before you go."
        requires: {no_item: helion-badge}
        roll: {skill: Spot Hidden, success: 11, failure: 21}
      - text: "Thank Marian, and go."
        to: 21

  15:
    title: The Grey Plymouth
    effects:
      - note: TAILED
      - note: INVITED
    text: |
      A grey Plymouth is parked across the Vosses' drive. The man leaning on it wears a grey suit and a face you'd forget in a lift.

      "Hollis Calloway, Helion security." His voice is lovely, like a doctor's. "Dr. Voss took home a reel of tape that belongs to us. I'd like it back, please."

      He smiles. "Dr. Marrow, our director, would also like to have dinner with you. Musso and Frank, eight o'clock." He has an envelope in his other hand.
    extra:
      - requires: {item: tape}
        text: |
          His eyes rest on your jacket, where the reel is.
      - requires: {note: SNAG2}
        text: |
          The street has gone very quiet. The city is turning its back on you, and you can feel the draught.
      - text: |
          "No hurry," he says. He means it.
    choices:
      - text: "Hand over the reel."
        requires: {item: tape}
        effects: [{lose: tape}]
        to: 21
      - text: "Tell him you don't know what he's talking about."
        roll: {skill: [Fast Talk, Persuade, Intimidate], success: 21, failure: 16}
      - text: "Ask what's in the envelope."
        to: 17

  16:
    title: Company Property
    effects:
      - lose: tape
    text: |
      He doesn't argue. He goes through your pockets with quick, apologetic hands, the way a tailor measures you.

      "Company property," he says of whatever he finds, and pats your cheek. Then he gets back in the Plymouth and waits for you to leave first.
    choices:
      - text: "Leave first."
        to: 21

  17:
    title: Two Thousand Dollars
    text: |
      Twenty hundred-dollar bills, new enough to cut you.

      "For your trouble," Calloway says, "and for your discretion. Mrs. Voss will be looked after. You have my word, and Helion's."

      Somewhere a long way off, an ice-cream truck is playing a tune. It's getting further away.
    choices:
      - text: "Take the envelope."
        to: 18
      - text: "Hand it back."
        to: 19

  18:
    title: Counting It
    text: |
      You count it twice in the car with the doors locked. Twenty bills. When you look up, Calloway has gone, without hurrying.

      Down the block the ice-cream truck has stopped playing. The driver is leaning on his window, watching you, the way a man watches a dog he used to like.
    choices:
      - text: "Drive to the bank before it closes."
        to: 20
      - text: "Go after him, and give it back."
        effects: [{note: TAILED}]
        to: 19

  19:
    title: Handed Back
    effects:
      - note: TAILED
    text: |
      He takes it back without a flicker, and tucks it into his jacket as if it were a handkerchief.

      "Well," he says. "Dinner's still on."

      His smile doesn't move at all. You understand that you're on a list now, and that it's a short one.
    choices:
      - text: "Get on with your day."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Get on with your day."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Get on with your day."
        requires: {note: LATE}
        to: 82

  20:
    title: The Price of a Used Buick
    ending: scolded
    text: |
      You buy a second-hand Riviera with the money. It drives beautifully.

      Marian calls twice, then stops. In April Helion declares Leonard Voss dead, and Golden Shield pays a great deal of money to somebody who isn't her. You read it in the paper in your new car, at a red light that never seems to change.

      The pink truck never comes down your street again. Spring is very dull that year, and summer duller.
    extra:
      - text: |
          You were bought for the price of a used Buick.

  21:
    title: Leaving Altadena
    text: |
      Marian stands on the step with the cat in her arms and watches you go.

      At the end of the street, a pink ice-cream truck comes round the corner, playing the tune. It slows as it passes your car, as if it were waiting for you to decide.
    choices:
      - text: "Follow the truck."
        requires: {no_note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 55
      - text: "Follow the truck."
        requires: {note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 77
      - text: "Stick to your list."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Stick to your list."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Stick to your list."
        requires: {note: LATE}
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # HELION DYNAMICS, EL SEGUNDO (morning or afternoon)
  # ---------------------------------------------------------------------------------------------------------------

  22:
    title: El Segundo
    effects:
      - note: HELION
      - gain: matchbook
    text: |
      Helion Dynamics is a white slab beside the airport. Every ninety seconds a jet goes over low enough to part your hair.

      The lobby is cool and smells of floor polish. On the reception desk is a bowl of matchbooks, black and gold: THE SUNDIAL ROOM. ROOFTOP COCKTAILS. OPENING 1971. You take one. Everybody does.

      Behind the receptionist, an elevator opens for nobody, and waits.
    choices:
      - text: "Ask for Dr. Voss's department."
        to: 26
      - text: "Ask for the press office."
        requires: {item: press-pass}
        to: 30
      - text: "Ask for accounts, on Golden Shield's business."
        requires: {item: claim-file}
        to: 28
      - text: "Step into the elevator that opened for nobody."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 23

  23:
    title: Floor Four and a Half
    text: |
      The doors close. You don't press anything. The Muzak is playing the tune, arranged for strings.

      The panel has buttons for one to four. The elevator stops between three and four, and the doors open on a corridor with no number on it.
    choices:
      - text: "Step out."
        to: 24
      - text: "Press the lobby button, hard."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 32
      - text: "Press the lobby button, hard."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 32
      - text: "Press the lobby button, hard."
        requires: {note: SNAG2}
        to: 107

  24:
    title: The Corridor
    effects:
      - note: LULLABY
    text: |
      Carpet, low ceilings, one open door. A woman's voice comes out of it, tired and certain.

      "LULLABY goes at the hinge, General. Friday afternoon. No, he won't be a problem. He's somewhere he can't sign anything."

      The receiver goes down. A woman of about sixty walks out the far end of the corridor, without looking back. Her office door stays open.
    choices:
      - text: "Slip into her office."
        roll: {skill: Stealth, success: 25, failure: 32}
      - text: "Ride back down while you can."
        to: 33

  25:
    title: Marrow's Desk
    effects:
      - note: SUNWARD
      - note: EAST
      - san: "0/1D3"
    text: |
      DR. E. MARROW, says the nameplate. On the desk, an invoice from Sunward Research of Topanga: *Daybreak, 4,000 units*.

      Beside it, an aerial photograph. A white dish stands alone on a salt flat, with a road running out to it like a string to a kite. Somebody has written EAR on the back.

      You put everything back square, and go before the elevator forgets you.
    choices:
      - text: "Go."
        to: 33

  26:
    title: Mr. Calloway
    effects:
      - note: TAILED
      - note: INVITED
    text: |
      They send down a man in a grey suit with a voice like warm milk. Hollis Calloway, head of security.

      "Dr. Voss is on leave," he says. "He's been working terribly hard." He takes an envelope from his jacket and lays it on the low table between you.

      "Dr. Marrow dines at Musso and Frank at eight. She'd very much like you to join her."
    extra:
      - requires: {note: CALLOWAY}
        text: |
          So this is Calloway. You've heard about him. His hands are very clean.
      - text: |
          He waits, perfectly pleasant.
    choices:
      - text: "Ask what's in the envelope."
        to: 17
      - text: "Watch his face, and mention the desert."
        roll: {skill: Psychology, success: 27, failure: 33}
      - text: "Thank him, and leave."
        to: 33

  27:
    title: A Flinch
    effects:
      - note: EAST
    text: |
      "Leonard liked the desert, didn't he?" you say, for no reason.

      Nothing moves in Calloway's face except one eyelid. It's enough. Somewhere out east, there's a place Helion would rather you didn't think about.

      "Everyone likes the desert," he says.
    choices:
      - text: "Leave him to it."
        to: 33

  28:
    title: The Ledger
    text: |
      Golden Shield's name gets you as far as a basement office and a clerk who is afraid of insurance men. He leaves you alone with the ledgers while he finds coffee.

      You have ten minutes, a pencil, and twenty years of reading other people's money.
    choices:
      - text: "Go through the ledgers."
        requires: {skill: Accounting, min: 50}
        roll: {skill: Accounting, success: 29, failure: 32}

  29:
    title: Double Indemnity
    effects:
      - note: MOTIVE
      - note: SUNWARD
    text: |
      Two lines matter.

      The premium on the Voss policy went up in 1968, when someone added a rider: double indemnity, if he dies before 21 March 1970. A million dollars, if Leonard is dead before Saturday.

      And every month since September, thirty thousand dollars to Sunward Research, of Topanga Canyon, for "materials".

      The clerk comes back with the coffee. You thank him for it.
    choices:
      - text: "Drink it, and go."
        to: 33

  30:
    title: The Press Office
    effects:
      - note: EAST
    text: |
      The press officer is a pretty girl in a lilac suit who thinks the *Mirage* is a fashion magazine. She gives you a glossy brochure, *Helion: Listening to the Stars*.

      On page six is a white dish on a salt flat, ninety feet across, *at a desert site east of Los Angeles*.

      "It hears all the way to the edge of everything," she says. "Isn't that dreamy?"
    choices:
      - text: "Tell her it is, and ask what else it hears."
        roll: {skill: [Charm, Fast Talk], success: 31, failure: 33}
      - text: "Take the brochure, and go."
        to: 33

  31:
    title: "\"Lullaby\""
    effects:
      - note: LULLABY
    text: |
      She leans closer. "There's a secret project. Dr. Marrow calls it LULLABY." She giggles. "Isn't that sweet? For a radio telescope?"

      Then she sees your face, and remembers what she is, and offers you a pen with the company's name on it.
    choices:
      - text: "Take the pen, and go."
        to: 33

  32:
    title: Security
    effects:
      - note: TAILED
      - note: INVITED
      - luck: -5
    text: |
      Two men in grey blazers take an elbow each, and walk you down through the building without a word.

      Calloway meets you in the lobby. He has a grey suit and a voice like warm milk. "Hollis Calloway, security. We're all a little jumpy this week." He straightens your collar.

      "Dr. Marrow would like you to have dinner with her. Musso and Frank, eight o'clock. Do come."
    extra:
      - requires: {note: SNAG2}
        text: |
          Outside, the jets go over and over. The city is turning its back on you, and it has a long back.
      - text: |
          The glass doors hiss shut behind you.
    choices:
      - text: "Walk out into the jet noise."
        to: 33

  33:
    title: Under the Jets
    text: |
      A taxi is waiting at the kerb outside Helion, engine running. Nobody called it.

      "Pier, right?" the driver says, and opens the back door. He's wearing an orange flower behind his ear. The meter isn't running.
    choices:
      - text: "Get in."
        requires: {no_note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 66
      - text: "Get in."
        requires: {note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 79
      - text: "Wave him off, and stick to your list."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Wave him off, and stick to your list."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Wave him off, and stick to your list."
        requires: {note: LATE}
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # TOPANGA CANYON (morning or afternoon)
  # ---------------------------------------------------------------------------------------------------------------

  34:
    title: Topanga
    effects:
      - note: TOPANGA
    text: |
      Topanga Canyon road climbs off the Coast Highway in hairpins, through chaparral and the smell of sage. Hand-painted signs say PEACE and NO TRESPASSING with equal feeling.

      Round a bend, a white goat stands in the middle of the road. It looks at you, then at a dirt track going up the hill, then back at you.
    choices:
      - text: "Park, and follow the goat."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 37
      - text: "Honk, and drive round it."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 35
      - text: "Honk, and drive round it."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 35
      - text: "Honk, and drive round it."
        requires: {note: SNAG2}
        to: 107

  35:
    title: The Ditch
    effects:
      - hp: "-1D3"
    text: |
      The goat doesn't move. The road does. Your back wheels go into a ditch still full of February's rain, and your head meets the wheel.

      You walk the last half mile up the dirt track with mud to the knee. At the top is a geodesic dome, and a thin young man watching you come. He has seen men walk up that road before, and they wore suits.
    extra:
      - requires: {note: SNAG2}
        text: |
          Even the goat looks away. The city is turning its back on you.
      - text: |
          He doesn't come down to meet you.
    choices:
      - text: "Keep walking."
        to: 36

  36:
    title: Wary
    text: |
      "Owen Starling," he says, from the doorway, with his arms folded. "You're the second straight this week. The first one had a grey suit."

      Inside the dome, glass and copper glitter like a jeweller's. He stays between you and it.

      "I don't talk to people who come up the road that way," he says.

      Down the hill, a neighbour with a tractor is already hauling your car out of the ditch. He won't take money.
    choices:
      - text: "Offer him your joint, as a peace pipe."
        requires: {item: joint}
        effects: [{lose: joint}]
        to: 38
      - text: "Tell him who's been paying him."
        requires: {any: [{note: SUNWARD}, {note: MOTIVE}]}
        to: 40
      - text: "Talk him round anyway."
        roll: {skill: [Persuade, Charm, Fast Talk], difficulty: hard, success: 38, failure: 39}
      - text: "Leave him to his goats."
        to: 43

  37:
    title: The Dome
    text: |
      At the top of the track is a geodesic dome with goats on its roof. Inside, among copper and glassware, a thin young man is cutting sheets of blotter paper. Every square is stamped with a tiny orange sun.

      "Owen Starling," he says, with the scissors still in his hand. "Who sent you? No, don't tell me. The goat."

      He doesn't seem to want to say anything else to a stranger.
    choices:
      - text: "Share your joint with him."
        requires: {item: joint}
        effects: [{lose: joint}]
        to: 38
      - text: "Talk him round."
        roll: {skill: [Persuade, Charm, Fast Talk], success: 38, failure: 39}
      - text: "Read the I Ching coins on his table, and talk his language."
        roll: {skill: Occult, success: 38, failure: 39}
      - text: "Tell him who's been paying him."
        requires: {any: [{note: SUNWARD}, {note: MOTIVE}]}
        to: 40
      - text: "Lean on him."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 41
      - text: "Lean on him."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 41
      - text: "Lean on him."
        requires: {note: SNAG2}
        to: 107

  38:
    title: Daybreak
    effects:
      - gain: tab
      - note: PARTY
      - note: OWEN
    text: |
      Owen relaxes like a cat in the sun. "Daybreak," he says, holding up a sheet of blotter stamped with tiny orange suns. "My best batch. Some company called Sunward ordered four thousand. Who orders four thousand?"

      Leonard Voss came up on Friday and bought a couple. "Sweet guy. He said he was going to go and listen up close."

      He presses a tab into your palm. "For when it asks you. Party here tonight, if you want to know where your head's at."
    choices:
      - text: "Thank him, and drive down."
        to: 43

  39:
    title: Bad Vibes
    effects:
      - note: PARTY
    text: |
      Owen looks at you for a long time, and decides something.

      "Your aura's all knotted up, man," he says. "I can't talk to that." He writes on the back of your hand in ballpoint: *Party. Tonight. Dome.* "Come back when you've loosened up. Bring nothing."

      A goat eats one of your shoelaces.
    choices:
      - text: "Drive down."
        to: 43

  40:
    title: Sunward Research
    effects:
      - gain: tab
      - note: OWEN
      - note: PARTY
    text: |
      "Helion Dynamics?" Owen sits down on the floor. "The *bomb* people? I cooked four thousand doses for a defense contractor?"

      He's horrified, and then he's angry, and then he's your friend. Leonard bought a couple of tabs from him on Friday, he says. Leonard knew who Sunward was. He didn't say.

      Owen gives you a tab "for when you need it", and tells you to come to the party tonight.
    choices:
      - text: "Promise you'll come, and drive down."
        to: 43

  41:
    title: Into the Chaparral
    effects:
      - hp: "-1D4"
    text: |
      You get a fistful of his shirt, and he goes out of it like a snake out of its skin and is gone into the chaparral.

      You follow. The slope follows you. You come down it on your back in a cloud of dust and sage, and stop on the asphalt in front of a sheriff's car.
    extra:
      - requires: {note: SNAG2}
        text: |
          A hawk turns overhead, unconcerned. The city is turning its back on you.
      - text: |
          The deputy gets out slowly, putting on his hat.
    choices:
      - text: "Sit up, and explain."
        to: 42

  42:
    title: The Deputy
    effects:
      - note: DOE
    text: |
      He decides you're a fool rather than a criminal, and drives you back up to your car. He likes to talk.

      "Second guy out of this canyon this week, all scratched up. The first one we pulled out of the surf at Zuma on Sunday. Young fella. No ID, no shoes, singing about a gold city." He shakes his head. "County sent him up to Camarillo, to the state hospital."
    choices:
      - text: "Thank him, and drive down."
        to: 43

  43:
    title: The Canyon Mouth
    text: |
      Where the canyon road meets the Coast Highway, the sea opens up blue and enormous.

      A girl in a yellow dress is hitching by the stop sign. She's peeling an orange with her thumb, in one long spiral. She looks at your car the way you'd look at a bus you were expecting.
    choices:
      - text: "Pick her up."
        requires: {no_note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 71
      - text: "Pick her up."
        requires: {note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 78
      - text: "Drive past, and stick to your list."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Drive past, and stick to your list."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Drive past, and stick to your list."
        requires: {note: LATE}
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # VENICE DIVISION (morning or afternoon)
  # ---------------------------------------------------------------------------------------------------------------

  44:
    title: Venice Division
    effects:
      - note: STATION
    text: |
      Venice Division is a brick station on Culver Boulevard, full of typewriters and men who haven't slept.

      Hector Ruiz found the Buick. "Shoes on the sand under the pier," he says. "Lined up neat. No body. They mostly come up at Malibu, after a week."
    extra:
      - requires: {investigator: dee}
        text: |
          "Dee." He lowers his voice. "You're not supposed to be in here." He was your partner for six years, and he still sends your mother a card at Christmas.
      - requires: {investigator: [ray, morton, lena]}
        text: |
          He's a big, tired sergeant, and he looks at you as if you were something on his windscreen.
      - text: |
          The Buick, he says, is in the impound lot out back.
    choices:
      - text: "Show him your badge, and ask to see the Buick."
        requires: {item: badge}
        to: 45
      - text: "Talk your way out to the Buick."
        roll: {skill: [Fast Talk, Persuade, Law], success: 45, failure: 47}
      - text: "Watch him, and ask what he really thinks."
        roll: {skill: Psychology, success: 46, failure: 47}

  45:
    title: The Impound Lot
    text: |
      Leonard's Buick sits in a chain-link pen among wrecks, a big tan Electra with sand in its wheel arches.

      On the front seat is an orange, unpeeled. The odometer reads exactly 1970.0 miles, which is impossible for a car this old. There's something small and square in the ashtray.
    choices:
      - text: "Check the ashtray."
        requires: {no_item: tab}
        effects: [{gain: tab}]
        to: 48
      - text: "Leave it all exactly as you found it."
        to: 48

  46:
    title: Off the Record
    effects:
      - note: CALLOWAY
    text: |
      Ruiz takes you out to the coffee machine, where nobody listens.

      "Off the record? A Helion man was at the pier before we were. Calloway, security. Grey suit. Very helpful." He drinks his coffee as if it had insulted him. "And the shoes were dry. Walked into the sea, and his shoes were dry."
    choices:
      - text: "Thank him."
        to: 48

  47:
    title: The Log
    effects:
      - note: DOE
    text: |
      You're shown the door, politely.

      On the way out you pass the teletype. One line in Sunday's sheriff's traffic catches your eye: *JOHN DOE RECOVERED SURF ZUMA BEACH 0640. W/M 25-30. NO ID. DISORIENTED, SINGING, REFERS TO GOLD CITY. TRANSFERRED CAMARILLO STATE HOSP.*

      Nobody in Venice Division has read it twice.
    choices:
      - text: "Read it twice, and go."
        to: 48

  48:
    title: Culver Boulevard
    text: |
      Out in the lot, a cruiser's radio is crackling with the dispatcher's flat voice.

      "...pink ice-cream truck blocking Pacific at Windward. Driver refuses to move. Driver says he's waiting for..." and the dispatcher says your name, quite clearly.
    choices:
      - text: "Go and see."
        requires: {no_note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 55
      - text: "Go and see."
        requires: {note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 77
      - text: "Stick to your list."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Stick to your list."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Stick to your list."
        requires: {note: LATE}
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # KSUN 1120 (morning or afternoon)
  # ---------------------------------------------------------------------------------------------------------------

  49:
    title: KSUN
    text: |
      KSUN 1120 is a cinderblock box on La Cienega with a fibreglass sun on the roof, twelve feet across and peeling.

      The receptionist looks up from her nails. "Oh, you're here. Larry said you'd come." Behind her, through the glass, a man in a turtleneck is talking into a microphone. The red light says ON AIR.
    choices:
      - text: "Walk into the booth the second the light goes off."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 51
      - text: "Sit down in the lobby and wait, like a sane person."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 50
      - text: "Sit down in the lobby and wait, like a sane person."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 50
      - text: "Sit down in the lobby and wait, like a sane person."
        requires: {note: SNAG2}
        to: 107

  50:
    title: Towed
    effects:
      - note: STATION
    text: |
      You wait. The red light never goes off. At last the receptionist says Larry left by the back.

      Your car is gone too. A tow-away zone, apparently, since this morning. The yard is the Venice Division impound, where a big tired sergeant called Hector Ruiz signs your release without looking up. If he knows you, he doesn't say so.

      They've parked your car beside a tan Buick Electra with sand in its wheel arches.
    extra:
      - requires: {note: SNAG2}
        text: |
          Ruiz stamps the form twice, hard. The city is turning its back on you.
      - text: |
          The pen is unlocked, and Ruiz has gone back inside.
    choices:
      - text: "Have a look at the Buick."
        to: 45

  51:
    title: Larry Lark
    effects:
      - note: RADIO
    text: |
      Larry Lark has a turtleneck, a moustache, and a voice like hot fudge. "The detective," he says, and offers you a peppermint.

      The reel came in the mail last June, he says, with no return address. He plays it every afternoon at four fifty-six, because that's what the note said. "And every afternoon, baby, the phones light up. People who've dreamt about a city made of gold."
    choices:
      - text: "Ask him for a dub of the reel."
        requires: {no_item: tape}
        roll: {skill: [Persuade, Charm, Fast Talk], success: 52, failure: 54}
      - text: "Go on the air, and ask the city for Leonard Voss."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 53
      - text: "Thank him for the peppermint, and go."
        to: 54

  52:
    title: A Dub
    effects:
      - gain: tape
    text: |
      Larry threads two machines and makes you a copy while a commercial for Earl Scheib plays. "Any car painted, $29.95."

      He writes SWEETWATER 6-21-69 on the box, copying the original label. "It's not mine to keep," he says. "Never was."
    choices:
      - text: "Take the reel, and go."
        to: 54

  53:
    title: On the Air
    effects:
      - note: SUNDIAL
      - note: DOE
      - san: "0/1D3"
    text: |
      "We've got a detective in the studio, people," Larry purrs, "looking for a Leonard Voss. Talk to me."

      The board lights up. A boy in Encino: "He's on the roof of a building that isn't built yet, under the big sundial." Then a woman, very quiet: "I'm a night nurse at Camarillo State. We have a man here, a John Doe, who says the same things. He sings."

      Larry looks at you over his glasses. "Far out," he says, softly, off mic.
    choices:
      - text: "Thank him, and go."
        to: 54

  54:
    title: La Cienega
    text: |
      Outside, the traffic on La Cienega shimmers. On the roof, the fibreglass sun creaks.

      It turns. Only a few degrees, on a pole that has been rusted solid since Eisenhower. It points down the boulevard, the way the pink ice-cream truck went, if there was a pink ice-cream truck. You're fairly sure there was.
    choices:
      - text: "Follow where it points."
        requires: {no_note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}, {note: NOON}]
        to: 55
      - text: "Follow where it points."
        requires: {note: NOON}
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 77
      - text: "Stick to your list."
        requires: {no_note: NOON}
        effects: [{note: NOON}]
        to: 80
      - text: "Stick to your list."
        requires: [{note: NOON}, {no_note: LATE}]
        effects: [{note: LATE}]
        to: 81
      - text: "Stick to your list."
        requires: {note: LATE}
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # THE AFTERNOON: THE TRUCK, THE BOARDWALK, THE PIER, THE GIRL WITH THE ORANGE
  # ---------------------------------------------------------------------------------------------------------------

  55:
    title: Following the Truck
    text: |
      The pink truck drives like a cloud moves: never fast, never quite where you thought.

      You follow it for hours. Through Culver City, along Sepulveda, twice round a cemetery, down a street of palm trees so tall they look like exclamation marks. It plays the tune the whole way. Children come out of houses and stand on lawns and don't buy anything.

      At last it stops at the end of Windward Avenue, by the sea, and the driver waves you on.
    choices:
      - text: "Walk out onto the boardwalk."
        to: 56

  56:
    title: The Boardwalk
    text: |
      Venice Beach in the afternoon: roller skates, a man playing a saw, the smell of hot dogs and patchouli.

      A young man with sun-white hair is sitting on a surfboard on the sand, watching the sets come in. "Bix Halloran," he says, without looking round. "Been waiting for you. The city told me."

      He knows about Leonard Voss. "Saw him walk into the water on Saturday night. In his suit. He didn't drown, man. He went *sideways*."
    choices:
      - text: "Borrow a board and paddle out with him."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 57
      - text: "Sit down and share your joint with him."
        requires: {item: joint}
        effects: [{lose: joint}]
        to: 61
      - text: "Tell him to talk sense."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 62
      - text: "Tell him to talk sense."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 62
      - text: "Tell him to talk sense."
        requires: {note: SNAG2}
        to: 107

  57:
    title: The Sets
    effects:
      - note: BIX
    text: |
      The water is cold enough to stop your heart, then it isn't. You sit on borrowed boards beyond the break, rising and falling.

      "Sets come in threes," Bix says. "Everything does, lately. The city's got a current in it. Since the summer before last, it's like the whole place is surfing." He nods at the horizon. "Here comes yours."

      A wave is standing up out there, green and glassy. It is the wave of your life, and you know it.
    choices:
      - text: "Catch it."
        to: 58
      - text: "Paddle in. You have a case."
        to: 65

  58:
    title: The Wave
    effects:
      - san: "+1D3"
    text: |
      You don't know how to surf. You surf.

      It lifts you like a hand, and you are on your feet in a green room with the light coming through the roof, and time stops being a thing that happens to you. Bix is whooping somewhere. The pier goes by, slowly.

      You could stay out here. Nobody would blame you.
    choices:
      - text: "Stay out here."
        to: 59
      - text: "Ride it in to the beach."
        to: 65

  59:
    title: Another Set
    text: |
      The wave lets you down gently past the pier, and the sea goes glassy and gold. Bix paddles over, grinning like a kid.

      "There's another set coming," he says. "There's always another set." Out past the line, the water humps up green.

      On the beach, very small, a pink truck is playing its tune, and waiting.
    choices:
      - text: "Wait for the next one."
        to: 60
      - text: "Paddle in with Bix. The truck is waiting for somebody."
        to: 65

  60:
    title: The Case Was Never the Point
    ending: dreamer
    text: |
      You stay out past sunset, and the next day, and the next.

      You send Marian a note she doesn't understand. You sell the car and buy a board. Bix teaches you to read the sets, and by summer you can read them better than he can.

      You never find out what happened to Leonard Voss. In the autumn the waves are very good, and the next autumn better. You get old on the water, brown and happy, and people come down to the beach to watch you go out.
    extra:
      - text: |
          The case was never the point. The wave was.

  61:
    title: Smoke
    effects:
      - note: BIX
    text: |
      Bix takes a long pull and looks at the sea through it.

      "The city's got a current, man. Since the summer before last. Parking spaces, phone calls, the waves. It's taking you somewhere." He flicks the roach into the sea. "Don't paddle against it. Get *in* it."
    choices:
      - text: "Watch the sun go down with him."
        to: 65

  62:
    title: Glass
    effects:
      - hp: "-1D3"
    text: |
      "Sure, man," Bix says, and lies back on his board, and closes his eyes.

      You turn to go. A kid on a skateboard comes out of nowhere. You go down on the boardwalk, onto a broken bottle, and come up with your palm open like a mouth.

      A lifeguard wraps it in a towel and drives you to St. John's in Santa Monica.
    extra:
      - requires: {note: SNAG2}
        text: |
          Nobody on the boardwalk looks at you. The city is turning its back on you.
      - text: |
          It needs stitches. It's going to be a long afternoon.
    choices:
      - text: "Sit in the emergency room and wait."
        to: 63

  63:
    title: St. John's Emergency
    effects:
      - note: DOE
    text: |
      You wait two hours with a towel round your hand. Behind the curtain, a nurse is talking to an orderly.

      "...the Zuma Doe, the one who sings? Camarillo took him Monday. Doctor says he's twenty-five. His teeth say fifty." The orderly laughs. "I'm serious. And he keeps telling everyone what time it is. Four fifty-six. All day long."
    choices:
      - text: "Ask her about him while she stitches you."
        roll: {skill: [Charm, Persuade, Fast Talk], success: 64, failure: 82}

  64:
    title: The Nurse
    effects:
      - san: "0/1D3"
    text: |
      She's tired enough to talk. Pulled out of the surf at Zuma at dawn on Sunday, she says. No ID. Nice suit, ruined. Sang the whole way in the ambulance, a tune she couldn't get out of her head for two days.

      "He looks like a boy," she says, tying off the last stitch. "But he's got a wedding ring on, and it's worn thin."
    choices:
      - text: "Thank her, and go out into the evening."
        to: 82

  65:
    title: Sundown
    text: |
      You sit on the sand and dry off while the sun goes down into the sea, very red, behind the smog.

      Somewhere up the beach, the pink truck is playing its tune to nobody.
    extra:
      - requires: {note: BIX}
        text: |
          "I'm around, man," Bix says, picking up his board. "I've got a van. If you need to get somewhere it wants you, call."
      - text: |
          The lights come on along the boardwalk, one after another.
    choices:
      - text: "Get up. The night's starting."
        to: 82

  66:
    title: The Pier
    text: |
      The Santa Monica Pier smells of popcorn and creosote. Halfway along it, between the bait shop and the carousel, is a tan Buick Electra with sand in its wheel arches.

      There's a parking ticket under the wiper, dated Saturday, 11:14 pm. The police towed this car on Sunday. It's in their impound lot. It's also here.

      The carousel operator is holding one horse empty, and looking at you.
    choices:
      - text: "Jimmy the glovebox."
        roll: {skill: Locksmith, success: 67, failure: 70}
      - text: "Ride the carousel he's holding for you."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 68
      - text: "Find a phone, and call it in."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 69
      - text: "Find a phone, and call it in."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 69
      - text: "Find a phone, and call it in."
        requires: {note: SNAG2}
        to: 107

  67:
    title: The Glovebox
    effects:
      - gain: tab
    text: |
      The glovebox opens with a sigh. Maps of the Mojave, a pair of sunglasses, a film can.

      In the film can, on a bed of cotton wool, is one square of blotter paper stamped with a tiny orange sun.

      When you straighten up, the ticket has gone from the wiper.
    choices:
      - text: "Walk to the end of the pier."
        to: 70

  68:
    title: The Carousel
    effects:
      - note: SUNDIAL
      - san: "1/1D4"
    text: |
      The horse is white with a gold mane. The organ plays the tune.

      Round you go, past the mirror panels in the centre, and in the third panel there's a rumpled man in glasses where your reflection should be. "The sundial," he says, quite clearly. "Under the sundial." Round you go again, and he's gone.

      When the carousel stops, you step off onto the Venice boardwalk, two miles south. Nobody else seems to think this is strange.
    choices:
      - text: "Walk down onto the sand."
        to: 56

  69:
    title: Ruiz
    effects:
      - note: STATION
      - note: DOE
    text: |
      You call from the bait shop. By the time the cruiser comes, the space between the bait shop and the carousel is empty. There's a little sand on the boards.

      The sergeant is a big, tired man called Hector Ruiz. He writes you down in his notebook as if he were swatting you. "Next you'll tell me you're the Zuma Doe," he says, "singing about the city of gold. Camarillo's got a bed for you too."
    extra:
      - requires: {investigator: dee}
        text: |
          "Dee," he adds, quieter, "go home." He was your partner for six years.
      - requires: {note: SNAG2}
        text: |
          The gulls go quiet. The city is turning its back on you.
      - text: |
          He leaves you on the pier. It took him all afternoon to come.
    choices:
      - text: "Watch the sun go."
        to: 70

  70:
    title: Sunset on the Pier
    text: |
      The afternoon goes somewhere, the way afternoons do on the pier. You stand at the end of it while the sun goes down into the Pacific, red as a stop light.

      Fishermen reel in. The carousel organ stops in the middle of the tune, and waits.

      Your car is parked at the foot of the pier, which is not where you left it.
    choices:
      - text: "Walk back to the lights."
        to: 82

  71:
    title: The Girl with the Orange
    text: |
      She gets in with the orange and a smell of suntan oil. She's about nineteen. Or she's about anything.

      "Thanks," she says, and uses your name. "Griffith Observatory, please. You're looking for Leonard. That's the right way."

      You haven't told her your name.
    choices:
      - text: "Drive her where she wants to go."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 72
      - text: "Ask her how she knows who you are."
        to: 73
      - text: "Put her out at the next light."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 76
      - text: "Put her out at the next light."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 76
      - text: "Put her out at the next light."
        requires: {note: SNAG2}
        to: 107

  72:
    title: The Orange
    text: |
      You drive across the whole city with the windows down. She peels the orange in one spiral without breaking it, and gives you half.

      It's the best orange you've ever eaten. You don't say so. She smiles as if you had.

      Every light is red, all the way across town, and you don't mind.
    choices:
      - text: "Drive up into the hills."
        to: 74

  73:
    title: "\"You'll Tell Me\""
    effects:
      - note: SUNDIAL
    text: |
      "I know because you're going to tell me," she says. "Later. It's a long story, and you tell it well."

      She eats a segment of orange. "When you get to the sundial, don't sit at the bar. Sit by the rail. He likes the view."

      She won't say anything else for thirty miles. Every light is red, all the way across town.
    choices:
      - text: "Drive up into the hills."
        to: 74

  74:
    title: Griffith Observatory
    effects:
      - note: EAST
      - san: "1/1D4"
    text: |
      The observatory sits white on the hill with the whole basin spread under it, going amber in the late sun.

      She puts a dime in a coin telescope and swings it east, at nothing. "Look."

      Through the eyepiece, impossibly close, is a white dish standing alone on a salt flat. A hundred and fifty miles away. You can see the rivets.

      "Friday," she says. She's holding out a matchbook.
    choices:
      - text: "Take the matchbook."
        requires: {no_item: matchbook}
        effects: [{gain: matchbook}]
        to: 75
      - text: "Show her you have one already."
        requires: {item: matchbook}
        to: 75

  75:
    title: Gone
    text: |
      When you look up from the matchbook, she isn't there. Just the orange peel on the parapet, in one long spiral.

      Below you, the lights of Los Angeles come on, all at once, like a held breath let out.
    choices:
      - text: "Drive down into the night."
        to: 82

  76:
    title: The Flat
    effects:
      - note: TAILED
    text: |
      "Sure," she says, with no hard feelings at all, and gets out at the light at Sunset.

      The light changes. Your front tyre goes with a bang. She waves from the window of a bus.

      While you're kneeling in the gutter with the jack, a grey Plymouth pulls in behind you. A man in a grey suit asks, very kindly, if you need any help. He looks at your face for a long time before he drives away.
    extra:
      - requires: {note: SNAG2}
        text: |
          The bus is gone. The city is turning its back on you.
      - text: |
          The spare is flat too. The garage on Sunset takes all afternoon to find you a tyre, and by the time it's on, the sun is going down.
    choices:
      - text: "Drive on into the evening."
        to: 82

  # ---------------------------------------------------------------------------------------------------------------
  # AFTERNOON INVITATIONS THAT RUN INTO THE NIGHT
  # ---------------------------------------------------------------------------------------------------------------

  77:
    title: Following the Truck at Sundown
    text: |
      You follow the pink truck across the city as the sun goes down behind you. It never goes fast, and you never quite catch it.

      It turns north, and climbs, and stops at last on the Sunset Strip, outside a club with a neon moth over the door. The tune plays one more time, and the truck drives off down the hill.
    choices:
      - text: "Go and look at the club."
        to: 83

  78:
    title: A Ride into Hollywood
    text: |
      She gets in with the orange and a smell of suntan oil. "Thanks," she says, and uses your name. "The Strip, please. There's a club. You'll want to be there tonight."

      You drive into the sunset and then away from it. She peels the orange in one long spiral and gives you half.

      She gets out on Sunset Boulevard, under a neon moth, and walks into the crowd, and you can't find her again.
    choices:
      - text: "Park, and go in after her."
        to: 83

  79:
    title: The Cab
    text: |
      The cab doesn't go to the pier. It goes north, and north, as the sun goes down behind you, all the way to the foothills.

      It stops in Altadena, across the street from a low ranch house under the mountains, the Voss house. The driver won't take money. "You'll want to be here tonight," he says, and drives off.

      You sit on the kerb while it gets dark, and then there's a car you can sit in, which is your own. You don't ask how.
    choices:
      - text: "Watch the house."
        to: 94

  # ---------------------------------------------------------------------------------------------------------------
  # HUBS
  # ---------------------------------------------------------------------------------------------------------------

  80:
    title: Noon
    text: |
      You eat at a burger stand on stilts, under a giant fibreglass hot dog. The waitress puts down a cheeseburger, no onions, and a vanilla shake. It's exactly what you were going to order.

      "Same as always," she says. You have never been here before.

      Half the day is gone.
    choices:
      - text: "Drive up to the Voss house in Altadena."
        requires: {no_note: HOUSE}
        to: 9
      - text: "Go to Helion Dynamics in El Segundo."
        requires: {no_note: HELION}
        to: 22
      - text: "Drive up Topanga Canyon."
        requires: {no_note: TOPANGA}
        to: 34
      - text: "Go to Venice Division, where they found the car."
        requires: {no_note: STATION}
        to: 44
      - text: "Find KSUN, the station that plays the tune."
        requires: {no_note: RADIO}
        to: 49
      - text: "Follow the pink truck that just pulled into the lot."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 55

  81:
    title: Half Past Three
    text: |
      The light goes long and yellow. Every palm tree on the boulevard throws a shadow a block long, and all the shadows point east.

      There's time for one more stop, if you push it. You'll be doing the night tired, and the city has the air of somebody who's been waiting for you somewhere else all afternoon.
    choices:
      - text: "Drive up to the Voss house in Altadena."
        requires: {no_note: HOUSE}
        effects: [{luck: -5}]
        to: 9
      - text: "Go to Helion Dynamics in El Segundo."
        requires: {no_note: HELION}
        effects: [{luck: -5}]
        to: 22
      - text: "Drive up Topanga Canyon."
        requires: {no_note: TOPANGA}
        effects: [{luck: -5}]
        to: 34
      - text: "Go to Venice Division, where they found the car."
        requires: {no_note: STATION}
        effects: [{luck: -5}]
        to: 44
      - text: "Find KSUN, the station that plays the tune."
        requires: {no_note: RADIO}
        effects: [{luck: -5}]
        to: 49
      - text: "Call it a day, and see where the night takes you."
        to: 82

  82:
    title: Dusk
    effects:
      - unnote: NOON
      - unnote: LATE
    text: |
      Dusk. Over the smog, the whole sky turns the colour of a tequila sunrise.

      Neon comes on along Sunset. The freeways fill with red lights going home. Wednesday night in Los Angeles, and the city humming under it all, like a fridge, if you listen.
    choices:
      - text: "Go to the Gilded Moth, the club on the Strip that half the city is talking about."
        to: 83
      - text: "Drive up to Owen's party in Topanga."
        requires: {note: PARTY}
        to: 89
      - text: "Stake out the Voss house in Altadena."
        to: 94
      - text: "Keep your dinner date with Dr. Marrow."
        requires: {note: INVITED}
        to: 100
      - text: "Go home to bed."
        to: 104

  # ---------------------------------------------------------------------------------------------------------------
  # NIGHT: THE GILDED MOTH
  # ---------------------------------------------------------------------------------------------------------------

  83:
    title: The Gilded Moth
    effects:
      - unnote: NOON
      - unnote: LATE
    text: |
      The Gilded Moth is a black box on the Sunset Strip with a neon moth over the door, wings flickering gold and pink. The line goes round the block.

      The doorman is seven feet tall and wears a velvet cape. He looks at you as if you were weather.
    choices:
      - text: "Show him the tickets you won on the radio."
        requires: {note: TICKETS}
        to: 84
      - text: "Flash your press card."
        requires: {item: press-pass}
        to: 84
      - text: "Tip him like a man with an expense account."
        requires: {skill: Credit Rating, min: 40}
        roll: {skill: Credit Rating, success: 84, failure: 87}
      - text: "Give it up, and go home to bed."
        to: 104
      - text: "Talk your way past him."
        roll: {skill: [Charm, Fast Talk, Persuade], success: 84, failure: 87}

  84:
    title: Mandala Weather
    text: |
      Inside it's dark and hot and smells of sweat and incense. The house band, Mandala Weather, is playing to a packed room.

      They're playing the tune. Not a cover, not quite. They play it as if they're remembering it as they go, and the crowd sways like kelp.

      By the stage, a girl in a silver dress holds out her hand to you.
    choices:
      - text: "Find the bassist between sets."
        to: 85
      - text: "Dance with her."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 86
      - text: "Leave before it gets any weirder."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 87
      - text: "Leave before it gets any weirder."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 87
      - text: "Leave before it gets any weirder."
        requires: {note: SNAG2}
        to: 107

  85:
    title: The Bassist
    text: |
      The bassist is drinking milk in the alley door. "Nobody wrote it, man. It came over the radio last June. We all woke up knowing it."

      He has seen Leonard, from the photograph. "Saturday night. Dancing alone, in a suit, with his eyes shut. Happiest cat in the room." He finishes the milk. "And it always stops a bar short. Every time. Like it's waiting for somebody."
    choices:
      - text: "Stay till closing."
        to: 88

  86:
    title: Everyone at Once
    effects:
      - note: SUNDIAL
      - san: "1/1D4"
    text: |
      You don't dance. You dance.

      The whole room moves as one animal. For a second the ceiling isn't there, and you are dancing on a roof under a gold sky, under the shadow of an enormous sundial.

      Then the room is back. The girl puts her mouth to your ear. "Sundial," she says. "Don't be late."
    choices:
      - text: "Dance till closing."
        to: 88

  87:
    title: The Alley
    effects:
      - hp: "-1D3"
      - note: TAILED
    text: |
      In the alley behind the club, two men in grey suits are waiting by the bins. They don't say anything. One of them hits you, politely, in the stomach.

      "Dr. Marrow would like to meet you," the other says, as you look at the asphalt. "When you're feeling better."
    extra:
      - requires: {note: SNAG2}
        text: |
          The neon moth goes dark over the door. The city is turning its back on you.
      - text: |
          Their car is grey. You'll know it again.
    choices:
      - text: "Get up, eventually."
        to: 88

  88:
    title: Two in the Morning
    text: |
      At two the doors open, and the crowd spills out, younger and more tired than it went in.

      Out on the Strip, a girl in a silver dress is walking west, barefoot, carrying her shoes. She looks back at you once, the way you'd look at someone you'd arranged to meet.
    choices:
      - text: "Go home."
        to: 108
      - text: "Follow her down to the beach."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 112

  # ---------------------------------------------------------------------------------------------------------------
  # NIGHT: OWEN'S PARTY
  # ---------------------------------------------------------------------------------------------------------------

  89:
    title: The Dome at Night
    text: |
      The geodesic dome glows like a paper lantern on the dark hill. Candles, a sitar, goats wearing flowers. A girl is ladling purple punch out of a bathtub.

      Thirty people lie on cushions with their eyes shut, smiling at the same thing.
    extra:
      - requires: {note: OWEN}
        text: |
          Owen hugs you at the door like a brother home from a war.
      - text: |
          Somebody puts a paper cup of punch into your hand.
    choices:
      - text: "Drink the punch."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 90
      - text: "Find Owen."
        to: 91
      - text: "Leave. This isn't detective work."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 92
      - text: "Leave. This isn't detective work."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 92
      - text: "Leave. This isn't detective work."
        requires: {note: SNAG2}
        to: 107

  90:
    title: The Punch
    effects:
      - note: SUNDIAL
      - san: "-8"
    text: |
      It tastes of grape and pennies. After a while the dome begins to breathe.

      You're on a rooftop over a gold city. There's a bar, and the shadow of a sundial lies across it, though it's night. A man in a rumpled suit sits on a stool by the rail, looking at the view. He doesn't turn round.

      Someone puts a blanket over you.
    choices:
      - text: "Sleep where you are."
        to: 93

  91:
    title: The Kitchen
    effects:
      - note: BELAIR
      - note: OWEN
    text: |
      Owen is in the kitchen, washing glassware and humming the tune.

      "Leonard? He played me a tape, Friday. A hum, with a song in it. I made a copy and sold it to Sol Vance, the producer, in Bel Air. Sol plays it at his pool parties." He looks ashamed. "I needed the bread."

      He dries his hands and looks at you. "You want one? For later?" He means a tab.
    choices:
      - text: "Take the tab he offers."
        requires: {no_item: tab}
        effects: [{gain: tab}]
        to: 93
      - text: "Find a beanbag, and stay the night."
        to: 93

  92:
    title: The Deer
    effects:
      - hp: "-1D4"
    text: |
      You drive down the canyon in the dark with the window open to stay awake.

      At the third hairpin a deer stands in your headlights, looking at you with enormous calm. You swerve. The car goes off the road and down the bank and stops against a sycamore, very gently, the way a cat lies down.
    extra:
      - requires: {note: SNAG2}
        text: |
          The headlights flicker out. The city is turning its back on you.
      - text: |
          You don't remember falling asleep.
    choices:
      - text: "Sleep where you are."
        to: 111

  93:
    title: Beanbag
    text: |
      You sleep on a beanbag shaped like a mushroom, under a quilt that smells of goat.

      Someone is playing the tune on a recorder, very softly, until dawn.
    choices:
      - text: "Sleep."
        to: 110

  # ---------------------------------------------------------------------------------------------------------------
  # NIGHT: THE STAKEOUT
  # ---------------------------------------------------------------------------------------------------------------

  94:
    title: Stakeout
    effects:
      - unnote: NOON
      - unnote: LATE
    text: |
      Eleven o'clock in Altadena. You're slumped behind the wheel across the street from the Voss house, with cold coffee and the mountains black overhead.

      A grey Plymouth pulls into Marian's drive. A man in a grey suit gets out, straightens his tie, and rings the bell. She lets him in.

      A cat jumps onto your hood and sits there, looking at you through the windshield.
    choices:
      - text: "Creep up under the window and listen."
        roll: {skill: Listen, success: 95, failure: 96}
      - text: "Wait, and follow his car when he leaves."
        roll: {skill: Drive Auto, success: 97, failure: 96}
      - text: "Follow the cat."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 98

  95:
    title: Through the Window
    effects:
      - note: MOTIVE
    text: |
      Under the living-room window, in the oleanders, you can hear every word.

      "...nothing to worry about, Mrs. Voss," the grey man says, warmly. "If Leonard is alive, he's in breach of contract, and we'll sort that out. And if he isn't..." A pause, like a doctor's. "Then the company is very generous. The policy pays double, if he's gone before Saturday."

      Marian doesn't say anything at all.
    choices:
      - text: "Back off to the car."
        to: 99

  96:
    title: Spotted
    effects:
      - note: TAILED
    text: |
      The porch light comes on. The grey man stands in the doorway and looks straight across the street at you.

      He lifts one hand, the way you'd wave to a neighbour. Then he goes back inside, and draws the curtain.
    choices:
      - text: "Sit there, feeling stupid."
        to: 99

  97:
    title: The Hangar
    effects:
      - note: SUNWARD
    text: |
      You follow the Plymouth down the Pasadena Freeway, across the city, all the way to the airport. It turns in at a hangar behind Helion Dynamics.

      Through a gap in the fence you see crates stencilled SUNWARD going into a helicopter. Then a row of padded reclining chairs, like a dentist's, with headphones hanging from them. Men in grey coveralls load them as gently as coffins.
    choices:
      - text: "Watch until the hangar goes dark."
        to: 99

  98:
    title: The Pool
    effects:
      - note: SUNDIAL
      - san: "1/1D6"
    text: |
      The cat leads you over the back fence and down the side of the house to the green pool.

      The water is very still. It is reflecting stars, but not these stars, and a gold skyline, and a rooftop with an enormous sundial on it. A man in a rumpled suit is standing on the roof, looking up at you.

      The cat drinks from the pool, and the picture breaks.
    choices:
      - text: "Go back to the car."
        to: 99

  99:
    title: Dozing
    text: |
      You mean to stay awake. The coffee is cold, and the radio is playing the tune very quietly.

      You fall asleep in the front seat with your head against the window, and dream of nothing you can remember.
    choices:
      - text: "Sleep."
        to: 109

  # ---------------------------------------------------------------------------------------------------------------
  # NIGHT: DINNER WITH DR. MARROW
  # ---------------------------------------------------------------------------------------------------------------

  100:
    title: Musso and Frank
    effects:
      - note: LULLABY
    text: |
      Musso and Frank, on Hollywood Boulevard: red leather, waiters older than the movies. Dr. Edith Marrow is fifty-eight, grey-haired and handsome, with tired eyes and a martini.

      "California is having a nervous breakdown," she says. "Campuses on fire, people dropping acid in the schoolyards. I'm going to give it a good night's sleep. That's all LULLABY is. A lullaby."

      She smiles. "Leonard was going to help me. Now I'd like you to."
    choices:
      - text: "Let her show you what she means."
        to: 101
      - text: "Tell her whose side you're on."
        to: 102

  101:
    title: The Listening Room
    effects:
      - san: "1/1D6"
    text: |
      Helion at midnight. She takes you down to a room without windows, lit blue.

      Twelve reclining chairs, twelve people in them, young, in headphones, smiling the same small smile. Their eyes move under the lids. A technician writes down what they mumble.

      "Volunteers," Marrow says. "They can hear it. They can even find people in it." She looks at you. "Stay. See the morning shift. We have a guest room."
    choices:
      - text: "Stay the night in Helion's guest room."
        to: 113
      - text: "Walk out."
        to: 103

  102:
    title: Cool
    effects:
      - note: TAILED
    text: |
      "Then we want the same thing," Marrow says, unoffended. "Leonard home, safe, and quiet." She puts a card beside your plate: her home number, written in fountain pen.

      She pays. Outside, a grey Plymouth is waiting at the kerb, and Calloway holds the door. "I'll drive you home," he says. It isn't an offer.
    choices:
      - text: "Let him drive you home."
        to: 108

  103:
    title: Walking Out
    effects:
      - note: TAILED
    text: |
      "Of course," Marrow says, as if you'd declined dessert.

      A guard walks you up to the lobby and out into the jet noise. All the way home, there's a grey Plymouth in your mirror, never closer than two cars and never further. It's still parked across the street when you turn your light out.
    choices:
      - text: "Go to bed."
        to: 108

  # ---------------------------------------------------------------------------------------------------------------
  # NIGHT: HOME
  # ---------------------------------------------------------------------------------------------------------------

  104:
    title: Home
    text: |
      You go home, eat something out of a can standing up, and fall into bed with your shoes on.

      You dream of a staircase going up the outside of a building on Sunset Boulevard, into a gold sky. At the top is a roof, and a bar, and the slow shadow of a sundial. Someone up there is waiting.
    choices:
      - text: "Climb the stairs in the dream."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 105
      - text: "Wake yourself up."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 106
      - text: "Wake yourself up."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 106
      - text: "Wake yourself up."
        requires: {note: SNAG2}
        to: 107

  105:
    title: The Rooftop
    effects:
      - note: SUNDIAL
    text: |
      At the top of the stairs is a rooftop bar, with gold light and soft music. The shadow of an enormous sundial lies across the floor, though it's night.

      A man in a rumpled suit sits by the rail, looking at the view. He starts to turn round.

      You sleep the rest of the night without moving.
    choices:
      - text: "Sleep."
        to: 108

  106:
    title: Bad Sleep
    effects:
      - note: TAILED
    text: |
      You sit up in the dark with your heart going. You put the lamp on and leave it on.

      You don't sleep again. At four you're still sitting up with a cigarette, and the radio won't find any station but KSUN. At six you go out to your car and find a grey Plymouth parked across the street, with a man asleep in it.
    extra:
      - requires: {note: SNAG2}
        text: |
          The dawn comes up grey, with no colour in it at all. The city is turning its back on you.
      - text: |
          You get in your own car to wait for him to wake up, and fall asleep there yourself.
    choices:
      - text: "Sleep."
        to: 109

  # ---------------------------------------------------------------------------------------------------------------
  # THREE STRIKES
  # ---------------------------------------------------------------------------------------------------------------

  107:
    title: Bakersfield
    ending: scolded
    text: |
      You say no to the city a third time, and it stops asking.

      You wake up in a motel in Bakersfield with no memory of the drive. The air smells of oil and onions. Your wallet is on the dresser. Marian's address is not.

      You drive home on Thursday. No phone calls. No trucks. The radio plays the Top Forty and nothing else. On Monday a Helion engineer is declared dead, and you don't connect it to anything.
    extra:
      - text: |
          Three times the city held a door open for you. Three times you looked at your watch.
  # ---------------------------------------------------------------------------------------------------------------
  # ACT TWO: THE CHAIN. THURSDAY 19 MARCH 1970, 7 AM TO MIDNIGHT
  # ---------------------------------------------------------------------------------------------------------------

  # ---- Six mornings ----------------------------------------------------------------------------------------------

  108:
    title: Your Own Bed
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      Thursday. Seven o'clock, and the light comes through the blinds in stripes the colour of orange juice.

      You slept. You must have. Your shoes are side by side by the door, which is not where you leave them.

      Down on the corner, the pay phone is ringing. It rings the way a phone rings when it knows you're listening.
    choices:
      - text: "Go down and answer it."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 114
      - text: "Let it ring, and make coffee like a human being."
        effects: [{note: SNAG}, {luck: -5}]
        to: 115
      - text: "Skip the phone. Drive up the coast to Camarillo and see the John Doe."
        requires: {note: DOE}
        to: 179

  109:
    title: The Front Seat
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      You wake behind the wheel with a crick in your neck and the windshield fogged from the inside.

      A grey Plymouth is parked behind you, close enough to kiss your bumper. A knuckle taps on your window. You wipe the glass.

      The man outside has a grey suit, a kind face and two coffees in a cardboard tray. "Hollis Calloway, Helion Dynamics," he says. "Dr. Marrow would like to buy you breakfast. She asked me to say please."
    choices:
      - text: "Take the coffee, and go with him."
        to: 155
      - text: "Start the car, and leave him standing in your exhaust."
        effects: [{note: SNAG}, {luck: -5}]
        to: 156

  110:
    title: Owen's Beanbag
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      You wake in a beanbag with a goat looking at you. The dome smells of incense and cold coffee.

      Outside, Owen is warming up a school bus painted the colours of a fruit stand. He leans out of the door. "Leonard played me a tape on Friday," he says. "I made a copy and sold it to Sol Vance, a producer in Bel Air. He'll be up. He's always up. Come on, man."
    choices:
      - text: "Climb aboard Owen's bus."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 363
      - text: "Thank him, and hitch down to the coast on your own."
        effects: [{note: SNAG}, {luck: -5}]
        to: 115

  363:
    title: The Fruit-Stand Bus
    text: |
      Owen drives the bus down the canyon like a man steering a cloud, singing to the goats he left behind. Along Sunset, people wave at it. Up in Bel Air, the gardeners stop raking to watch it go by.

      "Sol's pool is the best place in town to hear it," he says, and parks on the lawn. Then he wanders off towards the music, and you don't see him again all day.
    choices:
      - text: "Follow the music."
        to: 146

  111:
    title: The Ditch
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      Grey light, wet ferns, and the smell of a radiator that has given up. Your car spent the night nose-down in a Topanga ditch, and so did you.

      At seven sharp a tow truck grinds up the canyon and stops beside you. Nobody called it. The driver is chewing a toothpick and wearing sunglasses at dawn.

      "Tar pits, right?" he says, and hooks up your bumper before you can answer.
    choices:
      - text: "Climb into the cab."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 174

  112:
    title: The Sand
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      You wake on Venice beach with sand in your collar and the tide politely not reaching you. The girl in the silver dress is gone. She has left you a ring of orange peel, laid out on the sand like a clock face.

      Up on the boardwalk, a city bus is idling at a stop that isn't there. Where the route number should be, the little window is blank.
    choices:
      - text: "Brush off the sand, and get on the bus."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 130

  113:
    title: The Guest Room
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      You stayed, and Helion was very hospitable about it. You slept on the fourth floor, in a guest room with a framed photograph of a rocket and a door that locks from the outside. It is unlocked now.

      There is a clean shirt your size on the chair. There is coffee. At eight, Mr. Calloway knocks, gently, the way he does everything.
    choices:
      - text: "Put on the shirt, and follow him."
        to: 155

  # ---- The phone ---------------------------------------------------------------------------------------------------

  114:
    title: Collect
    text: |
      "Collect call from Thursday," says the operator. "Will you accept the charges?"

      You say yes before you think about it.

      "Take the first thing that stops for you," she says, kindly, and there is a click, and someone you know is on the line.
    extra:
      - requires: {investigator: ray}
        text: |
          "Raymond, honey." Madame Ocampo, the palm reader on the canals. "Kingfish has been saying your name since five. Come before he gets hoarse."
      - requires: {investigator: dee}
        text: |
          "Dee." Hector Ruiz, your old partner, in his three-in-the-morning voice. "You need to see the impound. Don't tell me I'm crazy till you've seen it."
      - requires: {investigator: morton}
        text: |
          "Mr. Gale?" Mr. Haskell's secretary at Golden Shield. "He wants you in his office by nine. He said to say 'the Voss file', and 'today'."
      - requires: {investigator: lena}
        text: |
          "Kowalski, get down here." Gus, your editor. "The mailman just quit. There are four sacks of letters in the office and they're all about the same damn dream."
      - text: The line goes dead. You hang up the receiver, which is warm.
    choices:
      - text: "Go to Madame Ocampo's."
        requires: {investigator: ray}
        to: 116
      - text: "Go to the impound lot."
        requires: {investigator: dee}
        to: 119
      - text: "Go to Spring Street, and Mr. Haskell."
        requires: {investigator: morton}
        to: 122
      - text: "Go to the Mirage."
        requires: {investigator: lena}
        to: 127

  115:
    title: Every Phone
    text: |
      The morning goes sour by inches.

      Every phone booth you pass is ringing. A pigeon gets you on the shoulder. A parking ticket flutters under your wiper, dated tomorrow. Your coffee is cold before you've paid for it. In the window of a TV shop on Lincoln, twelve sets are showing a test card, and the test card is a picture of you.
    extra:
      - requires: {note: SNAG2}
        text: The city isn't angry yet. It is starting to look past you, the way a waiter looks past a table that hasn't tipped.
      - text: By ten you are standing at a bus stop on a corner, with no idea how you got there.
    choices:
      - text: "Wait, and see what stops."
        to: 129

  # ---- Ray's morning ---------------------------------------------------------------------------------------------

  116:
    title: Madame Ocampo's Parrot
    text: |
      Madame Ocampo reads palms in a pink bungalow on the Venice canals, between a duck pond and a poet. She is sixty, in four shawls, and she doesn't take money from you anymore.

      Kingfish, a green Amazon parrot older than she is, sits on a coat rack by the window. "He only ever says what will be true," she says. "Ask him one thing, Raymond. Just one. He sulks."
    choices:
      - text: "Ask him where Leonard Voss is."
        to: 117
      - text: "Ask him about yourself."
        to: 118

  117:
    title: '"Friday!"'
    effects:
      - note: EQUINOX
      - note: SUNDIAL
    text: |
      Kingfish puts his head on one side and considers you with a gold eye.

      "Friday!" he says. "Four fifty-six! Four fifty-six!" Then, in a perfect imitation of a cocktail waitress, "Last call at the Sundial!"

      Madame Ocampo writes it all on the back of an envelope and folds it into your pocket. "Friday, at four fifty-six," she says. "Don't be late. He hates late."
    choices:
      - text: "Kiss her cheek, and go out to the street."
        to: 129

  118:
    title: '"Coincidence!"'
    effects:
      - luck: 10
      - san: "0/1D3"
    text: |
      Kingfish looks at you for a long time. Then he laughs, a terrible human laugh, a man's laugh.

      "Coincidence!" he says. "You're a coincidence!"

      Madame Ocampo goes pale under her rouge. She presses a penny into your hand, a 1936 Lincoln, the year you were born. "Keep it on you," she says. "Whatever you are, honey, you're lucky."
    choices:
      - text: "Pocket the penny, and go out to the street."
        to: 129

  # ---- Dee's morning ---------------------------------------------------------------------------------------------

  119:
    title: The Buick Came Back
    text: |
      The Venice impound is a chain-link pen behind the station. Hector Ruiz meets you at the gate, unshaven, with his tie in his pocket.

      The Buick is there, in its old space. Last night it was gone. The night man swears it drove itself out at six and came back at dawn. Ruiz opens the door, and sand pours out over his shoes, a whole beach of it, warm.

      "Nobody signed it in," he says. "I'm not crazy, Dee. Tell me I'm not crazy."
    choices:
      - text: "Tell him the truth, as far as you know it."
        to: 120
      - text: "Tell him you need the Zuma file."
        to: 121

  120:
    title: Partners
    effects:
      - note: RUIZ
    text: |
      You tell him all of it: the wrong numbers, the truck, the tune. You expect him to laugh.

      He doesn't. He kicks the sand off his shoes. "My mother used to say Los Angeles was a place people dreamed on purpose," he says. "I'm on nights till Sunday. You need a cop, you call this cop."

      He shakes your hand the way he did in '59, the day they made you partners, and goes inside to pretend he didn't see any of this.
    choices:
      - text: "Leave him to it, and go out to the street."
        to: 129

  121:
    title: The Zuma File
    effects:
      - note: DOE
    text: |
      Ruiz brings it out in a manila folder. It's a county sheriff's report, not his: a John Doe pulled out of the surf at Zuma on Sunday morning. No ID. Male, Caucasian, "25-30". Singing. Sent to Camarillo State Hospital on Monday.

      The photo is a young man with Leonard Voss's face, the face Voss must have had in 1948.

      "Voss doesn't have a son," Ruiz says. "I checked."
    choices:
      - text: "Take the file, and go out to the street."
        to: 129

  # ---- Morton's morning ------------------------------------------------------------------------------------------

  122:
    title: Mr. Haskell
    text: |
      Golden Shield's offices take up three floors of Spring Street, all walnut and worry. Mr. Haskell's desk is the size of a lifeboat.

      "Helion's lawyers were here at eight," he says. "They want Voss declared dead. Today. The police say he walked into the sea. Sign the form, Morton, and we'll argue about the money later."

      The form is on the desk. So is the file.
    choices:
      - text: "Read the file again, line by line."
        requires: {skill: Accounting, min: 50}
        roll: {skill: Accounting, success: 123, failure: 125}
      - text: "Tell him the claim stinks, and you won't put your name to it."
        to: 124

  123:
    title: The Rider
    effects:
      - note: MOTIVE
      - note: DOE
    text: |
      There it is, in eight-point type on page forty. A rider: the policy pays double if Dr. Voss dies before midnight on 20 March 1970. Tomorrow. One million dollars, if he's dead by Friday.

      And clipped behind it, misfiled, a county hospital bill. A John Doe from Zuma beach, transferred Monday to Camarillo State Hospital. Somebody here flagged it, because the Doe was found twenty miles up the coast from where Voss went in.

      Haskell watches you read. He doesn't ask what you've found. He doesn't want to know.
    choices:
      - text: "Close the file, and go out to the street."
        to: 129

  124:
    title: Stalled
    effects:
      - note: STALLED
    text: |
      Haskell goes the colour of the walnut. You talk him round with the only argument he understands, the one about Golden Shield's money. Nothing is paid until a body is found, or until Monday.

      "Monday," he says. "And if Helion sues, it's your pension."

      You take the file with you. Nobody stops you.
    choices:
      - text: "Go out to the street."
        to: 129

  125:
    title: The Form
    text: |
      The figures swim. Page forty is just a page. Your eyes are fifty-one years old, and Haskell is tapping the form with his pen.

      "It's a formality, Morton. The man walked into the Pacific."

      The pen is a good one, a Parker, and it is already uncapped.
    choices:
      - text: "Sign it."
        to: 126
      - text: "Cap the pen, and say you need until Monday."
        to: 124

  126:
    title: Signed
    ending: scolded
    text: |
      Your signature is very neat. Haskell blots it himself.

      Golden Shield pays Helion Dynamics one million dollars on Friday afternoon, at four o'clock. At four fifty-six you are in a bar on Spring Street, and the jukebox plays a tune you almost know, and every head in the room turns east, except yours.

      On Saturday, a John Doe in Camarillo stops singing. Nobody connects him with anything. The paperwork is in order. You saw to that.
    extra:
      - text: You signed a living man dead before lunch, Morton. Twenty years of finding the lie in the file, and this time you were the lie.

  # ---- Lena's morning --------------------------------------------------------------------------------------------

  127:
    title: The Mirage
    text: |
      The Mirage lives behind a laundromat on Lincoln, and smells of ink and fabric softener. Four mail sacks lean on the press like drunks.

      Gus, your editor, hands you a fistful. Every letter describes the same city: gold towers where downtown should be, freeways that run like rivers, music with no band. Housewives, a Marine, a priest, a nine-year-old with crayons.

      Two letters are different. One has a return address in Silver Lake. The other is on Camarillo State Hospital notepaper, from a night nurse, about a John Doe from Zuma who sings about the same city.
    choices:
      - text: "Tell Gus to run the letters as Friday's cover."
        to: 128
      - text: "Answer the letter from Silver Lake, in person."
        to: 141
      - text: "Answer the night nurse at Camarillo, in person."
        effects: [{note: DOE}]
        to: 179

  128:
    title: Cover Story
    effects:
      - note: STORY
      - note: EAST
    text: |
      Gus says yes, which he never does, and starts setting type with his tongue between his teeth. FOUR HUNDRED ANGELENOS DREAM THE SAME CITY.

      In the last sack you find a Polaroid with no letter. A white dish on white salt, with mountains behind it and the sky gone gold. On the back, in pencil: *east of Amboy*.
    choices:
      - text: "Pin it over your desk, and go out to the street."
        to: 129

  # ---- The curb --------------------------------------------------------------------------------------------------

  129:
    title: What Stops for You
    text: |
      Out on the sidewalk, the morning is hot and very still. You stand at the kerb and wait to see what the city sends.

      It doesn't keep you waiting. A city bus with a blank window where the route number goes sighs to a stop in front of you. Behind it, a black studio limousine glides up, and its driver lowers his window and says your name, correctly, with the middle initial.
    extra:
      - requires: {note: DOE}
        text: Up the coast, fifty miles away, a John Doe is singing in Camarillo. You could just go.
      - text: Across the street, a grey Plymouth is parked with its engine running.
    choices:
      - text: "Get on the bus with no number."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 130
      - text: "Get in the limousine."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 137
      - text: "Drive up the coast to Camarillo."
        requires: {note: DOE}
        to: 179
      - text: "Ignore all of it, and go and get some answers out of Helion."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 156
      - text: "Ignore all of it, and go and get some answers out of Helion."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 156
      - text: "Ignore all of it, and go and get some answers out of Helion."
        requires: {note: SNAG2}
        to: 204

  # ---- The bus with no number ------------------------------------------------------------------------------------

  130:
    title: The Bus with No Number
    text: |
      The fare box takes your quarter and gives you back a dime.

      Every passenger is asleep, and every one of them is smiling. A nurse, a man in a hard hat, two kids with a transistor radio. The driver hums. You know the tune.

      Near the back, a young surfer sits with his board across his knees, watching the stops go by the way you'd watch waves.
    extra:
      - requires: {note: BIX}
        text: It's Bix. He raises two fingers off the board, as if he'd saved you the seat.
      - text: The bus pulls out without a sound.
    choices:
      - text: "Ride it to the end of the line."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 133
      - text: "Sit with the surfer."
        to: 131
      - text: "Pull the cord at the next corner, and get off."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 132
      - text: "Pull the cord at the next corner, and get off."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 132
      - text: "Pull the cord at the next corner, and get off."
        requires: {note: SNAG2}
        to: 204

  131:
    title: Bix
    effects:
      - note: BIX
    text: |
      The surfer slides over. "Bix," he says. "Halloran. In case you forgot, or never knew."

      He was a medic in the Delta until '68. Now he surfs, and reads the sets. "Since the summer before last the whole city's breaking in threes," he says. "Wrong number, right number, ice-cream truck. You're riding it, man. I can tell by your face."

      He'll come along. He's got nowhere he'd rather be, and a van, if it comes to that.
    choices:
      - text: "Ride on with him to the end of the line."
        to: 133

  132:
    title: "Off the Bus"
    effects:
      - note: DOE
    text: |
      You pull the cord. The bus stops at once, and you step down into rain. It hasn't rained in Los Angeles since February.

      The bus has gone, and your wallet with it, though not your coat. You are on a bench in Oxnard, fifty miles up the coast, under a sign that reads CAMARILLO STATE HOSPITAL, 4 MI. VISITING 2 TO 6.

      An orderly on the bench beside you is eating a sandwich. "You here for the Zuma Doe?" he asks. "Everybody's here for the Zuma Doe. Sings all day. Wakes up at four minutes to five."
    extra:
      - requires: {note: SNAG2}
        text: The rain falls only on your bench. The city has started to look past you.
      - text: He offers you a ride the rest of the way. His shift starts at two.
    choices:
      - text: "Take the ride."
        to: 180

  133:
    title: The River
    effects:
      - san: "1/1D6"
    text: |
      The bus turns off the Golden State Freeway, through a gap in a fence, and down a concrete ramp into the bed of the Los Angeles River.

      Concrete walls, a trickle down the middle, shopping carts. Then, for one block, the trickle is a river of light, running fast and gold and silent under the wheels. The sleeping passengers sigh.

      Under the Hyperion bridge the driver stops, opens the door and says, "Silver Lake."
    choices:
      - text: "Get off where he tells you."
        to: 141
      - text: "Stay on, and see where else it goes."
        to: 134

  134:
    title: Homes of the Stars
    text: |
      The bus climbs out of the river into the hills, and somewhere on the way it becomes a tour bus. The driver has a microphone now.

      "On your left, folks, the home of Rudolph Valentino. On your right, Mary Pickford." The houses go by. "And here, folks, a little stucco place where a kid once cried all night over a lost dog."

      It's your house. The one you grew up in. There's a bike on the lawn that you sold the summer you left home.
    choices:
      - text: "Stay aboard to the last stop."
        to: 135
      - text: "Get off now, before it goes any further."
        to: 141

  135:
    title: The Last Stop
    text: |
      The bus stops on your old street. The cars are all wrong, finned and bright and new. A screen door bangs. Somebody on the porch is calling your name, the short version only family uses.

      The driver opens the door and waits. "End of the line," he says. "Or I go back round."
    choices:
      - text: "Step down onto the street."
        to: 136
      - text: "Stay in your seat, and let him go back round."
        to: 141

  136:
    title: Nineteen Fifty-Eight
    ending: strange
    text: |
      You step down onto a street you know, in a year you know. Nineteen fifty-eight. The smog is thinner. The Dodgers have just come west, and everyone is happy about it.

      Nobody looks twice. You have a few dollars in your pocket that still spend.

      You find a room, and a job, and you wait for the sixties. When they come, you are older than everyone else at the party, and you know all the words.
    extra:
      - text: In March 1970 you take a long walk, all of Thursday, and are careful not to answer any phones.

  # ---- The limousine and the backlot -----------------------------------------------------------------------------

  137:
    title: The Limousine
    text: |
      The back seat is grey velour and smells of somebody's cigar from 1946. There is a little bar with no bottles in it, only an orange.

      "Mr. Vance's car," says the driver, pulling out. "Mr. Vance didn't send it. It just goes where it likes these days. I just steer."
    choices:
      - text: "Sit back, and let him drive."
        to: 139
      - text: "Lean forward, and demand to know where he's taking you."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 138
      - text: "Lean forward, and demand to know where he's taking you."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 138
      - text: "Lean forward, and demand to know where he's taking you."
        requires: {note: SNAG2}
        to: 204

  138:
    title: The Shoulder
    effects:
      - hp: -1D3
      - note: TAILED
    text: |
      The driver pulls onto the shoulder of the Santa Monica Freeway without a word. He opens your door. He gets back in and drives away.

      You stand in the hot wind of the trucks. A station wagon sideswipes the guardrail beside you and showers you with glass. Then a grey Plymouth eases onto the shoulder behind you, and two men in grey suits get out, and neither of them seems to have quite enough face.
    extra:
      - requires: {note: SNAG2}
        text: The traffic doesn't slow for you. The city has started to look past you.
      - text: You run for your life.
    choices:
      - text: "Run for the next exit, and get a car."
        to: 156

  139:
    title: Monarch Pictures
    text: |
      The limousine drives through the gate of Monarch Pictures in Culver City without stopping. It parks between a Roman street and a Western saloon.

      A huge sky hangs in a frame, painted on glass: a sunset over a city of gold towers. An old grip in a paper hat is touching it up. "Agnes Pike did that one for Metro in '39. We bought it at their auction," he says. "She lives in Silver Lake. She's painting it again, they say. Same city. Every night."

      He writes her address on a cigarette paper. A man in a silk shirt is waving at you from across the lot.
    extra:
      - requires: {note: BELAIR}
        text: It's Sol Vance, the producer Owen sold the tape to.
      - text: |
          "Sol Vance," he calls. "Party at my place. Bel Air. It's been going since Tuesday. Everybody's in the pool, but there's no water in it."
    choices:
      - text: "Step up to the painted sky, and through it."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 140
      - text: "Take Agnes Pike's address, and go to Silver Lake."
        to: 141
      - text: "Go to Sol's party."
        to: 146

  140:
    title: Through the Glass
    effects:
      - san: "1/1D6"
    text: |
      You put out your hand to touch the glass, and there is no glass.

      You take three steps on a gold street. Warm wind. Music from a window high up, with no band. A woman on a balcony waves to you as if you were late for dinner.

      On the fourth step you are standing on a loading dock in Silver Lake, with your hand still out. The grip's cigarette paper is in your fingers. The house is across the road.
    choices:
      - text: "Cross the road."
        to: 141

  # ---- Agnes ------------------------------------------------------------------------------------------------------

  141:
    title: Silver Lake
    effects:
      - note: AGNES
      - san: "0/1D3"
    text: |
      A green bungalow on a hill above the reservoir. The door opens before you knock.

      Agnes Pike is seventy-two, in a smock gone stiff with paint, with a voice like a dry martini. Behind her, the house is full of the same city, stacked to the ceiling. Gold towers, rivers of light, a road going east.

      "You're the detective," she says. "I painted you on Tuesday. Come in. Wipe your feet."

      On the easel is a portrait of you, finished, standing at the foot of a great white dish.
    choices:
      - text: "Ask her about the city in the paintings."
        to: 142
      - text: "Play her the reel."
        requires: {item: tape}
        to: 143
      - text: "Ask about the man who's in half the paintings."
        to: 144
      - text: "Read the paintings the way you'd read a spread of cards."
        roll: {skill: Occult, success: 144, failure: 142}

  142:
    title: It Wants to Come True
    effects:
      - gain: painting
    text: |
      "I painted skies for Metro for thirty-four years," she says, pouring tea. "Skies are easy. Nobody looks at them. Then in '67 I started waking up with paint on my hands."

      She shows you. The city gets more finished every month, as if somebody was building it.

      "It wants to come true, dear. Like a girl who came out here to be in pictures." She puts a small panel in your hands: the city on a desert road, and a gap in a wire fence. "Take that one. It's yours. I painted it for you."
    choices:
      - text: "Thank her, and stay a while."
        to: 145

  143:
    title: The Missing Bar
    effects:
      - gain: painting
      - note: LASTBAR
    text: |
      Agnes has a studio reel deck in the back room, from her Metro days. She threads the tape like a woman threading a needle.

      The hum fills the room. The tune climbs out of it. Agnes closes her eyes and hums along. Then the tune stops, and she keeps going, for one more bar, four notes, and stops.

      "There," she says. "It always stops a bar short. It's waiting to hear the end." She hums the four notes again until you have them. Then she gives you a small panel: the city, a desert road, a gap in a wire fence.
    choices:
      - text: "Hum it back to her, and stay a while."
        to: 145

  144:
    title: His Face
    effects:
      - note: SUNDIAL
    text: |
      He's in half of them, small, a rumpled man in his forties. In one he sits at a rooftop bar under an enormous sundial, at night, with the shadow falling anyway. In another he stands at an observatory telescope, looking through the wrong end.

      "Leonard something," says Agnes. "He's very happy. That's the trouble with him. I keep putting him where he wants to be."

      She taps the observatory. "That's Griffith. The other place I don't know. It isn't built yet."
    choices:
      - text: "Thank her, and stay a while."
        to: 145

  145:
    title: Dusk in Silver Lake
    text: |
      Time goes the way it does in that house, slowly and all at once. When Agnes walks you to the gate, the lights are on along Sunset.

      "Go where he is," she says. "Don't dawdle, and don't be clever. Clever never got anybody anywhere in this town."

      Down the hill, the marquee of the Starlite Drive-In is lighting up. Up the other way, the dome of Griffith Observatory glows on its hill.
    choices:
      - text: "Find the bar under the sundial."
        requires: {any: [{item: matchbook}, {note: SUNDIAL}]}
        to: 193
      - text: "Drive west on Sunset with the tab in your pocket, and see where it wants you."
        requires: [{item: tab}, {no_item: matchbook}, {no_note: SUNDIAL}]
        to: 193
      - text: "Drive up to Griffith Observatory."
        to: 200
      - text: "Go and see what's on at the drive-in."
        to: 151
    extra:
      - text: Your car is waiting at her kerb, however it got there.

  # ---- Bel Air ----------------------------------------------------------------------------------------------------

  146:
    title: Sol's Pool
    text: |
      Sol Vance's house is white, Spanish and very large, at the top of a road where the gardeners outnumber the residents. The party has been going since Tuesday.

      Out back, the swimming pool is empty, and forty people are lying in it on air mattresses, in their best clothes, listening to a reel-to-reel on the diving board. You know the tune. They have their eyes shut and their hands open.

      Sol, in a silk shirt, is lying in a deck chair with a telephone in his lap, eyes shut.
    extra:
      - text: Nobody asks who you are.
    choices:
      - text: "Climb down into the pool, and lie down with them."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 147
      - text: "Wake Sol up."
        to: 148
      - text: "Find a phone, and call the sheriff on the lot of them."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 149
      - text: "Find a phone, and call the sheriff on the lot of them."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 149
      - text: "Find a phone, and call the sheriff on the lot of them."
        requires: {note: SNAG2}
        to: 204

  147:
    title: The Pool
    effects:
      - note: EQUINOX
      - san: "-8"
    text: |
      The concrete is warm. The tune comes over the edge of the pool like water.

      You see a white dish on white salt, turning its face west. You see a clock on a cinderblock wall at four fifty-six. You see a rumpled man look up and say, quite clearly, "Friday. Four fifty-six."

      When you open your eyes, the sun is low and the pool is full of long shadows.
    choices:
      - text: "Climb out."
        to: 150

  148:
    title: Sol Vance
    effects:
      - note: SOL
    text: |
      Sol wakes all at once, like a producer. "The tape," he says, before you've asked. "Sure. The hippie sold me a copy. Best thing I ever bought. I've made nine pictures, and none of them did that to anybody."

      He looks at the pool. "I want to make a picture about it. I can't, because I don't know the ending. You find out how it ends, you come and tell me. Promise."

      He makes you stay for lunch, and then for the afternoon, and tells you about Lana Turner.
    choices:
      - text: "Promise, and take the spare reel from his study."
        requires: {no_item: tape}
        effects: [{gain: tape}]
        to: 150
      - text: "Promise. You have a copy of your own."
        requires: {item: tape}
        to: 150

  149:
    title: Over the Wall
    effects:
      - hp: -1D3
      - note: DOE
    text: |
      The sheriff's deputies come up the drive in four cars at once. They don't arrest the people in the pool. They arrest you, because you're the one standing up.

      You go over the garden wall and leave some of your hand on it. They catch you in the bougainvillea.

      The West Hollywood lock-up is cool and green. The drunk in the next cell is a lifeguard from Zuma. "Pulled a guy out Sunday," he says. "Singing, man. Looked like a kid. They sent him to Camarillo."
    extra:
      - requires: {note: SNAG2}
        text: The bars of the cell are just bars. Nothing in this city wants to talk to you now.
      - text: Nobody comes to see about your phone call.
    choices:
      - text: "Lie down on the bunk, and wait."
        to: 172

  150:
    title: Bel Air at Dusk
    text: |
      By the time you climb out of the pool garden, the sky over the ocean is pink and the hills are going blue.

      Sol finds you at the door. He presses a card into your hand with an address in Silver Lake. "Painter," he says. "Old Metro gal. She paints the same city the tape makes. If you're going looking, look there."

      Down in the pool, nobody has moved. The reel is starting again.
    extra:
      - text: Your car is in Sol's drive, between a Rolls and a hearse. You don't ask.
    choices:
      - text: "Drive to Silver Lake."
        to: 141
      - text: "Find the bar under the sundial."
        requires: {any: [{item: matchbook}, {note: SUNDIAL}]}
        to: 193
      - text: "Drive east on Sunset with the tab in your pocket, and see where it wants you."
        requires: [{item: tab}, {no_item: matchbook}, {no_note: SUNDIAL}]
        to: 193
      - text: "Drive up to Griffith Observatory."
        to: 200
      - text: "Stay, and lie in the pool until midnight."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 207

  # ---- The drive-in -----------------------------------------------------------------------------------------------

  151:
    title: The Starlite
    text: |
      The Starlite is half full of cars with their windows down. You hook the speaker over your door. The screen is a hundred feet wide.

      The feature starts with no title. It's a baby, in a hospital, in the year you were born. Then a boy on a bike. Then you, at twenty, in a car you'd forgotten.

      The audience is very quiet. In the next car, a couple are holding hands and crying.
    choices:
      - text: "Watch it to the end."
        to: 152
      - text: "Walk out at the intermission."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 153
      - text: "Walk out at the intermission."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 153
      - text: "Walk out at the intermission."
        requires: {note: SNAG2}
        to: 204

  152:
    title: The Last Reel
    effects:
      - note: EAST
      - note: EQUINOX
      - note: LULLABY
      - note: FORESEEN
      - san: "1/1D6"
    text: |
      Halfway through, it stops being your life and becomes a man's you've never lived. A Navy radar shack in 1944. Caltech. A white dish rising out of a salt flat. A night in June, a man in headphones, weeping. A woman with grey hair saying "LULLABY" into a telephone.

      Then it's you again, standing at the dish, on a Friday. The clock on the wall says four fifty-six. You lift your hand to do something.

      The reel runs out. The screen goes white. Car horns, all across the lot.
    choices:
      - text: "Start the car."
        to: 154

  153:
    title: The Lot
    effects:
      - hp: -1D2
    text: |
      You get out at the intermission. The speaker cord catches your ankle, and you go down hard on the gravel between two Chevrolets.

      Behind you, the whole lot laughs at once, at something on the screen. You don't turn round to see what.
    extra:
      - requires: {note: SNAG2}
        text: Nobody helps you up. The city has started to look past you.
      - text: Your knee is bleeding through your trousers.
    choices:
      - text: "Limp back to the car."
        to: 154

  154:
    title: Back up the Hill
    text: |
      You pull out onto the road at half past nine. The drive-in's light is still on your face.

      Up the hill, the observatory dome is lit like a lamp. Everywhere else the city is going about its Thursday night, a little too quietly. On Sunset, people are standing on the sidewalks, facing east, not waiting for anything.
    choices:
      - text: "Drive up to Griffith Observatory."
        to: 200
      - text: "Drive until midnight, and see where it goes."
        to: 205

  # ---- Helion's side ----------------------------------------------------------------------------------------------

  155:
    title: The Listening Room by Day
    text: |
      Calloway takes you to the fourth floor, to a long room with the blinds down.

      Thirteen recliners in two rows, and twelve men and women in them, in hospital gowns, with headphones on and their eyes rolled up white. They're smiling. Nurses move between them with clipboards.

      A woman in her late fifties gets up from a desk at the end. Grey suit, reading glasses, a warm handshake. "Edith Marrow, if we haven't met," she says. "I run this. They hear it, you see. They can find people in it. Help us talk to Leonard."
    choices:
      - text: "Sit down in the empty recliner, and put on the headset."
        effects: [{lose: revolver}, {lose: lockpicks}]
        to: 159
      - text: "Tell her no, and turn for the door."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}, {note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}]
        to: 168
      - text: "Tell her no, and turn for the door."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}, {note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}]
        to: 168
      - text: "Tell her no, and turn for the door."
        requires: {note: SNAG2}
        to: 204

  156:
    title: The Grey Car
    effects:
      - note: TAILED
    text: |
      Wherever you meant to go, you don't get there. You find your car, or a car, and get onto Wilshire.

      A grey Plymouth falls in behind you at the first light. It stays one car back through Beverly Hills. When it pulls alongside at a red, you see the two men in the front. They wear grey suits and sunglasses, and under the sunglasses there isn't quite enough face, as if someone had described a face to them once.
    extra:
      - requires: {note: SNAG2}
        text: Every light you reach turns red. The city has started to look past you.
      - text: The light changes.
    choices:
      - text: "Floor it, and lose them in the traffic."
        roll: {skill: Drive Auto, success: 174, failure: 157}
      - text: "Ram them. See how they like it."
        to: 368
      - text: "Pull over, and let them come."
        to: 157

  368:
    title: Wreck
    effects: [{hp: "-6"}]
    text: |
      You put your car into the Plymouth's flank at forty. It doesn't move. It doesn't even dent. Your windshield comes in over you like a wave.

      When you can see again, two men with not quite enough face are lifting you out through the window, very gently, as if you were something they'd ordered.
    choices:
      - text: "Let them carry you."
        to: 157

  157:
    title: Helion's Basement
    effects:
      - note: CAPTIVE
      - lose: revolver
      - lose: lockpicks
    text: |
      They are very polite about it. They put you in the back of the Plymouth, and one of them holds your head so you don't bump it.

      Helion's basement is white tile and a drain in the floor. They take your belt, your shoelaces and anything in your pockets that shoots or picks a lock. Calloway lets you keep any reel of tape you have. "We have the original," he says. You sit on a steel chair for an hour, and nobody comes.

      Then the door opens, and a woman in a grey suit comes in with two cups of coffee.
    choices:
      - text: "Take the coffee."
        to: 158

  158:
    title: Dr. Marrow
    effects:
      - note: LULLABY
      - note: EQUINOX
    text: |
      "Edith Marrow, if we haven't met," she says. Fifty-eight, tired, with the kind of charm that has run committees. "I'm sorry about the drain. It came with the building."

      She tells you about LULLABY as if it were a polio vaccine. A dream over the city, a million minds. At the hinge, 4:56 on Friday afternoon, it wakes, and it becomes the first thing it hears. "Campuses on fire, detective. Cities burning. I'd like it to hear something kind."

      "Leonard walked into it. Into it. We can hear him in there, but he won't talk to us. He might talk to you."
    choices:
      - text: "Let her put the headset on you."
        to: 159
      - text: "Refuse, and finish your coffee."
        to: 168

  159:
    title: The Grey Cafeteria
    effects:
      - note: GREY
      - san: "-10"
    text: |
      The headphones are warm from somebody else. A nurse takes your jacket and goes through it, quickly, for anything that shoots or picks a lock, then touches a needle to your arm, and the room drains.

      You are in a company cafeteria, the size of an aircraft hangar. Grey tables, grey trays, grey light, and no sound at all. Not a fork. Nothing here has a tune in it. The listeners have made this, you understand, and they cannot carry one. Everything they make is grey.

      At a corner table sits a rumpled man in his forties, grey to the bone, stirring grey coffee. Leonard Voss looks up, sees you, and then looks past your shoulder at something you can't see.
    choices:
      - text: "Sit down, and ask him what he set out to do."
        to: 160
      - text: "Write on a napkin that she's listening."
        to: 161

  160:
    title: In Code
    effects:
      - note: LASTBAR
      - note: DOE
    text: |
      He talks about baseball. The '59 Dodgers. "We built a big glove to catch the stars," he says, "and caught the whole home crowd instead, singing." Then a nursery rhyme. "Ring a ring of roses, and on the fourth day we all fall down. Four. Five. Six."

      He hums four notes, very quietly, and says, "That's the bit the band forgot."

      Then, looking straight at you: "My old car was found at the beach. I got out further up. Ask a lifeguard. Ask where they send the singers. Camarillo."
    choices:
      - text: "Take the headset off."
        to: 162

  161:
    title: Warned
    effects:
      - note: DECOY
    text: |
      You write SHE'S LISTENING on a grey napkin with a grey pencil. Voss reads it, and smiles, the first colour in the room.

      Then he turns to the empty air, where you can almost feel Marrow standing, and recites numbers. Gain settings. Frequencies. A phase angle. He does it slowly, so she can write them down.

      He winks at you. None of the numbers are right.
    choices:
      - text: "Take the headset off."
        to: 162

  162:
    title: "Off the Air"
    text: |
      You come up out of it like a diver, with your ears ringing. The listening room is bright and loud. The listener in the next chair is crying through his smile.

      Marrow is standing over you with a notepad and a pencil. "Well?" she says. "What did he say?"
    choices:
      - text: "Tell her everything he said."
        requires: {no_note: DECOY}
        to: 163
      - text: "Hand her his numbers, with a straight face."
        requires: {note: DECOY}
        to: 362
      - text: "Lie to her: he talked about baseball, and nothing else."
        requires: {no_note: DECOY}
        to: 165
      - text: "Say nothing at all."
        effects: [{note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}]
        to: 168

  163:
    title: Notes
    text: |
      She writes it all down in a neat, fast hand, nodding as if you were reading her a grocery list. When you get to the part about his body, up the coast, her pencil stops.

      "Thank you," she says. "Mr. Calloway will drive you anywhere you like. You're on the payroll from today. Helion looks after its people."

      She holds out her hand.
    choices:
      - text: "Shake it."
        to: 164
      - text: "Snatch the notepad, and tear out the page."
        effects: [{note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}]
        to: 168

  362:
    title: The Numbers
    effects:
      - note: TAILED
      - unnote: CAPTIVE
    text: |
      She checks his figures against her pad, twice, and her face goes soft with relief. "He gave them to me," she says. "After all this time. Thank you, detective."

      They give you back your jacket, and what was in it, except anything that shoots or picks a lock. It's dark outside. You've lost the whole day in that chair.

      Across the lot, a grey Plymouth starts its engine.
    choices:
      - text: "Walk out into the night, and try not to smile."
        to: 166

  164:
    title: On the Payroll
    ending: lost
    text: |
      You tell her everything, what he said and what he meant by it, and she writes it down in shorthand. "Thank you," she says, and means it.

      Helion finds Leonard Voss's body in Camarillo by two o'clock, and has him in a helicopter by three. On Friday at 4:56, California hears something kind, in Edith Marrow's voice. It is very calm. It buys what it's told.

      Helion puts you on a retainer for life. You never have to work again. Nothing coincidental happens to you, ever again, and you find you don't mind.
    extra:
      - text: You helped them find him. It was the one thing in three days the city never asked of you.

  165:
    title: Released
    effects:
      - note: TAILED
      - unnote: CAPTIVE
    text: |
      Marrow studies you over her reading glasses for a long moment. Then she smiles.

      "Baseball," she says. "Of course. Thank you, detective. You may go."

      They give you back your jacket, and what was in it, except anything that shoots or picks a lock. The guard walks you to the door. It's dark outside. You've lost the whole day in that chair.

      Across the lot, a grey Plymouth starts its engine.
    choices:
      - text: "Walk out into the night."
        to: 166

  166:
    title: Followed
    text: |
      The Plymouth idles along behind you down Imperial Highway at walking pace, with its lights off. Nobody in it bothers to hide.

      Across the road is the airport, lit up like a liner: taxis, porters, a thousand people who all look like somebody else.
    choices:
      - text: "Lose them in the crowds at the airport."
        roll: {skill: [Stealth, Fast Talk, DEX], success: 167, failure: 173}
      - text: "Let them follow. They'll get bored."
        to: 173

  167:
    title: Lost
    effects:
      - unnote: TAILED
    text: |
      Through the terminal, down an escalator, into a crowd off a flight from Honolulu, out through a door marked CREW. When you look back, the Plymouth is circling the loop, its driver craning his neck.

      Nobody is behind you now.
    choices:
      - text: "Walk back along the fence, towards the lights."
        to: 173

  168:
    title: The Cell
    text: |
      They put you in a room in the sub-basement with a cot and a bucket and a light that never goes off. The day goes by under the door.

      Around nine at night, a janitor comes along the corridor with a mop, humming. You know the tune. He stops outside your door, and the light goes off, and the whole building goes dark.

      In the dark, the door clicks, and swings an inch open.
    extra:
      - requires: {note: SNAG2}
        text: For a moment you aren't sure the door will open for you. The city has started to look past you.
      - text: The humming moves off down the corridor.
    choices:
      - text: "Follow the humming."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 170
      - text: "Shut the door, and wait for a lawyer like a citizen."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 169
      - text: "Shut the door, and wait for a lawyer like a citizen."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 169
      - text: "Shut the door, and wait for a lawyer like a citizen."
        requires: {note: SNAG2}
        to: 204

  169:
    title: No Lawyer
    effects:
      - hp: -1D3
    text: |
      The lights come back. A lawyer does not.

      A grey-suited man with a kind voice does: Hollis Calloway, Helion security, with two men who don't say anything. He asks the same three questions for an hour, sorrowfully, and one of the men helps you remember the answers with the back of his hand.

      At eleven they leave. They don't lock the door. You don't think it's an accident. You think somebody wants to see where you go.
    extra:
      - requires: {note: SNAG2}
        text: Your luck has run thin as paper. The city has started to look past you.
      - text: Your face aches. The corridor is empty.
    choices:
      - text: "Go, while you can."
        to: 170

  170:
    title: The Boiler Room
    effects:
      - gain: notebook
      - unnote: CAPTIVE
    text: |
      The corridor leads to a boiler room, and the boiler room to a staircase, and the staircase, against all sense, to the fourth floor and Marrow's office.

      Her desk lamp is on. On the blotter lies a green engineer's notebook with L. VOSS on the cover, full of figures and drawings of a dish. THE HINGE is underlined twice.

      You put it inside your shirt. The fire door at the end of the corridor is propped open with a mop. Next to it, a door stands ajar on a long dim room full of reclining chairs.
    choices:
      - text: "Go out through the fire door."
        to: 173
      - text: "Look into the room with the chairs."
        to: 171

  171:
    title: The Listening Room
    effects:
      - note: LISTENERS
      - san: "1/1D6"
    text: |
      A dozen people lie back in the chairs in the dark, in headphones, smiling. One of them is talking in his sleep. "Quiet," he says. "She promised. When it's over it'll all be quiet."

      Down the row, a chair is empty except for a grey suit, laid out flat, as if whoever wore it just went away.
    choices:
      - text: "Get out through the fire door, fast."
        to: 173

  172:
    title: The Lock-up
    text: |
      At midnight a deputy unlocks your cell without a word, as if he'd been told to and couldn't remember by whom.

      You walk out onto Santa Monica Boulevard. Something is happening to the streetlights.
    choices:
      - text: "Walk out into it."
        to: 205

  173:
    title: Loose in El Segundo
    text: |
      Near midnight. The jets go over low, one every two minutes, with their bellies lit.

      You're out on Imperial Highway, outside Helion's fence, with your shirt stuck to your back. The main building is dark. Down at the end of the runway, the big Helion hangar has every light on, and helicopters are warming up on the apron with a sound like a held breath.
    extra:
      - requires: {note: TAILED}
        text: The grey Plymouth has pulled in at the hangar gate. Its men have gone inside for coffee.
      - text: Nobody is looking your way.
    choices:
      - text: "Go and see what they're loading."
        to: 257

  # ---- The tar pits -----------------------------------------------------------------------------------------------

  174:
    title: La Brea
    text: |
      Hancock Park, on Wilshire. The tar lake steams in the morning sun. On its far edge, a fibreglass mammoth is sinking forever, and her fibreglass calf watches from the bank.

      This is the oldest ground in the city. Things have been going down into it for forty thousand years. The tar burps, slowly, and the bubble that rises has a shape in it, like a face trying to remember itself.

      Out on Wilshire, a pink ice-cream truck is parked at the kerb with SUNDAY'S on the side. It's playing the tune.
    choices:
      - text: "Go and buy an ice cream."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 178
      - text: "Kneel at the rail, and look into the tar."
        to: 175

  175:
    title: The Shadow
    effects:
      - note: GREY
      - san: "-10"
    text: |
      The tar is a black mirror, and the mirror goes down a long way.

      You see the dream from underneath. Gold, mostly, and music. But in its shadow there are grey shapes walking, men and women with not quite enough face. They're the ones who went in on Helion's money and couldn't find the way back.

      They can't make anything with colour in it. They can't carry a tune. Whatever they touch comes out grey and silent, like a photograph of a sound.

      Several of them look up at you.
    choices:
      - text: "Get back from the rail."
        to: 176

  176:
    title: Hollow Men
    text: |
      Grey hands come up over the rail, out of the tar, and none of them are wet.

      They climb out. Three of them, in grey hospital gowns, and they want you. Not to hurt you, exactly. To hold you still, so you'll be quiet with them.
    choices:
      - text: "Stand your ground, and fight them."
        to: 369
      - text: "Throw yourself back from the rail, and run."
        roll: {skill: Dodge, success: 178, failure: 177}

  369:
    title: More of Them
    effects: [{hp: "-8"}, {note: LISTENERS}]
    text: |
      You hit the first one, and your fist goes into it like a hand into cold dough. Then there are six of them, then a dozen, coming up out of the tar with no hurry at all.

      They don't punch. They hold. Every place they hold goes grey and numb. One of them puts its smooth face close to yours. "Quiet," it whispers. "She promised us quiet." You are on your knees on the path by the rail when an ice-cream truck's horn plays four notes on Wilshire, and they let go all at once and slide back under.
    choices:
      - text: "Crawl towards the music."
        to: 178

  177:
    title: Grey Hands
    effects:
      - hp: "-1D6"
    text: |
      One of them gets your arm. Its grip is cold, and the cold goes into the bone, and for a second the park is grey and silent and very restful.

      Then a car horn plays the tune out on Wilshire, and the hand lets go. You stagger back. Your arm is bruised in the shape of five grey fingers.
    choices:
      - text: "Run for the music."
        to: 178

  178:
    title: Sunday's
    text: |
      The Ice-Cream Man leans out of his window. White cap, white jacket, a face like a nice uncle's. He smells of vanilla. He hands you a Popsicle you didn't order.

      "Get in," he says. It's two words more than you expected.

      The truck takes you east along Sunset, playing the tune the whole way, and children come out of nowhere and wave. He drops you at the foot of a hill in Silver Lake, outside a green bungalow, and drives off still playing.
    choices:
      - text: "Climb the steps to the bungalow."
        to: 141

  # ---- Camarillo --------------------------------------------------------------------------------------------------

  179:
    title: The 101 North
    text: |
      The Ventura Freeway runs out past the last of the tract houses, and then it's lettuce, fifty miles of it, and strawberry fields with the pickers bent over in rows. The hills turn green. The air smells of cut celery.

      Camarillo State Hospital sits under the hills like a Spanish mission: white walls, red tiles and a bell tower. Three thousand patients. It has its own farm.
    extra:
      - requires: {note: TAILED}
        text: The whole way, a grey Plymouth sits a quarter mile back in your mirror. It doesn't turn off at Camarillo. It doesn't need to.
      - text: You park under a pepper tree and go in to find the John Doe from Zuma.
    choices:
      - text: "Go in."
        to: 180

  180:
    title: Ward 9
    text: |
      The front desk is a nurse with a cardigan and a face that has said no to a great many people. "The Zuma Doe," she says. "Ward 9. Visiting is two to six, and relatives only. Are you a relative?"

      Behind her, down a long tiled corridor, somebody is singing. A man's voice, light and happy, the tune you've been hearing for two days.
    choices:
      - text: "Show her your badge."
        requires: {item: badge}
        to: 183
      - text: "Show her your press card, and promise her a story that names the hospital kindly."
        requires: {item: press-pass}
        to: 183
      - text: "Tell her Golden Shield Mutual is paying for his care, and act like it."
        requires: [{item: claim-file}, {skill: Credit Rating, min: 40}]
        roll: {skill: Credit Rating, success: 183, failure: 181}
      - text: "Wait in the lot for visiting hours."
        to: 181
      - text: "Talk your way in."
        roll: {skill: [Fast Talk, Persuade, Law], success: 183, failure: 181}

  181:
    title: Visiting Hours
    text: |
      Relatives only, it turns out, at any hour.

      You sit in the lot under the pepper tree while the shadows go round. At half past four a younger nurse comes out on her break, lights a cigarette, and looks at you for a while. "I wrote to a newspaper about him," she says.
    extra:
      - requires: {investigator: lena}
        text: '"You''re the Mirage," she says. "You came."'
      - requires: {investigator: [ray, dee, morton]}
        text: Nobody wrote back, she says. You're the first person who's come.
      - text: She stubs the cigarette out on the pepper tree. "Come on." On the way past the records office, you notice the clerk's chair is empty, and the admissions register is open on the counter.
    choices:
      - text: "Follow the nurse straight to Ward 9."
        to: 183
      - text: "Read the register while nobody's looking."
        roll: {skill: Library Use, success: 182, failure: 183}

  182:
    title: The Register
    effects:
      - gain: notebook
    text: |
      *Sunday 15 March. Brought by L.A. County Sheriff from Zuma Beach, 7:10 am. Male, approx. 25-30. No ID. Wet suit trousers and an old Navy shirt. Sings. Responds to "Leonard". Wakes at 4:56 pm daily, for one hour.*

      Clipped to the page is a property envelope. Inside, swollen with seawater and dried stiff, is a green engineer's notebook with L. VOSS on the cover.

      The clerk is coming back. You put the notebook in your coat.
    choices:
      - text: "Catch up with the nurse."
        to: 183

  183:
    title: Four Fifty-Six
    effects:
      - san: "1/1D6"
    text: |
      Ward 9 is a long room of iron beds, with sunlight lying across them in bars. The Doe has the bed by the window.

      He looks twenty-five. He has Leonard Voss's face, the face in Marian's photograph, with twenty years taken off it. His hair is thick and dark. He is lying on his back with his eyes open, singing under his breath, and he doesn't see you.

      You sit by the bed while the light moves across the floor. The clock on the wall says four fifty-five.
    choices:
      - text: "Wait for the minute hand."
        to: 185
      - text: "Lean close, and listen to what he's singing."
        roll: {skill: Listen, success: 184, failure: 185}

  184:
    title: The Bit the Band Forgot
    effects:
      - note: LASTBAR
    text: |
      It's the tune, the one from the radio and the truck, with no words. You've heard it fifty times since Wednesday.

      But he doesn't stop where it always stops. He goes on for one more bar. Four notes, falling and then rising, like somebody setting down a heavy thing and straightening up. Then he goes back to the beginning.

      You have the four notes. You couldn't lose them now if you tried.
    choices:
      - text: "Look at the clock."
        to: 185

  185:
    title: Leonard
    effects:
      - note: EQUINOX
      - note: LULLABY
      - note: EAST
      - note: KNOWS
    text: |
      At 4:56 he sits up, and sees you, and says, "Oh, good. You're here."

      He talks fast, because he has an hour. He built an ear for the stars, a dish at Sweetwater Dry Lake, east of Amboy. On 21 June last year it heard Los Angeles instead: a million people's best nights, pooled into one dream that runs the city's luck. Edith Marrow, his boss at Helion, means to speak into it through the dish at 4:56 tomorrow, the hinge, when it wakes and becomes the first thing it hears. LULLABY.

      "And you," he says. "It's been steering you since before you were born. It needed a detective at the dish."
    extra:
      - requires: {investigator: ray}
        text: |
          "The wrong bus in '58, Mr. Lindqvist? The hold-up, the licence? You think that was you?"
      - requires: {investigator: dee}
        text: |
          "That bullet in '62, Sergeant. The badge a size too big because the supply room ran out. Who do you suppose ran it out?"
      - requires: {investigator: morton}
        text: |
          "The flat tyre in '44, Mr. Gale, on the road to San Pedro. The transport you missed. It never arrived anywhere."
      - requires: {investigator: lena}
        text: |
          "The postcard with no name, Miss Kowalski. Every wrong number since. You never asked who was dialling."
      - text: You find you can't say anything at all.
    choices:
      - text: "Ask him what he needs from you."
        to: 186
      - text: "Ask him about Marian."
        to: 187

  186:
    title: '"Be There"'
    text: |
      "Be at the dish," he says. "Before 4:56. Bring the song, if you can. It's never heard itself whole. Whatever it hears first, it becomes, and I'd rather it was itself than Edith."

      He feels in the pocket of his hospital robe and brings out a handful of pages, torn loose and covered in figures. "The feed. Where the cables come in. If it comes to breaking, break it there."

      He presses them into your hand. His fingers are warm and young.
    extra:
      - requires: {no_item: notebook}
        text: Under them is his green notebook. He gives you that too.
      - text: '"Don''t lose them," he says.'
    choices:
      - text: "Put the notebook away."
        requires: {no_item: notebook}
        effects: [{gain: notebook}]
        to: 188
      - text: "Put the loose pages with the notebook you already have."
        requires: {item: notebook}
        to: 188

  187:
    title: A Message
    effects:
      - note: MESSAGE
    text: |
      His face changes. Under the young skin, for a second, he's forty-six.

      "Tell her I'm not gone. Tell her I'm not even far. Tell her I'm happier than I've ever been, and that I'm sorry that isn't with her." He thinks. "Tell her the cat knew. Pythagoras always knew."

      He makes you say it back to him, twice, the way a man checks a figure.
    choices:
      - text: "Say it back to him."
        to: 188

  188:
    title: Five Fifty-Six
    text: |
      The hour goes in a minute. At five to six his eyes start to drift, and the song comes back up into his throat.

      "I'll be under again soon," he says. "My body's no use to me. It's no use to Edith either, as long as she doesn't know where it is." He lies back. "Don't let them make a fuss."

      At 5:56 he's gone again, singing, smiling at the ceiling.
    choices:
      - text: "Phone Marian, and wait while she drives up to sign him out."
        to: 191
      - text: "Leave him here, where he's safe and nobody knows him."
        requires: {no_note: TAILED}
        to: 192
      - text: "Leave him here, where he's safe and nobody knows him."
        requires: {note: TAILED}
        effects: [{note: TAKEN}]
        to: 192
      - text: "Tell the doctor on duty he's dangerous, and should be kept locked up."
        to: 189

  189:
    title: The Form
    text: |
      The doctor on duty is younger than you, and very tired. He listens, and nods, and takes a form out of a drawer. A commitment order, indefinite, for a John Doe.

      "You'd need to sign as the informant," he says, and holds out his pen. Behind you, very faintly, the Doe is singing.
    choices:
      - text: "Sign it."
        to: 190
      - text: "Tell him you were wrong, and leave the man where he is."
        requires: {no_note: TAILED}
        to: 192
      - text: "Tell him you were wrong, and leave the man where he is."
        requires: {note: TAILED}
        effects: [{note: TAKEN}]
        to: 192

  190:
    title: A Bed in Camarillo
    ending: scolded
    text: |
      The doctor is grateful. Dangerous is a word that gets things done. Leonard Voss is moved to a locked ward that night, under a name that isn't his, and the paperwork takes care of the rest.

      You drive home. You tell Marian he's gone, really gone, and that she should try to move on. She thanks you, and means it.

      At 4:56 on Friday, a young man in a locked ward sits up, and nobody is there.
    extra:
      - text: Camarillo has a bed for him. You have your Friday back. You could have had both of them home.

  191:
    title: Altadena, Nine O'Clock
    effects:
      - note: HOME
      - note: MARIAN
    text: |
      Marian comes in an hour and twenty minutes, in her slippers, and signs where they tell her. She doesn't cry until she sees his face. Then she laughs. "He looks like the boy I married," she says. "He looks like 1953."

      You help her get him into her car and follow her back to Altadena. He sings the whole way. She puts him to bed in his own bed, and the cat climbs onto his chest and settles there like a sentry.

      You tell her everything over cold coffee in the kitchen. She believes all of it.
    extra:
      - requires: {note: MESSAGE}
        text: You give her his message, word for word. At "the cat knew", she laughs.
      - requires: {note: TAILED}
        text: When you leave, a grey Plymouth is parked across the street with its lights off. It doesn't follow you. It stays.
      - text: Near midnight you get back into your car and drive towards the city.
    choices:
      - text: "Drive."
        to: 238

  192:
    title: The Lot
    text: |
      You walk out into the evening. The bell tower is black against a green sky, and the sprinklers are coming on in the lettuce.
    extra:
      - requires: {note: TAKEN}
        text: |
          Two men in grey suits pass you on the steps, going in. They nod to you like colleagues. When you look back from the car, they're wheeling a gurney out of a side door, and a young man on it is singing. You followed them here, or they followed you. It comes to the same thing.
      - requires: {no_note: TAKEN}
        text: Nobody follows you out. In the window of Ward 9, a young man is singing to the ceiling, and nobody in the world knows who he is but you.
      - text: You eat at a diner in Thousand Oaks and sit over coffee until the waitress turns the chairs up. It's nearly midnight when you get back on the 101, heading south.
    choices:
      - text: "Drive."
        to: 238

  # ---- The Sundial Room ------------------------------------------------------------------------------------------

  193:
    title: The Sundial Room
    text: |
      You drive the Strip slowly, until something tells you to stop. It's a parking lot, a chain across it, a sign that says FUTURE HOME OF and nothing else.

      You wait. At ten o'clock exactly, there's a building on the lot. Twelve storeys of white stucco and green glass, with a staircase up the outside and a glow at the top.
    extra:
      - requires: {item: matchbook}
        text: The address on the matchbook is this lot, to the number.
      - text: Nobody on the sidewalk looks up at it. It isn't there for them yet.
    choices:
      - text: "Climb the stairs that weren't there an hour ago."
        requires: {any: [{item: matchbook}, {note: SUNDIAL}]}
        to: 194
      - text: "Put the tab on your tongue, and climb."
        requires: {item: tab}
        effects: [{lose: tab}, {note: DREAMT}, {san: "-15"}]
        to: 194

  194:
    title: Under the Sundial
    effects:
      - san: "1/1D6"
    text: |
      The roof is a cocktail bar in 1971's idea of the future: white leather, chrome, palms in brass pots. Over all of it stands an enormous bronze sundial. It's ten at night, and its shadow falls sharp across the dance floor anyway, pointing east.

      Everyone here is somebody's best night. A girl in a prom dress. A sailor in 1945. An old man dancing with nobody, beautifully.

      By the rail, looking at the view, in a rumpled brown suit, sits Leonard Voss. He looks radiant. He sees you, and pats the chair beside him.
    choices:
      - text: "Sit down, and ask him what he set out to do."
        to: 195
      - text: "Ask him why he left Marian."
        to: 196

  195:
    title: Listening
    text: |
      He tells it like a love story, because it is one.

      A radar boy in the Pacific, listening to the dark for Japanese planes, and hearing the stars hiss instead. Caltech. Helion. A dish at Sweetwater Dry Lake, east of Amboy, ninety feet across, built to catch a whisper from Andromeda.

      "Full gain, the twenty-first of June," he says. "Midnight. I put the headphones on, and it wasn't Andromeda. It was us. It was Los Angeles, singing in its sleep."
    choices:
      - text: "Ask him what it was singing."
        to: 197

  196:
    title: Why He Left
    effects:
      - note: MESSAGE
    text: |
      He turns his glass round on the rail.

      "I didn't leave her," he says. "I went where I could hear it properly. There's a difference, but I don't expect her to see it." He looks at the dancers. "Tell her I'm happy. Tell her I'm sorry that isn't with her. Tell her the cat knew. Pythagoras always knew."

      Then, because he's an engineer, he tells you the rest.
    choices:
      - text: "Listen."
        to: 197

  197:
    title: What It Wants
    effects:
      - note: EQUINOX
      - note: LULLABY
      - note: EAST
      - note: KNOWS
    text: |
      "A million people's best nights," he says. "They pooled. It's a dream now, all one dream, and it runs the luck in this town." He nods at the room. "This is a bit of it."

      Edith Marrow, his boss at Helion, wants to speak into it through his dish. LULLABY. At 4:56 tomorrow, the hinge, the equinox, it wakes, and it becomes the first thing it hears.

      "And it brought you here," he says gently. "It's been steering you since before you were born. It needed a detective at the dish. Come to the salt. Bring the song. It has never heard itself whole."
    choices:
      - text: "Promise him you'll be there."
        requires: {item: tape}
        to: 199
      - text: "Promise him, and take the reel he slides across the table."
        requires: {no_item: tape}
        effects: [{gain: tape}]
        to: 199
      - text: "Take him by the arm, and tell him you're taking him home."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 198
      - text: "Take him by the arm, and tell him you're taking him home."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 198
      - text: "Take him by the arm, and tell him you're taking him home."
        requires: {note: SNAG2}
        to: 204

  198:
    title: Nothing to Hold
    effects:
      - san: "1/1D6"
    text: |
      Your hand goes into his sleeve, and through it, and through him, as if he were warm water.

      The music stops. Every best night in the room turns to look at you, and none of them is pleased. The sundial's shadow swings round on the floor like the hand of a clock, and points at the stairs.

      Grey men are coming up the stairs. Not quite enough face.
    extra:
      - requires: {note: SNAG2}
        text: The room is cooling around you. The city has started to look past you.
      - text: |
          "It's all right," Voss says, not unkindly. "You didn't know."
    choices:
      - text: "Turn, and face the stairs."
        to: 199

  199:
    title: Into the Shadow
    text: |
      Grey men come up out of the stairwell, three, then five, in grey suits and sunglasses. Where they walk, the white leather goes grey, and the music goes out like a match.

      Leonard Voss finishes his drink, gets up from his chair and walks into the sundial's shadow. He doesn't come out the other side.

      The dancers go on dancing. The grey men stand at the edge of the floor, and can't come any further. Behind the bar, a second staircase goes down, and the light coming up it is gold.
    choices:
      - text: "Take the gold stairs down."
        to: 210

  # ---- Griffith Observatory --------------------------------------------------------------------------------------

  200:
    title: The Observatory
    effects:
      - san: "1/1D6"
    text: |
      Griffith Observatory sits on its hill like a white sugar bowl. Below it, the whole city is laid out in lights to the sea.

      The lawn is empty, except for a man in a rumpled brown suit at one of the coin telescopes. He's looking through it the wrong way round, at himself.

      You can see the lights of Hollywood through him. Not all the way. Enough. He's about two-thirds here.
    choices:
      - text: "Walk up and ask him what he found."
        to: 202
      - text: "Put a dime in, and look through the telescope with him."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 201

  201:
    title: The Dish
    effects:
      - note: EAST
      - note: GAP
    text: |
      The telescope is pointed east, at nothing, at the dark beyond the San Gabriels.

      Through it, impossibly close, you see salt, white as a plate, and a dish on it, ninety feet across, turning in its sleep. A hut at its foot. A fence. And at the back of the fence, where the wire meets a post, a gap a person could walk through.

      The dime runs out. The shutter drops. Voss is standing beside you, smiling.
    choices:
      - text: "Ask him what he found."
        to: 202

  202:
    title: Half Here
    effects:
      - note: EQUINOX
      - note: LULLABY
    text: |
      He talks the way a man talks on a bad telephone line.

      "Built an ear for the stars. Sweetwater, past Amboy. It heard us instead. Everybody's best nights, all in one dream. It runs the luck." He fades a little, and comes back. "Edith's going to talk into it. LULLABY. Four fifty-six tomorrow, the hinge. It wakes up, and it'll be whatever it hears first."

      "It brought you here," he says. "Long story. You're in it."

      He's going. You have time for one question.
    choices:
      - text: "Ask him what to tell Marian."
        effects: [{note: MESSAGE}]
        to: 203
      - text: "Ask him what you'll need at the dish."
        requires: {no_item: helion-badge}
        effects: [{gain: helion-badge}]
        to: 365
      - text: "Ask him what you'll need at the dish."
        requires: {item: helion-badge}
        effects: [{note: LASTBAR}]
        to: 203

  365:
    title: For the Gate
    text: |
      He presses something flat and laminated into your palm, which is a trick for a man you can see through. His Helion pass, with his photograph on it, more solid than he is.

      "For the gate," he says.
    choices:
      - text: "Close your hand on it."
        to: 203

  203:
    title: Into the Beam
    text: |
      A grey Plymouth comes up the observatory road with its lights off. Men get out onto the lawn, grey and silent, and the grass goes grey where they step.

      Voss doesn't look at them.
    extra:
      - requires: {note: MESSAGE}
        text: |
          "Tell her I'm not gone," he says. "Tell her I'm happy, and sorry it isn't with her. Tell her the cat knew."
      - requires: {note: LASTBAR}
        text: He hums four notes in your ear. "The bit the band forgot. Don't lose it."
      - text: He steps into the light from the observatory dome and is gone. You run, down the hill, through the dark trees, for a long time. When you come out, it's midnight, and the road is full of people walking in their sleep.
    choices:
      - text: "Walk with them."
        to: 208

  # ---- Three strikes ----------------------------------------------------------------------------------------------

  204:
    title: Barstow
    ending: scolded
    text: |
      You wake up in a motel in Barstow with the air conditioner rattling and the sun already hot on the curtains. It's Friday. You have no idea how you got here. Your car is in the lot, with a full tank and a parking ticket from Thursday on the windshield.

      You turn on the radio. A DJ in Los Angeles is playing a tune you almost remember. Then the station drifts, and it's a farm report.

      You drive home. Nobody calls. Nobody ever calls you by accident again.
    extra:
      - text: Three times in one day the city held out its hand, and three times you slapped it away. It took the hint.

  # ---------------------------------------------------------------------------------------------------------------
  # ACT THREE: THE GOLDEN CITY, THURSDAY MIDNIGHT TO FRIDAY 20 MARCH 1970, MORNING
  # ---------------------------------------------------------------------------------------------------------------

  205:
    title: Midnight
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      Midnight, and every streetlight in Los Angeles turns gold at once, like a held note.

      People are coming out of their houses in pyjamas and slips and work clothes, eyes shut, smiling. They drift east along the boulevards, humming the tune. The palm trees lean east with them.

      Nobody honks. Nobody needs to.
    extra:
      - text: |
          On the corner a phone box stands with its door open and its receiver hanging off the hook, turning slowly on its cord.
      - requires: {note: GREY}
        text: It's grey, and silent, and you know what makes things like that.
    choices:
      - text: "Put the tab on your tongue, and walk with them."
        requires: {item: tab}
        effects: [{lose: tab}, {note: DREAMT}, {luck: 5}, {san: "-15"}]
        to: 210
      - text: "Walk with them as you are."
        to: 208
      - text: "Pick up the hanging receiver. It's meant for you."
        to: 206
      - text: "Go to Agnes. She'll be up on her roof, painting."
        requires: {note: AGNES}
        to: 233
      - text: "Drive up to Owen's dome. Somebody should check on him."
        requires: {any: [{note: OWEN}, {note: TOPANGA}]}
        to: 267
      - text: "Find Bix. He'll be at the beach."
        requires: {note: BIX}
        to: 272
      - text: "Go to the police with what you have."
        to: 239
      - text: "Go to your own people first, on Venice's back streets."
        requires: {investigator: ray}
        to: 245
      - text: "Go home first, and get your head straight."
        requires: {investigator: dee}
        to: 247
      - text: "Go to the office. The original policy is in the vault."
        requires: {investigator: morton}
        to: 250
      - text: "Go to the Mirage. Someone should be writing this down."
        requires: {investigator: lena}
        to: 254

  206:
    title: No Dial Tone
    effects:
      - luck: -5
    text: |
      You put the receiver to your ear.

      Nothing. No dial tone, no hum, no breathing. It's a grey silence with a shape to it, the shape of someone listening very hard and hearing nothing.

      That's what gives it away. For three days nothing in this city has been silent. Every real coincidence has come with the tune in it.

      Behind you, the gold goes grey along the block, one streetlight at a time.
    choices:
      - text: "Drop the receiver and turn round."
        to: 223

  207:
    title: The Pool Fills
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      At midnight the drained pool fills.

      Not with water. With light, slow and gold as honey, rising from the drain until the people lying on the bottom are floating in it, smiling. Sol's guests stand up in it waist-deep and walk out through the side of the pool, which isn't there any more.

      Beyond the lawn, where Bel Air should be, a city of gold towers is waiting.
    choices:
      - text: "Wade in, and walk out with them."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 210

  208:
    title: With the Sleepwalkers
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      They're on every street, thousands of them, eyes shut and walking east, humming. Housewives in curlers. A Marine in his dress blues. A boy with a skateboard under his arm.

      A woman in a bathrobe takes your hand without opening her eyes. Her palm is warm. She's walking somewhere she has wanted to go all her life.

      Somewhere ahead, past the rooftops, the lotus beds on Echo Park Lake are glowing like lamps.
    choices:
      - text: "Let her lead you."
        roll: {skill: Luck, success: 210, failure: 209}
      - text: "Let go of her hand, and walk towards the glowing lake."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 220

  209:
    title: Shut Out
    effects:
      - luck: -5
    text: |
      The woman's hand goes cold in yours, then grey, then it isn't there.

      The sleepwalkers walk on through a door you can't see. Where they were, the street goes the colour of old newspaper. No tune, no gold. Just you, and the sound of shoes on the pavement behind you that don't belong to anyone.
    choices:
      - text: "Turn and face them."
        to: 223

  210:
    title: The Golden City
    effects:
      - unnote: SNAG
      - unnote: SNAG2
      - note: GOLD
      - san: "1D3/1D8"
    text: |
      It stands where downtown stood, and it's made of light. Towers like stacked sunsets. Bridges of brass. The freeways run between them like rivers, and people float down them on their backs.

      Everyone you have ever seen in Los Angeles is here, and none of them is in a hurry. Somewhere up in the tallest tower, music is playing: the tune, the whole orchestra of it.

      It is the most beautiful thing you have ever seen. That's the problem.
    extra:
      - requires: {note: DREAMT}
        text: |
          The tab's little sun is still bitter on your tongue. The city knows your face.
      - text: |
          A camera would never believe it.
    choices:
      - text: "Photograph it, before it changes its mind."
        requires: [{item: camera}, {skill: "Art/Craft (Photography)", min: 40}]
        roll: {skill: "Art/Craft (Photography)", success: 211, failure: 212}
      - text: "Climb towards the music."
        to: 225
      - text: "Look for faces you know in the crowd."
        to: 213
      - text: "Lie back on the freeway river, and let it take you."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 215

  211:
    title: Exposures
    effects:
      - note: PROOF
    text: |
      You shoot the whole roll. The towers, the river, a girl asleep on a brass bridge with her shoes in her hand. The shutter sounds like a wristwatch in church.

      Whatever the prints show, you were here, and you have it on Tri-X.

      You wind on, pocket the film, and follow the music up.
    choices:
      - text: "Climb towards the music."
        to: 225

  212:
    title: Overexposed
    text: |
      Through the viewfinder, everything is white. You shoot anyway, and know you've got a roll of nothing.

      Some things don't want their picture taken. You put the camera away and follow the music up.
    choices:
      - text: "Climb towards the music."
        to: 225

  213:
    title: Faces
    text: |
      You go along the crowd looking into sleeping faces. A waitress. A traffic cop. A man who sold you a shirt once, in 1965.
    extra:
      - requires: {no_note: HOME}
        text: |
          Then Marian Voss, in a quilted nightgown, with grass on her bare feet. She's smiling, eyes shut, walking east like the rest of them. She has walked all the way from Altadena in her sleep, to be nearer to him.
      - requires: {note: HOME}
        text: |
          Not Marian. She is home in Altadena tonight, awake, with Leonard asleep down the hall and the cat on his chest. Instead you find a man in a white paper hat who smells of vanilla. He's the only one here with his eyes open. He winks.
      - text: |
          The music upstairs swells, as if it's waiting for you.
    choices:
      - text: "Give Marian Leonard's message, while she's dreaming."
        requires: [{note: MESSAGE}, {no_note: HOME}]
        to: 214
      - text: "Walk with her a block, then climb towards the music."
        requires: {no_note: HOME}
        to: 225
      - text: "Tip your hat to the vanilla man, and climb towards the music."
        requires: {note: HOME}
        to: 225

  214:
    title: The Message
    effects:
      - note: MARIAN
    text: |
      You walk beside her and say it quietly, word for word, the way he said it.

      She doesn't open her eyes. She cries, and laughs, and keeps walking. "I know," she says. "Tell him I know. Tell him the cat's fine."

      When you look back from the stairs, she's still smiling.
    choices:
      - text: "Climb towards the music."
        to: 225

  215:
    title: The Freeway River
    effects:
      - san: "1/1D4"
    text: |
      The Hollywood Freeway is running like water, warm and gold, and you float down it on your back with a thousand strangers. Overpasses slide over you like clouds. Someone passes you a cigarette that tastes of oranges.

      The river bends north into the Cahuenga Pass. On the hill above it, the big white letters of the HOLLYWOOD sign rearrange themselves while you watch. HOLLOWOOD. Then something you can't read.
    choices:
      - text: "Climb out at the sign, and look down on the city."
        to: 216
      - text: "Let it carry you round the bend."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 217

  216:
    title: The Sign
    effects:
      - note: EAST
    text: |
      You stand in the H, fifty feet of sheet metal, and look out.

      From up here you can see the shape of it. The gold city pours east like a spill of light, across the valleys, out over the dark desert, all the way to one bright point on the horizon: a white dish on a salt flat, turned towards you like an ear.

      Then you look down. Grey figures are coming up the hill through the brush.
    choices:
      - text: "Get down off the sign."
        to: 223

  217:
    title: The Hollywood Bowl
    text: |
      The river sets you down at the Hollywood Bowl.

      Ten thousand sleepwalkers fill the seats, all the way up the hill. Under the white shell an orchestra of nobody is playing: violins bowing themselves, a harp plucked by the wind. The tune.

      On the podium, conducting, is a man in a white paper hat who smells of vanilla. He looks round, and holds out the baton to you.
    choices:
      - text: "Take the baton."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 218
      - text: "Shake your head, and sit in the back row."
        to: 219

  218:
    title: Conducting
    effects:
      - note: LASTBAR
      - san: "-8"
    text: |
      You've never conducted anything but a stakeout. It doesn't matter. The baton knows the way.

      The tune swells under your hands, and near the end it stops, a bar short, and waits. Ten thousand sleepers hold their breath. In the silence you feel the shape of the missing bar, the way your tongue feels a missing tooth.

      You give the baton back. The man in the paper hat nods, as if you've passed something.
    choices:
      - text: "Climb the hill, towards the light above the Bowl."
        to: 225

  219:
    title: The Back Row
    effects:
      - san: "+1D4"
    text: |
      You sit in the last row beside a sleeping grandmother and close your eyes.

      The music goes round and round, and for the first time in three days nothing is asking anything of you. You sleep, a little. You dream nothing at all.

      When you wake, the sky over the shell is going pale, and the seats are empty.
    choices:
      - text: "Walk down to the street."
        to: 230

  220:
    title: Echo Park
    text: |
      The lotus beds on Echo Park Lake glow like a hundred paper lanterns. The water is black and still.

      At the boathouse, one paddle boat is untied and waiting. Somebody has painted your name on its side, in gold, with the paint still wet.

      Out on the lake, on the little island, someone is crying.
    choices:
      - text: "Paddle out to the island."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 221
      - text: "Leave the boat, and walk on into the city."
        to: 210

  221:
    title: The Island
    effects:
      - san: "1/1D6"
    text: |
      On the island, under a willow, sits a man made of grey. No face, just the idea of one, like a thumbprint. He wears Helion coveralls, and he is weeping.

      "They gave us the paper," he says, in a voice like a radio between stations. "They said we'd hear it. We heard it. Then we couldn't find the way back."

      He is one of Helion's listeners. Or he was.
    choices:
      - text: "Ask him gently what they were promised."
        roll: {skill: [Psychology, Occult], success: 222, failure: 210}
      - text: "Leave him to it, and paddle back."
        to: 210

  222:
    title: Quiet
    effects:
      - note: GREY
      - note: LISTENERS
    text: |
      "Quiet," he says. "She promised quiet. No more noise in our heads. We'll have it Friday, she says, at the dish."

      He holds up his grey hands. "We can make things, you know. Doors. Phones. Cars. Only grey ones. We can't carry a tune. Never could."

      He'll be there on Friday. So will the others. They want quiet very much.
    choices:
      - text: "Paddle back, and walk on into the city."
        to: 210

  223:
    title: The Hollow Men
    text: |
      They come out of the grey: a dozen figures in Helion coveralls, with no faces, just a smoothness where faces go. They don't hurry. They don't make a sound. Where they walk, the gold goes out.

      They're the dream's shadow, the listeners who went in and never came back. They want what you have, whatever that is. Warmth, maybe.
    choices:
      - text: "Stand and fight. There are only a dozen of them."
        to: 370
      - text: "Run for it, and keep to the bright streets."
        roll: {skill: [Dodge, Stealth], success: 366, failure: 224}

  370:
    title: A Dozen
    effects: [{hp: "-7"}]
    text: |
      There are a dozen of them, and there is one of you, and they don't get tired.

      You last longer than you'd think. When it's over, you're lying in a grey gutter on Sunset, and they have gone back into the shadows to wait, and the sky is getting light.
    choices:
      - text: "Get up, if you can."
        to: 230

  366:
    title: The Bright Streets
    effects:
      - note: GOLD
    text: |
      You run where the light is brightest. The grey falls behind you, step by step, like a fog that can't keep up.

      The pavement turns to brass under your feet, then to stairs, and the stairs go up between towers of light. The music is right above you.
    choices:
      - text: "Climb."
        to: 225

  224:
    title: Grey Hands
    effects:
      - hp: "-1D8"
    text: |
      Grey hands find you. They're cold the way a cellar is cold, and where they touch you the colour goes out of your skin for an hour.

      You tear loose and run until the grey is behind you, and the gold is behind you too, and you're sitting on a bus bench on Sunset with your heart going like a drum solo.

      You stay there until the sky starts to pale.
    choices:
      - text: "Get up, and see what morning brings."
        to: 230

  225:
    title: The Heart
    effects:
      - san: "1D6/1D10"
    text: |
      At the top of the tallest tower is a hall shaped like the sun, and the music comes from everywhere in it.

      Its walls are covered in pictures, and every one of them is you. Every lucky break of your life is up there, painted in gold: the green lights, the parking spaces, the wrong turns that turned out right. Thousands of them, all leading here.

      You understand it all at once. You didn't have luck. You were being steered. You are a coincidence.
    extra:
      - requires: {investigator: ray}
        text: |
          There's the wrong bus in 1958, and you in the back seat watching a hold-up through the window. Your first case. Your licence.
      - requires: {investigator: dee}
        text: |
          There's 1962, and a burglar's bullet stopped dead in a badge a size too big, because the supply room had run out.
      - requires: {investigator: morton}
        text: |
          There's 1944, and a flat tyre on the road to San Pedro, and a transport that sailed without you and never arrived anywhere.
      - requires: {investigator: lena}
        text: |
          There's a postcard with no name, your first story, and behind it a hundred wrong numbers that were right.
      - requires: {note: KNOWS}
        text: |
          You were told already, in plain words. Seeing it painted is different.
      - text: |
          The hall waits for you to say something.
    choices:
      - text: "Ask it what it wants."
        to: 226
      - text: "Tell it no. Your life is your own."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 227
      - text: "Tell it no. Your life is your own."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 227
      - text: "Tell it no. Your life is your own."
        requires: {note: SNAG2}
        to: 286
      - text: "Stay here, where it's warm."
        to: 228

  226:
    title: What It Wants
    effects:
      - note: EAST
    text: |
      It doesn't speak. It shows you.

      A white dish on a salt flat, east, in hard afternoon light. A clock in a cinderblock hut, coming up on four fifty-six. And a song that has never been heard to the end.

      It wants to hear itself whole, once, before it wakes. Then it wants to choose what it becomes. It has spent your whole life getting you there to see that it can.
    extra:
      - requires: {note: LASTBAR}
        text: |
          Now you know what the missing bar is for.
      - text: |
          The hall goes quiet. Far below, the towers start to thin like mist.
    choices:
      - text: "Walk down out of the city, towards morning."
        to: 230

  227:
    title: Cast Out
    effects:
      - hp: "-1D4"
    text: |
      The hall goes out like a match.

      You're standing in the fast lane of the Hollywood Freeway at four in the morning, and a produce truck is coming at you with its horn going. You jump. You land badly, on the shoulder, in broken glass and ice plant.

      The trucker shouts something about hippies. Above you, the sky is grey and ordinary.
    extra:
      - requires: {note: SNAG2}
        text: |
          The city has turned its back on you. One more no, and it will stop listening.
      - text: |
          You limp to the next exit and wait for the dawn.
    choices:
      - text: "Walk on, towards morning."
        to: 230

  228:
    title: A Room in the Tower
    text: |
      A door opens off the hall onto a little room with a window over the gold city. There's a bed, a chair, and a radio playing the tune, softly.

      You could stay. Nobody here needs finding. Nothing here ends.

      The door stays open. So does the window.
    choices:
      - text: "Stay. Forever sounds about right."
        to: 229
      - text: "Not yet. Walk back down."
        to: 230

  229:
    title: The Tower
    ending: claimed
    text: |
      You sit down in the chair by the window, and you never get up.

      Days go by, or they don't. The city outside is always gold, and the radio is always playing the tune, and every so often somebody you knew in Los Angeles floats past on the river and waves.

      On Friday, at four fifty-six, something enormous wakes up and chooses what it will be. You don't see it. You're looking at the view.
    extra:
      - requires: {note: MESSAGE}
        text: |
          Leonard's message for Marian goes undelivered. It sits on your tongue, like a tab you never swallowed.
      - text: |
          A woman found you on Saturday, on a bus bench on Sunset, smiling with your eyes open. The doctors at County General called it catatonia. You call it home.

  230:
    title: Dawn
    text: |
      Dawn comes up dirty pink over the San Gabriels, the way it always has. The gold drains out of the streetlights. The sleepwalkers wake up wherever they are and look around, embarrassed, and go home in their slippers.

      A car radio somewhere is still playing the tune. "Good morning, Los Angeles," says the DJ, "and happy first day of spring."
    extra:
      - requires: {no_item: tape}
        text: |
          He's on KSUN, the station on La Cienega. He sounds like he's been up all night talking to sleepers.
      - text: |
          It's Friday.
    choices:
      - text: "Go and see what Friday brings."
        requires: {no_note: TAILED}
        to: 231
      - text: "Go and see what Friday brings."
        requires: {note: TAILED}
        to: 278
      - text: "Get over to KSUN while the DJ is still on the air."
        requires: {no_item: tape}
        to: 275

  # ---------------------------------------------------------------------------------------------------------------
  # AGNES'S ROOF
  # ---------------------------------------------------------------------------------------------------------------

  231:
    title: The Starburst
    text: |
      A coffee shop on La Cienega with a roof like a boomerang and a sign like an exploding star. It's seven o'clock. Truckers, a nurse coming off nights, a man reading the racing form.

      The waitress pours your coffee before you sit down. "You look like you walked here from the moon, honey."

      There's a stack of morning papers on the counter, and a pay phone by the door.
    choices:
      - text: "Eat something, and let the coffee work."
        effects: [{san: "+1D4"}]
        to: 279
      - text: "Read the morning papers."
        requires: {no_note: EQUINOX}
        to: 232
      - text: "Drive up to Altadena, and see Marian Voss."
        requires: {no_note: ALTADENA}
        to: 281

  232:
    title: The Almanac
    effects:
      - note: EQUINOX
    text: |
      The *Times* has nothing. Nixon, the war, the Dodgers in Vero Beach. Nobody has noticed that the whole city walked east in its sleep last night.

      In the weather box on page two, under the tides: SPRING BEGINS TODAY AT 4:56 P.M. PST. Somebody has ringed it in grease pencil, and drawn a little sun.
    extra:
      - requires: {note: STORY}
        text: In the rack by the register, the *Venice Mirage* is out a day early. The cover is a gold city. The headline is yours.
      - text: The waitress tops you up without asking. "Long day ahead?" she says.
    choices:
      - text: "Leave a big tip, and go."
        to: 279

  233:
    title: The Roof
    effects:
      - san: "1D6/1D10"
    text: |
      Agnes is on her roof in Silver Lake in her smock and slippers, painting by the light of the gold city as it rises out of downtown. She doesn't look round.

      "Sit down, dear. I've done you."

      On the easel is your life, small as a postage stamp in a hundred places, every lucky break strung on a single gold thread. The thread runs east, off the edge of the canvas.

      "You're a coincidence, dear," she says. "So am I. It's nothing to be ashamed of."
    extra:
      - requires: {investigator: ray}
        text: |
          There's the wrong bus in 1958, with you in the back seat.
      - requires: {investigator: dee}
        text: |
          There's the bullet in 1962, stopped in a badge a size too big.
      - requires: {investigator: morton}
        text: |
          There's the flat tyre in 1944, and the transport going without you.
      - requires: {investigator: lena}
        text: |
          There's the postcard with no name.
      - requires: {note: KNOWS}
        text: |
          You were told already. She has painted it anyway.
      - text: |
          She dabs at the gold thread. "Now. What shall we do with you?"
    choices:
      - text: "Let her paint you into the city."
        to: 235
      - text: "Ask her to paint you the way in at the desert."
        to: 237
      - text: "Photograph the canvas before the light goes."
        requires: {item: camera}
        to: 234

  234:
    title: The Canvas
    effects:
      - note: PROOF
    text: |
      You shoot it in the gold light, close and far, until the roll runs out. Agnes poses beside it, and pats her hair.

      "It'll never come out," she says. "They never do. Now sit down. You're in my light."
    choices:
      - text: "Ask her to paint you the way in at the desert."
        to: 237

  235:
    title: Painted In
    text: |
      She takes a fine brush and paints a small figure on a gold street, near the bottom of the canvas. It's you, with your hat on.

      You feel it at once: warm stone under your shoes, music from a window, a city that isn't going anywhere. The roof is getting thin around you.

      "You can stay," says Agnes. "Or you can step back out. I'm not fussy."
    choices:
      - text: "Stay in the painting."
        to: 236
      - text: "Step back out onto the roof."
        to: 237

  236:
    title: A Small Figure on a Gold Street
    ending: dreamer
    text: |
      You stay.

      It's a good city to stay in. The light is always late afternoon, the cafés never close, and nobody asks you to find anyone. Sometimes, far off, you can hear Agnes humming.

      Agnes Pike died in 1974, in her sleep, smiling. The painting went to the County Museum, where it hangs in a corridor nobody visits. Children like it best. They say the little man in the hat moves when you aren't looking.
    extra:
      - requires: {investigator: [dee, lena]}
        text: |
          They say "the little woman", actually. The label says *Untitled (Detective), 1970*.
      - text: |
          They're right. You're out for a walk.

  237:
    title: The Painted Road
    effects:
      - note: AGNES
      - note: GAP
    text: |
      She sets up a fresh board and paints fast. A desert road under a big sky, a salt flat, a white dish like a saucer. A chain-link fence around it, and in the fence, low on the far side, a gap shaped like a door.

      "The dream left that open for you," she says. "I'd go at dawn, if I were you. Things are easier at dawn."

      The paint is wet. The road in it looks wide enough to walk on.
    choices:
      - text: "Wait for dawn, and walk into the painting."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 291
      - text: "Take the little panel with you, and go and find a car."
        requires: {no_item: painting}
        effects: [{gain: painting}]
        to: 230
      - text: "Thank her, pocket the panel she gave you, and go and find a car."
        requires: {item: painting}
        to: 230

  # ---------------------------------------------------------------------------------------------------------------
  # THE STRAIGHT WORLD AT NIGHT
  # ---------------------------------------------------------------------------------------------------------------

  238:
    title: Coming Down
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      Midnight finds you behind the wheel, and the road comes over a rise.

      Ahead, the whole basin of Los Angeles is glowing gold. Not city lights: something under them, like a city of light laid over the real one, towers where there are no towers. The radio is playing the tune on every station.

      You've seen it from outside, sober, with your hands on the wheel. Nobody can tell you that you dreamed it.
    extra:
      - requires: {note: HOME}
        text: |
          Behind you in Altadena, Leonard is asleep in his own bed, with the cat on his chest.
      - requires: {note: TAKEN}
        text: |
          Somewhere out there, Helion's men have Leonard's body in the back of a grey car.
      - text: |
          A green sign says LOS ANGELES. Another says NORTH.
    choices:
      - text: "Drive down into it."
        to: 205
      - text: "Drive to Venice Division, and tell the police."
        to: 239
      - text: "Go and find your own people, on Venice's back streets."
        requires: {investigator: ray}
        to: 245
      - text: "Go home first, and get your head straight."
        requires: {investigator: dee}
        to: 247
      - text: "Go to the office. The original policy is in the vault."
        requires: {investigator: morton}
        to: 250
      - text: "Go to the Mirage. Someone should be writing this down."
        requires: {investigator: lena}
        to: 254
      - text: "Turn the car north, away from all of it."
        to: 284

  239:
    title: Venice Division, One in the Morning
    text: |
      The squad room smells of burnt coffee. Half the phones are ringing with people reporting their neighbours walking east in their sleep, and nobody is answering them.

      On the desk is a big tired sergeant with his tie off and his feet up, watching the gold out of the window like it's a ballgame.
    extra:
      - requires: [{no_note: STATION}, {investigator: [ray, morton, lena]}]
        text: |
          His nameplate says SGT. H. RUIZ. "Let me guess," he says. "You know what this is."
      - requires: [{note: STATION}, {no_note: RUIZ}, {investigator: [ray, morton, lena]}]
        text: |
          Hector Ruiz. He remembers you, and doesn't look pleased about it.
      - requires: {investigator: dee}
        text: |
          "Dee." He takes his feet down. "Sit. You look like hell, partner."
      - requires: {note: RUIZ}
        text: |
          "I've been waiting for you," he says. "Tell me it's not crazy."
      - text: |
          He pushes a chair out with his foot.
    choices:
      - text: "Show him what Helion stands to gain if Voss is dead."
        requires: {any: [{item: claim-file}, {note: MOTIVE}]}
        to: 240
      - text: "Tell him Helion took a patient out of Camarillo tonight."
        requires: {note: TAKEN}
        to: 240
      - text: "Tell him what you've learned about your own luck, and why."
        requires: {note: KNOWS}
        to: 240
      - text: "Ask him to make good on it, and come to the desert."
        requires: {note: RUIZ}
        to: 240
      - text: "Tell him all of it, start to finish, and make him listen."
        roll: {skill: [Persuade, Law, Fast Talk], success: 240, failure: 241}

  240:
    title: The Desert, Then
    effects:
      - note: RUIZ
    text: |
      He listens without saying anything, turning a pencil over and over. Outside the window a milkman drifts past, asleep, with his crate.

      "I can't arrest a defense contractor," he says at last. "Not in this town. But I come off shift at eight, and nobody counts the cruisers." He looks at the clock. "Eight o'clock. Get some sleep."

      You sleep on the bench in the squad room, under a wanted poster, and you don't dream.
    choices:
      - text: "Wake up at eight."
        to: 244

  241:
    title: Laughed At
    text: |
      He laughs. He doesn't mean it unkindly. He laughs like a man who has had a long night and has just been handed the punchline.

      "A dream," he says. "That's running the city. And a dish in the desert." He wipes his eyes. "Go home. Or go to the Feds, they love this stuff. The Federal Building opens at eight."
    choices:
      - text: "Go over his head. Wait on the Federal Building steps until eight."
        to: 242
      - text: "Forget the police. Go out and see it for yourself."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 208

  242:
    title: The Federal Building
    text: |
      You sit on the steps of the Federal Building until dawn, then until eight. At ten past, a young agent with a crew cut takes you into a room with a two-way mirror and writes down everything you say.

      He doesn't laugh. That's worse. He writes "gold city" carefully, and underlines it, and asks if you have taken any drugs in the last seventy-two hours.

      Through the door you hear him on the phone, asking for "the doctor".
    choices:
      - text: "Thank him, and walk out before the doctor comes."
        requires: {no_note: TAILED}
        to: 279
      - text: "Thank him, and walk out before the doctor comes."
        requires: {note: TAILED}
        to: 278
      - text: "Stay, and insist. Somebody in government has to listen."
        to: 243

  243:
    title: Seventy-Two Hours
    ending: scolded
    text: |
      The doctor is very nice. He gives you a shot of something, and a bed in the psychiatric ward at County General, with a window that doesn't open.

      You spend Friday watching the clock. At four fifty-six you feel it, the whole city holding its breath and then letting it out, and you are lying in a hospital gown with a nurse asking if you'd like Jell-O.
    extra:
      - requires: {note: MESSAGE}
        text: |
          You never deliver Leonard's message. You tell it to the night nurse instead. She says it's lovely.
      - text: |
          They let you out on Monday. Nobody believes you yet. They will have to wait until you're out of the hospital not to believe you properly. You took a miracle to the federal government, in person, before breakfast. That was never going to work.

  244:
    title: Eight O'Clock
    text: |
      Ruiz shakes you awake with two coffees in paper cups and his car keys in his teeth. The cruiser is parked out back, a black-and-white Plymouth Fury with the shotgun still racked.

      "I told the lieutenant it's a stolen-property thing in San Bernardino County," he says. "Which it is. Kind of. Get in."
    choices:
      - text: "Get in, and head east."
        to: 304

  # ---------------------------------------------------------------------------------------------------------------
  # OWN NIGHTS
  # ---------------------------------------------------------------------------------------------------------------

  245:
    title: Venice West Café
    text: |
      The Venice West Café closed in 1966. Tonight its lights are on, and every table is full.

      Poets you used to buy coffee for, painters, a jazz drummer who died in '63. They're all awake and all working, and every canvas in the room shows the same skyline: gold towers, and a white dish far away.

      A poet in a beret waves you over. He has a sheaf of pages, and a joint behind his ear.
    choices:
      - text: "Sit down, and let him read you his poem."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 246
      - text: "Take the joint he offers, and sit with them until dawn."
        requires: {no_item: joint}
        effects: [{gain: joint}]
        to: 230
      - text: "Share your own joint round the table, and sit with them until dawn."
        requires: {item: joint}
        effects: [{san: "+1D3"}]
        to: 230

  246:
    title: The Poem
    effects:
      - note: EQUINOX
      - note: GOLD
      - san: "1/1D4"
    text: |
      The poem is about you.

      It's about a detective at a dish in the desert, on the first day of spring, at four fifty-six. The poet reads it slowly, in a voice like gravel in honey. At the last line he looks straight at you, and the line is a door, and the café isn't there any more.

      You're climbing gold stairs, with the music ahead of you.
    choices:
      - text: "Keep climbing."
        to: 225

  247:
    title: Your Apartment
    text: |
      Your place on Mildred Avenue has been turned over: drawers out, mattress slit, the cereal poured into the sink. Somebody was looking for whatever you have.

      Somebody still is. In the kitchen doorway stands a grey figure in Helion coveralls, with no face. Just a smoothness, like a thumbprint, where a face should be. It doesn't move. It's waiting.
    choices:
      - text: "Go for it. It's your kitchen."
        roll: {skill: "Fighting (Brawl)", success: 248, failure: 249}
      - text: "Back out slowly, and let it have the place."
        to: 230

  248:
    title: Its Wallet
    effects:
      - note: ROSTER
    text: |
      It's like hitting a wet sack of sand, and then it isn't there, and there's nothing on your kitchen floor but a pair of empty coveralls.

      In the pocket is a wallet. A Helion ID for someone called Gerald Hume, Listener, Grade 2, and a folded sheet: the gate roster for Site SW, today's date, every name cleared to pass.

      You sit on your slit mattress with the roster until the sky goes pale.
    choices:
      - text: "Go out and meet the morning."
        to: 230

  249:
    title: Grey Hands
    effects:
      - hp: "-1D6"
    text: |
      It doesn't fight. It just holds on, and where it holds you the colour goes out of your skin.

      You break its grip with a frying pan, and it backs away into the wall and is gone, leaving a grey stain on the wallpaper the shape of a man.

      You spend the rest of the night in a chair facing the door.
    extra:
      - requires: {item: revolver}
        text: |
          The revolver sits in your lap. It wouldn't have done any good, and you know it.
      - text: |
          Nothing else comes. Not tonight.
    choices:
      - text: "Go out and meet the morning."
        to: 230

  250:
    title: Golden Shield, Three in the Morning
    text: |
      The Golden Shield building on Spring Street is dark except for the lobby. The night watchman is asleep at his desk with his cap over his eyes, smiling. The vault room key is on his belt.

      Upstairs, in the vault, is the original Voss policy, with every signature on it.
    choices:
      - text: "Wake him, and pull rank. You're a senior man."
        requires: {skill: Credit Rating, min: 50}
        roll: {skill: Credit Rating, success: 252, failure: 251}
      - text: "Ease the key off his belt without waking him."
        roll: {skill: [Stealth, DEX], difficulty: hard, success: 252, failure: 251}
      - text: "Leave it. Go home and sleep an hour."
        to: 230

  251:
    title: The Watchman
    text: |
      He wakes up with a snort, and a hand on his holster. He doesn't care who you are, or that you've worked here since 1949. Nobody goes in the vault at three in the morning. He'll be writing this up.

      You leave him to it, and walk out into the gold street.
    choices:
      - text: "Walk until dawn."
        to: 230

  252:
    title: The Vault
    text: |
      The policy is in a green box with the other key-man contracts. Five hundred thousand dollars on Dr. Leonard Voss. The double-indemnity rider is pinned to the back, in smaller type, with its own signature.

      You know these riders. You know who signs them, and why.
    choices:
      - text: "Read the rider, line by line."
        requires: {skill: Accounting, min: 50}
        roll: {skill: Accounting, success: 253, failure: 230}
      - text: "Leave it. You've seen enough of this place."
        to: 230

  253:
    title: Her Signature
    effects:
      - note: MOTIVE
      - note: SIGNED
    text: |
      Double, if Voss dies before 21 March 1970. Requested by the policyholder's officer, and signed by her, in green ink: *Edith M. Marrow, Director, Special Projects.*

      She asked for it herself, the week after he heard the dream. She knew he'd go, and she knew what he'd be worth dead.

      Her head of security works for her. You wonder whether he knows.
    choices:
      - text: "Pocket a photostat, and walk out into the dawn."
        to: 230

  254:
    title: The Presses
    text: |
      The Mirage's back room is shaking. The old flatbed press is running by itself at three in the morning, with nobody feeding it, and the sheets are stacking up warm on the floor.

      It's printing tomorrow's paper. Or today's. You can smell the ink from the street.
    choices:
      - text: "Pick up a sheet, and read the headline."
        to: 255
      - text: "Pull the plug. Nobody prints the Mirage but you."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 256
      - text: "Pull the plug. Nobody prints the Mirage but you."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 256
      - text: "Pull the plug. Nobody prints the Mirage but you."
        requires: {note: SNAG2}
        to: 286

  255:
    title: Tomorrow's Headline
    effects:
      - note: LULLABY
      - note: STORY
    text: |
      **HELION'S LULLABY**, says the headline. *A defense firm means to sing the city to sleep.* Your byline. Your words, too, though you haven't written them yet.

      It's all there. The dish, the listeners, the hinge. It reads well. It reads like the kind of thing nobody would believe.

      You stack a hundred copies by the door, and wait for the dawn.
    choices:
      - text: "Go out into the morning."
        to: 230

  256:
    title: Ink
    effects:
      - hp: "-1D2"
    text: |
      You yank the cord. The press doesn't care. It runs on, faster, and when you reach in to stop the roller it takes a corner of your sleeve and a strip of skin with it.

      Then it jams, and stops, and the back room is silent. The only sheet that came out whole is blank.
    extra:
      - requires: {note: SNAG2}
        text: |
          The city has turned its back on you. One more no, and it will stop listening.
      - text: |
          You wrap your hand in a rag and sit in the dark until morning.
    choices:
      - text: "Go out into the morning."
        to: 230

  # ---------------------------------------------------------------------------------------------------------------
  # HELION'S SIDE AT NIGHT
  # ---------------------------------------------------------------------------------------------------------------

  257:
    title: The Hangar
    effects:
      - unnote: SNAG
      - unnote: SNAG2
    text: |
      Helion's hangar sits by the runway fence, lit up white, with its doors open to the night. Two helicopters are on the apron. Men in grey coveralls are loading them: crates stencilled SUNWARD, reclining chairs, coils of cable.

      Nobody is guarding the side door. In the office beside it is a row of filing cabinets, and one drawer has a label typed with your name.
    choices:
      - text: "Slip into the office, and read your file."
        to: 258
      - text: "Steal a pair of coveralls off the rack."
        to: 259
      - text: "Climb in behind the crates on the nearest helicopter."
        to: 264

  258:
    title: Your File
    effects:
      - note: KNOWS
      - san: "1D6/1D10"
    text: |
      It's two inches thick. Reports from a listener, dated since last July, typed up from what he heard in the dream: your name, again and again. Then graphs. Helion's statisticians have charted your luck, year by year, back to your childhood.

      The last page is a memo to Marrow. *Subject's history shows improbable outcomes at a rate of one in eleven million. Statistically, the subject should not exist. Recommend the subject be present at the hinge, or prevented from it.*

      You aren't lucky. You've been arranged.
    extra:
      - requires: {investigator: ray}
        text: |
          Item 1958/4: *Subject boards wrong bus, witnesses armed robbery, obtains PI licence.*
      - requires: {investigator: dee}
        text: |
          Item 1962/11: *Round stopped by badge issued one size too large. Supply records confirm shortage.*
      - requires: {investigator: morton}
        text: |
          Item 1944/2: *Subject misses transport by flat tyre. Transport not heard from again.*
      - requires: {investigator: lena}
        text: |
          Item 1966/1: *Subject's first story originates from anonymous postcard. See also file W-14, "wrong numbers".*
      - text: |
          Someone is whistling on the apron. It isn't the tune. It isn't anything.
    choices:
      - text: "Steal a pair of coveralls off the rack."
        to: 259
      - text: "Climb in behind the crates on the nearest helicopter."
        to: 264
      - text: "Get out of here and into the city."
        to: 205

  259:
    title: Coveralls
    effects:
      - gain: overalls
    text: |
      They're grey, and a size wrong, and they say HELION across the shoulders. A technician's badge is clipped to the pocket: some poor devil called Fred, whose photograph looks like everybody.

      A clipboard by the door says the technicians' van leaves for Site SW at nine sharp.
    choices:
      - text: "Pick up a clipboard, and look busy until nine."
        to: 260
      - text: "Walk out in them, into the city."
        to: 205

  260:
    title: The Night Shift
    text: |
      Nobody asks who you are. A foreman with a cold hands you a dolly. "Fred. Recliners. Go."

      You spend the night wheeling reclining chairs out of a long room with the lights turned low. In the last six, the listeners are still under, smiling, with headphones on. The headphones are plugged into a box on the wall. A spare pair hangs on a hook.
    choices:
      - text: "Loosen every headphone jack as you wheel the chairs out."
        roll: {skill: [Stealth, Mechanical Repair, Electrical Repair], success: 261, failure: 262}
      - text: "Put the spare headphones on, just for a minute."
        to: 263

  261:
    title: Loose Connections
    effects:
      - note: UNPLUGGED
    text: |
      It's easy. Half a turn on each jack, so they'll seat and still not quite connect. Nobody watches a man with a dolly.

      At dawn the chairs go up into the helicopters. At nine the van is waiting, with its engine running and the heater on.
    choices:
      - text: "Climb in with the other technicians."
        to: 314

  262:
    title: The Foreman
    effects:
      - luck: -5
    text: |
      "Leave the jacks alone, Fred," says the foreman, without looking up. "Dr. Marrow checks every one of them herself."

      He keeps you busy and in sight until dawn. At nine he walks you out to the van and watches you climb in.
    choices:
      - text: "Climb in with the other technicians."
        to: 314

  263:
    title: The Grey City
    effects:
      - note: LISTENERS
      - san: "-10"
    text: |
      A grey city. The same towers as the gold one, but grey, and silent, and everyone in it is waiting in line.

      A man in a grey suit with no face turns to you. "She promised us quiet," he says. "Isn't it quiet?" Behind him, the line goes on to the horizon. Nobody in it is humming.

      You pull the headphones off. It's dawn, and your hands are shaking.
    choices:
      - text: "Get to the van before you're missed."
        to: 314

  264:
    title: Behind the Crates
    text: |
      You fold yourself in behind a stack of SUNWARD crates, under a tarp that smells of engine oil. The crates are cold. Something inside them clinks like a million tiny bottles.

      You wait. Nobody comes. The hangar lights go off at two.
    choices:
      - text: "Settle in, and wait for morning."
        to: 265

  # ---------------------------------------------------------------------------------------------------------------
  # OWEN'S DOME
  # ---------------------------------------------------------------------------------------------------------------

  265:
    title: Three in the Morning
    effects:
      - san: "0/1D3"
    text: |
      At three o'clock a gold light comes up between the slats of the crates, soft as a nightlight, and somewhere very far off the tune begins. The dream has followed you in here. It doesn't seem to mind the company it's keeping.

      The crate by your knee has a loose lid. Inside, packed in straw, are thousands of little squares of paper, each stamped with an orange sun.
    choices:
      - text: "Take one, and put it in your pocket."
        requires: {no_item: tab}
        effects: [{gain: tab}]
        to: 266
      - text: "Leave them, and try to sleep."
        effects: [{san: "+1D3"}]
        to: 266

  266:
    title: Lift-Off
    text: |
      At first light the rotors start to turn, and the floor tilts, and Los Angeles falls away beneath you, gold going grey going ordinary.

      Nobody looks behind the crates. Somebody up front is eating a sandwich.
    choices:
      - text: "Hold on, and keep still."
        to: 315

  267:
    title: Helion in Topanga
    text: |
      You hear the helicopter before you see it, beating over the canyon at one in the morning. It's sitting in the goat field by the dome with its lights on, and men in grey coveralls are carrying crates out of Owen's lab.

      Owen is crouched behind the woodpile in his underwear, with a can of kerosene.
    extra:
      - requires: {note: OWEN}
        text: |
          He sees you and nearly cries. "They're taking all of it. All the Daybreak. Help me, man."
      - requires: {no_note: OWEN}
        text: |
          He looks at you like you might be one of them. Then he looks at the kerosene, and back at you, and decides you're not.
      - text: |
          The crates are stacked by the lab door, waiting for the next trip.
    choices:
      - text: "Help him get to the crates with the kerosene."
        roll: {skill: Stealth, success: 268, failure: 269}
      - text: "Stay down, and watch who gets out of the helicopter."
        to: 270

  268:
    title: The Fire
    effects:
      - note: OWEN
      - note: BURNED
    text: |
      You get there in the shadows. Owen sloshes the kerosene, and you strike the match.

      The crates go up with a sound like a sigh. Four thousand doses of Daybreak burn in the goat field, and for a moment the smoke is gold and full of faces, and then it's just smoke. The men in grey stand round it and do nothing at all.

      "No listeners now," Owen whispers. "Not new ones."
    choices:
      - text: "Get out down the back trail with him."
        to: 271

  269:
    title: Caught in the Light
    effects:
      - hp: "-1D3"
    text: |
      A searchlight swings round off the helicopter and pins you to the woodpile like a moth.

      Grey hands, a knee in your back, the taste of dirt. Owen gets away into the chaparral. You don't. They fly you down to El Segundo with your hands tied, and you spend what is left of the night on a crate in Helion's hangar. At first light a man in a grey suit brings you coffee, and says, kindly, "Dr. Marrow will be so pleased."
    choices:
      - text: "Sit still, and go where they take you."
        to: 316

  270:
    title: The Woman in the Camel Coat
    effects:
      - note: EAST
      - note: EQUINOX
    text: |
      A woman steps down from the helicopter in a camel coat, holding her hair against the rotor wash. Grey, fifty-something, very calm.

      "Load it all," she tells them. "We fly to Sweetwater at dawn. The dish wants everything ready by four, and the hinge is at four fifty-six, not a second later."

      She looks round at the dome as if she pities it, and climbs back in.
    choices:
      - text: "Wait until they've gone, then find Owen."
        to: 271

  271:
    title: Owen's Bus
    text: |
      By dawn Owen has his old school bus running in the lane, painted with suns and spirals and smelling of patchouli and goats.

      "Helion's going to dose them all again at the dish. The listeners," he says. "Gerald, Trudy, the kid from Pomona. They signed up for a study. I sold them the stuff. I've got to get to them first."

      He holds the door open.
    choices:
      - text: "Ride east with him."
        effects: [{luck: 5}, {san: "1/1D4"}, {note: OWEN}]
        to: 300
      - text: "Get out at the coast, and find your own way."
        to: 230

  # ---------------------------------------------------------------------------------------------------------------
  # THE BEACH
  # ---------------------------------------------------------------------------------------------------------------

  272:
    title: The Waves Stop
    text: |
      At three in the morning the Pacific off Venice is flat as a plate of glass, all the way to the horizon. No surf. No sound. The moon lies on it like a coin.

      Bix is sitting on his board on the sand.

      "It's holding its breath, man," he says. "Whole ocean. Been like that since midnight. It's waiting to see what happens tomorrow."
    choices:
      - text: "Walk out onto the water."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 273
      - text: "Sit down beside him, and wait for dawn."
        to: 274

  273:
    title: On the Water
    effects:
      - note: EAST
      - san: "-8"
    text: |
      It holds you. It's like walking on a cold window.

      A hundred yards out you look down, and the ocean shows you a picture, the way a pond shows the sky: a salt flat under hard sun, a white dish, a fence, a hut with a clock in it. And far behind you, small, a city waking up.

      When you turn round, Bix has gone up the beach to his van, and the sky is going pale.
    choices:
      - text: "Walk back to the shore."
        to: 230

  274:
    title: Waiting
    effects:
      - note: BIX
    text: |
      You sit with him and say nothing for three hours. It's the best conversation you've had all week.

      At dawn the first small wave comes in and breaks at your feet, and Bix stands up and brushes off the sand.

      "Van's up on Speedway," he says. "Gassed and everything. The desert, right? I can read a road as good as a set."
    choices:
      - text: "Go with Bix."
        to: 292

  # ---------------------------------------------------------------------------------------------------------------
  # KSUN AT DAWN
  # ---------------------------------------------------------------------------------------------------------------

  275:
    title: Larry at Dawn
    text: |
      The fibreglass sun on the roof of KSUN is still glowing. Inside, in the booth, a big soft man with a velvet voice and a cardigan is talking to the sleepwalkers, and the tune is turning on the deck behind him.
    extra:
      - requires: {no_note: RADIO}
        text: |
          "Larry Lark," he says, shaking your hand without taking his eyes off the meters.
      - requires: {note: RADIO}
        text: |
          Larry Lark waves you in without taking his eyes off the meters.
      - text: |
          "You're the one they keep calling in about," he says. "I've been up all night playing it for them."
    choices:
      - text: "Ask him for the reel."
        to: 276
      - text: "Ask him to play it on the air at four fifty-six this afternoon."
        to: 277

  276:
    title: The Dub
    effects:
      - gain: tape
    text: |
      He rewinds it and puts it in a box and hands it over, the way you'd hand someone a baby.

      "It came in the mail, last June, no return address," he says. "I always figured somebody would come for it. I made a dozen copies. Don't tell the FCC."
    choices:
      - text: "Go back out to the street."
        requires: {no_note: TAILED}
        to: 279
      - text: "Go back out to the street."
        requires: {note: TAILED}
        to: 278

  277:
    title: On the Air at 4:56
    effects:
      - note: LARK
      - note: EQUINOX
    text: |
      He writes it on his hand in ballpoint. *4:56 Fri.*

      "I play it every day at four fifty-six anyway," he says. "Phones light up like Christmas. Today, I'll play it like I mean it." He taps the transmitter schedule. "Fifty thousand watts. They'll hear it in Needles."
    choices:
      - text: "Go back out to the street."
        requires: {no_note: TAILED}
        to: 279
      - text: "Go back out to the street."
        requires: {note: TAILED}
        to: 278

  # ---------------------------------------------------------------------------------------------------------------
  # DAWN
  # ---------------------------------------------------------------------------------------------------------------

  278:
    title: Calloway's Men
    text: |
      Two grey Plymouths are parked at the curb, and men in grey suits are getting out of them, slowly, buttoning their jackets. One of them smiles at you as if you're old friends.

      Behind them, half a block down, the pink ice-cream truck is idling, its little tune tinkling out into the morning.
    choices:
      - text: "Run for the pink truck."
        effects: [{unnote: TAILED}]
        roll: {skill: [Dodge, Luck], success: 287, failure: 316}
      - text: "Go quietly. Let them take you to the dish."
        to: 316

  279:
    title: Friday
    text: |
      Friday morning, the first day of spring, and Los Angeles looks almost ordinary. Paper boys. Sprinklers. A man hosing down a gas station forecourt.

      The pink ice-cream truck is at the curb with its engine running, playing the tune. The driver's door is open. The driver isn't in a hurry.

      Across the street, a grey sedan stands with its back door open and no driver you can see.
    extra:
      - requires: {note: GREY}
        text: It's grey, and silent, and it smells of nothing. You know what makes things like that.
      - text: The truck's engine ticks over, warm.
    choices:
      - text: "Climb into the ice-cream truck."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 287
      - text: "Get into the grey sedan. It's waiting for you, too."
        to: 280
      - text: "Call Bix. He has a van."
        requires: {note: BIX}
        to: 292
      - text: "See Marian in Altadena first."
        requires: {no_note: ALTADENA}
        to: 281
      - text: "Take your own car. You'll get there under your own steam."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 311
      - text: "Take your own car. You'll get there under your own steam."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 311
      - text: "Take your own car. You'll get there under your own steam."
        requires: {note: SNAG2}
        to: 286
      - text: "Drive north instead, out of all of this."
        to: 284

  280:
    title: The Grey Sedan
    effects:
      - luck: -5
    text: |
      You get in. The door shuts behind you without a sound.

      No radio. No tune. The seats smell of nothing, not leather, not cigarettes, not anybody. For three days every real coincidence has come with music and colour, and this one is grey all through. You notice that a second too late.

      There's a man in the front seat now, with no face. Another gets in beside you and takes your wrist, gently, the way a nurse does.
    choices:
      - text: "Go where it takes you."
        to: 316

  281:
    title: Altadena at Dawn
    effects:
      - note: ALTADENA
    text: |
      The sun is well up over the San Gabriels when you pull up. The green pool is steaming in the cold.

      Marian is on the front step in her robe with a cup of coffee, and the cat on the step beside her.
    extra:
      - requires: {no_note: HOME}
        text: |
          There's grass on her bare feet, and her eyes are puffy. "I walked in my sleep," she says. "I woke up downtown, on a bus bench. I dreamed of him." She looks at your face. "You know something," she says. "Tell me."
      - requires: {note: HOME}
        text: |
          She's been up all night, and she's smiling. "He's asleep," she says. "He's so young. He woke for a minute at midnight and said your name, and went back under."
      - requires: {note: TAKEN}
        text: |
          She doesn't know Helion has him. You can see she doesn't.
      - text: |
          She makes room for you on the step.
    choices:
      - text: "Give her Leonard's message, word for word."
        requires: [{note: MESSAGE}, {no_note: MARIAN}]
        to: 282
      - text: "Tell her he's alive, and you're going to get him back."
        requires: {no_note: HOME}
        to: 283
      - text: "Ask her whether he kept anything for the dish."
        requires: {note: HOME}
        to: 283

  282:
    title: The Message
    effects:
      - note: MARIAN
    text: |
      You say it the way he said it to you.

      She doesn't cry. She sets down the coffee, very carefully, and puts her hand over her mouth, and nods, and nods. The cat climbs into her lap.

      "That's him," she says. "That's exactly him."
    choices:
      - text: "Ask her whether he kept anything for the dish."
        to: 283

  283:
    title: Leonard's Keys
    effects:
      - gain: hut-keys
    text: |
      She goes inside and comes back with a brass key ring. Two keys, and a tag marked SW in pink nail polish.

      "He kept these in the sugar bowl," she says. "Gate and door, he said, out at the site. He said if anything ever happened, give them to whoever came asking for him." She closes your hand round them. "That's you."
    choices:
      - text: "Drive back down into the city."
        to: 279

  284:
    title: The 101 North
    text: |
      You point the car north and drive.

      Past the last of the city, the road opens out, and the radio loses the tune somewhere past Ventura, and finds a farm report instead. Hay prices. Frost warnings. It's the most restful thing you've ever heard.

      Every mile, the weight on your chest gets a little lighter. Somewhere behind you, something enormous is waiting for you, and you are not going.
    choices:
      - text: "Turn the car round. Morning will catch you up."
        to: 279
      - text: "Keep driving."
        to: 285

  285:
    title: North on the 101
    ending: escape
    text: |
      You keep driving, north and north. On Friday afternoon, at four fifty-six, you're in a diner on the coast road with a slice of pie, and you feel something, far away, like a door closing in another house. You never find out what. You never ask. You sleep in the car outside Eureka that night, and you don't dream.

      By Oregon, you can't remember the tune.
    extra:
      - requires: {note: TAKEN}
        text: |
          You never learn what Helion did with Leonard. You don't look it up.
      - requires: [{note: MESSAGE}, {no_note: MARIAN}]
        text: |
          Leonard's message for Marian goes with you. You mean to write it down for her, and you never do.
      - requires: {note: HOME}
        text: |
          Marian sends a card at Christmas, to your old address. Leonard is well, she writes, and very young, and he hums.
      - text: |
          You get a job in Portland finding runaway husbands, and you're good at it, and you're never lucky again. Not once. It's a quiet kind of freedom, and most days you think it was worth it.

  286:
    title: Needles
    ending: scolded
    text: |
      You wake up in a motel in Needles, on the Arizona line, with the curtains open and the sun going down. Six in the evening, Friday. An ordinary pink sky.

      Four fifty-six came and went while you slept. Whatever woke up out on the salt, woke without you.

      You said no three times. The city only had to say it once.
    extra:
      - requires: {note: MESSAGE}
        text: |
          Leonard's message for Marian is still in your head. You call her from the motel phone, and nobody answers.
      - text: |
          On the nightstand somebody has left you a single orange. You don't eat it. You don't deserve it, and you both know it.
  # ---------------------------------------------------------------------------------------------------------------
  # ACT FOUR: THE HINGE. FRIDAY 20 MARCH 1970, NINE IN THE MORNING TO FIVE IN THE AFTERNOON
  # ---------------------------------------------------------------------------------------------------------------

  # --- The pink truck (the Current) -------------------------------------------------------------------------------

  287:
    title: Sunday's
    effects: [{note: EARLY}]
    text: |
      The Ice-Cream Man drives with one finger. The tune goes round and round on the roof speaker, and the city falls away behind you: San Bernardino, the Cajon Pass, Barstow at a speed the truck should not be able to do.

      He doesn't stop for gas. The needle never moves off full.

      Past Ludlow, the salt flats start to shine. Out on one of them stands a little town that isn't on any map, with a water tower and bunting on the main street.
    choices:
      - text: "Ask him to stop at the town."
        to: 288
      - text: "Let him drive."
        to: 290

  288:
    title: Sweetwater, 1955
    text: |
      The truck idles on a main street of white clapboard. Chrome on the cars, crew cuts on the boys, a banner over the street: SWEETWATER SPRING DANCE, TONIGHT. Somebody's mother is hanging paper lanterns.

      A girl in a yellow dress takes your hand as if she has been waiting all week. "You came," she says. "Nobody comes out this far anymore."

      Behind you, the Ice-Cream Man taps the horn twice. He doesn't look round.
    choices:
      - text: "Stay for the dance."
        to: 289
      - text: "Let go of her hand, and get back in the truck."
        to: 290

  289:
    title: The Dance
    ending: strange
    text: |
      The truck goes on without you. You don't watch it go.

      The dance starts at eight and does not end. The band plays everything you ever liked, in the order you liked it. The punch is cold, the lanterns never burn down, and the girl in yellow never gets tired, or older, or anything but glad.

      Out on the same salt, not far at all, at four fifty-six on a Friday afternoon, something enormous opens its eyes and looks around for a detective. You aren't there. It finds someone else, or it doesn't. You'll never know which.
    extra:
      - text: |
          Years later, a geologist on Sweetwater Dry Lake picks up a paper lantern, perfectly dry, on salt that hasn't seen rain since 1955.

  290:
    title: Through the Gate
    text: |
      The road ends at a chain-link fence around a dry lake, and a white dish ninety feet across stands in the middle of the salt, like a saucer set out for the sky.

      The guard at the gate has a rifle and a clipboard. The Ice-Cream Man rolls down his window, and the tune pours out. The guard lowers the rifle, buys a Popsicle, and opens the gate. So does the guard behind him.

      The truck crosses the salt and parks in the shadow of the dish.
    choices:
      - text: "Get out onto the salt."
        to: 336

  # --- Agnes's painted road -------------------------------------------------------------------------------------

  291:
    title: The Painted Road
    effects: [{san: "1/1D6"}]
    text: |
      You step into Agnes's painting at dawn, and the road is under your feet.

      It's paint. You can see the brushstrokes in the gravel, and the Joshua trees are four quick dabs of green. The sky is the one she painted for MGM in 1939, and it has never once clouded over.

      You walk all day, and no time at all. The road climbs. It is a curve of white, then a smooth white slope, then a rim of white steel under your boots.
    choices:
      - text: "Look down."
        to: 335

  # --- Bix's van --------------------------------------------------------------------------------------------------

  292:
    title: Bix's Van
    effects:
      - note: VAN
    text: |
      Bix's van is a 1961 Volkswagen with a surfboard on the roof and a mattress in the back. It smells of wax and oranges. He drives barefoot.

      "Desert's like a beach with the water let out," he says, east of San Bernardino. "Same rules. You read it, you don't fight it."

      The freeway climbs into the Cajon Pass. Near the top, Bix takes his foot off the gas and squints at a dirt track going off into the hills.
    choices:
      - text: "Ask him what he's seeing."
        to: 293

  293:
    title: Bix Reads the Road
    text: |
      "That's a set coming in," Bix says. "See how the track sits? Old road. Goes round the back of the hills, past the ghost town. Could be quicker." He shrugs. "Could be it's just a road."

      Trucks blow past you, rocking the van. The highway runs straight ahead to Barstow, wide and grey and sure of itself.
    choices:
      - text: "Take the old road."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 294
      - text: "Stay on the highway."
        to: 296

  294:
    title: Calico
    text: |
      The old road comes out above a ghost town: board sidewalks, a saloon with no door, silver tailings spilling down the hill like ash.

      An old man in a miner's hat sits on the saloon step. You can see the hillside through him. He lifts one hand and points up the slope, at a mine adit shored with grey timbers.

      Bix takes his sunglasses off. "Well," he says. "That's a pretty clear read."
    choices:
      - text: "Follow where he's pointing."
        effects: [{luck: 5}, {san: "1/1D4"}]
        to: 295
      - text: "Thank him kindly, and go back to the highway."
        to: 296

  295:
    title: The Mine
    effects: [{note: EARLY}, {san: "1/1D4"}]
    text: |
      You leave the van at the adit and walk in with Bix's flashlight. The tunnel should end in fifty yards. It goes on for an hour, cool and dry, with the tune humming in the rails.

      You come out blinking into hard light. The van is parked at the tunnel mouth, engine ticking, and Bix is sitting on the bumper eating an orange.

      "Don't ask me," he says. "I just drove." The sign by the road says AMBOY 6. By the sun, it isn't noon yet.
    choices:
      - text: "Drive the last miles to the dish."
        to: 319

  296:
    title: Barstow
    text: |
      Bix pulls into a Union 76 in Barstow for gas. The attendant is a boy with a paper hat and an accent from somewhere wet.

      "Fill-up's paid," he says, before Bix can ask. "Lady called it in at six this morning." He holds out a slip of paper with your name on it, spelled right, and an envelope.

      Bix is already shaking his head at the strangeness of everything, happily.
    choices:
      - text: "Take what's waiting for you."
        requires: {no_item: helion-badge}
        to: 297
      - text: "Take what's waiting for you."
        requires: {item: helion-badge}
        to: 298
      - text: "Insist on paying for the gas."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 299
      - text: "Insist on paying for the gas."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 299
      - text: "Insist on paying for the gas."
        requires: {note: SNAG2}
        to: 286

  297:
    title: The Envelope
    effects: [{gain: helion-badge}]
    text: |
      Inside the envelope is a laminated Helion pass with Leonard Voss's photograph on it, cleared for "Site SW". On the back, in pencil, in a careful hand: *spare*.

      You look at the attendant. He shrugs. "Lady said you'd need it."
    choices:
      - text: "Drive on, east."
        to: 319

  298:
    title: A Popsicle Stick
    effects: [{note: EQUINOX}]
    text: |
      The envelope holds a single Popsicle stick, licked clean. Somebody has written on it in ballpoint: *4:56*.

      "That's all she left," the attendant says, and goes back to washing the windshield.
    choices:
      - text: "Drive on, east."
        to: 319

  299:
    title: Paid
    effects: [{note: TAILED}]
    text: |
      You make him take the money. He takes it unhappily, like a boy who has broken something.

      The van won't start. Then it does, on the fourth try, with a noise like a tray of cutlery.

      At the next pump, a grey Plymouth is filling up. The man at the nozzle is watching you over the roof, without seeming to.
    extra:
      - requires: {note: SNAG2}
        text: The radio, which has played the tune since Los Angeles, goes to static and stays there.
      - text: Bix pulls out onto the highway, and the Plymouth pulls out a quarter of a mile behind.
    choices:
      - text: "Drive on, east."
        to: 319

  # --- Owen's bus -------------------------------------------------------------------------------------------------

  300:
    title: Owen's Bus
    text: |
      Owen's bus is a 1948 school bus painted with suns, and it goes sixty downhill. Owen grips the wheel at ten and two and talks the whole way.

      "Helion takes the listeners out by bus," he says. "Every Friday this month. A dozen kids on my stuff, in headphones, and some of them don't come back. If they get to that dish today..." He doesn't finish.

      Past Ludlow, at the café in Amboy, a grey Helion bus is parked by the pumps.
    choices:
      - text: "Pull in beside it."
        to: 301

  301:
    title: The Listeners' Bus
    text: |
      Amboy is a café, a motel, a gas pump and a black cinder cone squatting on the desert. The Helion bus idles in the heat. Inside, a dozen young people sit very straight with headphones on, smiling at nothing. The driver is in the café, buying cigarettes.

      Owen is out of his seat before you've stopped. "They'll listen to me," he says. "I made what they took. Help me talk them down."
    choices:
      - text: "Help Owen talk them off the bus."
        roll: {skill: [Persuade, Charm, Psychology], success: 303, failure: 302}
      - text: "Let the bus go. Owen can drop you at the turn-off."
        to: 319

  302:
    title: The Driver Comes Back
    text: |
      Two of them take their headphones off and blink at the sun. The rest won't hear you.

      The driver comes out of the café, looks at Owen, and goes back for a telephone. Owen gets the two into his bus, and the grey bus pulls away east with the others.

      "Two," Owen says. "That's two." He sounds as if he's trying to make it enough. He drives you out to the turn-off for the dry lake and lets you down there, and takes his two home.
    choices:
      - text: "Walk the last mile to the dish."
        to: 319

  303:
    title: Freed
    effects: [{note: FREED}]
    text: |
      You go seat by seat. Owen tells them his name, what was in the tabs, and that it's all right to take the headphones off. You tell them the day of the week.

      One by one they come down the steps into the sun, squinting, holding hands. A girl in a Helion sweatshirt sits down in the dirt and laughs until she cries.

      The driver comes out of the café and finds an empty bus. Owen stays with the listeners. He presses the keys of his bus into your hand. "Go," he tells you. "Go on. I've got them."
    choices:
      - text: "Drive the last miles to the dish."
        to: 319

  # --- Ruiz's cruiser (the Straight World) -----------------------------------------------------------------------

  304:
    title: Ruiz Drives
    effects:
      - note: CRUISER
    text: |
      Ruiz drives the black-and-white Plymouth Fury that smells of cigarettes and Juicy Fruit. He keeps it at seventy-five and doesn't use the siren.

      "I'm eighty miles out of my jurisdiction," he says, past Victorville, "on my own time, chasing a radio telescope. My wife thinks I'm fishing."

      In Barstow he pulls into a Union 76 for gas and two coffees.
    choices:
      - text: "Go in with him."
        to: 305

  305:
    title: Barstow
    text: |
      The attendant is a boy in a paper hat. "Fill-up's paid," he tells Ruiz. "Lady called it in at six."

      He holds out a slip of paper with your name on it, spelled right, and an envelope. Ruiz looks at the slip a long time.

      "I've been a cop twenty-two years," he says. "I don't like this. I don't like it at all."
    choices:
      - text: "Take what's waiting for you."
        requires: {no_item: helion-badge}
        to: 306
      - text: "Take what's waiting for you."
        requires: {item: helion-badge}
        to: 307
      - text: "Insist on paying for the gas."
        requires: {no_note: SNAG}
        effects: [{note: SNAG}, {luck: -5}]
        to: 308
      - text: "Insist on paying for the gas."
        requires: [{note: SNAG}, {no_note: SNAG2}]
        effects: [{note: SNAG2}, {luck: -5}, {hp: "-1"}]
        to: 308
      - text: "Insist on paying for the gas."
        requires: {note: SNAG2}
        to: 286

  306:
    title: The Envelope
    effects: [{gain: helion-badge}]
    text: |
      Inside is a laminated Helion pass with Leonard Voss's photograph on it, cleared for "Site SW". On the back, in pencil: *spare*.

      Ruiz turns it over twice and hands it back. "I didn't see that," he says. "Drink your coffee."
    choices:
      - text: "Drive on to the dish."
        to: 309

  307:
    title: A Popsicle Stick
    effects: [{note: EQUINOX}]
    text: |
      The envelope holds one Popsicle stick. On it, in ballpoint: *4:56*.

      Ruiz reads it over your shoulder. "Four fifty-six what?" he says, and then, seeing your face: "Don't tell me."
    choices:
      - text: "Drive on to the dish."
        to: 309

  308:
    title: Paid
    effects: [{note: TAILED}]
    text: |
      You make the boy take your money, and Ruiz's. The Fury needs three tries to start.

      A grey Plymouth pulls out of the motel lot across the road a quarter mile behind you, and stays there. Ruiz watches it in the mirror all the way to Amboy and says nothing, which is worse.
    extra:
      - requires: {note: SNAG2}
        text: The sky over the road has gone flat and colourless, like a photograph of a sky.
      - text: The coffee is cold by Ludlow.
    choices:
      - text: "Drive on to the dish."
        to: 309

  309:
    title: No Jurisdiction
    text: |
      Ruiz drives up to the front gate with his siren going, and gets out with his badge held high.

      "Los Angeles Police Department. I'm looking for a missing person, Leonard Voss."

      "You're a hundred and sixty miles from Los Angeles," says the guard. Then a man in a grey suit walks out from the hut, squinting, with a kind smile. "Hollis Calloway, Helion security," he says, and looks at Ruiz, and at you.

      "Let the detective in. The sergeant can wait in his car. Dr. Marrow won't mind an audience."
    choices:
      - text: "Show Calloway the rider here, at the gate."
        requires: {any: [{note: MOTIVE}, {item: claim-file}]}
        effects: [{note: TURNED}]
        to: 310
      - text: "Go in, and leave Ruiz arguing at the gate."
        to: 328

  310:
    title: The Rider
    text: |
      You tell him there, in the sun, with the guard listening: half a million on Leonard Voss, paid double if he dies before tomorrow.

      Calloway's smile goes. He was Army CID for ten years. You watch him do the arithmetic, and not like the answer.

      "She told me we were keeping him safe," he says quietly. "Come inside. Stay close to me."
    choices:
      - text: "Follow him into the hut."
        to: 328

  # --- Your own car (the Straight World, resisted) -------------------------------------------------------------

  311:
    title: Your Own Car
    text: |
      Your own car, your own map, your own way east, the way a sensible person would go.

      It runs fine through San Bernardino. It runs worse up the long grade into the Cajon Pass. The temperature needle climbs, and the hood begins to breathe steam.
    choices:
      - text: "Pull over before it blows."
        to: 312

  312:
    title: Cajon Pass
    effects: [{hp: -1}]
    text: |
      It blows anyway. You burn your hand on the radiator cap and sit on the guardrail while trucks shake the road.

      After an hour, a station wagon the colour of an orange pulls onto the shoulder. The girl at the wheel is peeling one. She leans across and opens the passenger door.

      "You'd have picked me up," she says. "Fair's fair."
    choices:
      - text: "Get in."
        to: 313

  313:
    title: The Orange
    text: |
      She drives the way the truck does, as if the road were downhill all the way. Barstow, Ludlow, Amboy go by like stations on a radio.

      Past Amboy she turns off onto a dirt track and stops by a chain-link fence. Beyond it, on the salt, stands something white and enormous.

      She takes a square of blotter paper from the orange peel. "For when you need to say yes."
    choices:
      - text: "Take the tab she offers."
        requires: {no_item: tab}
        effects: [{gain: tab}]
        to: 319
      - text: "Thank her, and get out at the fence."
        to: 319

  # --- Helion's Side ------------------------------------------------------------------------------------------------

  314:
    title: With the Technicians
    effects: [{note: HUT}]
    text: |
      The technicians' van leaves the hangar at nine, with you in the back in grey coveralls, between a man named Phil and a box of vacuum tubes.

      They talk about their kids, the Dodgers, and how Dr. Marrow hasn't slept since Tuesday. Nobody looks at your face.

      At the dish, the guard waves the van through. You spend the afternoon carrying cable in the hut, setting out folding chairs, and learning where everything is.
    extra:
      - requires: {note: DECOY}
        text: |
          Phil swears at the console all afternoon. "Voss's settings don't take," he says. "She's had us put them in four times."
      - text: At half past four, Dr. Marrow's Lincoln pulls up outside.
    choices:
      - text: "Keep your head down, and your hands busy."
        to: 328

  315:
    title: Out of the Crates
    text: |
      The helicopter sets down on the salt at eight in the morning in a blizzard of dust. You wait until the crew has gone into the hut for coffee, then slide out between the crates.

      You spend the day in the shade of the transformer yard, with no water and the hum of the dish in your teeth. By half past four, you can't sit still any longer.

      The dish's ladder goes up its white back, ninety feet, to the rim.
    choices:
      - text: "Start climbing."
        to: 333

  316:
    title: The Helicopter
    effects: [{note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}, {lose: hut-keys}]
    text: |
      They search you, and take anything that shoots or opens a lock. Then they put you in the back of a Helion helicopter with your wrists cuffed in front of you.

      Los Angeles tips away underneath, and then the mountains, and then the brown, endless desert. A man in a grey suit sits across from you with his knees almost touching yours: Hollis Calloway, Helion's head of security. He offers you a stick of gum.

      "Nobody's going to hurt you," he says, as if he believes it.
    choices:
      - text: "Talk to him."
        to: 317

  317:
    title: Calloway in the Air
    text: |
      "I've known Leonard eight years," Calloway says over the rotors.
    extra:
      - requires: {no_note: TAKEN}
        text: '"Dr. Marrow wants him found so he can''t hurt himself. That''s all this is. When it''s over, you go home."'
      - requires: {note: TAKEN}
        text: '"We have Leonard now. He''s safe. Dr. Marrow just wants him where he can''t hurt himself. When it''s over, you go home."'
      - text: He means it. You can see that he means it. Below you, a white dish slides into view on a dry lake, like a coin dropped in sand.
    choices:
      - text: "Tell him what Helion's policy pays if Leonard dies."
        requires: {any: [{note: MOTIVE}, {item: claim-file}]}
        effects: [{note: TURNED}, {unnote: CAPTIVE}]
        to: 318
      - text: "Say nothing, and chew the gum."
        to: 328

  318:
    title: Arithmetic
    text: |
      You shout it over the noise. Half a million dollars. Double, if Leonard is dead before tomorrow.

      Calloway doesn't believe you, and then, slowly, he does. He looks out of the window at the dish for a long time.

      Before they land, he unlocks your cuffs and puts them in his pocket. "Stay close to me," he says. "Don't do anything I have to see."
    choices:
      - text: "Climb down onto the salt with him."
        to: 328

  # --- The approach -----------------------------------------------------------------------------------------------

  319:
    title: Sweetwater Dry Lake
    text: |
      The dry lake is a mile of white salt, flat as a plate, shimmering at the edges. In the middle of it stands the Ear: a white dish ninety feet across, tipped to the sky. A cinderblock hut squats at its foot.

      A chain-link fence runs round the whole of it. There's a guard shack at the front gate, a padlocked back gate on the far side, and a transformer yard humming behind the hut.
    extra:
      - requires: {note: EAST}
        text: You know it. You have seen it before, small and impossible and far away, and here it is at full size.
      - requires: {note: VAN}
        text: Bix parks the van behind a dune at the turn-off. "I'll keep her running, man."
      - requires: {note: EARLY}
        text: There's no car by the hut yet. The guards are playing cards in the shade of the shack.
      - requires: {no_note: EARLY}
        text: Helion's helicopter sits on the salt by the hut. People in grey coveralls hurry in and out.
      - text: |
          Over on the far side, a small grey gate in the fence stands open. Nobody is near it.
      - requires: {note: GREY}
        text: It makes no sound in the wind. You know what makes things like that.
    choices:
      - text: "Walk up to the front gate with Voss's pass."
        requires: {item: helion-badge}
        to: 320
      - text: "Badge the guard at the front gate."
        requires: [{item: badge}, {note: ROSTER}]
        roll: {skill: [Intimidate, Fast Talk], bonus: 1, success: 321, failure: 325}
      - text: "Badge the guard at the front gate."
        requires: [{item: badge}, {no_note: ROSTER}]
        roll: {skill: [Intimidate, Fast Talk], success: 321, failure: 325}
      - text: "Tell the guard you're from the company that insures every bolt in here."
        requires: {skill: Credit Rating, min: 50}
        roll: {skill: Credit Rating, success: 321, failure: 325}
      - text: "Walk up to the gate in your Helion coveralls, with Fred's badge."
        requires: {item: overalls}
        roll: {skill: [Fast Talk, Stealth], success: 321, failure: 325}
      - text: "Pick the padlock on the back gate."
        requires: {item: lockpicks}
        roll: {skill: Locksmith, success: 326, failure: 325}
      - text: "Let yourself in at the back gate with Leonard's keys."
        requires: {item: hut-keys}
        to: 326
      - text: "Walk to where the fence has a gap in it."
        requires: {any: [{item: painting}, {note: GAP}]}
        to: 322
      - text: "Rush the front gate. There are only four guards."
        to: 371
      - text: "Climb the fence at the far side."
        roll: {skill: [Climb, STR], success: 326, failure: 323}
      - text: "Slip through the little side gate that's standing open."
        to: 324

  371:
    title: Four Guards
    effects: [{hp: "-11"}]
    text: |
      Four guards, and two of them have rifles, and they've been bored all day.

      You get as far as the shack. The first shot spins you round. The second puts you on the salt, looking up at a hard white sky, and very far away somebody is shouting at them to stop.
    choices:
      - text: "Let them carry you in."
        to: 325

  320:
    title: Voss's Face
    text: |
      The guard looks at the pass, at Voss's photograph, and at you. Then he looks at a list taped inside his shack.
    choices:
      - text: "Smile, and wait."
        requires: {no_note: TAILED}
        to: 321
      - text: "Smile, and wait."
        requires: {note: TAILED}
        to: 325

  321:
    title: Through the Front Gate
    text: |
      The guard lifts the bar and waves you through, already looking at the next thing.

      Inside the fence, the salt is printed with tyre tracks and cable runs. You walk as if you belong, which is most of what belonging is.
    choices:
      - text: "Walk on, towards the dish."
        to: 326

  322:
    title: The Gap
    extra:
      - requires: {any: [{note: AGNES}, {item: painting}]}
        before: true
        text: It's exactly where Agnes painted it.
      - requires: [{no_note: AGNES}, {no_item: painting}]
        before: true
        text: It's exactly where you saw it through the telescope, small and impossible.
      - text: You'd swear it wasn't there a minute ago. You step through, and the salt on the other side is warm, the way the boardwalk is warm at sundown.
    text: |
      A stretch of chain-link where the wire has been peeled back from the post, as neatly as the corner of a page.
    choices:
      - text: "Walk towards the dish."
        to: 326

  323:
    title: Wire
    effects: [{hp: "-1D3"}]
    text: |
      Halfway up, your sleeve catches on the top wire. You come down hard on the wrong side, with your shoulder on fire and the fence still singing.

      When you look up, two guards are standing over you with their rifles slung, looking more tired than angry.
    choices:
      - text: "Go with them."
        to: 325

  324:
    title: The Grey Gate
    effects: [{luck: -5}]
    text: |
      Halfway to the gate, you notice the quiet.

      No hum from the wire, no wind, no tune. The gate is grey, the post is grey, and the salt round it is the grey of an old photograph. It smells of nothing at all. Nothing in this city has been silent for three days, and this is a desert, and still it's the quietest thing you've ever stood next to.

      You're through it before you've decided. On the other side, two guards are waiting, as if they had an appointment.
    choices:
      - text: "Go with them."
        to: 325

  325:
    title: Caught
    effects: [{note: CAPTIVE}, {lose: revolver}, {lose: lockpicks}]
    text: |
      They search you, take anything that shoots or picks a lock, and take you across the salt to the hut.

      A man in a grey suit meets you at the door: Calloway, Helion's head of security, with a kind voice. He looks genuinely sorry about it. "You couldn't just stay home," he says, and cuffs one of your wrists to a water pipe inside the door.
    choices:
      - text: "Look around the hut."
        to: 328

  326:
    title: The Yard
    text: |
      Up close, the dish is enormous: white steel ribs, a lattice of struts, a ladder bolted up its back to the rim ninety feet over your head.

      As you watch, it moves. With a deep, patient whine of motors, the whole dish swings round to face the west, towards Los Angeles, and stops.
    extra:
      - requires: {note: EARLY}
        text: The hut at its foot is dark. Nobody has come yet.
      - requires: {no_note: EARLY}
        text: The hut's door stands ajar. Somebody inside is counting backwards.
      - text: Out here, the hum of the dish is in your teeth.
    choices:
      - text: "Go into the hut."
        to: 328
      - text: "Climb the ladder up the back of the dish."
        to: 333
      - text: "The hut's empty. Get in before anyone comes."
        requires: {note: EARLY}
        to: 327

  327:
    title: Nobody Home Yet
    text: |
      The hut is cool and dim and full of humming: a long grey console, a wall of meters, a rack of patch cables where the dish's feed comes in. A clock on the wall says ten past one.

      A row of empty recliners, each with its own pair of headphones, faces the console like a cinema.

      Out on the road, a long way off, a plume of dust. It will be a black Lincoln.
    choices:
      - text: "Thread your reel into the feed rack, and hide it behind the panel."
        requires: {item: tape}
        effects: [{note: PRIMED}]
        to: 328
      - text: "Lock the back door from inside with Leonard's key."
        requires: {item: hut-keys}
        effects: [{note: LOCKED}]
        to: 328
      - text: "Find a corner behind the meters, and wait."
        to: 328

  # --- The hut ----------------------------------------------------------------------------------------------------

  328:
    title: The Hut
    effects: [{note: HUT}]
    text: |
      By half past four the hut is full. Three technicians at the meters. Calloway, Helion's grey-suited head of security, by the door with his hands folded, and a holster under his jacket. And at the console, with her reading glasses on a chain, Dr. Edith Marrow: fifty-eight, grey-haired, tired, and absolutely certain.

      Whichever way you came in, you're in.
    extra:
      - requires: [{note: EARLY}, {no_note: CAPTIVE}]
        before: true
        text: You wait in the dark behind the meters for three hours. When they come in, nobody looks into your corner.
      - requires: [{note: CAPTIVE}]
        text: You're cuffed to a water pipe by the door, close enough to smell Calloway's aftershave.
      - requires: [{note: CAPTIVE}, {item: tape}]
        text: Your reel sits on the console, where Calloway set it down for her. She hasn't looked at it.
      - requires: [{no_note: EARLY}, {no_note: CAPTIVE}, {no_note: TURNED}, {no_item: overalls}]
        text: Calloway watched you come in, and let you. "Stand by the door, where I can see you," he said.
      - requires: [{item: overalls}, {no_note: CAPTIVE}, {no_note: EARLY}]
        text: Nobody looks twice at another pair of grey coveralls.
      - requires: {note: TURNED}
        text: Calloway stands a little apart from Marrow now, and keeps you in the corner of his eye.
      - requires: {note: TAKEN}
        text: |
          On a gurney against the wall lies a young man with Leonard Voss's face and wires taped to his temples, smiling in his sleep.
      - requires: {no_note: BURNED}
        text: Along the back wall, in a row of recliners, a dozen listeners in headphones lie smiling at the ceiling.
      - requires: {note: BURNED}
        text: The recliners along the back wall are mostly empty. Somebody in Topanga burned her supply.
      - requires: [{note: LISTENERS}, {no_note: BURNED}]
        text: You know what they were promised. Quiet. Some of them will never come back up to get it.
      - requires: {note: FREED}
        text: Marrow keeps asking where the Amboy bus is. Nobody can tell her.
      - requires: [{note: UNPLUGGED}, {no_note: BURNED}]
        text: A technician is crawling along the recliners, frowning at the headphone jacks. "They seated fine in El Segundo," he keeps saying.
      - requires: {note: CRUISER}
        text: Out at the gate, Ruiz is still arguing jurisdiction with the guards, loudly.
      - text: The clock on the wall says 4:31.
    choices:
      - text: "Tell Calloway what Helion's policy pays if Leonard dies."
        requires: [{any: [{note: MOTIVE}, {item: claim-file}]}, {no_note: TURNED}, {no_note: SIGNED}]
        to: 329
      - text: "Tell Calloway who signed the double-indemnity rider."
        requires: [{note: SIGNED}, {no_note: TURNED}]
        to: 329
      - text: "Say the word LULLABY to the technicians, and what it's for."
        requires: {note: LULLABY}
        to: 330
      - text: "Ask Marrow what she's going to make it dream."
        to: 331

  329:
    title: Calloway
    effects: [{note: TURNED}]
    text: |
      You say it so everyone can hear: half a million dollars on Leonard Voss, double if he's dead before tomorrow.

      Calloway turns his head slowly and looks at Marrow. She doesn't look up from her settings.

      "It's a standard rider, Hollis," she says.
    extra:
      - requires: {note: SIGNED}
        text: |
          "You signed it yourself," you say. "In green ink." Calloway has seen her green ink on every memo for eight years. He closes his eyes.
      - requires: {note: CAPTIVE}
        text: He walks over, takes out his key, and unlocks your cuff without a word.
      - text: |
          "I was keeping him safe," Calloway says, to nobody. Then he moves, very casually, to stand between you and the guards.
    choices:
      - text: "Wait for the hinge."
        effects: [{unnote: CAPTIVE}]
        to: 338

  330:
    title: The Technicians
    effects: [{note: WAVER}]
    text: |
      "LULLABY," you say to the three of them. "She's going to talk into the dream that runs Los Angeles, and tell it what to be. Your kids live in Los Angeles."

      The oldest of them stops with a patch cable in his hand. The youngest looks at the smiling people in the recliners and doesn't look away.

      "Back to work," Marrow says, gently. They go back to work, slower than before.
    choices:
      - text: "Wait for the hinge."
        to: 338

  331:
    title: Her Dream
    text: |
      Marrow takes off her glasses.

      "Watts, detective. Berkeley. Chicago. A boy with a rifle in a tower. The city's dreaming, and it's dreaming everything at once." She looks almost tender. "I'm going to give it a good night's sleep. Calm campuses. People who believe the evening news. Who could be unhappy in a dream like that?"

      "Everybody," says somebody, and it might have been you.
    choices:
      - text: "Tell her you've walked in the gold city, and what it really is."
        requires: {note: GOLD}
        to: 332
      - text: "Let her get back to her console."
        to: 338

  332:
    title: Afraid of It
    effects: [{note: SHAKEN}]
    text: |
      You tell her about the towers of light over downtown, and the freeways running like rivers.

      Her hands stop on the console. "I've seen it," she says, very low. "Through the headphones. In June." For a moment she looks seventy, and frightened. "It's so big. Something that big needs somebody to tell it no."

      She puts her glasses back on. Her hands are shaking.
    choices:
      - text: "Wait for the hinge."
        to: 338

  # --- The dish ---------------------------------------------------------------------------------------------------

  333:
    title: The Ladder
    text: |
      The ladder goes up the white back of the dish in a long curve, ninety feet of rungs too hot to hold for long.

      Below you the salt goes white and huge. The wind up here has a voice, and it's humming the tune.
    choices:
      - text: "Climb."
        roll: {skill: [Climb, STR], success: 335, failure: 334}

  334:
    title: The Fall
    effects: [{hp: "-1D6"}]
    text: |
      A rung turns in your hand. You drop, and slam down onto a cross-strut fifteen feet below with all the air knocked out of you.

      You lie there until the sky stops ringing. Then you climb again, slowly, one rung and then the next.
    choices:
      - text: "Keep going, to the top."
        to: 335

  335:
    title: The Rim
    effects: [{note: DISH}]
    text: |
      You're on the rim of the dish, with the great white bowl curving away below you like the inside of a seashell. At its centre, on three steel legs, the feed horn points at the western sky.

      The salt is a white tablecloth a long way down. The hut is a matchbox. Nobody down there is looking up.

      You wait. The sun crawls west. By twenty to five, the sky over the salt is turning the colour of apricots.
    choices:
      - text: "Hold on, and wait for 4:56."
        to: 343
      - text: "Smoke the joint while you wait. You've earned it."
        requires: {item: joint}
        effects: [{lose: joint}, {san: "+1D6"}]
        to: 343

  # --- The salt ---------------------------------------------------------------------------------------------------

  336:
    title: The Salt
    effects: [{note: SALT}]
    text: |
      You climb down from the truck into the shadow of the dish. The salt crunches like sugar. Out here it's very quiet, apart from the tune, which hasn't stopped since Los Angeles.

      The guards don't come near the truck. The people hurrying in and out of the hut don't look at it.

      The Ice-Cream Man hands you a Popsicle, orange, and sits on the running board to wait. You wait with him, for hours, and the Popsicle never melts.
    choices:
      - text: "Eat the Popsicle, and wait for 4:56."
        effects: [{san: "+1D3"}]
        to: 345
      - text: "Smoke the joint while you wait."
        requires: {item: joint}
        effects: [{lose: joint}, {san: "+1D6"}]
        to: 345
      - text: "Ask him what it wants."
        requires: {no_note: LASTBAR}
        to: 337

  # --- 4:56 -------------------------------------------------------------------------------------------------------

  337:
    title: Three Words
    effects:
      - note: LASTBAR
      - san: "1/1D4"
    text: |
      He thinks about it for a long time. Then he takes the Popsicle stick out of his mouth.

      "Hear it whole," he says.

      He hums the tune, all of it, and then one bar more, the bar the tape doesn't have. It is so simple you could cry. You will never be able to forget it, and you're not sure you want to.
    choices:
      - text: "Wait with him for 4:56."
        to: 345

  338:
    title: 4:55, the Hut
    effects:
      - san: "1D8/1D12"
    text: |
      Through the hut's slit window, the sky goes gold.

      Not sunset gold: everywhere at once, the whole sky lit from inside. The meters swing hard over. The listeners in the recliners sigh together. Something enormous has come out across the desert from Los Angeles, and it's listening, and it's about to hear the first thing anyone says to it.

      Marrow puts her hand on the switch.
    extra:
      - requires: {note: WAVER}
        text: The technicians are slow to call out their readings. The oldest of them keeps dropping his cable.
      - requires: {note: SHAKEN}
        text: Marrow's hand is trembling on the switch.
      - requires: {note: DECOY}
        text: Leonard's settings still won't take. She's entering them by hand, swearing softly.
      - requires: {note: TAKEN}
        text: On the gurney, the young man with Leonard's face opens his eyes and looks straight at you.
      - requires: {note: LOCKED}
        text: Somebody is rattling the locked back door. The guards outside can't get in.
      - requires: {note: FORESEEN}
        text: This is where the drive-in reel ran out.
      - requires: {note: SNAG2}
        text: The gold seems to go cold whenever it touches you.
      - text: The clock says forty seconds.
    choices:
      - text: "Slide out the reel you hid, and switch it into the feed."
        requires: [{item: tape}, {no_note: CAPTIVE}, {note: PRIMED}]
        roll: {skill: [Electrical Repair, Mechanical Repair], bonus: 1, success: 348, failure: 340}
      - text: "Thread the Sweetwater reel into the feed, and play it at 4:56."
        requires: [{item: tape}, {no_note: CAPTIVE}, {no_note: PRIMED}, {any: [{note: EQUINOX}, {item: notebook}]}]
        roll: {skill: [Electrical Repair, Mechanical Repair], success: 348, failure: 340}
      - text: "Thread the Sweetwater reel into the feed, and play it at 4:56."
        requires: [{item: tape}, {no_note: CAPTIVE}, {no_note: PRIMED}, {no_note: EQUINOX}, {no_item: notebook}]
        roll: {skill: [Electrical Repair, Mechanical Repair], difficulty: hard, success: 348, failure: 340}
      - text: "Hold your transistor to the feed microphone, and find KSUN."
        requires: [{item: transistor}, {note: LARK}, {no_note: CAPTIVE}]
        roll: {skill: Listen, success: 348, failure: 341}
      - text: "Lean into the feed microphone, and hum it the missing bar."
        requires: [{note: LASTBAR}, {no_note: CAPTIVE}]
        roll: {skill: Luck, success: 348, failure: 355}
      - text: "Pull the plugs out of the console."
        requires: [{no_note: CAPTIVE}, {any: [{note: TURNED}, {note: LOCKED}, {note: BURNED}, {note: FREED}, {note: UNPLUGGED}, {note: DECOY}, {note: WAVER}, {note: SHAKEN}]}]
        roll: {skill: [STR, Mechanical Repair], bonus: 1, success: 349, failure: 342}
      - text: "Pull the plugs out of the console."
        requires: [{no_note: CAPTIVE}, {no_note: TURNED}, {no_note: LOCKED}, {no_note: BURNED}, {no_note: FREED}, {no_note: UNPLUGGED}, {no_note: DECOY}, {no_note: WAVER}, {no_note: SHAKEN}]
        roll: {skill: [STR, Mechanical Repair], success: 349, failure: 342}
      - text: "Tear the wires off Leonard's temples."
        requires: [{note: TAKEN}, {no_note: CAPTIVE}]
        to: 349
      - text: "Shoot the console."
        requires: [{item: revolver}, {no_note: CAPTIVE}]
        to: 349
      - text: "Work your hand out of the cuff."
        requires: [{note: CAPTIVE}, {no_note: SNAG2}]
        roll: {skill: Luck, success: 339, failure: 355}
      - text: "Work your hand out of the cuff."
        requires: [{note: CAPTIVE}, {note: SNAG2}]
        roll: {skill: Luck, bonus: -1, success: 339, failure: 355}
      - text: "Put the Daybreak tab on your tongue, and let it take you."
        requires: {item: tab}
        effects: [{lose: tab}]
        to: 367
      - text: "Go for the gun under Calloway's jacket."
        requires: [{no_note: CAPTIVE}, {no_note: TURNED}]
        to: 372
      - text: "Walk out of the hut with what you know, while you still can."
        requires: {no_note: CAPTIVE}
        to: 347
      - text: "Stand back, and let the professionals work."
        to: 355

  372:
    title: Calloway's Gun
    effects: [{hp: "-9"}]
    text: |
      You get a hand on it. Calloway is forty-five, and soft-spoken, and he was Army CID, and he takes it back from you as if you'd asked to borrow it. Then the guard at the door shoots you. It goes straight through, and somebody ties a field dressing on you without being asked.

      You lie on the cinderblock floor with your cheek in the dust. Above you, Marrow's hand closes on the switch.
    choices:
      - text: "Listen."
        to: 355

  339:
    title: Free
    effects: [{unnote: CAPTIVE}]
    text: |
      You fold your thumb against your palm until something in your hand gives, and the cuff slides off over your knuckles.

      Nobody is looking at you. Everybody is looking at the sky.
    choices:
      - text: "Snatch your reel off the console, and thread it into the feed."
        requires: {item: tape}
        roll: {skill: [Electrical Repair, Mechanical Repair], difficulty: hard, success: 348, failure: 340}
      - text: "Rip the plugs out of the console."
        roll: {skill: [STR, Mechanical Repair], success: 349, failure: 342}
      - text: "Tear the wires off Leonard's temples."
        requires: {note: TAKEN}
        to: 349
      - text: "Run for the door."
        to: 347

  340:
    title: The Reel Jams
    text: |
      The reel turns once and catches. Tape spills out of the guide in a brown, glittering loop, and the hum from the speaker stutters.

      If it tears now, it'll take the feed with it. Marrow is shouting. Overhead, the whole gold sky seems to lean closer, waiting.
    choices:
      - text: "Thumb the reel round by hand, and pray."
        requires: {no_note: SNAG2}
        roll: {skill: Luck, success: 348, failure: 349}
      - text: "Thumb the reel round by hand, and pray."
        requires: {note: SNAG2}
        roll: {skill: Luck, bonus: -1, success: 348, failure: 349}

  341:
    title: The Signal Slips
    text: |
      For a second you have him: Larry Lark's velvet voice, a hundred and fifty miles away, saying *this one goes out to everybody*. Then the station slides away under a wash of static and Mexican mariachi.

    extra:
      - requires: {note: HUT}
        text: You hold the transistor to the feed microphone with both hands, as if that would help.
      - requires: {note: SALT}
        text: You lean in through the truck's window and wrench the dial back and forth.
      - text: The tune is in there somewhere, under the static.
    choices:
      - text: "Hold it there, and hope."
        requires: {no_note: SNAG2}
        roll: {skill: Luck, success: 348, failure: 355}
      - text: "Hold it there, and hope."
        requires: {note: SNAG2}
        roll: {skill: Luck, bonus: -1, success: 348, failure: 355}

  342:
    title: Thrown
    effects: [{hp: "-1D6"}]
    text: |
      The cable you grab is live. There's a white bang, a smell of hot copper, and you're on the floor across the hut, with your arm full of bees and the ceiling going round.

      Somebody kneels on your back. Above you, Marrow's hand goes to the switch.

      By your foot is the junction box, with its cover hanging off.
    choices:
      - text: "Kick the junction box as hard as you can."
        roll: {skill: Luck, success: 349, failure: 355}
      - text: "Lie still, and listen."
        to: 355

  343:
    title: 4:55, the Dish
    effects:
      - san: "1D8/1D12"
    text: |
      The sky goes gold, all of it at once, lit from inside.

      Then it comes. Out of the west, across a hundred and fifty miles of desert, something vast and bright and gentle comes down out of the sky towards the feed horn, the way a bird comes down to a hand. It is every best night anyone in Los Angeles ever had. It's listening.

      Down in the hut, a voice it has never heard is getting ready to speak.
    extra:
      - requires: {note: FORESEEN}
        text: This is where the drive-in reel ran out.
      - requires: {note: SNAG2}
        text: Where it touches you, the gold goes cold.
      - text: The feed horn is ten feet away, on its three steel legs. Its cables run down one of them.
    choices:
      - text: "Climb out to the horn, and sing it the missing bar."
        requires: {note: LASTBAR}
        to: 348
      - text: "Climb out to the horn, and rip out its cables."
        roll: {skill: [STR, Mechanical Repair], success: 349, failure: 344}
      - text: "Put the Daybreak tab on your tongue up here, and let it take you."
        requires: {item: tab}
        effects: [{lose: tab}]
        to: 367
      - text: "Let go of the rail, open your arms, and let it all in."
        to: 346
      - text: "Shoot at the thing in the sky."
        requires: {item: revolver}
        to: 359
      - text: "Hold on tight, and watch."
        to: 355

  344:
    title: The Horn
    effects: [{hp: "-1D6"}]
    text: |
      You're halfway out along the strut when the horn comes alive under your hands, with a sound like every radio in the world tuned to the same station. It throws you.

      You slide down the white bowl of the dish, fingernails squealing, and fetch up against a rib at the bottom, bloody and half deaf.

      Far below, the voice from the hut begins to speak. Above you, one cable you tore half loose hangs down from the horn, swinging.
    choices:
      - text: "Jump for the cable, and hang on it with all your weight."
        roll: {skill: [Climb, STR], success: 349, failure: 355}
      - text: "Lie still, and listen."
        to: 355

  345:
    title: 4:55, the Salt
    effects:
      - san: "1D8/1D12"
    text: |
      The sky goes gold, everywhere at once.

      Out of the west, across the desert, something vast comes walking. It has no shape, or every shape: a city of light, a woman's face, a wave about to break. It stops over the salt and stands there, enormous and patient, tilted towards the dish the way you tilt your head to hear.

      The Ice-Cream Man stands up and brushes off his knees. "Now," he says.
    extra:
      - requires: {note: DREAMT}
        text: It knows your face. You can feel it knowing.
      - requires: {note: FORESEEN}
        text: This is where the drive-in reel ran out.
      - requires: {note: SNAG2}
        text: Where it touches you, the gold goes cold.
      - text: In the hut, a voice it has never heard is getting ready to speak.
    choices:
      - text: "Give the Ice-Cream Man your reel."
        requires: {item: tape}
        effects: [{lose: tape}]
        to: 348
      - text: "Turn the truck's radio up to KSUN, as loud as it goes."
        requires: [{note: LARK}, {no_note: SNAG2}]
        roll: {skill: Luck, success: 348, failure: 341}
      - text: "Turn the truck's radio up to KSUN, as loud as it goes."
        requires: [{note: LARK}, {note: SNAG2}]
        roll: {skill: Luck, bonus: -1, success: 348, failure: 341}
      - text: "Put the Daybreak tab on your tongue, and let it take you."
        requires: {item: tab}
        effects: [{lose: tab}]
        to: 367
      - text: "Hum it the missing bar, as loud as you can."
        requires: {note: LASTBAR}
        roll: {skill: Luck, success: 348, failure: 346}
      - text: "Walk out onto the salt, open your arms, and let it all in."
        to: 346
      - text: "Shoot at the thing in the sky."
        requires: {item: revolver}
        to: 359
      - text: "Walk back towards the road, and don't look round."
        to: 347
      - text: "Stand by the truck, and let it happen."
        to: 355

  346:
    title: Too Much
    effects: [{san: "-30"}]
    text: |
      It comes into you like the sea into a sandcastle.

      For a moment you are a million people at once, all of them at the best night of their lives, all of them talking. There's just enough of you left to know it's happening. Just.

      Then the gold closes over your head.
    choices:
      - text: "Let it."
        to: 354

  367:
    title: The Last Tab
    effects: [{san: "-30"}]
    text: |
      It tastes of paper and oranges. For a second nothing happens, and then the whole gold sky comes down through the top of your head.

      There's just enough of you left to go with it. Just.
    choices:
      - text: "Go with it."
        to: 354

  347:
    title: Behind You
    effects: [{note: LEFT}]
    text: |
      You walk away from the dish, and you don't look round.

      At 4:56 the light behind you changes. A voice speaks over the desert, calm and kind and a little tired, and you can't make out the words, and you're glad.

    extra:
      - requires: {note: HUT}
        text: Nobody stopped you at the door. Everybody in the hut was looking at the sky.
      - requires: {note: CRUISER}
        text: Ruiz is waiting by the cruiser at the gate. He drives you into Amboy without asking anything.
      - requires: [{note: VAN}, {no_note: CRUISER}]
        text: Bix is waiting at the turn-off with the engine running. He drives you into Amboy without asking anything.
      - requires: [{no_note: VAN}, {no_note: CRUISER}]
        text: You get a lift into Amboy with a Helion technician who has stopped knowing why he came.
      - text: You sit in the motel café until dark, writing everything down on napkins before it goes.
      - text: By Monday, you have forty napkins and a plan.
    choices:
      - text: "Go back to Los Angeles, and tell the world."
        to: 356

  # --- After the hinge --------------------------------------------------------------------------------------------

  348:
    title: The Song Comes Home
    effects: [{note: SANG}]
    text: |
      The tune goes out over the desert. Not Marrow's voice: its own. The hum with the melody inside it, the song a million people fell asleep humming. And at the end, for the first time, the last bar.

      The gold stops. It listens to itself, the way you'd stop in a doorway to hear somebody singing in another room, and find it's you.

      Then, very softly, it laughs. The gold goes out of the sky like a breath let go, and the sky is blue, an ordinary late-afternoon blue. Something has decided to stay a dream.
    extra:
      - requires: {note: HUT}
        text: In the hut, Marrow sits down slowly in her chair, her hand still on the switch she never threw.
      - requires: {note: DISH}
        text: Up on the rim, you're still holding the note when it's over. Your voice gives out.
      - requires: {note: SALT}
        text: The Ice-Cream Man climbs back into his truck. "Good," he says, and drives away across the salt, and isn't there.
      - requires: [{note: TAKEN}, {note: HUT}]
        text: On the gurney, the young man sits up and pulls the wires off his temples. He's forty-six again, and crying.
      - requires: [{note: TAKEN}, {no_note: HUT}]
        text: Down in the hut, the young man on the gurney is sitting up, forty-six again, and crying.
      - text: Somewhere in the hut, the listeners take off their headphones one by one, and ask what day it is.
    choices:
      - text: "Go home, and say nothing."
        to: 350
      - text: "Go back to Los Angeles, and tell the world."
        to: 356

  349:
    title: Static
    effects: [{note: BROKE}]
    text: |
      Sparks. A noise like a train braking. Every speaker on the salt screams once and goes to static.

      The gold in the sky flinches, the way a hand flinches from a stove. You feel it turn away, hurt and puzzled. Then it draws back west across the desert, slow and dimming, back towards a city that will wake up tomorrow and feel a little less lucky, and not know why.

      Marrow's broadcast never goes out. Neither does anything else.
    extra:
      - requires: {note: HUT}
        text: Marrow stares at her dead console, her lips moving. She is doing arithmetic.
      - requires: {note: DISH}
        text: Up on the rim, with the dead cables in your fists, you watch the gold go out of the sky.
      - requires: [{note: TAKEN}, {note: HUT}]
        text: On the gurney, the young man opens his eyes, and he is forty-six, grey at the temples, and himself.
      - requires: [{note: TAKEN}, {no_note: HUT}]
        text: Down in the hut, the young man on the gurney opens his eyes, and he is forty-six, grey at the temples, and himself.
      - text: By the time it's over, the sky is an ordinary evening blue.
    choices:
      - text: "Go home."
        to: 353
      - text: "Go back to Los Angeles, and tell the world."
        to: 356

  350:
    title: Saturday Morning
    text: |
      You get back to Los Angeles after midnight, and sleep until ten.

      Saturday is warm and clear. The radio plays ordinary songs. Someone lets you into traffic on Lincoln Boulevard. A man at a bus stop is laughing at nothing, and so, for a moment, are you.

      There's one more thing to do, if you want to do it.
    choices:
      - text: "Drive up to Altadena."
        requires: {any: [{note: MESSAGE}, {note: MARIAN}, {note: TAKEN}]}
        to: 351
      - text: "Go down to the beach."
        to: 352

  # --- Endings ----------------------------------------------------------------------------------------------------

  351:
    title: The Message Delivered
    ending: triumph
    text: |
      The pool at the Voss house has gone green, and the cat is asleep on the step.

      Marian opens the door before you knock.
    extra:
      - requires: {note: HOME}
        text: |
          Leonard is in his chair in the study, in his dressing gown, forty-six years old and grey at the temples. He wakes when he likes now, and sleeps when he likes. He gets up to shake your hand, and holds it.
      - requires: {note: TAKEN}
        text: |
          Leonard is beside you on the step. He slept on your couch last night, and wanted to be the first thing she saw. Marian doesn't say anything for a long time.
      - requires: [{no_note: HOME}, {no_note: TAKEN}]
        text: |
          "Camarillo telephoned at six," she says. "A man woke up on Ward 9 and asked for me by name." Her car keys are already in her hand.
      - requires: [{note: MESSAGE}, {no_note: MARIAN}]
        text: You give her the message he gave you. She has to sit down on the step to hear it, and the cat climbs into her lap.
      - requires: [{no_note: HOME}, {no_note: TAKEN}]
        text: You drive her up the 101 yourself. She hums the whole way, a tune you almost know, and on Ward 9 a man sits up to hold his wife's hand.
      - requires: {any: [{note: HOME}, {note: TAKEN}]}
        text: |
          She pays you in full, and then some, and asks you to stay for lunch. You stay, for a tuna sandwich and somebody humming in the kitchen, a tune you almost know.
      - text: Some cases end with a body. This one doesn't.

  352:
    title: Saturday
    ending: triumph
    text: |
      Venice beach at noon. The surf is small and clean, coming in threes.

      Nobody on the beach remembers Thursday night exactly. A lot of them are smiling as if they did. Los Angeles has woken up a little kinder, the way you do after a dream you can't remember but know was good. It won't last forever. It'll last a while.
    extra:
      - requires: {note: HOME}
        text: In Altadena, Leonard Voss is awake in his own house, and staying that way.
      - requires: {note: TAKEN}
        text: Leonard Voss is home in Altadena. Two Helion technicians drove him there on Friday night, very apologetically.
      - requires: [{no_note: HOME}, {no_note: TAKEN}]
        text: At Camarillo State Hospital, a John Doe wakes up for good, and asks for his wife by name.
      - requires: {note: BIX}
        text: Bix is out past the break, reading the sets. He waves.
      - requires: {note: OWEN}
        text: Owen Starling has poured the last of his chemistry down a Topanga drain. He says he's going to grow tomatoes.
      - requires: {note: AGNES}
        text: Agnes Pike paints a plain blue sky, for the first time since 1967, and sends you the canvas.
      - requires: {note: CRUISER}
        text: Ruiz goes fishing, for real this time.
      - requires: [{note: RUIZ}, {no_note: CRUISER}]
        text: Ruiz goes fishing.
      - requires: {note: SOL}
        text: You telephone Sol Vance and tell him how it ends. He says he'll never get it past the studio.
      - requires: {note: STALLED}
        text: Golden Shield never pays Helion a cent.
      - text: |
          Somewhere along the boardwalk, an ice-cream truck is playing a tune. You don't go looking for it. You know it knows where you are.

  353:
    title: The Decade Goes On
    ending: bittersweet
    text: |
      Helion's broadcast never goes out. The project is quietly cancelled in April, and the Ear is sold for scrap in 1971.

      The dream doesn't die. It just gets smaller, and further away. The parking spaces stop opening. The wrong numbers are only wrong. The seventies come in, one gas line at a time.

      Sometimes, late, on the Pacific Coast Highway, you hear an ice-cream truck a long way off, playing a tune you almost know. It never comes any closer.
    extra:
      - requires: {note: HOME}
        text: Leonard Voss wakes up in his own bed on Saturday, forty-six and himself, and never dreams again. Marian says he doesn't seem to mind.
      - requires: {note: TAKEN}
        text: Leonard Voss wakes up on a gurney in a dead hut in the desert, forty-six and himself. You drive him home to Marian.
      - requires: [{no_note: HOME}, {no_note: TAKEN}]
        text: The John Doe on Ward 9 at Camarillo wakes up on Saturday with grey in his hair, and asks for Marian.
      - requires: {note: BIX}
        text: Bix still reads the sets. He says they don't come in threes anymore.
      - requires: {note: STALLED}
        text: Golden Shield never pays Helion a cent.
      - text: It was a good dream. You were there, at the end of it.

  354:
    title: Everyone, Forever
    ending: claimed
    text: |
      You say yes.

      The gold comes into you, and out of you, and you go with it, back across the desert at the speed of a thought. Below you, Los Angeles tips gently over into the dream, like a sleeper rolling over. The freeways are rivers of light. Nobody goes to work on Monday. Nobody minds. Every parking space is open, every wrong number is right, and every song on the radio is the one you wanted.

      It doesn't end. That's the thing about it. That's the whole thing.
    extra:
      - requires: {note: HUT}
        text: In the hut, Marrow's hand falls from the switch. She's smiling, for the first time in years.
      - requires: {note: DISH}
        text: They find your body on the rim of the dish, sitting with its legs dangling, looking west.
      - requires: {note: SALT}
        text: The ice-cream truck is gone in the morning. So are your footprints.
      - requires: {note: TAKEN}
        text: On the gurney, Leonard Voss stops breathing, and goes on being everywhere.
      - requires: {no_note: TAKEN}
        text: Somewhere in it, Leonard is waiting, and Marian finds him.
      - text: You are a coincidence. You always were. Now you're all of them, at once, forever.

  355:
    title: Helion's Dream
    ending: lost
    text: |
      At 4:56 Dr. Edith Marrow speaks into the Ear, kindly and clearly, and the dream hears her first.

      It becomes what it hears. All over Los Angeles, people wake from a nap they don't remember taking, and feel calm. The campuses are quiet that spring. The evening news is believed. Sales of a new orange soda are remarkable.

      You go home on Saturday. You feel fine. You feel fine every day after that.
    extra:
      - requires: {note: CAPTIVE}
        text: Calloway uncuffs you afterwards, and drives you to the bus himself. He seems to think you had a nice day out.
      - requires: {note: TAKEN}
        text: Leonard Voss never leaves the gurney. Helion keeps him, asleep and twenty-five, as a component.
      - requires: {note: HOME}
        text: In Altadena, Leonard sleeps on, and smiles, and Marian stops expecting him to wake.
      - requires: [{no_note: TAKEN}, {no_note: HOME}]
        text: The John Doe at Camarillo stops singing on Friday at 4:56, and lies very still.
      - requires: {any: [{note: BURNED}, {note: FREED}, {note: DECOY}, {note: UNPLUGGED}]}
        text: |
          It didn't take everywhere. Marrow was short of listeners, or her settings were wrong. Here and there, in Venice and Topanga and Echo Park, a few people still dream in colour.
      - text: You don't hum anymore. You can't remember what you used to hum. You buy the orange soda by the case.

  356:
    title: Monday
    text: |
      Monday, 23 March 1970. The press room of the Biltmore Hotel, which you have hired with your own money.

      Eleven reporters have come. Two are from real papers. One is asleep. There's a pitcher of water, a microphone that whistles, and a table for what you've brought.
    extra:
      - requires: {note: LEFT}
        text: Out on Pershing Square, people are walking very calmly to work. Everybody is drinking the same orange soda.
      - requires: [{no_note: LEFT}, {note: SANG}]
        text: Everybody in the room seems in a pleasant mood. You know why. They don't.
      - requires: {note: BROKE}
        text: The city feels a little less lucky this morning. Your taxi got three red lights in a row.
      - requires: [{note: TAKEN}, {note: LEFT}]
        text: Helion still has Leonard. You brought his photograph.
      - text: You clear your throat.
    choices:
      - text: "Tell them everything, and show them what you've got."
        to: 357
      - text: "Look at their faces, and walk out before you start."
        to: 358

  357:
    title: Nobody Believes You
    ending: lost
    text: |
      You tell them everything: the wrong numbers, the pink truck, the dish on the salt, the hinge at 4:56.

      They take notes, at first. Then they stop taking notes. The man from the *Times* asks, kindly, if you've been getting enough sleep.
    extra:
      - requires: {note: LEFT}
        text: They don't laugh. They just look at you with calm, untroubled eyes, the way you'd look at a dog barking at the wind.
      - requires: {note: PROOF}
        text: You hand round your photographs. Every print shows a sunset, very nicely exposed.
      - requires: {any: [{note: SIGNED}, {item: claim-file}]}
        text: The rider gets one question, from the man from the *Times*. Helion's lawyers answer it by Wednesday.
      - requires: {item: tape}
        text: You play them the Sweetwater reel. It's hiss, nine minutes of hiss. Somebody hums along anyway, without noticing.
      - requires: {item: notebook}
        text: Leonard's notebook, passed around, reads like a sales pitch for an antenna.
      - requires: {note: STORY}
        text: The *Mirage* ran it. Forty letters come in, all from people who had the same dream and don't believe a word of it.
      - requires: {note: RUIZ}
        text: At the back of the room, Ruiz is the only one not smiling. He waits until it's over and drives you home.
      - text: |
          The story runs on page 31, under a lost dog in Torrance. The city goes on dreaming, or not, without asking anybody's permission.

  358:
    title: Walked Out
    ending: bittersweet
    text: |
      You look at the eleven of them, at their notebooks and their friendly, bored faces, and you understand that there's no version of this they'll believe.

      You put your things back in your bag. You walk out past the water pitcher, and out of the Biltmore into the sun.
    extra:
      - requires: {note: SANG}
        text: The city is kind this week. You've decided that's enough. It doesn't have to know who sang.
      - requires: {note: BROKE}
        text: The city is a little less lucky, and nobody knows why but you. You'll carry that. Somebody has to.
      - requires: {note: LEFT}
        text: The city is calm, and grey, and believes the evening news. Somewhere under it, you think, the old dream is still breathing. You mean to find out where.
      - text: On the corner, a pay phone is ringing. You stand and look at it for a long time.

  359:
    title: You Shot at a Dream
    ending: scolded
    text: |
      You point your revolver at the most beautiful thing that ever happened to Los Angeles, and you pull the trigger.

      The shot goes up into the gold, and the gold stops, and turns, and looks at you. Then it shoots back.

      It doesn't use a bullet. It uses luck. All of it, all at once, every coincidence you were ever owed, cancelled. You'll never find a parking space again. Every phone call is a wrong number. Every bus has just left.

      You shot at a dream, detective. What did you think it would do?
    extra:
      - requires: {note: DISH}
        text: The recoil takes you off the rim. You live, which is the worst of it.
      - requires: {note: SALT}
        text: The Ice-Cream Man shakes his head, gets into his truck, and drives away without you.
      - text: Marrow's broadcast goes out at 4:57. By then you aren't anyone it needs to bother with.

  360:
    title: Last Call
    ending: death
    text: |
      The light goes the colour of an orange, and then the colour of nothing.

      It doesn't hurt as much as you'd think. There's a tune, very far off, and a feeling that someone has been expecting you, a long time, and is not disappointed.
    extra:
      - text: |
          In the newspapers it gets two inches. Detective found dead. No suspects. Somewhere a pay phone rings and rings, and nobody answers it.

  361:
    title: Forever, Experientially
    ending: madness
    text: |
      You let go.

      It isn't falling. It's arriving. The colours come in, then the sounds, then everybody: every best night anyone in Los Angeles ever had, and they're all yours now, and you're all of theirs. You stop being a detective. You stop being a person who has to find things. Everything is found.

      You embrace it, the whole dream-made world, from the inside, and you live there, experientially, forever.
    extra:
      - text: |
          They find your body somewhere quiet, sitting very still, smiling as if at a song. Nobody can make you hear them. You don't need them to. You're busy. You're everywhere.
