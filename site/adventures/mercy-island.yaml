# Fog Over Mercy Island: a solo gamebook for the engine in site/app.js. Full format: docs/adventure-format.md.
#
# How the file works
#   sections      numbered passages. Each has text, optional effects, optional extra paragraphs, and choices.
#   choices       `to: N` turns to section N. `roll:` rolls d100 against a skill instead:
#                   roll: {skill: Climb, difficulty: hard, success: N, failure: M, fumble: K, bonus: 1}
#                 `skill` may be a list; the investigator rolls their best one. difficulty: regular | hard | extreme.
#   effects       applied when a section is entered, or when a choice is taken:
#                   san: "1/1D4"  a Sanity roll: lose 1 on a pass, 1D4 on a fail.  san: "-2" or "+1D3": a straight change.
#                   hp, luck      straight changes, e.g. hp: "-1D6".
#                   gain / lose   an item id.   note / unnote   a journal word.
#                   companion: wren | mae | lund | all, with san: ... or status: with | broken | lost | dead.
#   requires      a choice (or an extra paragraph) only shows when this holds. A list means all of them.
#   extra         paragraphs shown after the text when their `requires` holds (`before: true` puts one ahead of the text).
#                   item, no_item, note, no_note, with (companion present and sane), broken, gone, skill + min, any: [...]
#   ending        marks an ending section: triumph | escape | bittersweet | choir | lost | madness | death |
#                 drowned | dreamer (any word works; see site/app.js for the labels).
id: mercy-island
title: Fog Over Mercy Island
series: A solo investigation, 1926
subtitle: A naturalist expedition, an uncharted island, and the hymn they sing beneath the ice.
blurb: |
  July 1926. The schooner *Kittiwake* feels her way through the fog of the western Aleutians, carrying a naturalist expedition toward an island no chart admits to. Professor Hollis Wren owns a journal from 1881 that swears the island is real. It says people live there, and that at night they sing to the glacier.

  You are going ashore. Your companions are trusting you to bring them home. Something under the ice is trusting the singers to keep it dreaming.
investigator_intro: Six people signed on with Professor Wren. Each of them knows something the island will test. Choose the one whose skills you will stake your life on.
# Shape this story is held to by `gamebook stats` and the test suite.
targets:
  sections: [150, 175]
  path_mean: [20, 30]
  companion_break: [0.1, 0.5]
  endings_reached: 15
  cosmetic_choices: 0.1
start: 1
on_death: 129
on_madness: 130

bouts:
  - "You laugh, high and helpless, until your ribs ache."
  - "For a long moment you cannot remember your own name."
  - "You are certain the fog is breathing, and you match your breath to it."
  - "Your hands shake so badly you cannot hold anything."
  - "The hymn plays in your head and will not stop."
  - "You weep, and you do not know why."

