<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Call of Cthulhu Solo</title>
  <!-- A Choir torch at night: sea-teal tile, ink border, brass flame with the glacier's cold light behind it,
       and a blue-green root to the flame that no honest fire has. Palette from style.css.
       PNG copies (favicon-32.png, apple-touch-icon.png) are rendered from this file. -->
  <defs>
    <radialGradient id="glow" cx="32" cy="24" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd0c8" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#008190" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b4f52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="3" fill="#0f2526" stroke="#1c1b1b" stroke-width="3.5"/>
  <rect x="4" y="4" width="56" height="56" rx="1" fill="url(#glow)"/>
  <!-- handle, with an ink hard shadow -->
  <path d="M29.5 40 L39 40 L36.2 60 L32.3 60 Z" fill="#1c1b1b"/>
  <path d="M27 38 L37 38 L34.2 58 L29.8 58 Z" fill="#b8892b" stroke="#1c1b1b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- the head, wrapped in pitch-soaked rags -->
  <path d="M21.5 31 H42.5 L39.5 40 H24.5 Z" fill="#7d1d22" stroke="#1c1b1b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M23.4 35.5 H40.6" stroke="#1c1b1b" stroke-width="2"/>
  <!-- the flame -->
  <path d="M33 7 C36 13 45.5 16.5 45 25 C44.6 29.5 40.5 32.5 32 32.5 C23.5 32.5 19.4 29.5 19 25 C18.5 19 23.5 17 25.5 12 C27 15 28.5 16.5 29.8 17.5 C29.5 13.5 30.8 10 33 7 Z"
        fill="#e3a53b" stroke="#1c1b1b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32.5 16.5 C35.5 21 39.5 23.5 39 27.5 C38.6 30.2 36.2 31.2 32 31.2 C27.8 31.2 25.4 30.2 25 27.5 C24.6 24 29.5 21.5 32.5 16.5 Z"
        fill="#f3ead3"/>
  <path d="M26 30.4 C27.5 27.2 30 25.6 32 23.4 C34 25.6 36.5 27.2 38 30.4 C35 31.4 29 31.4 26 30.4 Z" fill="#008190"/>
</svg>
