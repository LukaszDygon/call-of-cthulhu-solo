[project]
name = "call-of-cthulhu-solo"
version = "0.1.0"
description = "Solo gamebooks in the style of Call of Cthulhu: a static YAML-driven player, and tools to check and simulate adventures."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gamebook = "gamebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamebook"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long literal strings stay as written

[tool.ruff.lint.isort]
known-first-party = ["gamebook"]
